# Supabase project config — used by the Supabase CLI (`supabase link`, `supabase functions deploy`).
project_id = "izlqhnxowdhtdofkwrho"

# The Stripe webhook MUST accept unauthenticated calls: Stripe cannot send a Supabase
# JWT, only its own `stripe-signature` header. With verify_jwt = false the gateway lets
# Stripe through, and the function verifies the Stripe signature itself (still secure).
[functions.stripe-webhook]
verify_jwt = false

# stripe-checkout creates the Checkout Session for a signed-in user, so it SHOULD keep
# JWT verification on (only your own logged-in users call it). Left at the default (true).
# [functions.stripe-checkout]
# verify_jwt = true

# rebuild-projections triggers the GitHub Actions projection rebuild. Only the signed-in
# OWNER should reach it, so JWT verification stays ON (the default) and the function also
# checks the caller's email is the owner before dispatching. Left at the default (true).
# [functions.rebuild-projections]
# verify_jwt = true
