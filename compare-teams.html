<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="tdc-theme.js?v=2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compare Teams — The Depth Chart</title>
  <!-- The standalone team-comparison tool was merged into the richer Compare page
       (compare-players.html) Teams tab. Forward here, preserving any t1/t2 picks. -->
  <script>
    (function(){
      var q = new URLSearchParams(location.search);
      var out = new URLSearchParams();
      out.set('mode','teams');
      if(q.get('t1')) out.set('t1', q.get('t1'));
      if(q.get('t2')) out.set('t2', q.get('t2'));
      location.replace('compare-players.html?' + out.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=compare-players.html?mode=teams"/>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;color:#666;padding:40px;">
    Redirecting to <a href="compare-players.html?mode=teams">Compare</a>…
  </p>
</body>
</html>
