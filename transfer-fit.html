  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--amber:#c9962b;--red:#cc3322;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#3ec26e;--amber:#e0b24e;--red:#e0685a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .page{max-width:820px;margin:0 auto;padding:30px 22px 90px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4.5vw,38px);font-weight:800;letter-spacing:-.01em;margin-bottom:14px;}
    .search{position:relative;max-width:440px;margin-bottom:24px;}
    .picker{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
    .pk-cell{flex:1;min-width:238px;}
    .pk-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;padding-left:2px;}
    .pk-body{position:relative;}
    .pk-input{position:relative;}
    .pk-input input{width:100%;padding:13px 16px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .12s,box-shadow .12s;}
    .pk-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
    .pk-arrow{font-size:20px;color:var(--accent);font-weight:800;padding-bottom:12px;flex:none;}
    .pk-chip{display:flex;align-items:center;gap:11px;padding:0 10px 0 12px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);height:49px;}
    .pk-chip.on{border-color:color-mix(in srgb,var(--accent) 55%,var(--border2));}
    .pk-logo{width:30px;height:30px;object-fit:contain;flex:none;}
    .pk-av{width:30px;height:30px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:12px;color:var(--text2);flex:none;}
    .pk-txt{min-width:0;flex:1;}
    .pk-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pk-sub{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pk-x{flex:none;width:26px;height:26px;border-radius:50%;border:none;background:var(--bg3);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;transition:background .12s,color .12s;}
    .pk-x:hover{background:var(--red);color:#fff;}
    .pk-hint{font-size:12px;color:var(--text3);margin-bottom:24px;padding-left:2px;}
    .whatif{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:20px;padding:3px 11px;margin-right:6px;vertical-align:middle;}
    .search input{width:100%;padding:12px 16px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:14px;outline:none;}
    .search input:focus{border-color:var(--accent);}
    .drop{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-top:5px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18);display:none;}
    .drop.on{display:block;}
    .drop-item{padding:9px 12px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .drop-item:hover{background:var(--bg3);}
    .drop-item .t{color:var(--text3);font-size:12px;white-space:nowrap;flex:none;}
    .di-l{display:flex;align-items:center;gap:8px;min-width:0;}
    .di-logo{width:20px;height:20px;object-fit:contain;flex:none;}
    .di-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .loading,.empty{padding:56px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.7;}
    /* hero */
    .rhero{display:flex;align-items:center;gap:16px;border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:18px 20px;margin-bottom:16px;}
    .mono{flex:none;width:56px;height:56px;border-radius:13px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text2);}
    .rh-main{min-width:0;flex:1;}
    .rh-name{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;letter-spacing:-.01em;}
    .rh-meta{font-size:12.5px;color:var(--text3);margin-top:2px;}
    .rh-move{font-size:13px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .rh-from{color:var(--text3);}
    .rh-arrow{color:var(--accent);}
    .rh-to{color:var(--text);}
    .rh-grade{flex:none;text-align:center;}
    .rh-grade .v{font-family:'Playfair Display',serif;font-weight:900;font-size:30px;line-height:1;}
    .rh-grade .l{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:3px;}
    /* verdict */
    .verdict{border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:16px;border-top:4px solid var(--vc,var(--accent));background:var(--bg2);}
    .vd-top{display:flex;align-items:center;gap:14px;}
    .vd-score{font-family:'Playfair Display',serif;font-weight:900;font-size:42px;line-height:1;color:var(--vc,var(--accent));}
    .vd-score small{font-size:16px;color:var(--text3);font-weight:700;}
    .vd-label{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;}
    .vd-why{font-size:14px;color:var(--text2);line-height:1.55;margin-top:11px;}
    /* meters */
    .sec{border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:18px 20px;margin-bottom:16px;}
    .sec-h{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
    .sec-h .tag{font-family:'Inter';font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
    .meter .ml{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;}
    .meter .ml b{font-family:'Playfair Display',serif;font-size:14px;}
    .bar{height:7px;border-radius:6px;background:var(--bg3);overflow:hidden;}
    .bar>span{display:block;height:100%;border-radius:6px;}
    .reasons{list-style:none;margin-top:4px;}
    .reasons li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--text2);line-height:1.5;padding:6px 0;border-top:1px solid var(--border);}
    .reasons li:first-child{border-top:none;}
    .rdelta{flex:none;font-family:'Playfair Display',serif;font-weight:800;font-size:13px;width:34px;}
    .rdelta.pos{color:var(--green);} .rdelta.neg{color:var(--red);}
    .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:4px;}
    .kv .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .kv .v{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;}
    .proj-line{font-size:14px;color:var(--text2);line-height:1.6;}
    .proj-line b{color:var(--text);}
    .arrow{color:var(--accent);font-weight:800;margin:0 8px;}
    .leap-row{display:flex;gap:20px;flex-wrap:wrap;}
    .leap-stat{flex:1;min-width:130px;}
    .leap-stat .n{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:var(--accent);}
    .leap-stat .d{font-size:12px;color:var(--text2);line-height:1.45;margin-top:5px;}
    .foot{font-size:12px;color:var(--text3);text-align:center;margin-top:20px;line-height:1.6;}
    .foot a{color:var(--accent);font-weight:700;}
    .sharebtn{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:700;
      color:#141416;background:var(--accent);border:none;border-radius:22px;padding:8px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s;}
    .sharebtn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.22);}
    .share-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);
      font-size:13px;font-weight:600;padding:10px 18px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;opacity:0;transition:opacity .2s;}
    .share-toast.on{opacity:1;}
    /* rotation impact */
    .rot-status{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;}
    .rot-badge{font-family:'Playfair Display',serif;font-weight:800;font-size:15px;padding:7px 15px;border-radius:10px;flex:none;}
    .rot-badge.starter{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green);}
    .rot-badge.rotation{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber);}
    .rot-badge.depth{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);}
    .rot-line{font-size:13.5px;color:var(--text2);line-height:1.55;padding-top:2px;}
    .rot-line b{color:var(--text);}
    .depth-h{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:14px 0 8px;}
    .drow{display:flex;align-items:center;gap:11px;padding:5px 0;}
    .drow .dname{font-size:13px;font-weight:600;width:160px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);}
    .drow.me .dname{font-weight:800;color:var(--accent);}
    .drow .dbar{flex:1;height:8px;border-radius:5px;background:var(--bg3);overflow:hidden;}
    .drow .dbar>span{display:block;height:100%;border-radius:5px;background:var(--border2);}
    .drow.me .dbar>span{background:var(--accent);}
    .drow .dg{font-family:'Playfair Display',serif;font-weight:800;font-size:13px;width:28px;text-align:right;flex:none;color:var(--text2);}
    .drow.me .dg{color:var(--accent);}
    .dtag{font-size:8.5px;font-weight:800;letter-spacing:.05em;background:var(--accent);color:#141416;border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle;}
    /* team impact */
    .ti{display:flex;align-items:center;gap:16px;margin-bottom:11px;flex-wrap:wrap;}
    .ti-ba{text-align:center;}
    .ti-n{font-family:'Playfair Display',serif;font-weight:900;font-size:33px;line-height:1;}
    .ti-l{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    .ti-arrow{font-size:20px;color:var(--text3);}
    .ti-delta{font-family:'Playfair Display',serif;font-weight:900;font-size:22px;padding:5px 13px;border-radius:10px;}
    .ti-delta.pos{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent);}
    .ti-delta.flat{color:var(--text3);background:var(--bg3);}
    .ti-say{font-size:13.5px;color:var(--text2);line-height:1.55;}
    .styl-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
    .styl-chip{font-size:11.5px;font-weight:600;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:4px 11px;color:var(--text2);}
    .styl-chip.dup{border-color:var(--accent);color:var(--accent);}
    .rot-empty{font-size:13px;color:var(--text3);padding:6px 0;line-height:1.5;}
    /* destination team-color theming (--tc solid / --tcr readable text) */
    #report .rhero{border-left:4px solid var(--tc,var(--accent));}
    #report .rh-grade .v{color:var(--tcr,var(--text));}
    #report .rh-arrow,#report .arrow{color:var(--tcr,var(--accent));}
    #report .verdict{border-top-color:var(--tc,var(--accent));}
    #report .vd-score{color:var(--tcr,var(--accent));}
    #report .drow.me .dbar>span{background:var(--tc,var(--accent));}
    #report .drow.me .dname,#report .drow.me .dg{color:var(--tcr,var(--accent));}
    #report .dtag{background:transparent;border:1px solid var(--tcr,var(--accent));color:var(--tcr,var(--accent));}
    #report .styl-chip.dup{border-color:var(--tc,var(--accent));color:var(--tcr,var(--accent));}
    /* player stat tiles */
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:9px;}
    .stile{background:var(--bg3);border-radius:12px;padding:11px 6px;text-align:center;}
    .stile .sv{font-family:'Playfair Display',serif;font-weight:800;font-size:21px;line-height:1;color:var(--text);}
    .stile.hi .sv{color:var(--tcr,var(--accent));}
    .stile .sl{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    .split-row{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--text3);align-items:baseline;}
    .split-row b{font-family:'Playfair Display',serif;font-weight:800;font-size:14px;color:var(--text);margin-left:3px;}
    .proj2{margin-top:12px;font-size:13.5px;color:var(--text2);line-height:1.6;padding-top:11px;border-top:1px solid var(--border);}
    .proj2 b{color:var(--text);}
    /* team profile tiles */
    .tprofile{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px;}
    .tp-tile{border:1px solid var(--border);border-radius:12px;padding:11px 12px;}
    .tp-tile .tv{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;line-height:1;color:var(--text);}
    .tp-tile .tl{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    .tp-tile.net{border-color:var(--tc,var(--accent));}
    .tp-tile.net .tv{color:var(--tcr,var(--accent));}
    /* sub-labels + owned-metric tiles + net line */
    .sub-lbl{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:16px 0 9px;}
    .sec .sub-lbl:first-child{margin-top:0;}
    .sub-lbl.tcl{color:var(--tcr,var(--accent));}
    .sub-lbl.tdc{display:flex;align-items:center;gap:8px;}
    .tdc-badge{font-size:8px;font-weight:800;letter-spacing:.04em;background:transparent;border:1px solid var(--tcr,var(--accent));color:var(--tcr,var(--accent));border-radius:5px;padding:2px 6px;}
    .omgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:9px;}
    .ometric{background:var(--bg3);border-radius:12px;padding:10px 6px;text-align:center;cursor:help;}
    .ometric .ov{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;line-height:1;color:var(--text);}
    .ometric .ol{font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    #report .tcv{color:var(--tcr,var(--accent));}
    .ti-net{font-size:13px;color:var(--text2);margin:2px 0 11px;display:flex;align-items:center;flex-wrap:wrap;}
    .ti-net b{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;color:var(--text);margin:0 4px;}
    .est{font-size:9.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:7px;}
  </style>

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const PSEL='id,name,team,position,class_year,height,tdc_grade,ppg,rpg,apg,mpg,gp,fg_pct,tp_pct,three_pct,ft_pct,tpa,fga,blk,bpg,stl,spg,usage_pct,espn_id,is_addition,hometown';
const esc=s=>(''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round((parseFloat(x)||0)*10)/10;
const initials=n=>(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const barCol=v=>v>=72?'var(--green)':v>=52?'var(--amber)':'var(--red)';
let TEAMS=[],PROFS={},TC={},_DNA={},CURRENT=null,SELP=null,SELDEST=null;
// destination team-color helpers → make c1 readable on the current theme
function _hexRgb(h){h=(''+h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function _lum(c){return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;}
function _mix(c,t,f){return [Math.round(c[0]+(t[0]-c[0])*f),Math.round(c[1]+(t[1]-c[1])*f),Math.round(c[2]+(t[2]-c[2])*f)];}
function readableTC(hex,isDark){ let c=_hexRgb(hex),i=0;
  if(isDark){ while(_lum(c)<0.5&&i<7){c=_mix(c,[255,255,255],0.16);i++;} }
  else { while(_lum(c)>0.62&&i<7){c=_mix(c,[0,0,0],0.16);i++;} }
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
function isDarkTheme(){ const a=document.documentElement.getAttribute('data-theme')||''; if(a.includes('dark'))return true; if(a.includes('light'))return false; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches; }

function toast(msg){ let t=document.querySelector('.share-toast'); if(!t){t=document.createElement('div');t.className='share-toast';document.body.appendChild(t);} t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1900); }

  const g=TDCProjGrade.gradeSolo({id:p.id,espn_id:p.espn_id,tdc_grade:p.tdc_grade,yr:p.class_year||p.yr});
  if(g!=null&&!isNaN(g)) p.tdc_grade=''+g; p._projected=true; } return p; }

async function loadPlayer(espn,name){
  const q=espn?`espn_id=eq.${espn}`:`name=eq.${encodeURIComponent(name)}`;
  let rows=await fetch(`${SB}/rest/v1/players?${q}&select=${PSEL}&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);

// ---- roster-level fit analysis (destination's real roster) ----
let SHOWSEQ=0;
function normPos(x){ x=(''+(x||'')).toUpperCase().trim();
  if(['PG','SG','SF','PF','C'].includes(x))return x;
  if(x==='G')return 'SG'; if(x==='F')return 'PF'; if(x==='GF'||x==='SG/SF')return 'SF';
  if(x==='FC'||x==='CF')return 'C'; if(x==='PG/SG')return 'PG'; return x||'SF'; }
function projOf(p){ const g=(window.TDCProjGrade&&TDCProjGrade.gradeSolo)?TDCProjGrade.gradeSolo({espn_id:p.espn_id,tdc_grade:p.tdc_grade,yr:p.class_year||p.yr}):null;
  return (g!=null&&!isNaN(g))?Math.round(g):(Math.round(parseFloat(p.tdc_grade))||70); }
function archOf(espn,name){ return ((window.TDC_ARCH&&TDC_ARCH.of(espn,name))||{}).name||null; }
async function destRoster(teamName){
  const rows=await fetch(`${SB}/rest/v1/players?team=eq.${encodeURIComponent(teamName)}&select=name,position,class_year,tdc_grade,mpg,espn_id&order=tdc_grade.desc.nullslast`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
  return rows.map(p=>({name:p.name,pos:normPos(p.position),espn_id:''+(p.espn_id||''),mpg:p.mpg,grade:projOf(p),arch:archOf(p.espn_id,p.name)}));
}
function analyzeFit(p, roster, prof){
  const myPos=TDCPortalFit.pos(p), myGrade=Math.round(parseFloat(p.tdc_grade)||0), myEspn=''+(p.espn_id||'');
  const rotSize=Math.round((prof&&prof.rotation_size)||9);
  const pool=roster.filter(r=>r.espn_id!==myEspn);          // roster WITHOUT him (self-fit safe)
  const POSN=['PG','SG','SF','PF','C'];
  const bestAt=pos=>{ const c=pool.filter(r=>r.pos===pos); return c.length?Math.max.apply(null,c.map(r=>r.grade)):null; };
  const avg=a=>{ const v=a.filter(x=>x!=null); return v.length?v.reduce((s,x)=>s+x,0)/v.length:0; };
  const before=avg(POSN.map(bestAt));
  const after=avg(POSN.map(pp=> pp===myPos?Math.max(myGrade,bestAt(pp)||0):bestAt(pp)));
  const samePos=pool.filter(r=>r.pos===myPos).sort((a,b)=>b.grade-a.grade);
  const ahead=samePos.filter(r=>r.grade>=myGrade);
  const prevStarter=samePos[0]||null;
  const starts=!prevStarter||myGrade>prevStarter.grade;
  const all=pool.concat([{name:p.name,grade:myGrade,me:true}]).sort((a,b)=>b.grade-a.grade);
  const myRank=all.findIndex(r=>r.me)+1;
  const tier=starts?'starter':(ahead.length<=1&&myRank<=rotSize)?'rotation':'depth';
  let push=null;
  if(starts&&prevStarter) push={txt:`bumps ${prevStarter.name} (${prevStarter.grade}) to a reserve role`};
  else if(tier==='rotation'){ const sorted=pool.slice().sort((a,b)=>b.grade-a.grade); const bumped=sorted[rotSize-1];
    if(bumped&&myGrade>bumped.grade) push={txt:`pushes ${bumped.name} (${bumped.grade}) out of the ${rotSize}-man rotation`}; }
  const depthList=samePos.map(r=>({name:r.name,grade:r.grade,me:false})).concat([{name:p.name,grade:myGrade,me:true}]).sort((a,b)=>b.grade-a.grade);
  return {myPos,myGrade,myRank,rotSize,total:all.length,samePos,ahead,prevStarter,starts,tier,push,depthList,
    before:Math.round(before*10)/10,after:Math.round(after*10)/10,delta:Math.round((after-before)*10)/10};
}
const _bw=g=>Math.max(8,Math.min(100,Math.round((g-50)/42*100)));
function renderRotation(a,dest,sameTeam){
  const rows=a.depthList.map(d=>`<div class="drow ${d.me?'me':''}"><span class="dname">${esc(d.name)}${d.me?'<span class="dtag">HIM</span>':''}</span><span class="dbar"><span style="width:${_bw(d.grade)}%"></span></span><span class="dg">${d.grade}</span></div>`).join('');
  let line;
  if(a.tier==='starter') line=a.prevStarter?`Projects as ${esc(dest.team)}’s starting ${a.myPos} — his ${a.myGrade} OVR tops their best there now (${esc(a.prevStarter.name)}, ${a.prevStarter.grade}).`:`Projects as the ${esc(dest.team)} starting ${a.myPos} — no established ${a.myPos} ahead of him.`;
  else if(a.tier==='rotation') line=`Cracks the rotation at ${a.myPos} — ${a.prevStarter?`behind ${esc(a.prevStarter.name)} (${a.prevStarter.grade})`:'in the mix'}, but a clear rotation piece (#${a.myRank} on the roster by projected OVR).`;
  else line=`A crowded ${a.myPos} room — ${a.ahead.length} project ahead of him (${a.ahead.slice(0,2).map(x=>esc(x.name)).join(', ')}${a.ahead.length>2?'…':''}). Lands as depth, not rotation.`;
  const badge=a.tier==='starter'?'Starter':a.tier==='rotation'?'Rotation':'Depth';
  return `<div class="rot-status"><span class="rot-badge ${a.tier}">${badge}</span><div class="rot-line">${line}${a.push?` <b>He ${a.push.txt}.</b>`:''}</div></div>
    <div class="depth-h">Projected ${a.myPos} depth · ${esc(dest.team)}</div>${rows}`;
}
function renderTeamImpact(a,dest,sameTeam){
  const cls=a.delta>=0.35?'pos':'flat';
  const say=a.delta>=1.5?`A clear upgrade — he lifts ${esc(dest.team)}’s starting five.`
    :a.delta>=0.35?`A modest bump to the starting five.`
    :a.starts?`He starts, but the spot was already strong — marginal net change.`
    :`Doesn’t move the starting five, but adds ${a.myPos} depth and insurance.`;
  // estimated swing in the destination's projected net rating (~1.4 net per pt of starting-5 OVR)
  const dna=_DNA[dest.full]||_DNA[dest.team]||null;
  let netLine='';
  if(dna&&dna.net!=null){
    const sgn=v=>(v>=0?'+':'')+(Math.round(v*10)/10);
    const swing=Math.round(a.delta*1.4*10)/10;
    const without=sameTeam?Math.round((dna.net-swing)*10)/10:dna.net;
    const withHim=sameTeam?dna.net:Math.round((dna.net+swing)*10)/10;
    netLine=`<div class="ti-net">Projected net rating <b>${sgn(without)}</b><span class="arrow">→</span><b class="tcv">${sgn(withHim)}</b> <span class="est">est.</span></div>`;
  }
  return `<div class="ti">
    <div class="ti-ba"><div class="ti-n">${a.before}</div><div class="ti-l">Starting 5 OVR ${sameTeam?'without him':'now'}</div></div>
    <div class="ti-arrow">→</div>
    <div class="ti-ba"><div class="ti-n tcv">${a.after}</div><div class="ti-l">With him</div></div>
    <div class="ti-delta ${cls}">${a.delta>=0?'+':''}${a.delta}</div>
  </div>${netLine}<div class="ti-say">${say}</div>`;
}
function renderOwnedMetrics(p, adv, gen){
  const g1=x=>{const n=parseFloat(x);return isFinite(n)?(Math.round(n*10)/10):null;};
  const tile=(v,l,desc)=>`<div class="ometric" title="${(desc||'').replace(/"/g,'&quot;')}"><div class="ov">${v}</div><div class="ol">${l}</div></div>`;
  const t=[];
  if(adv&&adv.ti40!=null){
    t.push(tile(g1(adv.ti40),'TI/40','Total Impact per 40 — our all-in-one per-minute value metric.'));
    const mins=(parseFloat(p.mpg)||0)*(parseFloat(p.gp)||0);
    if(mins>0){ const wa=Math.round(((adv.ti40-5)*mins/40/69.87)*10)/10; t.push(tile((wa>=0?'+':'')+wa,'Wins Added','Wins Added — his value over replacement on a team-wins scale (owned).')); }
  }
  if(adv&&adv.ts_pct!=null) t.push(tile(Math.round(adv.ts_pct*1000)/10+'%','TS%','True Shooting % — efficiency across 2s, 3s and free throws.'));
  if(adv&&adv.usg_pct!=null) t.push(tile(g1(adv.usg_pct)+'%','USG%','Usage — share of possessions he finishes while on the floor.'));
  if(gen&&gen.lq!=null) t.push(tile(g1(gen.lq)+'%','Look Q','Look Quality — the eFG% a league-average shooter would post on his exact shot diet (owned).'));
  if(gen&&gen.smAdj!=null) t.push(tile((gen.smAdj>=0?'+':'')+g1(gen.smAdj),'SM+','Shot-Making — points added over an average shooter from the same spots (owned).'));
  if(gen&&gen.selfPct!=null) t.push(tile(g1(gen.selfPct)+'%','Self-Cr','Self-Created — share of his makes that were unassisted (owned).'));
  if(!t.length) return `<div class="rot-empty">Advanced metrics not tracked for this player.</div>`;
  return `<div class="omgrid">${t.join('')}</div>`;
}
function renderStyle(a,p,dest){
  const myArch=archOf(p.espn_id,p.name);
  if(!myArch) return `<div class="rot-empty">His playing style isn’t classified yet (needs a tracked college season). The fit above leans on position, grade and the coach’s system.</div>`;
  const dup=a.samePos.filter(r=>r.arch===myArch);
  const posStyles=a.samePos.filter(r=>r.arch);
  const call=dup.length?`Overlaps with ${esc(dup[0].name)}’s ${esc(myArch)} — a similar ${a.myPos} look, so it’s more of the same.`
    :`Brings a ${esc(myArch)} look no other classified ${a.myPos} on the roster offers.`;
  const chips=posStyles.length?posStyles.map(r=>`<span class="styl-chip ${r.arch===myArch?'dup':''}">${esc(r.name)} · ${esc(r.arch)}</span>`).join(''):`<span class="rot-empty">Other ${a.myPos} styles aren’t classified yet.</span>`;
  return `<div class="proj-line">His style: <b>${esc(myArch)}</b>. ${call}</div><div class="styl-list">${chips}</div>`;
}

function show(){
  const p=SELP; const host=document.getElementById('report');
  if(!p){ host.innerHTML='<div class="empty">Search a player to begin.</div>'; return; }
  projInto(p);
  const grade=Math.round(parseFloat(p.tdc_grade)||0);
  const style=(window.TDC_ARCH&&TDC_ARCH.of(p.espn_id,p.name))||null;
  // committed portal add → hometown holds the old team; otherwise it's a what-if from his current team
  const committed=p.is_addition&&(p.hometown||'').trim();
  const fromTeam=committed?(p.hometown||'').trim():(p.team||'');
  const destName=SELDEST||(committed?p.team:null);
  const baseUrl=`transfer-fit.html?espn=${p.espn_id||''}&name=${encodeURIComponent(p.name)}`+(SELDEST?`&to=${encodeURIComponent(SELDEST)}`:'');

  if(!destName){
    history.replaceState(null,'',baseUrl);
    host.innerHTML=heroRow(p,fromTeam,null,grade,style)+
      `<div class="empty">Now pick a <b>destination school</b> above to model how <b>${esc(p.name)}</b> would fit — coach, system, roster need, projection and leap potential.</div>`;
    if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(host);
    return;
  }
  const dest=findTeam(destName);
  if(!dest){ host.innerHTML=heroRow(p,fromTeam,destName,grade,style)+`<div class="empty">No fit data for <b>${esc(destName)}</b> yet — it isn’t in the coach/needs dataset.</div>`; if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(host); return; }
  const prof=dest&&dest.coach_slug?PROFS[dest.coach_slug]:null;
  const origin=fromTeam;
  const s=TDCPortalFit.scoreTeam(p,dest,prof);
  const cf=TDCPortalFit.coachFit(prof,p);
  const ppos=TDCPortalFit.pos(p);

  // verdict
  const V=s.overall>=82?['Ideal Landing Spot','var(--green)']:s.overall>=70?['Strong Fit','var(--green)']
        :s.overall>=58?['Solid Fit','var(--amber)']:s.overall>=45?['Questionable Fit','var(--amber)']:['Tough Spot','var(--red)'];
  CURRENT={name:p.name,origin:origin,team:dest.team,verdict:V[0],score:s.overall,to:SELDEST||''};
  history.replaceState(null,'',baseUrl+`&score=${s.overall}&verdict=${encodeURIComponent(V[0])}`);

  // leap potential — style breakout rate + coach development + projected trajectory
  const brk=style&&window.TDC_ARCH.breakout?TDC_ARCH.breakout(style.name):null;
  const devPctl=prof&&prof.dev_pctl!=null?Math.round(prof.dev_pctl):null;

  const meter=(lbl,v)=>`<div class="meter"><div class="ml"><span>${lbl}</span><b>${Math.round(v)}</b></div><div class="bar"><span style="width:${Math.max(4,Math.round(v))}%;background:${barCol(v)}"></span></div></div>`;
  const reasons=(cf.reasons||[]).map(r=>`<li><span class="rdelta ${r.d>=0?'pos':'neg'}">${r.d>=0?'+':''}${r.d}</span><span>${esc(r.t)}</span></li>`).join('')
    || '<li><span>A neutral stylistic fit with the staff — no strong push or pull.</span></li>';

  // projection now -> destination
  const noStat=(+p.ppg||0)<=0&&(+p.rpg||0)<=0&&(+p.apg||0)<=0;
  const projStr=o=>`${r1(o.ppg)}p · ${r1(o.rpg)}r · ${r1(o.apg)}a`+(o.mpg?` · ${r1(o.mpg)}m`:'');

  // theme the report in the destination team's color
  const tcHex=(TC[(dest.team||'').toLowerCase()]||TC[(destName||'').toLowerCase()]||{}).c1||'';
  const dk=isDarkTheme();
  const tc=tcHex||(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#A8843C');
  const tcr=tcHex?readableTC(tcHex,dk):tc;
  host.style.setProperty('--tc',tcr); host.style.setProperty('--tcr',tcr);  // readable on the active theme

  // player stats
  const g1=x=>{const n=parseFloat(x);return isFinite(n)?(Math.round(n*10)/10):'—';};
  const pctv=x=>{const n=parseFloat(x);return isFinite(n)&&n>0?(Math.round(n*10)/10+'%'):'—';};
  const stile=(v,l,hi)=>`<div class="stile ${hi?'hi':''}"><div class="sv">${v}</div><div class="sl">${l}</div></div>`;
  const fgv=pctv(p.fg_pct), tpv=pctv(p.tp_pct||p.three_pct), ftv=pctv(p.ft_pct), usgv=pctv(p.usage_pct);
  const spg=g1(p.spg!=null?p.spg:p.stl), bpg=g1(p.bpg!=null?p.bpg:p.blk);
  const proj=s.proj||{};
  const playerStats = noStat
    ? `<div class="proj-line">No prior college line yet — his production fills in once he logs minutes.</div>`
    : `<div class="sub-lbl">2025-26${fromTeam?' · '+esc(fromTeam):''}</div>
       <div class="stat-grid">${stile(g1(p.ppg),'PPG')}${stile(g1(p.rpg),'RPG')}${stile(g1(p.apg),'APG')}${stile(spg,'SPG')}${stile(bpg,'BPG')}${stile(g1(p.mpg),'MPG')}</div>
       <div class="split-row"><span>FG<b>${fgv}</b></span><span>3P<b>${tpv}</b></span>${ftv!=='—'?`<span>FT<b>${ftv}</b></span>`:''}${usgv!=='—'?`<span>USG<b>${usgv}</b></span>`:''}</div>
       <div class="sub-lbl tcl">Projected at ${esc(dest.team)}</div>
       <div class="stat-grid">${stile(g1(proj.ppg),'PPG',1)}${stile(g1(proj.rpg),'RPG',1)}${stile(g1(proj.apg),'APG',1)}${stile(g1(proj.mpg),'MPG',1)}</div>
       <div class="sub-lbl tdc">Our metrics <span class="tdc-badge">TDC original</span></div>
       <div id="ourMetrics"><div class="rot-empty">Loading advanced metrics…</div></div>`;

  // team stats (destination profile)
  const dna=_DNA[dest.full]||_DNA[dest.team]||null;
  const tempoWord=prof&&prof.pctl&&prof.pctl.poss_pg!=null?(prof.pctl.poss_pg>=60?'Fast':prof.pctl.poss_pg>=40?'Balanced':'Grind-it-out'):'—';
  const offWord=prof&&prof.pctl&&prof.pctl.top_scorer_share!=null?(prof.pctl.top_scorer_share>=58?'Star-centric':prof.pctl.top_scorer_share<=42?'Share ball':'Balanced'):(dest.archetype||'—');
  const tpTile=(v,l,net)=>`<div class="tp-tile ${net?'net':''}"><div class="tv">${v}</div><div class="tl">${l}</div></div>`;
  const teamStats = `<div class="tprofile">
      ${tpTile('#'+(dest.rank||'—'),'Nat’l rank')}${tpTile(dest.rating!=null?g1(dest.rating):'—','Power rating')}${dna?tpTile(g1(dna.ORtg),'Off Rtg'):''}${dna?tpTile(g1(dna.DRtg),'Def Rtg'):''}${dna?tpTile((dna.net>=0?'+':'')+g1(dna.net),'Net Rtg',1):''}${tpTile(tempoWord,'Tempo')}
    </div>
    <div class="split-row"><span>Conf<b>${esc(dest.conf||'—')}</b></span>${dest.allPlay!=null?`<span>All-play<b>${Math.round(dest.allPlay)}%</b></span>`:''}<span>Offense<b>${esc(offWord)}</b></span></div>`;

  host.innerHTML=`
  ${heroRow(p,origin,dest.full||dest.team,grade,style)}
  ${SELDEST?'<div style="margin:-8px 0 14px;font-size:12.5px;color:var(--text3)"><span class="whatif">What-if</span> hypothetical fit — he hasn’t committed here.</div>':''}

  <div class="verdict" data-anim>
    <div class="vd-top"><div class="vd-score">${s.overall}<small>/100</small></div><div class="vd-label">${V[0]}</div></div>
    <div class="vd-why">${esc(s.why||'')} <b>Projected role: ${esc(s.role)}.</b></div>
    <button class="sharebtn" onclick="shareReport()">↗ Share report</button>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Player stats <span class="tag">his production</span></div>
    ${playerStats}
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Rotation impact <span class="tag">does he make it?</span></div>
    <div id="rotaImpact"><div class="rot-empty">Reading ${esc(dest.team)}’s roster…</div></div>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Team impact <span class="tag">better or worse?</span></div>
    <div id="teamImpact"><div class="rot-empty">…</div></div>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">${esc(dest.team)} team stats <span class="tag">where he’s landing</span></div>
    ${teamStats}
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Style fit <span class="tag">archetype match</span></div>
    <div id="styleFit"><div class="rot-empty">…</div></div>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Coach &amp; system fit</div>
    <div class="kv">
      <div><div class="k">Coach</div><div class="v">${esc(dest.coach||prof&&prof.coach||'—')}</div></div>
      <div><div class="k">System</div><div class="v">${esc(dest.archetype||prof&&prof.archetype||'—')}</div></div>
      ${prof&&prof.pctl&&prof.pctl.poss_pg!=null?`<div><div class="k">Tempo</div><div class="v">${prof.pctl.poss_pg>=60?'Fast':prof.pctl.poss_pg>=40?'Balanced':'Grind-it-out'}</div></div>`:''}
      ${prof&&prof.pctl&&prof.pctl.top_scorer_share!=null?`<div><div class="k">Offense</div><div class="v">${prof.pctl.top_scorer_share>=58?'Star-centric':prof.pctl.top_scorer_share<=42?'Share the ball':'Balanced'}</div></div>`:''}
    </div>
    <ul class="reasons">${reasons}</ul>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Leap potential <span class="tag">does he take a step up?</span></div>
    <div class="leap-row">
      ${brk?`<div class="leap-stat"><div class="n">${Math.round(brk.rate*100)}%</div><div class="d">of ${esc(style.name)}s who were young non-stars later became stars — his style’s track record.</div></div>`:''}
      ${devPctl!=null?`<div class="leap-stat"><div class="n">${devPctl}<span style="font-size:14px">th</span></div><div class="d">percentile — how strongly ${esc((dest.coach||'this staff').split(' ').slice(-1)[0])}’s staff has developed players year over year.</div></div>`:''}
      <div class="leap-stat"><div class="n">${s.role.startsWith('Day')?'High':s.role.startsWith('Rotation')?'Some':'Limited'}</div><div class="d">opportunity to leap — driven by his projected role (${esc(s.role).toLowerCase()}) and touches available.</div></div>
    </div>
  </div>

  <div class="foot" data-anim>
    <a href="player.html?espn=${p.espn_id||''}&name=${encodeURIComponent(p.name)}">Full player page</a> ·
    <a href="portal.html?espn=${p.espn_id||''}&name=${encodeURIComponent(p.name)}">See his best-fit teams</a> ·
    <a href="team.html?team=${encodeURIComponent(dest.team)}">${esc(dest.team)} page</a>
  </div>`;
  if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(host);

  // roster-level sections load async from the destination's real roster
  const sameTeam=p.team&&dest.team&&(''+p.team).toLowerCase()===(''+dest.team).toLowerCase();
  const myseq=++SHOWSEQ;
  Promise.all([destRoster(dest.team), fetchOwned(p.espn_id), ensureGenome()]).then(([roster,adv])=>{
    if(myseq!==SHOWSEQ) return;                 // a newer render superseded this one
    const ri=document.getElementById('rotaImpact'), ti=document.getElementById('teamImpact'), sf=document.getElementById('styleFit'), om=document.getElementById('ourMetrics');
    if(roster.length){
      const a=analyzeFit(p,roster,prof);
      if(ri) ri.innerHTML=renderRotation(a,dest,sameTeam);
      if(ti) ti.innerHTML=renderTeamImpact(a,dest,sameTeam);
      if(sf) sf.innerHTML=renderStyle(a,p,dest);
    } else { const na='<div class="rot-empty">No roster data for '+esc(dest.team)+' yet.</div>'; if(ri)ri.innerHTML=na; if(ti)ti.innerHTML=na; if(sf)sf.innerHTML=na; }
    if(om) om.innerHTML=renderOwnedMetrics(p,adv,_GEN[p.espn_id]);
  });
}

// ---- picker UI ----
const $=id=>document.getElementById(id);
let searchT,destT;

const logoFor=nm=>{ const x=TC[(nm||'').toLowerCase()]; return x&&x.logo?x.logo:''; };
const destDisplay=nm=>{ const x=TC[(nm||'').toLowerCase()]; if(x&&x.display) return x.display; const t=findTeam(nm); return t?(t.full||t.team):nm; };
const destCoach=nm=>{ const t=findTeam(nm); return t?(t.coach||''):''; };

function inputHTML(id,dropId,ph){ return `<div class="pk-input"><input id="${id}" type="text" placeholder="${ph}" autocomplete="off"/><div class="drop" id="${dropId}"></div></div>`; }
function playerChip(){ const lg=logoFor(SELP.team);
  return `<div class="pk-chip on">${lg?`<img class="pk-logo" src="${lg}" alt="">`:`<div class="pk-av">${initials(SELP.name)}</div>`}<div class="pk-txt"><div class="pk-name">${esc(SELP.name)}</div><div class="pk-sub">${esc(SELP.team||'')}</div></div><button class="pk-x" title="Change player" onclick="clearPick('player')">×</button></div>`; }
function destChip(){ const lg=logoFor(SELDEST);
  return `<div class="pk-chip on">${lg?`<img class="pk-logo" src="${lg}" alt="">`:`<div class="pk-av">${initials(destDisplay(SELDEST))}</div>`}<div class="pk-txt"><div class="pk-name">${esc(destDisplay(SELDEST))}</div><div class="pk-sub">${esc(destCoach(SELDEST)||'coach —')}</div></div><button class="pk-x" title="Change school" onclick="clearPick('dest')">×</button></div>`; }
function renderCells(){
  $('cellPlayer').innerHTML = SELP ? playerChip() : inputHTML('search','drop','Search any player…');
  $('cellDest').innerHTML   = SELDEST ? destChip() : inputHTML('destsearch','destdrop','Search any school…');
  attachInputs();
}
function clearPick(which){ if(which==='player') SELP=null; else SELDEST=null; renderCells();
  if(SELP) show(); else document.getElementById('report').innerHTML=INTRO; }

function attachInputs(){
  const s=$('search'); if(s) s.oninput=function(){ onPlayerInput(this); };
  const d=$('destsearch'); if(d) d.oninput=function(){ onDestInput(this); };
}

// player search across all seasons (dedup to latest) so portal players are findable too
function onPlayerInput(inp){
  const q=inp.value.trim(); clearTimeout(searchT);
  const drop=$('drop'); if(q.length<2){ if(drop)drop.classList.remove('on'); return; }
  searchT=setTimeout(async()=>{
    const rows=await fetch(`${SB}/rest/v1/player_history?name=ilike.*${encodeURIComponent(q)}*&select=name,team,espn_id,season_year&order=season_year.desc&limit=40`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
    const seen=new Set(),out=[];
    for(const r of rows){ if(!r.espn_id||seen.has(r.espn_id))continue; seen.add(r.espn_id); out.push(r); if(out.length>=8)break; }
    const d=$('drop'); if(!d) return;
    if(!out.length){ d.innerHTML='<div class="drop-item"><span class="t">No players match.</span></div>'; d.classList.add('on'); return; }
    d.innerHTML=out.map(p=>{ const lg=logoFor(p.team); return `<div class="drop-item" data-espn="${p.espn_id||''}" data-name="${esc(p.name)}"><span class="di-l">${lg?`<img class="di-logo" src="${lg}" alt="">`:''}<span class="di-name">${esc(p.name)}</span></span><span class="t">${esc(p.team||'')}</span></div>`; }).join('');
    d.classList.add('on');
    d.querySelectorAll('.drop-item[data-name]').forEach(el=>el.addEventListener('click',async()=>{
      document.getElementById('report').innerHTML='<div class="loading">Loading player…</div>';
      const p=await loadPlayer(el.dataset.espn,el.dataset.name);
      if(p){ SELP=p; renderCells(); show(); } else { document.getElementById('report').innerHTML='<div class="empty">Could not load that player.</div>'; }
    }));
  },200);
}

// destination-team search — any school in the coach/needs dataset
function onDestInput(inp){
  const q=inp.value.trim().toLowerCase(); clearTimeout(destT);
  const drop=$('destdrop'); if(q.length<2){ if(drop)drop.classList.remove('on'); return; }
  destT=setTimeout(()=>{
    const out=TEAMS.filter(t=>((t.team||'')+' '+(t.full||'')).toLowerCase().includes(q)).slice(0,8);
    const d=$('destdrop'); if(!d) return;
    if(!out.length){ d.innerHTML='<div class="drop-item"><span class="t">No school matches.</span></div>'; d.classList.add('on'); return; }
    d.innerHTML=out.map(t=>{ const lg=logoFor(t.team); return `<div class="drop-item" data-team="${esc(t.team)}"><span class="di-l">${lg?`<img class="di-logo" src="${lg}" alt="">`:''}<span class="di-name">${esc(t.full||t.team)}</span></span><span class="t">${esc(t.coach||'')}</span></div>`; }).join('');
    d.classList.add('on');
    d.querySelectorAll('.drop-item[data-team]').forEach(el=>el.addEventListener('click',()=>{
      SELDEST=el.dataset.team; renderCells();
      if(SELP){ document.getElementById('report').innerHTML='<div class="loading">Building report…</div>'; show(); }
    }));
  },150);
}

document.addEventListener('click',e=>{ if(!e.target.closest('.pk-input')){ const a=$('drop'),b=$('destdrop'); if(a)a.classList.remove('on'); if(b)b.classList.remove('on'); } });

boot();
</script>
