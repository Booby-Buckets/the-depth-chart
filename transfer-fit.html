  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--amber:#c9962b;--red:#cc3322;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#3ec26e;--amber:#e0b24e;--red:#e0685a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .page{max-width:820px;margin:0 auto;padding:30px 22px 90px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4.5vw,38px);font-weight:800;letter-spacing:-.01em;margin-bottom:14px;}
    .search{position:relative;max-width:440px;margin-bottom:24px;}
    .picker{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
    .pk-cell{flex:1;min-width:238px;}
    .pk-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;padding-left:2px;}
    .pk-body{position:relative;}
    .pk-input{position:relative;}
    .pk-input input{width:100%;padding:13px 16px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .12s,box-shadow .12s;}
    .pk-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
    .pk-arrow{font-size:20px;color:var(--accent);font-weight:800;padding-bottom:12px;flex:none;}
    .pk-chip{display:flex;align-items:center;gap:11px;padding:0 10px 0 12px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);height:49px;}
    .pk-chip.on{border-color:color-mix(in srgb,var(--accent) 55%,var(--border2));}
    .pk-logo{width:30px;height:30px;object-fit:contain;flex:none;}
    .pk-av{width:30px;height:30px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:12px;color:var(--text2);flex:none;}
    .pk-txt{min-width:0;flex:1;}
    .pk-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pk-sub{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pk-x{flex:none;width:26px;height:26px;border-radius:50%;border:none;background:var(--bg3);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;transition:background .12s,color .12s;}
    .pk-x:hover{background:var(--red);color:#fff;}
    .pk-hint{font-size:12px;color:var(--text3);margin-bottom:24px;padding-left:2px;}
    .whatif{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:20px;padding:3px 11px;margin-right:6px;vertical-align:middle;}
    .search input{width:100%;padding:12px 16px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:14px;outline:none;}
    .search input:focus{border-color:var(--accent);}
    .drop{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-top:5px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18);display:none;}
    .drop.on{display:block;}
    .drop-item{padding:9px 12px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .drop-item:hover{background:var(--bg3);}
    .drop-item .t{color:var(--text3);font-size:12px;white-space:nowrap;flex:none;}
    .di-l{display:flex;align-items:center;gap:8px;min-width:0;}
    .di-logo{width:20px;height:20px;object-fit:contain;flex:none;}
    .di-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .loading,.empty{padding:56px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.7;}
    /* hero */
    .rhero{display:flex;align-items:center;gap:16px;border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:18px 20px;margin-bottom:16px;}
    .mono{flex:none;width:56px;height:56px;border-radius:13px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text2);}
    .rh-main{min-width:0;flex:1;}
    .rh-name{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;letter-spacing:-.01em;}
    .rh-meta{font-size:12.5px;color:var(--text3);margin-top:2px;}
    .rh-move{font-size:13px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .rh-from{color:var(--text3);}
    .rh-arrow{color:var(--accent);}
    .rh-to{color:var(--text);}
    .rh-grade{flex:none;text-align:center;}
    .rh-grade .v{font-family:'Playfair Display',serif;font-weight:900;font-size:30px;line-height:1;}
    .rh-grade .l{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:3px;}
    /* verdict */
    .verdict{border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:16px;border-top:4px solid var(--vc,var(--accent));background:var(--bg2);}
    .vd-top{display:flex;align-items:center;gap:14px;}
    .vd-score{font-family:'Playfair Display',serif;font-weight:900;font-size:42px;line-height:1;color:var(--vc,var(--accent));}
    .vd-score small{font-size:16px;color:var(--text3);font-weight:700;}
    .vd-label{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;}
    .vd-why{font-size:14px;color:var(--text2);line-height:1.55;margin-top:11px;}
    /* meters */
    .sec{border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:18px 20px;margin-bottom:16px;}
    .sec-h{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
    .sec-h .tag{font-family:'Inter';font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
    .meter .ml{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;}
    .meter .ml b{font-family:'Playfair Display',serif;font-size:14px;}
    .bar{height:7px;border-radius:6px;background:var(--bg3);overflow:hidden;}
    .bar>span{display:block;height:100%;border-radius:6px;}
    .reasons{list-style:none;margin-top:4px;}
    .reasons li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--text2);line-height:1.5;padding:6px 0;border-top:1px solid var(--border);}
    .reasons li:first-child{border-top:none;}
    .rdelta{flex:none;font-family:'Playfair Display',serif;font-weight:800;font-size:13px;width:34px;}
    .rdelta.pos{color:var(--green);} .rdelta.neg{color:var(--red);}
    .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:4px;}
    .kv .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .kv .v{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;}
    .proj-line{font-size:14px;color:var(--text2);line-height:1.6;}
    .proj-line b{color:var(--text);}
    .arrow{color:var(--accent);font-weight:800;margin:0 8px;}
    .leap-row{display:flex;gap:20px;flex-wrap:wrap;}
    .leap-stat{flex:1;min-width:130px;}
    .leap-stat .n{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:var(--accent);}
    .leap-stat .d{font-size:12px;color:var(--text2);line-height:1.45;margin-top:5px;}
    .foot{font-size:12px;color:var(--text3);text-align:center;margin-top:20px;line-height:1.6;}
    .foot a{color:var(--accent);font-weight:700;}
    .sharebtn{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:700;
      color:#141416;background:var(--accent);border:none;border-radius:22px;padding:8px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s;}
    .sharebtn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.22);}
    .share-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);
      font-size:13px;font-weight:600;padding:10px 18px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;opacity:0;transition:opacity .2s;}
    .share-toast.on{opacity:1;}
  </style>

<body>

<div class="page">
  <div class="eyebrow" data-anim>⇄ Transfer Portal</div>
  <h1 data-anim>Transfer Fit Report</h1>
  <div class="picker" id="picker" data-anim>
    <div class="pk-cell">
      <div class="pk-lbl">Player</div>
      <div class="pk-body" id="cellPlayer"></div>
    </div>
    <div class="pk-arrow">→</div>
    <div class="pk-cell">
      <div class="pk-lbl">Destination school</div>
      <div class="pk-body" id="cellDest"></div>
    </div>
  </div>
  <div class="pk-hint" data-anim>Pick any player, then any school — even a rumored move that hasn't happened yet.</div>
  <div id="report"><div class="loading">Loading…</div></div>
</div>
<script src="tdc-version.js?v=2"></script>
<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const PSEL='id,name,team,position,class_year,height,tdc_grade,ppg,rpg,apg,mpg,fg_pct,tp_pct,three_pct,tpa,fga,blk,bpg,stl,spg,usage_pct,espn_id,is_addition,hometown';
const esc=s=>(''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round((parseFloat(x)||0)*10)/10;
const initials=n=>(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const barCol=v=>v>=72?'var(--green)':v>=52?'var(--amber)':'var(--red)';
let TEAMS=[],PROFS={},TC={},CURRENT=null,SELP=null,SELDEST=null;

function toast(msg){ let t=document.querySelector('.share-toast'); if(!t){t=document.createElement('div');t.className='share-toast';document.body.appendChild(t);} t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1900); }
function shareReport(){
  if(!CURRENT) return;
  const url=location.href;
  const text=`${CURRENT.name}: ${CURRENT.origin} → ${CURRENT.team} — a ${CURRENT.score}/100 ${CURRENT.verdict}. Transfer Fit Report ⬇`;
  if(navigator.share){ navigator.share({title:'Transfer Fit Report — The Depth Chart',text,url}).catch(()=>{}); return; }
  try{ if(navigator.clipboard){ navigator.clipboard.writeText(url); toast('Link copied'); } }catch(e){}
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url),'_blank','noopener');
}

// project once, then cache — show() re-runs on every destination change, and re-projecting
// an already-projected grade would drift it down each time.
function projInto(p){ if(p&&!p._projected&&window.TDCProjGrade&&TDCProjGrade.gradeSolo&&parseFloat(p.mpg)>0){
  const g=TDCProjGrade.gradeSolo({id:p.id,espn_id:p.espn_id,tdc_grade:p.tdc_grade,yr:p.class_year||p.yr});
  if(g!=null&&!isNaN(g)) p.tdc_grade=''+g; p._projected=true; } return p; }
const findTeam=nm=>TEAMS.find(t=>t.team===nm||t.full===nm||t.team===(nm||'').replace(/\s+(Blue Devils|Tigers|Wildcats|Bulldogs|Cardinals).*$/,''));

// map a player_history row (portal players not on a current roster) to the players-table shape
function fromHist(h){ return {id:null,name:h.name,team:h.team,position:h.position,class_year:h.yr,height:h.height,
  tdc_grade:h.tdc_grade,ppg:h.ppg,rpg:h.rpg,apg:h.apg,mpg:h.mpg,fg_pct:h.fg_pct,tp_pct:h.tp_pct,three_pct:h.tp_pct,
  tpa:h.tpa,fga:h.fga,blk:h.blk,bpg:h.blk,stl:h.stl,spg:h.stl,usage_pct:null,espn_id:h.espn_id,is_addition:false,hometown:'',_hist:true}; }
async function loadPlayer(espn,name){
  const q=espn?`espn_id=eq.${espn}`:`name=eq.${encodeURIComponent(name)}`;
  let rows=await fetch(`${SB}/rest/v1/players?${q}&select=${PSEL}&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
  if(rows&&rows[0]) return rows[0];
  const hh=await fetch(`${SB}/rest/v1/player_history?${q}&select=name,team,position,height,yr,ppg,rpg,apg,mpg,fga,tpa,fg_pct,tp_pct,blk,stl,tdc_grade,espn_id&order=season_year.desc&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
  return hh&&hh[0]?fromHist(hh[0]):null;
}

const INTRO='<div class="empty">Pick <b>any player</b>, then fit them to <b>any school</b> — coach &amp; system fit, roster need, projection, and leap potential.<br><span style="font-size:12.5px">e.g. a rumored portal move like a star wing to a new blue-blood.</span></div>';

async function boot(){
  const [tn,cp,tc]=await Promise.all([
    fetch('scripts/data/team_needs.json').then(r=>r.json()).catch(()=>({teams:[]})),
    fetch('scripts/data/coach_profiles.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
    fetch('scripts/data/team_colors.json').then(r=>r.ok?r.json():[]).catch(()=>[])
  ]);
  TEAMS=tn.teams||[];
  (Array.isArray(cp)?cp:[]).forEach(p=>{ if(p.coach_slug) PROFS[p.coach_slug]=p; });
  (Array.isArray(tc)?tc:[]).forEach(x=>{ if(x.location) TC[(x.location||'').toLowerCase()]=x; });
  if(window.TDCProjGrade){ try{ await TDCProjGrade.ready; }catch(e){} }
  if(window.TDC_ARCH){ try{ await TDC_ARCH.ready; }catch(e){} }
  const u=new URLSearchParams(location.search), espn=u.get('espn'), name=u.get('name'), to=u.get('to');
  if(to) SELDEST=to;
  if(espn||name){ const p=await loadPlayer(espn,name); if(p) SELP=p; }
  renderCells();
  if(SELP) show();
  else document.getElementById('report').innerHTML=INTRO;
}

function heroRow(p,fromTeam,destName,grade,style){
  const ppos=TDCPortalFit.pos(p);
  return `<div class="rhero" data-anim>
    <div class="mono">${initials(p.name)}</div>
    <div class="rh-main">
      <div class="rh-name">${esc(p.name)}</div>
      <div class="rh-meta">${esc(ppos)} · ${esc(p.class_year||p.yr||'')}${p.height?' · '+esc(p.height):''}${style?` · ${esc(style.name)}`:''}</div>
      <div class="rh-move"><span class="rh-from">${esc(fromTeam||'—')}</span><span class="rh-arrow">→</span><span class="rh-to">${esc(destName||'?')}</span></div>
    </div>
    <div class="rh-grade"><div class="v">${grade||'—'}</div><div class="l">Proj OVR</div></div>
  </div>`;
}

function show(){
  const p=SELP; const host=document.getElementById('report');
  if(!p){ host.innerHTML='<div class="empty">Search a player to begin.</div>'; return; }
  projInto(p);
  const grade=Math.round(parseFloat(p.tdc_grade)||0);
  const style=(window.TDC_ARCH&&TDC_ARCH.of(p.espn_id,p.name))||null;
  // committed portal add → hometown holds the old team; otherwise it's a what-if from his current team
  const committed=p.is_addition&&(p.hometown||'').trim();
  const fromTeam=committed?(p.hometown||'').trim():(p.team||'');
  const destName=SELDEST||(committed?p.team:null);
  const baseUrl=`transfer-fit.html?espn=${p.espn_id||''}&name=${encodeURIComponent(p.name)}`+(SELDEST?`&to=${encodeURIComponent(SELDEST)}`:'');

  if(!destName){
    history.replaceState(null,'',baseUrl);
    host.innerHTML=heroRow(p,fromTeam,null,grade,style)+
      `<div class="empty">Now pick a <b>destination school</b> above to model how <b>${esc(p.name)}</b> would fit — coach, system, roster need, projection and leap potential.</div>`;
    if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(host);
    return;
  }
  const dest=findTeam(destName);
  if(!dest){ host.innerHTML=heroRow(p,fromTeam,destName,grade,style)+`<div class="empty">No fit data for <b>${esc(destName)}</b> yet — it isn’t in the coach/needs dataset.</div>`; if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(host); return; }
  const prof=dest&&dest.coach_slug?PROFS[dest.coach_slug]:null;
  const origin=fromTeam;
  const s=TDCPortalFit.scoreTeam(p,dest,prof);
  const cf=TDCPortalFit.coachFit(prof,p);
  const ppos=TDCPortalFit.pos(p);

  // verdict
  const V=s.overall>=82?['Ideal Landing Spot','var(--green)']:s.overall>=70?['Strong Fit','var(--green)']
        :s.overall>=58?['Solid Fit','var(--amber)']:s.overall>=45?['Questionable Fit','var(--amber)']:['Tough Spot','var(--red)'];
  CURRENT={name:p.name,origin:origin,team:dest.team,verdict:V[0],score:s.overall,to:SELDEST||''};
  history.replaceState(null,'',baseUrl+`&score=${s.overall}&verdict=${encodeURIComponent(V[0])}`);

  // leap potential — style breakout rate + coach development + projected trajectory
  const brk=style&&window.TDC_ARCH.breakout?TDC_ARCH.breakout(style.name):null;
  const devPctl=prof&&prof.dev_pctl!=null?Math.round(prof.dev_pctl):null;

  const meter=(lbl,v)=>`<div class="meter"><div class="ml"><span>${lbl}</span><b>${Math.round(v)}</b></div><div class="bar"><span style="width:${Math.max(4,Math.round(v))}%;background:${barCol(v)}"></span></div></div>`;
  const reasons=(cf.reasons||[]).map(r=>`<li><span class="rdelta ${r.d>=0?'pos':'neg'}">${r.d>=0?'+':''}${r.d}</span><span>${esc(r.t)}</span></li>`).join('')
    || '<li><span>A neutral stylistic fit with the staff — no strong push or pull.</span></li>';

  // projection now -> destination
  const cur={ppg:p.ppg,rpg:p.rpg,apg:p.apg,tp_pct:p.tp_pct||p.three_pct};
  const noStat=(+p.ppg||0)<=0&&(+p.rpg||0)<=0&&(+p.apg||0)<=0;
  const projStr=o=>`${r1(o.ppg)}p · ${r1(o.rpg)}r · ${r1(o.apg)}a`+(o.mpg?` · ${r1(o.mpg)}m`:'');

  host.innerHTML=`
  ${heroRow(p,origin,dest.full||dest.team,grade,style)}
  ${SELDEST?'<div style="margin:-8px 0 14px;font-size:12.5px;color:var(--text3)"><span class="whatif">What-if</span> hypothetical fit — he hasn’t committed here.</div>':''}

  <div class="verdict" data-anim style="--vc:${V[1]}">
    <div class="vd-top"><div class="vd-score">${s.overall}<small>/100</small></div><div class="vd-label">${V[0]}</div></div>
    <div class="vd-why">${esc(s.why||'')} <b>Projected role: ${esc(s.role)}.</b></div>
    <button class="sharebtn" onclick="shareReport()">↗ Share report</button>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Why it fits <span class="tag">need · winning · opportunity · coach</span></div>
    <div class="meters">
      ${meter('Roster need',s.need)}${meter('Team success',s.teamSuccess)}${meter('His opportunity',s.playerSuccess)}${meter('Coach fit',s.coachFit)}
    </div>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Coach &amp; system fit</div>
    <div class="kv">
      <div><div class="k">Coach</div><div class="v">${esc(dest.coach||prof&&prof.coach||'—')}</div></div>
      <div><div class="k">System</div><div class="v">${esc(dest.archetype||prof&&prof.archetype||'—')}</div></div>
      ${prof&&prof.pctl&&prof.pctl.poss_pg!=null?`<div><div class="k">Tempo</div><div class="v">${prof.pctl.poss_pg>=60?'Fast':prof.pctl.poss_pg>=40?'Balanced':'Grind-it-out'}</div></div>`:''}
      ${prof&&prof.pctl&&prof.pctl.top_scorer_share!=null?`<div><div class="k">Offense</div><div class="v">${prof.pctl.top_scorer_share>=58?'Star-centric':prof.pctl.top_scorer_share<=42?'Share the ball':'Balanced'}</div></div>`:''}
    </div>
    <ul class="reasons">${reasons}</ul>
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Projection at ${esc(dest.team)}</div>
    ${noStat
      ? `<div class="proj-line">Incoming with no prior college line to scale from — projection fills in once he logs minutes.</div>`
      : `<div class="proj-line">Last season <b>${projStr(cur)}</b><span class="arrow">→</span>projected <b>${projStr(s.proj||{})}</b> at ${esc(dest.team)}.</div>`}
  </div>

  <div class="sec" data-anim>
    <div class="sec-h">Leap potential <span class="tag">does he take a step up?</span></div>
    <div class="leap-row">
      ${brk?`<div class="leap-stat"><div class="n">${Math.round(brk.rate*100)}%</div><div class="d">of ${esc(style.name)}s who were young non-stars later became stars — his style’s track record.</div></div>`:''}
      ${devPctl!=null?`<div class="leap-stat"><div class="n">${devPctl}<span style="font-size:14px">th</span></div><div class="d">percentile — how strongly ${esc((dest.coach||'this staff').split(' ').slice(-1)[0])}’s staff has developed players year over year.</div></div>`:''}
      <div class="leap-stat"><div class="n">${s.role.startsWith('Day')?'High':s.role.startsWith('Rotation')?'Some':'Limited'}</div><div class="d">opportunity to leap — driven by his projected role (${esc(s.role).toLowerCase()}) and touches available.</div></div>
    </div>
  </div>

  <div class="foot" data-anim>
    <a href="player.html?espn=${p.espn_id||''}&name=${encodeURIComponent(p.name)}">Full player page</a> ·
    <a href="portal.html?espn=${p.espn_id||''}&name=${encodeURIComponent(p.name)}">See his best-fit teams</a> ·
    <a href="team.html?team=${encodeURIComponent(dest.team)}">${esc(dest.team)} page</a>
  </div>`;
  if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(host);
}

// ---- picker UI ----
const $=id=>document.getElementById(id);
let searchT,destT;

const logoFor=nm=>{ const x=TC[(nm||'').toLowerCase()]; return x&&x.logo?x.logo:''; };
const destDisplay=nm=>{ const x=TC[(nm||'').toLowerCase()]; if(x&&x.display) return x.display; const t=findTeam(nm); return t?(t.full||t.team):nm; };
const destCoach=nm=>{ const t=findTeam(nm); return t?(t.coach||''):''; };

function inputHTML(id,dropId,ph){ return `<div class="pk-input"><input id="${id}" type="text" placeholder="${ph}" autocomplete="off"/><div class="drop" id="${dropId}"></div></div>`; }
function playerChip(){ const lg=logoFor(SELP.team);
  return `<div class="pk-chip on">${lg?`<img class="pk-logo" src="${lg}" alt="">`:`<div class="pk-av">${initials(SELP.name)}</div>`}<div class="pk-txt"><div class="pk-name">${esc(SELP.name)}</div><div class="pk-sub">${esc(SELP.team||'')}</div></div><button class="pk-x" title="Change player" onclick="clearPick('player')">×</button></div>`; }
function destChip(){ const lg=logoFor(SELDEST);
  return `<div class="pk-chip on">${lg?`<img class="pk-logo" src="${lg}" alt="">`:`<div class="pk-av">${initials(destDisplay(SELDEST))}</div>`}<div class="pk-txt"><div class="pk-name">${esc(destDisplay(SELDEST))}</div><div class="pk-sub">${esc(destCoach(SELDEST)||'coach —')}</div></div><button class="pk-x" title="Change school" onclick="clearPick('dest')">×</button></div>`; }
function renderCells(){
  $('cellPlayer').innerHTML = SELP ? playerChip() : inputHTML('search','drop','Search any player…');
  $('cellDest').innerHTML   = SELDEST ? destChip() : inputHTML('destsearch','destdrop','Search any school…');
  attachInputs();
}
function clearPick(which){ if(which==='player') SELP=null; else SELDEST=null; renderCells();
  if(SELP) show(); else document.getElementById('report').innerHTML=INTRO; }

function attachInputs(){
  const s=$('search'); if(s) s.oninput=function(){ onPlayerInput(this); };
  const d=$('destsearch'); if(d) d.oninput=function(){ onDestInput(this); };
}

// player search across all seasons (dedup to latest) so portal players are findable too
function onPlayerInput(inp){
  const q=inp.value.trim(); clearTimeout(searchT);
  const drop=$('drop'); if(q.length<2){ if(drop)drop.classList.remove('on'); return; }
  searchT=setTimeout(async()=>{
    const rows=await fetch(`${SB}/rest/v1/player_history?name=ilike.*${encodeURIComponent(q)}*&select=name,team,espn_id,season_year&order=season_year.desc&limit=40`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
    const seen=new Set(),out=[];
    for(const r of rows){ if(!r.espn_id||seen.has(r.espn_id))continue; seen.add(r.espn_id); out.push(r); if(out.length>=8)break; }
    const d=$('drop'); if(!d) return;
    if(!out.length){ d.innerHTML='<div class="drop-item"><span class="t">No players match.</span></div>'; d.classList.add('on'); return; }
    d.innerHTML=out.map(p=>{ const lg=logoFor(p.team); return `<div class="drop-item" data-espn="${p.espn_id||''}" data-name="${esc(p.name)}"><span class="di-l">${lg?`<img class="di-logo" src="${lg}" alt="">`:''}<span class="di-name">${esc(p.name)}</span></span><span class="t">${esc(p.team||'')}</span></div>`; }).join('');
    d.classList.add('on');
    d.querySelectorAll('.drop-item[data-name]').forEach(el=>el.addEventListener('click',async()=>{
      document.getElementById('report').innerHTML='<div class="loading">Loading player…</div>';
      const p=await loadPlayer(el.dataset.espn,el.dataset.name);
      if(p){ SELP=p; renderCells(); show(); } else { document.getElementById('report').innerHTML='<div class="empty">Could not load that player.</div>'; }
    }));
  },200);
}

// destination-team search — any school in the coach/needs dataset
function onDestInput(inp){
  const q=inp.value.trim().toLowerCase(); clearTimeout(destT);
  const drop=$('destdrop'); if(q.length<2){ if(drop)drop.classList.remove('on'); return; }
  destT=setTimeout(()=>{
    const out=TEAMS.filter(t=>((t.team||'')+' '+(t.full||'')).toLowerCase().includes(q)).slice(0,8);
    const d=$('destdrop'); if(!d) return;
    if(!out.length){ d.innerHTML='<div class="drop-item"><span class="t">No school matches.</span></div>'; d.classList.add('on'); return; }
    d.innerHTML=out.map(t=>{ const lg=logoFor(t.team); return `<div class="drop-item" data-team="${esc(t.team)}"><span class="di-l">${lg?`<img class="di-logo" src="${lg}" alt="">`:''}<span class="di-name">${esc(t.full||t.team)}</span></span><span class="t">${esc(t.coach||'')}</span></div>`; }).join('');
    d.classList.add('on');
    d.querySelectorAll('.drop-item[data-team]').forEach(el=>el.addEventListener('click',()=>{
      SELDEST=el.dataset.team; renderCells();
      if(SELP){ document.getElementById('report').innerHTML='<div class="loading">Building report…</div>'; show(); }
    }));
  },150);
}

document.addEventListener('click',e=>{ if(!e.target.closest('.pk-input')){ const a=$('drop'),b=$('destdrop'); if(a)a.classList.remove('on'); if(b)b.classList.remove('on'); } });

boot();
</script>
