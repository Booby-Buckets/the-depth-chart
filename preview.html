  <style>
    :root{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#5ab875;--amber:#d4a24a;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .nav{border-bottom:1px solid var(--border);padding:0 30px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(20,20,22,.86);backdrop-filter:blur(16px);z-index:50;}
    .logo{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;}
    .logo span{color:var(--accent);}
    .nav a{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-left:18px;}
    .nav a:hover{color:var(--text);}
    .wrap{max-width:1120px;margin:0 auto;padding:24px 22px 90px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
    h1{font-family:'Playfair Display',serif;font-weight:800;font-size:38px;letter-spacing:-.02em;margin:6px 0 4px;}
    h1 em{font-style:italic;color:var(--accent);}
    .sub{font-size:13.5px;color:var(--text3);font-weight:600;margin-bottom:20px;}
    /* player picker */
    .pick{position:relative;max-width:440px;margin-bottom:22px;}
    .pick input{width:100%;padding:12px 14px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);border-radius:10px;font-size:14px;font-family:inherit;font-weight:600;}
    .pick input:focus{outline:none;border-color:var(--accent);}
    .drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;overflow:hidden;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.5);}
    .drop div{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);}
    .drop div:hover{background:var(--bg3);}
    .drop small{color:var(--text3);}
    .wctrl{display:flex;align-items:flex-start;gap:14px;margin-top:16px;flex-wrap:wrap;}
    .wgrid{display:grid;grid-template-columns:repeat(4,minmax(118px,1fr));gap:16px;flex:1;min-width:0;}
    @media(max-width:720px){.wgrid{grid-template-columns:repeat(2,1fr);}}
    .wslider{min-width:0;}
    .wtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
    .wslider label{font-size:11px;font-weight:700;color:var(--text2);}
    .wval{font-size:11px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
    .wslider input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;height:4px;}
    .wreset{font-size:11px;font-weight:800;color:var(--accent);cursor:pointer;white-space:nowrap;padding-top:2px;}
    #pickTeam select{padding:11px 12px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
    #pickTeam select:focus{outline:none;border-color:var(--accent);}
    /* team-needs summary (reverse mode) */
    .tneeds{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .tn-pos{border:1px solid var(--border);border-radius:9px;background:var(--bg3);padding:7px 11px;text-align:center;min-width:66px;}
    .tn-pos .p{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--text3);}
    .tn-pos .g{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;margin-top:2px;}
    .tn-pos.weak{border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 10%,var(--bg3));}
    /* player hero */
    .phero{display:flex;align-items:center;gap:18px;padding:18px 20px;border:1px solid var(--border);border-radius:14px;background:radial-gradient(120% 160% at 0 0,color-mix(in srgb,var(--accent) 12%,var(--bg2)),var(--bg2));margin-bottom:22px;flex-wrap:wrap;}
    .pmono{width:60px;height:60px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:var(--accent);background:var(--bg3);border:2px solid color-mix(in srgb,var(--accent) 40%,var(--border2));}
    .pname{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;line-height:1;}
    .pmeta{font-size:13px;color:var(--text2);font-weight:600;margin-top:5px;}
    .parch{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#221c08;background:var(--accent);padding:3px 9px;border-radius:12px;display:inline-block;margin-top:8px;}
    .pgrade{margin-left:auto;text-align:center;}
    .pgrade .v{font-family:'Playfair Display',serif;font-weight:800;font-size:40px;line-height:1;color:var(--accent);}
    .pgrade .l{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    /* controls */
    .ctrls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
    .seg{display:inline-flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;}
    .seg button{background:none;border:none;color:var(--text3);font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.03em;padding:8px 13px;cursor:pointer;border-right:1px solid var(--border2);}
    .seg button:last-child{border-right:none;}
    .seg button.on{background:var(--accent);color:#221c08;}
    .ctrl-lbl{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .ctrls select{padding:8px 10px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);border-radius:8px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;}
    .rank-note{font-size:11px;color:var(--text3);margin:6px 0 18px;}
    /* results */
    .rrow{display:grid;grid-template-columns:34px 1fr 240px 62px;gap:14px;align-items:center;padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);margin-bottom:9px;transition:border-color .15s,transform .15s;}
    .rrow:hover{border-color:var(--accent);transform:translateY(-1px);}
    .rrk{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text3);text-align:center;}
    .rteam{font-size:15px;font-weight:800;}
    .rteam a:hover{color:var(--accent);}
    .rteam .tr{font-size:11px;color:var(--text3);font-weight:600;margin-top:2px;}
    .rwhy{font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.4;}
    .posflex{font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);background:rgba(200,160,60,.14);padding:1px 5px;border-radius:5px;}
    .rrole{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);margin-top:4px;}
    .rproj{font-size:11px;color:var(--text3);margin-top:5px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:center;gap:7px;}
    .rproj b{color:var(--text2);font-weight:700;}
    .rp-arrow{opacity:.55;}
    .rp-new{color:var(--text3);}
    .rproj-none{font-style:italic;}
    .bars{display:flex;flex-direction:column;gap:4px;}
    .bar{display:grid;grid-template-columns:64px 1fr 22px;gap:6px;align-items:center;}
    .bar .bl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--text3);}
    .bar .bt{height:5px;border-radius:3px;background:var(--bg3);overflow:hidden;}
    .bar .bf{height:100%;border-radius:3px;}
    .bar .bv{font-size:9.5px;font-weight:800;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums;}
    .rovr{text-align:center;}
    .rovr .v{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1;}
    .rovr .l{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-top:1px;}
    .loading{padding:70px;text-align:center;color:var(--text3);}
    @media(max-width:760px){.rrow{grid-template-columns:28px 1fr 60px;}.bars{display:none;}}
  </style>

<body data-anim-auto class="hqsite">
  <script src="tdc-nav.js?v=27"></script>
  <div class="wrap" style="max-width:1180px;">
    <div class="eyebrow" style="color:var(--accent)!important;-webkit-text-fill-color:var(--accent)!important;">2026-27 · Game Preview</div>
    <h1 id="gpTitle" style="color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;">Game <em>Preview</em></h1>
    <div class="sub" id="gpSub" style="color:var(--text3)!important;-webkit-text-fill-color:var(--text3)!important;">Projected line, matchup profile and every rotation player's stat line for this game.</div>
    <div id="gpHost"></div>
  </div>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const team=q.get('team'), opp=q.get('opp'), date=q.get('date');
  const host=document.getElementById('gpHost');
  if(!team||!opp||!date){ host.innerHTML='<div style="color:var(--text3);padding:20px 0;">Open a preview from a team\'s Schedule tab.</div>'; return; }
  const sn=x=>window.tdcShortSchool?tdcShortSchool(x):x;
  document.title=`${sn(team)} vs ${sn(opp)} · ${date} — The Depth Chart`;
  document.getElementById('gpTitle').innerHTML=`${sn(team)} <em>vs</em> ${sn(opp)}`;
  TDCPreview.render(host,{team,opp,date}).catch(e=>{ host.innerHTML='<div style="color:var(--text3);padding:20px 0;">Could not build the preview: '+e.message+'</div>'; });
})();
</script>
