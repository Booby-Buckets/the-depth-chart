      if(my!==seq) return;
      const C=team?TC:PC, all=team?d.T:d.P, q=S.q.trim().toLowerCase(), multi=S.y==='all';
      if(!C.some(c=>c[0]===S.sort)&&!(['name'].concat(team?[]:['ht','wt','cls','exp']).includes(S.sort))){ S.sort='dm'; S.asc=''; }
      const confs=[...new Set(d.P.map(p=>p.conf))].filter(Boolean).sort(); if(S.conf&&!confs.includes(S.conf)) S.conf='';
      sel('fConf',[['','All conferences']].concat(confs.map(c=>[c,c])),S.conf);
      const L=all.filter(keep), k=S.sort, m=S.asc?1:-1;
      L.sort((a,b)=>k==='name'?m*a.name.localeCompare(b.name):(a[k]==null)-(b[k]==null)||m*(a[k]-b[k])||b.dm-a.dm||a.name.localeCompare(b.name));
      const rk=new Map(); L.forEach((p,i)=>rk.set(p,k!=='name'&&i&&L[i-1][k]===p[k]?rk.get(L[i-1]):i+1));   // ties share a rank; search narrows without renumbering
      const V=q?L.filter(p=>(p.name+' '+p.team+' '+p.full).toLowerCase().includes(q)):L, shown=V.slice(0,n);
      const ar=c=>k===c?(S.asc?' ▲':' ▼'):'', th=c=>`<th data-k="${c[0]}"${k===c[0]?' data-fit-keep':''}${c[3]?` data-heat="${c[3]}"`:''}>${c[1]}${ar(c[0])}</th>`;
      const tl=(t,x)=>{ const g=logo(t); return `<td class="l tm">${g?`<img src="${esc(g)}" alt="" loading="lazy">`:''}<a href="team.html?team=${encodeURIComponent(x)}">${esc(x)}</a></td>`; };
      const showCls=hasCls(), showDr=S.y!=='2027', pre=team?`<th class="l">Conf</th>`:`<th class="l">Team</th>${multi?'<th class="l">Season</th>':''}<th class="l">Pos</th><th class="l" data-k="ht">Ht${ar('ht')}</th><th class="l" data-k="wt">Wt${ar('wt')}</th>${showCls?`<th class="l" data-k="cls">Class${ar('cls')}</th>`:`<th class="l" data-k="exp">D-I yr${ar('exp')}</th>`}${showDr?'<th class="l">Draft</th>':''}`;
      const tot=V.reduce((s,p)=>(s.dm+=p.dm,s.da+=p.da,s.lm+=p.lm,s.la+=p.la,s),{dm:0,da:0,lm:0,la:0});
      $('sample').innerHTML=`<b>${V.length.toLocaleString()}</b> ${team?'teams':multi?'player-seasons':'players'}`+(V.length?` · ${phone()?'':'together: '}<b>${tot.dm.toLocaleString()}</b> dunks${phone()?'':`, ${pct(r(tot.dm,tot.da))} on dunks, ${pct(r(tot.lm,tot.la))} on layups`}`:'');
      $('notes').innerHTML=`${d.games.toLocaleString()} games with play-by-play · layups include tip-ins, rim shots are dunks plus layups, dunk share is dunks out of rim shots, % of FGs is the share of made shots that were dunks, distances are 2025-26 on without 40+ ft heaves`+
        (S.dr&&!team?` · draft through ${ST.through}; undrafted means not on a 2026-27 D-I roster`:'');
      const pc=team?3:(multi?8:7)+(showDr?1:0);
      $('tbl').innerHTML=V.length?`<div class="sheet-wrap"><table class="sheet dense"><thead><tr><th>#</th><th class="l" data-k="name" data-fit-keep>${team?'Team':'Player'}${ar('name')}</th>${pre}${C.map(th).join('')}</tr></thead><tbody>`+
        shown.map(p=>`<tr><td>${rk.get(p)}</td>${team?tl(p.full,p.name)+`<td class="l">${esc(p.conf)}${multi?' · '+lbl(p.y):''}</td>`:`<td class="l"><div class="pl">${phone()&&logo(p.full)?`<img class="plg" src="${esc(logo(p.full))}" alt="${esc(p.team)}" title="${esc(p.team)}" loading="lazy">`:''}<div><a href="player.html?espn=${p.id}">${esc(p.name)}</a><span class="sub">${[phone()&&logo(p.full)?'':esc(p.team),multi?lbl(p.y):'',[p.ht?hts(p.ht):'',p.wt||''].filter(Boolean).join(', '),showCls?CL[p.cls]||'':''].filter(Boolean).join(' · ')}</span></div></div></td>`+tl(p.full,p.team)+(multi?`<td class="l">${lbl(p.y)}</td>`:'')+`<td class="l">${esc(p.pos||'—')}</td><td class="l">${hts(p.ht)}</td><td class="l">${int(p.wt)}</td><td class="l">${showCls?txt(CL[p.cls]):int(p.exp)}</td>${showDr?`<td class="l">${draftTxt(p)}</td>`:''}`}${C.map(c=>`<td>${c[2](p[c[0]])}</td>`).join('')}</tr>`).join('')+
        `</tbody></table></div>${V.length>n?'<button class="more" id="more">Show 100 more</button>':''}`:'<div class="empty">Nobody matches those filters.</div>';
      const t=document.querySelector('#tbl table');
      if(t&&window.tdcSheetHeat){   // shade against all of D-I (players with a real sample of rim shots), not just the rows on screen
        const rf='ref'+S.view+pc;
        if(!d[rf]){ const ref=document.createElement('table'), src=team?d.T:d.P.filter(p=>p.ra>=p.qual), st=Math.max(1,Math.floor(src.length/1500));
          ref.innerHTML='<thead><tr>'+'<th></th>'.repeat(pc+C.length)+'</tr></thead><tbody>'+src.filter((p,i)=>i%st===0).map(p=>'<tr>'+'<td></td>'.repeat(pc)+C.map(c=>`<td>${c[2](p[c[0]])}</td>`).join('')+'</tr>').join('')+'</tbody>'; d[rf]=ref; }
        tdcSheetHeat(t,d[rf]); }
      document.querySelectorAll('#tbl th[data-k]').forEach(h=>h.onclick=()=>{ const kk=h.dataset.k; if(S.sort===kk) S.asc=S.asc?'':'1'; else { S.sort=kk; S.asc=kk==='name'||(team&&kk[0]==='o')?'1':''; } n=100;
        // a rate leaderboard needs a sample: sorting by one raises the minimum off "no minimum"
        if(!team&&/fg$|dsh|dast|dfgm|^ad$|^md$/.test(kk)&&!+S.min){ S.min=String(d.qual); sync(); } render(); });
      if($('more')) $('more').onclick=()=>{ n+=100; render(); };
    }).catch(e=>{ if(my===seq){ console.error(e); $('tbl').innerHTML='<div class="empty">Could not load the dunk data.</div>'; } });
  }
  const MAP={fView:'view',fSeason:'y',fConf:'conf',fPos:'pos',fMin:'min',fQ:'q',fH0:'h0',fH1:'h1',fW0:'w0',fW1:'w1',fCls:'cls',fExp:'exp',fDr:'dr',fHow:'how',fLvl:'lvl',fRole:'role'};
  const H=[]; for(let v=67;v<=89;v++) H.push([v,hts(v)]);
  function sync(){
    sel('fSeason',SEASONS.map(y=>[y,lbl(y)]).concat([['all','All seasons'],['car','Career totals']]),S.y);
    sel('fPos',[['','All positions'],['G','Guards'],['F','Forwards'],['C','Centers'],['GF','Guards and forwards'],['FC','Forwards and centers'],['PG','Point guards (on a roster now)'],['SG','Shooting guards (on a roster now)'],['SF','Small forwards (on a roster now)'],['PF','Power forwards (on a roster now)'],['C5','Centers (on a roster now)']],S.pos);
    sel('fMin',[...new Set([0,10,20,30,50,100,150,+S.min])].sort((a,b)=>a-b).map(v=>[v,v?v+'+':'No minimum']),S.min);
    sel('fH0',[['','Min']].concat(H),S.h0); sel('fH1',[['','Max']].concat(H),S.h1);
    sel('fDr',[['','Anyone'],['dr','Drafted'],['lot','Lottery picks (1–14)'],['r1','First round'],['r2','Second round'],['not','Not drafted'],['un','Undrafted, left college'],['act','Still in college']],S.dr);
    Object.keys(MAP).forEach(i=>{ if(i!=='fConf'&&$(i).value!==S[MAP[i]]) $(i).value=S[MAP[i]]; });
    drawC();
  }
  function drawC(){
    $('conds').innerHTML=conds.map((c,i)=>`<div class="cond" data-i="${i}"><select aria-label="Stat">${QS.map(q=>`<option value="${q[0]}"${q[0]===c.k?' selected':''}>${q[1]}</option>`).join('')}</select><select aria-label="At least or at most"><option value=">">at least</option><option value="<"${c.o==='<'?' selected':''}>at most</option></select><input type="number" step="any" inputmode="decimal" aria-label="Value" value="${esc(c.v)}"><button type="button" aria-label="Remove rule">×</button></div>`).join('');
    document.querySelectorAll('.cond').forEach(e=>{ const c=conds[+e.dataset.i], s=e.querySelectorAll('select'), go=()=>{ n=100; render(); };
      s[0].onchange=()=>{ c.k=s[0].value; go(); }; s[1].onchange=()=>{ c.o=s[1].value; go(); }; e.querySelector('input').oninput=x=>{ c.v=x.target.value; later(); }; e.querySelector('button').onclick=()=>{ conds.splice(+e.dataset.i,1); drawC(); go(); }; });
  }
  let tm=0; const later=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ n=100; render(); },180); };
  Object.keys(MAP).forEach(i=>{ const e=$(i), f=()=>{ S[MAP[i]]=e.value; }; if(e.tagName==='INPUT') e.oninput=()=>{ f(); later(); }; else e.onchange=()=>{ f(); n=100; render(); }; });
  const open=b=>{ $('base').classList.toggle('open',b); $('advBtn').setAttribute('aria-expanded',b?'true':'false'); $('adv').hidden=!b; };
  $('advBtn').onclick=()=>{ const b=$('advBtn').getAttribute('aria-expanded')!=='true'; open(b); if(S.view==='team') $('adv').hidden=true; };
  $('addC').onclick=()=>{ conds.push({k:'dm',o:'>',v:''}); drawC(); };
  function set(o,cs){ Object.assign(S,DEF,o); conds=(cs||[]).map(c=>({k:c[0],o:c[1],v:String(c[2])})); n=100; sync(); render(); }
  $('reset').onclick=()=>set({});
  $('copy').onclick=()=>{ save(); const b=$('copy'), done=t=>{ b.textContent=t; setTimeout(()=>b.textContent='Copy link to this search',1600); }; try{ navigator.clipboard.writeText(location.href).then(()=>done('Copied'),()=>done('Copy the address bar')); }catch(e){ done('Copy the address bar'); } };
  [['Guards 6-3 and under',{y:'all',pos:'G',h1:'75'}],['Lottery picks',{y:'all',dr:'lot'}],['Undrafted 50-dunk seasons',{y:'all',dr:'un'},[['dm','>',50]]],['Freshmen this season',{cls:'1'}],['Transfers this season',{how:'2'}],['Best layup finishers, 6-4 and under',{y:'2026',h1:'76',min:'100',sort:'lfg'}],['Dunks off the bench',{y:'2026',role:'b'}],['Bigs who shoot threes',{y:'2026',pos:'FC'},[['tpm','>',30],['dm','>',20]]],['Most career dunks',{y:'car'}],['250 lb and up',{y:'all',w0:'250'}]]
    .forEach(p=>{ const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=p[0]; b.onclick=()=>set(p[1],p[2]); $('presets').appendChild(b); });
  try{ const u=new URLSearchParams(location.search); Object.keys(DEF).forEach(k=>{ if(u.has(k)) S[k]=u.get(k); });
    if(![...SEASONS.map(String),'all','car'].includes(S.y)) S.y=DEF.y; if(S.pos&&!POS[S.pos]) S.pos=''; if(S.dr&&!DR[S.dr]) S.dr='';
    conds=S.c.split(',').map(x=>/^([a-z0-9_]+)([<>])(-?[\d.]+)$/i.exec(x)).filter(x=>x&&QS.some(q=>q[0]===x[1])).map(x=>({k:x[1],o:x[2],v:x[3]})); }catch(e){}
  sync(); if(nAdv()&&!phone()) open(true); render();
})();
</script>
