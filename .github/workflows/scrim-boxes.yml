name: Scrimmage box scores

# Preseason only: pulls box scores for played 2026-27 scrimmages from the schools' athletics sites
# (scripts/scrim_boxes.py) into scripts/data/scrimmage_results_2027.json, then commits — Vercel
# redeploys and each team's Schedule tab shows the unofficial box score. scrim_reality.py then scores
# every game with the Reality Meter and weights each player line; the next projection rebuild blends
# those lines lightly into player projections (never the record, season stats or team ratings). Also fills each upcoming scrimmage's TV (scripts/scrim_tv.py). Runs Oct 1 – Nov 10 (the script is a no-op
# once every played game has a box score). Hand-entered results (manual: true) are never overwritten.

on:
  schedule:
    # Off the top of the hour: GitHub starts :00 crons hours late at busy times (Oct 13-14: 3-5 h), and schools post
    # box scores whenever they get to them (UConn-Syracuse went up mid-morning). Hourly 9 am ET - 1 am ET, plus
    # the late-game window; once every played game has a box score each run is a quick no-op.
    - cron: '17 13-23 * 10,11 *'   # ~9:17 am – 7:17 pm ET (EDT), hourly
    - cron: '17 0-5 * 10,11 *'     # ~8:17 pm – 1:17 am ET, hourly: evening games as they finish
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrim-boxes
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull scrimmage box scores
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$(date -u +%m%d)" \> "1110" ]; then echo "Preseason over — skipping."; exit 0; fi
          pip install --quiet requests
          # each step on its own: a failure in one must never stop the box scores already pulled from being committed
          python3 scripts/scrim_boxes.py || echo "::warning::scrim_boxes failed"
          python3 scripts/scrim_tv.py || echo "::warning::scrim_tv failed"   # TV / stream for upcoming scrimmages, as schools post it
          python3 scripts/scrim_reality.py || echo "::warning::scrim_reality failed"   # Reality Meter + per-player weights
          python3 scripts/build_scrim_depth.py --apply || echo "::warning::build_scrim_depth failed"   # new depth charts, written to players (the SQL file stays as a record)

      - name: Commit if changed
        run: |
          git config user.name "tdc-scrim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/scrimmage_results_2027.json scripts/data/scrimmages_2027.json scripts/data/scrim_depth_2027.json scripts/scrim_depth_2027.sql
          if git diff --cached --quiet; then
            echo "No new box scores."
          else
            git commit -m "Auto: scrimmage box scores [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && break
              sleep $((i * 5))
            done
          fi
