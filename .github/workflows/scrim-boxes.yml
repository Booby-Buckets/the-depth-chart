name: Scrimmage box scores

# Preseason only: pulls box scores for played 2026-27 scrimmages from the schools' athletics sites
# (scripts/scrim_boxes.py) into scripts/data/scrimmage_results_2027.json, then commits — Vercel
# redeploys and each team's Schedule tab shows the unofficial box score. scrim_reality.py then scores
# every game with the Reality Meter and weights each player line; the next projection rebuild blends
# those lines lightly into player projections (never the record, season stats or team ratings). Also fills each upcoming scrimmage's TV (scripts/scrim_tv.py). Runs Oct 1 – Nov 10 (the script is a no-op
# once every played game has a box score). Hand-entered results (manual: true) are never overwritten.

on:
  schedule:
    # GitHub drops or delays a lot of scheduled runs (hourly crons fired only every ~3 h on Oct 17-18), so each run
    # POLLS: it checks every 10 minutes for up to ~5.5 hours, committing whenever a new score lands. These starts
    # (off the top of the hour) cover ~9 am – 3 am ET; a start that arrives while a poll is running waits in the
    # concurrency queue and carries the coverage on when it ends. Quiet hours 3–9 am ET: a run exits at once.
    - cron: '7 13 * 10,11 *'    # ~9 am ET
    - cron: '7 18 * 10,11 *'    # ~2 pm ET
    - cron: '7 23 * 10,11 *'    # ~7 pm ET: evening games
    - cron: '37 1 * 10,11 *'    # ~9:30 pm ET backup
    - cron: '7 4 * 10,11 *'     # ~midnight ET: late West Coast games
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Keep polling every 10 min for this many minutes (0 = one pass)"
        default: "0"

permissions:
  contents: write
  actions: write   # dispatch the projection rebuild as soon as a new box score is committed

concurrency:
  group: scrim-boxes
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll for scrimmage box scores
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOOP_MIN: ${{ github.event_name == 'schedule' && '330' || inputs.loop_minutes || '0' }}
        run: |
          if [ "$(date -u +%m%d)" \> "1110" ]; then echo "Preseason over — skipping."; exit 0; fi
          pip install --quiet requests
          git config user.name "tdc-scrim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + LOOP_MIN * 60 ))
          pass=0
          while :; do
            pass=$((pass + 1)); H=$((10#$(TZ=America/New_York date +%H)))
            if [ "$H" -ge 3 ] && [ "$H" -lt 9 ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "Quiet hours (${H}h ET) — stopping."; break; fi
            echo "::group::Pass $pass ($(TZ=America/New_York date +%H:%M) ET)"
            # each step on its own: a failure in one must never stop the box scores already pulled from being committed
            python3 scripts/scrim_boxes.py || echo "::warning::scrim_boxes failed"
            python3 scripts/scrim_wmt.py || echo "::warning::scrim_wmt failed"   # WMT-platform schools (Auburn, Georgia, Kentucky, LSU, BYU, Nebraska…): box scores from the public WMT stats API
            python3 scripts/scrim_tv.py || echo "::warning::scrim_tv failed"   # TV / stream for upcoming scrimmages, as schools post it
            python3 scripts/scrim_reality.py || echo "::warning::scrim_reality failed"   # Reality Meter + per-player weights
            python3 scripts/build_scrim_depth.py --apply || echo "::warning::build_scrim_depth failed"   # new depth charts, written to players (the SQL file stays as a record)
            python3 scripts/build_ticker.py || echo "::warning::build_ticker failed"   # the scores strip on every page
            git add scripts/data/ticker.json scripts/data/scrimmage_results_2027.json scripts/data/scrimmage_pbp_2027.json scripts/data/scrimmages_2027.json scripts/data/wmt_teams_2027.json scripts/data/scrim_depth_2027.json scripts/scrim_depth_2027.sql
            if git diff --cached --quiet; then
              echo "No new box scores."
            else
              newres=0; git diff --cached --quiet -- scripts/data/scrimmage_results_2027.json scripts/data/scrimmages_2027.json || newres=1
              git commit -q -m "Auto: scrimmage box scores [skip ci]"
              for i in 1 2 3 4 5; do
                git pull -q --rebase -X theirs origin main && git push -q && break
                sleep $((i * 5))
              done
              # a new result moves projections: rebuild now rather than when this poll ends (the rebuild queues itself)
              if [ "$newres" = 1 ]; then gh workflow run rebuild-projections.yml --ref main || echo "::warning::could not dispatch the rebuild"; fi
            fi
            echo "::endgroup::"
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 600
            git pull -q --rebase origin main || true
          done
