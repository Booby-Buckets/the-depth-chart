name: Rebuild projected DNA

# Regenerates the 2026-27 projected team DNA (ORtg/DRtg/net) from the LIVE rosters in
# Supabase — so depth-chart edits (freshman/newcomer projected stat lines) flow into the
# homepage projected rankings — then re-slims team_eff.json and commits, which triggers a
# Vercel deploy. Runs the same two builders you'd run locally:
#   build_projected_dna.py  (roster -> fingerprint -> team DNA, reconciled so o-d == net)
#   calibrate_projected_dna.py (history + program-prior calibration of ORtg/DRtg)
#   build_team_eff.py       (slim ORtg/DRtg/net file the homepage reads)
#
# Also rebuilds stat_overall_projected.json (every player's projected minutes/line/grade), so a
# depth chart reordered on the team page reaches the player pages and rankings.
#
# Also regenerates development.json (every player's season-by-season grade path — the
# player page's Development tab and development.html read it) from bbref_seasons +
# player_history, so it stays current as grades update.
#
# Triggered manually from the owner console (via the rebuild-projections edge function),
# from the Actions tab, or `gh workflow run rebuild-projections.yml` — and AUTOMATICALLY every morning
# (roster / depth-chart / sheet changes) and after every scrimmage box-score run (owner-approved Oct 9 2026).
#
# Ends by doing the owner console's publish buttons itself (scripts/headless_publish.mjs): team
# projections -> team_projections, the tdc-ratings.js rankings -> predictive_ratings (run in headless
# Chrome on the files just built, with the owner's freshman projections), awards -> award_projections.
# Needs the SUPABASE_SERVICE_KEY secret; writes are limited to those three tables and sanity-checked.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 10 * * *'   # ~6:30 ET daily: picks up overnight roster, depth-chart and injury edits
  workflow_run:
    workflows: ["Scrimmage box scores"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: rebuild-projections
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install numpy pandas scipy requests

      # player_dna.json is 50MB and gitignored, so it isn't in the checkout — build it fresh from
      # Supabase first (self-contained, anon key, stdlib only). Without this build_projected_dna.py
      # crashes on a missing file, which is why every prior run failed.
      - name: Build player DNA (roster fingerprints)
        run: python3 scripts/build_player_dna.py

      - name: Rebuild projected DNA from live rosters
        run: python3 scripts/build_projected_dna.py

      # calibrate ORtg/DRtg against 2009-2026 history + the program's last two actual seasons
      # (idempotent: reads the roster values it keeps as ORtg_roster/DRtg_roster)
      - name: Calibrate projected ORtg / DRtg
        run: python3 scripts/calibrate_projected_dna.py

      - name: Re-slim team_eff.json
        run: python3 scripts/build_team_eff.py

      # the points budget every player projection draws from (ORtg x tempo per team)
      - name: Rebuild team pace/efficiency budget (team_pace_eff.json)
        run: python3 scripts/build_team_pace_eff.py

      # stdlib-only; pulls graded seasons from bbref_seasons + player_history via the anon key
      - name: Rebuild player development paths (development.json)
        run: python3 scripts/compute_player_development.py

      # stdlib-only; per-position need + the real depth-chart STARTER at each slot (drives the
      # Portal Fit board/report), so depth-chart edits flow into "who's there now"
      - name: Rebuild team needs (team_needs.json)
        run: python3 scripts/build_team_needs.py

      # the per-player 2026-27 projection (minutes by depth_order, line, grade) that the player
      # page, team page and rankings read; depth charts edited on the team page flow in here
      - name: Rebuild player projections (stat_overall_projected.json)
        run: |
          python3 scripts/scrim_reality.py || echo "scrim_reality failed — building with the last weights"
          # BASE run with the preseason scrimmages switched off, so the Trends tab can show exactly what they moved
          SCRIM_CAP=0 SCRIM_ROT_CAP=0 SOP_OUT_DIR="$RUNNER_TEMP/scrimbase" python3 scripts/build_stat_overall_projected.py > /dev/null
          python3 scripts/build_stat_overall_projected.py

      # Reality-weighted scrimmage trends (player Trends tab, team scrimAdj) + newcomer OVR trend onto fresh_fit
      - name: Rebuild scrimmage trends (scrim_trends_2027.json)
        continue-on-error: true
        run: python3 scripts/build_scrim_trends.py --base "$RUNNER_TEMP/scrimbase"

      # the per-game TEAM lines built from those player projections, plus the exact team_projections
      # rows the owner console's "Refresh team projections" button publishes (no SQL paste needed).
      # Exit 2 = a team outside D-I ranges was left out (printed above) — the rest still ship.
      - name: Rebuild team box projections (team_projected_box.json + team_projections_rows.json)
        run: python3 scripts/build_team_projected_box.py || [ $? -eq 2 ]

      # the Transfer Portal page (transfers.html) is a join over the projections just rebuilt
      - name: Rebuild transfer portal data (data/portal_2027.json)
        continue-on-error: true   # a portal hiccup must never block saving the projections
        run: python3 scripts/build_portal.py

      - name: Commit if changed
        run: |
          git config user.name "tdc-proj-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/team_dna.json scripts/data/team_eff.json scripts/data/team_pace_eff.json scripts/data/development.json scripts/data/team_needs.json scripts/data/stat_overall_projected.json scripts/data/fresh_fit.json scripts/data/scrim_trends_2027.json scripts/data/scrimmage_results_2027.json scripts/data/team_projected_box.json scripts/data/team_projections_rows.json data/portal_2027.json data/nil_origin.json
          if git diff --cached --quiet; then
            echo "No projection changes."
          else
            git commit -m "Auto: rebuild projected DNA, development paths + team needs [skip ci]"
            # other sessions push to main all the time; rebase onto whatever landed and retry
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && break
              echo "push raced another commit (try $i); retrying"; sleep $((i*5))
            done
          fi

                # the owner console's publish buttons, headless: team projections + rankings + awards, from the files
      # just built (served locally — no waiting on the Vercel deploy)
      - name: Publish team projections, rankings + awards
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::warning::SUPABASE_SERVICE_KEY not set — skipping publish"; exit 0; fi
          python3 -m http.server 8765 >/dev/null 2>&1 &
          mkdir -p "$RUNNER_TEMP/pp" && (cd "$RUNNER_TEMP/pp" && npm init -y >/dev/null && npm i --silent puppeteer@22.15.0)
          sleep 1
          PUPPETEER_MODULE="$RUNNER_TEMP/pp/node_modules/puppeteer/lib/esm/puppeteer/puppeteer.js" BASE=http://localhost:8765/ node scripts/headless_publish.mjs
