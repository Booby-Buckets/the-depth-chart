name: Archive live odds

# Phase C — captures the live NCAAB odds board twice a day during the season:
#   • a morning snapshot (opening lines) and a near-tip evening snapshot (closing lines)
# It overwrites scripts/data/odds_live.json (the site's Best Bets feed) and appends to
# scripts/data/odds_archive.jsonl (our own growing open→close archive), then commits —
# which triggers a Vercel deploy so the Betting Lab's live board refreshes on its own.
#
# SETUP: add a repo secret named ODDS_API_KEY (Settings → Secrets and variables →
# Actions → New repository secret). Until that secret exists the job no-ops safely, so
# this workflow can be merged now and simply sits idle until you're ready / in-season.
# Platforms: US sportsbooks (us,us2) + exchanges (us_ex) + Pinnacle (the sharp reference) on the main board;
# props from the sportsbooks + the DFS pick'em apps (us_dfs); Pinnacle's team totals / first-half lines.
# Cost: main markets (spreads,totals,h2h) x 4 sources = 12 credits a run, 4 runs a day (~1.5k/month).
# Event markets cost ~28 credits PER GAME (10 sportsbook markets x 2 regions + 3 Pinnacle + 5 DFS), so each
# props run is capped at 1,200 credits (nearest tips first), so a month can never pass ~75k (100K plan).

on:
  schedule:
    - cron: '0 15 * * *'    # ~11:00 ET — the day's lines + player props / team totals / alt + 1H lines
    - cron: '0 19 * * *'    # ~15:00 ET — main lines (every book) for line moves
    - cron: '30 22 * * *'   # ~18:30 ET — near-tip lines + a second props pull (closing numbers for CLV)
    - cron: '30 1 * * *'    # ~21:30 ET — late West Coast tips
  workflow_dispatch: {}      # manual run from the Actions tab (use this to test)

permissions:
  contents: write

concurrency:
  group: archive-odds
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot the live odds board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY secret set — skipping (add it in repo Settings → Secrets to activate)."
            exit 0
          fi
          # every platform's spread/total/moneyline every run (12 credits); event markets (props, team totals,
          # alternate + first-half lines) on the 11:00 and 18:30 ET runs, capped per run by --event-budget
          H=$(date -u +%H)
          EV=""
          if [ "$H" = "15" ] || [ "$H" = "22" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EV="--events --event-budget 1200"; fi
          python3 scripts/archive_live_odds.py --markets spreads,totals,h2h --regions us,us2 --exchanges --sharp --dfs $EV

      - name: Commit if changed
        run: |
          git config user.name "tdc-odds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage only files that exist — odds files are absent until the first live run
          [ -f scripts/data/odds_live.json ] && git add scripts/data/odds_live.json || true
          [ -f scripts/data/odds_archive.jsonl ] && git add scripts/data/odds_archive.jsonl || true
          [ -f scripts/data/odds_futures.json ] && git add scripts/data/odds_futures.json || true
          [ -f scripts/data/odds_props_archive.jsonl ] && git add scripts/data/odds_props_archive.jsonl || true
          if git diff --cached --quiet; then
            echo "No odds changes."
          else
            git commit -m "Auto: archive live odds board [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      # TDC Bet edge log: price the fresh board with the site's own engine and log every bet it lists (first price
      # seen) + refresh closing prices until tip, for the Record page's results and closing-line value
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Log the edge board
        continue-on-error: true
        run: |
          [ -s scripts/data/odds_live.json ] && grep -q '"books"' scripts/data/odds_live.json || { echo "No book prices — nothing to log."; exit 0; }
          python3 -m http.server 8767 >/dev/null 2>&1 &
          mkdir -p "$RUNNER_TEMP/pp" && (cd "$RUNNER_TEMP/pp" && npm init -y >/dev/null && npm i --silent puppeteer@22.15.0)
          sleep 1
          PUPPETEER_MODULE="$RUNNER_TEMP/pp/node_modules/puppeteer/lib/esm/puppeteer/puppeteer.js" BASE=http://localhost:8767/ node scripts/snapshot_bet_picks.mjs --edges
          git add scripts/data/bet_picks_2027.json
          if git diff --cached --quiet; then echo "Edge log unchanged."; else
            git commit -m "Auto: TDC Bet edge log [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*5)); done
          fi
