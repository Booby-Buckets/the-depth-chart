name: Ingest game results

# Every finished 2026-27 D-I game → scripts/data/results_2027.json (committed, so Vercel redeploys and every
# projection on the site starts from the real record) and, when the SUPABASE_SERVICE_KEY secret is set, the
# `games` scores + `box_scores` player lines (fantasy stats, player pages), and on the three daily sweeps the
# `shots` x/y locations for the last 3 days of final games (scrape_shots.py --days 3).
# Off-season runs exit in seconds (the season window is Nov 1 – Apr 6). In season it runs every 20 minutes
# during game hours; a run with nothing new commits nothing (so no redeploy).

on:
  schedule:
    - cron: '30 3 * * *'     # ~10:30 pm ET — most evening games are final
    - cron: '15 6 * * *'     # ~1:15 am ET — late West Coast games
    - cron: '0 17 * * *'     # ~noon ET — catch-up sweep of the last three days (corrections, missed runs)
    # in season, every 20 minutes while games are on (~11 AM – 2:40 AM ET): finals reach records, standings and
    # every projection within ~20 min. Between runs the pages also count a game the moment ESPN marks it final
    # (tdc-schedule.js live merge), so this mainly keeps the DB box scores and the committed file current.
    - cron: '*/20 15-23 * 11,12,1,2,3,4 *'
    - cron: '*/20 0-6 * 11,12,1,2,3,4 *'
  workflow_dispatch:
    inputs:
      days:
        description: 'days back to sweep (or "all")'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: ingest-results
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Pull results
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          D="${{ github.event.inputs.days }}"
          if [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then D=3; fi
          case "${{ github.event.schedule }}" in "*/20 "*) D=2;; esac     # game-hour runs: today + yesterday (games past midnight)
          if [ "$D" = "all" ]; then python3 scripts/ingest_results_2027.py --all
          else python3 scripts/ingest_results_2027.py --days "${D:-2}"; fi
          python3 scripts/build_ticker.py || echo "::warning::build_ticker failed"   # the scores strip on every page
      # shot locations (x/y) for the shot charts: every final game of the last 3 days, re-scraped and upserted (idempotent),
      # on the three daily sweeps only — not the every-20-minute game-hour runs. Off-season: 0 games, a few seconds.
      - name: Shot locations (recent games)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * *' || github.event.schedule == '15 6 * * *' || github.event.schedule == '0 17 * * *'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "No service key — skipping shots."; exit 0; fi
          python3 -u scripts/scrape_shots.py --days 3 || echo "::warning::shot-location scrape failed (retries next sweep)"
      - name: Commit if changed
        run: |
          git config user.name "tdc-results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f scripts/data/results_2027.json ] && git add scripts/data/results_2027.json || true
          [ -f scripts/data/ticker.json ] && git add scripts/data/ticker.json || true
          if git diff --cached --quiet; then echo "No new results."; else
            git commit -m "Auto: game results $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase -q && git push
          fi
