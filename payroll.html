<!DOCTYPE html>
<html lang="en">
<head>
  <script src="tdc-loading.js?v=5"></script>   <!-- first, so it sees every request -->
  <link rel="stylesheet" href="tdc-a11y.css?v=3">
  <script src="tdc-a11y.js?v=2" defer></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payrolls — The Depth Chart</title>
  <meta name="description" content="Every Division I men's basketball roster for 2026-27: estimated payroll, spending power and open-market worth, from our NIL model and the schools' own federal athletics filings.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Depth Chart">
  <meta property="og:title" content="Payrolls — The Depth Chart">
  <meta property="og:description" content="Estimated 2026-27 payroll, spending power and roster worth for every D-I program.">
  <meta property="og:url" content="https://www.thedepthchartcbb.com/payroll.html">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <script src="auth.js?v=sales2"></script>
  <script src="tdc-theme.js?v=5"></script>
  <script src="team-colors.js?v=12"></script>
  <script src="tdc-teamname.js?v=1"></script>
  <script src="tdc-nil.js?v=pay10"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--up:#2e8b57;--dn:#c75d5d;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--up:#6fbf7e;--dn:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .page{padding:32px 0 56px;}
    .page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .page-h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:6px;}
    .page-sub{font-size:13px;color:var(--text2);max-width:820px;line-height:1.55;margin-bottom:16px;}
    .py-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;max-width:760px;}
    .py-sum div{padding:9px 12px;border-right:1px solid var(--border);background:var(--bg);}
    .py-sum div:last-child{border-right:0;}
    .py-sum span{display:block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);}
    .py-sum b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
    .py-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:12px;}
    .py-lab{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .py-sel,.py-search{font:600 12px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:6px 10px;border-radius:8px;outline:none;}
    .py-search{width:220px;margin-left:auto;}
    .py-table{--c1:44px;--c2:210px;}
    .py-table th.sort{cursor:pointer;user-select:none;} .py-table th.on{color:var(--text);}
    .py-table td.tm a{display:inline-flex;align-items:center;gap:7px;color:var(--text);text-decoration:none;}
    .py-table td.tm a:hover span{color:var(--accent);text-decoration:underline;}
    .py-table td.tm img,.py-table td.tm i{width:18px;height:18px;object-fit:contain;flex:none;}
    .py-table td.big{font-weight:800;}
    .py-tag{font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
    .py-tag.under{color:var(--up);} .py-tag.over{color:var(--dn);} .py-tag.fair{color:var(--text3);}
    .py-foot{font-size:11.5px;color:var(--text3);line-height:1.6;margin-top:14px;max-width:900px;}
    .py-empty{padding:48px 12px;text-align:center;color:var(--text3);}
    @media(max-width:700px){ .py-table td.tm img,.py-table td.tm i{display:inline-block;vertical-align:-4px;margin-right:6px;} .py-sum{grid-template-columns:repeat(2,minmax(0,1fr));} .py-sum div:nth-child(2){border-right:0;} .py-sum div:nth-child(-n+2){border-bottom:1px solid var(--border);} .py-search{margin-left:0;width:100%;} }
  </style>
  <link rel="stylesheet" href="tdc-skin.css?v=14"/>
  <link rel="stylesheet" href="tdc-sheets.css?v=6"/>
  <link rel="stylesheet" href="tdc-column.css?v=4"/>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="tdc-pwa.js?v=3" defer></script>
</head>
<body>
<script src="tdc-nav.js?v=81"></script>

<div class="page">
  <div class="page-eyebrow">Teams · NIL · 2026-27</div>
  <h1 class="page-h1">Payrolls</h1>
  <div class="py-sum" id="pySum"></div>
  <div class="py-bar">
    <span class="py-lab">Conference</span><select class="py-sel" id="confSel" aria-label="Conference"><option value="">All of D-I</option></select>
    <input class="py-search" id="pySearch" type="search" placeholder="Find a program…" aria-label="Find a program"/>
  </div>
  <div class="sheet-wrap" style="max-height:none;">
    <table class="sheet dense freeze2 py-table" id="pyTable">
      <thead><tr>
        <th class="rk">#</th><th class="l">Team</th><th class="l">Conf</th>
        <th class="sort" data-k="payroll" title="Our estimate of what the program pays this roster: spending power and worth combined 70/30. Estimates, not reported contracts.">Payroll</th>
        <th class="sort" data-k="power" title="What the program can put toward a roster: its basketball spending and athletics revenue (EADA), blended with the roster it built">Spending power</th>
        <th class="sort" data-k="worth" title="The roster at open-market prices, player by player">Worth</th>
        <th class="sort" data-k="ratio" title="Payroll as a share of the roster's worth: under 100% = getting players below market">% of worth</th>
        <th class="sort" data-k="used" title="Payroll as a share of spending power: over 100% = stretching">% of means</th>
        <th class="l">Read</th>
        <th class="sort" data-k="rating" title="2026-27 projected Power Rating">Rating</th>
        <th class="sort" data-k="cpp" title="Payroll per point of Power Rating above the weakest D-I team (lower = more efficient)">$ / rating pt</th>
      </tr></thead>
      <tbody id="pyBody"><tr><td class="py-empty" colspan="11">Pricing every roster…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fmt = v => v >= 1 ? '$' + v.toFixed(1) + 'M' : '$' + Math.round(v * 1000) + 'K';
  const logo = t => { try { const c = window.tdcTeamColor && tdcTeamColor(t); return c && c.logo; } catch (e) { return null; } };
  const CN = { 'BIG-12': 'Big 12', 'B10': 'Big Ten', 'Big-East': 'Big East', 'PAC-12': 'Pac-12' };
  const cn = c => CN[c] || c;
  const st = { k: 'payroll', dir: -1, conf: '', q: '' };
  let rows = [];
  function render() {
    let L = rows.filter(r => (!st.conf || r.conf === st.conf) && (!st.q || r.team.toLowerCase().includes(st.q)));
    if (st.dir === -1) L.sort((a, b) => (b[st.k] ?? -1e9) - (a[st.k] ?? -1e9)); else L.sort((a, b) => (a[st.k] ?? 1e9) - (b[st.k] ?? 1e9));
    document.querySelectorAll('#pyTable th.sort').forEach(th => th.classList.toggle('on', th.dataset.k === st.k));
    const pct = v => Math.round(v * 100) + '%';
    document.getElementById('pyBody').innerHTML = L.length ? L.map((r, i) => {
      const lg = logo(r.team), v = r.v;
      return `<tr><td class="rk">${i + 1}</td><td class="l tm"><a href="team.html?team=${encodeURIComponent(r.team)}&tab=nil">${lg ? `<img src="${lg}" alt="" loading="lazy">` : '<i></i>'}<span>${esc(r.team)}</span></a></td>` +
        `<td class="l dim">${esc(cn(r.conf))}</td><td class="big">${fmt(r.payroll)}</td><td>${fmt(r.power)}</td><td>${fmt(r.worth)}</td>` +
        `<td>${pct(r.ratio)}</td><td>${pct(r.used)}</td>` +
        `<td class="l"><span class="py-tag ${v.vsWorthTag}">${esc(v.vsWorth)}</span> <span class="py-tag ${v.vsPowerTag}">· ${esc(v.vsPower)}</span></td>` +
        `<td>${r.rating == null ? '—' : (r.rating > 0 ? '+' : '') + r.rating.toFixed(1)}</td><td>${r.cpp == null ? '—' : '$' + Math.round(r.cpp * 1000) + 'K'}</td></tr>`;
    }).join('') : '<tr><td class="py-empty" colspan="11">No programs match.</td></tr>';
  }
  document.getElementById('pyTable').querySelector('thead').addEventListener('click', e => {
    const th = e.target.closest('th.sort'); if (!th) return;
    if (st.k === th.dataset.k) st.dir *= -1; else { st.k = th.dataset.k; st.dir = th.dataset.k === 'cpp' ? 1 : -1; }
    render(); });
  document.getElementById('confSel').addEventListener('change', e => { st.conf = e.target.value; render(); });
  document.getElementById('pySearch').addEventListener('input', e => { st.q = e.target.value.trim().toLowerCase(); render(); });
  const N = window.TDC_NIL, SB = 'https://izlqhnxowdhtdofkwrho.supabase.co/rest/v1', K = 'sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  Promise.all([fetch('nil-data.json?v=gradesync19').then(r => r.json()), N.budgetsReady, N.dealsReady, N.pedigreeReady,
    fetch(SB + '/predictive_ratings?select=data&season=eq.2027', { headers: { apikey: K, Authorization: 'Bearer ' + K } }).then(r => r.ok ? r.json() : []).catch(() => [])])
  .then(([D, , , , PR]) => {
    const R = {}; ((PR[0] && PR[0].data && PR[0].data.teams) || []).forEach(t => { R[t.team] = +t.rating; });
    const floor = Math.min(...Object.values(R).filter(isFinite), 0);
    rows = Object.keys(D.teams).map(t => { const o = N.payroll(D.teams[t].players, t, D.teams[t].tier), v = N.payVerdict(o);
      const conf = (N.budgetRow(t) || {}).conf || (D.teams[t].players[0] || {}).conf || '';
      const rating = R[t] != null ? R[t] : null;
      return { team: t, conf, payroll: o.payroll, power: o.power, worth: o.worth, ratio: v.ratio, used: v.used, v, rating, cpp: rating != null ? o.payroll / Math.max(1, rating - floor) : null };
    }).filter(r => r.worth > 0);
    const confs = [...new Set(rows.map(r => r.conf).filter(Boolean))].sort((a, b) => cn(a).localeCompare(cn(b)));
    document.getElementById('confSel').insertAdjacentHTML('beforeend', confs.map(c => `<option value="${esc(c)}">${esc(cn(c))}</option>`).join(''));
    const tot = rows.reduce((a, r) => a + r.payroll, 0), big = rows.filter(r => r.payroll >= 20).length;
    const med = rows.map(r => r.payroll).sort((a, b) => a - b)[Math.floor(rows.length / 2)];
    const bargains = rows.filter(r => r.v.vsWorthTag === 'under').length;
    document.getElementById('pySum').innerHTML = [['D-I payroll', '$' + (tot / 1000).toFixed(2) + 'B'], ['$20M+ payrolls', big], ['Median payroll', fmt(med)], ['Bargain rosters', bargains]]
      .map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join('');
    render();
  }).catch(() => { document.getElementById('pyBody').innerHTML = '<tr><td class="py-empty" colspan="11">Could not load the NIL data.</td></tr>'; });
})();
</script>
<script src="tdc-version.js?v=2"></script>
<script src="tdc-sheets.js?v=2"></script>
</body>
</html>
