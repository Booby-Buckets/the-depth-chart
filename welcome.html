<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <title>Welcome — The Depth Chart</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="tdc-theme.js?v=4"></script>
  <script src="auth.js?v=shotlock1"></script>
  <script src="team-colors.js?v=6"></script>
  <script src="tdc-ratings.js?v=21"></script>
  <script src="tdc-badge.js?v=1"></script>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--red:#cc2200;--tc:#A8843C;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#141a28;--bg3:#1d2436;--border:#232b3d;--border2:#354060;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#5ab875;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .5s;}
    body::before{content:'';position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:radial-gradient(40% 50% at 20% 20%,color-mix(in srgb,var(--tc) 28%,transparent),transparent 65%),radial-gradient(45% 55% at 85% 75%,color-mix(in srgb,var(--tc) 18%,transparent),transparent 65%);filter:blur(40px);transition:background 1s;}
    .wrap{max-width:820px;margin:0 auto;padding:40px 22px 80px;}
    .logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;display:inline-block;margin-bottom:26px;}
    .logo span{color:var(--accent);}
    /* progress */
    .steps{display:flex;gap:8px;margin-bottom:26px;align-items:center;}
    .step{flex:1;height:6px;border-radius:4px;background:var(--bg3);position:relative;overflow:hidden;}
    .step>i{position:absolute;inset:0;width:0;background:var(--tc);border-radius:4px;transition:width .5s cubic-bezier(.22,1,.36,1);}
    .step.done>i,.step.on>i{width:100%;} .step.on>i{opacity:.75;}
    .steps .n{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-left:8px;white-space:nowrap;}
    .card{border:1px solid var(--border);border-radius:18px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,.14);animation:in .45s cubic-bezier(.22,1,.36,1) both;}
    @keyframes in{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);margin-bottom:8px;}
    h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;line-height:1.1;}
    .sub{font-size:14px;color:var(--text3);line-height:1.6;margin-bottom:22px;max-width:560px;}
    .sub b{color:var(--text);}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:18px;} @media(max-width:640px){.row{grid-template-columns:1fr;}}
    .lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:6px;}
    .inp{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);font-family:inherit;font-size:15px;font-weight:600;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;}
    .inp:focus{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 22%,transparent);}
    .hint{font-size:12px;margin-top:6px;min-height:16px;color:var(--text3);} .hint.ok{color:var(--green);font-weight:700;} .hint.bad{color:var(--red);font-weight:700;}
    .av-row{display:flex;align-items:center;gap:16px;}
    .av{width:84px;height:84px;border-radius:50%;background:var(--bg3);border:3px solid var(--tc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:34px;color:var(--tc);overflow:hidden;cursor:pointer;flex-shrink:0;transition:transform .2s;}
    .av:hover{transform:scale(1.04);} .av img{width:100%;height:100%;object-fit:cover;}
    .btn{font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--border2);background:var(--bg);color:var(--text2);border-radius:24px;padding:11px 22px;cursor:pointer;transition:all .15s;}
    .btn:hover{border-color:var(--tc);color:var(--text);}
    .btn.primary{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--tc) 40%,transparent);}
    .btn.primary:hover{transform:translateY(-1px);} .btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
    .btn.sm{padding:8px 14px;font-size:11px;}
    .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--border);}
    .foot .skip{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;} .foot .skip:hover{color:var(--text);}
    /* team grid */
    .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:300px;overflow:auto;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--bg);}
    .tcell{border:1px solid var(--border);border-radius:10px;padding:10px 6px 8px;text-align:center;cursor:pointer;background:var(--bg2);transition:all .15s;}
    .tcell:hover{border-color:var(--border2);transform:translateY(-1px);}
    .tcell.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--bg2));box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent);}
    .tcell img{width:40px;height:40px;object-fit:contain;display:block;margin:0 auto 6px;}
    .tcell .nm{font-size:11px;font-weight:700;line-height:1.2;color:var(--text);} .tcell .rk{font-size:10px;color:var(--text3);font-weight:600;margin-top:2px;}
    .tsearch{margin-bottom:10px;}
    /* live program card */
    .prog{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg);position:sticky;top:20px;}
    .prog .hd{padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 30%,var(--bg2)),var(--bg2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
    .prog .hd img{width:44px;height:44px;object-fit:contain;} .prog .hd .t{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;line-height:1.1;} .prog .hd .c{font-size:11px;color:var(--text3);font-weight:600;margin-top:2px;}
    .band{display:grid;grid-template-columns:repeat(3,1fr);}
    .band .cell{padding:11px 14px;border-right:1px solid var(--border);} .band .cell:last-child{border-right:none;}
    .band .v{font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums;} .band .l{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-top:4px;}
    .prog .read{padding:12px 16px;font-size:12.5px;line-height:1.6;color:var(--text2);border-top:1px solid var(--border);} .prog .read b{color:var(--text);}
    .prog .stars{padding:0 16px 12px;} .prog .stars .p{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border);} .prog .stars .p:last-child{border-bottom:none;} .prog .stars .p b{font-variant-numeric:tabular-nums;color:var(--tc);}
    .prog .empty{padding:28px 16px;text-align:center;color:var(--text3);font-size:13px;line-height:1.5;}
    /* interests */
    .chips{display:flex;flex-wrap:wrap;gap:10px;}
    .chip{border:1px solid var(--border2);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--bg);transition:all .15s;flex:1 1 220px;display:flex;gap:12px;align-items:flex-start;}
    .chip:hover{border-color:var(--tc);} .chip.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--bg));}
    .chip .ic{font-size:22px;line-height:1;} .chip .t{font-weight:800;font-size:13.5px;} .chip .d{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.4;}
    .chip .ck{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;} .chip.on .ck{background:var(--tc);border-color:var(--tc);}
    /* done */
    .launch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;} @media(max-width:640px){.launch{grid-template-columns:1fr;}}
    .lp{border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--text);background:var(--bg);display:flex;gap:12px;align-items:center;transition:all .15s;}
    .lp:hover{border-color:var(--tc);transform:translateY(-1px);} .lp .ic{font-size:20px;} .lp .t{font-weight:800;font-size:13.5px;} .lp .d{font-size:11.5px;color:var(--text3);margin-top:2px;}
    .seal-big{display:flex;align-items:center;gap:14px;margin:6px 0 16px;}
    .seal-big .who{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;display:flex;align-items:center;}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
    .confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.6s linear forwards;}
    @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2;}}
    .msg{font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;display:none;margin-bottom:14px;} .msg.show{display:block;} .msg.error{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);}
    .gate{padding:60px 20px;text-align:center;color:var(--text3);} .gate a{color:var(--accent);font-weight:700;}
  </style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="index.html">The Depth <span>Chart</span></a>
  <div class="steps" id="steps"></div>
  <div id="stage"><div class="gate">Loading…</div></div>
</div>
<div class="confetti" id="confetti"></div>
<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,'Content-Type':'application/json'};
const esc=s=>(''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const sess=()=>{ try{ return JSON.parse(localStorage.getItem('tdc_session')||'null'); }catch(e){ return null; } };
const S=sess(); const authH=()=>({...H,Authorization:'Bearer '+S.access_token});
const NEXT=new URLSearchParams(location.search).get('next')||'';
// what the user came for — picks the launchpad on the last step (kept client-side; no schema change)
const INTERESTS=[
  {k:'team',   ic:'🏟️', t:'Follow my team',        d:'Depth chart, projections, and a front door built around one program.'},
  {k:'rank',   ic:'🏆', t:'Rankings & projections', d:'Every roster graded and projected for 2026-27, updated as rosters move.'},
  {k:'players',ic:'🧬', t:'Player deep dives',      d:'Grades, shot charts, Player DNA, comps, development curves.'},
  {k:'bet',    ic:'🎯', t:'Betting angles',         d:'Trends on 20 years of games, real closing lines, the cheat sheet.'},
  {k:'portal', ic:'🔁', t:'Transfer portal & NIL',   d:'Who fits where, what players are worth, what programs pay.'},
  {k:'coach',  ic:'📋', t:'Coaching intelligence',  d:'Scouting reports, matchups, lineups, Moneyball roster math.'}
];
const LAUNCH={
  team:   t=>[{h:'program-hq.html?team='+encodeURIComponent(t||''),ic:'🏟️',t:(t||'Your team')+' HQ',d:'Your program’s front door'},{h:'team.html?team='+encodeURIComponent(t||''),ic:'📋',t:'Depth chart',d:'Roster, grades, projections'}],
  rank:   ()=>[{h:'index.html',ic:'🏆',t:'Projected rankings',d:'All of Division I, 2026-27'},{h:'projections.html',ic:'📈',t:'Projections',d:'Team and player lines'}],
  players:()=>[{h:'roster.html',ic:'🧬',t:'Player search',d:'Every graded player'},{h:'compare-players.html',ic:'⚖️',t:'Compare players',d:'Side by side, any two'}],
  bet:    ()=>[{h:'betting.html',ic:'🎯',t:'Betting Lab',d:'Trends, sharp angles, live edge'},{h:'cheatsheet.html',ic:'🗒️',t:'Cheat sheet',d:'Best bets, props, value'}],
  portal: ()=>[{h:'portal.html',ic:'🔁',t:'Transfer portal fit',d:'Rank the landing spots'},{h:'moneyball.html?tab=market',ic:'💰',t:'The NIL market',d:'What players are worth vs paid'}],
  coach:  ()=>[{h:'coach-tier.html',ic:'📋',t:"Coach's Tier",d:'Scouting, self-scout, personnel'},{h:'moneyball.html',ic:'🧩',t:'Moneyball',d:'Roster-building as math'}]
};
let TEAMS=[], PROFILE=null, state={step:0, username:'', avatarFile:null, avatarUrl:null, team:null, teamFull:null, interests:new Set(), userOk:false};
const STEPS=['Your name','Your team','What you’re here for','Ready'];

function paintSteps(){ $('steps').innerHTML=STEPS.map((s,i)=>`<div class="step ${i<state.step?'done':i===state.step?'on':''}"><i></i></div>`).join('')+`<span class="n">Step ${Math.min(state.step+1,STEPS.length)} of ${STEPS.length} · ${STEPS[Math.min(state.step,STEPS.length-1)]}</span>`; }
function setTC(hex){ document.documentElement.style.setProperty('--tc',hex||'var(--accent)'); }
function go(n){ state.step=n; paintSteps(); window.scrollTo({top:0,behavior:'smooth'}); [step1,step2,step3,step4][n](); }

async function init(){
  if(!S||!S.access_token||!S.user){ $('stage').innerHTML='<div class="gate">Create an account or sign in first — <a href="pricing.html">go to sign in</a>.</div>'; $('steps').innerHTML=''; return; }
  try{ const r=await fetch(`${SB}/rest/v1/profiles?id=eq.${S.user.id}&select=id,username,avatar_url,favorite_team,banner_color,plan,verified`,{headers:authH()}); PROFILE=(await r.json())[0]||{}; }catch(e){ PROFILE={}; }
  if(PROFILE.username) state.username=PROFILE.username; if(PROFILE.avatar_url) state.avatarUrl=PROFILE.avatar_url;
  try{ const D=await TDC_RATINGS.get(); TEAMS=(D.teams||[]).filter(t=>t.rating!=null).map(t=>({short:t.team,full:t.full,conf:t.conf,rank:t.rank,rating:t.rating})).sort((a,b)=>(a.rank||999)-(b.rank||999)); }catch(e){}
  if(PROFILE.favorite_team){ const m=TEAMS.find(t=>t.short===PROFILE.favorite_team||t.full===PROFILE.favorite_team); if(m){ state.team=m.short; state.teamFull=m.full; setTC(tdcTeamColorHex(m.full)); } }
  go(0);
}

// ── Step 1: username + avatar ──
function step1(){
  const ini=(state.username||S.user.email||'U')[0].toUpperCase();
  $('stage').innerHTML=`<div class="card">
    <div class="eyebrow">Welcome to The Depth Chart</div>
    <h1>First, who are you?</h1>
    <div class="sub">Pick the name people will see on the forum, the members page and your profile. You can change it any time.</div>
    <div class="msg error" id="m1"></div>
    <div class="row">
      <div>
        <label class="lbl">Username</label>
        <input class="inp" id="uname" maxlength="30" placeholder="e.g. courtside_kev" value="${esc(state.username)}" autocomplete="off" spellcheck="false">
        <div class="hint" id="uhint">3–30 characters · letters, numbers, underscores</div>
      </div>
      <div>
        <label class="lbl">Profile photo <span style="font-weight:600;letter-spacing:0;text-transform:none;">(optional)</span></label>
        <div class="av-row">
          <div class="av" id="av" onclick="$('avin').click()">${state.avatarUrl?`<img src="${esc(state.avatarUrl)}">`:ini}</div>
          <div><button class="btn sm" onclick="$('avin').click()">Upload photo</button><div class="hint">JPG or PNG · shown next to your name</div></div>
          <input type="file" id="avin" accept="image/*" style="display:none" onchange="pickAvatar(event)">
        </div>
      </div>
    </div>
    <div class="foot"><span></span><button class="btn primary" id="next1" disabled onclick="saveStep1()">Continue →</button></div>
  </div>`;
  const inp=$('uname'); let tmr=null;
  inp.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(checkName,300); });
  if(state.username) checkName();
  inp.focus();
}
async function checkName(){
  const v=$('uname').value.trim(), h=$('uhint'), b=$('next1'); state.userOk=false; b.disabled=true;
  if(!/^[A-Za-z0-9_]{3,30}$/.test(v)){ h.className='hint'+(v?' bad':''); h.textContent=v?'Letters, numbers and underscores only, 3–30 characters.':'3–30 characters · letters, numbers, underscores'; return; }
  h.className='hint'; h.textContent='Checking…';
  try{ const r=await fetch(`${SB}/rest/v1/profiles?username=ilike.${encodeURIComponent(v)}&select=id`,{headers:authH()}); const rows=await r.json();
    const taken=rows.some(x=>x.id!==S.user.id);
    if(taken){ h.className='hint bad'; h.textContent='That name is taken — try another.'; return; }
    h.className='hint ok'; h.textContent='✓ '+v+' is yours'; state.username=v; state.userOk=true; b.disabled=false;
  }catch(e){ h.className='hint'; h.textContent='Could not check right now.'; state.username=v; state.userOk=true; b.disabled=false; }
}
function pickAvatar(e){ const f=e.target.files[0]; if(!f) return; state.avatarFile=f; const rd=new FileReader(); rd.onload=ev=>{ $('av').innerHTML=`<img src="${ev.target.result}">`; }; rd.readAsDataURL(f); }
async function saveStep1(){
  if(!state.userOk) return; const b=$('next1'); b.disabled=true; b.textContent='Saving…';
  let avatar_url=state.avatarUrl;
  if(state.avatarFile){ try{ const ext=(state.avatarFile.name.split('.').pop()||'jpg').toLowerCase(); const path=`${S.user.id}/avatar.${ext}`;
      const up=await fetch(`${SB}/storage/v1/object/avatars/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':state.avatarFile.type,'x-upsert':'true'},body:state.avatarFile});
      if(up.ok) avatar_url=`${SB}/storage/v1/object/public/avatars/${path}?t=${Date.now()}`; }catch(e){} }
  try{ const r=await fetch(`${SB}/rest/v1/profiles?id=eq.${S.user.id}`,{method:'PATCH',headers:{...authH(),Prefer:'return=minimal'},body:JSON.stringify({username:state.username,avatar_url})});
    if(!r.ok){ const t=await r.text(); throw new Error(/username_key/.test(t)?'That username is already taken.':'Could not save.'); }
    state.avatarUrl=avatar_url; go(1);
  }catch(e){ const m=$('m1'); m.textContent=e.message; m.classList.add('show'); b.disabled=false; b.textContent='Continue →'; }
}

// ── Step 2: pick a team (the page themes itself + a live program card) ──
function step2(){
  $('stage').innerHTML=`<div class="card">
    <div class="eyebrow">Nice to meet you, ${esc(state.username)}</div>
    <h1>Who do you follow?</h1>
    <div class="sub">Pick a program and the site builds around it — your team on top of the rankings, a Program HQ front door, and your colors here. <b>Tap a team</b> to see where we have it.</div>
    <div class="row" style="grid-template-columns:1.25fr 1fr">
      <div>
        <input class="inp tsearch" id="tq" placeholder="Search 360+ programs…" autocomplete="off">
        <div class="tgrid" id="tgrid"></div>
      </div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="foot"><button class="skip" onclick="go(2)">Skip — no favorite</button><button class="btn primary" id="next2" ${state.team?'':'disabled'} onclick="saveStep2()">Continue →</button></div>
  </div>`;
  paintGrid(''); paintProg();
  $('tq').addEventListener('input',e=>paintGrid(e.target.value));
}
function paintGrid(q){
  q=(q||'').toLowerCase().trim();
  const list=(q?TEAMS.filter(t=>t.full.toLowerCase().includes(q)||t.short.toLowerCase().includes(q)||(t.conf||'').toLowerCase().includes(q)):TEAMS).slice(0,q?60:48);
  $('tgrid').innerHTML=list.map(t=>{ const c=tdcTeamColor(t.full)||{}; return `<div class="tcell ${state.team===t.short?'on':''}" data-s="${esc(t.short)}" onclick="pickTeam('${esc(t.short).replace(/'/g,"\\'")}')">${c.logo?`<img src="${c.logo}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}<div class="nm">${esc(tdcShortSchool?tdcShortSchool(t.full):t.full)}</div><div class="rk">#${t.rank||'—'}</div></div>`; }).join('')||'<div style="padding:20px;color:var(--text3);font-size:12px;grid-column:1/-1;text-align:center">No program matches.</div>';
}
function pickTeam(short){ const t=TEAMS.find(x=>x.short===short); if(!t) return; state.team=t.short; state.teamFull=t.full; setTC(tdcTeamColorHex(t.full)); document.querySelectorAll('.tcell').forEach(c=>c.classList.toggle('on',c.dataset.s===short)); $('next2').disabled=false; paintProg(); }
const GOALS=[{rtg:26,l:'Title contender'},{rtg:23,l:'Final Four contender'},{rtg:19,l:'Sweet 16 caliber'},{rtg:17,l:'Protected seed'},{rtg:13,l:'Tournament team'},{rtg:8,l:'Bubble'},{rtg:-99,l:'Rebuilding'}];
async function paintProg(){
  const el=$('prog'); if(!el) return;
  if(!state.team){ el.innerHTML='<div class="empty">Pick a program to see its 2026-27 projection, its tier and its top players.</div>'; return; }
  const t=TEAMS.find(x=>x.short===state.team); const c=tdcTeamColor(t.full)||{}; const wins=Math.max(4,Math.min(35,15.91+0.548*t.rating)); const tier=GOALS.find(g=>t.rating>=g.rtg);
  el.innerHTML=`<div class="hd">${c.logo?`<img src="${c.logo}" alt="">`:''}<div><div class="t">${esc(t.full)}</div><div class="c">${esc(t.conf||'')} · projected 2026-27</div></div></div>
    <div class="band"><div class="cell"><div class="v">#${t.rank||'—'}</div><div class="l">Projected</div></div><div class="cell"><div class="v">${t.rating>0?'+':''}${t.rating.toFixed(1)}</div><div class="l">Power rating</div></div><div class="cell"><div class="v">${wins.toFixed(0)}</div><div class="l">Proj. wins</div></div></div>
    <div class="read">We have <b>${esc(tdcShortSchool?tdcShortSchool(t.full):t.full)}</b> as a <b>${tier?tier.l.toLowerCase():'—'}</b> next season${t.rank&&t.rank<=25?' — a top-25 roster':t.rank&&t.rank<=68?' — on the tournament line':''}.</div>
    <div class="stars" id="stars"><div style="font-size:11px;color:var(--text3);padding:8px 0">Loading the roster…</div></div>`;
  try{ const r=await fetch(`${SB}/rest/v1/players?team=eq.${encodeURIComponent(t.short)}&select=name,position,tdc_grade&order=tdc_grade.desc.nullslast&limit=3`,{headers:H}); const ps=await r.json();
    const st=$('stars'); if(st&&state.team===t.short) st.innerHTML=ps.length?ps.map(p=>`<div class="p"><span>${esc(p.name)} <span style="color:var(--text3)">${esc(p.position||'')}</span></span><b>${p.tdc_grade!=null?Math.round(p.tdc_grade):'—'}</b></div>`).join(''):''; }catch(e){}
}
async function saveStep2(){
  const b=$('next2'); b.disabled=true; b.textContent='Saving…';
  const col=state.teamFull?(tdcTeamColorHex(state.teamFull)||null):null;
  try{ await fetch(`${SB}/rest/v1/profiles?id=eq.${S.user.id}`,{method:'PATCH',headers:{...authH(),Prefer:'return=minimal'},body:JSON.stringify({favorite_team:state.team,...(col?{banner_color:col}:{})})});
    try{ localStorage.setItem('tdc_fav',state.team); }catch(e){} }catch(e){}
  go(2);
}

// ── Step 3: interests ──
function step3(){
  $('stage').innerHTML=`<div class="card">
    <div class="eyebrow">Almost there</div>
    <h1>What are you here for?</h1>
    <div class="sub">Pick as many as you like — we’ll set up your starting points on the next screen.</div>
    <div class="chips">${INTERESTS.map(i=>`<div class="chip ${state.interests.has(i.k)?'on':''}" data-k="${i.k}" onclick="toggleInt('${i.k}')"><div class="ic">${i.ic}</div><div><div class="t">${i.t}</div><div class="d">${i.d}</div></div><div class="ck">✓</div></div>`).join('')}</div>
    <div class="foot"><button class="skip" onclick="finish()">Skip</button><button class="btn primary" onclick="finish()">Finish →</button></div>
  </div>`;
}
function toggleInt(k){ if(state.interests.has(k)) state.interests.delete(k); else state.interests.add(k); document.querySelector(`.chip[data-k="${k}"]`).classList.toggle('on'); }
function finish(){ try{ localStorage.setItem('tdc_interests',JSON.stringify([...state.interests])); localStorage.setItem('tdc_onboarded','1'); }catch(e){} go(3); }

// ── Step 4: done ──
function step4(){
  const picks=[...state.interests]; if(!picks.length) picks.push(state.team?'team':'rank','players');
  const links=[]; picks.forEach(k=>{ (LAUNCH[k]?LAUNCH[k](state.team):[]).forEach(l=>{ if(!links.some(x=>x.h===l.h)) links.push(l); }); });
  if(links.length<4) LAUNCH.rank().concat(LAUNCH.players()).forEach(l=>{ if(links.length<4&&!links.some(x=>x.h===l.h)) links.push(l); });
  const badge=(window.TDC_BADGE?TDC_BADGE.html(PROFILE,{size:'22px',ml:'8px'}):'');
  const av=state.avatarUrl?`<div class="av" style="width:56px;height:56px;font-size:22px"><img src="${esc(state.avatarUrl)}"></div>`:`<div class="av" style="width:56px;height:56px;font-size:22px">${(state.username||'U')[0].toUpperCase()}</div>`;
  $('stage').innerHTML=`<div class="card">
    <div class="eyebrow">You’re set</div>
    <h1>Welcome in, ${esc(state.username)}.</h1>
    <div class="seal-big">${av}<div><div class="who">${esc(state.username)}${badge}</div><div style="font-size:12px;color:var(--text3);font-weight:600">${state.teamFull?esc(state.teamFull)+' · ':''}${window.TDC_BADGE?TDC_BADGE.label(PROFILE):'Free'} member</div></div></div>
    <div class="sub">Here’s where to start, based on what you picked. Your profile, plan and favorite team all live on the <b>Account</b> page.</div>
    <div class="launch">${links.slice(0,6).map(l=>`<a class="lp" href="${l.h}"><div class="ic">${l.ic}</div><div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d)}</div></div></a>`).join('')}</div>
    <div class="foot"><a class="skip" href="profile.html" style="text-decoration:none">View my profile</a><a class="btn primary" href="${NEXT&&/^[a-z0-9\-]+\.html/i.test(NEXT)?esc(NEXT):(state.team?'program-hq.html?team='+encodeURIComponent(state.team):'index.html')}" style="text-decoration:none">Take me in →</a></div>
  </div>`;
  confetti();
}
function confetti(){ const c=$('confetti'); const cols=[getComputedStyle(document.documentElement).getPropertyValue('--tc').trim()||'#A8843C','#E6D5A8','#fff','#5ab875']; let h='';
  for(let i=0;i<70;i++){ h+=`<i style="left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(2+Math.random()*1.6).toFixed(2)}s;transform:rotate(${Math.random()*360}deg)"></i>`; }
  c.innerHTML=h; setTimeout(()=>{ c.innerHTML=''; },4500); }
init();
</script>
</body>
