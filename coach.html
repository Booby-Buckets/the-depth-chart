<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1f9d57;--red:#cf5a4e;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .nav-wrap{border-bottom:1px solid var(--border);background:rgba(250,249,246,.66);backdrop-filter:blur(18px) saturate(180%);position:sticky;top:0;z-index:200;}
    [data-theme="dark"] .nav-wrap{background:rgba(20,20,22,.84);border-bottom-color:rgba(26,43,68,.9);}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);letter-spacing:-.01em;}
    .nav-logo span{color:var(--accent);}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-toggle:hover{border-color:var(--accent);color:var(--text);}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:0 14px;height:100%;display:flex;align-items:center;position:relative;white-space:nowrap;flex-shrink:0;transition:color .2s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a.active{color:var(--text);}
    .nav-sub a:hover{color:var(--text);}
    .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 90px;}
    .back{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;display:inline-block;margin-bottom:16px;}
    .back:hover{color:var(--accent);}
    /* hero */
    .chero{display:flex;align-items:center;gap:24px;padding:26px 28px;border-radius:18px;border:1px solid var(--border);
      background:radial-gradient(130% 170% at 0% 0%,color-mix(in srgb,var(--accent) 16%,var(--bg2)),var(--bg2));}
    .chero-mono{width:86px;height:86px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-family:'Playfair Display',serif;font-weight:800;font-size:33px;color:var(--accent);letter-spacing:-.01em;
      background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 30%,var(--bg3)),var(--bg3));
      border:2px solid color-mix(in srgb,var(--accent) 38%,var(--border2));}
    .chero .ey{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
    .chero h1{font-family:'Playfair Display',serif;font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1;margin:5px 0 8px;}
    .chero .meta{font-size:13.5px;color:var(--text2);font-weight:600;}
    .chero .arch{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#221c08;background:var(--accent);padding:6px 13px;border-radius:20px;display:inline-block;margin-top:12px;}
    /* stat strip */
    .cstrip{display:flex;flex-wrap:wrap;margin:16px 0 8px;border:1px solid var(--border);border-radius:14px;background:var(--bg2);overflow:hidden;}
    .cstat{flex:1 1 0;min-width:120px;padding:15px 18px;border-left:1px solid var(--border);}
    .cstat:first-child{border-left:none;}
    .cstat .n{font-family:'Playfair Display',serif;font-weight:800;font-size:25px;line-height:1;}
    .cstat .l{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    .sec-t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:34px 0 14px;display:flex;align-items:center;gap:12px;}
    .sec-t::after{content:'';flex:1;height:1px;background:var(--border);}
    .sec-t span{color:var(--text3);font-weight:600;letter-spacing:0;text-transform:none;}
    .grid2{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;}
    .card{border:1px solid var(--border);border-radius:14px;background:var(--bg2);padding:18px;}
    .radar-wrap{text-align:center;}
    .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 2px;}
    .tag{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);background:rgba(168,132,60,.1);border:1px solid rgba(168,132,60,.25);padding:3px 8px;border-radius:20px;}
    .tl-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
    .wchart{width:100%;height:auto;display:block;overflow:visible;}
    .wchart .wbar{transition:opacity .15s;cursor:default;}
    .wchart .wbar:hover{opacity:1!important;}
    /* style trends */
    .sc-legend{display:flex;gap:16px;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;}
    .sc-legend span{display:inline-flex;align-items:center;gap:6px;} .sc-legend i{width:12px;height:3px;border-radius:2px;}
    .sc-chart{width:100%;height:auto;display:block;overflow:visible;}
    .trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:14px;}
    .tcard{border:1px solid var(--border);border-radius:12px;background:var(--bg2);padding:12px 13px;}
    .tc-top{display:flex;justify-content:space-between;align-items:baseline;}
    .tc-l{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .tc-v{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;}
    .tc-spark{margin:8px 0 6px;height:30px;} .tc-spark svg{width:100%;height:30px;}
    .tc-d{font-size:9.5px;font-weight:700;}
    /* best team */
    .bt-card{border:1px solid var(--border);border-radius:14px;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 8%,var(--bg2)),var(--bg2));padding:20px;}
    .bt-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
    .bt-year{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;}
    .bt-school{font-size:16px;font-weight:800;}
    .bt-line{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:14px;}
    .bt-line b{color:var(--text);} .bt-srs{color:var(--green);font-weight:800;}
    .bt-roster{display:flex;flex-wrap:wrap;gap:8px;}
    .bt-p{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 11px;transition:border-color .15s,transform .15s;}
    .bt-p:hover{border-color:var(--accent);transform:translateY(-1px);}
    .bt-p .g{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;}
    .bt-p .pn{font-size:12.5px;font-weight:700;} .bt-p .pp{font-size:10px;color:var(--text3);font-weight:600;}
    /* player lists */
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    .plist{border:1px solid var(--border);border-radius:14px;background:var(--bg2);overflow:hidden;}
    .plist h3{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);padding:15px 18px 3px;}
    .plist .sub{font-size:10.5px;color:var(--text3);padding:0 18px 10px;}
    .prow{display:flex;align-items:center;gap:12px;padding:9px 18px;border-top:1px solid var(--border);transition:background .12s;}
    .prow:hover{background:var(--bg3);}
    .prk{font-family:'Playfair Display',serif;font-weight:800;font-size:14px;color:var(--text3);width:16px;text-align:center;flex-shrink:0;}
    .pnm{flex:1;min-width:0;} .pnm .n{font-size:13.5px;font-weight:700;line-height:1.15;}
    .pnm .s{font-size:10.5px;color:var(--text3);font-weight:500;}
    .parc{display:flex;align-items:center;gap:7px;flex-shrink:0;font-variant-numeric:tabular-nums;}
    .parc .g0{color:var(--text3);font-weight:700;font-size:13px;} .parc .ar{color:var(--text3);}
    .parc .g1{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;}
    .parc .d{font-size:11px;font-weight:800;color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);padding:2px 7px;border-radius:6px;}
    .grade-badge{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;flex-shrink:0;}
    .loading{padding:80px;text-align:center;color:var(--text3);}
    @media(max-width:820px){.grid2{grid-template-columns:1fr;}.cols{grid-template-columns:1fr;}}
    @media(max-width:680px){.nav-top,.nav-sub{padding-left:16px;padding-right:16px;}.chero h1{font-size:34px;}}
  </style>
</head>

    </div>
    <div class="nav-sub">
      <a href="index.html">Rankings</a><a href="roster.html">Players</a><a href="draft.html">Draft</a>

    </div>

<script>
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';try{localStorage.setItem('tdc_theme',d?'light':'dark');}catch(e){}}
(function(){try{var s=localStorage.getItem('tdc_theme');if(s){document.documentElement.setAttribute('data-theme',s);var b=document.getElementById('themeBtn');if(b)b.textContent=s==='dark'?'☀️':'🌙';}}catch(e){}})();

const AXES=[['Pace','poss_pg'],['Bench','rotation_size'],['3PT Vol','three_pa_rate'],['Ball Move','ast_rate'],['TO Force','opp_tov_pg'],['Star Use','top_scorer_share']];
function seasonLbl(y){y=+y;return (y-1)+'-'+(''+y).slice(2);}
function plink(eid,nm){ return eid?('player.html?espn='+eid):('player.html?name='+encodeURIComponent(nm||'')); }
function gradeColor(g){ g=+g; return g>=90?'#5ab875':g>=82?'var(--accent)':g>=74?'var(--text)':'var(--text2)'; }

function radar(p, size){
  var cx=size/2, cy=size/2, R=size/2-36, n=AXES.length;
  function pt(i,r){var ang=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r];}
  var rings='';
  [0.25,0.5,0.75,1].forEach(function(f){ rings+='<polygon points="'+AXES.map((_,i)=>pt(i,R*f).join(',')).join(' ')+'" fill="none" stroke="var(--border)" stroke-width="1"/>'; });
  var spokes='',labels='';
  AXES.forEach(function(a,i){
    var e=pt(i,R); spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--border)" stroke-width="1"/>';
    var l=pt(i,R+20), v=(p.pctl&&p.pctl[a[1]])||0;
    labels+='<text x="'+l[0]+'" y="'+l[1]+'" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="var(--text3)">'+a[0]+'</text>'+
      '<text x="'+l[0]+'" y="'+(l[1]+11)+'" text-anchor="middle" font-size="9" font-weight="800" fill="var(--accent)">'+v+'</text>';
  });
  var poly=AXES.map(function(a,i){var v=(p.pctl&&p.pctl[a[1]])||0;return pt(i,R*v/100).join(',');}).join(' ');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+rings+spokes+
    '<polygon points="'+poly+'" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>'+labels+'</svg>';
}

function num(v,d){ return v==null?'—':(typeof v==='number'?v.toFixed(d==null?1:d):v); }

// mini trend line
function spark(vals,color,w,h){
  var v=vals.filter(x=>x!=null); if(v.length<2) return '';
  var mn=Math.min(...v),mx=Math.max(...v),rng=(mx-mn)||1;
  var pts=vals.map((x,i)=> x==null?null:((i/(vals.length-1)*w).toFixed(1)+','+(h-(x-mn)/rng*h).toFixed(1))).filter(Boolean).join(' ');
  var lastI=vals.length-1; while(lastI>=0&&vals[lastI]==null)lastI--;
  var cx=lastI/(vals.length-1)*w, cy=vals[lastI]==null?h:(h-(vals[lastI]-mn)/rng*h);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="2.4" fill="'+color+'"/></svg>';
}
function trendCard(trend,label,key,color,dec){
  var vals=trend.map(t=>t[key]); var v=vals.filter(x=>x!=null); if(v.length<2) return '';
  var first=v[0],last=v[v.length-1],d=last-first;
  return '<div class="tcard"><div class="tc-top"><span class="tc-l">'+label+'</span><span class="tc-v">'+last.toFixed(dec||1)+'</span></div>'+
    '<div class="tc-spark">'+spark(vals,color,120,30)+'</div>'+
    '<div class="tc-d" style="color:'+(d>=0?'var(--green)':'var(--red)')+'">'+(d>=0?'▲ +':'▼ −')+Math.abs(d).toFixed(1)+' since '+seasonLbl(trend[0].yr)+'</div></div>';
}
// points scored vs allowed over the career
function scoringChart(trend){
  var t=trend.filter(x=>x.ppg!=null||x.oppg!=null); if(t.length<2) return '';
  var W=720,H=210,pl=38,pr=78,pt=16,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  var all=[]; t.forEach(x=>{if(x.ppg!=null)all.push(x.ppg);if(x.oppg!=null)all.push(x.oppg);});
  var mn=Math.floor(Math.min(...all)-2),mx=Math.ceil(Math.max(...all)+2);
  var X=i=>pl+iw*i/(t.length-1), Y=v=>pt+ih*(1-(v-mn)/(mx-mn));
  var g='';
  for(var v=Math.ceil(mn/5)*5;v<=mx;v+=5){ var y=Y(v); g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--border)"/><text x="'+(pl-7)+'" y="'+(y+3)+'" text-anchor="end" font-size="9.5" fill="var(--text3)">'+v+'</text>'; }
  t.forEach((x,i)=>{ if(i%Math.ceil(t.length/8)===0||i===t.length-1) g+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5" fill="var(--text3)">\''+(''+x.yr).slice(2)+'</text>'; });
  function ln(key,col){ var pts=t.map((x,i)=>x[key]==null?null:(X(i)+','+Y(x[key]))).filter(Boolean).join(' ');
    var li=t.length-1; return '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>'+
      '<circle cx="'+X(li)+'" cy="'+Y(t[li][key])+'" r="3.5" fill="'+col+'"/><text x="'+(X(li)+8)+'" y="'+(Y(t[li][key])+3)+'" font-size="11" font-weight="800" fill="'+col+'">'+t[li][key].toFixed(1)+'</text>'; }
  g+=ln('ppg','var(--green)')+ln('oppg','var(--red)');
  return '<div class="sc-legend"><span><i style="background:var(--green)"></i>Points scored</span><span><i style="background:var(--red)"></i>Points allowed</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" class="sc-chart">'+g+'</svg>';
}

// Career wins by season — bar chart (replaces the long timeline table)
function winsChart(ss){
  var s=(ss||[]).filter(Boolean).slice().sort((a,b)=>a.season_year-b.season_year);
  if(!s.length) return '';
  var W=760,H=196, pl=6,pr=6,pt=22,pb=38, iw=W-pl-pr, ih=H-pt-pb;
  var maxW=Math.max.apply(null,s.map(x=>x.wins||0).concat([1]));
  var n=s.length, gap=n>15?5:8, bw=Math.min(48,(iw-gap*(n-1))/n);
  var span=bw*n+gap*(n-1), x0=pl+(iw-span)/2;
  var bestI=0; s.forEach((x,i)=>{ if((x.wins||0)>(s[bestI].wins||0)) bestI=i; });
  var g='<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(W-pr)+'" y2="'+(pt+ih)+'" stroke="var(--border2)" stroke-width="1"/>';
  s.forEach(function(x,i){
    var xx=x0+i*(bw+gap), has=x.wins!=null;
    var bh=has?Math.max(2,ih*((x.wins||0)/maxW)):0, yy=pt+ih-bh, best=i===bestI&&has;
    var tip=seasonLbl(x.season_year)+' · '+x.school+(has?' · '+x.wins+'-'+x.losses:'')+(x.srs!=null?' · '+(x.srs>=0?'+':'')+x.srs.toFixed(1)+' SRS':'');
    if(has){
      g+='<rect class="wbar" x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--accent)" fill-opacity="'+(best?'1':'.5')+'"><title>'+tip+'</title></rect>'+
        '<text x="'+(xx+bw/2).toFixed(1)+'" y="'+(yy-5).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--text2)">'+x.wins+'</text>';
    } else {
      g+='<text x="'+(xx+bw/2).toFixed(1)+'" y="'+(pt+ih-4)+'" text-anchor="middle" font-size="10" fill="var(--text3)">—</text>';
    }
    if(n<=16 || i%2===0 || i===n-1) g+='<text x="'+(xx+bw/2).toFixed(1)+'" y="'+(pt+ih+15)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--text3)">'+(''+x.season_year).slice(2)+'</text>';
  });
  // school-run labels + dividers when the coach spans multiple schools
  if([...new Set(s.map(x=>x.school))].length>1){
    var rs=0;
    for(var i=1;i<=n;i++){
      if(i===n || s[i].school!==s[rs].school){
        var mx=x0+((rs+i-1)/2)*(bw+gap)+bw/2;
        g+='<text x="'+mx.toFixed(1)+'" y="'+(pt-9)+'" text-anchor="middle" font-size="9" font-weight="800" letter-spacing=".05em" fill="var(--text3)">'+s[rs].school.toUpperCase()+'</text>';
        if(i<n){ var dx=x0+(i-0.5)*(bw+gap)-gap/2; g+='<line x1="'+dx.toFixed(1)+'" y1="'+pt+'" x2="'+dx.toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--border)" stroke-dasharray="2 3"/>'; }
        rs=i;
      }
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" class="wchart">'+g+'</svg>';
}

function render(p, ss, pg){
  var stat=(n,l,c)=>'<div class="cstat"><div class="n"'+(c?' style="color:'+c+'"':'')+'>'+n+'</div><div class="l">'+l+'</div></div>';
  var initials=(p.coach||'').trim().split(/\s+/).slice(0,2).map(w=>(w[0]||'')).join('').toUpperCase();
  var devCell=p.dev_delta!=null?stat((p.dev_delta>=0?'+':'')+p.dev_delta.toFixed(1),'Player Dev'+(p.dev_pctl!=null?' · '+p.dev_pctl+'%ile':''),(p.dev_delta>=0?'var(--green)':'var(--red)')):'';

  var html='<a class="back" href="coaches.html">← Coaching Lab</a>'+
    '<div class="chero"><div class="chero-mono">'+initials+'</div>'+
      '<div class="chero-body"><div class="ey">Head Coach</div><h1>'+p.coach+'</h1>'+
      '<div class="meta">'+p.schools+' · '+seasonLbl(p.first_year)+' – '+seasonLbl(p.last_year)+'</div>'+
      '<span class="arch">'+p.archetype+'</span></div></div>'+
    '<div class="cstrip">'+stat(p.wins+'-'+p.losses,'Record')+stat((p.win_pct*100).toFixed(1)+'%','Win %')+
      stat(p.seasons,'Seasons')+stat((p.avg_srs>=0?'+':'')+num(p.avg_srs),'Avg SRS')+
      (pg?stat(pg.tny_apps+' / '+pg.tny_wins,'NCAA Apps / Wins'):'')+
      (pg?stat(pg.players_coached,'Players Coached'):'')+devCell+'</div>';

  // Career by season — bar chart (replaces the long timeline table)
  if(ss&&ss.length){
    html+='<div class="sec-t">Career by Season <span>wins per year · best season highlighted</span></div>'+
      '<div class="card">'+winsChart(ss)+'</div>';
  }

  // Coaching style — radar paired with the scoring chart so neither column is a void
  var tr=(pg&&pg.trend)?pg.trend.slice().sort((a,b)=>a.yr-b.yr):[];
  var scoring=tr.length>=2?scoringChart(tr):'';
  var tagsHtml='<div class="tags">'+(p.tags||'').split(', ').filter(Boolean).map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+
    '<div style="font-size:10px;color:var(--text3);margin-top:8px;">Percentiles vs all 952 coaches</div>';
  html+='<div class="sec-t">Coaching Style <span>his tendencies &amp; scoring identity</span></div>';
  if(scoring){
    html+='<div class="grid2"><div class="card radar-wrap">'+radar(p,300)+tagsHtml+'</div>'+
      '<div class="card"><div class="tl-h">Points Scored vs Allowed</div>'+scoring+'</div></div>';
  } else {
    html+='<div class="card radar-wrap" style="max-width:440px;margin:0 auto;">'+radar(p,300)+tagsHtml+'</div>';
  }

  // style trend mini-cards
  if(tr.length>=2){
    var AC='var(--accent)';
    var cards=[trendCard(tr,'Pace','poss_pg',AC,1),trendCard(tr,'3PT Rate','three_pa_rate',AC,1),trendCard(tr,'Bench Min%','bench_min_pct',AC,1),trendCard(tr,'Ball Move','ast_rate',AC,1),trendCard(tr,'TO Force','opp_tov_pg',AC,1),trendCard(tr,'Star Use','top_scorer_share',AC,1)].filter(Boolean).join('');
    if(cards) html+='<div class="trend-grid">'+cards+'</div>';
  }

  if(pg){
    // best ever team
    var bt=pg.best_team;
    if(bt){
      html+='<div class="sec-t">Best Team <span>peak season by SRS</span></div>'+
        '<div class="bt-card"><div class="bt-top"><span class="bt-year">'+seasonLbl(bt.year)+'</span><span class="bt-school">'+bt.school+'</span></div>'+
        '<div class="bt-line"><b>'+bt.wins+'-'+bt.losses+'</b>'+(bt.conf?' · '+bt.conf:'')+(bt.srs!=null?' · <span class="bt-srs">'+(bt.srs>=0?'+':'')+bt.srs.toFixed(1)+' SRS</span>':'')+'</div>'+
        '<div class="bt-roster">'+(bt.roster||[]).map(r=>'<a class="bt-p" href="'+plink(r.espn_id,r.player)+'"><span class="g" style="color:'+gradeColor(r.grade)+'">'+r.grade+'</span><span><div class="pn">'+r.player+'</div><div class="pp">'+(r.pos||'')+'</div></span></a>').join('')+'</div></div>';
    }
    // best players + developers
    var pr=(pg.best_players||[]).map((r,i)=>'<a class="prow" href="'+plink(r.espn_id,r.player)+'"><span class="prk">'+(i+1)+'</span>'+
      '<span class="pnm"><div class="n">'+r.player+'</div><div class="s">'+(r.pos||'')+' · '+(r.years?seasonLbl(r.years[0])+(r.years[1]!==r.years[0]?'–'+(''+r.years[1]).slice(2):''):'')+' · '+r.seasons+' yr</div></span>'+
      '<span class="grade-badge" style="color:'+gradeColor(r.grade)+'">'+r.grade+'</span></a>').join('');
    var dv=(pg.dev_players||[]).map((r,i)=>'<a class="prow" href="'+plink(r.espn_id,r.player)+'"><span class="prk">'+(i+1)+'</span>'+
      '<span class="pnm"><div class="n">'+r.player+'</div><div class="s">'+seasonLbl(r.from_year)+' → '+seasonLbl(r.to_year)+'</div></span>'+
      '<span class="parc"><span class="g0">'+r.from+'</span><span class="ar">→</span><span class="g1" style="color:'+gradeColor(r.to)+'">'+r.to+'</span><span class="d">+'+r.gain+'</span></span></a>').join('');
    html+='<div class="sec-t">The Talent <span>who he coached & who grew most</span></div>'+
      '<div class="cols"><div class="plist"><h3>Best Players Coached</h3><div class="sub">by peak TDC grade under this coach</div>'+(pr||'<div class="sub" style="padding:14px 18px;">No graded players.</div>')+'</div>'+
      '<div class="plist"><h3>Top Developers</h3><div class="sub">biggest grade climb while under him</div>'+(dv||'<div class="sub" style="padding:14px 18px;">Not enough multi-season players.</div>')+'</div></div>';
  }
  document.getElementById('content').innerHTML=html;
}

async function init(){
  var slug=new URLSearchParams(location.search).get('slug');
  if(!slug){ document.getElementById('content').innerHTML='<div class="loading">No coach specified. <a href="coaches.html" style="color:var(--accent)">Back to the Coaching Lab</a>.</div>'; return; }
  try{
    const [prof, seas, pages]=await Promise.all([
      fetch('scripts/data/coach_profiles.json').then(r=>r.json()),
      fetch('scripts/data/coach_seasons.json').then(r=>r.json()).catch(()=>[]),
      fetch('scripts/data/coach_pages.json').then(r=>r.json()).catch(()=>({}))
    ]);
    var p=prof.find(x=>x.coach_slug===slug);
    if(!p){ document.getElementById('content').innerHTML='<div class="loading">Coach not found. <a href="coaches.html" style="color:var(--accent)">Back to the Coaching Lab</a>.</div>'; return; }
    var ss=(seas||[]).filter(s=>s.coach_slug===slug);
    document.title=p.coach+' — The Depth Chart';
    render(p, ss, pages[slug]);
  }catch(e){ document.getElementById('content').innerHTML='<div class="loading">Could not load coach data. '+e.message+'</div>'; }
}
init();
</script>
</body>
</html>
