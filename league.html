  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#2e8b57;--red:#c0392b;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--green:#6fbf7e;--red:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .page{padding:28px 0 64px;}
    button{font:inherit;cursor:pointer;}
    a{color:inherit;}
    .page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .page-h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:14px;}
    .btn{font:700 12px 'Inter',system-ui,sans-serif;letter-spacing:.02em;padding:8px 14px;border-radius:999px;border:1px solid var(--text);background:var(--text);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
    .btn.ghost{background:var(--bg);color:var(--text2);border-color:var(--border2);}
    .btn.danger{background:var(--bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2));}
    .btn.sm{padding:4px 10px;font-size:11px;}
    .btn:disabled{opacity:.45;cursor:default;}
    .fi,.fs{font:500 13.5px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:8px;outline:none;}
    .fi:focus,.fs:focus{border-color:var(--accent);}
    .lab{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .sp{flex:1;}
    .msg{font-size:12.5px;margin:6px 0;} .msg.err{color:var(--red);font-weight:600;} .msg.ok{color:var(--green);font-weight:600;}
    .empty{padding:30px 12px;text-align:center;color:var(--text3);font-size:13px;}
    .fl-note{font-size:12px;color:var(--text3);margin:6px 0 12px;}
    .sec-h{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding-bottom:8px;border-bottom:1px solid var(--border);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
    .card{border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;background:var(--bg);}
    .card h3{font-size:14px;font-weight:800;margin-bottom:12px;}
    .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
    .grid-side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;}
    @media(max-width:980px){ .grid2,.grid-side{grid-template-columns:1fr;} }
    .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:20px;}
    .tab{font:700 12px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text2);padding:6px 13px;border-radius:999px;text-decoration:none;}
    .tab.on{background:var(--text);color:var(--bg);border-color:var(--text);}
    .tab .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;margin-left:5px;}
    .hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
    .hd .meta{font-size:12px;color:var(--text3);margin-bottom:18px;}
    .pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);vertical-align:1px;}
    .pill.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--border2));}
    .pill.r{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2));}
    .lg{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:6px;}
    .nm a{text-decoration:none;font-weight:700;} .nm a:hover{color:var(--accent);text-decoration:underline;}
    .sheet td .sub{display:block;font-size:10.5px;color:var(--text3);font-weight:500;}
    .sheet tfoot td{text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums;border-top:2px solid var(--border2);} .sheet tfoot td.l{text-align:left;}
    .me-row td{background:color-mix(in srgb,var(--accent) 10%,transparent)!important;}
    /* draft */
    .entry{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px auto;gap:10px;align-items:end;}
    @media(max-width:800px){ .entry{grid-template-columns:1fr 1fr;} }
    .entry .fi,.entry .fs{width:100%;}
    .ac{position:relative;}
    .ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:60;max-height:330px;overflow:auto;display:none;}
    .ac-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;cursor:pointer;}
    .ac-opt:hover,.ac-opt.hi{background:var(--bg2);}
    .ac-opt .r{margin-left:auto;color:var(--text3);font-size:11.5px;font-variant-numeric:tabular-nums;}
    .info{font-size:12px;color:var(--text2);margin-top:10px;min-height:16px;}
    .info b{color:var(--text);}
    .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
    .bt{border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12.5px;}
    .bt.me{border-color:var(--accent);}
    .bt-h{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:2px;}
    .bt-s{font-size:11px;color:var(--text3);margin-bottom:8px;font-variant-numeric:tabular-nums;}
    .bt ol{list-style:none;}
    .bt li{display:flex;gap:6px;padding:3px 0;border-top:1px solid var(--border);}
    .bt li .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;}
    .bt li button{background:none;border:none;color:var(--text3);font-weight:800;padding:0 2px;}
    .bt li button:hover{color:var(--red);}
    .bt .open{color:var(--text3);font-style:italic;}
    /* dates */
    .cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
    .mo h4{font-size:12px;font-weight:800;margin-bottom:6px;}
    .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .days .w{font-size:9.5px;font-weight:800;color:var(--text3);text-align:center;}
    .dy{border:1px solid var(--border);border-radius:6px;padding:3px 0;text-align:center;font-size:11px;background:var(--bg);color:var(--text2);line-height:1.2;}
    .dy .n{display:block;font-size:9px;color:var(--text3);}
    .dy.on{background:var(--text);color:var(--bg);border-color:var(--text);} .dy.on .n{color:var(--bg);opacity:.7;}
    .dy.none{opacity:.35;cursor:default;}
    .dy.past{outline:1px dashed var(--border2);}
    .chk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .chk:last-child{border-bottom:none;}
    .chk input{accent-color:var(--accent);}
    .chk .r{margin-left:auto;font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums;}
    .delta b.up{color:var(--green);} .delta b.dn{color:var(--red);}
    .code{font:800 22px ui-monospace,Menlo,monospace;letter-spacing:.18em;}
    .dy.po{background:repeating-linear-gradient(135deg,var(--bg2),var(--bg2) 4px,var(--bg) 4px,var(--bg) 8px);color:var(--text3);cursor:default;}
    .banner{border:1px solid var(--border2);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--text2);margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .banner b{color:var(--text);}
    .clock{border:2px solid var(--accent);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
    .clock .big{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:22px;}
    .order{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
    .order span{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border2);color:var(--text2);}
    .order span.on{background:var(--accent);border-color:var(--accent);color:#fff;}
    .ordlist li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;list-style:none;}
    .ordlist li .n{width:20px;color:var(--text3);font-weight:800;}
    .ordlist li button{background:none;border:1px solid var(--border2);border-radius:6px;color:var(--text2);padding:0 6px;font-weight:800;}
    /* bracket */
    .brk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:center;}
    @media(max-width:980px){ .brk{grid-template-columns:1fr;} }
    .rnd h4{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
    .rnd .when{font-size:11px;color:var(--text3);margin-bottom:10px;}
    .mu{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
    .mu .t{display:grid;grid-template-columns:24px minmax(0,1fr) repeat(3,44px) 46px;gap:6px;align-items:center;padding:8px 10px;font-size:12.5px;font-variant-numeric:tabular-nums;}
    .mu .t + .t{border-top:1px solid var(--border);}
    .mu .t.win{background:color-mix(in srgb,var(--green) 9%,transparent);font-weight:800;}
    .mu .t .sd{color:var(--text3);font-weight:800;font-size:11px;}
    .mu .t .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mu .t .c{text-align:right;color:var(--text2);}
    .mu .t .pc{text-align:right;font-weight:800;}
    .mu .hdr{display:grid;grid-template-columns:24px minmax(0,1fr) repeat(3,44px) 46px;gap:6px;padding:5px 10px;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--text3);background:var(--bg2);}
    .mu .hdr span{text-align:right;} .mu .hdr span:nth-child(-n+2){text-align:left;}
    .mu .bye{padding:10px;font-size:12px;color:var(--text3);}
    .hero-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:6px 0 22px;}
    .hero-cards .card{margin:0;}
    .hero-cards .card b{display:block;font-size:13.5px;margin-bottom:4px;}
    .hero-cards .card span{font-size:12.5px;color:var(--text2);line-height:1.5;}

<div class="page" id="app"><div class="empty">Loading…</div></div>

<script>
(function(){
  const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  const CONFS={'B10':'Big Ten','SEC':'SEC','ACC':'ACC','BIG-12':'Big 12','Big-East':'Big East'};
  const CATS=[['pts','PTS'],['reb','REB'],['ast','AST']];
  // the invite code is never selected: it's only readable through fl_invite_code (members)
  const LCOLS='id,name,season,budget,roster_size,max_pickups,max_teams,commissioner,draft_done,created_at,draft_type,draft_order,is_public,r1_start,r1_end,r2_start,r2_end,f_start,f_end';
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const session=()=>{ try{ return JSON.parse(localStorage.getItem('tdc_session')||'null'); }catch(e){ return null; } };
  const tok=()=>{ const s=session(); return s&&s.access_token||null; };
  const H=pub=>({apikey:KEY,Authorization:'Bearer '+((!pub&&tok())||KEY),'Content-Type':'application/json'});
  const f1=v=>v==null||isNaN(v)?'—':(+v).toFixed(1);
  const f0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString();
  const pct=v=>v==null||isNaN(v)?'—':(v>=.995?'>99':v<.005?'<1':Math.round(v*100))+'%';
  const TODAY=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
  const say=(id,t,c)=>{ const el=$(id); if(el){ el.className='msg '+(c||''); el.textContent=t||''; } };
  const nk=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const logo=t=>{ try{ const c=window.tdcTeamColor&&tdcTeamColor(t); return c&&c.logo||null; }catch(e){ return null; } };
  const lgImg=t=>{ const l=logo(t); return l?`<img class="lg" src="${esc(l)}" alt="" loading="lazy">`:''; };
  const md=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  const notInstalled=m=>/relation|does not exist|schema cache|404|column/.test(m||'');

  async function errText(r){
    let t=''; try{ t=await r.text(); }catch(e){}
    if(r.status===401) return 'Your session has expired. Sign out and back in, then try again.';
    try{ const j=JSON.parse(t); if(j.message) return j.message; }catch(e){}
    return 'Something went wrong ('+r.status+').';
  }
  async function get(path,pub){ const r=await fetch(`${SB}/rest/v1/${path}`,{headers:H(pub)}); if(!r.ok) throw new Error(await errText(r)); return r.json(); }
  async function getAll(path,pub){   // paginated; every caller passes a stable order=
    const out=[]; for(let off=0;;off+=1000){ const rows=await get(`${path}&limit=1000&offset=${off}`,pub); out.push(...rows); if(rows.length<1000) return out; }
  }
  async function rpc(fn,body){ const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:H(),body:JSON.stringify(body)}); if(!r.ok) throw new Error(await errText(r)); return r.json().catch(()=>null); }
  async function patch(path,body){ const r=await fetch(`${SB}/rest/v1/${path}`,{method:'PATCH',headers:{...H(),Prefer:'return=representation'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(await errText(r)); const j=await r.json(); if(!j.length) throw new Error('That change was not allowed.'); return j; }
  const qList=a=>a.map(x=>'"'+String(x).replace(/"/g,'\\"')+'"').join(',');

  // ── state ──────────────────────────────────────────────────────────────
  let me=null, meProfile=null, OWNER=false;
  let L=null, MEM=[], ROS=[], DATES=new Set(), REG=new Set(), TRADES=[], CODE=null;
  // the fixed COUNTING SCHEDULE (scripts/build_fantasy_counting.py): every pool team counts 22 games — 18 conference
  // + 4 non-conference — and a counted game counts for both teams. When it loads it replaces counting dates.
  let CNT=null, CNTG=null;
  let POOL=[], PBY={}, PROJ={}, FULL={}, TEAMGAMES={}, BOX={}, FORM=null, VALUE={}, MARCH=null;
  let poolReady=null;
  const memOf=uid=>MEM.find(m=>m.user_id===uid);
  const tname=uid=>{ const m=memOf(uid); return m?m.team_name:'(left the league)'; };
  const isMember=()=>!!(me&&memOf(me.id));
  const isCommish=()=>!!me&&(OWNER||(L&&L.commissioner===me.id));
  const placeholders=()=>MEM.filter(m=>m.placeholder);
  // the commissioner can run a test team: everything "mine" then means that team
  let ACT=null;
  const actKey=()=>'fl_act_'+(L&&L.id);
  const actId=()=>{ if(ACT&&isCommish()&&memOf(ACT)&&memOf(ACT).placeholder) return ACT; return me?me.id:null; };
  const asArg=()=>actId()!==(me&&me.id)?actId():null;
  const canAct=()=>isMember()||(isCommish()&&actId()!==(me&&me.id));
  const active=()=>ROS.filter(r=>!r.end_date);
  const rosterOf=uid=>active().filter(r=>r.user_id===uid);
  const owned=pid=>active().find(r=>r.player_id===pid);
  const counts=(r,d)=>(!r.start_date||d>=r.start_date)&&(!r.end_date||d<r.end_date);

  async function loadMe(){
    const t=tok(); if(!t) return;
    try{
      const r=await fetch(`${SB}/auth/v1/user`,{headers:{apikey:KEY,Authorization:'Bearer '+t}}); if(!r.ok) return;
      me=await r.json(); OWNER=!!(window.tdcIsOwner&&tdcIsOwner());
      meProfile=(await get(`profiles?id=eq.${me.id}&select=id,username,avatar_url`).catch(()=>[]))[0]||null;
    }catch(e){}
  }

  // ── player pool + projections + schedule + March simulation (loaded once) ──
  function loadPool(){
    if(poolReady) return poolReady;
    poolReady=(async()=>{
      const [teams,proj,sched,rat]=await Promise.all([
        get(`teams?conference=in.(${Object.keys(CONFS).join(',')})&select=name,conference&order=name.asc`,true),
        fetch('scripts/data/stat_overall_projected.json?v=87').then(r=>r.ok?r.json():null).catch(()=>null),
        fetch('scripts/data/schedule_2027.json?v=5').then(r=>r.ok?r.json():null).catch(()=>null),
        get('predictive_ratings?select=data&limit=1',true).catch(()=>[])]);
      try{ const cs=await fetch('scripts/data/fantasy_counting_2027.json?v=1').then(r=>r.ok?r.json():null);
        if(cs&&cs.teams){ CNTG=cs; CNT={}; Object.entries(cs.teams).forEach(([t,l])=>{ CNT[t]=new Set(l.map(x=>x.date)); }); } }catch(e){}
      const CONF=Object.fromEntries(teams.map(t=>[t.name,t.conference]));
      POOL=await getAll(`players?team=in.(${encodeURIComponent(qList(teams.map(t=>t.name)))})&select=id,name,team,position,espn_id,yr,is_injured,tdc_grade,height,ppg,mpg&order=id.asc`,true);
      if(window.TDCFresh) await TDCFresh.load().catch(()=>{});
      PROJ=(proj&&proj.players)||{};
      const RT=(rat[0]&&rat[0].data&&rat[0].data.teams)||[];
      RT.forEach(t=>{ if(CONF[t.team]&&!FULL[t.team]) FULL[t.team]=t.full; });   // sheet short name -> ESPN full name
      POOL.forEach(p=>{
        p.conf=CONF[p.team]; const pr=p.espn_id!=null?PROJ[String(p.espn_id)]:null;
        p.proj=pr?{pts:pr.ppg||0,reb:pr.rpg||0,ast:pr.apg||0,mpg:pr.mpg||0}:null;
        if(pr&&pr.team&&!FULL[p.team]) FULL[p.team]=pr.team;
        // no published projection (mostly freshmen): the freshman engine's line, the same one the Big Board uses
        if(!p.proj&&window.TDCFresh){ try{ const F=TDCFresh.line(p,TDCFresh.profileFor(p)); if(F&&F.mpg>0) p.proj={pts:F.ppg||0,reb:F.rpg||0,ast:F.apg||0,mpg:F.mpg,est:true}; }catch(e){} }
        PBY[p.id]=p;
      });
      if(sched){ const T=sched.teams; sched.games.forEach(g=>{ [T[g[2]],T[g[3]]].forEach(t=>{ (TEAMGAMES[t]=TEAMGAMES[t]||[]).push(g[1]); }); }); }
      // March, from the site's one postseason simulation (tdc-postseason.js): every league's REAL conference
      // tournament seeded from its simulated standings, the 76-team NCAA field picked and bracketed by the
      // committee's rules, the same seasons every schedule shows. Fallback: the old generic simulation.
      try{
        const PS=window.TDCPost?await TDCPost.run({sims:2000}):null;
        if(PS){ const mean={}; PS.teams.forEach(t=>{ mean[t.team]={conf:t.confGames,fw:t.fwGames,rest:t.restGames,bid:t.ncaa,champ:t.champ}; });
          MARCH={sims:PS.sims,mean,games:PS.games}; }
      }catch(e){ console.warn('postseason sim',e); }
      if(!MARCH&&window.TDCMarch&&RT.length) MARCH=TDCMarch.simulate(RT,{sims:2000});
    })();
    return poolReady;
  }
  const fullOf=p=>p&&FULL[p.team];
  // does this team's game on this date count in the regular season? (counting schedule, else the commissioner's dates)
  const regHas=(short,d)=>CNT?(!L||d<L.r1_start)&&!!(CNT[FULL[short]]&&CNT[FULL[short]].has(d)):REG.has(d);
  const gameDates=short=>TEAMGAMES[FULL[short]]||[];
  // regular-season counting games still to come (today counts until its box score exists)
  function gamesLeft(p,fromDate){
    if(!p) return 0; const played=new Set((BOX[p.espn_id]||[]).map(b=>b.date));
    const from=fromDate&&fromDate>TODAY?fromDate:TODAY;
    return gameDates(p.team).filter(d=>regHas(p.team,d)&&d>=from&&!played.has(d)).length;
  }
  // regular-season games a team plays inside the round-1 window (early March), cached per window
  const _r1={}; const r1Reg=p=>{ if(!p) return 0; const k=p.team+'|'+L.r1_start+'|'+L.r1_end;
    return _r1[k]!=null?_r1[k]:(_r1[k]=gameDates(p.team).filter(d=>d>=L.r1_start&&d<=L.r1_end).length); };
  const allCountingGames=p=>p?gameDates(p.team).filter(d=>regHas(p.team,d)).length:0;
  // expected games in each playoff window: scheduled games that fall in it + simulated tournament games
  function windowGames(p){
    const f=fullOf(p), m=MARCH&&f?MARCH.mean[f]:null;
    const inR1=r1Reg(p);
    return {r1:inR1+(m?m.conf:0), r2:m?m.fw:0, f:m?m.rest:0, bid:m?m.bid:0, champ:m?m.champ:0};
  }

  // draft value: regular season (counting games) + March (expected tournament games), z-scored against the
  // players a full league would roster, replacement = the next man up. A bench guard on a 2 seed beats an
  // equal one on a team that's done after its conference tournament.
  function computeValues(){
    const teams=Math.max(L.max_teams,MEM.length), N=teams*L.roster_size, cap=teams*L.budget;
    const P=POOL.filter(p=>p.proj);
    const regMult=p=>REG.size?Math.max(1,allCountingGames(p)):1;
    const postMult=p=>{ const w=windowGames(p); return w.r1+w.r2+w.f; };
    P.forEach(p=>{ p.post=postMult(p); });
    const raw=p=>CATS.reduce((s,[k])=>s+p.proj[k],0);
    const top=P.slice().sort((a,b)=>raw(b)-raw(a)).slice(0,N);
    const st=(mult)=>{ const o={}; CATS.forEach(([k])=>{ const v=top.map(p=>p.proj[k]*mult(p)); const m=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1; o[k]={m,sd}; }); return o; };
    const sR=st(regMult), sP=st(postMult);
    const z=p=>CATS.reduce((s,[k])=>s+(p.proj[k]*regMult(p)-sR[k].m)/sR[k].sd+(p.proj[k]*postMult(p)-sP[k].m)/sP[k].sd,0);
    const ranked=P.map(p=>({p,z:z(p)})).sort((a,b)=>b.z-a.z);
    const repl=ranked[N]?ranked[N].z:ranked[ranked.length-1].z;
    const above=ranked.slice(0,N).reduce((s,x)=>s+Math.max(0,x.z-repl),0)||1;
    VALUE={}; POOL.forEach(p=>{ p.rank=null; p.z=null; });
    ranked.forEach((x,i)=>{ x.p.rank=i+1; x.p.z=x.z; VALUE[x.p.id]=i<N?Math.max(1,Math.round(1+(x.z-repl)/above*(cap-N))):(x.z>repl-1?1:0); });
  }

  async function loadLeague(id){
    const [lg,mem,ros,dates,trades]=await Promise.all([
      get(`fl_leagues?id=eq.${id}&select=${LCOLS}`), get(`fl_members?league_id=eq.${id}&select=*&order=joined_at.asc`),
      get(`fl_rosters?league_id=eq.${id}&select=*&order=id.asc`), get(`fl_dates?league_id=eq.${id}&select=d&order=d.asc`),
      get(`fl_trades?league_id=eq.${id}&select=*&order=created_at.desc`)]);
    if(!lg[0]) throw new Error('not-member');
    L=lg[0]; MEM=mem; ROS=ros; TRADES=trades; setDates(dates.map(x=>x.d));
    CODE=null; if(me&&memOf(me.id)) CODE=await rpc('fl_invite_code',{p_league:L.id}).catch(()=>null);
    try{ ACT=localStorage.getItem(actKey())||null; }catch(e){ ACT=null; }
    const ids=[...new Set(MEM.filter(m=>!m.placeholder).map(m=>m.user_id))];
    if(ids.length){ const ps=await get(`profiles?id=in.(${ids.join(',')})&select=id,username`).catch(()=>[]); const by=Object.fromEntries(ps.map(p=>[p.id,p.username])); MEM.forEach(m=>m.username=m.placeholder?'test team':(by[m.user_id]||'')); }
    else MEM.forEach(m=>m.username=m.placeholder?'test team':'');
    await loadPool(); if(CNT) setDates([...DATES]); await loadBox(); computeValues();
  }
  function setDates(list){ DATES=new Set(list);
    // counting schedule: the regular season is every date any team has a counted game (each player still counts only his own)
    REG=CNT?new Set(Object.values(CNT).flatMap(x=>[...x]).filter(d=>!L||d<L.r1_start)):new Set(list.filter(d=>!L||d<L.r1_start)); }
  // box scores for everyone who has ever been on a roster: the regular-season dates and the playoff windows
  async function loadBox(){
    BOX={};
    const ids=[...new Set(ROS.map(r=>r.espn_id).filter(Boolean))];
    const first=[...REG].sort()[0]||L.r1_start;
    if(!ids.length||first>TODAY) return;
    for(let i=0;i<ids.length;i+=120){
      const rows=await getAll(`box_scores?season_year=eq.${L.season}&espn_id=in.(${ids.slice(i,i+120).join(',')})&date=gte.${first}&select=espn_id,date,pts,reb,ast&order=game_id.asc,espn_id.asc`,true).catch(()=>[]);
      rows.forEach(b=>{ (BOX[b.espn_id]=BOX[b.espn_id]||[]).push(b); });
    }
  }
  async function refreshRosters(){ ROS=await get(`fl_rosters?league_id=eq.${L.id}&select=*&order=id.asc`); }

  // ── scoring ────────────────────────────────────────────────────────────
  // stats a roster earned on the dates `inWin` accepts (regular season: the counting dates; playoffs: a window)
  function statsFor(uid,inWin){
    const t={pts:0,reb:0,ast:0,g:0};
    ROS.filter(r=>r.user_id===uid&&r.espn_id).forEach(r=>(BOX[r.espn_id]||[]).forEach(b=>{ if(inWin(b.date,r)&&counts(r,b.date)){ t.pts+=b.pts||0; t.reb+=b.reb||0; t.ast+=b.ast||0; t.g++; } }));
    return t;
  }
  const rTeam=r=>{ const p=PBY[r.player_id]; return p&&p.team; };
  const actualFor=uid=>statsFor(uid,(d,r)=>regHas(rTeam(r),d));
  function playerActual(r,inWin){
    inWin=inWin||(d=>regHas(rTeam(r),d)); const t={pts:0,reb:0,ast:0,g:0};
    (BOX[r.espn_id]||[]).forEach(b=>{ if(inWin(b.date)&&counts(r,b.date)){ t.pts+=b.pts||0; t.reb+=b.reb||0; t.ast+=b.ast||0; t.g++; } }); return t;
  }
  // per game when no dates are set; otherwise actual so far + projection x games left
  function projectedFor(uid,rows){
    rows=rows||rosterOf(uid); const t=REG.size?actualFor(uid):{pts:0,reb:0,ast:0};
    rows.forEach(r=>{ const p=PBY[r.player_id]; if(!p||!p.proj) return; const n=REG.size?gamesLeft(p,r.start_date):1; CATS.forEach(([k])=>t[k]+=p.proj[k]*n); });
    return t;
  }
  function roto(totals){   // {uid:{pts,reb,ast}} -> {uid:{pts:rp,...,total}}
    const ids=Object.keys(totals), out={}; ids.forEach(u=>out[u]={total:0});
    CATS.forEach(([k])=>ids.forEach(u=>{ const v=totals[u][k]; let p=1; ids.forEach(o=>{ if(o!==u){ if(totals[o][k]<v) p+=1; else if(totals[o][k]===v) p+=.5; } }); out[u][k]=p; out[u].total+=p; }));
    return out;
  }
  function standings(){
    const act={}, prj={}; MEM.forEach(m=>{ act[m.user_id]=actualFor(m.user_id); prj[m.user_id]=projectedFor(m.user_id); });
    const ra=roto(act), rp=roto(prj);
    const regOver=[...REG].length&&[...REG].every(d=>d<TODAY);
    const order=MEM.slice().sort((a,b)=>regOver?(ra[b.user_id].total-ra[a.user_id].total):(rp[b.user_id].total-rp[a.user_id].total||ra[b.user_id].total-ra[a.user_id].total));

  }
  const marchGamesOf=uid=>rosterOf(uid).reduce((s,r)=>{ const p=PBY[r.player_id]; if(!p) return s; const w=windowGames(p); return s+w.r1+w.r2+w.f; },0)/Math.max(1,rosterOf(uid).length);

  function viewAuction(){
    const C=isCommish()&&!L.draft_done;
    $('view').innerHTML=`${C?`<div class="card"><h3>Enter a sale</h3>
        <div class="entry">
          <div class="ac"><label class="lab">Player</label><input class="fi" id="dP" placeholder="Search name or school…" autocomplete="off"/><div class="ac-list" id="dList"></div></div>
          <div><label class="lab">Sold to</label><select class="fs" id="dT">${MEM.map(m=>`<option value="${m.user_id}">${esc(m.team_name)}</option>`).join('')}</select></div>
          <div><label class="lab">Price $</label><input class="fi" id="dPrice" type="number" min="1" inputmode="numeric"/></div>

        opts=POOL.filter(p=>!owned(p.id)&&(nk(p.name).includes(q)||nk(p.team).includes(q))).sort((a,b)=>(VALUE[b.id]||0)-(VALUE[a.id]||0)||(a.rank||9e9)-(b.rank||9e9)).slice(0,10);
        hi=Math.min(hi,opts.length-1);
        list.innerHTML=opts.map((p,i)=>`<div class="ac-opt${i===hi?' hi':''}" data-i="${i}">${lgImg(FULL[p.team]||p.team)}<span><b>${esc(p.name)}</b> <span class="dim">${esc(p.team)} · ${esc(p.position||'')}</span></span><span class="r">${p.proj?`${f1(p.proj.pts)}/${f1(p.proj.reb)}/${f1(p.proj.ast)} · `:''}$${VALUE[p.id]||0}</span></div>`).join('')||'<div class="ac-opt dim">No available player matches.</div>';
        list.style.display='block'; };
      const pick=p=>{ chosen=p; inp.value=p.name+' · '+p.team; list.style.display='none'; if(!$('dPrice').value) $('dPrice').value=Math.max(1,VALUE[p.id]||1); info(); $('dPrice').focus(); $('dPrice').select(); };
      inp.oninput=()=>{ chosen=null; hi=0; paintAc(); info(); };
      inp.onkeydown=e=>{ if(list.style.display!=='block') return;
        if(e.key==='ArrowDown'){ hi=Math.min(hi+1,opts.length-1); paintAc(); e.preventDefault(); } else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); paintAc(); e.preventDefault(); }
        else if(e.key==='Enter'&&opts[hi]){ pick(opts[hi]); e.preventDefault(); } };
      list.onmousedown=e=>{ const o=e.target.closest('[data-i]'); if(o){ e.preventDefault(); pick(opts[+o.dataset.i]); } };
      inp.onblur=()=>setTimeout(()=>list.style.display='none',150);
      const info=()=>{ const u=$('dT').value, b=budgetOf(u), w=chosen&&windowGames(chosen);
        $('dInfo').innerHTML=`<b>${esc(tname(u))}</b>: $${b.left} left · ${b.spots} spot${b.spots===1?'':'s'} open · max bid <b>$${b.max}</b>${chosen?` · <b>${esc(chosen.name)}</b> is worth about <b>$${VALUE[chosen.id]||1}</b>${chosen.proj?` (${f1(chosen.proj.pts)} pts, ${f1(chosen.proj.reb)} reb, ${f1(chosen.proj.ast)} ast projected · ${f1(w.r1+w.r2+w.f)} March games, ${pct(w.bid)} NCAA odds)`:' (no projection)'}`:''}`; };
      $('dT').onchange=info; info();

        try{ await rpc('fl_draft',{p_league:L.id,p_user:$('dT').value,p_player:chosen.id,p_price:price});
          say('dMsg',`${chosen.name} to ${tname($('dT').value)} for $${price}.`,'ok'); chosen=null; inp.value=''; $('dPrice').value='';

        }catch(e){ say('dMsg',e.message,'err'); } $('dGo').disabled=false; };

  function paintBoard(){

  // ── players / pickups ──────────────────────────────────────────────────

  // ── playoffs ───────────────────────────────────────────────────────────
  // six teams, three a side: 4 v 5 and 3 v 6 in round 1 (conference tournaments) while 1 and 2 rest;
  // round 2 (NCAA first weekend) the top seeds take the winners; the final is the rest of the NCAA tournament.
  // Every round starts from zero and is won head-to-head across PTS / REB / AST (2 of 3; tiebreak: total).
  const WIN=()=>({r1:[L.r1_start,L.r1_end],r2:[L.r2_start,L.r2_end],f:[L.f_start,L.f_end]});
  let PO=null;   // playoff odds for the current seeding, recomputed when rosters change
  function seeds(){ return standings().order.slice(0,6).map(m=>m.user_id); }
  // one simulated round score for a roster: each player's per-game line x his team's games in that window
  // in sim s (+ the window's regular-season games), with game-to-game noise
  function simScore(rows,s,win,R){
    const t={pts:0,reb:0,ast:0};
    rows.forEach(r=>{ const p=PBY[r.player_id]; if(!p||!p.proj) return; const f=fullOf(p);
      const reg=win==='r1'?r1Reg(p):0;
      const g=reg+(MARCH&&f?MARCH.games(f,s,win==='r1'?'conf':win==='r2'?'fw':'rest'):0); if(!g) return;
      const k=Math.max(.3,1+.22*gaussR(R)/Math.sqrt(g));
      CATS.forEach(([c])=>t[c]+=p.proj[c]*g*k); });
    return t;
  }
  function gaussR(R){ const u=1-R(), v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function beatsH2H(a,b,favA){ let w=0; CATS.forEach(([c])=>{ if(a[c]>b[c]) w++; else if(a[c]===b[c]) w+=.5; });
    if(w!==1.5) return w>1.5; const ta=a.pts+a.reb+a.ast, tb=b.pts+b.reb+b.ast; return ta===tb?favA:ta>tb; }
  function playoffOdds(rowsOf){
    if(!MARCH||MEM.length<6) return null;
    rowsOf=rowsOf||(u=>rosterOf(u));
    const sd=seeds(), out={team:{}}; MEM.forEach(m=>out.team[m.user_id]={r2:0,final:0,champ:0});
    let x=1234567; const R=()=>{ x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; };
    const sims=Math.min(MARCH.sims,1000), rs=Object.fromEntries(sd.map(u=>[u,rowsOf(u)]));
    for(let s=0;s<sims;s++){
      const sc=(u,w)=>simScore(rs[u],s,w,R);
      const w45=beatsH2H(sc(sd[3],'r1'),sc(sd[4],'r1'),true)?sd[3]:sd[4];
      const w36=beatsH2H(sc(sd[2],'r1'),sc(sd[5],'r1'),true)?sd[2]:sd[5];
      [sd[0],sd[1],w45,w36].forEach(u=>out.team[u].r2++);
      const fA=beatsH2H(sc(sd[0],'r2'),sc(w45,'r2'),true)?sd[0]:w45;
      const fB=beatsH2H(sc(sd[1],'r2'),sc(w36,'r2'),true)?sd[1]:w36;
      out.team[fA].final++; out.team[fB].final++;
      out.team[beatsH2H(sc(fA,'f'),sc(fB,'f'),sd.indexOf(fA)<sd.indexOf(fB))?fA:fB].champ++;
    }
    Object.values(out.team).forEach(o=>{ o.r2/=sims; o.final/=sims; o.champ/=sims; });
    return out;
  }
  // a round's matchup: actual stats inside the window so far + projection for the games still to come
  function matchupRow(uid,win){
    const [a,b]=WIN()[win], act=statsFor(uid,d=>d>=a&&d<=b), t={...act};
    const fracLeft=TODAY<a?1:TODAY>b?0:Math.max(0,(new Date(b)-new Date(TODAY))/(new Date(b)-new Date(a)+864e5));
    rosterOf(uid).forEach(r=>{ const p=PBY[r.player_id]; if(!p||!p.proj) return; const w=windowGames(p); const g=(win==='r1'?w.r1:win==='r2'?w.r2:w.f)*fracLeft; CATS.forEach(([c])=>t[c]+=p.proj[c]*g); });
    return {t,act,live:TODAY>=a&&TODAY<=b,done:TODAY>b};
  }
  function viewPlayoffs(){
    if(MEM.length<6){ $('view').innerHTML='<div class="empty">The playoff bracket needs six teams.</div>'; return; }
    PO=PO||playoffOdds();
    const sd=seeds(), W=WIN(), regOver=standings().regOver;
    const seedOf=u=>sd.indexOf(u)+1;
    const mu=(a,b,win)=>{ if(!a||!b) return '';
      const A=matchupRow(a,win), B=matchupRow(b,win);
      const aw=beatsH2H(A.t,B.t,seedOf(a)<seedOf(b));
      const label=A.done?'Final':A.live?'Live + projected':'Projected';
      const row=(u,X,win_)=>`<div class="t${win_?' win':''}"><span class="sd">${seedOf(u)}</span><span class="nm2">${teamLink(u)}</span>${CATS.map(([c])=>`<span class="c">${f0(X.t[c])}</span>`).join('')}<span class="pc">${win_?'W':''}</span></div>`;
      return `<div class="mu"><div class="hdr"><span>#</span><span>${label}</span>${CATS.map(([,l])=>`<span>${l}</span>`).join('')}<span></span></div>${row(a,A,aw)}${row(b,B,!aw)}</div>`;
    };
    const winner=(a,b,win)=>{ const A=matchupRow(a,win), B=matchupRow(b,win); return beatsH2H(A.t,B.t,seedOf(a)<seedOf(b))?a:b; };
    const w45=winner(sd[3],sd[4],'r1'), w36=winner(sd[2],sd[5],'r1');
    const fA=winner(sd[0],w45,'r2'), fB=winner(sd[1],w36,'r2');
    const bye=u=>`<div class="mu"><div class="bye"><b>${seedOf(u)}. ${esc(tname(u))}</b> · bye</div></div>`;
    $('view').innerHTML=`<div class="sec-h">Playoff bracket <span>${regOver?'seeded by final standings':'if the season ended today'} · every round resets</span></div>
      <div class="brk">
        <div class="rnd"><h4>Round 1 · conference tournaments</h4><div class="when">${md(W.r1[0])} – ${md(W.r1[1])}</div>${bye(sd[0])}${mu(sd[3],sd[4],'r1')}${bye(sd[1])}${mu(sd[2],sd[5],'r1')}</div>
        <div class="rnd"><h4>Round 2 · NCAA first weekend</h4><div class="when">${md(W.r2[0])} – ${md(W.r2[1])}</div>${mu(sd[0],w45,'r2')}${mu(sd[1],w36,'r2')}</div>
        <div class="rnd"><h4>Championship · rest of the NCAA tournament</h4><div class="when">${md(W.f[0])} – ${md(W.f[1])}</div>${mu(fA,fB,'f')}</div>
      </div>
      <div class="sec-h" style="margin-top:22px">Playoff odds <span>${MARCH?'from 1,000 simulated Marches of every player\'s real team':'loading tournament odds…'}</span></div>
      <div class="sheet-wrap"><table class="sheet dense" id="poTbl"><thead><tr><th>Seed</th><th class="l">Team</th><th title="Average expected March games across the roster">March games / player</th><th>Reach round 2</th><th>Reach final</th><th>Win title</th></tr></thead><tbody>${
        sd.map(u=>{ const o=PO&&PO.team[u]; return `<tr class="${u===actId()?'me-row':''}"><td class="rk">${seedOf(u)}</td><td class="l">${teamLink(u)}</td><td>${f1(marchGamesOf(u))}</td><td>${o?pct(o.r2):'—'}</td><td>${o?pct(o.final):'—'}</td><td><b>${o?pct(o.champ):'—'}</b></td></tr>`; }).join('')}</tbody></table></div>`;
    heat($('poTbl'));
  }

  // ── league: rules, members, invite code, counting dates ────────────────

        <div class="fl-note" style="margin-top:8px">${cc} conference + ${nc} non-conference = ${l.length} counting games</div>`; };
    $('view').innerHTML=`<div class="grid-side"><div>
        ${CNTG?`<div class="card"><h3>Counting schedule · 22 games a team</h3>
          <p style="font-size:12.5px;color:var(--text2);margin-bottom:12px">Every team counts 18 conference games and 4 non-conference games, and a counted game counts for both teams. The non-conference games are the strongest each team plays. Only a player's team's counted games score in the regular season; from ${md(L.r1_start)} on it's the playoffs.</p>
          ${(()=>{ const last=Object.values(CNTG.teams).flat().reduce((m,x)=>x.date>m?x.date:m,''); if(!(L.r1_start<=last)) return '';
            const nx=new Date(last+'T12:00:00'); nx.setDate(nx.getDate()+1); const k=nx.toISOString().slice(0,10);

          <p style="font-size:12.5px;color:var(--text2);margin-bottom:12px">Only games on these dates count toward the standings. Each square shows how many power-conference games are played that day. From ${md(L.r1_start)} on it's the playoffs, where every game in a round's window counts.${C?' Click a day to toggle it.':''}</p>
          ${C?`<div class="row" style="margin-bottom:12px"><button class="btn ghost sm" data-q="all">Every game day</button><button class="btn ghost sm" data-q="sat">Saturdays</button><button class="btn ghost sm" data-q="wknd">Fri–Sun</button><button class="btn ghost sm" data-q="jan">From Jan 1</button><button class="btn ghost sm" data-q="none">Clear</button><span class="sp"></span><button class="btn" id="dtSave">Save dates</button></div><div class="msg" id="dtMsg"></div>`:''}
          <div class="cal" id="cal">${cal()}</div></div>
      </div><div>
        ${CODE?`<div class="card"><h3>Invite code</h3><div class="code">${esc(CODE)}</div><p style="font-size:12.5px;color:var(--text2);margin:8px 0 10px">Friends sign up on The Depth Chart, open Fantasy and enter this code. ${MEM.length} of ${L.max_teams} teams are in.</p>
          <button class="btn ghost sm" id="cpLink">Copy invite message</button></div>`:''}
        <div class="card"><h3>Teams</h3>${MEM.map(m=>`<div class="chk"><span>${teamLink(m.user_id)} <span class="dim">· ${esc(m.username||'')}</span>${m.user_id===L.commissioner?' <span class="pill">Commish</span>':''}${m.placeholder?' <span class="pill">Test</span>':''}</span><span class="r">${C&&m.user_id!==L.commissioner?`<button class="btn danger sm" data-kick="${m.user_id}">Remove</button>`:''}</span></div>`).join('')}
          ${C&&MEM.length<L.max_teams?`<div class="row" style="margin-top:12px"><input class="fi" id="phName" maxlength="40" placeholder="Test team name" style="flex:1;min-width:0"/><button class="btn ghost sm" id="phAdd">Add test team</button></div>
            <div style="font-size:11.5px;color:var(--text3);margin-top:6px">A test team needs no account. You run it from the “Managing” picker, and a friend can take it over later with the invite code.</div><div class="msg" id="phMsg"></div>`:''}</div>
        <div class="card"><h3>Rules</h3>
          ${C?`<div class="grid2" style="gap:10px">${[['budget','Budget $'],['roster_size','Roster size'],['max_pickups','Pickups per team'],['max_teams','Max teams']].map(([k,l])=>`<div><label class="lab">${l}</label><input class="fi" type="number" id="r_${k}" value="${L[k]}" style="width:100%"/></div>`).join('')}</div>
            <label class="lab" style="margin-top:10px">League name</label><input class="fi" id="r_name" value="${esc(L.name)}" style="width:100%;margin-bottom:10px"/>
            <label class="lab">Draft</label><select class="fs" id="r_type" style="width:100%;margin-bottom:10px" ${ROS.some(r=>r.how==='draft')?'disabled title="The draft has started"':''}><option value="auction"${L.draft_type==='auction'?' selected':''}>Auction</option><option value="snake"${L.draft_type==='snake'?' selected':''}>Snake</option></select>
            <label class="chk" style="border:none;padding:0 0 10px"><input type="checkbox" id="r_pub"${L.is_public?' checked':''}/> Public: anyone can view the league (not join)</label>
            <div class="lab">Playoff windows</div>
            ${[['r1','Round 1 · conf. tournaments'],['r2','Round 2 · NCAA first weekend'],['f','Final · rest of the NCAA']].map(([k,l])=>`<div style="font-size:12px;margin:6px 0 3px;color:var(--text2)">${l}</div><div class="row"><input class="fi" type="date" id="r_${k}_start" value="${L[k+'_start']}" style="flex:1;min-width:0"/><input class="fi" type="date" id="r_${k}_end" value="${L[k+'_end']}" style="flex:1;min-width:0"/></div>`).join('')}
            <div class="msg" id="rMsg"></div><button class="btn" id="rSave" style="margin-top:10px">Save rules</button>`
          :`<div class="chk">Draft<span class="r">${L.draft_type==='snake'?'Snake':'$'+L.budget+' auction'}</span></div><div class="chk">Roster<span class="r">${L.roster_size} players</span></div><div class="chk">Pickups<span class="r">${L.max_pickups} per team</span></div><div class="chk">Scoring<span class="r">Roto: PTS · REB · AST</span></div><div class="chk">Playoffs<span class="r">Top 6 · ${md(L.r1_start)} – ${md(L.f_end)}</span></div>`}
        </div>
      </div></div>`;
    if($('cntSel')) $('cntSel').onchange=e=>{ window._cntTeam=e.target.value; $('cntBody').innerHTML=cntList(e.target.value); };
    if($('cpLink')) $('cpLink').onclick=()=>{ const t=`Join our fantasy league "${L.name}" on The Depth Chart: sign up at https://www.thedepthchartcbb.com/signin.html, then open https://www.thedepthchartcbb.com/league.html and enter code ${CODE}`;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ $('cpLink').textContent='Copied'; },()=>prompt('Copy this',t)); };
    if($('phAdd')) $('phAdd').onclick=async()=>{ const n=$('phName').value.trim()||`Test Team ${placeholders().length+1}`;
      try{ await rpc('fl_add_placeholder',{p_league:L.id,p_team_name:n}); L=null; route(); }catch(e){ say('phMsg',e.message,'err'); } };
    $('view').onclick=async e=>{
      const k=e.target.closest('[data-kick]');
      if(k){ if(!confirm(`Remove ${tname(k.dataset.kick)}? Their players go back to the pool.`)) return; try{ await rpc('fl_remove_member',{p_league:L.id,p_user:k.dataset.kick}); L=null; route(); }catch(err){ alert(err.message); } return; }
      if(!C) return;
      const d=e.target.closest('[data-d]'), q=e.target.closest('[data-q]');
      if(d){ sel.has(d.dataset.d)?sel.delete(d.dataset.d):sel.add(d.dataset.d); }
      else if(q){ const days=Object.keys(perDay).filter(x=>perDay[x]>0&&x<L.r1_start), dow=x=>new Date(x+'T12:00:00').getDay();
        sel=new Set({all:()=>days,sat:()=>days.filter(x=>dow(x)===6),wknd:()=>days.filter(x=>[0,5,6].includes(dow(x))),jan:()=>days.filter(x=>x>='2027-01-01'),none:()=>[]}[q.dataset.q]()); }
      else return;
      $('cal').innerHTML=cal(); $('dtN').textContent=sel.size;
    };
    if($('dtSave')) $('dtSave').onclick=async()=>{ try{ await rpc('fl_set_dates',{p_league:L.id,p_dates:[...sel].sort()}); setDates([...sel]); await loadBox(); computeValues(); PO=null; say('dtMsg',`Saved ${sel.size} dates.`,'ok'); }catch(err){ say('dtMsg',err.message,'err'); } };
    if($('rSave')) $('rSave').onclick=async()=>{
      const body={name:$('r_name').value.trim(),budget:+$('r_budget').value,roster_size:+$('r_roster_size').value,max_pickups:+$('r_max_pickups').value,max_teams:+$('r_max_teams').value,is_public:$('r_pub').checked};
      if(!$('r_type').disabled) body.draft_type=$('r_type').value;
      ['r1','r2','f'].forEach(k=>{ body[k+'_start']=$(`r_${k}_start`).value; body[k+'_end']=$(`r_${k}_end`).value; });
      try{ [L]=await patch(`fl_leagues?id=eq.${L.id}&select=${LCOLS}`,body); setDates([...DATES]); computeValues(); PO=null; route(); }catch(err){ say('rMsg',err.message,'err'); } };
  }

  // rosters changed → recompute the playoff odds the next time they're shown
  const _refresh=refreshRosters; refreshRosters=async function(){ await _refresh(); PO=null; };

  (async()=>{ await loadMe(); route(); })();
})();
</script>
<script src="tdc-version.js?v=2"></script>
</body>
</html>
