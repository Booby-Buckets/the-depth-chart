  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--green:#5ab875;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;}
    .wrap{max-width:760px;margin:0 auto;padding:24px 20px 90px;}
    .g-head{text-align:center;margin-bottom:14px;}
    .g-title{font-family:'Playfair Display',serif;font-weight:800;font-size:34px;letter-spacing:-.01em;}
    .g-sub{font-size:13px;color:var(--text3);margin-top:4px;}
    .stat-seg{display:flex;justify-content:center;gap:6px;margin:14px 0 6px;flex-wrap:wrap;}
    .stat-seg button{font-size:12px;font-weight:700;letter-spacing:.03em;padding:7px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;}
    .stat-seg button.on{background:var(--accent);color:#221c08;border-color:var(--accent);}
    .diffwrap{text-align:center;margin:4px 0 2px;}
    .score-row{display:flex;justify-content:center;gap:26px;margin:12px 0 20px;font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;}
    .score-row b{color:var(--accent);font-size:16px;}
    .cards{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
    .card{position:relative;border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:22px 16px;text-align:center;overflow:hidden;transition:transform .15s,border-color .2s;}
    .card .photo{width:96px;height:96px;border-radius:20px;object-fit:cover;background:var(--bg3);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:38px;color:var(--accent);border:1px solid var(--border2);}
    .card .nm{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;line-height:1.1;}
    .card .tm{font-size:12px;color:var(--text3);margin-top:3px;font-weight:600;}
    .card .val{font-family:'Playfair Display',serif;font-weight:800;font-size:40px;margin-top:12px;color:var(--accent);min-height:48px;}
    .card .val .lbl{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-family:'Inter';display:block;margin-top:2px;}
    .card .btns{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
    .card .btns button{font-size:14px;font-weight:700;padding:11px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;transition:background .12s,border-color .12s;}
    .card .btns button:hover{border-color:var(--accent);}
    .card .btns button.hi:hover{background:rgba(31,157,87,.14);}
    .card .btns button.lo:hover{background:rgba(207,90,78,.14);}
    .card.correct{border-color:#1f9d57;} .card.wrong{border-color:#cf5a4e;}
    .vs{display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:18px;color:var(--text3);}
    .loading{padding:60px;text-align:center;color:var(--text3);}
    @media(max-width:560px){.cards{grid-template-columns:1fr;}.vs{padding:4px;}.g-title{font-size:27px;}.card .val{font-size:34px;}.wrap{padding-left:6px;padding-right:6px;}}

<div class="page">

      <div class="g-title">Higher or Lower</div>
      <div class="g-sub">Two player-seasons from 20 years of college hoops — does the mystery one rank higher or lower? Chain them for a streak.</div>
    </div>

<script src="tdc-games.js?v=2"></script>
<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const T=window.TDCGames, GID='higher', DAILY_PAIRS=25, WIN_AT=5;

// makes/attempts are swapped in the data for 3P & FT, so % stats gate volume
// on max(made,att) as an attempts proxy, and we never show raw makes.
const STATS=[
  {k:'tdc_grade',l:'Grade',   fmt:function(v){return Math.round(v);}},
  {k:'ppg',l:'Points',        fmt:function(v){return v.toFixed(1);}},
  {k:'rpg',l:'Rebounds',      fmt:function(v){return v.toFixed(1);}},
  {k:'apg',l:'Assists',       fmt:function(v){return v.toFixed(1);}},
  {k:'stl',l:'Steals',        fmt:function(v){return v.toFixed(1);}},
  {k:'blk',l:'Blocks',        fmt:function(v){return v.toFixed(1);}},
  {k:'mpg',l:'Minutes',       fmt:function(v){return v.toFixed(1);}},
  {k:'fg_pct',l:'FG%',        fmt:function(v){return v.toFixed(1)+'%';}, vol:function(p){return (+p.fga||0)>=5;}},
  {k:'tp_pct',l:'3P%',        fmt:function(v){return v.toFixed(1)+'%';}, vol:function(p){return Math.max(+p.tpm||0,+p.tpa||0)>=2;}},
  {k:'ft_pct',l:'FT%',        fmt:function(v){return v.toFixed(1)+'%';}, vol:function(p){return Math.max(+p.ftm||0,+p.fta||0)>=1.5;}}
];
let POOL=[], ACTIVE=[], stat=STATS[0], left=null, right=null, streak=0, best=0, over=false, busy=false;
let difficulty='medium';
// mode: 'daily' = today's fixed chain (Grade, Medium, up to 25 pairs, one attempt); 'practice' = the open game
let mode=T.startMode(), practice={stat:0, diff:'medium'}, SEQ=null, seqI=0, marks=[], gen=0; // gen guards stale timers after a mode switch
// difficulty filters WHICH player-seasons can appear, by the player's (box-adjusted) grade —
// more famous seasons = easier. Falls back to the broad pool if a tier is too small to draw pairs.
const DIFFS={
  easy:   {lbl:'Easy',   hint:'household names', min:88},
  medium: {lbl:'Medium', hint:'notable players', min:82},
  hard:   {lbl:'Hard',   hint:'deep cuts',       min:74}
};

function val(p){return parseFloat(p[stat.k])||0;}
function esc(s){return T.esc(s);}
function photoOf(p){return (window.tdcShowPhotos&&window.tdcShowPhotos())?(p.photo_url||(p.espn_id?'https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/'+p.espn_id+'.png':'')):'';}
function seasonLbl(y){y=+y;return (y-1)+'-'+(''+y).slice(2);}
function bestKey(){return 'tdc_hilo_best_'+stat.k;}
function loadBest(){try{best=parseInt(localStorage.getItem(bestKey()))||0;}catch(e){best=0;}}
function saveBest(){try{if(streak>best){best=streak;localStorage.setItem(bestKey(),best);}}catch(e){}}
function refreshActive(){
  var min=(DIFFS[difficulty]||DIFFS.medium).min;
  var base=POOL.filter(function(p){return (parseFloat(p.tdc_grade)||0)>=min;});
  if(base.length<12) base=POOL; // tier too small to draw pairs — fall back to broad pool
  ACTIVE = stat.vol ? base.filter(stat.vol) : base;
  if(ACTIVE.length<2) ACTIVE = stat.vol ? POOL.filter(stat.vol) : POOL; // vol+tier fallback
}

// ---- controls: Free play / Daily, then difficulty + stat buttons (both modes; the daily's are fixed) ----
function renderControls(){
  T.modeBar('modeSeg', mode, setMode);
  var daily=mode==='daily', note=document.getElementById('gmNote');
  document.getElementById('diffWrap').innerHTML='<div class="seg" title="Difficulty sets how well-known the player-seasons can be">'+
    Object.keys(DIFFS).map(function(k){return '<button type="button" class="'+(difficulty===k?'on':'')+'" onclick="setDifficulty(\''+k+'\')">'+DIFFS[k].lbl+'<small>'+DIFFS[k].hint+'</small></button>';}).join('')+'</div>';
  document.getElementById('statSeg').innerHTML=STATS.map(function(s,i){return '<button type="button" class="'+(s.k===stat.k?'on':'')+'" onclick="setStat('+i+')">'+s.l+'</button>';}).join('');
  note.textContent = daily ? 'Daily #'+T.dayNumber()+' · Grade · Medium · '+DAILY_PAIRS+' pairs · one try' : '';
  note.style.display = daily ? '' : 'none';
}
function setMode(m){
  if(m===mode) return; mode=m;
  if(m==='daily'){ stat=STATS[0]; difficulty='medium'; } else { stat=STATS[practice.stat]; difficulty=practice.diff; }
  renderControls(); start();
}
// in daily, picking another difficulty or stat leaves for free play at that setting
function setDifficulty(d){
  if(d===difficulty||!DIFFS[d]) return;
  if(mode==='daily'){ practice.stat=STATS.indexOf(stat); practice.diff=d; return setMode('practice'); }
  difficulty=practice.diff=d; renderControls(); newGame();
}
function setStat(i){
  if(!STATS[i]) return;
  if(mode==='daily'){ if(STATS[i]===stat) return; practice.stat=i; practice.diff=difficulty; return setMode('practice'); }
  stat=STATS[i]; practice.stat=i; renderControls(); newGame();
}

function start(){
  if(!POOL.length) return;
  if(mode==='daily'){ var r=T.dailyResult(GID); if(r) return showDailyDone(r); dailyGame(); }
  else newGame();
}

function randPlayer(exclude){
  var arr=ACTIVE.length?ACTIVE:POOL, p, tries=0;
  do{ p=arr[Math.floor(Math.random()*arr.length)]; tries++; }
  while(tries<50 && exclude && (p.id===exclude.id || p.name===exclude.name || Math.abs(val(p)-val(exclude))<0.05));
  return p;
}
// today's chain: 26 player-seasons (25 pairs) drawn with the seeded RNG from the id-sorted
// Medium/Grade pool, so every visitor gets the same sequence. No player repeats in the chain.
function buildDailySeq(){
  var pool=ACTIVE.slice().sort(function(a,b){return (+a.id)-(+b.id);});
  var r=T.seeded(GID), seq=[pool[Math.floor(r()*pool.length)]];
  while(seq.length<DAILY_PAIRS+1){
    var prev=seq[seq.length-1], p, tries=0;
    do{ p=pool[Math.floor(r()*pool.length)]; tries++; }
    while(tries<200 && (seq.some(function(q){return q.id===p.id||q.name===p.name;}) || Math.abs(val(p)-val(prev))<0.05));
    seq.push(p);
  }
  return seq;
}
function newGame(){ gen++; streak=0; over=false; busy=false; marks=[]; loadBest(); refreshActive(); left=randPlayer(null); right=randPlayer(left); render(); }
function dailyGame(){ gen++; streak=0; over=false; busy=false; marks=[]; refreshActive(); SEQ=buildDailySeq(); seqI=1; left=SEQ[0]; right=SEQ[1]; render(); }

function cardHtml(p, side, revealed){
  var photo=photoOf(p), ini=esc((p.name||'?')[0]);
  var img=photo?'<img class="photo" src="'+photo+'" alt="" onerror="this.outerHTML=\'<div class=&quot;photo&quot;>'+ini+'</div>\'">':'<div class="photo">'+ini+'</div>';
  var valHtml=revealed
    ? '<div class="val">'+stat.fmt(val(p))+'<span class="lbl">'+stat.l+'</span></div>'
    : '<div class="val" style="color:var(--text3);">?<span class="lbl">'+stat.l+'</span></div>';
  var btns=(side==='right'&&!revealed&&!over)
    ? '<div class="btns"><button type="button" class="hi" onclick="answer(true)">▲ Higher</button><button type="button" class="lo" onclick="answer(false)">▼ Lower</button></div>'
    : '';
  return '<div class="card" id="card-'+side+'">'+img+'<div class="nm">'+esc(p.name)+'</div><div class="tm">'+seasonLbl(p.season_year)+' · '+esc(p.team)+'</div>'+valHtml+btns+'</div>';
}
function scoreHtml(){
  return '<span>Streak <b>'+streak+'</b></span>'+(mode==='daily'
    ? '<span>Pair <b>'+Math.min(seqI,DAILY_PAIRS)+' / '+DAILY_PAIRS+'</b></span>'
    : '<span>Best <b>'+best+'</b></span>');
}
function render(){
  document.getElementById('content').innerHTML=
    '<div class="score-row" id="scoreRow">'+scoreHtml()+'</div>'+
    '<div class="cards" id="cards"><div id="leftWrap">'+cardHtml(left,'left',true)+'</div><div class="vs">vs</div><div id="rightWrap">'+cardHtml(right,'right',false)+'</div></div>'+
    '<div id="gr"></div>';
}
function answer(higher){
  if(busy||over)return; busy=true;
  var lv=val(left), rv=val(right);
  var correct=(rv>lv&&higher)||(rv<lv&&!higher)||(rv===lv); // tie counts as correct
  marks.push(correct);
  document.getElementById('rightWrap').innerHTML=cardHtml(right,'right',true);
  var rc=document.getElementById('card-right'); if(rc)rc.classList.add(correct?'correct':'wrong');
  if(correct){
    streak++; if(mode==='practice') saveBest();
    if(mode==='daily' && seqI>=DAILY_PAIRS){ document.getElementById('scoreRow').innerHTML=scoreHtml(); return endRun(true); }
    document.getElementById('scoreRow').innerHTML=scoreHtml();
    var g0=gen;
    setTimeout(function(){
      if(g0!==gen) return;
      if(mode==='daily'){ left=right; seqI++; right=SEQ[seqI]; } else { left=right; right=randPlayer(left); }
      busy=false;
      document.getElementById('scoreRow').innerHTML=scoreHtml();
      document.getElementById('leftWrap').innerHTML=cardHtml(left,'left',true);
      document.getElementById('rightWrap').innerHTML=cardHtml(right,'right',false);
    }, 850);
  } else {
    if(mode==='practice') saveBest();
    endRun(false);
  }
}
// share: streak + one square per pick (green = right, red = the miss), 10 to a row
function shareFor(daily, score, ms){
  var sq=ms.map(function(ok){return ok?'🟩':'🟥';}).join(''), rows=[];
  var arr=Array.from(sq); for(var i=0;i<arr.length;i+=10) rows.push(arr.slice(i,i+10).join(''));
  var head='Streak '+score+(daily?' / '+DAILY_PAIRS:'')+(score>=WIN_AT?' 🔥':'');
  var lines=[head]; if(!daily) lines.push(stat.l+' · '+DIFFS[difficulty].lbl);
  return T.shareText(GID, daily, lines.concat(rows));
}
function endRun(perfect){
  over=true;
  var daily=mode==='daily', score=streak, win=score>=WIN_AT, share=shareFor(daily, score, marks);
  // record immediately so a reload can't replay a finished daily
  T.record(GID,{daily:daily, win:win, score:score, share:share, detail:{stat:stat.k, diff:difficulty, marks:marks.map(function(m){return m?1:0;})}});
  if(daily) renderControls();   // the Daily button now reads "done today"
  var g0=gen;
  setTimeout(function(){
    if(g0!==gen) return;
    var title = perfect ? 'Perfect chain' : 'Streak of '+score;
    var line = daily
      ? (perfect ? 'All '+DAILY_PAIRS+' pairs right on Grade.' : 'You got <b>'+score+'</b> of '+DAILY_PAIRS+' pairs in a row on Grade.')
      : 'Best on '+esc(stat.l)+' ('+DIFFS[difficulty].lbl+'): <b>'+best+'</b>.';
    var el=document.getElementById('gr');
    el.innerHTML=T.resultHtml(GID,{title:title, line:line, shareText:share, statsOpts:{score:'Avg streak'}, again:daily?'Free play':'Play again', daily:daily});
    T.wireResult(el, share, daily ? function(){ setMode('practice'); } : newGame);
  }, 700);
}
function showDailyDone(r){
  gen++;
  var s=r.score!=null?r.score:0;
  document.getElementById('content').innerHTML='<div id="gr">'+T.resultHtml(GID,{
    title:"Today's daily is done",
    line:'Your streak: <b>'+esc(s)+'</b> of '+DAILY_PAIRS+' on Grade. A new chain unlocks at midnight ET.',
    shareText:r.share, statsOpts:{score:'Avg streak'}, again:'Free play', daily:true})+'</div>';
  T.wireResult('gr', r.share, function(){ setMode('practice'); });
}

async function init(){
  renderControls();
  try{
    // order=id keeps the pool in a stable order across visitors (the daily chain depends on it)
    const base=SB+'/rest/v1/player_history?select=id,name,team,season_year,position,height,tdc_grade,ppg,rpg,apg,stl,blk,tovs,oreb,dreb,mpg,fg_pct,tp_pct,ft_pct,fga,tpm,tpa,ftm,fta,espn_id,photo_url&tdc_grade=gte.74&gp=gte.18&mpg=gte.20&order=id.asc';
    const cr=await fetch(base+'&limit=1',{headers:Object.assign({},H,{'Prefer':'count=exact','Range':'0-0','Range-Unit':'items'})});
    const total=parseInt((cr.headers.get('content-range')||'/0').split('/')[1]||0)||5000;
    const PG=1000, pages=Math.ceil(total/PG), jobs=[];
    for(let i=0;i<pages;i++) jobs.push(fetch(base,{headers:Object.assign({},H,{'Range-Unit':'items','Range':(i*PG)+'-'+(i*PG+PG-1)})}).then(r=>r.ok?r.json():[]));
    const parts=await Promise.all(jobs);
    POOL=TDCTeamName.fix(parts.reduce((a,b)=>a.concat(b),[])).filter(p=>p&&p.name&&(parseFloat(p.mpg)||0)>0);
    if(!POOL.length){document.getElementById('content').innerHTML='<div class="loading">Could not load players.</div>';return;}
    // Grade = the site's canonical box-adjusted grade for that season (per-season centered,
    // weak-team dampened), so the number matches the player page / rankings for every year.
    if(window.TDCRating&&TDCRating.ready){ try{ await TDCRating.ready; }catch(e){} }
    try{ if(window.TDCProjGrade&&TDCProjGrade.loadHist) await TDCProjGrade.loadHist(); }catch(e){}
    POOL.forEach(function(p){ try{
      var so=(function(p){ try{ if(window.TDCProjGrade&&TDCProjGrade.statOvr){ var so=TDCProjGrade.statOvr(p); if(so!=null&&isFinite(so)) return Math.round(so); } }catch(e){} return null; })(p); if(so!=null){ p.tdc_grade=so; return; }   // that season's statistical overall first
      if(window.TDCRating&&TDCRating.boxAdjust){ var a=TDCRating.boxAdjust(p.tdc_grade,{position:p.position,height:p.height},p,parseInt(p.season_year)||0);
      if(a&&a.grade!=null) p.tdc_grade=Math.round(a.grade); } }catch(e){} });
    start();
  }catch(e){document.getElementById('content').innerHTML='<div class="loading">Error: '+esc(e.message)+'</div>';}
}
init();
</script>
