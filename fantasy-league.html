  <style>
    :root{--green:#2e8b57;--red:#c0392b;}
    [data-theme="dark"]{--green:#6fbf7e;--red:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .page{padding:28px 0 64px;}
    button{font:inherit;cursor:pointer;}
    a{color:inherit;}
    .page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .page-h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:6px;}
    .meta{font-size:12px;color:var(--text3);margin-bottom:16px;}
    .btn{font:700 12px 'Inter',system-ui,sans-serif;letter-spacing:.02em;padding:8px 14px;border-radius:999px;border:1px solid var(--text);background:var(--text);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn.ghost{background:var(--bg);color:var(--text2);border-color:var(--border2);}
    .btn.danger{background:var(--bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2));}
    .btn.sm{padding:4px 10px;font-size:11px;}
    .btn:disabled{opacity:.45;cursor:default;}
    .fi,.fs{font:500 14px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:8px;outline:none;}
    .fi:focus,.fs:focus{border-color:var(--accent);}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .sp{flex:1;}
    .msg{font-size:12.5px;margin:6px 0;min-height:16px;} .msg.err{color:var(--red);font-weight:600;} .msg.ok{color:var(--green);font-weight:600;}
    .empty{padding:30px 12px;text-align:center;color:var(--text3);font-size:13px;}
    .cl-note{font-size:12px;color:var(--text3);margin:6px 0 12px;line-height:1.5;}
    .sec-h{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding-bottom:8px;border-bottom:1px solid var(--border);margin:22px 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:18px;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:none;font:700 12px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text2);padding:6px 13px;border-radius:999px;text-decoration:none;white-space:nowrap;}
    .tab.on{background:var(--text);color:var(--bg);border-color:var(--text);}
    .seg{display:inline-flex;border:1px solid var(--border2);border-radius:999px;overflow:hidden;}
    .seg button{background:var(--bg);border:none;color:var(--text2);font:700 11.5px 'Inter',system-ui,sans-serif;padding:6px 12px;}
    .seg button.on{background:var(--text);color:var(--bg);}
    .pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);vertical-align:1px;margin-left:4px;}
    .pill.pg{color:#3b6fb6;border-color:color-mix(in srgb,#3b6fb6 50%,var(--border2));}
    [data-theme="dark"] .pill.pg{color:#8fb3ea;}
    .pill.ir{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2));}
    .pill.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--border2));}
    .lg{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:6px;}
    .nm a{text-decoration:none;font-weight:700;} .nm a:hover{color:var(--accent);text-decoration:underline;}
    .sheet td .sub{display:block;font-size:10px;color:var(--text3);font-weight:600;}
    .sheet tfoot td{text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums;border-top:2px solid var(--border2);font-weight:800;} .sheet tfoot td.l{text-align:left;}
    .me-row td{background:color-mix(in srgb,var(--accent) 10%,transparent)!important;}
    .cut td{border-bottom:2px solid var(--accent)!important;}
    .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
    @media(max-width:900px){ .grid2{grid-template-columns:1fr;} }
    .card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--bg);}
    .stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 4px;}
    .stat{border:1px solid var(--border);border-radius:10px;padding:10px;}
    .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
    .stat span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .brk{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .brk .side{border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12.5px;}
    .brk .side h4{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
    .brk .m{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--border);}
    .brk .m:first-of-type{border-top:none;}
    details.ps{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--bg);}
    details.ps>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
    details.ps>summary::-webkit-details-marker{display:none;}
    details.ps>summary .nx{margin-left:auto;font-size:11.5px;color:var(--text3);}
    details.ps .sheet-wrap{border:none;border-top:1px solid var(--border);border-radius:0 0 10px 10px;}
    .wl{font-weight:800;} .wl.w{color:var(--green);} .wl.l{color:var(--red);}
    tr.up td{color:var(--text3);}
    .acts{display:flex;gap:4px;justify-content:flex-end;}
    .login{max-width:420px;}
    .login .fi{width:100%;text-transform:uppercase;letter-spacing:.06em;}
    .bar{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--text2);margin:8px 0 12px;}
    .bar b{color:var(--text);}
    @media(max-width:640px){
      .page-h1{font-size:26px;}
      .hm{display:none;}
      .stats4{grid-template-columns:repeat(2,minmax(0,1fr));}
      .brk{grid-template-columns:1fr;}
      .sheet{font-size:12px;}
    }

<body>

<div class="page" id="app"><div class="empty">Loading the league…</div></div>
<script>
/* fantasy-league.html — the owner's 2026-27 COUNTING LEAGUE (Nov 2026).
 * 12 teams in two divisions of 6, drafted in person ($200, 12 players, max 3 PGs from the league list). Scoring: roto on
 * total PTS / REB / AST, counting only each school's 22 counted games (scripts/data/fantasy_counting_2027.json, matched by
 * ESPN game id) on the days a player is on the roster and not on IR. Top 3 of each division make the playoffs.
 * Data: scripts/fantasy_cl.sql (cl_* tables; writes only through code-checked functions). Until that SQL and the seed
 * are run, the page reads the drafted rosters from scripts/data/fantasy_cl_rosters_2027.json (view only).
 * Projected season = counted stats so far + the site's projected per-game line x counted games left. */
(function(){
  const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
  const CONFS=['B10','SEC','ACC','BIG-12','Big-East'];
  const CATS=[['pts','PTS'],['reb','REB'],['ast','AST']];
  const app=document.getElementById('app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const f0=n=>Math.round(n||0).toLocaleString(), f1=n=>(Math.round((n||0)*10)/10).toFixed(1);
  const TODAY=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
  const store={get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }};
  const logo=t=>{ try{ const c=window.tdcTeamColor&&tdcTeamColor(t); return c&&c.logo||null; }catch(e){ return null; } };
  const lgImg=t=>{ const l=logo(t); return l?`<img class="lg" src="${esc(l)}" alt="" loading="lazy">`:''; };
  const qList=a=>a.map(x=>'"'+String(x).replace(/"/g,'')+'"').join(',');
  const md=d=>{ const [y,m,dd]=d.split('-'); return (+m)+'/'+(+dd); };

  async function get(path){ const r=await fetch(`${SB}/rest/v1/${path}`,{headers:H}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
  async function getAll(path){ let out=[], off=0; for(;;){ const r=await get(`${path}&limit=1000&offset=${off}`); out=out.concat(r); if(r.length<1000) return out; off+=1000; } }
  async function rpc(fn,body){
    const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:H,body:JSON.stringify(body)});
    const j=await r.json().catch(()=>null);
    if(!r.ok) throw new Error((j&&j.message)||('Error '+r.status));
    return j;
  }
  const jget=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);

  // ── state ──
  let SET={roster:12,pickups:5,max_pg:3,max_ir:2,reg_end:'2027-03-07',draft_start:'2026-11-01'};
  let TEAMS=[], STINTS=[], IR=[], MOVES=[], PG=new Set(), PENDING=false;
  let CNT={}, CNTDATES={}, CNTG={}, FULL={}, SHORT={}, RES={}, PROJ={}, FRESH={}, REAL={}, BOX={}, POOL=null;
  let ME=null, CODE=store.get('cl_code');
  // the Players page (free agents + adds) is only for these teams' logins, or the site owner (owner, Nov 10 2026)
  const PLAYERS_FOR=['Aidan','Mark'];
  const canPlayers=()=>!!((ME&&PLAYERS_FOR.includes(ME.name))||(window.tdcIsOwner&&tdcIsOwner()));
  let mode=store.get('cl_mode')||'actual';      // standings: actual | proj
  let rmode=store.get('cl_rmode')||'tot';       // roster: tot | pg | proj

  async function load(){
    const [cnt,proj,fresh,real,rat,draft,res]=await Promise.all([
      jget('scripts/data/fantasy_counting_2027.json?v=1'),
      jget('scripts/data/stat_overall_projected.json?v=96'),
      jget('scripts/data/fresh_fit.json?v=41'),
      jget('scripts/data/real_lines_2027.json?t='+TODAY),
      get('predictive_ratings?select=data&limit=1').catch(()=>[]),
      jget('scripts/data/fantasy_cl_rosters_2027.json?v=1'),
      jget('scripts/data/results_2027.json?t='+Math.floor(Date.now()/6e5))]);
    if(cnt&&cnt.teams) Object.entries(cnt.teams).forEach(([t,l])=>{ CNT[t]=new Set(l.map(g=>String(g.id))); CNTDATES[t]=l.map(g=>g.date).sort(); CNTG[t]=[...l].sort((a,b)=>a.date<b.date?-1:1); });
    // finals: [id, date, home idx, away idx, home pts, away pts, neutral, conf, ot]
    if(res&&res.games) res.games.forEach(g=>{ RES[g[0]]={home:res.teams[g[2]],away:res.teams[g[3]],hs:g[4],as:g[5],ot:g[8]}; });
    PROJ=(proj&&proj.players)||{}; FRESH=fresh||{}; REAL=(real&&real.players)||{};
    ((rat[0]&&rat[0].data&&rat[0].data.teams)||[]).forEach(t=>{ if(t.team&&t.full){ FULL[t.team]=t.full; SHORT[t.full]=t.team; } });
    // league tables; until the SQL runs, the drafted rosters from the JSON (view only)
    try{
      const [st,tm,sn,ir,mv,pg]=await Promise.all([get('cl_settings?select=*'),get('cl_teams?select=id,name,division,is_commish&order=id.asc'),
        getAll('cl_stints?select=*&order=id.asc'),get('cl_ir?select=*&order=id.asc'),get('cl_moves?select=*&order=id.desc&limit=200'),get('cl_pg?select=player_id')]);
      if(!tm.length) throw new Error('not seeded');
      if(st[0]) SET=st[0]; TEAMS=tm; STINTS=sn; IR=ir; MOVES=mv; PG=new Set(pg.map(x=>x.player_id));
    }catch(e){
      PENDING=true;
      if(!draft) throw new Error('No league data yet.');
      let id=0, sid=0;
      Object.entries(draft.divisions).forEach(([div,ts])=>ts.forEach(t=>{ const tid=++id; TEAMS.push({id:tid,name:t,division:+div});
        draft.rosters[t].forEach(r=>{ STINTS.push({id:++sid,team_id:tid,player_id:r.pid,espn_id:r.espn_id,name:r.name,school:r.school,price:r.price,how:'draft',start_date:SET.draft_start,end_date:null});
          if(r.sheet_pg) PG.add(r.pid); }); }));
    }
    await loadBox();
  }
  // every counted-season box line for anyone who has been on a roster
  async function loadBox(){
    BOX={};
    const ids=[...new Set(STINTS.map(s=>s.espn_id).filter(Boolean))];
    const add=b=>{ (BOX[b.espn_id]=BOX[b.espn_id]||[]).push(b); };
    for(let i=0;i<ids.length;i+=120){
      const rows=await getAll(`box_scores?season_year=eq.2027&espn_id=in.(${ids.slice(i,i+120).join(',')})&date=gte.${SET.draft_start}&select=game_id,espn_id,date,team,pts,reb,ast,min&order=game_id.asc,espn_id.asc`).catch(()=>[]);
      rows.forEach(add);
    }
    // a pick with no ESPN id yet (hasn't played): match his box lines by name + school once he does
    for(const s of STINTS.filter(s=>!s.espn_id)){
      const full=FULL[s.school]; if(!full) continue;
      const nm=s.name.replace(/\s*["“][^"”]*["”]\s*/,' ').replace(/\s+/g,' ').trim();
      const rows=await get(`box_scores?season_year=eq.2027&team=eq.${encodeURIComponent(full)}&player=eq.${encodeURIComponent(nm)}&select=game_id,espn_id,date,team,pts,reb,ast,min&order=game_id.asc`).catch(()=>[]);
      if(rows.length){ s.espn_id=rows[0].espn_id; rows.forEach(add); }
    }
  }

  // ── scoring ──
  const counted=b=>!!(CNT[b.team]&&CNT[b.team].has(String(b.game_id)));
  const irFor=sid=>IR.filter(i=>i.stint_id===sid);
  const onIR=(sid,d)=>irFor(sid).some(i=>i.start_date<=d&&(!i.end_date||i.end_date>d));
  const live=(s,d)=>s.start_date<=d&&(!s.end_date||s.end_date>d);
  const isPG=s=>PG.has(s.player_id);
  // a stint's counted stats: games on his roster days, not on IR, regular season only
  function stintActual(s){
    const o={gp:0,pts:0,reb:0,ast:0};
    (BOX[s.espn_id]||[]).forEach(b=>{ if(b.date>SET.reg_end||!live(s,b.date)||onIR(s.id,b.date)||!counted(b)) return;
      o.gp++; o.pts+=b.pts||0; o.reb+=b.reb||0; o.ast+=b.ast||0; });
    return o;
  }
  function perGame(s){
    const pr=s.espn_id!=null?PROJ[String(s.espn_id)]:null;
    if(pr&&(pr.ppg!=null)) return {pts:+pr.ppg||0,reb:+pr.rpg||0,ast:+pr.apg||0};
    const fr=(FRESH[s.school]||{})[s.name];
    if(fr&&fr.ppg!=null) return {pts:+fr.ppg||0,reb:+fr.rpg||0,ast:+fr.apg||0,est:true};
    return {pts:0,reb:0,ast:0,none:true};
  }
  // counted games he still has with this team: today counts until his box line exists
  function gamesLeft(s){
    const full=FULL[s.school]; if(!full||!CNTDATES[full]) return 0;
    if(s.end_date&&s.end_date<=TODAY) return 0;
    const played=new Set((BOX[s.espn_id]||[]).map(b=>b.date));
    const from=s.start_date>TODAY?s.start_date:TODAY;
    const ir=irFor(s.id).find(i=>!i.end_date);
    return CNTDATES[full].filter(d=>d>=from&&d<=SET.reg_end&&!played.has(d)&&(!s.end_date||d<s.end_date)&&!(ir&&d>=ir.start_date)).length;
  }
  function stintLine(s){
    const a=stintActual(s), left=gamesLeft(s), pg=perGame(s);
    return {a, left, pg, proj:{pts:a.pts+pg.pts*left, reb:a.reb+pg.reb*left, ast:a.ast+pg.ast*left}};
  }
  function teamTotals(tid){
    const t={gp:0,pts:0,reb:0,ast:0,ppts:0,preb:0,past:0};
    STINTS.filter(s=>s.team_id===tid).forEach(s=>{ const L=stintLine(s);
      t.gp+=L.a.gp; t.pts+=L.a.pts; t.reb+=L.a.reb; t.ast+=L.a.ast; t.ppts+=L.proj.pts; t.preb+=L.proj.reb; t.past+=L.proj.ast; });
    return t;
  }
  // roto: best in the group gets n points per category, ties share
  function roto(rows,proj){
    const out={}; rows.forEach(r=>out[r.id]={total:0});
    CATS.forEach(([k])=>{ const key=proj?'p'+k:k, s=[...rows].sort((a,b)=>b.tot[key]-a.tot[key]);
      let i=0; while(i<s.length){ let j=i; while(j+1<s.length&&s[j+1].tot[key]===s[i].tot[key]) j++;
        const pts=s.length-(i+j)/2; for(let x=i;x<=j;x++){ out[s[x].id][k]=pts; out[s[x].id].total+=pts; } i=j+1; } });
    return out;
  }
  function table(group,proj){
    const rows=group.map(t=>({id:t.id,t,tot:teamTotals(t.id)})), R=roto(rows,proj);
    rows.forEach(r=>r.r=R[r.id]);
    rows.sort((a,b)=>b.r.total-a.r.total||(proj?b.tot.ppts-a.tot.ppts:b.tot.pts-a.tot.pts));
    return rows;
  }

  // ── routing ──
  function go(h){ location.hash=h; }
  window.addEventListener('hashchange',route);
  function shell(tab,inner){
    const tabs=[['#/','Standings'],['#/teams','Teams'],['#/me',ME?esc(ME.name):'My team'],['#/schedule','Schedule'],...(canPlayers()?[['#/players','Players']]:[]),['#/rules','Rules']];
    app.innerHTML=`<div class="page-eyebrow">Counting League · 2026-27</div>
      <h1 class="page-h1">${tab==='me'&&ME?esc(ME.name):'Counting League'}</h1>
      <div class="meta">PTS · REB · AST roto over each school's 22 counted games · stats through ${esc(lastGameDate()||'—')}${PENDING?' · <b>view only until league setup finishes</b>':''}</div>
      <nav class="tabs">${tabs.map(([h,l])=>`<a class="tab${(h==='#/'&&tab==='st')||h==='#/'+tab?' on':''}" href="${h}">${l}</a>`).join('')}</nav>
      <div id="view">${inner}</div>`;
  }
  const lastGameDate=()=>{ let m=''; Object.values(BOX).forEach(l=>l.forEach(b=>{ if(counted(b)&&b.date>m) m=b.date; })); return m?md(m):''; };
  async function route(){
    const h=location.hash.replace(/^#\/?/,''), [a,b]=h.split('/');
    if(a==='team'&&b) return viewTeam(+b);
    if(a==='teams') return viewTeams();
    if(a==='me') return viewMe();
    if(a==='players') return canPlayers()?viewPlayers():viewStandings();
    if(a==='rules') return viewRules();
    if(a==='schedule') return viewSchedule(b?+b:null);
    return viewStandings();
  }

  // ── standings ──
  function segHTML(id,opts,cur){ return `<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${v===cur?'on':''}">${l}</button>`).join('')}</div>`; }
  function wireSeg(id,fn){ const el=document.getElementById(id); el&&el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) fn(b.dataset.v); }); }
  function stTable(rows,proj,cut){
    const k=c=>proj?'p'+c:c;
    return `<div class="sheet-wrap"><table class="sheet dense"><thead><tr><th>#</th><th class="l">Team</th>${CATS.map(([c,l])=>`<th>${l}</th>`).join('')}<th>Roto</th><th class="hm">GP</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr class="${ME&&r.id===ME.id?'me-row':''}${cut&&i===cut-1?' cut':''}"><td>${i+1}</td>
        <td class="l nm"><a href="#/team/${r.id}">${esc(r.t.name)}</a></td>
        ${CATS.map(([c])=>`<td>${f0(r.tot[k(c)])}<span class="sub">${r.r[c]}</span></td>`).join('')}
        <td><b>${r.r.total}</b></td><td class="hm">${r.tot.gp}</td></tr>`).join('')}
    </tbody></table></div>`;
  }

  function rosterTable(tid,manage){

      if(m==='pg') return a.gp?`<td>${a.gp}</td><td>${f1(a.pts/a.gp)}</td><td>${f1(a.reb/a.gp)}</td><td>${f1(a.ast/a.gp)}</td>`:`<td>0</td><td colspan="3" class="l" style="color:var(--text3)">proj ${f1(r.L.pg.pts)} / ${f1(r.L.pg.reb)} / ${f1(r.L.pg.ast)}</td>`;
      return `<td>${a.gp}</td><td>${a.pts}</td><td>${a.reb}</td><td>${a.ast}</td>`; };

    const T=rows.reduce((o,r)=>{ const v=m==='proj'?r.L.proj:r.L.a; o.pts+=v.pts; o.reb+=v.reb; o.ast+=v.ast; o.gp+=r.L.a.gp; o.left+=r.L.left; return o; },{pts:0,reb:0,ast:0,gp:0,left:0});
    return `<div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">Player</th>${head}${manage?'<th></th>':''}</tr></thead><tbody>
      ${rows.map(r=>`<tr>${playerCell(r.s,r.ir)}${cells(r)}${act(r)}</tr>`).join('')||'<tr><td class="l" colspan="6">No players.</td></tr>'}
      </tbody>${m!=='pg'?`<tfoot><tr><td class="l">Current roster</td><td>${m==='proj'?T.left:T.gp}</td><td>${f0(T.pts)}</td><td>${f0(T.reb)}</td><td>${f0(T.ast)}</td>${manage?'<td></td>':''}</tr></tfoot>`:''}</table></div>`;

      .filter(r=>!r.pg.none||r.real).sort((a,b)=>(b.pg.pts+b.pg.reb+b.pg.ast)*b.left-(a.pg.pts+a.pg.reb+a.pg.ast)*a.left);

        ${list.map(r=>{ const s={...r.p,price:0,how:'draft',start_date:TODAY,end_date:null}; const tm=r.own?TEAMS.find(t=>t.id===r.own):null;

            <td>${f1(r.pg.pts)}</td><td>${f1(r.pg.reb)}</td><td>${f1(r.pg.ast)}</td><td>${r.left}</td><td>${f0((r.pg.pts+r.pg.reb+r.pg.ast)*r.left)}<span class="sub">P+R+A</span></td>
            ${ME&&!PENDING?`<td>${tm?`<span class="pill">${esc(tm.name)}</span>`:`<button class="btn sm" data-add="${r.p.id}" data-espn="${r.p.espn_id||''}">Add</button>`}</td>`:''}</tr>`; }).join('')||'<tr><td class="l" colspan="8">No players match.</td></tr>'}</tbody>`;

  // ── schedule: every counted game for each player, result + his line for the ones played ──
  const oppName=f=>SHORT[f]||String(f||'').replace(/\s+\S+$/,'');
  function resultFor(full,gid){ const r=RES[gid]; if(!r) return null; const home=r.home===full;
    if(!home&&r.away!==full) return null; const us=home?r.hs:r.as, them=home?r.as:r.hs; return {w:us>them,us,them,ot:r.ot}; }
  function playerSchedule(s){
    const full=FULL[s.school], games=CNTG[full]||[], box={}; (BOX[s.espn_id]||[]).forEach(b=>{ box[b.game_id]=b; });
    const ir=irFor(s.id);
    let w=0,l=0;
    const rows=games.map(g=>{ const r=resultFor(full,g.id), b=box[g.id], mine=live(s,g.date), onir=ir.some(i=>i.start_date<=g.date&&(!i.end_date||i.end_date>g.date));
      if(r){ r.w?w++:l++; }
      const at=g.site==='A'?'@ ':g.site==='N'?'vs ':'';
      const res=r?`<span class="wl ${r.w?'w':'l'}">${r.w?'W':'L'}</span> ${r.us}-${r.them}${r.ot?' OT':''}`:(g.date<TODAY?'—':'');
      const line=b?`${b.pts||0} / ${b.reb||0} / ${b.ast||0}${!mine?' <span class="pill">not yours</span>':onir?' <span class="pill ir">IR</span>':''}`:(r?'DNP':'');
      return {g,r,html:`<tr class="${r||g.date<TODAY?'':'up'}"><td class="l">${md(g.date)}${g.date===TODAY?' <span class="pill g">today</span>':''}</td><td class="l">${at}${lgImg(oppName(g.opp))}${esc(oppName(g.opp))}${g.conf?'':' <span class="pill">non-conf</span>'}</td><td class="l">${res}</td><td>${line}</td></tr>`}; });
    const left=rows.filter(x=>!x.r&&x.g.date>=TODAY), nxt=left[0];
    return {w,l,left:left.length,next:nxt&&nxt.g,rows};
  }
  function viewSchedule(tid){
    const id=tid||(ME&&ME.id)||(TEAMS[0]&&TEAMS[0].id), t=TEAMS.find(x=>x.id===id);
    const ros=STINTS.filter(s=>s.team_id===id&&(!s.end_date||s.end_date>TODAY));
    const blocks=ros.map(s=>{ const P=playerSchedule(s), ir=irFor(s.id).find(i=>!i.end_date);
      const nx=P.next?`next ${md(P.next.date)} ${P.next.site==='A'?'@':P.next.site==='N'?'vs':'vs'} ${esc(oppName(P.next.opp))}`:'season done';
      return `<details class="ps"><summary><b>${lgImg(s.school)}${esc(s.name)}</b>${isPG(s)?'<span class="pill pg">PG</span>':''}${ir?'<span class="pill ir">IR</span>':''}
        <span class="cl-note" style="margin:0">${esc(s.school)} · ${P.w}-${P.l} in counted games · ${P.left} left</span><span class="nx">${nx}</span></summary>
        <div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">Date</th><th class="l">Opponent</th><th class="l">Result</th><th>PTS / REB / AST</th></tr></thead><tbody>${P.rows.map(x=>x.html).join('')}</tbody></table></div></details>`; }).join('');
    // by date: who plays when, from today on
    const byDay={}; ros.forEach(s=>{ if(irFor(s.id).find(i=>!i.end_date)) return; (CNTG[FULL[s.school]]||[]).forEach(g=>{ if(g.date>=TODAY&&!resultFor(FULL[s.school],g.id)) (byDay[g.date]=byDay[g.date]||[]).push(s.name); }); });
    shell('schedule',`<div class="row" style="margin-bottom:10px"><select class="fs" id="schT">${TEAMS.map(x=>`<option value="${x.id}"${x.id===id?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <span class="cl-note" style="margin:0">Tap a player for his full counted schedule. W/L = his school's result.</span></div>
      ${blocks||'<div class="empty">No players.</div>'}
      <div class="sec-h">Games left by date</div><div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">Date</th><th>#</th><th class="l">Players</th></tr></thead><tbody>
        ${Object.entries(byDay).sort().map(([d,l])=>`<tr><td class="l"><b>${md(d)}</b></td><td>${l.length}</td><td class="l">${l.map(esc).join(', ')}</td></tr>`).join('')}</tbody></table></div>`);
    document.getElementById('schT').addEventListener('change',e=>go('#/schedule/'+e.target.value));
  }

  function viewRules(){
    shell('rules',`<div class="card" style="font-size:13.5px;line-height:1.65">
      <p><b>Teams.</b> 12 teams, two divisions of 6. Drafted in person: $200, 12 players, Big Ten / SEC / ACC / Big 12 / Big East only.</p>
      <p><b>Scoring.</b> Total points, rebounds and assists, counting only each school's 22 counted games (18 conference + 4 non-conference, the league schedule). Standings are roto: in each category the best team in the division gets 6 points, the worst 1; ties share.</p>
      <p><b>Roster.</b> ${SET.roster} active players, up to ${SET.max_ir} on IR (IR players don't score and don't use an active spot), at most ${SET.max_pg} point guards from the league PG list, IR included.</p>
      <p><b>Moves.</b> ${SET.pickups} pickups per team for the season; drops are free. Every move takes effect the next day (ET). A dropped player's stats stay with the team that had him.</p>
      <p><b>Playoffs.</b> Top 3 in each division. The #1 seed gets a bye; #2 plays #3; the winner plays #1; the two division champions meet in the final.</p>
      <p><b>Updates.</b> Box scores load three times a day (about 10:30 pm, 1:15 am and noon ET), so standings move the night games end. Regular season ends ${md(SET.reg_end)}.</p></div>`);
  }

  // signed in BEFORE the first render: the Players tab and its route depend on who it is
  load().then(async()=>{ if(CODE&&!PENDING){ try{ ME=await rpc('cl_login',{p_code:CODE}); }catch(e){} } route(); })
    .catch(e=>{ app.innerHTML=`<div class="empty">Couldn't load the league: ${esc(e.message)}</div>`; });
})();
</script>
<script src="tdc-version.js?v=2"></script>
</body>
