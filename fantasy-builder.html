  <style>
    :root{--green:#2e8b57;--red:#c0392b;}
    [data-theme="dark"]{--green:#6fbf7e;--red:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    button{font:inherit;cursor:pointer;}
    a{color:inherit;}
    .page{padding:28px 0 64px;}
    .kick{font:800 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
    .kick a{text-decoration:none;} .kick a:hover{text-decoration:underline;}
    .page-h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:6px;}
    .lede{font-size:14px;color:var(--text2);max-width:760px;line-height:1.5;margin-bottom:18px;}
    .btn{font:700 12px 'Inter',system-ui,sans-serif;letter-spacing:.02em;padding:8px 14px;border-radius:999px;border:1px solid var(--text);background:var(--text);color:var(--bg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
    .btn.ghost{background:var(--bg);color:var(--text2);border-color:var(--border2);}
    .btn.sm{padding:3px 9px;font-size:11px;}
    .btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
    .btn.no.on{background:var(--red);border-color:var(--red);}
    .fi,.fs{font:500 13px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:8px;outline:none;}
    .fi:focus,.fs:focus{border-color:var(--accent);}
    .set{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
    .set label{display:flex;flex-direction:column;gap:4px;font:800 10.5px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .set .fi{width:96px;}
    .empty{padding:30px 12px;text-align:center;color:var(--text3);font-size:13px;}
    .fb-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;margin-bottom:22px;background:var(--bg);}
    .fb-tiles>div{padding:14px 16px;}
    .fb-tiles>div+div{border-left:1px solid var(--border);}
    .fb-tiles b{display:block;font:800 24px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;}
    .fb-tiles span{font:800 10.5px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .fb-tiles small{display:block;font-size:11.5px;color:var(--text3);margin-top:3px;}
    .up{color:var(--green);} .dn{color:var(--red);}
    .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 10px;}
    .sec-h h2{font:800 15px Inter,system-ui,sans-serif;letter-spacing:.02em;}
    .sec-h .r{font-size:12px;color:var(--text3);}
    .pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);vertical-align:1px;}
    .pill.a{color:var(--accent);border-color:var(--accent);}
    .pill.r{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2));}
    .nm a{text-decoration:none;font-weight:700;} .nm a:hover{color:var(--accent);text-decoration:underline;}
    .sheet td .sub{display:block;font-size:10.5px;color:var(--text3);font-weight:500;}
    .sheet .lg{width:15px;height:15px;object-fit:contain;vertical-align:-3px;margin-right:4px;}
    .sheet tfoot td{text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums;border-top:2px solid var(--border2);font-weight:800;} .sheet tfoot td.l{text-align:left;}
    .sheet tr.lock td{background:color-mix(in srgb,var(--accent) 9%,transparent)!important;}
    .sheet tr.avoid td{opacity:.45;}
    .sheet td.edge.pos{color:var(--green);font-weight:800;} .sheet td.edge.neg{color:var(--red);font-weight:700;}
    .pr{width:58px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;}
    .acts{white-space:nowrap;display:flex;gap:4px;justify-content:flex-end;}
    .filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
    .fb-note{font-size:12px;color:var(--text3);line-height:1.55;margin-top:10px;max-width:900px;}
    .fb-note b{color:var(--text2);}
    .fb-sec{margin-bottom:30px;}
    @media(max-width:820px){ .fb-tiles{grid-template-columns:repeat(2,minmax(0,1fr));} .fb-tiles>div{border-left:none!important;border-top:1px solid var(--border);} .fb-tiles>div:first-child{border-top:none;grid-column:1/-1;} .page-h1{font-size:28px;} }

<div class="page">

  <h1 class="page-h1">Draft Planner</h1>
  <div class="set">
    <label>Budget<input class="fi" id="sBudget" type="number" min="12" max="1000"></label>
    <label>Roster<input class="fi" id="sRoster" type="number" min="5" max="20"></label>

  </div>

</div>

<script>
(function(){
  const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  const CONFS={'B10':'Big Ten','SEC':'SEC','ACC':'ACC','BIG-12':'Big 12','Big-East':'Big East'};
  const CATS=[['pts','PTS'],['reb','REB'],['ast','AST']];
  // last year's league: the Division 2 winner's season totals, the bar a plan has to clear
  const BAR={pts:4371,reb:1370,ast:841};
  // the league's 2025-26 auction, price by sale rank (owner's sheet, Oct 24 2026); past #120 everyone went for $1
  const CURVE=[[1,55],[3,50],[6,43],[12,35],[24,30],[36,26],[48,20],[72,15],[96,10],[120,2]];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const f1=v=>v==null||isNaN(v)?'—':(+v).toFixed(1);
  const f0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString();
  const H={apikey:KEY,Authorization:'Bearer '+KEY};
  const get=p=>fetch(`${SB}/rest/v1/${p}`,{headers:H}).then(r=>{ if(!r.ok) throw new Error('Supabase '+r.status); return r.json(); });
  async function getAll(p){ const out=[]; for(let off=0;;off+=1000){ const rows=await get(`${p}&limit=1000&offset=${off}`); out.push(...rows); if(rows.length<1000) return out; } }
  const qList=a=>a.map(x=>'"'+String(x).replace(/"/g,'\\"')+'"').join(',');
  const logo=t=>{ try{ const c=window.tdcTeamColor&&tdcTeamColor(t); return c&&c.logo||null; }catch(e){ return null; } };
  const lgImg=t=>{ const l=logo(t); return l?`<img class="lg" src="${esc(l)}" alt="" loading="lazy">`:''; };

  // ── saved plan (this browser) ──
  const SK='tdc_fb_v1';
  let ST={budget:200,roster:12,maxpg:3,teams:12,lock:{},avoid:{},price:{}};
  try{ Object.assign(ST,JSON.parse(localStorage.getItem(SK)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(SK,JSON.stringify(ST)); }catch(e){} };

  let POOL=[], FULL={}, CNT=null, MARCH=null, PLAN=null;
  const UI={q:'',pos:'all',sort:'edge',n:60};

  async function load(){
    const [teams,proj,rat]=await Promise.all([
      get(`teams?conference=in.(${Object.keys(CONFS).join(',')})&select=name,conference&order=name.asc`),
      fetch('scripts/data/stat_overall_projected.json?v=96').then(r=>r.ok?r.json():null).catch(()=>null),
      get('predictive_ratings?select=data&limit=1').catch(()=>[])]);
    try{ const cs=await fetch('scripts/data/fantasy_counting_2027.json?v=1').then(r=>r.ok?r.json():null);
      if(cs&&cs.teams){ CNT={}; Object.entries(cs.teams).forEach(([t,l])=>{ CNT[t]=l.length; }); } }catch(e){}
    const CONF=Object.fromEntries(teams.map(t=>[t.name,t.conference]));
    POOL=await getAll(`players?team=in.(${encodeURIComponent(qList(teams.map(t=>t.name)))})&select=id,name,team,position,espn_id,yr,is_injured&order=id.asc`);
    if(window.TDCFresh) await TDCFresh.load().catch(()=>{});
    const PROJ=(proj&&proj.players)||{};
    const SHARE={}; Object.entries((proj&&proj.teams)||{}).forEach(([t,l])=>l.forEach(x=>{ SHARE[t+'|'+x.name]=x.share; }));
    const RT=(rat[0]&&rat[0].data&&rat[0].data.teams)||[];
    RT.forEach(t=>{ if(CONF[t.team]&&!FULL[t.team]) FULL[t.team]=t.full; });
    // the same projected line league.html drafts from: published projection, else the freshman engine held to his share
    POOL.forEach(p=>{
      p.conf=CONF[p.team]; const pr=p.espn_id!=null?PROJ[String(p.espn_id)]:null;
      p.proj=pr?{pts:pr.ppg||0,reb:pr.rpg||0,ast:pr.apg||0,mpg:pr.mpg||0}:null;
      if(pr&&pr.team&&!FULL[p.team]) FULL[p.team]=pr.team;
      if(!p.proj&&window.TDCFresh){ try{ const F=TDCFresh.line(p,TDCFresh.profileFor(p)); if(F&&F.mpg>0){
        const sh=SHARE[p.team+'|'+p.name], imp=(F.fga||0)/58*100, k=sh!=null&&imp>0?Math.min(1,sh/imp):1;
        p.proj={pts:(F.ppg||0)*k,reb:(F.rpg||0)*k,ast:(F.apg||0)*k,mpg:F.mpg*k,est:true}; } }catch(e){} }
    });
    POOL=POOL.filter(p=>p.proj&&p.proj.mpg>=4);
    try{
      const PS=window.TDCPost?await TDCPost.run({sims:2000}):null;
      if(PS){ MARCH={}; PS.teams.forEach(t=>{ MARCH[t.team]={g:t.confGames+t.fwGames+t.restGames,bid:t.ncaa}; }); }
    }catch(e){ console.warn('postseason sim',e); }
    if(!MARCH&&window.TDCMarch&&RT.length){ const M=TDCMarch.simulate(RT,{sims:2000}); MARCH={}; Object.entries(M.mean||{}).forEach(([t,m])=>{ MARCH[t]={g:(m.conf||0)+(m.fw||0)+(m.rest||0),bid:m.bid}; }); }
  }

  // ── value: regular season (counting games) + March (expected tournament games), z-scored against the players a
  // full league rosters, replacement = the next man up — league.html's computeValues, so both pages agree ──
  function values(){
    const N=ST.teams*ST.roster, cap=ST.teams*ST.budget;
    POOL.forEach(p=>{ const f=FULL[p.team]; p.reg=CNT&&f&&CNT[f]!=null?CNT[f]:22; const m=MARCH&&f?MARCH[f]:null; p.mar=m?m.g:0; p.bid=m?m.bid:0; });
    const raw=p=>p.proj.pts+p.proj.reb+p.proj.ast;
    const top=POOL.slice().sort((a,b)=>raw(b)-raw(a)).slice(0,N);
    const st=mult=>{ const o={}; CATS.forEach(([k])=>{ const v=top.map(p=>p.proj[k]*mult(p)); const m=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1; o[k]={m,sd}; }); return o; };
    const sR=st(p=>p.reg), sP=st(p=>p.mar);
    POOL.forEach(p=>{ p.z=CATS.reduce((s,[k])=>s+(p.proj[k]*p.reg-sR[k].m)/sR[k].sd+(p.proj[k]*p.mar-sP[k].m)/sP[k].sd,0); });
    const ranked=POOL.slice().sort((a,b)=>b.z-a.z);
    const repl=(ranked[N]||ranked[ranked.length-1]).z;
    const above=ranked.slice(0,N).reduce((s,p)=>s+Math.max(0,p.z-repl),0)||1;
    ranked.forEach((p,i)=>{ p.rank=i+1; p.val=i<N?Math.max(1,Math.round(1+(p.z-repl)/above*(cap-N))):1; });
    // the market: what the room pays. Last year it priced the per-game box line (pts+reb+ast), not games or March,
    // so a player's expected price is the curve at his rank by that line, scaled to this league's money
    const scale=cap/(12*200);
    POOL.slice().sort((a,b)=>raw(b)-raw(a)).forEach((p,i)=>{ p.mrank=i+1; p.mkt=Math.max(1,Math.round(curve(i+1)*scale)); });
  }
  function curve(r){
    if(r>CURVE[CURVE.length-1][0]) return 1;
    for(let i=1;i<CURVE.length;i++){ const [r1,p1]=CURVE[i-1], [r2,p2]=CURVE[i]; if(r<=r2) return p1+(p2-p1)*(r-r1)/(r2-r1); }
    return CURVE[0][1];
  }
  const price=p=>ST.price[p.id]!=null?+ST.price[p.id]:p.mkt;
  const isPG=p=>p.position==='PG';

  // ── the plan: most total value (z) for the budget, roster size and PG cap, each player at his expected price ──
  // knapsack over (players, dollars, PGs); locked players are bought first at their price, avoided ones never
  function solve(){
    const B=ST.budget, R=ST.roster, G=ST.maxpg;
    const locked=POOL.filter(p=>ST.lock[p.id]);
    let b0=0, g0=0; locked.forEach(p=>{ b0+=price(p); g0+=isPG(p)?1:0; });
    const slots=R-locked.length, budget=B-b0, pgLeft=G-g0;
    if(slots<0||budget<slots||pgLeft<0) return {err:slots<0?'More players locked than roster spots.':pgLeft<0?'More point guards locked than the PG limit.':'The locked players leave less than $1 for each open spot.',locked};
    // candidates: the best few hundred by value plus anyone who's a bargain at his price
    const C=POOL.filter(p=>!ST.lock[p.id]&&!ST.avoid[p.id]&&p.z>-8).sort((a,b)=>b.z-a.z).slice(0,420);
    const nB=budget+1, nG=Math.max(0,pgLeft)+1, S=(slots+1)*nB*nG, NEG=-1e9;
    let dp=new Float64Array(S).fill(NEG); dp[0]=0;
    const take=[]; const ix=(c,b,g)=>(c*nB+b)*nG+g;
    C.forEach(p=>{
      const cost=price(p), pg=isPG(p)?1:0, nx=dp.slice(), tk=new Uint8Array(S);
      if(cost<=budget&&pg<nG) for(let c=0;c<slots;c++) for(let b=0;b+cost<=budget;b++) for(let g=0;g+pg<nG;g++){
        const v=dp[ix(c,b,g)]; if(v===NEG) continue;
        const j=ix(c+1,b+cost,g+pg), w=v+p.z; if(w>nx[j]){ nx[j]=w; tk[j]=1; } }
      take.push(tk); dp=nx;
    });
    let best=NEG, bj=-1;
    for(let b=0;b<=budget;b++) for(let g=0;g<nG;g++){ const j=ix(slots,b,g); if(dp[j]>best){ best=dp[j]; bj=j; } }
    if(bj<0) return {err:'No roster fits those limits.',locked};
    // walk back: re-run forward keeping every layer would cost memory, so track take flags per item and rewind
    const pick=[]; let c=slots, b=Math.floor(bj/nG)%nB, g=bj%nG;
    for(let i=C.length-1;i>=0&&c>0;i--){ if(take[i][ix(c,b,g)]){ const p=C[i]; pick.push(p); c--; b-=price(p); g-=isPG(p)?1:0; } }
    return {players:locked.concat(pick).sort((a,b)=>price(b)-price(a)), locked};
  }

  function playerCell(p){
    const href=p.espn_id?`player.html?espn=${p.espn_id}`:`player.html?name=${encodeURIComponent(p.name)}`;
    return `<td class="l nm"><a href="${href}">${esc(p.name)}</a>${p.is_injured?' <span class="pill r">Inj</span>':''}${p.proj.est?' <span class="pill" title="Freshman / no-stats estimate">Est</span>':''}${ST.lock[p.id]?' <span class="pill a">Locked</span>':''}<span class="sub">${lgImg(FULL[p.team]||p.team)}${esc(p.team)} · ${esc(p.position||'')}${p.yr?' · '+esc(p.yr):''}</span></td>`;
  }
  const edge=p=>p.val-price(p);
  const edgeCell=p=>{ const e=edge(p); return `<td class="edge ${e>0?'pos':e<0?'neg':''}">${e>0?'+':''}${e}</td>`; };
  const acts=p=>`<td><span class="acts"><button class="btn sm ghost${ST.lock[p.id]?' on':''}" data-lock="${p.id}" type="button" title="Must buy">${ST.lock[p.id]?'Locked':'Lock'}</button><button class="btn sm ghost no${ST.avoid[p.id]?' on':''}" data-avoid="${p.id}" type="button" title="Leave out of the plan">${ST.avoid[p.id]?'Out':'Avoid'}</button></span></td>`;
  const priceCell=p=>`<td><input class="fi pr" data-price="${p.id}" type="number" min="1" value="${price(p)}" title="Expected price — type what you think he'll go for"></td>`;

  function render(){
    values(); PLAN=solve();
    let h='';
    if(PLAN.err){ h+=`<div class="empty">${esc(PLAN.err)}</div>`; }
    else{
      const P=PLAN.players, spent=P.reduce((s,p)=>s+price(p),0);
      const tot={}; CATS.forEach(([k])=>{ tot[k]=P.reduce((s,p)=>s+p.proj[k]*p.reg,0); });
      const mar=P.reduce((s,p)=>s+p.mar,0), worth=P.reduce((s,p)=>s+p.val,0);
      const vs=k=>{ const d=tot[k]-BAR[k]; return `<small class="${d>=0?'up':'dn'}">${d>=0?'+':''}${f0(d)} vs last year's winner</small>`; };
      h+=`<div class="fb-tiles">
        <div><span>Spend</span><b>$${spent} <span style="font-size:13px">of $${ST.budget}</span></b><small>Worth $${worth} at our values · ${P.filter(isPG).length} of ${ST.maxpg} PGs</small></div>
        ${CATS.map(([k,l])=>`<div><span>${l} · regular season</span><b>${f0(tot[k])}</b>${vs(k)}</div>`).join('')}
        <div><span>March games</span><b>${f1(mar)}</b><small>expected across the roster</small></div></div>`;
      h+=`<section class="fb-sec"><div class="sec-h"><h2>Your best ${ST.roster}</h2><span class="r">Most projected value for the money, each player at his expected price</span></div>
        <div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">Player</th><th>PTS</th><th>REB</th><th>AST</th><th>Games</th><th>March</th><th>Value</th><th>Price</th><th>Edge</th><th></th></tr></thead><tbody>
        ${P.map(p=>`<tr class="${ST.lock[p.id]?'lock':''}">${playerCell(p)}<td>${f1(p.proj.pts)}</td><td>${f1(p.proj.reb)}</td><td>${f1(p.proj.ast)}</td><td>${p.reg}</td><td>${f1(p.mar)}</td><td><b>$${p.val}</b></td>${priceCell(p)}${edgeCell(p)}${acts(p)}</tr>`).join('')}
        </tbody><tfoot><tr><td class="l">Total</td>${CATS.map(([k])=>`<td>${f1(P.reduce((s,p)=>s+p.proj[k],0))}</td>`).join('')}<td></td><td>${f1(mar)}</td><td>$${worth}</td><td>$${spent}</td><td>${worth-spent>0?'+':''}${worth-spent}</td><td></td></tr></tfoot></table></div></section>`;
    }
    // the board
    const q=UI.q.toLowerCase();
    let B=POOL.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q))&&(UI.pos==='all'||p.position===UI.pos||(UI.pos==='big'&&/PF|C/.test(p.position||''))));
    const inPlan=new Set((PLAN.players||[]).map(p=>p.id));
    const SORT={edge:(a,b)=>edge(b)-edge(a)||b.val-a.val, val:(a,b)=>b.val-a.val, mkt:(a,b)=>price(b)-price(a), pts:(a,b)=>b.proj.pts-a.proj.pts, reb:(a,b)=>b.proj.reb-a.proj.reb, ast:(a,b)=>b.proj.ast-a.proj.ast, mar:(a,b)=>b.mar-a.mar};
    B.sort(SORT[UI.sort]||SORT.edge);
    const th=(k,l)=>`<th data-s="${k}" style="cursor:pointer">${l}${UI.sort===k?' ▼':''}</th>`;
    h+=`<section class="fb-sec"><div class="sec-h"><h2>Big board</h2><span class="r">Edge = our value minus expected price: green is underpriced</span></div>
      <div class="filt"><input class="fi" id="bQ" placeholder="Search player or team" value="${esc(UI.q)}" style="width:220px">
      <select class="fs" id="bPos">${[['all','All positions'],['PG','PG'],['SG','SG'],['SF','SF'],['big','PF / C']].map(([v,l])=>`<option value="${v}"${UI.pos===v?' selected':''}>${l}</option>`).join('')}</select></div>
      <div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">#</th><th class="l">Player</th>${th('pts','PTS')}${th('reb','REB')}${th('ast','AST')}${th('mar','March')}${th('val','Value')}${th('mkt','Price')}${th('edge','Edge')}<th class="l">Plan</th><th></th></tr></thead><tbody>
      ${B.slice(0,UI.n).map((p,i)=>`<tr class="${ST.lock[p.id]?'lock':ST.avoid[p.id]?'avoid':''}"><td class="l">${i+1}</td>${playerCell(p)}<td>${f1(p.proj.pts)}</td><td>${f1(p.proj.reb)}</td><td>${f1(p.proj.ast)}</td><td>${f1(p.mar)}</td><td><b>$${p.val}</b></td>${priceCell(p)}${edgeCell(p)}<td class="l">${inPlan.has(p.id)?'<span class="pill a">In plan</span>':''}</td>${acts(p)}</tr>`).join('')}
      </tbody></table></div>${B.length>UI.n?`<div style="text-align:center;margin-top:10px"><button class="btn ghost" id="bMore" type="button">Show ${Math.min(60,B.length-UI.n)} more</button></div>`:''}</section>`;
    h+=`<p class="fb-note"><b>Value</b> is what a player is worth in this league: his projected points, rebounds and assists over his team's ${CNT?'22 counting games':'regular season'}, plus the same over the March games his team is expected to play (conference tournament and NCAA, from 2,000 simulated seasons), each scored against the players a full league rosters. Dollars split the league's money over everyone above the replacement level.
      <b>Price</b> is what your room is expected to pay: last year's auction priced players by their per-game line (No. 1 about $55, No. 12 $35, No. 48 $20, No. 120 $2, then $1), so each player gets the price for his rank on that line. Type over it when you know better. <b>Your best ${ST.roster}</b> is the roster with the most total value whose prices fit the budget and the PG limit. Locks, avoids and prices are saved in this browser.</p>`;
    $('out').innerHTML=h;
    wire();
  }

  function wire(){
    const out=$('out');
    out.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{ const id=b.dataset.lock; if(ST.lock[id]) delete ST.lock[id]; else { ST.lock[id]=1; delete ST.avoid[id]; } save(); render(); });
    out.querySelectorAll('[data-avoid]').forEach(b=>b.onclick=()=>{ const id=b.dataset.avoid; if(ST.avoid[id]) delete ST.avoid[id]; else { ST.avoid[id]=1; delete ST.lock[id]; } save(); render(); });
    out.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=()=>{ const id=inp.dataset.price, v=Math.round(+inp.value);
      const p=POOL.find(x=>String(x.id)===id); if(!(v>=1)||(p&&v===p.mkt)) delete ST.price[id]; else ST.price[id]=v; save(); render(); });
    out.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{ UI.sort=t.dataset.s; render(); });
    const q=$('bQ'); if(q){ q.oninput=()=>{ UI.q=q.value; UI.n=60; clearTimeout(q._t); q._t=setTimeout(()=>{ render(); const n=$('bQ'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); }; }
    const ps=$('bPos'); if(ps) ps.onchange=()=>{ UI.pos=ps.value; UI.n=60; render(); };
    const m=$('bMore'); if(m) m.onclick=()=>{ UI.n+=60; render(); };
  }

  function settings(){
    const map=[['sBudget','budget'],['sRoster','roster'],['sPG','maxpg'],['sTeams','teams']];
    map.forEach(([id,k])=>{ const el=$(id); el.value=ST[k]; el.onchange=()=>{ const v=Math.round(+el.value); if(v>=+el.min&&v<=+el.max){ ST[k]=v; save(); render(); } else el.value=ST[k]; }; });
    $('sReset').onclick=()=>{ ST.lock={}; ST.avoid={}; ST.price={}; save(); render(); };
  }

  settings();
  load().then(render).catch(e=>{ $('out').innerHTML=`<div class="empty">Couldn't load the player pool (${esc(e.message)}).</div>`; });
})();
</script>
<script src="tdc-version.js?v=2"></script>
</body>
</html>
