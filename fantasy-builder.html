  <style>
    :root{--green:#2e8b57;--red:#c0392b;}

    *{margin:0;padding:0;box-sizing:border-box;}

    .tm .tt{margin-top:6px;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;}
    .lnk{background:none;border:none;color:var(--text3);font-size:11px;font-weight:700;text-decoration:underline;padding:0;} .lnk:hover{color:var(--accent);}
    .log{margin-top:12px;font-size:12.5px;} .log summary{cursor:pointer;font-weight:800;color:var(--text2);} .log ol{list-style:none;margin-top:6px;} .log li{padding:4px 0;border-bottom:1px solid var(--border);}
    .chk2{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text2);} .chk2 input{accent-color:var(--accent);}
    @media(max-width:1100px){ .teams{grid-template-columns:repeat(3,minmax(0,1fr));} }

    @media(max-width:820px){ .guide{grid-template-columns:1fr;} .guide .need+.need{border-left:none;border-top:1px solid var(--border);} }
    @media(max-width:820px){ .set{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;} .set .fi{width:100%;} .set .btn{grid-column:1/-1;justify-content:center;} .fb-tiles{grid-template-columns:repeat(2,minmax(0,1fr));} .fb-tiles>div{border-left:none!important;border-top:1px solid var(--border);} .fb-tiles>div:first-child{border-top:none;grid-column:1/-1;} .page-h1{font-size:28px;} }

<script>
(function(){
  const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  const CONFS={'B10':'Big Ten','SEC':'SEC','ACC':'ACC','BIG-12':'Big 12','Big-East':'Big East'};
  const CATS=[['pts','PTS'],['reb','REB'],['ast','AST']];
  // last year's league, final regular-season totals (owner's sheet "Total Stat Sheet", 2025-26; divisions of 6)
  const LAST=[['Mark',3517,937,996,1],['Derrick',3803,1271,565,1],['Mike',3490,1297,917,1],['Jody',3624,1374,713,1],['Anthony',3356,1405,663,1],['Bryce',4091,1363,723,1],
    ['Darren',3940,1360,715,2],['Ken',3433,1413,648,2],['Aidan',4371,1370,841,2],['Jacob',3623,1255,614,2],['Glenn',3091,1128,615,2],['Carter/Alex/Ewing',3825,1276,756,2]];
  // the league's 2025-26 auction, price by sale rank (owner's sheet, Oct 24 2026); past #120 everyone went for $1
  const CURVE=[[1,55],[3,50],[6,43],[12,35],[24,30],[36,26],[48,20],[72,15],[96,10],[120,2]];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const f1=v=>v==null||isNaN(v)?'—':(+v).toFixed(1);
  const f0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString();
  const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
  const H={apikey:KEY,Authorization:'Bearer '+KEY};
  const get=p=>fetch(`${SB}/rest/v1/${p}`,{headers:H}).then(r=>{ if(!r.ok) throw new Error('Supabase '+r.status); return r.json(); });
  async function getAll(p){ const out=[]; for(let off=0;;off+=1000){ const rows=await get(`${p}&limit=1000&offset=${off}`); out.push(...rows); if(rows.length<1000) return out; } }
  const qList=a=>a.map(x=>'"'+String(x).replace(/"/g,'\\"')+'"').join(',');
  const logo=t=>{ try{ const c=window.tdcTeamColor&&tdcTeamColor(t); return c&&c.logo||null; }catch(e){ return null; } };
  const lgImg=t=>{ const l=logo(t); return l?`<img class="lg" src="${esc(l)}" alt="" loading="lazy">`:''; };

  // ── saved draft (this browser): queue = players you want, in order; sales = every auction sale [{id, t team, p price}];
  // avoid = not for you; price = your own price guesses; names = the league's teams, me = which one is you ──
  const SK='tdc_fb_v1';
  let ST={budget:200,roster:12,maxpg:3,teams:12,avoid:{},price:{},queue:[],src:'queue',sales:[],names:null,me:'Aidan'};
  try{ Object.assign(ST,JSON.parse(localStorage.getItem(SK)||'{}')); }catch(e){}
  if(!Array.isArray(ST.queue)) ST.queue=[];
  if(!Array.isArray(ST.sales)) ST.sales=[];
  // the old Drafted marks (before the auction board) become sales to you at the price typed
  if(ST.lock){ Object.keys(ST.lock).forEach(id=>{ if(!ST.sales.some(x=>String(x.id)===id)) ST.sales.push({id,t:ST.me,p:+ST.price[id]||1}); }); delete ST.lock; }
  const names=()=>{ const n=(ST.names||LAST.map(r=>r[0])).slice(0,ST.teams); while(n.length<ST.teams) n.push('Team '+(n.length+1)); return n; };
  let SOLD={};   // player id -> {t, p}
  const syncSold=()=>{ SOLD={}; ST.sales.forEach(x=>{ SOLD[x.id]={t:x.t,p:x.p}; }); };
  const mine=p=>!!(SOLD[p.id]&&SOLD[p.id].t===ST.me);
  const taken=p=>!!(SOLD[p.id]&&SOLD[p.id].t!==ST.me);
  // every team's money, spots and max bid as the auction stands
  function room(){
    const T=names().map(n=>({name:n,spent:0,players:[],pg:0}));
    const by=Object.fromEntries(T.map(t=>[t.name,t]));
    ST.sales.forEach(x=>{ const t=by[x.t], pl=BYID[x.id]; if(!t||!pl) return; t.spent+=x.p; t.players.push(pl); if(isPG(pl)) t.pg++; });
    T.forEach(t=>{ t.left=ST.budget-t.spent; t.spots=ST.roster-t.players.length; t.max=t.spots>0?t.left-(t.spots-1):0;
      t.tot={}; CATS.forEach(([k])=>{ t.tot[k]=t.players.reduce((s,p)=>s+season(p,k),0); }); });
    return {T, money:T.reduce((s,t)=>s+Math.max(0,t.left),0), spots:T.reduce((s,t)=>s+Math.max(0,t.spots),0)};
  }
  const save=()=>{ try{ localStorage.setItem(SK,JSON.stringify(ST)); }catch(e){} };

  let POOL=[], BYID={}, FULL={}, CNT=null, MARCH=null, PLAN=null, ROOM=null;
  const UI={q:'',pos:'all',sort:'edge',n:60,sold:false,team:null};

  async function load(){
    const [teams,proj,rat]=await Promise.all([
      get(`teams?conference=in.(${Object.keys(CONFS).join(',')})&select=name,conference&order=name.asc`),
      fetch('scripts/data/stat_overall_projected.json?v=96').then(r=>r.ok?r.json():null).catch(()=>null),
      get('predictive_ratings?select=data&limit=1').catch(()=>[])]);
    try{ const cs=await fetch('scripts/data/fantasy_counting_2027.json?v=1').then(r=>r.ok?r.json():null);
      if(cs&&cs.teams){ CNT={}; Object.entries(cs.teams).forEach(([t,l])=>{ CNT[t]=l.length; }); } }catch(e){}
    const CONF=Object.fromEntries(teams.map(t=>[t.name,t.conference]));
    POOL=await getAll(`players?team=in.(${encodeURIComponent(qList(teams.map(t=>t.name)))})&select=id,name,team,position,espn_id,yr,is_injured&order=id.asc`);
    if(window.TDCFresh) await TDCFresh.load().catch(()=>{});
    const PROJ=(proj&&proj.players)||{};
    const SHARE={}; Object.entries((proj&&proj.teams)||{}).forEach(([t,l])=>l.forEach(x=>{ SHARE[t+'|'+x.name]=x.share; }));
    const RT=(rat[0]&&rat[0].data&&rat[0].data.teams)||[];
    RT.forEach(t=>{ if(CONF[t.team]&&!FULL[t.team]) FULL[t.team]=t.full; });
    // the same projected line league.html drafts from: published projection, else the freshman engine held to his share
    POOL.forEach(p=>{
      p.conf=CONF[p.team]; const pr=p.espn_id!=null?PROJ[String(p.espn_id)]:null;
      p.proj=pr?{pts:pr.ppg||0,reb:pr.rpg||0,ast:pr.apg||0,mpg:pr.mpg||0}:null;
      if(pr&&pr.team&&!FULL[p.team]) FULL[p.team]=pr.team;
      if(!p.proj&&window.TDCFresh){ try{ const F=TDCFresh.line(p,TDCFresh.profileFor(p)); if(F&&F.mpg>0){
        const sh=SHARE[p.team+'|'+p.name], imp=(F.fga||0)/58*100, k=sh!=null&&imp>0?Math.min(1,sh/imp):1;
        p.proj={pts:(F.ppg||0)*k,reb:(F.rpg||0)*k,ast:(F.apg||0)*k,mpg:F.mpg*k,est:true}; } }catch(e){} }
    });
    POOL=POOL.filter(p=>p.proj&&p.proj.mpg>=4);
    try{
      const PS=window.TDCPost?await TDCPost.run({sims:2000}):null;
      if(PS){ MARCH={}; PS.teams.forEach(t=>{ MARCH[t.team]={g:t.confGames+t.fwGames+t.restGames,bid:t.ncaa}; }); }
    }catch(e){ console.warn('postseason sim',e); }
    if(!MARCH&&window.TDCMarch&&RT.length){ const M=TDCMarch.simulate(RT,{sims:2000}); MARCH={}; Object.entries(M.mean||{}).forEach(([t,m])=>{ MARCH[t]={g:(m.conf||0)+(m.fw||0)+(m.rest||0),bid:m.bid}; }); }
  }

  // ── value: regular season (counting games) + March (expected tournament games), z-scored against the players a
  // full league rosters, replacement = the next man up — league.html's computeValues, so both pages agree ──
  function values(){
    const N=ST.teams*ST.roster, cap=ST.teams*ST.budget;
    POOL.forEach(p=>{ const f=FULL[p.team]; p.reg=CNT&&f&&CNT[f]!=null?CNT[f]:22; const m=MARCH&&f?MARCH[f]:null; p.mar=m?m.g:0; p.bid=m?m.bid:0; });
    const raw=p=>p.proj.pts+p.proj.reb+p.proj.ast;
    const top=POOL.slice().sort((a,b)=>raw(b)-raw(a)).slice(0,N);
    const st=mult=>{ const o={}; CATS.forEach(([k])=>{ const v=top.map(p=>p.proj[k]*mult(p)); const m=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1; o[k]={m,sd}; }); return o; };
    const sR=st(p=>p.reg), sP=st(p=>p.mar);
    POOL.forEach(p=>{ p.zc={}; CATS.forEach(([k])=>{ p.zc[k]=(p.proj[k]*p.reg-sR[k].m)/sR[k].sd+(p.proj[k]*p.mar-sP[k].m)/sP[k].sd; }); p.z=CATS.reduce((s,[k])=>s+p.zc[k],0); });
    const ranked=POOL.slice().sort((a,b)=>b.z-a.z);
    const repl=(ranked[N]||ranked[ranked.length-1]).z;
    const above=ranked.slice(0,N).reduce((s,p)=>s+Math.max(0,p.z-repl),0)||1;
    ranked.forEach((p,i)=>{ p.rank=i+1; p.val=i<N?Math.max(1,Math.round(1+(p.z-repl)/above*(cap-N))):1; });
    // the market: what the room pays. Last year it priced the per-game box line (pts+reb+ast), not games or March,
    // so a player's expected price is the curve at his rank by that line, scaled to this league's money
    const scale=cap/(12*200);
    POOL.slice().sort((a,b)=>raw(b)-raw(a)).forEach((p,i)=>{ p.mrank=i+1; p.mkt0=p.mkt=Math.max(1,Math.round(curve(i+1)*scale)); });
    // once the auction starts, the players still out there split what's actually left: value = his share of the
    // room's remaining money over the remaining spots, and expected price = his curve price scaled so the top
    // remaining players' prices add up to the money left. Early overspending makes everyone after cheaper.
    syncSold(); ROOM=room(); ROOM.infl=1;
    if(ST.sales.length){
      const left=POOL.filter(p=>!SOLD[p.id]), n=Math.max(1,ROOM.spots), cash=Math.max(0,ROOM.money-ROOM.spots);
      const rk=left.slice().sort((a,b)=>b.z-a.z), rp=(rk[n]||rk[rk.length-1]).z, ab=rk.slice(0,n).reduce((s,p)=>s+Math.max(0,p.z-rp),0)||1;
      rk.forEach((p,i)=>{ p.val=i<n?Math.max(1,Math.round(1+(p.z-rp)/ab*cash)):1; });
      // measured against the room before any sale, so prices start exactly on last year's curve and move from there
      const N0=ST.teams*ST.roster, base=POOL.slice().sort((a,b)=>b.mkt0-a.mkt0).slice(0,N0).reduce((s,p)=>s+p.mkt0-1,0);
      const r0=base>0?(ST.teams*ST.budget-N0)/base:1;
      const extra=left.slice().sort((a,b)=>b.mkt0-a.mkt0).slice(0,n).reduce((s,p)=>s+p.mkt0-1,0);
      ROOM.infl=extra>0?cash/extra/r0:1;
      left.forEach(p=>{ p.mkt=Math.max(1,Math.round(1+(p.mkt0-1)*ROOM.infl)); });
      // how the room has paid so far vs what the curve expected
      const sold=ST.sales.map(x=>BYID[x.id]).filter(Boolean);
      ROOM.pace=sold.length?ST.sales.reduce((s,x)=>s+(BYID[x.id]?x.p:0),0)/Math.max(1,sold.reduce((s,p)=>s+p.mkt0,0)):1;
    }
  }
  function curve(r){
    if(r>CURVE[CURVE.length-1][0]) return 1;
    for(let i=1;i<CURVE.length;i++){ const [r1,p1]=CURVE[i-1], [r2,p2]=CURVE[i]; if(r<=r2) return p1+(p2-p1)*(r-r1)/(r2-r1); }
    return CURVE[0][1];
  }
  const price=p=>SOLD[p.id]?SOLD[p.id].p:ST.price[p.id]!=null?+ST.price[p.id]:p.mkt;
  const isPG=p=>p.position==='PG';
  const inQ=p=>ST.queue.indexOf(String(p.id))>=0;
  const season=(p,k)=>p.proj[k]*p.reg;

  // ── the plan: most total value (z) for the budget, roster size and PG cap, each player at his expected price.
  // Drafted players are in at what you paid; avoided ones never. Building from the queue, anyone outside it carries a
  // heavy penalty, so he's only picked to fill spots the queue can't (marked Fill). Knapsack over (players, $, PGs). ──
  const FILL=40;
  function solve(W){
    const B=ST.budget, R=ST.roster, G=ST.maxpg;
    const locked=POOL.filter(mine);
    let b0=0, g0=0; locked.forEach(p=>{ b0+=price(p); g0+=isPG(p)?1:0; });
    const slots=R-locked.length, budget=B-b0, pgLeft=G-g0;
    if(slots<0||budget<slots||pgLeft<0) return {err:slots<0?'You have more players than roster spots.':pgLeft<0?'You have more point guards than the PG limit.':'Your buys leave less than $1 for each open spot.',locked,players:locked};
    const fromQ=ST.src==='queue'&&ST.queue.some(id=>BYID[id]&&!SOLD[id]&&!ST.avoid[id]);
    const gain=p=>CATS.reduce((s,[k])=>s+W[k]*p.zc[k],0)-(fromQ&&!inQ(p)?FILL:0);
    const free=POOL.filter(p=>!SOLD[p.id]&&!ST.avoid[p.id]);
    const C=free.filter(p=>fromQ&&inQ(p)).concat(free.filter(p=>!(fromQ&&inQ(p))&&p.z>-8).sort((a,b)=>b.z-a.z).slice(0,420));
    const nB=budget+1, nG=Math.max(0,pgLeft)+1, S=(slots+1)*nB*nG, NEG=-1e9;
    let dp=new Float64Array(S).fill(NEG); dp[0]=0;
    const take=[]; const ix=(c,b,g)=>(c*nB+b)*nG+g;
    C.forEach(p=>{
      const cost=price(p), pg=isPG(p)?1:0, nx=dp.slice(), tk=new Uint8Array(S), w0=gain(p);
      if(cost<=budget&&pg<nG) for(let c=0;c<slots;c++) for(let b=0;b+cost<=budget;b++) for(let g=0;g+pg<nG;g++){
        const v=dp[ix(c,b,g)]; if(v===NEG) continue;
        const j=ix(c+1,b+cost,g+pg), w=v+w0; if(w>nx[j]){ nx[j]=w; tk[j]=1; } }
      take.push(tk); dp=nx;
    });
    let best=NEG, bj=-1;
    for(let b=0;b<=budget;b++) for(let g=0;g<nG;g++){ const j=ix(slots,b,g); if(dp[j]>best){ best=dp[j]; bj=j; } }
    if(bj<0) return {err:'No roster fits those limits.',locked,players:locked};
    const pick=[]; let c=slots, b=Math.floor(bj/nG)%nB, g=bj%nG;
    for(let i=C.length-1;i>=0&&c>0;i--){ if(take[i][ix(c,b,g)]){ const p=C[i]; pick.push(p); c--; b-=price(p); g-=isPG(p)?1:0; } }
    return {players:locked.concat(pick).sort((a,b)=>(mine(b)?1:0)-(mine(a)?1:0)||price(b)-price(a)), locked, fromQ};
  }

  // roto rewards balance, not raw total: re-solve leaning on the roster's weakest category (by its rank against last
  // year's teams) and keep the roster that would have scored the most roto points
  function bestPlan(){
    const W={pts:1,reb:1,ast:1}; let best=null;
    for(let it=0;it<8;it++){
      const pl=solve(W); if(pl.err) return pl;
      const tot={}; CATS.forEach(([k])=>{ tot[k]=pl.players.reduce((s,p)=>s+season(p,k),0); });
      const me=standing(tot).find(r=>r.me);
      const zs=pl.players.reduce((s,p)=>s+p.z,0);
      if(!best||me.roto>best.roto||(me.roto===best.roto&&zs>best.zs)) best={...pl,roto:me.roto,zs};
      W[needOf(me)[0]]*=1.35;
    }
    return best;
  }

  // ── where a roster would have finished last year: roto over all 12 teams + you (13 points for first in a category) ──
  function standing(tot){
    const rows=LAST.map(r=>({name:r[0],pts:r[1],reb:r[2],ast:r[3],div:r[4]})).concat([{name:'You',me:true,...tot}]);
    CATS.forEach(([k])=>{ rows.forEach(r=>{ r['r'+k]=1+rows.filter(o=>o[k]<r[k]).length+rows.filter(o=>o!==r&&o[k]===r[k]).length/2; }); });
    rows.forEach(r=>{ r.roto=CATS.reduce((s,[k])=>s+r['r'+k],0); });
    rows.sort((a,b)=>b.roto-a.roto||b.pts-a.pts);
    rows.forEach((r,i)=>{ r.place=i+1; });
    return rows;

    B.sort(SORT[UI.sort]||SORT.edge);
    const th=(k,l)=>`<th data-s="${k}" style="cursor:pointer">${l}${UI.sort===k?' ▼':''}</th>`;
    h+=`<section class="fb-sec" id="board"><div class="sec-h"><h2>Big board</h2><span class="r">Edge = our value minus expected price: green is underpriced</span></div>
      <div class="filt"><input class="fi" id="bQ" placeholder="Search player or team" value="${esc(UI.q)}" style="width:220px">
      <select class="fs" id="bPos">${[['all','All positions'],['PG','PG'],['SG','SG'],['SF','SF'],['big','PF / C']].map(([v,l])=>`<option value="${v}"${UI.pos===v?' selected':''}>${l}</option>`).join('')}</select><label class="chk2"><input type="checkbox" id="bSold"${UI.sold?' checked':''}> Show sold players</label></div>
      <div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">#</th><th class="l">Player</th>${th('pts','PTS')}${th('reb','REB')}${th('ast','AST')}${th('mar','March')}${th('val','Value')}${th('mkt','Price')}${th('edge','Edge')}<th></th></tr></thead><tbody>
      ${B.slice(0,UI.n).map((p,i)=>`<tr class="${mine(p)?'lock':taken(p)||ST.avoid[p.id]?'avoid':''}"><td class="l">${i+1}</td>${playerCell(p,tag(p)+(inPlan.has(p.id)&&!mine(p)?' <span class="pill a">In team</span>':''))}<td>${f1(p.proj.pts)}</td><td>${f1(p.proj.reb)}</td><td>${f1(p.proj.ast)}</td><td>${f1(p.mar)}</td><td><b>$${p.val}</b></td>${priceCell(p)}${edgeCell(p)}${acts(p)}</tr>`).join('')}
      </tbody></table></div>${B.length>UI.n?`<div style="text-align:center;margin-top:10px"><button class="btn ghost" id="bMore" type="button">Show ${Math.min(60,B.length-UI.n)} more</button></div>`:''}</section>`;
    h+=`<p class="fb-note"><b>Value</b> is what a player is worth in this league: his projected points, rebounds and assists over his team's ${CNT?'22 counting games':'regular season'}, plus the same over the March games his team is expected to play (conference tournament and NCAA, from 2,000 simulated seasons), each scored against the players a full league rosters. Dollars split the league's money over everyone above the replacement level.
      <b>Price</b> is what your room is expected to pay: last year's auction priced players by their per-game line (No. 1 about $55, No. 12 $35, No. 48 $20, No. 120 $2, then $1), so each player gets the price for his rank on that line. Type over it when you know better. Once the auction starts, values and prices are re-split over the money and roster spots actually left in the room. Your queue, sales and prices are saved in this browser.</p>`;
    const y=scrollY; $('out').innerHTML=h; scrollTo(0,y);
    wire();
  }

  function wire(){
    const out=$('out');
    // ── auction entry ──
    const aP=$('aP'), aL=$('aList'), aT=$('aT'), aPr=$('aPrice'), aI=$('aInfo');
    const say=(t,c)=>{ const m=$('aMsg'); if(m){ m.className='msg '+(c||''); m.textContent=t||''; } };
    const pickSale=id=>{ const pl=BYID[id]; if(!pl) return; UI.sel=String(id); aP.value=pl.name; aL.innerHTML=''; aL.style.display='none';
      const T=ROOM.T, inPlan=PLAN&&PLAN.players&&PLAN.players.some(x=>x.id===pl.id);
      aI.innerHTML=`<b>${esc(pl.name)}</b> · ${esc(pl.team)} ${esc(pl.position||'')} · expected <b>$${price(pl)}</b> · worth <b>$${pl.val}</b> to you${inPlan?' · <span class="up">in your team — bid up to $'+Math.max(price(pl),pl.val)+'</span>':''}<br><span class="dim">Max bids: ${T.filter(t=>t.spots>0).sort((a,b)=>b.max-a.max).map(t=>`${esc(t.name)} $${t.max}`).join(' · ')}</span>`;
      aPr.placeholder='$'+price(pl); aPr.focus(); };
    if(aP){
      aP.oninput=()=>{ UI.sel=null; aI.innerHTML=''; const q=aP.value.trim().toLowerCase(); if(q.length<2){ aL.style.display='none'; return; }
        const H=POOL.filter(p=>!SOLD[p.id]&&(p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q))).sort((a,b)=>b.val-a.val).slice(0,8);
        aL.innerHTML=H.map(p=>`<div class="ac-opt" data-pk="${p.id}"><b>${esc(p.name)}</b> <span class="dim">${esc(p.team)} · ${esc(p.position||'')}</span><span class="r">$${price(p)}</span></div>`).join('');
        aL.style.display=H.length?'block':'none'; aL.querySelectorAll('[data-pk]').forEach(o=>o.onmousedown=e=>{ e.preventDefault(); pickSale(o.dataset.pk); }); };
      aP.onkeydown=e=>{ if(e.key==='Enter'){ const o=aL.querySelector('[data-pk]'); if(o) pickSale(o.dataset.pk); } };
      aP.onblur=()=>setTimeout(()=>{ aL.style.display='none'; },150);
      const go=()=>{ const pl=BYID[UI.sel], v=Math.round(+aPr.value), t=ROOM.T.find(x=>x.name===aT.value);
        if(!pl) return say('Pick the player from the list first.','err');
        if(!(v>=1)) return say('Type the price he went for.','err');
        if(!t) return say('Pick who bought him.','err');
        if(t.spots<=0) return say(`${t.name}'s roster is already full.`,'err');
        if(v>t.max) return say(`${t.name} can bid at most $${t.max} (they need $1 for each other open spot).`,'err');
        if(isPG(pl)&&t.pg>=ST.maxpg) return say(`${t.name} already has ${ST.maxpg} point guards.`,'err');
        ST.sales.push({id:String(pl.id),t:t.name,p:v}); UI.team=t.name; UI.sel=null; save(); render(); const n=$('aP'); if(n) n.focus(); };
      $('aGo').onclick=go; aPr.onkeydown=e=>{ if(e.key==='Enter') go(); };
      aT.onchange=()=>{ UI.team=aT.value; };
      if(UI.sel&&BYID[UI.sel]&&!SOLD[UI.sel]) pickSale(UI.sel);
    }
    const un=$('aUndo'); if(un) un.onclick=()=>{ ST.sales.pop(); save(); render(); };
    out.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ ST.sales.splice(+b.dataset.del,1); save(); render(); });
    out.querySelectorAll('[data-unsell]').forEach(b=>b.onclick=()=>{ ST.sales=ST.sales.filter(x=>String(x.id)!==b.dataset.unsell); save(); render(); });
    out.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{ UI.sel=b.dataset.sell; render(); const a=$('auction'); if(a) a.scrollIntoView({behavior:'smooth',block:'start'}); });
    out.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{ ST.me=b.dataset.me; save(); render(); });
    out.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{ const old=b.dataset.ren, nw=(prompt('Team name',old)||'').trim();
      if(!nw||nw===old||names().includes(nw)) return; ST.names=names().map(n=>n===old?nw:n); ST.sales.forEach(x=>{ if(x.t===old) x.t=nw; }); if(ST.me===old) ST.me=nw; save(); render(); });
    const bs=$('bSold'); if(bs) bs.onchange=()=>{ UI.sold=bs.checked; render(); };
    out.querySelectorAll('[data-avoid]').forEach(b=>b.onclick=()=>{ const id=b.dataset.avoid; if(ST.avoid[id]) delete ST.avoid[id]; else ST.avoid[id]=1; save(); render(); });
    out.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const id=b.dataset.q, i=ST.queue.indexOf(id); if(i>=0) ST.queue.splice(i,1); else ST.queue.push(id); save(); render(); });
    const mv=(id,d)=>{ const i=ST.queue.indexOf(id), j=i+d; if(i<0||j<0||j>=ST.queue.length) return; [ST.queue[i],ST.queue[j]]=[ST.queue[j],ST.queue[i]]; save(); render(); };
    out.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));
    out.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
    out.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ ST.src=b.dataset.src; save(); render(); });
    out.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=()=>{ const id=inp.dataset.price, v=Math.round(+inp.value);
      const p=BYID[id]; if(!(v>=1)||(p&&v===p.mkt)) delete ST.price[id]; else ST.price[id]=v; save(); render(); });
    out.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{ UI.sort=t.dataset.s; render(); });
    // queue search: type a name, click (or Enter) to add
    const qa=$('qAdd'), qh=$('qHits');
    if(qa){
      const hits=()=>{ const s=qa.value.trim().toLowerCase(); if(s.length<2) return []; return POOL.filter(p=>!inQ(p)&&(p.name.toLowerCase().includes(s)||p.team.toLowerCase().includes(s))).sort((a,b)=>b.val-a.val).slice(0,6); };
      const add=id=>{ ST.queue.push(String(id)); save(); render(); const n=$('qAdd'); if(n) n.focus(); };
      qa.oninput=()=>{ const H=hits(); qh.innerHTML=H.map(p=>`<button type="button" class="btn sm ghost" data-add="${p.id}">${esc(p.name)} <span class="dim">${esc(p.team)} · $${price(p)}</span></button>`).join(''); qh.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add)); };
      qa.onkeydown=e=>{ if(e.key==='Enter'){ const H=hits(); if(H[0]) add(H[0].id); } };
    }
    const q=$('bQ'); if(q){ q.oninput=()=>{ UI.q=q.value; UI.n=60; clearTimeout(q._t); q._t=setTimeout(()=>{ render(); const n=$('bQ'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); }; }
    const ps=$('bPos'); if(ps) ps.onchange=()=>{ UI.pos=ps.value; UI.n=60; render(); };
    const m=$('bMore'); if(m) m.onclick=()=>{ UI.n+=60; render(); };
  }

  function settings(){
    const map=[['sBudget','budget'],['sRoster','roster'],['sPG','maxpg'],['sTeams','teams']];
    map.forEach(([id,k])=>{ const el=$(id); el.value=ST[k]; el.onchange=()=>{ const v=Math.round(+el.value); if(v>=+el.min&&v<=+el.max){ ST[k]=v; save(); render(); } else el.value=ST[k]; }; });
    $('sReset').onclick=()=>{ if(!confirm('Start over? This clears every sale, your queue, avoids and typed prices.')) return; ST.sales=[]; ST.avoid={}; ST.price={}; ST.queue=[]; save(); render(); };
  }

  settings();
  load().then(()=>{ POOL.forEach(p=>{ BYID[p.id]=p; }); render(); }).catch(e=>{ $('out').innerHTML=`<div class="empty">Couldn't load the player pool (${esc(e.message)}).</div>`; });
})();
</script>
<script src="tdc-version.js?v=2"></script>
</body>
