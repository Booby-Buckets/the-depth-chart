<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="tdc-a11y.css?v=1">
  <script src="tdc-a11y.js?v=1" defer></script>
  <meta name="description" content="Explore The Depth Chart — every tool in one place: rankings, player analytics, NIL, scouting, betting, and the full Coach's Tier.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Depth Chart">
  <meta property="og:title" content="Explore — The Depth Chart">
  <meta property="og:description" content="Every tool on the site, in one place — a map of The Depth Chart.">
  <meta property="og:url" content="https://www.thedepthchartcbb.com/explore.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Explore — The Depth Chart">
  <meta name="twitter:description" content="Every tool on the site, in one place — a map of The Depth Chart.">
  <script src="auth.js?v=shotlock1"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta charset="UTF-8"/>
  <script src="tdc-theme.js?v=2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="tdc-anim.css?v=4"/>
  <script src="tdc-anim.js?v=5"></script>
  <link rel="stylesheet" href="tdc-dense.css?v=31"/>
  <link rel="stylesheet" href="tdc-skin.css?v=8"/>
  <link rel="stylesheet" href="tdc-hq-list.css?v=2"/>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <style>
    :root:not([data-theme="dark"]){background:var(--bg)!important;}
    :root:not([data-theme="dark"]) .tdc-bg{background:var(--bg)!important;}
    :root:not([data-theme="dark"]) .nav-wrap{background:var(--bg)!important;}
    .xp{max-width:1160px;margin:0 auto;padding:30px 22px 80px;}
    .xp-lede{color:var(--text2);max-width:70ch;line-height:1.6;font-size:15px;margin:2px 0 30px;}
    /* audience filter pills */
    .xp-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
    .xp-fbtn{font:700 12px/1 'Inter',sans-serif;letter-spacing:.02em;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:9px 16px;cursor:pointer;transition:all .15s;}
    .xp-fbtn:hover{border-color:var(--border2);color:var(--text);}
    .xp-fbtn.on{background:var(--tc-readable,var(--accent));border-color:transparent;color:#141416;}
    /* section */
    .xp-sec{margin-bottom:34px;}
    .xp-sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
    .xp-sec-t{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--text);}
    .xp-sec-d{font-size:12.5px;color:var(--text3);}
    .xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;}
    .xp-card{position:relative;display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:15px 16px;transition:border-color .15s,transform .15s,box-shadow .15s;}
    .xp-card:hover{border-color:var(--tc-readable,var(--accent));transform:translateY(-2px);box-shadow:0 8px 26px -14px rgba(0,0,0,.4);}
    .xp-card-t{font-weight:800;font-size:15px;color:var(--text);display:flex;align-items:center;gap:7px;}
    .xp-card-d{font-size:12.5px;color:var(--text3);line-height:1.5;margin-top:5px;}
    .xp-arrow{position:absolute;top:15px;right:15px;color:var(--text3);font-size:15px;transition:transform .15s,color .15s;}
    .xp-card:hover .xp-arrow{transform:translateX(3px);color:var(--tc-readable,var(--accent));}
    .xp-lock{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#141416;background:var(--accent);border-radius:5px;padding:2px 6px;}
    .xp-lock.premium{background:#5B8DEF;color:#fff;}
    .xp-hide{display:none!important;}
  </style>
</head>
<body data-anim-auto>
<script src="tdc-nav.js?v=20"></script>

<div class="tdc-bg" aria-hidden="true"></div>
<div class="xp">
  <div class="page-header">
    <div class="eyebrow" data-anim>⬡ The Depth Chart</div>
    <h1 class="page-h1" data-anim>Explore</h1>
    <div class="xp-lede" data-anim>Every tool on the site, in one place. New here? Start at the top and work down — or filter by what you're here for.</div>
  </div>

  <div class="xp-filter" id="xpFilter">
    <button class="xp-fbtn on" data-aud="all" onclick="xpFilter('all',this)">Everything</button>
    <button class="xp-fbtn" data-aud="fan" onclick="xpFilter('fan',this)">For fans</button>
    <button class="xp-fbtn" data-aud="coach" onclick="xpFilter('coach',this)">For coaches</button>
    <button class="xp-fbtn" data-aud="market" onclick="xpFilter('market',this)">NIL &amp; portal</button>
    <button class="xp-fbtn" data-aud="bet" onclick="xpFilter('bet',this)">For bettors</button>
  </div>

  <div id="xpBody"></div>
</div>

<script>
// One catalog drives the whole page. aud = audiences the tool serves (for the filter);
// gate = 'premium' | 'coach' badge; each card links to a real page.
const XP = [
  { sec:'Start here', desc:'The four doors most people walk through.', aud:['fan'], items:[
    { t:'Rankings', d:'Power-rating team rankings for all of Division I, with projections and deep team cards.', href:'index.html', aud:['fan'] },
    { t:'Program HQ', d:'Pick your program and this becomes its front door — every tool pre-loaded for your team.', href:'program-hq.html', aud:['fan','coach'] },
    { t:'Compare players', d:'Two players side by side — grades, style DNA, head-to-head matchup and fit.', href:'compare-players.html', aud:['fan'] },
    { t:'Coaching Lab', d:'Head coaches by style, track record and system — the coaching side of the sport.', href:'coaches.html', aud:['fan','coach'] },
  ]},
  { sec:'Players', desc:'Everything about the guys on the floor.', aud:['fan'], items:[
    { t:'Player pages · Player DNA', d:'Any player: grade, Wins Added, percentile dashboard, impact decomposition and situational profile.', href:'player.html', aud:['fan','coach'] },
    { t:'Player Grade List', d:'The full ranked list of every graded player.', href:'gradelist.html', aud:['fan'], gate:'premium' },
    { t:'Projected Stats', d:'2026-27 projected stat lines for every rotation player.', href:'roster.html', aud:['fan'] },
    { t:'Shot Genome', d:'Look Quality, Shot-Making and Creation — the DNA of how a player scores.', href:'shot-genome.html', aud:['fan','coach'] },
    { t:'Role &amp; Fit', d:'Player archetypes and how each role fits different systems.', href:'roles.html', aud:['fan','coach'] },
    { t:'Player Dossier', d:'The one-page scouting dossier: line, splits, shot profile and confidence.', href:'dossier.html', aud:['coach','fan'] },
    { t:'Player Development', d:'Trajectory and growth areas — where a player is heading.', href:'development.html', aud:['fan','coach'] },
    { t:'Predictive Profile', d:'Situational and predictive identifiers — how production shifts by context.', href:'predictive-profile.html', aud:['coach','fan'] },
  ]},
  { sec:'Teams &amp; league', desc:'Zoom out to teams, conferences and the whole field.', aud:['fan'], items:[
    { t:'Team pages', d:'Depth chart, Team DNA, shot charts, projections and NIL for any team.', href:'team.html', aud:['fan','coach'] },
    { t:'Conferences', d:'Every league, season by season — standings, strength and history.', href:'conference.html', aud:['fan'] },
    { t:'League Analytics', d:'League-wide visualizations — contender quadrant, scoring, March drop-offs.', href:'analytics.html', aud:['fan'] },
    { t:'Projected Team Stats', d:'2026-27 offensive and defensive projections for all 360+ teams.', href:'team-stats.html', aud:['fan','coach'] },
    { t:'Roster Consistency', d:'How steady (or boom-bust) a roster projects to be.', href:'consistency.html', aud:['coach','fan'] },
    { t:'On/Off &amp; WOWY', d:'How a team performs with a player on the floor vs off.', href:'onoff.html', aud:['coach','fan'] },
  ]},
  { sec:'Postseason &amp; draft', desc:'March, the awards race and the next level.', aud:['fan'], items:[
    { t:'Bracketology', d:'Projected NCAA Tournament bracket and the bubble.', href:'bracket.html', aud:['fan'] },
    { t:'Projected Awards', d:'Player of the Year, All-Americans and the awards race.', href:'awards.html', aud:['fan'] },
    { t:'Mock Draft · Big Board', d:'The 2027 &amp; 2028 NBA draft boards, ranked and projected.', href:'draft.html', aud:['fan'] },
  ]},
  { sec:'Market, NIL &amp; portal', desc:'Value, money and roster building.', aud:['market'], items:[
    { t:'Moneyball', d:'Roster value in Wins Added, the Goal Lab, and market inefficiencies by style.', href:'moneyball.html', aud:['market','coach'] },
    { t:'Portal Fit', d:'Rank the best-fit programs for any transfer — need, production and coach fit.', href:'portal.html', aud:['market','coach'] },
    { t:'Transfer Fit Report', d:'A full transfer-fit breakdown for a single player.', href:'transfer-fit.html', aud:['market','coach'] },
    { t:'The Wire — Buzz', d:'Headlines and social buzz around players and programs.', href:'buzz.html', aud:['market','fan'] },
  ]},
  { sec:"Coach's Tier", desc:'Your staff’s analytics department — scouting, self-scout and game prep.', aud:['coach'], items:[
    { t:"Coach's Tier hub", d:'The command center — pick your team and jump into every coaching tool.', href:'coach-tier.html', aud:['coach'], gate:'coach' },
    { t:'Opponent Scouting', d:'Full scouting report on any opponent — attack sheet, tendencies and personnel.', href:'scout.html', aud:['coach'], gate:'coach' },
    { t:'Self-Scout', d:'Audit your own team — identity, rotation, shot-zone value and lineups.', href:'self-scout.html', aud:['coach'], gate:'coach' },
    { t:'Matchup Predictor', d:'Projected spread, key matchups and the trait-by-trait edge for any game.', href:'matchup.html', aud:['coach'], gate:'coach' },
    { t:'Offensive Profile', d:'How a team scores — zones, shot diet and who does the damage.', href:'offense.html', aud:['coach'], gate:'coach' },
    { t:'Defensive Profile', d:'How a team defends — where it holds up and where it bleeds.', href:'defense.html', aud:['coach'], gate:'coach' },
    { t:'Lineup Recommender', d:'Best five-man groups and rotation combinations.', href:'lineups.html', aud:['coach'], gate:'coach' },
  ]},
  { sec:'Betting', desc:'Trends and edges on your own 20 years of data.', aud:['bet'], items:[
    { t:'Betting Lab', d:'Team and player betting trends, prop hit-rates and the over/under lab.', href:'betting.html', aud:['bet'], gate:'coach' },
  ]},
];

const esc = s => (''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function card(it){
  const gate = it.gate==='coach' ? '<span class="xp-lock">Coach</span>' : it.gate==='premium' ? '<span class="xp-lock premium">Premium</span>' : '';
  return `<a class="xp-card" href="${it.href}" data-aud="${(it.aud||[]).join(' ')}">
    <span class="xp-arrow">→</span>
    <div class="xp-card-t">${it.t}${gate}</div>
    <div class="xp-card-d">${it.d}</div>
  </a>`;
}
function render(){
  document.getElementById('xpBody').innerHTML = XP.map(s=>`
    <div class="xp-sec" data-sec-aud="${(s.aud||[]).join(' ')}">
      <div class="xp-sec-h"><div class="xp-sec-t">${s.sec}</div><div class="xp-sec-d">${s.desc}</div></div>
      <div class="xp-grid">${s.items.map(card).join('')}</div>
    </div>`).join('');
  if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(document.getElementById('xpBody'));
}
function xpFilter(aud, btn){
  [...document.querySelectorAll('.xp-fbtn')].forEach(b=>b.classList.toggle('on', b===btn));
  document.querySelectorAll('.xp-card').forEach(c=>{
    const a=(c.getAttribute('data-aud')||'').split(' ');
    c.classList.toggle('xp-hide', aud!=='all' && a.indexOf(aud)<0);
  });
  // hide a whole section if every card in it is hidden
  document.querySelectorAll('.xp-sec').forEach(sec=>{
    const any=[...sec.querySelectorAll('.xp-card')].some(c=>!c.classList.contains('xp-hide'));
    sec.classList.toggle('xp-hide', !any);
  });
}
render();
</script>
<script src="tdc-pwa.js?v=2" defer></script>
<script src="tdc-version.js?v=2"></script>
</body>
</html>
