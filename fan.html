    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#2e8b57;--red:#c0392b;--tc:#1A1814;--band:#1A1814;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--green:#6fbf7e;--red:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .page{padding:28px 0 64px;}
    button{font:inherit;cursor:pointer;}
    a{color:inherit;}
    .page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .page-h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:8px;}
    .lede{font-size:14.5px;color:var(--text2);max-width:640px;line-height:1.55;margin-bottom:22px;}
    .btn{font:700 12px 'Inter',system-ui,sans-serif;letter-spacing:.02em;padding:8px 14px;border-radius:999px;border:1px solid var(--text);background:var(--text);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn.ghost{background:var(--bg);color:var(--text2);border-color:var(--border2);}
    .btn.danger{background:var(--bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2));}
    .btn:disabled{opacity:.45;cursor:default;}
    .chip{font:600 11.5px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text2);padding:5px 11px;border-radius:999px;cursor:pointer;}
    .chip.on{background:var(--text);color:var(--bg);border-color:var(--text);}
    .fi,.fs,.ft{width:100%;font:500 13.5px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px 11px;border-radius:8px;outline:none;margin-bottom:10px;}
    .fi:focus,.ft:focus,.fs:focus{border-color:var(--accent);}
    .ft{min-height:110px;resize:vertical;line-height:1.5;}
    .lab{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .sp{flex:1;}
    .cnt{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;}
    .msg{font-size:12.5px;margin:4px 0 10px;}
    .msg.err{color:var(--red);font-weight:600;} .msg.ok{color:var(--green);font-weight:600;}
    .empty{padding:36px 12px;text-align:center;color:var(--text3);font-size:13px;}
    .sec-h{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
    .sec-h a{color:var(--text3);text-decoration:none;letter-spacing:.04em;} .sec-h a:hover{color:var(--text);}
    .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px;border:1px solid var(--border2);color:var(--text3);}
    .tag.pin{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--border2));}
    .tag.draft{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--border2));}
    .av{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:13px;overflow:hidden;flex-shrink:0;}
    .av img{width:100%;height:100%;object-fit:cover;}
    .who{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);}
    .who a{font-weight:800;color:var(--text);text-decoration:none;} .who a:hover{color:var(--accent);}

    /* ── directory ── */
    .dir-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start;}
    @media(max-width:980px){ .dir-grid{grid-template-columns:1fr;} }
    .pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:30px;}
    .pub{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:12px;text-decoration:none;background:var(--bg);border-left:4px solid var(--c,var(--border2));}
    .pub:hover{border-color:var(--border2);}
    .pub img{width:40px;height:40px;object-fit:contain;flex-shrink:0;}
    .pub .n{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:16px;line-height:1.15;}
    .pub .s{font-size:11.5px;color:var(--text3);margin-top:2px;}
    .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px;max-height:520px;overflow:auto;padding-right:4px;}
    .teams a{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;font-weight:600;text-decoration:none;border-radius:6px;color:var(--text2);}
    .teams a:hover{background:var(--bg2);color:var(--text);}
    .teams img{width:18px;height:18px;object-fit:contain;}
    .teams .on-dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;}

    /* ── site header band ── */
    .band{background:var(--band);color:#fff;border-radius:14px;padding:24px 26px 0;position:relative;overflow:hidden;margin-bottom:24px;}
    .band::after{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:340px;background:radial-gradient(closest-side,var(--tc2,transparent),transparent);opacity:.35;pointer-events:none;}
    .band-top{display:flex;align-items:center;gap:18px;position:relative;z-index:1;}
    .crest{width:68px;height:68px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;color:#111;}
    .crest img{width:54px;height:54px;object-fit:contain;}
    .band-k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.78;}
    .band-h{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.01em;margin:3px 0 4px;overflow-wrap:anywhere;}
    .band-s{font-size:13.5px;opacity:.85;}
    .band-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;}
    .band-acts a{font-size:11.5px;font-weight:700;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:6px 11px;border-radius:999px;white-space:nowrap;}
    .band-acts a:hover{background:rgba(255,255,255,.12);}
    .tabs{display:flex;gap:2px;margin-top:20px;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none;}
    .tabs button{background:none;border:none;color:#fff;opacity:.72;font-size:12.5px;font-weight:700;padding:11px 14px;border-bottom:3px solid transparent;white-space:nowrap;}
    .tabs button:hover{opacity:1;}
    .tabs button.on{opacity:1;border-bottom-color:#fff;}
    @media(max-width:640px){ .band{padding:18px 16px 0;} .band-h{font-size:26px;} .crest{width:52px;height:52px;} .crest img{width:40px;height:40px;} .band-acts{display:none;} }

    /* ── site layout ── */
    .site-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start;}
    @media(max-width:980px){ .site-grid{grid-template-columns:1fr;} }
    .lead{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:18px;text-decoration:none;cursor:pointer;}
    .lead.nocover{grid-template-columns:1fr;}
    @media(max-width:700px){ .lead{grid-template-columns:1fr;} }
    .cover{aspect-ratio:16/9;border-radius:10px;background:var(--bg2) center/cover no-repeat;border:1px solid var(--border);}
    .lead h2{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.01em;margin:6px 0 8px;}
    .lead p{font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.5;color:var(--text2);margin-bottom:12px;}
    .lead:hover h2,.story:hover h3{color:var(--tc-text,var(--accent));}
    .kick{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tc-text,var(--accent));}
    .story{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer;}
    .story.nocover{grid-template-columns:1fr;}
    .story .cover{aspect-ratio:4/3;}
    .story h3{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:20px;line-height:1.15;margin:4px 0 6px;}
    .story p{font-family:'Source Serif 4',Georgia,serif;font-size:14.5px;line-height:1.45;color:var(--text2);margin-bottom:8px;}
    .meta{font-size:11.5px;color:var(--text3);}
    .rail-sec{margin-bottom:28px;}
    .rail-p{font-size:13px;line-height:1.55;color:var(--text2);white-space:pre-wrap;}
    .mast{list-style:none;}
    .mast li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .mast li:last-child{border-bottom:none;}
    .mast .r{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-left:auto;}
    .mini{list-style:none;}
    .mini li{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .mini li:last-child{border-bottom:none;}
    .mini a{font-weight:700;text-decoration:none;color:var(--text);} .mini a:hover{color:var(--accent);}
    .mini .meta{margin-top:2px;}
    .callout{border:1px dashed var(--border2);border-radius:12px;padding:22px;margin-bottom:22px;}
    .callout h3{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:22px;margin-bottom:6px;}
    .callout p{font-size:13.5px;color:var(--text2);line-height:1.55;margin-bottom:14px;max-width:620px;}

    /* ── article ── */
    .art{max-width:720px;margin:0 auto;}
    .back{font-size:12px;font-weight:700;color:var(--text3);background:none;border:none;padding:0;margin-bottom:16px;}
    .back:hover{color:var(--text);}
    .art h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:42px;line-height:1.08;letter-spacing:-.015em;margin:8px 0 12px;overflow-wrap:anywhere;}
    .art .dek{font-family:'Source Serif 4',Georgia,serif;font-size:20px;line-height:1.45;color:var(--text2);margin-bottom:18px;}
    .byline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px;font-size:12.5px;color:var(--text3);}
    .byline .who{font-size:13px;}
    .art .cover{margin-bottom:24px;aspect-ratio:auto;min-height:0;}
    .art .cover img{width:100%;display:block;border-radius:10px;}
    @media(max-width:640px){ .art h1{font-size:30px;} .art .dek{font-size:17px;} }
    .prose{font-family:'Source Serif 4',Georgia,serif;font-size:18.5px;line-height:1.7;color:var(--text);overflow-wrap:anywhere;}
    .prose p{margin:0 0 1.1em;}
    .prose h2{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:26px;line-height:1.2;margin:1.4em 0 .5em;}
    .prose h3{font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:.01em;margin:1.3em 0 .4em;}
    .prose blockquote{border-left:3px solid var(--tc-text,var(--accent));padding:2px 0 2px 18px;margin:0 0 1.1em;color:var(--text2);font-style:italic;}
    .prose ul,.prose ol{margin:0 0 1.1em 1.3em;}
    .prose li{margin-bottom:.35em;}
    .prose a{color:var(--tc-text,var(--accent));text-underline-offset:2px;}
    .prose hr{border:none;border-top:1px solid var(--border2);margin:1.8em auto;width:40%;}
    .prose figure{margin:1.4em 0;} .prose figure img{max-width:100%;border-radius:8px;display:block;margin:0 auto;}
    .prose figcaption{font-family:'Inter',system-ui,sans-serif;font-size:12px;color:var(--text3);text-align:center;margin-top:6px;}
    .art-foot{margin-top:28px;padding-top:16px;border-top:2px solid var(--border2);}

    /* ── editor ── */
    .ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;}
    @media(max-width:1000px){ .ed-grid{grid-template-columns:1fr;} .ed-prev{display:none;} .ed-prev.show{display:block;} }
    .ed-title{font:800 26px 'Playfair Display',Georgia,serif;border:none;border-bottom:1px solid var(--border2);border-radius:0;padding:6px 0;background:transparent;}
    .ed-dek{font:400 16px 'Source Serif 4',Georgia,serif;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:6px 0;background:transparent;}
    .tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--border2);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg2);}
    .tb button{background:var(--bg);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;min-width:30px;}
    .tb button:hover{color:var(--text);border-color:var(--border2);}
    .ed-body{min-height:460px;border-radius:0 0 8px 8px;font:400 15px/1.65 'Source Serif 4',Georgia,serif;}
    .ed-prev{border:1px solid var(--border);border-radius:10px;padding:22px;position:sticky;top:110px;max-height:calc(100vh - 140px);overflow:auto;}
    .ed-prev .prose{font-size:16.5px;}
    .ed-help{font-size:11.5px;color:var(--text3);line-height:1.6;margin-top:4px;}
    .ed-help code{font-size:11px;background:var(--bg2);padding:0 4px;border-radius:3px;}
    .ed-cover{display:flex;gap:8px;align-items:center;}
    .ed-cover .fi{margin:0;}
    .ed-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 0;margin-top:14px;z-index:5;}

    /* ── forum / lists ── */
    .tl{width:100%;}
    .tl td.t{max-width:0;width:100%;}
    .tl td.t a{color:var(--text);text-decoration:none;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .tl td.t a:hover{color:var(--accent);text-decoration:underline;}
    .comp{border-top:1px solid var(--border);padding:16px 0 4px;margin-bottom:18px;}
    .post{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--border);}
    .post .av{width:36px;height:36px;}
    .p-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px;}
    .p-name{font-weight:800;color:var(--text);text-decoration:none;} .p-name:hover{color:var(--accent);}
    .p-time{color:var(--text3);font-size:11.5px;}
    .p-op{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
    .p-body{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;}
    .p-acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
    .p-acts button{background:none;border:none;padding:0;font-size:11.5px;font-weight:700;color:var(--text3);}
    .p-acts button:hover{color:var(--text);} .p-acts button.mod{color:var(--red);}
    .th-title{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:26px;margin:6px 0;overflow-wrap:anywhere;}
    .notice{font-size:13px;color:var(--text2);padding:12px 0;border-top:1px solid var(--border);}
    .card{border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
    .card h3{font-size:14px;font-weight:800;margin-bottom:12px;}
    .app{padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .app:last-child{border-bottom:none;}
    .app .pitch{color:var(--text2);line-height:1.5;margin:6px 0 8px;white-space:pre-wrap;}
    .acts-sm button{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--border2);background:var(--bg);color:var(--text2);}
    .acts-sm button.r{color:var(--red);}
  </style>

<script>
(function(){
  const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  const CATS=['General','Game Talk','Recruiting','Transfer Portal'];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const session=()=>{ try{ return JSON.parse(localStorage.getItem('tdc_session')||'null'); }catch(e){ return null; } };
  const tok=()=>{ const s=session(); return s&&s.access_token||null; };
  const H=(auth)=>({apikey:KEY,Authorization:'Bearer '+((auth&&tok())||KEY),'Content-Type':'application/json'});
  const ago=d=>{ const s=Math.floor((Date.now()-new Date(d))/1000);
    if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago';
    if(s<604800) return Math.floor(s/86400)+'d ago'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
  const dateLong=d=>new Date(d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const badge=p=>(window.TDC_BADGE&&p)?TDC_BADGE.html(p):'';
  const avatar=p=>p&&p.avatar_url?`<span class="av"><img src="${esc(p.avatar_url)}" alt="" onerror="this.remove()"></span>`:`<span class="av">${esc(((p&&p.username)||'?')[0].toUpperCase())}</span>`;
  const userLink=(p,fallback)=>p&&p.username?`<a href="profile.html?user=${encodeURIComponent(p.username)}">${esc(p.username)}</a>`:`<b>${esc(fallback||'member')}</b>`;
  const readMins=body=>Math.max(1,Math.round(String(body||'').split(/\s+/).filter(Boolean).length/230));

  // every failed write says what the database said (rules live in Postgres)
  async function errText(r){
    let t=''; try{ t=await r.text(); }catch(e){}
    if(r.status===401) return 'Your session has expired. Sign out and back in, then try again.';
    try{ const j=JSON.parse(t); if(j.message) return j.message+(j.hint?' ('+j.hint+')':''); }catch(e){}
    return 'Something went wrong ('+r.status+').';
  }
  async function get(path,auth){
    let r=await fetch(`${SB}/rest/v1/${path}`,{headers:H(auth)});
    if(auth&&r.status===401) r=await fetch(`${SB}/rest/v1/${path}`,{headers:H(false)});   // a stale session still reads what's public
    if(!r.ok) throw new Error(await errText(r)); return r.json();
  }
  async function send(path,method,body,prefer){
    const r=await fetch(`${SB}/rest/v1/${path}`,{method,headers:{...H(true),...(prefer?{Prefer:prefer}:{})},body:body?JSON.stringify(body):undefined});
    if(!r.ok) throw new Error(await errText(r)); return r.status===204?null:r.json().catch(()=>null);
  }
  const rpc=(fn,body)=>send('rpc/'+fn,'POST',body);
  function say(id,text,cls){ const el=$(id); if(!el) return; el.className='msg '+(cls||''); el.textContent=text||''; }
  async function withAuthors(rows,key){
    key=key||'author_id';
    const ids=[...new Set(rows.map(r=>r[key]).filter(Boolean))]; if(!ids.length) return rows;
    const ps=await get(`profiles?id=in.(${ids.join(',')})&select=id,username,avatar_url,verified,plan`).catch(()=>[]);
    const by=Object.fromEntries(ps.map(p=>[p.id,p])); rows.forEach(r=>{ r.profiles=by[r[key]]||null; }); return rows;
  }

  // ── article markup: a small, safe Markdown ─────────────────────────────
  // everything is escaped first; only these shapes become HTML, and links/images must be http(s)
  function inline(t){
    return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g,'$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener nofollow ugc">$1</a>');
  }
  function md(src){
    const lines=esc(src||'').replace(/\r/g,'').split('\n'), out=[]; let para=[], list=null, quote=[];
    const flushP=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); para=[]; } };
    const flushL=()=>{ if(list){ out.push(`<${list.t}>`+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+`</${list.t}>`); list=null; } };
    const flushQ=()=>{ if(quote.length){ out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>'); quote=[]; } };
    const flush=()=>{ flushP(); flushL(); flushQ(); };
    for(const raw of lines){
      const l=raw.trimEnd(); let m;
      if(!l.trim()){ flush(); continue; }
      if((m=/^(#{2,3})\s+(.+)$/.exec(l))){ flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
      if(/^(-{3,}|\*{3,})$/.test(l.trim())){ flush(); out.push('<hr>'); continue; }
      if((m=/^!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)$/.exec(l.trim()))){ flush(); out.push(`<figure><img src="${m[2]}" alt="${m[1]}" loading="lazy">${m[1]?`<figcaption>${m[1]}</figcaption>`:''}</figure>`); continue; }
      if((m=/^&gt;\s?(.*)$/.exec(l))){ flushP(); flushL(); quote.push(m[1]); continue; }
      if((m=/^\s*[-*]\s+(.+)$/.exec(l))){ flushP(); flushQ(); if(!list||list.t!=='ul'){ flushL(); list={t:'ul',items:[]}; } list.items.push(m[1]); continue; }
      if((m=/^\s*\d+[.)]\s+(.+)$/.exec(l))){ flushP(); flushQ(); if(!list||list.t!=='ol'){ flushL(); list={t:'ol',items:[]}; } list.items.push(m[1]); continue; }
      flushL(); flushQ(); para.push(l);
    }
    flush(); return out.join('');
  }

  // ── state ──────────────────────────────────────────────────────────────
  let me=null, meProfile=null, myBan=null, OWNER=false;
  let TEAMS=[];                // [{name, conference}] from the teams table
  let T=null;                  // current team name (teams.name)
  let SITE=null, WRITERS=[], myRole=null;   // myRole: 'editor' | 'writer' | null
  const isEditor=()=>OWNER||myRole==='editor';
  const canWrite=()=>OWNER||!!myRole;

  async function loadMe(){
    const t=tok(); if(!t) return;
    try{
      const r=await fetch(`${SB}/auth/v1/user`,{headers:{apikey:KEY,Authorization:'Bearer '+t}});
      if(!r.ok) return; me=await r.json();
      meProfile=(await get(`profiles?id=eq.${me.id}&select=id,username,avatar_url,verified,plan,created_at`,true).catch(()=>[]))[0]||null;
      OWNER=!!(window.tdcIsOwner&&tdcIsOwner());
      const b=await get(`forum_bans?user_id=eq.${me.id}&select=until,reason`,true).catch(()=>[]);
      myBan=(b&&b[0]&&(!b[0].until||new Date(b[0].until)>new Date()))?b[0]:null;
    }catch(e){}
  }

  // "Notre Dame Fighting Irish", "notre dame", "NC State Wolfpack" -> the teams.name it belongs to
  const nk=s=>String(s||'').toLowerCase().replace(/[-.']/g,' ').replace(/\s+/g,' ').trim();
  function resolveTeam(q){
    const k=nk(q); if(!k) return null;
    let best=null;
    TEAMS.forEach(t=>{ const n=nk(t.name); if((k===n||k.startsWith(n+' '))&&(!best||n.length>nk(best.name).length)) best=t; });
    return best&&best.name;
  }
  const colors=name=>{ try{ return (window.tdcTeamColor&&tdcTeamColor(name))||null; }catch(e){ return null; } };
  const logo=name=>{ const c=colors(name); return c&&c.logo||null; };
  function applyTheme(name){
    const c=colors(name), ds=document.documentElement.style;
    const c1=(c&&c.c1)||'#1A1814';
    ds.setProperty('--tc',c1);
    ds.setProperty('--band',window.tdcBandColor?tdcBandColor(c1):c1);
    ds.setProperty('--tc2',(c&&c.c2)||'transparent');
    // team colour as text: darkest teams lighten on the dark theme (see team-color-readability)
    const dark=document.documentElement.getAttribute('data-theme')==='dark';
    ds.setProperty('--tc-text',dark?`color-mix(in srgb,${c1} 55%,#ffffff)`:`color-mix(in srgb,${c1} 80%,#000000)`);
  }

  // ── routing: ?team=&tab=&a=&t=&edit= ───────────────────────────────────
  const P=()=>new URLSearchParams(location.search);
  function go(params,replace){
    const u=new URLSearchParams(); Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=='') u.set(k,v); });
    const url=location.pathname+(u.toString()?'?'+u.toString():'');
    history[replace?'replaceState':'pushState'](null,'',url); route();
  }
  window.addEventListener('popstate',()=>route());
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-go]'); if(!a) return;
    if(e.metaKey||e.ctrlKey||e.shiftKey) return;   // let new-tab clicks through
    e.preventDefault(); go(JSON.parse(a.dataset.go)); window.scrollTo(0,0);
  });
  const goAttr=o=>`data-go='${esc(JSON.stringify(o))}' href="fan.html?${esc(new URLSearchParams(Object.entries(o).filter(([,v])=>v!=null&&v!=='')).toString())}"`;

  async function route(){
    const p=P(), team=p.get('team');
    if(!team){ T=null; document.documentElement.style.removeProperty('--band'); return renderDirectory(); }
    const name=resolveTeam(team);
    if(!name){ $('app').innerHTML=`<div class="empty">We couldn't find a program called "${esc(team)}". <a href="fan.html">See every fan site</a>.</div>`; return; }
    if(name!==T){ T=name; await loadSite(); }
    applyTheme(T);
    document.title=(SITE?SITE.name:T+' Fan Site')+' — The Depth Chart';
    const tab=p.get('tab')||'home';
    if(p.get('a')) return renderArticle(+p.get('a'));
    if(p.get('edit')) return renderEditor(p.get('edit'));
    renderShell(tab);
    if(tab==='forum') return p.get('t')?renderThread(+p.get('t')):renderForum();
    if(tab==='masthead') return renderMasthead();
    if(tab==='write') return renderMine();
    if(tab==='manage') return renderManage();
    return renderHome();
  }

  async function loadSite(){
    const [s,w]=await Promise.all([
      get(`fan_sites?team=eq.${encodeURIComponent(T)}&select=*`).catch(()=>null),
      get(`fan_writers?team=eq.${encodeURIComponent(T)}&select=*&order=created_at.asc`).catch(()=>[])]);
    if(s===null){ SITE=null; WRITERS=[]; myRole=null; window.__fanTablesMissing=true; return; }
    SITE=s[0]||null; WRITERS=await withAuthors(w||[],'user_id');
    const mine=me&&WRITERS.find(x=>x.user_id===me.id); myRole=mine?mine.role:null;
  }

  // ── directory (no team) ────────────────────────────────────────────────
  async function renderDirectory(){
    document.title='Fan Sites — The Depth Chart';
    $('app').innerHTML=`<div class="page-eyebrow">Community · Fan Sites</div><h1 class="page-h1">Fan Sites</h1>
      <div class="dir-grid"><div>
        <div class="sec-h">Publications</div><div id="dirPubs"><div class="empty">Loading…</div></div>
        <div class="sec-h">Latest stories</div><div id="dirLatest"></div>
      </div><aside>
        <div class="sec-h">Find your team</div>
        <input class="fi" id="dirQ" type="search" placeholder="Search ${TEAMS.length} programs…" aria-label="Search teams"/>
        <div class="teams" id="dirTeams"></div>
      </aside></div>`;
    const [sites,arts]=await Promise.all([
      get('fan_sites?select=*&order=name.asc').catch(()=>null),
      get('fan_articles?status=eq.published&select=id,team,title,dek,cover_url,author_id,author_name,published_at&order=published_at.desc&limit=12').catch(()=>[])]);
    if(sites===null){ $('dirPubs').innerHTML='<div class="empty">Fan sites are not switched on yet. The owner needs to run scripts/fan_sites.sql in Supabase.</div>'; }
    const live=new Set((sites||[]).map(s=>s.team));
    const S=Object.fromEntries((sites||[]).map(s=>[s.team,s]));
    if(sites) $('dirPubs').innerHTML=sites.length?`<div class="pubs">${sites.map(s=>{ const c=colors(s.team), lg=logo(s.team);
      return `<a class="pub" style="--c:${esc((c&&c.c1)||'')}" ${goAttr({team:s.team})}>${lg?`<img src="${esc(lg)}" alt="">`:''}<span style="min-width:0"><span class="n">${esc(s.name)}</span><span class="s" style="display:block">${esc(s.team)}${s.tagline?' · '+esc(s.tagline):''}</span></span></a>`; }).join('')}</div>`
      :'<div class="empty">No publications yet. Pick your team and start one.</div>';
    $('dirLatest').innerHTML=arts.length?(await withAuthors(arts)).map(a=>storyHtml(a,S[a.team]?S[a.team].name:a.team)).join(''):'<div class="empty">No stories published yet.</div>';
    const paint=q=>{ q=nk(q);
      $('dirTeams').innerHTML=TEAMS.filter(t=>!q||nk(t.name).includes(q)||nk(t.conference).includes(q)).map(t=>{ const lg=logo(t.name);
        return `<a ${goAttr({team:t.name})}>${lg?`<img src="${esc(lg)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<span style="width:18px"></span>'}<span>${esc(t.name)}</span>${live.has(t.name)?'<span class="on-dot" title="Has a publication"></span>':''}</a>`; }).join('')||'<div class="empty">No match.</div>'; };
    paint(''); $('dirQ').oninput=e=>paint(e.target.value);
  }

  // ── a team's site ──────────────────────────────────────────────────────
  function renderShell(tab){
    const lg=logo(T), tabs=[['home','Home'],['forum','Forum'],['masthead','Masthead']];
    if(canWrite()) tabs.push(['write','Write']);
    if(isEditor()) tabs.push(['manage','Manage']);
    $('app').innerHTML=`<div class="band">
        <div class="band-top"><div class="crest">${lg?`<img src="${esc(lg)}" alt="">`:esc(T.slice(0,3).toUpperCase())}</div>
          <div style="min-width:0"><div class="band-k">${esc(T)} · Fan site</div><div class="band-h">${esc(SITE?SITE.name:T+' Fan Site')}</div>
          ${SITE&&SITE.tagline?`<div class="band-s">${esc(SITE.tagline)}</div>`:''}</div>
          <div class="band-acts"><a href="program-hq.html?team=${encodeURIComponent(T)}">Program HQ</a><a href="team.html?team=${encodeURIComponent(T)}">Team page</a><a ${goAttr({})}>All fan sites</a></div></div>
        <div class="tabs">${tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" ${goAttr({team:T,tab:k==='home'?null:k})}>${l}</button>`).join('')}</div>
      </div><div id="view"><div class="empty">Loading…</div></div>`;
  }
  function storyHtml(a,kicker,lead){
    const go=goAttr({team:a.team,a:a.id}), by=`${esc(a.author_name||'')} · ${a.published_at?ago(a.published_at):'draft'}`;
    if(lead) return `<a class="lead${a.cover_url?'':' nocover'}" ${go}>${a.cover_url?`<div class="cover" style="background-image:url('${esc(a.cover_url)}')"></div>`:''}
      <div><div class="kick">${esc(kicker||'Top story')}</div><h2>${esc(a.title)}</h2>${a.dek?`<p>${esc(a.dek)}</p>`:''}<div class="meta">${by}</div></div></a>`;
    return `<a class="story${a.cover_url?'':' nocover'}" ${go} style="text-decoration:none"><div>${kicker?`<div class="kick">${esc(kicker)}</div>`:''}<h3>${esc(a.title)}</h3>${a.dek?`<p>${esc(a.dek)}</p>`:''}<div class="meta">${by}</div></div>
      ${a.cover_url?`<div class="cover" style="background-image:url('${esc(a.cover_url)}')"></div>`:''}</a>`;
  }
  function mastList(){
    if(!WRITERS.length) return '<div class="meta">No writers yet.</div>';
    const order=w=>w.role==='editor'?0:1;
    return `<ul class="mast">${WRITERS.slice().sort((a,b)=>order(a)-order(b)).map(w=>`<li><span class="who">${avatar(w.profiles)}${userLink(w.profiles)}${badge(w.profiles)}</span><span class="r">${w.role}</span></li>`).join('')}</ul>`;
  }

  async function renderHome(){
    const tablesMissing=window.__fanTablesMissing;
    const [arts,topics]=await Promise.all([
      get(`fan_articles?team=eq.${encodeURIComponent(T)}&status=eq.published&select=id,team,title,dek,cover_url,author_id,author_name,published_at&order=published_at.desc&limit=40`).catch(()=>[]),
      get(`forum_topics?team=eq.${encodeURIComponent(T)}&select=id,title,reply_count,updated_at,created_at,author_name&order=updated_at.desc&limit=6`).catch(()=>[])]);
    let main='';
    if(tablesMissing) main='<div class="callout"><h3>Almost ready</h3><p>Fan sites are built but not switched on. Run <b>scripts/fan_sites.sql</b> in the Supabase SQL editor and this page comes to life.</p></div>';

    $('view').innerHTML=`<div class="site-grid"><div>${main}</div><aside>

      ${SITE&&SITE.about?`<div class="rail-sec"><div class="sec-h">About</div><div class="rail-p">${esc(SITE.about)}</div></div>`:''}
      <div class="rail-sec"><div class="sec-h">From the forum <a ${goAttr({team:T,tab:'forum'})}>All topics →</a></div>
        ${topics.length?`<ul class="mini">${topics.map(t=>`<li><a ${goAttr({team:T,tab:'forum',t:t.id})}>${esc(t.title)}</a><div class="meta">${t.reply_count||0} replies · ${ago(t.updated_at||t.created_at)}</div></li>`).join('')}</ul>`:`<div class="meta">No topics yet. <a ${goAttr({team:T,tab:'forum'})}>Start the conversation</a>.</div>`}</div>
      <div class="rail-sec"><div class="sec-h">Masthead <a ${goAttr({team:T,tab:'masthead'})}>Write for us →</a></div>${mastList()}</div>

  function launchCallout(){
    if(isEditor()) return `<div class="callout"><h3>Launch the ${esc(T)} publication</h3><p>Name it and you become its editor. You can write right away, approve writers who apply, and hand the editor role to someone else.</p>

      <label class="lab">Tagline (optional)</label><input class="fi" id="lnTag" maxlength="140" placeholder="e.g. Notre Dame basketball, written by the student section"/>
      <div class="msg" id="lnMsg"></div><button class="btn" id="lnGo">Launch it</button></div>`;
    return `<div class="callout"><h3>No ${esc(T)} publication yet</h3><p>Want to run it? Apply on the masthead and tell us what you'd cover. The forum is already open.</p>
      <div class="row"><a class="btn" ${goAttr({team:T,tab:'masthead'})}>Apply to write</a><a class="btn ghost" ${goAttr({team:T,tab:'forum'})}>Go to the forum</a></div></div>`;
  }
  function wireLaunch(){
    const b=$('lnGo'); if(!b) return;
    b.onclick=async()=>{
      const name=$('lnName').value.trim(); if(name.length<3){ say('lnMsg','Give it a name of at least 3 characters.','err'); return; }
      b.disabled=true; say('lnMsg','Launching…');
      try{
        await send('fan_sites','POST',{team:T,name,tagline:$('lnTag').value.trim()||null});
        await send('fan_writers','POST',{team:T,user_id:me.id,role:'editor'},'resolution=merge-duplicates');
        await loadSite(); route();
      }catch(e){ say('lnMsg',e.message,'err'); b.disabled=false; }
    };
  }

        <div class="msg" id="upMsg"></div>
        <div class="tb" id="edTb">
          <button data-md="b" title="Bold"><b>B</b></button><button data-md="i" title="Italic"><i>I</i></button>
          <button data-md="h2" title="Section heading">H2</button><button data-md="h3" title="Small heading">H3</button>
          <button data-md="q" title="Quote">❝</button><button data-md="ul" title="Bulleted list">• List</button><button data-md="ol" title="Numbered list">1. List</button>
          <button data-md="a" title="Link">Link</button><button data-md="img" title="Image in the story">Image</button><button data-md="hr" title="Divider">—</button>
          <span class="sp"></span><button data-md="prev" class="prev-tg" title="Preview">Preview</button>
        </div>
        <textarea class="ft ed-body" id="edBody" maxlength="60000" placeholder="Write your story. Blank line = new paragraph.">${esc(a.body||'')}</textarea>
        <div class="ed-help">Formatting: <code>**bold**</code> <code>*italic*</code> <code>## Heading</code> <code>&gt; quote</code> <code>- list</code> <code>[text](https://…)</code> <code>![caption](https://image…)</code> on its own line. <span id="edWc"></span></div>
        <div class="ed-bar"><div class="msg" id="edMsg"></div><div class="row">
          ${a.status==='published'?'':'<button class="btn ghost" id="edSave">Save draft</button>'}
          ${a.status==='published'?'<button class="btn ghost" id="edUnpub">Unpublish</button>':''}
          <button class="btn" id="edPub">${a.status==='published'?'Update story':'Publish'}</button>
          <span class="sp"></span>${isNew?'':'<button class="btn danger" id="edDel">Delete</button>'}
        </div></div>
      </div>
      <div class="ed-prev" id="edPrev"><div class="kick" id="pvKick"></div><h1 id="pvTitle" style="font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:30px;line-height:1.1;margin:6px 0 8px"></h1><div class="dek" id="pvDek" style="font-family:'Source Serif 4',Georgia,serif;font-size:17px;color:var(--text2);margin-bottom:14px"></div><div id="pvCover"></div><div class="prose" id="pvBody"></div></div></div>`;
    const body=$('edBody');
    const paint=()=>{
      $('pvKick').textContent=SITE?SITE.name:T; $('pvTitle').textContent=$('edTitle').value||'Headline';
      $('pvDek').textContent=$('edDek').value; const cv=$('edCover').value.trim();
      $('pvCover').innerHTML=/^https:\/\//i.test(cv)?`<img src="${esc(cv)}" alt="" style="width:100%;border-radius:8px;margin-bottom:16px">`:'';
      $('pvBody').innerHTML=md(body.value)||'<p style="color:var(--text3)">Your story appears here as readers will see it.</p>';
      const w=body.value.split(/\s+/).filter(Boolean).length; $('edWc').textContent=`· ${w.toLocaleString()} words · ${readMins(body.value)} min read`;
      if(isNew) try{ localStorage.setItem(draftKey,JSON.stringify({title:$('edTitle').value,dek:$('edDek').value,cover_url:cv,body:body.value})); }catch(e){}
    };
    ['edTitle','edDek','edCover','edBody'].forEach(i=>$(i).addEventListener('input',paint)); paint();
    // toolbar: wrap the selection or insert at the cursor
    $('edTb').onclick=e=>{
      const b=e.target.closest('[data-md]'); if(!b) return; e.preventDefault();
      const k=b.dataset.md; if(k==='prev'){ $('edPrev').classList.toggle('show'); return; }
      const s=body.selectionStart, en=body.selectionEnd, sel=body.value.slice(s,en);
      const lineStart=body.value.lastIndexOf('\n',s-1)+1;
      let ins, cur;
      const wrap=(l,r,ph)=>{ ins=l+(sel||ph)+r; cur=sel?s+ins.length:s+l.length+ph.length; };
      const prefix=p=>{ const txt=(sel||'').split('\n').map(x=>p+x).join('\n')||p; ins=txt; cur=s+txt.length; };
      if(k==='b') wrap('**','**','bold text'); else if(k==='i') wrap('*','*','italic text');
      else if(k==='a'){ const u=prompt('Link address (https://…)'); if(!u) return; wrap('[',`](${u.trim()})`,'link text'); }
      else if(k==='img'){ const u=prompt('Image address (https://…)'); if(!u) return; const c=prompt('Caption (optional)')||''; ins=`\n\n![${c}](${u.trim()})\n\n`; cur=s+ins.length; }
      else if(k==='hr'){ ins='\n\n---\n\n'; cur=s+ins.length; }
      else { const p={h2:'## ',h3:'### ',q:'> ',ul:'- ',ol:'1. '}[k]; if(s!==lineStart&&!sel){ ins='\n'+p; cur=s+ins.length; } else prefix(p); }
      body.setRangeText(ins,s,en,'end'); body.focus(); body.setSelectionRange(cur,cur); paint();
    };
    // cover upload → storage bucket fan-media/<uid>/…
    $('edUp').onclick=()=>$('edFile').click();
    $('edFile').onchange=async()=>{
      const f=$('edFile').files[0]; if(!f) return;
      if(f.size>5*1024*1024){ say('upMsg','Images must be 5 MB or smaller.','err'); return; }
      say('upMsg','Uploading…');
      const path=`${me.id}/${Date.now()}-${f.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-')}`;
      try{
        const r=await fetch(`${SB}/storage/v1/object/fan-media/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':f.type,'x-upsert':'false'},body:f});
        if(!r.ok) throw new Error(await errText(r));
        $('edCover').value=`${SB}/storage/v1/object/public/fan-media/${path}`; say('upMsg','Uploaded.','ok'); paint();
      }catch(e){ say('upMsg',e.message,'err'); }
    };
    const payload=status=>({title:$('edTitle').value.trim(),dek:$('edDek').value.trim()||null,cover_url:$('edCover').value.trim()||null,body:body.value,status});
    const busy=on=>['edSave','edPub','edUnpub','edDel'].forEach(i=>{ const el=$(i); if(el) el.disabled=on; });
    async function save(status){
      const p=payload(status);
      if(p.title.length<5){ say('edMsg','Headlines need at least 5 characters.','err'); return; }
      if(p.cover_url&&!/^https:\/\//i.test(p.cover_url)){ say('edMsg','The cover image link has to start with https://','err'); return; }
      if(status==='published'&&p.body.trim().split(/\s+/).length<50&&!confirm('This story is under 50 words. Publish anyway?')) return;
      busy(true); say('edMsg','Saving…');
      try{
        let row;
        if(isNew){ [row]=await send('fan_articles','POST',{...p,team:T,author_id:me.id},'return=representation'); try{ localStorage.removeItem(draftKey); }catch(e){} }
        else { [row]=await send(`fan_articles?id=eq.${a.id}`,'PATCH',p,'return=representation'); }
        if(!row) throw new Error('The save was refused. Are you still on the masthead?');
        if(status==='published') go({team:T,a:row.id});
        else { say('edMsg','Saved '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'.','ok'); if(isNew) go({team:T,edit:row.id},true); busy(false); }
      }catch(e){ say('edMsg',e.message,'err'); busy(false); }
    }
    if($('edSave')) $('edSave').onclick=()=>save('draft');
    $('edPub').onclick=()=>save('published');
    if($('edUnpub')) $('edUnpub').onclick=()=>{ if(confirm('Take this story down? It goes back to your drafts.')) save('draft'); };
    if($('edDel')) $('edDel').onclick=async()=>{ if(!confirm('Delete this story for good?')) return;
      busy(true); try{ await send(`fan_articles?id=eq.${a.id}`,'DELETE'); go({team:T,tab:'write'}); }catch(e){ say('edMsg',e.message,'err'); busy(false); } };
  }

  // ── masthead + applying ────────────────────────────────────────────────

    if($('apWithdraw')) $('apWithdraw').onclick=async()=>{ try{ await send(`fan_applications?id=eq.${mine.id}`,'DELETE'); renderMasthead(); }catch(e){ alert(e.message); } };

  // ── team forum (forum_topics.team; forum_guard enforces the rules) ─────

  async function renderForum(){
    const topics=await withAuthors(await get(`forum_topics?team=eq.${encodeURIComponent(T)}&select=*&order=pinned.desc,updated_at.desc&limit=300`).catch(()=>[]));
    const comp=!me?`<a class="btn" href="signin.html">Sign in to post</a>`:myBan?`<span class="cnt" style="color:var(--red);font-weight:700">${esc(banText())}</span>`:'<button class="btn" id="ntOpen">New topic</button>';
    $('view').innerHTML=`<div class="site-grid"><div>
      <div class="row" style="margin-bottom:12px"><div class="sec-h" style="flex:1;margin:0;border:none;padding:0">${esc(T)} forum · ${topics.length} topic${topics.length===1?'':'s'}</div>${comp}</div>
      <div class="comp" id="ntComp" style="display:none"><div class="msg" id="ntMsg"></div>
        <select class="fs" id="ntCat" aria-label="Category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
        <input class="fi" id="ntTitle" maxlength="120" placeholder="Title (5 to 120 characters)"/>
        <textarea class="ft" id="ntBody" maxlength="5000" placeholder="What's on your mind about ${esc(T)}?"></textarea>
        <div class="row"><button class="btn" id="ntGo">Post topic</button><button class="btn ghost" id="ntCancel">Cancel</button></div></div>
      ${topics.length?`<div class="sheet-wrap"><table class="sheet dense tl"><thead><tr><th class="l">Topic</th><th class="l">Category</th><th class="l">Started by</th><th>Replies</th><th>Active</th></tr></thead><tbody>${
        topics.map(t=>`<tr><td class="l t"><a ${goAttr({team:T,tab:'forum',t:t.id})}>${t.pinned?'<span class="tag pin">Pinned</span>':''}${t.locked?'<span class="tag">Locked</span>':''}${esc(t.title)}</a></td><td class="l dim">${esc(t.category||'')}</td><td class="l dim">${esc((t.profiles&&t.profiles.username)||t.author_name||'')}</td><td>${t.reply_count||0}</td><td class="dim">${ago(t.updated_at||t.created_at)}</td></tr>`).join('')}</tbody></table></div>`
        :`<div class="empty">No ${esc(T)} topics yet.${me&&!myBan?' Start the first one.':''}</div>`}
    </div><aside><div class="rail-sec"><div class="sec-h">Forum rules</div><div class="rail-p">The same rules as the main forum: talk basketball, no harassment or personal info, two links a post at most. Breaking them can mean a deleted post, a timeout or a ban.</div></div>
      <div class="rail-sec"><div class="sec-h">Everything else</div><div class="rail-p"><a href="forum.html">The main Depth Chart forum →</a></div></div></aside></div>`;
    const o=$('ntOpen'); if(o) o.onclick=()=>{ $('ntComp').style.display=''; $('ntTitle').focus(); };
    if($('ntCancel')) $('ntCancel').onclick=()=>{ $('ntComp').style.display='none'; };
    if($('ntGo')) $('ntGo').onclick=async()=>{
      const title=$('ntTitle').value.trim(); if(title.length<5){ say('ntMsg','Titles need at least 5 characters.','err'); return; }
      $('ntGo').disabled=true; say('ntMsg','Posting…');
      try{ const [row]=await send('forum_topics','POST',{title,body:$('ntBody').value.trim()||null,category:$('ntCat').value,team:T,author_id:me.id,author_name:(meProfile&&meProfile.username)||''},'return=representation');
        go({team:T,tab:'forum',t:row.id}); }catch(e){ say('ntMsg',e.message,'err'); $('ntGo').disabled=false; }
    };
  }
  function postHtml(kind,row,isOp,topic){
    const mine=me&&row.author_id===me.id, acts=[];
    if(me&&!mine) acts.push(`<button data-report="${kind}:${row.id}">Report</button>`);
    if(mine||OWNER) acts.push(`<button class="${OWNER?'mod':''}" data-del="${kind}:${row.id}">Delete</button>`);
    if(OWNER&&isOp) acts.push(`<button data-pin="${topic.pinned?0:1}">${topic.pinned?'Unpin':'Pin'}</button>`,`<button data-lock="${topic.locked?0:1}">${topic.locked?'Unlock':'Lock'}</button>`);
    const name=(row.profiles&&row.profiles.username)||row.author_name||'member';
    const who=row.profiles&&row.profiles.username?`<a class="p-name" href="profile.html?user=${encodeURIComponent(name)}">${esc(name)}</a>`:`<span class="p-name">${esc(name)}</span>`;
    const w=WRITERS.find(x=>x.user_id===row.author_id);
    return `<div class="post">${avatar(row.profiles)}<div><div class="p-head">${who}${badge(row.profiles)}${w?`<span class="p-op">${w.role}</span>`:''}${isOp?'<span class="p-op">Original post</span>':''}<span class="p-time">${ago(row.created_at)}</span></div>
      ${row.body?`<div class="p-body">${esc(row.body)}</div>`:''}${acts.length?`<div class="p-acts">${acts.join('')}</div>`:''}</div></div>`;
  }
  async function renderThread(id){
    const t=(await withAuthors(await get(`forum_topics?id=eq.${id}&select=*`).catch(()=>[])))[0];
    if(!t||t.team!==T){ $('view').innerHTML=`<div class="empty">That topic isn't in the ${esc(T)} forum. <a ${goAttr({team:T,tab:'forum'})}>All topics</a></div>`; return; }
    const rs=await withAuthors(await get(`forum_replies?topic_id=eq.${id}&select=*&order=created_at.asc`).catch(()=>[]));
    let comp;
    if(!me) comp='<div class="notice"><a href="signin.html" style="color:var(--accent);font-weight:700">Sign in</a> to reply.</div>';
    else if(myBan) comp=`<div class="notice"><b>${esc(banText())}</b></div>`;
    else if(t.locked&&!OWNER) comp='<div class="notice"><b>This topic is locked.</b></div>';
    else comp=`<div class="comp" style="border-top:2px solid var(--border2)"><div class="msg" id="rpMsg"></div><textarea class="ft" id="rpBody" maxlength="2000" placeholder="Add to the conversation" style="min-height:90px"></textarea><button class="btn" id="rpGo">Post reply</button></div>`;
    $('view').innerHTML=`<div style="max-width:820px"><button class="back" ${goAttr({team:T,tab:'forum'})}>← ${esc(T)} forum</button>
      <div>${t.pinned?'<span class="tag pin">Pinned</span>':''}${t.locked?'<span class="tag">Locked</span>':''}<span class="tag">${esc(t.category||'General')}</span></div>
      <h2 class="th-title">${esc(t.title)}</h2><div class="meta" style="margin-bottom:12px">${rs.length} ${rs.length===1?'reply':'replies'} · started ${ago(t.created_at)}</div>
      ${postHtml('topic',t,true,t)}${rs.map(r=>postHtml('reply',r,false,t)).join('')}${comp}</div>`;
    if($('rpGo')) $('rpGo').onclick=async()=>{
      const body=$('rpBody').value.trim(); if(body.length<2){ say('rpMsg','Replies need at least 2 characters.','err'); return; }
      $('rpGo').disabled=true;
      try{ await send('forum_replies','POST',{topic_id:id,body,author_id:me.id,author_name:(meProfile&&meProfile.username)||''}); renderThread(id); }
      catch(e){ say('rpMsg',e.message,'err'); $('rpGo').disabled=false; }
    };
    $('view').onclick=async e=>{
      const rp=e.target.closest('[data-report]'), d=e.target.closest('[data-del]'), pn=e.target.closest('[data-pin]'), lk=e.target.closest('[data-lock]');
      try{
        if(rp){ const [k,i]=rp.dataset.report.split(':'); const reason=prompt('What is wrong with this post? (optional)'); if(reason===null) return;
          await send('forum_reports','POST',{target_type:k,target_id:+i,reason:reason.slice(0,300)||null,reporter_id:me.id}); alert('Thanks. The report went to the moderator.'); return; }
        if(d){ const [k,i]=d.dataset.del.split(':'); if(!confirm(k==='topic'?'Delete this topic and all of its replies?':'Delete this reply?')) return;
          await rpc(k==='topic'?'forum_delete_topic':'forum_delete_reply',{p_id:+i}); if(k==='topic') go({team:T,tab:'forum'}); else renderThread(id); return; }
        if(pn||lk){ await rpc('mod_set_topic',{p_id:id,p_pinned:pn?pn.dataset.pin==='1':null,p_locked:lk?lk.dataset.lock==='1':null}); renderThread(id); }
      }catch(err){ alert(/duplicate|409/.test(err.message)?'You already reported this post.':err.message); }
    };
  }
