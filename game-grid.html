  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;}
    .nav-wrap{border-bottom:1px solid var(--border);background:rgba(250,249,246,.66);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);position:sticky;top:0;z-index:200;}
    [data-theme="dark"] .nav-wrap{background:rgba(20,20,22,.84);border-bottom-color:rgba(26,43,68,.9);}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;letter-spacing:-.01em;}
    .nav-logo span{color:var(--accent);}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-toggle:hover{border-color:var(--accent);color:var(--text);}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;position:relative;white-space:nowrap;flex-shrink:0;transition:color .2s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .22s;}
    .nav-sub a:first-child::after{left:0;}
    .nav-sub a:hover{color:var(--text);} .nav-sub a:hover::after{transform:scaleX(1);}
    .nav-sub a.active{color:var(--text);} .nav-sub a.active::after{transform:scaleX(1);}
    .wrap{max-width:640px;margin:0 auto;padding:22px 16px 90px;}
    .g-head{text-align:center;margin-bottom:12px;}
    .g-title{font-family:'Playfair Display',serif;font-weight:800;font-size:32px;letter-spacing:-.01em;}

    .stat{text-align:center;}
    .stat .n{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1;}
    .stat .l{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-top:3px;}

    .g-btn{display:inline-block;margin-top:12px;padding:10px 18px;font-size:13px;font-weight:700;border-radius:9px;border:none;cursor:pointer;background:var(--accent);color:#221c08;}
    .g-btn.ghost{background:none;border:1px solid var(--border2);color:var(--text2);margin-left:8px;}
    .loading{padding:60px;text-align:center;color:var(--text3);}
    @media(max-width:520px){.nav-top,.nav-sub{padding-left:14px;padding-right:14px;}.grid{grid-template-columns:64px 1fr 1fr 1fr;grid-template-rows:60px 1fr 1fr 1fr;gap:5px;}.ghead{font-size:9.5px;}.ghead.rowh{font-size:9px;}.g-title{font-size:26px;}}

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';try{localStorage.setItem('tdc_theme',d?'light':'dark');}catch(e){}}
(function(){try{var s=localStorage.getItem('tdc_theme');if(s){document.documentElement.setAttribute('data-theme',s);var b=document.getElementById('themeBtn');if(b)b.textContent=s==='dark'?'☀️':'🌙';}}catch(e){}})();

let CONF={}, PLAYERS=[], BYNAME={}, ROWS=[], COLS=[], CELLS=[], guessesLeft=9, active=null, done=false;

function todayIndex(){const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));return Math.floor(Date.UTC(et.getFullYear(),et.getMonth(),et.getDate())/86400000);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function grNum(g){var n=parseInt(g);return isNaN(n)?0:n;}
function seasonLbl(y){y=+y;return (y-1)+'-'+(''+y).slice(2);}
function photoOf(p){return (window.tdcShowPhotos&&window.tdcShowPhotos())?(p.photo_url||(p.espn_id?'https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/'+p.espn_id+'.png':'')):'';}

// ── build career aggregates (by name; union same-name players) ──
function aggregate(rows){
  var by={};
  rows.forEach(function(r){
    if(!r.name)return;
    var a=by[r.name]||(by[r.name]={name:r.name,teams:new Set(),confs:new Set(),maxPpg:0,maxRpg:0,maxApg:0,maxStl:0,maxBlk:0,max3p:0,careerPts:0,seasons:0,peakGrade:0,espn_id:r.espn_id,photo_url:r.photo_url,lastY:0,lastTeam:r.team});
    a.teams.add(r.team); var c=CONF[r.team]; if(c)a.confs.add(c);
    a.maxPpg=Math.max(a.maxPpg,+r.ppg||0); a.maxRpg=Math.max(a.maxRpg,+r.rpg||0); a.maxApg=Math.max(a.maxApg,+r.apg||0);
    a.maxStl=Math.max(a.maxStl,+r.stl||0); a.maxBlk=Math.max(a.maxBlk,+r.blk||0);
    if(Math.max(+r.tpm||0,+r.tpa||0)>=2) a.max3p=Math.max(a.max3p,+r.tp_pct||0);
    a.careerPts+=Math.round((+r.ppg||0)*(+r.gp||0));
    a.seasons++; a.peakGrade=Math.max(a.peakGrade,grNum(r.tdc_grade));
    if((+r.season_year||0)>=a.lastY){a.lastY=+r.season_year||0;a.lastTeam=r.team;if(r.espn_id)a.espn_id=r.espn_id;if(r.photo_url)a.photo_url=r.photo_url;}
  });
  return Object.keys(by).map(function(k){return by[k];});
}

// ── criteria catalog ──
function buildCriteria(){
  var teamCount={}; PLAYERS.forEach(function(p){p.teams.forEach(function(t){teamCount[t]=(teamCount[t]||0)+1;});});
  var teams=Object.keys(teamCount).filter(function(t){return teamCount[t]>=12;})
    .map(function(t){return {type:'team',label:t,test:(function(tm){return function(p){return p.teams.has(tm);};})(t)};});
  var confCount={}; PLAYERS.forEach(function(p){p.confs.forEach(function(c){confCount[c]=(confCount[c]||0)+1;});});
  var confs=Object.keys(confCount).filter(function(c){return confCount[c]>=25;})
    .map(function(c){return {type:'conf',label:c,test:(function(cf){return function(p){return p.confs.has(cf);};})(c)};});
  var acc=[
    {type:'acc',fam:'ppg',label:'20+ PPG Season',test:function(p){return p.maxPpg>=20;}},
    {type:'acc',fam:'ppg',label:'15+ PPG Season',test:function(p){return p.maxPpg>=15;}},
    {type:'acc',label:'8+ RPG Season',test:function(p){return p.maxRpg>=8;}},
    {type:'acc',label:'5+ APG Season',test:function(p){return p.maxApg>=5;}},
    {type:'acc',label:'2+ SPG Season',test:function(p){return p.maxStl>=2;}},
    {type:'acc',label:'2+ BPG Season',test:function(p){return p.maxBlk>=2;}},
    {type:'acc',label:'40%+ 3PT Season',test:function(p){return p.max3p>=40;}},
    {type:'acc',label:'1500+ Career Pts',test:function(p){return p.careerPts>=1500;}},
    {type:'acc',label:'90+ TDC Grade',test:function(p){return p.peakGrade>=90;}},
    {type:'acc',label:'4+ Seasons',test:function(p){return p.seasons>=4;}}
  ];
  // precompute qualifier name-sets
  function withQual(c){var s=new Set();PLAYERS.forEach(function(p){if(c.test(p))s.add(p.name);});c.qual=s;return c;}
  return {teams:teams.map(withQual), confs:confs.map(withQual), acc:acc.map(withQual)};
}
function inter(a,b){var small=a.size<b.size?a:b,big=a.size<b.size?b:a,n=0;small.forEach(function(x){if(big.has(x))n++;});return n;}

// ── construct a solvable grid ──
// Columns are always accolades so a conference can never sit above its own
// schools (which would make that cell a freebie). Rows are a mix of teams/
// conferences PLUS one accolade row — that accolade row × the accolade columns
// gives genuine stat×stat squares. Every cell is (team|conf|stat) × stat, so
// no impossible team×team and no trivial conf×team cells.
function buildGrid(cat, rng){
  var teamConf=cat.teams.concat(cat.confs);
  for(var attempt=0; attempt<900; attempt++){
    var tc=shuffle(teamConf,rng).slice(0,2);        // 2 team/conference rows
    var accs=shuffle(cat.acc,rng);
    var rowAcc=accs[0];                              // 1 accolade row → stat×stat cells
    var cols=accs.slice(1,4);                        // 3 accolade columns (distinct)
    if(!tc[0]||!tc[1]||!rowAcc||cols.length<3) continue;
    // no two accolades of the same stat family across axes (e.g. 15+ PPG × 20+ PPG)
    var fams={}, famClash=false; [rowAcc].concat(cols).forEach(function(a){ if(a.fam){ if(fams[a.fam])famClash=true; fams[a.fam]=1; } });
    if(famClash) continue;
    var rows=shuffle([tc[0],tc[1],rowAcc],rng);      // accolade row lands anywhere
    var labels={}, dup=false;
    rows.concat(cols).forEach(function(c){if(labels[c.label])dup=true;labels[c.label]=1;});
    if(dup) continue;
    var ok=true;
    for(var r=0;r<3&&ok;r++)for(var cc=0;cc<3;cc++){ if(inter(rows[r].qual,cols[cc].qual)<2){ok=false;break;} }
    if(ok) return {rows:rows,cols:cols};
  }
  return null;
}

// ── rendering ──
function render(){
  var host=document.getElementById('content');
  var correct=CELLS.filter(function(c){return c.player;}).length;
  var rar=CELLS.filter(function(c){return c.player;});
  var avgRar=rar.length?Math.round(rar.reduce(function(s,c){return s+c.rarity;},0)/rar.length):0;
  var top='<div class="topbar">'+
    '<div class="stat"><div class="n">'+guessesLeft+'</div><div class="l">Guesses</div></div>'+
    '<div class="stat"><div class="n">'+correct+'/9</div><div class="l">Filled</div></div>'+
    '<div class="stat"><div class="n">'+avgRar+'</div><div class="l">Avg Rarity</div></div>'+
    '<button class="newbtn" onclick="newGrid()">↻ New grid</button></div>';
  var g='<div class="grid"><div class="ghead corner"></div>';
  COLS.forEach(function(c){ g+='<div class="ghead">'+c.label+'</div>'; });
  for(var r=0;r<3;r++){
    g+='<div class="ghead rowh">'+ROWS[r].label+'</div>';
    for(var cc=0;cc<3;cc++){ g+=cellHtml(r,cc); }
  }
  g+='</div>';
  host.innerHTML=top+g+'<div class="g-result" id="gr"></div>';
  if(done) showResult();
}
function cellHtml(r,c){
  var cell=CELLS[r*3+c];
  if(cell.player){
    var p=cell.player, ph=photoOf(p);
    var img=ph?'<img class="ph" src="'+ph+'" onerror="this.outerHTML=\'<span class=&quot;noph&quot;>'+(p.name||'?')[0]+'</span>\'">':'<span class="noph">'+(p.name||'?')[0]+'</span>';
    return '<div class="cell done hit">'+img+'<div class="pin"><span class="nm">'+p.name+'</span><span class="rar">'+cell.rarity+' rarity</span></div></div>';
  }
  if(cell.missed) return '<div class="cell done miss"><span class="xmark">✗</span></div>';
  return '<div class="cell" onclick="openCell('+r+','+c+')"><span class="plus">+</span></div>';
}

// ── guessing ──
function openCell(r,c){
  if(done||guessesLeft<=0)return;
  active={r:r,c:c};
  document.getElementById('mtitle').innerHTML='<b>'+ROWS[r].label+'</b> &nbsp;×&nbsp; <b>'+COLS[c].label+'</b>';
  document.getElementById('mdrop').innerHTML=''; document.getElementById('mi').value='';
  document.getElementById('modal').classList.add('on');
  setTimeout(function(){document.getElementById('mi').focus();},50);
}
function closeModal(){document.getElementById('modal').classList.remove('on');active=null;}
let _sel=-1,_matches=[];
function usedNames(){var s={};CELLS.forEach(function(c){if(c.player)s[c.player.name]=1;});return s;}
function onInput(v){
  var d=document.getElementById('mdrop'); v=(v||'').toLowerCase().trim();
  if(!v){d.innerHTML='';_matches=[];return;}
  var used=usedNames();
  _matches=PLAYERS.filter(function(p){return p.name.toLowerCase().indexOf(v)>=0 && !used[p.name];})
    .sort(function(a,b){return b.peakGrade-a.peakGrade;}).slice(0,8);
  _sel=-1;
  d.innerHTML=_matches.map(function(p,i){return '<div class="mopt" data-i="'+i+'" onclick="choose('+i+')"><span class="nm">'+p.name+'</span><span class="tm">'+p.lastTeam+'</span></div>';}).join('');
}
function onKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();_sel=Math.min(_sel+1,_matches.length-1);hl();}
  else if(e.key==='ArrowUp'){e.preventDefault();_sel=Math.max(_sel-1,0);hl();}
  else if(e.key==='Enter'){e.preventDefault();if(_sel>=0)choose(_sel);else if(_matches.length===1)choose(0);}
  else if(e.key==='Escape'){closeModal();}
}
function hl(){[].forEach.call(document.querySelectorAll('.mopt'),function(o,i){o.classList.toggle('sel',i===_sel);});}
function choose(i){
  var p=_matches[i]; if(!p||!active)return;
  var r=active.r,c=active.c,cell=CELLS[r*3+c];
  var okRow=ROWS[r].test(p), okCol=COLS[c].test(p);
  guessesLeft--;
  if(okRow&&okCol){
    cell.player=p;
    // rarity: how deep-a-cut is this pick among qualifiers (by peak grade). higher=rarer
    var q=[]; PLAYERS.forEach(function(x){if(ROWS[r].test(x)&&COLS[c].test(x))q.push(x.peakGrade);});
    q.sort(function(a,b){return a-b;});
    var below=q.filter(function(g){return g<=p.peakGrade;}).length;
    cell.rarity=Math.max(1,Math.round(100*(1-(below/Math.max(1,q.length)))));
  } else { cell.missed=true; }
  closeModal();
  if(guessesLeft<=0||CELLS.every(function(c){return c.player||c.missed;})) done=true;
  render();
}
function showResult(){
  var el=document.getElementById('gr'); if(!el)return;
  var correct=CELLS.filter(function(c){return c.player;}).length;
  var rar=CELLS.filter(function(c){return c.player;});
  var avg=rar.length?Math.round(rar.reduce(function(s,c){return s+c.rarity;},0)/rar.length):0;
  el.innerHTML='<div class="rz">'+correct+' / 9 squares</div>'+
    '<div style="font-size:13px;color:var(--text3);margin-top:4px;">Average rarity '+avg+' · higher = deeper cuts</div>'+
    '<div><button class="g-btn" onclick="share()">Share</button><button class="g-btn ghost" onclick="newGrid()">New grid</button></div>';
  el.classList.add('on');
}
function share(){
  var emo=CELLS.map(function(c){return c.player?'🟩':'⬛';});
  var lines=emo[0]+emo[1]+emo[2]+'\n'+emo[3]+emo[4]+emo[5]+'\n'+emo[6]+emo[7]+emo[8];
  var correct=CELLS.filter(function(c){return c.player;}).length;
  var txt='The Depth Chart — Hoop Grid  '+correct+'/9\n'+lines+'\nplay: booby-buckets.github.io/the-depth-chart/game-grid.html';
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('Copied!');},function(){});
  else toast('Copy not supported');
}
function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:999;';document.body.appendChild(t);setTimeout(function(){t.remove();},2000);}

// ── start ──
let _cat=null;
function startGrid(rng){
  var grid=buildGrid(_cat,rng);
  if(!grid){document.getElementById('content').innerHTML='<div class="loading">Could not build a grid — try New grid.</div>';return;}
  ROWS=grid.rows; COLS=grid.cols;
  CELLS=[]; for(var i=0;i<9;i++)CELLS.push({player:null,missed:false,rarity:0});
  guessesLeft=9; done=false; active=null; render();
}
function newGrid(){ startGrid(mulberry32((Math.floor(todayIndex())*7919 + Date.now()%100000)|0)); }
async function init(){
  try{
    var tm=await fetch(SB+'/rest/v1/teams?select=name,conf',{headers:H}).then(r=>r.json()).catch(function(){return[];});
    (Array.isArray(tm)?tm:[]).forEach(function(t){CONF[t.name]=t.conf||'';});
    const base=SB+'/rest/v1/player_history?select=name,team,season_year,tdc_grade,ppg,rpg,apg,stl,blk,tp_pct,tpm,tpa,gp,espn_id,photo_url&tdc_grade=gte.80&gp=gte.15';
    const cr=await fetch(base+'&limit=1',{headers:Object.assign({},H,{'Prefer':'count=exact','Range':'0-0','Range-Unit':'items'})});
    const total=parseInt((cr.headers.get('content-range')||'/0').split('/')[1]||0)||7500;
    const PG=1000,pages=Math.ceil(total/PG),jobs=[];
    for(let i=0;i<pages;i++)jobs.push(fetch(base,{headers:Object.assign({},H,{'Range-Unit':'items','Range':(i*PG)+'-'+(i*PG+PG-1)})}).then(r=>r.ok?r.json():[]));
    const parts=await Promise.all(jobs);
    var rows=parts.reduce(function(a,b){return a.concat(b);},[]);
    PLAYERS=aggregate(rows);
    if(!PLAYERS.length){document.getElementById('content').innerHTML='<div class="loading">Could not load players.</div>';return;}
    _cat=buildCriteria();
    startGrid(mulberry32(todayIndex()|0));
  }catch(e){document.getElementById('content').innerHTML='<div class="loading">Error: '+e.message+'</div>';}
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal();});
init();
</script>
