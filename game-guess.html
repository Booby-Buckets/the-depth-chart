  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;}
    /* layout */
    .g-wrap{max-width:760px;margin:0 auto;padding:26px 20px 90px;}
    .g-head{text-align:center;margin-bottom:8px;}
    .g-title{font-family:'Playfair Display',serif;font-weight:800;font-size:34px;letter-spacing:-.01em;}
    .g-sub{font-size:13px;color:var(--text3);margin-top:4px;}
    .g-controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 6px;}
    .diff-seg{flex-wrap:wrap;justify-content:center;}
    .g-controls .seg:empty{display:none;}
    @media(max-width:560px){ .diff-seg button{padding:6px 9px;font-size:11px;} }
    .g-meta{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 20px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);}
    .g-meta b{color:var(--accent);}
    /* search */
    .g-hint-btn{display:block;margin:0 auto 16px;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;border:1px solid var(--border2);background:var(--bg2);color:var(--accent);cursor:pointer;transition:border-color .15s;}
    .g-hint-btn:hover{border-color:var(--accent);}
    .g-hint{max-width:440px;margin:0 auto 16px;padding:10px 14px;border-radius:9px;background:rgba(168,132,60,.08);border:1px solid rgba(168,132,60,.28);font-size:13px;color:var(--text2);text-align:center;}
    .g-hint b{color:var(--accent);font-weight:800;}
    .g-search{position:relative;max-width:440px;margin:0 auto 18px;}
    .g-input{width:100%;padding:13px 16px;font-size:15px;font-family:'Inter',sans-serif;font-weight:600;color:var(--text);background:var(--bg2);border:1.5px solid var(--border2);border-radius:10px;outline:none;transition:border-color .15s;}
    .g-input:focus{border-color:var(--accent);}
    .g-input:disabled{opacity:.5;cursor:not-allowed;}
    .g-drop{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--bg);border:1px solid var(--border2);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:280px;overflow-y:auto;z-index:20;display:none;}
    .g-drop.on{display:block;}
    .g-opt{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);}
    .g-opt:last-child{border-bottom:none;}
    .g-opt:hover,.g-opt.sel{background:var(--bg2);}
    .g-opt .nm{font-weight:700;font-size:14px;}
    .g-opt .tm{font-size:11px;color:var(--text3);}
    /* board */
    .g-board-scroll{overflow-x:auto;}
    .g-board{min-width:560px;}
    .g-row{display:grid;grid-template-columns:1.5fr 1.15fr 1fr .8fr .8fr .9fr .9fr;gap:6px;margin-bottom:6px;}
    .g-row.head .cell{background:none;color:var(--text3);font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 2px;min-height:0;}
    .cell{background:var(--bg3);border-radius:8px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5px 4px;font-size:12.5px;font-weight:700;line-height:1.15;gap:1px;}
    .cell .sub{font-size:9px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.03em;}
    .cell.name{background:var(--bg2);border:1px solid var(--border);font-family:'Playfair Display',serif;font-weight:800;font-size:13px;}
    .cell.hit{background:#1f9d57;color:#fff;} .cell.hit .sub{color:#fff;opacity:.85;}
    .cell.warm{background:#d19a25;color:#fff;} .cell.warm .sub{color:#fff;opacity:.85;}
    .cell.miss{background:var(--bg3);color:var(--text2);}
    .arrow{font-size:15px;line-height:1;}
    /* result: the answer sits at the top of the shared result card */
    .gm-result .rz-photo{width:78px;height:78px;border-radius:16px;object-fit:cover;background:var(--bg3);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:32px;color:var(--accent);border:1px solid var(--border2);}
    .gm-result .rz-verdict{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
    .gm-result .rz-verdict.win{color:#1f9d57;} .gm-result .rz-verdict.lose{color:#cf5a4e;}
    .gm-result-a a.gm-btn{text-decoration:none;}
    .g-legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:11px;color:var(--text3);}
    .g-legend span{display:inline-flex;align-items:center;gap:6px;}
    .g-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
    .g-mystats{margin-top:28px;padding-top:14px;border-top:1px solid var(--border);}
    .g-mystats .gm-stats{border-top:none;padding-top:0;}
    .g-mystats-h{text-align:center;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
    .loading{padding:60px;text-align:center;color:var(--text3);}
    @media(max-width:520px){.g-title{font-size:27px;}}

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const T=window.TDCGames, GID='guess';

const MAX=10, HINTS=3;
// Daily = one mystery player for everyone, fixed at Medium · this year (10 guesses, 3 hints).
const DAILY_SCOPE='year', DAILY_DIFF='medium';
let scope=DAILY_SCOPE, mode=T.startMode(), difficulty=DAILY_DIFF;   // 'year'|'all', 'daily'|'practice', difficulty tier
let pScope='year', pDiff='medium';                              // free-play settings, restored when leaving the daily
// Two tiers: the ANSWER pool (POOL_*) is the notable players the mystery can be;
// the GUESS pool (GUESS_*) is a broader set of real rotation players you're allowed
// to guess (so e.g. a 79-grade starter still autocompletes even if he can't be the
// answer). GUESS_* is a superset of POOL_*.
let GUESS_YEAR=null, GUESS_ALL=null, CONF={}, TARGET=null, state={guesses:[],done:false,won:false,hints:0,shareText:null};
function guessPool(){ return scope==='year'?GUESS_YEAR:GUESS_ALL; }    // allowed guesses

// ── difficulty: filters the ANSWER pool (who the mystery can be) by grade + whether
// the player is at a power conference. The GUESS pool stays broad either way. ──
var POWER=['acc','big ten','big 12','sec','big east','pac-12','pac 12'];
function isPower(p){ var c=(confOf(p.team)||'').toLowerCase(); if(!c||c==='—')return false; return POWER.some(function(x){return c.indexOf(x)>=0;}); }
var DIFFS={
  easy:      {lbl:'Easy',      hint:'85+ · power confs',        test:function(g,pw){return pw&&g>=85;}},
  medium:    {lbl:'Medium',    hint:'80+ · mostly power',       test:function(g,pw){return pw?g>=80:g>=87;}},
  hard:      {lbl:'Hard',      hint:'75+ · mostly power',       test:function(g,pw){return pw?g>=75:g>=83;}},
  difficult: {lbl:'Difficult', hint:'75+ · anywhere',           test:function(g,pw){return g>=75;}},
  impossible:{lbl:'Impossible',hint:'any player',               test:function(g,pw){return true;}}
};
function answerPool(){
  var gp=guessPool()||[], d=DIFFS[difficulty]||DIFFS.medium;
  return gp.filter(function(p){ var g=(p._g||grNum(p.tdc_grade)||0); return d.test(g, isPower(p)); });
}
function currentPool(){ return answerPool(); }   // answers, filtered by difficulty
function seasonLbl(y){ y=+y; return isNaN(y)?'':((y-1)+'-'+(''+y).slice(2)); }
function scopeLbl(){ return scope==='all'?'all-time':'this year'; }

// ── attribute helpers ──
function classInfo(raw){var s=(raw||'').toLowerCase();
  if(s.includes('gr'))return{lbl:'Grad',ord:5};
  if(s.includes('sr'))return{lbl:'Sr',ord:4};
  if(s.includes('jr'))return{lbl:'Jr',ord:3};
  if(s.includes('so'))return{lbl:'So',ord:2};
  if(s.includes('fr'))return{lbl:'Fr',ord:1};
  return{lbl:(raw||'—'),ord:0};}
function posGroup(p){p=(p||'').toUpperCase();
  if(['PG','SG','CG','G'].indexOf(p)>=0)return'G';
  if(['SF','GF','WF','F','W'].indexOf(p)>=0)return'W';
  if(['PF','C','FC','B'].indexOf(p)>=0)return'B';return'?';}
function htIn(h){var m=(''+h).match(/(\d+)\D+(\d+)/);return m?(+m[1]*12+ +m[2]):null;}
function grNum(g){var n=parseInt(g);return isNaN(n)?null:n;}
function confOf(team){return CONF[team]||'—';}

// build a compared cell {html,mark}
function cmp(label, gv, tv, kind, guess, target){
  var cls='miss', arrow='', sub='';
  if(kind==='exact'){ cls=(gv===tv)?'hit':'miss'; }
  else if(kind==='pos'){
    if((guess.position||'')===(target.position||''))cls='hit';
    else if(posGroup(guess.position)===posGroup(target.position))cls='warm';
  }
  else if(kind==='class'){
    var a=classInfo(guess.class_year||guess.yr), b=classInfo(target.class_year||target.yr);
    if(a.ord&&b.ord){ if(a.ord===b.ord)cls='hit'; else{ cls='miss'; arrow=b.ord>a.ord?'↑':'↓'; } }
  }
  else if(kind==='height'){
    var ga=htIn(guess.height), tb=htIn(target.height);
    if(ga!=null&&tb!=null){ if(ga===tb)cls='hit'; else{ arrow=tb>ga?'↑':'↓'; cls=Math.abs(tb-ga)<=2?'warm':'miss'; } }
  }
  else if(kind==='grade'){
    var gg=grNum(guess.tdc_grade), tg=grNum(target.tdc_grade);
    if(gg!=null&&tg!=null){ if(gg===tg)cls='hit'; else{ arrow=tg>gg?'↑':'↓'; cls=Math.abs(tg-gg)<=3?'warm':'miss'; } }
  }
  var mark=cls==='hit'?'🟩':cls==='warm'?'🟨':'⬜';
  return {html:'<div class="cell '+cls+'">'+(arrow?'<span class="arrow">'+arrow+'</span>':'')+'<span>'+gv+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>', mark:mark};
}

// column layout depends on scope — All-Time adds a Year column
function colConfig(){
  return scope==='all'
    ? {tmpl:'1.3fr 1fr .85fr .9fr .7fr .72fr .72fr .82fr', heads:['','School','Conf','Class','Pos','Ht','Year','Grade'], min:660}
    : {tmpl:'1.5fr 1.15fr 1fr .8fr .8fr .9fr .9fr', heads:['','School','Conf','Class','Pos','Ht','Grade'], min:560};
}
function cmpYear(g){
  var gy=+g.season_year||0, ty=+TARGET.season_year||0, lbl=gy?(''+gy):'—';
  if(!gy||!ty) return {html:'<div class="cell miss"><span>'+lbl+'</span></div>', mark:'⬜'};
  if(gy===ty) return {html:'<div class="cell hit"><span>'+lbl+'</span></div>', mark:'🟩'};
  var arrow=ty>gy?'↑':'↓', cls=Math.abs(ty-gy)<=2?'warm':'miss';
  return {html:'<div class="cell '+cls+'"><span class="arrow">'+arrow+'</span><span>'+lbl+'</span></div>', mark:cls==='warm'?'🟨':'⬜'};
}
// 3 progressive hints, vague → specific.
function hintText(n){
  if(!TARGET) return '';
  if(n===1){
    var pos=TARGET.position||'?', conf=confOf(TARGET.team);
    var era=(scope==='all'&&TARGET.season_year)?(' · '+(Math.floor(TARGET.season_year/10)*10)+'s'):'';
    return 'A <b>'+pos+'</b>'+(conf&&conf!=='—'?' from the <b>'+conf+'</b>':'')+era;
  }
  if(n===2){
    return '<b>'+classInfo(TARGET.class_year||TARGET.yr).lbl+'</b> · <b>'+(TARGET.height||'?')+'</b>';
  }
  // hint 3 — grade band + school initial (most revealing)
  var g=grNum(TARGET.tdc_grade), lo=g!=null?Math.floor(g/5)*5:null;
  var band=lo!=null?(lo+'–'+(lo+4)):'?';
  return 'Grade <b>'+band+'</b> · school starts with <b>'+((TARGET.team||'?').charAt(0).toUpperCase())+'</b>';
}
function guessRow(g){
  var cfg=colConfig();
  var gv=confOf(g.team), tv=confOf(TARGET.team);
  var confCls=(gv===tv&&gv!=='—')?'hit':'miss';
  var cells=[
    '<div class="cell name">'+g.name+'</div>',
    cmp('School', g.team, TARGET.team, 'exact', g, TARGET).html,
    '<div class="cell '+confCls+'"><span>'+gv+'</span></div>',
    cmp('Class', classInfo(g.class_year||g.yr).lbl, classInfo(TARGET.class_year||TARGET.yr).lbl, 'class', g, TARGET).html,
    cmp('Pos', (g.position||'—'), (TARGET.position||'—'), 'pos', g, TARGET).html,
    cmp('Ht', (g.height||'—'), (TARGET.height||'—'), 'height', g, TARGET).html
  ];
  if(scope==='all') cells.push(cmpYear(g).html);
  cells.push(cmp('Grade', (g.tdc_grade||'—'), (TARGET.tdc_grade||'—'), 'grade', g, TARGET).html);
  return '<div class="g-row" style="grid-template-columns:'+cfg.tmpl+';">'+cells.join('')+'</div>';
}
// ── controls: one Free play / Daily switch, then era + difficulty (always shown; in the daily they
// show its fixed setting, and picking another one starts a free-play game at that setting) ──
function renderControls(){
  var daily=mode==='daily';
  T.modeBar('modeSeg', mode, setMode);
  document.getElementById('segScope').innerHTML=
    '<button type="button" class="'+(scope==='year'?'on':'')+'" onclick="setScope(\'year\')">This Year<small>current players</small></button>'+
    '<button type="button" class="'+(scope==='all'?'on':'')+'" onclick="setScope(\'all\')">All-Time<small>20 seasons</small></button>';
  document.getElementById('segDiff').innerHTML=Object.keys(DIFFS).map(function(k){return '<button type="button" class="'+(difficulty===k?'on':'')+'" onclick="setDifficulty(\''+k+'\')">'+DIFFS[k].lbl+'<small>'+DIFFS[k].hint+'</small></button>';}).join('');
  var note=document.getElementById('gNote');
  note.textContent=daily?('Daily #'+T.dayNumber()+' · the same player for everyone · '+MAX+' guesses · '+HINTS+' hints'):'';
  note.style.display=daily?'':'none';
}
function statsFoot(){
  return state.done?'':'<div class="g-mystats"><div class="g-mystats-h">Your stats</div>'+T.statsHtml(GID,{score:'Avg guesses'})+'</div>';
}

// ── render ──
function render(){
  renderControls();
  var host=document.getElementById('content');
  var cfg=colConfig();
  if(!TARGET){
    host.innerHTML='<div class="g-hint" style="margin-top:18px;">No players match <b>'+((DIFFS[difficulty]||{}).lbl||'')+'</b> for this scope. Try an easier tier.</div>';
    return;
  }
  var head='<div class="g-row head" style="grid-template-columns:'+cfg.tmpl+';">'+
    cfg.heads.map(function(h){return '<div class="cell">'+h+'</div>';}).join('')+'</div>';
  var rows=state.guesses.map(function(nm){var g=byName(nm);return g?guessRow(g):'';}).join('');
  var used=state.guesses.length, left=MAX-used, hl=HINTS-(state.hints||0);
  var search=state.done?'':(
    '<div class="g-search">'+
      '<input class="g-input" id="gi" type="text" autocomplete="off" placeholder="Guess a player…" oninput="onInput(this.value)" onkeydown="onKey(event)">'+
      '<div class="g-drop" id="gd"></div>'+
    '</div>');
  var hintsShown='';
  for(var _hi=1;_hi<=(state.hints||0);_hi++){ hintsShown+='<div class="g-hint">💡 <b>Hint '+_hi+':</b> '+hintText(_hi)+'</div>'; }
  var hintBtn=(!state.done && hl>0)?'<button class="g-hint-btn" onclick="useHint()">💡 Reveal a hint ('+hl+' left)</button>':'';
  host.innerHTML=
    '<div class="g-meta"><span>Guess <b>'+used+'</b> / '+MAX+'</span><span>'+left+' left</span></div>'+
    search+hintsShown+hintBtn+
    '<div class="g-board-scroll"><div class="g-board" style="min-width:'+cfg.min+'px;">'+head+rows+'</div></div>'+
    '<div class="g-legend"><span><i style="background:#1f9d57"></i>Exact</span><span><i style="background:#d19a25"></i>Close</span><span><i style="background:var(--bg3)"></i>Off · ↑ higher ↓ lower</span></div>'+
    '<div id="gr"></div>'+statsFoot();
  if(state.done) showResult();
  var gi=document.getElementById('gi'); if(gi) gi.focus();
}
function byName(nm){return (guessPool()||[]).find(function(p){return p.name===nm;});}

// ── autocomplete ──
let _sel=-1, _matches=[];
function onInput(v){
  var d=document.getElementById('gd'); v=(v||'').toLowerCase().trim();
  if(!v){d.classList.remove('on');_matches=[];return;}
  var guessed={}; state.guesses.forEach(function(n){guessed[n]=1;});
  _matches=(guessPool()||[]).filter(function(p){return p.name.toLowerCase().indexOf(v)>=0 && !guessed[p.name];}).slice(0,8);
  if(!_matches.length){d.classList.remove('on');return;}
  _sel=-1;
  d.innerHTML=_matches.map(function(p,i){var sub=(scope==='all'&&p.season_year)?(seasonLbl(p.season_year)+' · '+p.team):p.team;return '<div class="g-opt" data-i="'+i+'" onclick="pick('+i+')"><span class="nm">'+p.name+'</span><span class="tm">'+sub+'</span></div>';}).join('');
  d.classList.add('on');
}
function onKey(e){
  var d=document.getElementById('gd');
  if(e.key==='ArrowDown'){e.preventDefault();_sel=Math.min(_sel+1,_matches.length-1);hi();}
  else if(e.key==='ArrowUp'){e.preventDefault();_sel=Math.max(_sel-1,0);hi();}
  else if(e.key==='Enter'){e.preventDefault();if(_sel>=0)pick(_sel);else if(_matches.length===1)pick(0);}
  else if(e.key==='Escape'){d.classList.remove('on');}
}
function hi(){[].forEach.call(document.querySelectorAll('.g-opt'),function(o,i){o.classList.toggle('sel',i===_sel);});}
function pick(i){ var p=_matches[i]; if(!p)return; submit(p.name); }

function submit(nm){
  if(state.done||!TARGET||state.guesses.length>=MAX)return;
  if(mode==='daily'&&T.dailyResult(GID)) return;          // a finished daily can't be replayed
  state.guesses.push(nm);
  if(nm===TARGET.name){state.won=true;state.done=true;}
  else if(state.guesses.length>=MAX){state.done=true;}
  if(state.done) finish(); else saveProgress();
  render();
}
// a game just ended: save it to the shared stats (daily = the one attempt for today)
function finish(){
  var daily=mode==='daily';
  state.shareText=buildShare();
  T.record(GID,{daily:daily, win:state.won, score:state.won?state.guesses.length:null, share:state.shareText,
    detail:{answer:TARGET.name, guesses:state.guesses.slice(), hints:state.hints||0}});
  if(daily) clearProgress();
}

// the end-of-game card: the answer (photo, verdict, name, bio line) on top of the shared result block
function showResult(){
  var el=document.getElementById('gr'); if(!el)return;
  var t=TARGET, daily=mode==='daily', used=state.guesses.length, h=state.hints||0;
  var photo=(t.espn_id&&window.tdcShowPhotos&&window.tdcShowPhotos())?'https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/'+t.espn_id+'.png':'';
  var img=photo?'<img class="rz-photo" src="'+photo+'" alt="" onerror="this.outerHTML=\'<div class=&quot;rz-photo&quot;>'+(t.name||'?')[0]+'</div>\'">':'<div class="rz-photo">'+(t.name||'?')[0]+'</div>';
  var seasonBit=(scope==='all'&&t.season_year)?(seasonLbl(t.season_year)+' · '):'';
  var verdict='<div class="rz-verdict '+(state.won?'win':'lose')+'">'+(state.won?'Solved in '+used+' / '+MAX:'Out of guesses')+'</div>';
  var line=(t.position||'')+' · '+classInfo(t.class_year||t.yr).lbl+' · '+seasonBit+t.team+' ('+confOf(t.team)+') · '+(t.height||'')+' · Grade '+(t.tdc_grade||'')+
    '<br>'+h+' hint'+(h===1?'':'s')+' used'+(daily?'':' · '+(DIFFS[difficulty]||DIFFS.medium).lbl+' · '+scopeLbl());
  var text=state.shareText||buildShare();
  el.innerHTML=T.resultHtml(GID,{title:t.name, line:line, shareText:text,
    statsOpts:{score:'Avg guesses'}, again:daily?'Free play →':'New player →', daily:daily});
  var card=el.querySelector('.gm-result'); if(card) card.insertAdjacentHTML('afterbegin', img+verdict);
  var acts=el.querySelector('.gm-result-a');
  if(acts) acts.insertAdjacentHTML('beforeend','<a class="gm-btn ghost" href="player.html?name='+encodeURIComponent(t.name)+'&team='+encodeURIComponent(t.team||'')+'">View player →</a>');
  T.wireResult(el, text, daily?function(){ setMode('practice'); }:nextGame);
}
// spoiler-free share: score + one emoji row per guess (school, conf, class, pos, ht, [year], grade)
function buildShare(){
  var rows=state.guesses.map(function(nm){
    var g=byName(nm); if(!g)return '';
    var confM=(confOf(g.team)===confOf(TARGET.team)&&confOf(g.team)!=='—')?'🟩':'⬜';
    var m=[ g.team===TARGET.team?'🟩':'⬜', confM, markClass(g), markPos(g), markHt(g) ];
    if(scope==='all') m.push(markYear(g));
    m.push(markGr(g));
    return m.join('');
  }).filter(Boolean);
  var h=state.hints||0;
  var lines=[(state.won?state.guesses.length:'X')+'/'+MAX+(h?(' · '+h+' hint'+(h===1?'':'s')):'')];
  if(mode!=='daily') lines.push('Practice · '+(DIFFS[difficulty]||DIFFS.medium).lbl+' · '+scopeLbl());
  return T.shareText(GID, mode==='daily', lines.concat(rows));
}
function markClass(g){var a=classInfo(g.class_year||g.yr),b=classInfo(TARGET.class_year||TARGET.yr);return (a.ord&&b.ord&&a.ord===b.ord)?'🟩':'⬜';}
function markPos(g){if((g.position||'')===(TARGET.position||''))return'🟩';return posGroup(g.position)===posGroup(TARGET.position)?'🟨':'⬜';}
function markHt(g){var a=htIn(g.height),b=htIn(TARGET.height);if(a==null||b==null)return'⬜';if(a===b)return'🟩';return Math.abs(a-b)<=2?'🟨':'⬜';}
function markGr(g){var a=grNum(g.tdc_grade),b=grNum(TARGET.tdc_grade);if(a==null||b==null)return'⬜';if(a===b)return'🟩';return Math.abs(a-b)<=3?'🟨':'⬜';}
function markYear(g){var a=+g.season_year||0,b=+TARGET.season_year||0;if(!a||!b)return'⬜';if(a===b)return'🟩';return Math.abs(a-b)<=2?'🟨':'⬜';}

// ── in-progress daily (so a reload resumes the same board; the finished result lives in TDCGames) ──
function progKey(){ return 'tdc_guess_day_'+T.today(); }
function saveProgress(){ if(mode!=='daily')return; try{localStorage.setItem(progKey(),JSON.stringify({answer:TARGET&&TARGET.name,guesses:state.guesses,hints:state.hints}));}catch(e){} }
function loadProgress(){ try{var s=localStorage.getItem(progKey());if(s){var o=JSON.parse(s); if(o&&o.answer===(TARGET&&TARGET.name)){ state.guesses=(o.guesses||[]).filter(byName).slice(0,MAX-1); state.hints=o.hints||0; }}}catch(e){} }
function clearProgress(){ try{localStorage.removeItem(progKey());}catch(e){} }
function useHint(){ if(state.done||!TARGET||(state.hints||0)>=HINTS)return; state.hints=(state.hints||0)+1; saveProgress(); render(); }

// ── pools ──
async function loadYearPool(){
  var pl=await fetch(SB+'/rest/v1/players?select=id,name,team,position,class_year,yr,height,tdc_grade,espn_id&tdc_grade=gte.70&gp=gte.15&order=name.asc,id.asc',{headers:H}).then(r=>r.json()).catch(function(){return[];});
  var seen={},out=[]; (Array.isArray(pl)?pl:[]).forEach(function(p){ if(p&&p.name&&!seen[p.name]){seen[p.name]=1;out.push(p);} });
  // Grade = the site's canonical PROJECTED OVR (gradeSolo, box-only + 99 ceiling).
  if(window.TDCProjGrade&&TDCProjGrade.ready){ try{ await TDCProjGrade.ready; }catch(e){} }
  if(window.TDCProjGrade&&TDCProjGrade.gradeSolo) out.forEach(function(p){ try{ var g=TDCProjGrade.gradeSolo(p); if(g!=null&&!isNaN(g)) p.tdc_grade=Math.round(g); }catch(e){} });
  return out;
}
async function loadAllPool(){
  const base=SB+'/rest/v1/player_history?select=name,team,season_year,position,yr,height,tdc_grade,espn_id,ppg,rpg,apg,mpg,stl,blk,tovs,oreb,dreb,tpa,fga,fta,fg_pct,tp_pct&tdc_grade=gte.75&gp=gte.18&mpg=gte.20&order=name.asc,season_year.asc,team.asc';
  const cr=await fetch(base+'&limit=1',{headers:Object.assign({},H,{'Prefer':'count=exact','Range':'0-0','Range-Unit':'items'})});
  const total=parseInt((cr.headers.get('content-range')||'/0').split('/')[1]||0)||5000;
  const PG=1000, pages=Math.ceil(total/PG), jobs=[];
  for(let i=0;i<pages;i++) jobs.push(fetch(base,{headers:Object.assign({},H,{'Range-Unit':'items','Range':(i*PG)+'-'+(i*PG+PG-1)})}).then(r=>r.ok?r.json():[]));
  const parts=await Promise.all(jobs);
  var all=TDCTeamName.fix(parts.reduce(function(a,b){return a.concat(b);},[]));
  // Box-adjust each season's grade FIRST (per-season centered, weak-team dampened) so the
  // peak-season pick + the compare/reveal all use the canonical grade.
  if(window.TDCRating&&TDCRating.ready){ try{ await TDCRating.ready; }catch(e){} }
  try{ if(window.TDCProjGrade&&TDCProjGrade.loadHist) await TDCProjGrade.loadHist(); }catch(e){}
    all.forEach(function(p){ try{
    var so=(function(p){ try{ if(window.TDCProjGrade&&TDCProjGrade.statOvr){ var so=TDCProjGrade.statOvr(p); if(so!=null&&isFinite(so)) return Math.round(so); } }catch(e){} return null; })(p); if(so!=null){ p.tdc_grade=so; return; }   // that season's statistical overall first
    if(window.TDCRating&&TDCRating.boxAdjust){ var a=TDCRating.boxAdjust(p.tdc_grade,{position:p.position,height:p.height},p,parseInt(p.season_year)||0);
    if(a&&a.grade!=null) p.tdc_grade=Math.round(a.grade); } }catch(e){} });
  // one row per player = their peak (highest-grade) season
  var best={};
  all.forEach(function(p){ if(!p||!p.name)return; var g=grNum(p.tdc_grade)||0; if(!best[p.name]||g>best[p.name]._g){ p._g=g; best[p.name]=p; } });
  return Object.keys(best).map(function(k){return best[k];});
}
async function ensurePool(){
  if(scope==='year'){
    if(!GUESS_YEAR) GUESS_YEAR=await loadYearPool();
  } else {
    if(!GUESS_ALL){ document.getElementById('content').innerHTML='<div class="loading">Loading 20 years of players…</div>'; GUESS_ALL=await loadAllPool(); }
  }
}

// ── target + flow ──
function byNameCmp(a,b){ return (a.name<b.name)?-1:(a.name>b.name)?1:0; }
function pickTarget(){
  var pool=currentPool(); if(!pool||!pool.length){TARGET=null;return;}
  if(mode==='daily'){
    // same player for everyone today: a stable (name-sorted) pool + the shared daily seed
    TARGET=T.pick(GID, pool.slice().sort(byNameCmp), 1)[0];
  } else { TARGET=pool[Math.floor(Math.random()*pool.length)]; }
}
function startPuzzle(){
  state={guesses:[],done:false,won:false,hints:0,shareText:null};
  pickTarget();
  if(mode==='daily'&&TARGET){
    var dr=T.dailyResult(GID);
    if(dr){   // today's daily is already played: show the finished board, never a new attempt
      var d=dr.detail||{}; if(d.answer){ var a=byName(d.answer); if(a) TARGET=a; }
      state={guesses:(d.guesses||[]).filter(byName), done:true, won:!!dr.win, hints:d.hints||0, shareText:dr.share||null};
    } else loadProgress();
  }
  render();
}
function nextGame(){ if(mode!=='practice')return; pickTarget(); state={guesses:[],done:false,won:false,hints:0,shareText:null}; render(); }
// picking another era/difficulty while in the daily leaves it for a free-play game at that setting
async function setScope(s){ if(s===scope)return; if(mode==='daily'){ mode='practice'; pDiff=difficulty; } scope=pScope=s; await ensurePool(); startPuzzle(); }
async function setMode(m){
  if(m===mode)return;
  if(m==='daily'){ pScope=scope; pDiff=difficulty; scope=DAILY_SCOPE; difficulty=DAILY_DIFF; }
  else { scope=pScope; difficulty=pDiff; }
  mode=m; await ensurePool(); startPuzzle();
}
function setDifficulty(d){ if(d===difficulty||!DIFFS[d])return; if(mode==='daily'){ mode='practice'; pScope=scope; } difficulty=pDiff=d; startPuzzle(); }

// ── init ──
async function init(){
  try{
    var tm=await fetch(SB+'/rest/v1/teams?select=name,conf&order=name.asc',{headers:H}).then(r=>r.json()).catch(function(){return[];});
    (Array.isArray(tm)?tm:[]).forEach(function(t){CONF[t.name]=t.conf||'—';});
    await ensurePool();
    if(!currentPool()||!currentPool().length){document.getElementById('content').innerHTML='<div class="loading">Could not load the player pool.</div>';return;}
    startPuzzle();
  }catch(e){ document.getElementById('content').innerHTML='<div class="loading">Error: '+e.message+'</div>'; }
}
document.addEventListener('click',function(e){var d=document.getElementById('gd');if(d&&!e.target.closest('.g-search'))d.classList.remove('on');});
init();
</script>
