<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recent Additions — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#fff;--bg2:#f5f5f5;--border:#e0e0e0;--border2:#ccc;--text:#111;--text2:#444;--text3:#888;--accent:#8B6914;--green:#1a8c3a;--blue:#1a5fbf;--amber:#a06000;--red:#cc2200;}
    [data-theme="dark"]{--bg:#111;--bg2:#181818;--border:#2a2a2a;--border2:#333;--text:#e8e8e8;--text2:#a0a0a0;--text3:#606060;--accent:#c8a96e;}
    [data-theme="dark"] .nav-signin{background:var(--text)!important;color:var(--bg)!important;}
    [data-theme="dark"] .filter-select,[data-theme="dark"] .filter-input{background:var(--bg2);color:var(--text);}
    [data-theme="dark"] .gAp,[data-theme="dark"] .gA,[data-theme="dark"] .gAm{color:#5ab875;}
    [data-theme="dark"] .gBp,[data-theme="dark"] .gB,[data-theme="dark"] .gBm{color:#74aedd;}
    [data-theme="dark"] .gCp,[data-theme="dark"] .gC,[data-theme="dark"] .gCm{color:#dbb560;}
    [data-theme="dark"] .gDp,[data-theme="dark"] .gD,[data-theme="dark"] .gDm,[data-theme="dark"] .gF{color:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .nav-wrap{border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;min-width:0;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;white-space:nowrap;}
    .nav-logo span{color:var(--accent);}
    .nav-actions{display:flex;align-items:center;gap:16px;}
    .nav-signin{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--text);padding:6px 16px;text-decoration:none;}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a:hover,.nav-sub a.active{color:var(--text);border-bottom-color:var(--accent);}
    .page-header{padding:40px 40px 28px;border-bottom:1px solid var(--border);}
    .page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
    .page-eyebrow::before{content:'';width:20px;height:1px;background:var(--accent);}
    .page-h1{font-family:'Playfair Display',serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em;margin-bottom:10px;}
    .page-meta{font-size:13px;color:var(--text3);}
    .filter-bar{padding:14px 40px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .filter-select{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--border2);color:var(--text2);padding:6px 10px;outline:none;cursor:pointer;}
    .filter-select:focus{border-color:var(--accent);}
    .filter-input{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:6px 10px;outline:none;width:180px;}
    .filter-input:focus{border-color:var(--accent);}
    .filter-input::placeholder{color:var(--text3);}
    .filter-count{margin-left:auto;font-size:12px;font-weight:600;color:var(--text3);}
    .filter-count strong{color:var(--accent);}
    .clear-btn{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px 8px;}
    .clear-btn:hover{color:var(--text);}

    /* DATE GROUP HEADER */
    .date-group{margin:0;}
    .date-header-row{display:flex;align-items:center;gap:14px;padding:12px 40px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:124px;z-index:10;}
    .date-label{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;color:var(--text);}
    .date-pill{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;background:rgba(139,105,20,.1);color:var(--accent);}

    /* TABLE */
    .table-wrap{padding:0 40px 60px;overflow-x:auto;}
    .player-table{width:100%;border-collapse:collapse;min-width:900px;}
    .player-table th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 12px;border-bottom:2px solid var(--border2);text-align:left;white-space:nowrap;cursor:pointer;user-select:none;}
    .player-table th:hover{color:var(--text);}
    .player-table th.sorted{color:var(--accent);}
    .player-table th.right,.player-table td.right{text-align:right;}
    .player-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);white-space:nowrap;}
    .player-table tr:hover td{background:var(--bg2);}
    .td-name{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--text);}
    .td-pos{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
    .td-move{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
    .td-from{color:var(--text3);}
    .td-arr{color:var(--accent);font-size:15px;}
    .td-to{color:var(--text);font-weight:700;}
    .td-stat{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;text-align:right;background:var(--bg2);padding:2px 6px;border-radius:2px;}
    .td-grade{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;text-align:right;}
    .gAp{color:var(--green);}.gA{color:var(--green);}.gAm{color:#2ea84f;}
    .gBp{color:var(--blue);}.gB{color:var(--blue);}.gBm{color:#2e74d4;}
    .gCp{color:var(--amber);}.gC{color:var(--amber);}.gCm{color:#b87000;}
    .gDp{color:var(--red);}.gD{color:var(--red);}.gDm{color:#dd3300;}.gF{color:#aa0000;}

    .loading-state{text-align:center;padding:80px 40px;color:var(--text3);}
    .loading-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .empty-state{text-align:center;padding:60px 40px;color:var(--text3);font-size:14px;}
    footer{border-top:1px solid var(--border);padding:28px 40px;display:flex;align-items:center;justify-content:space-between;}
    .footer-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--text3);}
    .footer-logo span{color:var(--accent);}
    @media(max-width:768px){
      .nav-top{padding:0 16px;}.nav-sub{padding:0 16px;}
      .page-header{padding:28px 16px 20px;}.page-h1{font-size:28px;}
      .filter-bar{padding:10px 16px;}.filter-input{width:140px;}
      .table-wrap{padding:0 0 60px;}
      .date-header-row{padding:10px 16px;top:110px;}
    }
  </style>
</head>
<body>

<script>
// Premium gate
(function(){
  const s=JSON.parse(localStorage.getItem('tdc_session')||'null');
  if(!s?.access_token){location.href='pricing.html?gate=1';return;}
  fetch('https://izlqhnxowdhtdofkwrho.supabase.co/rest/v1/profiles?id=eq.'+s.user?.id+'&select=plan',{
    headers:{'apikey':'sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye','Authorization':'Bearer '+s.access_token}
  }).then(r=>r.json()).then(([p])=>{if(!p||p.plan!=='premium')location.href='pricing.html?gate=1';}).catch(()=>location.href='pricing.html?gate=1');
})();
</script>

<div class="nav-wrap">
  <div class="nav-top">
    <a class="nav-logo" href="index.html">The Depth <span>Chart</span></a>
    <div class="nav-actions" id="navActions">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <a href="pricing.html" style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);text-decoration:none;">Sign In</a>
      <a href="pricing.html" class="nav-signin">Subscribe</a>
    </div>
  </div>
  <div class="nav-sub">
    <a href="index.html">Rankings</a>
    <a href="roster.html">Players</a>
    <a href="recent.html" class="active">Recent</a>
    <a href="compare-players.html">Compare</a>
    <a href="forum.html">Forum</a>
    <a href="community.html">Community</a>
    <a href="about.html">About</a>
    <a href="pricing.html">Pricing</a>
  </div>
</div>

<div class="page-header">
  <div class="page-eyebrow">Transfer Portal</div>
  <h1 class="page-h1">Recent Additions</h1>
  <div class="page-meta" id="pageMeta">Loading...</div>
</div>

<div class="filter-bar">
  <select class="filter-select" id="posFilter" onchange="applyFilters()">
    <option value="">All Positions</option>
    <option>PG</option><option>SG</option><option>CG</option><option>SF</option><option>PF</option><option>C</option>
  </select>
  <select class="filter-select" id="gradeFilter" onchange="applyFilters()">
    <option value="">All Grades</option>
    <option>A+</option><option>A</option><option>A-</option>
    <option>B+</option><option>B</option><option>B-</option>
    <option>C+</option><option>C</option><option>C-</option>
    <option>D+</option><option>D</option><option>D-</option>
  </select>
  <input class="filter-input" type="text" id="searchInput" placeholder="Search player or team..." oninput="applyFilters()"/>
  <button class="clear-btn" onclick="clearFilters()">Clear</button>
  <span class="filter-count" id="countEl"></span>
</div>

<div id="tableContainer">
  <div class="loading-state"><div class="loading-spinner"></div>Loading additions...</div>
</div>

<footer>
  <div class="footer-logo">The Depth <span>Chart</span></div>
  <div style="font-size:11px;font-weight:600;color:var(--text3);">College Basketball · 2025–26</div>
</footer>

<script>
const SB  = 'https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY = 'sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H   = {'apikey':KEY,'Authorization':`Bearer ${KEY}`};

let all = [];
let sortCol = 'date', sortDir = -1;

const gc = g => ({'A+':'gAp','A':'gA','A-':'gAm','B+':'gBp','B':'gB','B-':'gBm','C+':'gCp','C':'gC','C-':'gCm','D+':'gDp','D':'gD','D-':'gDm','F':'gF'}[g]||'');
const fmt = v => { const n=parseFloat(v); return isNaN(n)?'—':n.toFixed(1); };

async function load(){
  try {
    const r = await fetch(`${SB}/rest/v1/recent_additions?select=*&order=id.desc`, {headers:H});
    all = await r.json();
    document.getElementById('pageMeta').textContent = `${all.length} players · Updated daily`;
    applyFilters();
  } catch(e){
    document.getElementById('tableContainer').innerHTML = '<div class="empty-state">Could not load additions.</div>';
  }
}

function applyFilters(){
  const pos    = document.getElementById('posFilter').value;
  const grade  = document.getElementById('gradeFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  const filtered = all.filter(p => {
    if(pos   && p.position !== pos) return false;
    if(grade && p.tdc_grade !== grade) return false;
    if(search && !p.name?.toLowerCase().includes(search) &&
       !p.from_team?.toLowerCase().includes(search) &&
       !p.to_team?.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('countEl').innerHTML = `<strong>${filtered.length}</strong> of ${all.length} players`;
  renderTable(filtered);
}

function renderTable(players){
  if(!players.length){
    document.getElementById('tableContainer').innerHTML = '<div class="empty-state">No players match your filters.</div>';
    return;
  }

  // Group by date — preserve order (newest first since order=id.desc)
  const byDate = {}, dateOrder = [];
  players.forEach(p => {
    const d = p.added_date || 'Undated';
    if(!byDate[d]){ byDate[d]=[]; dateOrder.push(d); }
    byDate[d].push(p);
  });

  const html = dateOrder.map(date => `
    <div class="date-group">
      <div class="date-header-row">
        <span class="date-label">${date}</span>
        <span class="date-pill">${byDate[date].length} Player${byDate[date].length!==1?'s':''}</span>
      </div>
      <div class="table-wrap">
        <table class="player-table">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Player</th>
              <th>From → To</th>
              <th>Ht</th>
              <th>Yr</th>
              <th class="right">PPG</th>
              <th class="right">RPG</th>
              <th class="right">APG</th>
              <th class="right">MPG</th>
              <th class="right">BPM</th>
              <th class="right">Gr</th>
            </tr>
          </thead>
          <tbody>
            ${byDate[date].map(p => `<tr>
              <td><span class="td-pos">${p.position||'—'}</span></td>
              <td><div class="td-name">${p.name||'—'}</div></td>
              <td>
                <div class="td-move">
                  <span class="td-from">${p.from_team||'—'}</span>
                  <span class="td-arr">➜</span>
                  <span class="td-to">${p.to_team||'—'}</span>
                </div>
              </td>
              <td>${p.height||'—'}</td>
              <td>${p.class_year||'—'}</td>
              <td class="td-stat right">${fmt(p.ppg)}</td>
              <td class="td-stat right">${fmt(p.rpg)}</td>
              <td class="td-stat right">${fmt(p.apg)}</td>
              <td class="td-stat right">${fmt(p.mpg)}</td>
              <td class="td-stat right">${fmt(p.bpm)}</td>
              <td class="td-grade ${gc(p.tdc_grade||'')} right">${p.tdc_grade||'—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`).join('');

  document.getElementById('tableContainer').innerHTML = html;
}

function clearFilters(){
  document.getElementById('posFilter').value = '';
  document.getElementById('gradeFilter').value = '';
  document.getElementById('searchInput').value = '';
  applyFilters();
}

function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  const n=d?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('tdc_theme',n);
  document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';
}
(function(){
  const s=localStorage.getItem('tdc_theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  window.addEventListener('DOMContentLoaded',()=>{
    const b=document.getElementById('themeBtn');
    if(b) b.textContent=s==='dark'?'☀️':'🌙';
  });
})();

// Auth nav
(function(){
  const s=JSON.parse(localStorage.getItem('tdc_session')||'null');
  if(!s?.access_token||!s?.user?.id) return;
  fetch(`${SB}/rest/v1/profiles?id=eq.${s.user.id}&select=username,avatar_url,verified`,
    {headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}})
  .then(r=>r.json()).then(([p])=>{
    if(!p) return;
    const u=p.username||s.user?.email?.split('@')[0]||'User';
    const av=p.avatar_url?`<img src="${p.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);">`:`<div style="width:32px;height:32px;border-radius:50%;background:var(--bg2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);">${u[0].toUpperCase()}</div>`;
    const vb=p.verified?`<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--accent);border-radius:50%;margin-left:3px;"><svg viewBox="0 0 24 24" style="width:9px;height:9px;fill:#fff;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>`:'';
    const el=document.getElementById('navActions');
    if(el) el.innerHTML=`<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">${localStorage.getItem('tdc_theme')==='dark'?'☀️':'🌙'}</button><a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;">${av}<span style="display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--text);">${u}${vb}</span></a>`;
  }).catch(()=>{});
})();

load();
</script>
</body>
</html>
