<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="tdc-a11y.css?v=1">
  <script src="tdc-a11y.js?v=1" defer></script>
  <meta name="description" content="Your Program HQ — pick your college basketball program and get a personalized command center: themed home, roster, projections, and one-click into every scouting tool.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Depth Chart">
  <meta property="og:title" content="Program HQ — The Depth Chart">
  <meta property="og:description" content="Pick your program. Your colors, your roster, your command center — one launchpad into every tool.">
  <meta property="og:url" content="https://www.thedepthchartcbb.com/program-hq.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Program HQ — The Depth Chart">
  <meta charset="UTF-8"/>
  <script src="tdc-theme.js?v=2"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Program HQ — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="team-colors.js?v=2"></script>
  <script src="tdc-ratings.js?v=7"></script>
  <script src="tdc-teamlink.js?v=2"></script>
  <script src="tdc-teamgrades.js?v=1"></script>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--red:#cc2200;--tc:#A8843C;--tc-rgb:168,132,60;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#5ab875;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    .wrap{max-width:1160px;margin:0 auto;padding:0 22px 80px;}
    a{color:inherit;text-decoration:none;}

    /* ── team picker (no team chosen yet) ── */
    .pick-hero{max-width:640px;margin:60px auto 0;text-align:center;padding:0 20px;}
    .pick-k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
    .pick-hero h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(32px,5vw,50px);line-height:1.04;letter-spacing:-.02em;margin-bottom:12px;}
    .pick-hero p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:26px;}
    .pick-box{position:relative;text-align:left;}
    .pick-box input{width:100%;padding:15px 18px;border:1px solid var(--border2);border-radius:13px;background:var(--bg2);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s;}
    .pick-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);}
    .pick-list{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;max-height:340px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border2);border-radius:13px;box-shadow:0 18px 50px rgba(0,0,0,.24);}
    .pick-opt{display:flex;align-items:center;gap:11px;padding:11px 15px;cursor:pointer;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);}
    .pick-opt:last-child{border-bottom:0;}
    .pick-opt:hover,.pick-opt.sel{background:var(--bg3);}
    .pick-opt img{width:26px;height:26px;object-fit:contain;flex-shrink:0;}
    .pick-opt .pr{margin-left:auto;color:var(--text3);font-variant-numeric:tabular-nums;font-size:12px;}

    /* ── HQ (team chosen) ── */
    #hq{display:none;}
    .hero{position:relative;overflow:hidden;border-radius:0 0 22px 22px;padding:34px 40px 30px;
      background:linear-gradient(150deg,rgba(var(--tc-rgb),.30) 0%,rgba(var(--tc-rgb),.12) 42%,transparent 100%);border-bottom:1px solid var(--border);}
    [data-theme="dark"] .hero{background:linear-gradient(150deg,rgba(var(--tc-rgb),.40) 0%,rgba(var(--tc-rgb),.16) 42%,transparent 100%);}
    .hero-orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;background:radial-gradient(circle at center,rgba(var(--tc-rgb),.22),transparent 66%);width:460px;height:460px;top:-200px;right:-120px;}
    .hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
    .hero-badge{width:82px;height:82px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:11px;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.12);}
    .hero-badge img{width:100%;height:100%;object-fit:contain;}
    .hero-id{flex:1;min-width:230px;}
    .hero-k{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--tc-readable,var(--accent));margin-bottom:4px;}
    .hero-id h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,4.4vw,46px);line-height:1;letter-spacing:-.01em;}
    .hero-sub{font-size:13.5px;color:var(--text2);font-weight:600;margin-top:7px;}
    .hero-sub b{color:var(--text);}
    .hero-stats{display:flex;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;flex-shrink:0;}
    .hs{background:var(--bg2);padding:14px 20px;text-align:center;min-width:86px;}
    .hs .v{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1;}
    .hs .l{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    .hero-change{background:none;border:1px solid var(--border2);color:var(--text2);font-size:11px;font-weight:700;padding:8px 13px;border-radius:9px;cursor:pointer;}
    .hero-change:hover{border-color:var(--tc,var(--accent));color:var(--text);}

    .sec{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:32px 0 13px;display:flex;align-items:center;gap:10px;}
    .sec .h{font-weight:600;letter-spacing:0;text-transform:none;color:var(--text3);}
    /* launchpad */
    .launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;}
    .tool{display:flex;align-items:center;gap:13px;padding:15px 16px;border:1px solid var(--border);border-radius:14px;background:var(--bg2);transition:border-color .15s,transform .12s,background .15s;}
    .tool:hover{border-color:var(--tc,var(--accent));transform:translateY(-2px);}
    .tool .ic{font-size:19px;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc,var(--accent)) 13%,var(--bg3));flex-shrink:0;}
    .tool .tn{font-size:14px;font-weight:800;display:block;}
    .tool .td{font-size:11.5px;color:var(--text3);font-weight:600;margin-top:2px;display:block;line-height:1.35;}
    .tool .lk{font-size:8px;font-weight:800;letter-spacing:.06em;color:var(--text3);border:1px solid var(--border2);border-radius:6px;padding:1px 5px;margin-left:auto;flex-shrink:0;}
    .note{font-size:11.5px;color:var(--text3);line-height:1.6;margin-top:24px;max-width:760px;}
    @media(max-width:640px){.hero{padding:24px 20px 24px;}.hero-stats{width:100%;}.hs{flex:1;min-width:0;padding:12px 8px;}}
  </style>
  <link rel="stylesheet" href="tdc-anim.css?v=4"/>
  <script src="tdc-anim.js?v=5"></script>
  <link rel="stylesheet" href="tdc-dense.css?v=33"/>
  <link rel="stylesheet" href="tdc-skin.css?v=8"/>
  <style>
    :root:not([data-theme="dark"]){background:var(--bg)!important;}
    :root:not([data-theme="dark"]) .tdc-bg{background:var(--bg)!important;}
    :root:not([data-theme="dark"]) .nav-wrap{background:var(--bg)!important;}
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="tdc-pwa.js?v=2" defer></script>
</head>
<body data-anim-auto>
  <script src="tdc-nav.js?v=15"></script>

  <!-- team picker -->
  <div class="pick-hero" id="picker">
    <div class="pick-k">⬡ Program HQ</div>
    <h1>Pick your program.</h1>
    <p>Choose your team — or your favorite program — and this becomes its home base: your colors, your roster, and one-click into every tool on The Depth Chart, pre-loaded for your team.</p>
    <div class="pick-box">
      <input id="pick" type="text" placeholder="Search your program…" autocomplete="off"/>
      <div class="pick-list" id="pickList"></div>
    </div>
  </div>

  <!-- HQ -->
  <div id="hq">
    <div class="hero"><div class="hero-orb"></div>
      <div class="hero-in">
        <div class="hero-badge" id="hqBadge"></div>
        <div class="hero-id">
          <div class="hero-k">⬡ Program HQ</div>
          <h1 id="hqName">—</h1>
          <div class="hero-sub" id="hqSub"></div>
        </div>
        <div class="hero-stats" id="hqStats"></div>
        <button class="hero-change" onclick="changeTeam()">Change</button>
      </div>
    </div>
    <div class="wrap">
      <div class="sec"><span>Your command center</span><span class="h" id="hqTeamLbl"></span></div>
      <div class="launch" id="hqLaunch"></div>
      <div class="note" id="hqNote"></div>
    </div>
  </div>

<script>
// ═══ PROGRAM HQ ═══════════════════════════════════════════════════════════
var POOL=[], MY=null;
try{ MY=localStorage.getItem('tdc_coach_team')||null; }catch(e){}   // shared with the Coach's Tier command center
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtR(r){ return r==null?'—':(r>0?'+':'')+(+r).toFixed(1); }
function teamColor(row){ try{ if(window.tdcTeamColorHex){ var c=tdcTeamColorHex(row.full)||tdcTeamColorHex(row.team); if(c) return c; } }catch(e){} return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#A8843C'; }
function hexToRgb(h){ h=(h||'').replace('#',''); if(h.length===3) h=h.split('').map(function(x){return x+x;}).join(''); var n=parseInt(h,16); return isNaN(n)?'168,132,60':((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }
function logoFor(full){ try{ if(window.TDC_TEAM&&TDC_TEAM.logo) return TDC_TEAM.logo(full); }catch(e){} return null; }

var LAUNCH=[
  ['📊','team.html','Team Page','depth chart · DNA · projections'],
  ['🪞','self-scout.html','Self-Scout','identity · rotation · exposures','coach'],
  ['🔍','scout.html','Scout an Opponent','the full opponent game plan','coach'],
  ['⚔️','matchup.html','Matchup','head-to-head projected game plan','coach'],
  ['💰','moneyball.html','Moneyball','roster value in Wins Added','pro'],
  ['🧠','roles.html','Personnel Book','role & fit · how to use each man','coach'],
  ['📈','dossier.html','Player Dossier','projected line + full splits','coach'],
  ['🔁','lineups.html','Lineup Recommender','best-fit five-man units','coach'],
  ['🎯','betting.html','Betting Lab','team & player trends · edges','coach'],
  ['📅','predict.html','Projected Ratings','rating + game-by-game odds','pro'],
  ['🌱','roster-dev.html','Development','year-over-year trajectory','coach'],
  ['💵','nil.html','NIL Value','market values across the roster'],
];

// searchable picker
function renderList(q){
  q=(q||'').toLowerCase().trim();
  var el=document.getElementById('pickList');
  var m=!q?[]:POOL.filter(function(t){ return ((t.full||'')+' '+(t.team||'')).toLowerCase().indexOf(q)>=0; })
    .sort(function(a,b){ var an=(a.full||'').toLowerCase().indexOf(q), bn=(b.full||'').toLowerCase().indexOf(q); return (an-bn)||((a.rank||999)-(b.rank||999)); }).slice(0,10);
  if(!m.length){ el.style.display='none'; return; }
  el.innerHTML=m.map(function(t){ var lg=logoFor(t.full); return '<div class="pick-opt" data-full="'+esc(t.full)+'">'+(lg?'<img src="'+lg+'" alt="" onerror="this.style.display=\'none\'">':'')+'<span>'+esc(t.full)+'</span><span class="pr">#'+(t.rank||'—')+'</span></div>'; }).join('');
  el.style.display='block';
  [].forEach.call(el.querySelectorAll('.pick-opt'),function(o){ o.addEventListener('mousedown',function(e){ e.preventDefault(); setTeam(o.getAttribute('data-full')); }); });
}

function rowOf(full){ full=(full||'').toLowerCase().trim(); return POOL.filter(function(t){ return (t.full||'').toLowerCase().trim()===full || (t.team||'').toLowerCase().trim()===full; })[0]||null; }

function setTeam(full){
  MY=full; try{ localStorage.setItem('tdc_coach_team',full); }catch(e){}
  renderHQ();
}
function changeTeam(){
  MY=null; try{ localStorage.removeItem('tdc_coach_team'); }catch(e){}
  document.getElementById('hq').style.display='none';
  document.getElementById('picker').style.display='block';
  var i=document.getElementById('pick'); i.value=''; i.focus();
  window.scrollTo({top:0});
}

function renderHQ(){
  var row=rowOf(MY); if(!row){ changeTeam(); return; }
  document.getElementById('picker').style.display='none';
  document.getElementById('hq').style.display='block';
  var tc=teamColor(row), rgb=hexToRgb(tc);
  document.documentElement.style.setProperty('--tc',tc);
  document.documentElement.style.setProperty('--tc-rgb',rgb);
  // brightened readable variant for team-colored text (dark navies stay legible)
  document.documentElement.style.setProperty('--tc-readable',tc);
  var lg=logoFor(row.full);
  document.getElementById('hqBadge').innerHTML=lg?'<img src="'+lg+'" alt="" onerror="this.parentNode.textContent=\''+esc((row.full||'').slice(0,3).toUpperCase())+'\'">':esc((row.full||'').slice(0,3).toUpperCase());
  document.getElementById('hqName').textContent=row.full;
  document.getElementById('hqSub').innerHTML='<b>'+esc(row.conf||'')+'</b> · #'+(row.rank||'—')+' projected · '+fmtR(row.rating)+' power rating';
  // Overall / Power / Offense / Defense bar — same numbers as the team page (shared module)
  var statsEl=document.getElementById('hqStats');
  statsEl.innerHTML='<div class="hs"><div class="v" style="font-size:18px;color:var(--text3)">···</div><div class="l">Grades</div></div>';
  function gc(v){ return v==null?'var(--text)':(v>=80?'var(--green)':v>=64?'var(--text)':v>=50?'#c99a3a':'var(--red)'); }
  function box(lbl,v){ return '<div class="hs"><div class="v" style="color:'+gc(v)+'">'+(v==null?'—':v)+'</div><div class="l">'+lbl+'</div></div>'; }
  if(window.TDCTeamGrades){
    TDCTeamGrades.compute(row).then(function(g){
      if(!g){ statsEl.innerHTML=box('Rank','#'+(row.rank||'—')); return; }
      statsEl.innerHTML=box('Overall',g.overall)+box('Power',g.power)+box('Offense',g.offense)+box('Defense',g.defense);
    }).catch(function(){ statsEl.innerHTML='<div class="hs"><div class="v">#'+(row.rank||'—')+'</div><div class="l">Proj Rank</div></div>'; });
  } else { statsEl.innerHTML='<div class="hs"><div class="v">#'+(row.rank||'—')+'</div><div class="l">Proj Rank</div></div>'; }
  document.getElementById('hqTeamLbl').textContent='— every tool, loaded for '+row.full;
  var q=encodeURIComponent(row.full);
  document.getElementById('hqLaunch').innerHTML=LAUNCH.map(function(t){
    return '<a class="tool" href="'+t[1]+'?team='+q+'"><span class="ic">'+t[0]+'</span><span style="min-width:0"><span class="tn">'+esc(t[2])+'</span><span class="td">'+t[3]+'</span></span>'+(t[4]?'<span class="lk">'+t[4].toUpperCase()+'</span>':'')+'</a>';
  }).join('');
  document.getElementById('hqNote').innerHTML='Locked tools open with a preview and an upgrade prompt if you’re not subscribed. Your program is remembered on this device and shared with the Coach’s Tier command center. <b>Coming soon:</b> live conference standings and your next game.';
  if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(document.getElementById('hq'));
  window.scrollTo({top:0});
}

// boot
(function(){
  var i=document.getElementById('pick');
  i.addEventListener('input',function(){ renderList(i.value); });
  i.addEventListener('blur',function(){ setTimeout(function(){ document.getElementById('pickList').style.display='none'; },160); });
  Promise.all([TDC_RATINGS.get(), (window.TDC_TEAM&&TDC_TEAM.ready)||Promise.resolve()]).then(function(r){
    var D=r[0];
    POOL=(D.teams||[]).filter(function(t){ return t.projected!==false && t.rating!=null; }).sort(function(a,b){ return (a.rank||999)-(b.rank||999); });
    // support ?team= deep link
    var qp=new URLSearchParams(location.search).get('team');
    if(qp){ var r=rowOf(qp); if(r){ MY=r.full; } }
    if(MY && rowOf(MY)) renderHQ(); else i.focus();
  }).catch(function(){ i.placeholder='Could not load teams — reload.'; });
})();
</script>
</body>
</html>
