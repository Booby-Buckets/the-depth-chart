<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.thedepthchartcbb.com/team.html">
  <title>Your team — The Depth Chart</title>
  <!-- Program HQ moved into the team page (Nov 2026): its Today view is the Overview tab. Old links land there. -->
  <script>
  (function(){
    var p=new URLSearchParams(location.search), t=p.get('team'), s=p.get('season'), v=p.get('view');
    if(!t){ try{ t=localStorage.getItem('tdc_coach_team'); }catch(e){} }
    if(!t) return;
    location.replace('team.html?team='+encodeURIComponent(t)+(s?'&season='+encodeURIComponent(s):'')+(v==='schedule'?'&tab=schedule':''));
  })();
  </script>
  <script src="tdc-theme.js?v=5"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="tdc-ratings.js?v=44"></script>
  <style>
    :root{--bg:#fff;--bg2:#f6f7f9;--text:#14171c;--text3:#6a7280;--border:#dfe3e8;}
    [data-theme="dark"]{--bg:#0e1116;--bg2:#171b22;--text:#eef1f5;--text3:#8d96a3;--border:#2a303a;}
    body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif;}
    main{max-width:560px;margin:0 auto;padding:40px 16px;}
    h1{font:800 28px "Playfair Display",Georgia,serif;margin:0 0 6px;}
    p{color:var(--text3);margin:0 0 16px;}
    input{width:100%;box-sizing:border-box;padding:12px;font:16px Inter,system-ui,sans-serif;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:8px;}
    #list a{display:block;padding:11px 4px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600;}
    #list a:hover{background:var(--bg2);}
  </style>
</head>
<body>
  <script src="tdc-nav.js?v=89"></script>
  <main>
    <h1>Pick your team</h1>
    <p>We’ll remember it and open your team page from here on.</p>
    <input id="q" type="search" placeholder="Search programs" aria-label="Search programs" autocomplete="off"/>
    <div id="list"></div>
  </main>
  <script>
  (function(){
    var all=[], list=document.getElementById('list'), q=document.getElementById('q');
    function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function draw(){
      var v=q.value.trim().toLowerCase();
      list.innerHTML=all.filter(function(t){ return !v||t.full.toLowerCase().indexOf(v)>=0; }).slice(0,v?30:400).map(function(t){
        return '<a href="team.html?team='+encodeURIComponent(t.full)+'" data-t="'+esc(t.full)+'">'+esc(t.full)+'</a>';
      }).join('');
    }
    list.addEventListener('click',function(e){ var a=e.target.closest('a'); if(a){ try{ localStorage.setItem('tdc_coach_team',a.getAttribute('data-t')); }catch(x){} } });
    q.addEventListener('input',draw);
    TDC_RATINGS.get().then(function(D){
      all=((D&&D.teams)||[]).filter(function(t){ return t.projected!==false&&t.rating!=null&&t.full; }).sort(function(a,b){ return a.full.localeCompare(b.full); });
      draw();
    });
  })();
  </script>
</body>
</html>
