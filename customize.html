  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
    .cz-page{padding:32px 0 80px;}
    .cz-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .cz-title{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin:0 0 16px;text-align:left;}
    .cz-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:18px;}
    .cz-search{width:260px;max-width:100%;font:500 13.5px 'Inter',system-ui,sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:8px;outline:none;}
    .cz-search:focus{border-color:var(--accent);}
    .cz-chips{display:inline-flex;flex-wrap:wrap;gap:6px;}
    .cz-chips .chip{font:600 11.5px 'Inter',system-ui,sans-serif;letter-spacing:.02em;background:var(--bg);border:1px solid var(--border2);color:var(--text2);padding:5px 11px;border-radius:999px;cursor:pointer;}
    .cz-chips .chip:hover{color:var(--text);border-color:var(--text3);}
    .cz-chips .chip.on{background:var(--text);color:var(--bg);border-color:var(--text);}
    .cz-count{font-size:12px;color:var(--text3);margin-left:auto;}
    .cz-table{width:100%;}
    .cz-table tbody tr{cursor:pointer;}
    .cz-table td.tm a{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;}
    .cz-table td.tm img,.cz-table td.tm i{width:22px;height:22px;object-fit:contain;flex:none;}
    .cz-table tbody tr:hover td.tm span{color:var(--accent);text-decoration:underline;}
    .cz-table td.go a{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:none;white-space:nowrap;}
    .cz-empty{padding:40px 0;color:var(--text3);font-size:13px;}
    @media(max-width:640px){ .cz-title{font-size:28px;} .cz-table .coach,.cz-table .go,.cz-table th:last-child{display:none;} .cz-count{margin-left:0;width:100%;} }
  </style>

<body data-anim-auto>
  <script src="tdc-nav.js?v=59"></script>

  <div class="page cz-page">
    <div class="cz-eyebrow">Lineup Lab</div>
    <h1 class="cz-title">Customize any team</h1>
    <div class="cz-controls">
      <input class="cz-search" id="q" placeholder="Find your team" oninput="render()" aria-label="Find a team">
      <div class="cz-chips" id="confPills"></div>
      <span class="cz-count" id="czCount"></span>
    </div>
    <div class="sheet-wrap"><table class="sheet dense cz-table">
      <thead><tr><th class="r">Rk</th><th class="l">Team</th><th class="l">Conf</th><th class="l coach">Head coach</th><th class="r"></th></tr></thead>
      <tbody id="grid"><tr><td colspan="5" class="cz-empty">Loading teams…</td></tr></tbody>
    </table></div>
  </div>

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
let TEAMS=[], conf='All';

const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logoOf(team){
  const r=window.tdcTeamColor&&tdcTeamColor(team); let u=(r&&r.logo)||'';
  const m=String(u).match(/^https?:\/\/a\.espncdn\.com(\/i\/teamlogos\/[^?#]+)/);
  if(m) u=`https://a.espncdn.com/combiner/i?img=${m[1]}&w=48&h=48`;
  return u;
}
async function load(){
  try{
    const r=await fetch(`${SB}/rest/v1/teams?select=name,conf,conference,tdc_rank,head_coach,coach&order=tdc_rank.asc.nullslast,name.asc&limit=500`,
      {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    TEAMS=(await r.json()).filter(t=>t&&t.name);
    // Rank = the live projected ratings (same source as the Rankings index and the team
    // page), not teams.tdc_rank, which is the sheet's hand-typed rank and goes stale.
    try{
      const D=window.TDC_RATINGS&&await TDC_RATINGS.get(), by={};
      ((D&&D.teams)||[]).forEach(x=>{ [x.team,x.full].forEach(n=>{ if(n) by[String(n).toLowerCase()]=x; }); });
      TEAMS.forEach(t=>{ const x=by[t.name.toLowerCase()]; t._rk=x&&x.rank?+x.rank:null; });
      TEAMS.sort((a,b)=>(a._rk||9999)-(b._rk||9999)||a.name.localeCompare(b.name));
    }catch(e){ TEAMS.forEach(t=>{ t._rk=null; }); }
    const confs=['All',...[...new Set(TEAMS.map(t=>t.conf||t.conference).filter(Boolean))].sort()];
    document.getElementById('confPills').innerHTML=confs.map(c=>
      `<button type="button" class="chip ${c===conf?'on':''}" data-conf="${esc(c)}">${esc(c)}</button>`).join('');
    document.getElementById('confPills').onclick=e=>{ const b=e.target.closest('[data-conf]'); if(b) setConf(b.dataset.conf); };
    render();
  }catch(e){
    document.getElementById('grid').innerHTML='<tr><td colspan="5" class="cz-empty">Could not load teams.</td></tr>';
  }
}
function setConf(c){ conf=c;
  document.querySelectorAll('#confPills .chip').forEach(b=>b.classList.toggle('on',b.dataset.conf===c));
  render();
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const rows=TEAMS.filter(t=>
    (conf==='All'||(t.conf||t.conference)===conf) &&
    (!q||t.name.toLowerCase().includes(q)));
  document.getElementById('czCount').textContent=rows.length+' team'+(rows.length===1?'':'s');
  document.getElementById('grid').innerHTML=rows.map(t=>{
    const href=`team.html?team=${encodeURIComponent(t.name)}&tab=customize`, lg=logoOf(t.name);
    return `<tr data-href="${href}">
      <td class="r">${t._rk||'—'}</td>
      <td class="l tm"><a href="${href}">${lg?`<img src="${lg}" alt="" loading="lazy" onerror="this.remove()">`:'<i></i>'}<span>${esc(t.name)}</span></a></td>
      <td class="l">${esc(t.conf||t.conference||'')}</td>
      <td class="l coach">${esc(t.coach||t.head_coach||'')}</td>
      <td class="r go"><a href="${href}" tabindex="-1">Open lineup lab →</a></td>
    </tr>`;}).join('')||'<tr><td colspan="5" class="cz-empty">No teams match.</td></tr>';
}
document.getElementById('grid').addEventListener('click',e=>{ if(e.target.closest('a')) return; const tr=e.target.closest('tr[data-href]'); if(tr) location.href=tr.dataset.href; });
load();
</script>
  <script src="tdc-version.js?v=2"></script>
  <script src="tdc-tour.js?v=22"></script>
</body>
