<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon — The Depth Chart</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <script src="auth.js?v=sales2"></script>
  <script src="tdc-theme.js?v=5"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--border:#DEDACF;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--border:#232B3E;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:80px 20px;text-align:center;}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
    h1{font-family:'Playfair Display',Georgia,serif;font-size:40px;font-weight:800;line-height:1.1;margin-bottom:14px;}
    p{font-size:15px;line-height:1.6;color:var(--text2);margin-bottom:26px;}
    .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .links a{font-weight:700;font-size:14px;padding:10px 18px;border-radius:24px;border:1px solid var(--border);color:var(--text);text-decoration:none;background:var(--bg2);}
    .links a.pri{background:var(--accent);border-color:var(--accent);color:#1a1206;}
  </style>
</head>
<body>
<script src="tdc-nav.js?v=81"></script>
<div class="wrap">
  <div class="eyebrow" id="csKick">Coming soon</div>
  <h1 id="csH">We're still building this one.</h1>
  <p id="csP">This part of The Depth Chart isn't open to the public yet. Check back soon — in the meantime, the rankings, team pages and games are all open.</p>
  <div class="links"><a class="pri" href="index.html">Power rankings</a><a href="games.html">Games</a><a href="explore.html">Explore all tools</a></div>
</div>
<script>
  (function(){
    var f=new URLSearchParams(location.search).get('f'), N={dynasty:'Dynasty',fantasy:'Fantasy'}[f];
    if(N){ document.getElementById('csKick').textContent=N+' · coming soon'; document.getElementById('csH').textContent=N+' is coming soon.';
      document.title=N+' — Coming Soon — The Depth Chart'; }
  })();
</script>
</body>
</html>
