<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="tdc-a11y.css?v=1">
  <script src="tdc-a11y.js?v=2" defer></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Games — The Depth Chart</title>
  <meta name="description" content="Daily college basketball guessing games built on The Depth Chart's player database: Guess the Player, Higher or Lower, Hoop Grid and more.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Depth Chart">
  <meta property="og:title" content="Games — The Depth Chart">
  <meta property="og:description" content="Daily college basketball guessing games: Guess the Player, Higher or Lower, Hoop Grid and more.">
  <meta property="og:url" content="https://www.thedepthchartcbb.com/games.html">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <script src="auth.js?v=shotlock1"></script>
  <script src="tdc-theme.js?v=5"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#2e8b57;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--green:#6fbf7e;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .gh-list{border-top:2px solid var(--border2);}
    .gh-row{display:grid;grid-template-columns:minmax(0,1fr) 170px 110px;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--border);
      text-decoration:none;color:inherit;}
    .gh-row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent);}
    .gh-name{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:20px;color:var(--text);margin-bottom:3px;}
    .gh-desc{font-size:13px;color:var(--text2);line-height:1.5;}
    .gh-daily{font-size:12.5px;font-weight:700;color:var(--text);}
    .gh-daily.todo{color:var(--accent);}
    .gh-daily.done{color:var(--green);}
    .gh-daily span{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:2px;}
    .gh-streak{text-align:right;}
    .gh-streak b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
    .gh-streak span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .gh-sum{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 18px;font-size:13px;color:var(--text2);}
    .gh-sum b{color:var(--text);font-size:15px;}
    @media(max-width:640px){ .gh-row{grid-template-columns:minmax(0,1fr) 92px;} .gh-streak{display:none;} .gh-name{font-size:18px;} }
  </style>
  <link rel="stylesheet" href="tdc-skin.css?v=14"/>
  <link rel="stylesheet" href="tdc-hq-list.css?v=4"/>
  <link rel="stylesheet" href="tdc-games.css?v=1"/>
  <link rel="stylesheet" href="tdc-column.css?v=2"/>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0E18" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="tdc-pwa.js?v=2" defer></script>
</head>
<body>
<script src="tdc-nav.js?v=33"></script>
<div class="page gm-page">
  <div class="gm-eyebrow" id="ghEyebrow">Games · Daily</div>
  <h1 class="gm-title">Games</h1>
  <div class="gh-sum" id="ghSum"></div>
  <div class="gh-list" id="ghList"></div>
</div>
<script src="tdc-games.js?v=1"></script>
<script>
(function(){
  const G=[
    ['guess','Guess the Player','A mystery player. Each guess tells you how close you are on school, conference, class, position, height and grade.'],
    ['higher','Higher or Lower','Two player-seasons from 20 years of college hoops. Pick who ranks higher on the stat and keep the streak alive.'],
    ['grid','Hoop Grid','A 3 by 3 grid of teams, conferences and accolades. Find a player for every square; deeper cuts score higher.'],
    ['statline','Stat Line Guess','An anonymous season stat line. Name the player; every miss unlocks a clue.'],
    ['career','Career Path','A career revealed season by season with the name hidden: schools, class and scoring.'],
    ['rank',"Rank 'Em",'Four players and one stat. Put them in order from highest to lowest.'],
    ['grade','Grade Guess','See a player and guess the overall grade our model gave him. Score by how close you land.'],
    ['college','Guess the College','Shown a player, name his college in one guess and build a streak.'],
  ];
  const T=window.TDCGames, esc=T.esc;
  // today's result in each game's own terms
  const OUT={college:10,statline:30,career:30,rank:25,grade:500,grid:9};
  function scoreText(id,r){
    if(id==='guess') return r.win&&r.score!=null?('Solved in '+r.score):'Not solved';
    if(id==='higher') return 'Streak '+(r.score||0);
    if(r.score!=null&&OUT[id]) return r.score+' / '+OUT[id];
    return r.win?'Solved':'Played';
  }
  let doneN=0, best=0;
  document.getElementById('ghEyebrow').textContent='Games · Daily #'+T.dayNumber();
  document.getElementById('ghList').innerHTML=G.map(([id,name,desc])=>{
    const r=T.dailyResult(id), g=T.stats(id), ds=T.liveDailyStreak(g);
    if(r) doneN++; best=Math.max(best,ds);
    const status=r
      ? `<div class="gh-daily done">Today's done<span>${esc(scoreText(id,r))}</span></div>`
      : `<div class="gh-daily todo">Play today's #${T.dayNumber()}<span>${g.played?(g.played+' played'):'New'}</span></div>`;
    return `<a class="gh-row" href="${T.PAGES[id]}"><div><div class="gh-name">${esc(name)}</div><div class="gh-desc">${esc(desc)}</div></div>${status}<div class="gh-streak"><b>${ds}</b><span>Daily streak</span></div></a>`;
  }).join('');
  document.getElementById('ghSum').innerHTML=`<span><b>${doneN} of ${G.length}</b> dailies done today</span><span>Next puzzles in <b>${T.untilMidnight()}</b></span>`+(best?`<span>Best daily streak <b>${best}</b></span>`:'');
})();
</script>
<script src="tdc-version.js?v=2"></script>
<script src="tdc-tour.js?v=12"></script>
</body>
</html>
