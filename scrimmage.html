  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--gold:#C8A020;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--gold:#C8A020;--green:#5ab875;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
    .page{max-width:1240px;margin:0 auto;padding:30px 24px 80px;}
    h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:800;margin:4px 0 6px;line-height:1.15;}
    .chip{display:inline-block;padding:1px 8px;border:1px dashed var(--border2);border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .meta{font-size:13px;color:var(--text3);margin-bottom:18px;}
    .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:20px 24px;margin-bottom:14px;}
    .side{display:flex;align-items:center;gap:14px;min-width:0;}
    .side.home{justify-content:flex-end;text-align:right;}
    .side img{width:54px;height:54px;object-fit:contain;flex:0 0 auto;}
    .side a{font-size:19px;font-weight:800;color:var(--text);text-decoration:none;}
    .side a:hover{color:var(--accent);}
    .side .sub{font-size:11.5px;color:var(--text3);margin-top:2px;}
    .score{font-family:'Playfair Display',serif;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .score .l{color:var(--text3);}
    .score small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:center;margin-top:4px;}
    .read{font-size:13px;color:var(--text2);line-height:1.6;margin:0 0 6px;}
    .read b{color:var(--text);}
    .sec{display:flex;align-items:center;gap:12px;margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border2);}
    .sec img{width:24px;height:24px;object-fit:contain;}
    .sec h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;}
    .sec .hint{margin-left:auto;font-size:11.5px;color:var(--text3);}
    .dnp{font-size:12.5px;color:var(--text2);line-height:1.7;margin:10px 2px 0;}
    .dnp b{color:var(--text);}
    .dnp .none{color:var(--text3);}
    .note{font-size:11px;color:var(--text3);line-height:1.6;margin-top:22px;}
    .sheet td.l a{color:var(--text);text-decoration:none;} .sheet td.l a:hover{color:var(--accent);}
    tr.tot td{font-weight:800;border-top:2px solid var(--border2);}
    .sheet .potg-tag{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--text3);margin-left:6px;}
    .rm{display:flex;align-items:center;gap:16px;margin:16px 0 8px;}
    .rm-n{font-family:'Playfair Display',serif;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
    .rm-l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .rm-t{font-size:15px;font-weight:800;margin-top:2px;}
    .rm-bar{flex:1;max-width:340px;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;}
    .rm-bar i{display:block;height:100%;border-radius:4px;}
    .rm-why{font-size:12px;color:var(--text3);line-height:1.6;margin:0 0 8px;}
    .rm-sum{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.45;} .rm-sum b{color:var(--text);}
    .rm-tbl{width:100%!important;table-layout:fixed;} .rm-tbl th,.rm-tbl td{white-space:normal!important;line-height:1.35;vertical-align:top;} .rm-tbl th:nth-child(1){width:19%;} .rm-tbl th:nth-child(2),.rm-tbl th:nth-child(3){width:30%;} .rm-tbl th:nth-child(4){width:21%;} .rm-ref{display:none;font-size:11px;color:var(--text3);font-weight:500;margin-top:3px;} @media(max-width:640px){.rm-tbl th:nth-child(4),.rm-tbl td:nth-child(4){display:none;} .rm-ref{display:block;} .rm-tbl th:nth-child(1){width:30%;} .rm-tbl th:nth-child(2),.rm-tbl th:nth-child(3){width:35%;} .rm-tbl th,.rm-tbl td{font-size:12px!important;}} .rm-why{margin-top:8px;}
    td .mb{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--bg3);margin-left:7px;vertical-align:1px;overflow:hidden;}
    td .mb i{display:block;height:100%;background:var(--text3);}
    .ef-tbl{width:100%!important;max-width:720px;table-layout:fixed;} .ef-tbl th:first-child{width:38%;}
    .ef-tbl td.sub{font-size:10px!important;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);background:var(--bg2)!important;}
    .ef-tbl td.c3{font-weight:800;}
    @media(max-width:640px){ .ef-tbl td .dim{display:block;font-size:10.5px;} .ef-tbl th:first-child{width:34%;} .ef-tbl td,.ef-tbl th{font-size:12px!important;} }
    .sc-gf{margin:6px 0 4px!important;}
    .sp-mix{display:inline-flex;width:120px;height:8px;border-radius:4px;overflow:hidden;background:var(--bg3);vertical-align:1px;}
    .sp-mix i,.sp-key i{display:inline-block;height:100%;} .sp-key{font-weight:600;color:var(--text3);margin-left:6px;text-transform:none;letter-spacing:0;}
    .sp-key i{width:9px;height:9px;border-radius:2px;margin:0 3px 0 6px;vertical-align:-1px;}
    .sp-mix .r,.sp-key .r{background:#0f56a3;} .sp-mix .m,.sp-key .m{background:#8db6e3;} .sp-mix .t,.sp-key .t{background:#d9a33a;}
    [data-theme="dark"] .sp-mix .r,[data-theme="dark"] .sp-key .r{background:#6ea8ec;}
    .empty{padding:30px;text-align:center;color:var(--text3);border:1px dashed var(--border2);border-radius:12px;}
    @media (max-width:640px){ .board{grid-template-columns:1fr;text-align:center;} .side,.side.home{justify-content:center;text-align:center;flex-direction:column;} .score{text-align:center;} h1{font-size:26px;} }

<script>
(function(){
  const SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  const H={apikey:KEY, Authorization:'Bearer '+KEY};
  const $app=document.getElementById('app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  // "Fears Jr., Jeremy" / "Jeremy Fears Jr." / "D.J. Smith" → one key
  const nk=s=>String(s||'').toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,'').replace(/[^a-z]/g,'');
  const id=new URLSearchParams(location.search).get('id');

  function shortOf(full,byFull){ const t=byFull[full]; const s=(t&&t.team)||full.replace(/ \S+$/,''); try{ return (window.tdcShortSchool&&tdcShortSchool(s))||s; }catch(e){ return s; } }
  function logoOf(full,byFull){ const t=byFull[full]; const c=window.tdcTeamColor&&(tdcTeamColor((t&&t.team)||full)||tdcTeamColor(full)); return (c&&c.logo)||''; }
  async function roster(short){
    if(!short) return [];
    try{ const r=await fetch(`${SB}/rest/v1/players?team=eq.${encodeURIComponent(short)}&select=name,espn_id,position,yr,class_year,depth_order&order=depth_order.asc.nullslast`,{headers:H}); return r.ok?await r.json():[]; }catch(e){ return []; }
  }
  const f2=(m,a)=>(m==null||a==null)?'—':m+'-'+a;
  // Game Score + the 0-10 RTG, exactly as the game recaps (game.html gameScore/playerRating) — same colours via the sheet heat
  const N0=x=>+x||0;
  const gameScore=p=>N0(p.pts)+0.4*N0(p.fgm)-0.7*N0(p.fga)-0.4*(N0(p.fta)-N0(p.ftm))+0.7*N0(p.oreb)+0.3*N0(p.dreb)+N0(p.stl)+0.7*N0(p.ast)+0.7*N0(p.blk)-0.4*N0(p.pf)-N0(p.tov);
  const playerRating=p=>Math.max(2,Math.min(10,Math.round((5+0.135*gameScore(p))*10)/10));
  const pctV=(m,a)=>N0(a)>0?(N0(m)/N0(a)*100).toFixed(1):'';
  const v=x=>x==null?'—':x;

  function teamBlock(side, box, full, short, ros, byFull, pm, ext){
    ext=ext||{};
    const lg=logoOf(full,byFull);
    const byKey={}; ros.forEach(p=>{ byKey[nk(p.name)]=p; });
    const bk=p=>nk(p.rn||p.name);   // the box name as our roster spells it (nicknames, initials, misspellings)
    const played=(box.players||[]).filter(p=>p.min==null||p.min>0);
    const zero=(box.players||[]).filter(p=>p.min===0);
    const inBox=new Set((box.players||[]).map(bk));
    const link=p=>{ const r=byKey[bk(p)]; return r&&r.espn_id?`player.html?espn=${r.espn_id}`:(r?`player.html?name=${encodeURIComponent(r.name)}&team=${encodeURIComponent(short||'')}`:null); };
    const rows=played.slice().sort((a,b)=>(b.gs-a.gs)||((b.min||0)-(a.min||0))).map(p=>{ const r=byKey[bk(p)], L=link(p);
      const rt=p.min!=null&&p.min>0&&p.pts!=null?playerRating(p):null;
      return `<tr><td class="l nm">${L?`<a href="${L}">${esc(p.name)}</a>`:esc(p.name)}${p.gs?' <span class="dim" title="Started">*</span>':''}${ext.potg===p?'<span class="potg-tag" title="Player of the Game: highest Game Score on either team">POTG</span>':''}</td>
        <td class="l dim">${esc((r&&r.position)||'')}</td><td class="strong">${rt!=null?rt.toFixed(1):'—'}</td><td>${v(p.min)}</td><td class="strong">${v(p.pts)}</td>
        <td>${v(p.reb)}</td><td class="dim">${p.oreb!=null&&p.dreb!=null?p.oreb+'-'+p.dreb:'—'}</td><td>${v(p.ast)}</td>
        <td>${v(p.stl)}</td><td>${v(p.blk)}</td><td>${v(p.tov)}</td><td class="dim">${v(p.pf)}</td>
        <td data-v="${pctV(p.fgm,p.fga)}">${f2(p.fgm,p.fga)}</td><td data-v="${pctV(p.tpm,p.tpa)}">${f2(p.tpm,p.tpa)}</td><td data-v="${pctV(p.ftm,p.fta)}">${f2(p.ftm,p.fta)}</td>${pm?pmCell(pm[p.name]):''}<td class="dim">${p.w!=null?Math.round(100*p.w)+'%':'—'}</td></tr>`; }).join('');
    const T=box.totals;
    const tot=T?`<tr class="tot"><td class="l">Team</td><td></td><td title="Team game rating (0-10): the result vs our line, same scale as the game recaps">${ext.trtg!=null?ext.trtg.toFixed(1):''}</td><td>${played.reduce((s,p)=>s+(p.min||0),0)||'—'}</td><td>${v(T.pts)}</td><td>${v(T.reb)}</td><td></td><td>${v(T.ast)}</td><td>${v(T.stl)}</td><td>${v(T.blk)}</td><td>${v(T.tov)}</td><td></td><td>${f2(T.fgm,T.fga)}</td><td>${f2(T.tpm,T.tpa)}</td><td>${f2(T.ftm,T.fta)}</td>${pm?'<td></td>':''}<td></td></tr>`:'';
    // who didn't play: everyone on our 2026-27 roster with no minutes in the box (0-minute rows included)
    const dnp=ros.filter(p=>!inBox.has(nk(p.name))).map(p=>p.name).concat(zero.map(p=>p.rn||p.name));
    const extra=played.filter(p=>ros.length&&!byKey[bk(p)]).map(p=>p.name);
    return `<div class="sec">${lg?`<img src="${lg}" alt="">`:''}<h2>${esc(shortOf(full,byFull))}</h2><span class="hint">${played.length} played${ros.length?' · '+dnp.length+' did not play':''}</span></div>
      <div class="sheet-wrap" style="max-height:none;"><table class="sheet dense sc-box"><thead><tr><th class="l">Player</th><th class="l">Pos</th><th data-heat="1" title="0-10 game rating from the box score (Game Score): 5 ≈ an average game · 6.5 strong · 8+ great — same scale as the game recaps and player pages">RTG</th><th>MIN</th><th data-heat="1">PTS</th><th data-heat="1">REB</th><th title="Offensive-defensive rebounds">O-D</th><th data-heat="1">AST</th><th data-heat="1">STL</th><th data-heat="1">BLK</th><th data-heat="-1">TO</th><th data-heat="-1">PF</th><th data-heat="1" title="Field goals made-attempted, shaded by FG%">FG</th><th data-heat="1" title="Threes made-attempted, shaded by 3P%">3PT</th><th data-heat="1" title="Free throws made-attempted, shaded by FT%">FT</th>${pm?'<th title="Score margin while he was on the floor (rebuilt from the play-by-play)">+/−</th>':''}<th title="How much this line counts toward his 2026-27 projection, in real games (Reality Meter × his share of a normal night's minutes): 100% = one full real game">Counts (% of a game)</th></tr></thead><tbody>${rows}</tbody><tfoot>${tot}</tfoot></table></div>
      <div class="dnp"><b>Did not play:</b> ${ros.length?(dnp.length?dnp.map(esc).join(', '):'<span class="none">everyone on the roster played</span>'):`<span class="none">we don’t have ${esc(shortOf(full,byFull))}’s 2026-27 roster yet, so we can’t list who sat</span>`}</div>
      ${extra.length?`<div class="dnp"><b>Played, not on our roster:</b> ${extra.map(esc).join(', ')}</div>`:''}`;
  }

  const signed=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
  const pmShade=d=>d>=10?' c4':d>=4?' c3':d<=-10?' c0':d<=-4?' c1':'';
  const pmCell=v=>v==null?'<td class="dim">—</td>':`<td class="strong${pmShade(v)}">${signed(v)}</td>`;

  // SHOT PROFILE (play-by-play shot types; no x-y, so no zone chart): rim = layup/dunk/tip-in, mid = 2-pt jumper
  function shotProfile(SP,ok,g,byFull,box){
    if(!SP) return '';
    const pc=v=>v[1]?Math.round(100*v[0]/v[1])+'%':'—';
    const cells=x=>{ const n=x.rim[1]+x.mid[1]+x.three[1];
      const sh=k=>n?x[k][1]/n:0;
      const bar=`<span class="sp-mix" title="Rim ${Math.round(100*sh('rim'))}% · Mid ${Math.round(100*sh('mid'))}% · 3PT ${Math.round(100*sh('three'))}%"><i class="r" style="width:${100*sh('rim')}%"></i><i class="m" style="width:${100*sh('mid')}%"></i><i class="t" style="width:${100*sh('three')}%"></i></span>`;
      return `<td>${n}</td>${['rim','mid','three'].map(k=>`<td>${x[k][0]}-${x[k][1]}</td><td class="dim">${pc(x[k])}</td>`).join('')}<td class="l">${n?bar:''}</td>`; };
    const block=(s,full)=>{ const S=SP[s], B=box[s==='h'?'home':'away'];
      const order=(B.players||[]).map(p=>p.name);
      const ps=ok[s]?Object.keys(S.players).sort((a,b)=>{ const n=x=>{ const q=S.players[x]; return q.rim[1]+q.mid[1]+q.three[1]; }; return n(b)-n(a)||order.indexOf(a)-order.indexOf(b); }):[];
      return `<tr class="tot"><td class="l">${esc(shortOf(full,byFull))}</td>${cells(S.team)}</tr>`+
        ps.map(n=>`<tr><td class="l nm">${esc(TDC_SCRIMFLOW.pretty(n))}</td>${cells(S.players[n])}</tr>`).join(''); };
    const head='<tr><th class="l">Shots</th><th>FGA</th><th>Rim</th><th></th><th>Mid</th><th></th><th>3PT</th><th></th><th class="l">Mix <span class="sp-key"><i class="r"></i>rim <i class="m"></i>mid <i class="t"></i>3</span></th></tr>';
    return `<div class="sec"><h2>Shot profile</h2><span class="hint">rim = layups, dunks, tip-ins · mid = 2-pt jumpers</span></div>
      <div class="sheet-wrap" style="max-height:none;"><table class="sheet dense sp-tbl"><thead>${head}</thead><tbody>${block('a',g.away)}${block('h',g.home)}</tbody></table></div>`;
  }

  // Reality Meter (scripts/scrim_reality.py): how much each side looked like a real game, from the box
  const rmCls=v=>v>=80?'c4':v>=65?'c3':v>=50?'c2':v>=35?'c1':'c0';
  const rmCol=v=>v>=75?'var(--green)':v>=55?'#9bbf3a':v>=35?'#d9a33a':'var(--red)';
  // a real game's top-5 minute share and 5+ minute players at a given final margin (Nov 2025 D-I box scores,
  // the same table scripts/scrim_reality.py scores against)
  const TOP5=[[5,.727],[15,.707],[25,.654],[35,.623],[45,.575]];
  const expTop5=m=>{ m=Math.abs(m); if(m<=5) return TOP5[0][1]; if(m>=45) return TOP5[4][1];
    for(let i=1;i<TOP5.length;i++){ const [x1,y1]=TOP5[i-1],[x2,y2]=TOP5[i]; if(m<=x2) return y1+(y2-y1)*(m-x1)/(x2-x1); } return .65; };
  const expN5=m=>Math.round(9+Math.min(Math.abs(m),40)/40*2);
  // Reality Meter: a verdict, then one row per check: what each team's box showed, shaded by how game-like it
  // was, next to what a real game with this margin looks like. Weights are the meter's (scrim_reality.py).
  function meter(R,g,byFull,res){
    if(!R||R.score==null) return '';
    const nm=full=>esc(shortOf(full,byFull)), X=s=>R[s]||{}, P=s=>(R[s]||{}).parts||{};
    const margin=(res&&res.hs!=null&&res.as!=null)?res.hs-res.as:null, am=margin==null?null:Math.abs(margin);
    const by=v=>v==null?'—':Math.abs(v)<0.25?'even':(v>0?nm(g.home):nm(g.away))+' by '+Math.abs(v).toFixed(Number.isInteger(v)?0:1);
    const td=(sc,txt,tip)=>`<td class="l ${sc==null?'dim':rmCls(sc)}"${tip?` title="${esc(tip)}"`:''}>${txt}</td>`;
    const both=fn=>['away','home'].map(fn).join('');
    const boxless=X('home').boxless||X('away').boxless;
    const rows=[];
    if(!boxless){
      rows.push(`<tr><td class="l"><b>Full game</b><div class="rm-ref">200 (40 minutes)</div></td>${both(s=>td(P(s).format,X(s).min!=null?X(s).min+' team minutes':'—','score '+P(s).format))}<td class="l dim">200 (40 minutes)</td></tr>`);
      rows.push(`<tr><td class="l"><b>Rotation</b><div class="rm-ref">${am!=null?`Top 5 ~${Math.round(100*expTop5(am))}% · ~${expN5(am)} play 5+ at a ${am}-point margin`:'Top 5 ~70% · ~10 play 5+'}</div></td>${both(s=>td(P(s).rotation,X(s).top5!=null?`Top 5 played ${Math.round(100*X(s).top5)}% of minutes · ${X(s).n5} played 5+`:'—','score '+P(s).rotation))}<td class="l dim">${am!=null?`Top 5 ~${Math.round(100*expTop5(am))}% · ~${expN5(am)} play 5+ at a ${am}-point margin`:'Top 5 ~70% · ~10 play 5+'}</td></tr>`);
      rows.push(`<tr><td class="l"><b>Who played</b><div class="rm-ref">The projected rotation plays and starts</div></td>${both(s=>{ const x=X(s), mp=(R.miss_pts||{})[s];
        return td(P(s).availability,x.missing&&x.missing.length?'Without '+x.missing.map(esc).join(', ')+(mp>0?` <span class="dim">(~${mp.toFixed(1)} pts a game)</span>`:''):'Projected rotation played','score '+P(s).availability); })}<td class="l dim">The projected rotation plays and starts</td></tr>`);
      rows.push(`<tr><td class="l"><b>Pace</b><div class="rm-ref">60–80 possessions</div></td>${both(s=>td(P(s).pace,X(s).pace!=null?Math.round(X(s).pace)+' possessions'+(X(s).pace>80?' <span class="dim">(fast)</span>':X(s).pace<60?' <span class="dim">(slow)</span>':''):'—','score '+P(s).pace))}<td class="l dim">60–80 possessions</td></tr>`);
    }
    // the result is one fact for the game: scored from blowout-beyond-the-line (20%) and line fit (10%)
    const rs=['away','home'].map(s=>[P(s).competitive,P(s).plausible]).flat().filter(v=>v!=null), rsc=rs.length?Math.round(rs.reduce((a,b)=>a+b,0)/rs.length):null;
    rows.push(`<tr><td class="l"><b>Result vs our line</b><div class="rm-ref">Within ~10 points of our line</div></td><td class="l ${rsc==null?'dim':rmCls(rsc)}" colspan="2">${margin!=null?by(margin)+' · our line '+by(R.pred):'—'}</td><td class="l dim">Within ~10 points of our line</td></tr>`);
    // opponents missing players: the other side's lines count less; our line re-priced for who actually played
    const notes=[];
    ['away','home'].forEach(s=>{ const o=s==='home'?'away':'home', oa=X(o).opp_avail; if(oa!=null&&oa<1) notes.push(`${nm(s==='home'?g.away:g.home)}'s lines count ${Math.round((1-oa)*100)}% less`); });
    const adj=(R.pred!=null&&R.pred_full!=null&&Math.abs(R.pred-R.pred_full)>=0.3)?`Our line is for the lineups that played (${by(R.pred_full)} at full strength).`:'';
    const pct=Math.round(R.score);
    return `<div class="rm">
        <div style="flex:1"><div class="rm-t">${esc(R.label)}</div><div class="rm-bar"><i style="width:${R.score}%;background:${rmCol(R.score)}"></i></div>
        <div class="rm-sum">Counts as about <b>${pct}%</b> of a real game toward each player's 2026-27 projection (less for anyone who played short minutes).</div></div></div>
      <div class="sheet-wrap" style="max-height:none;"><table class="sheet dense rm-tbl"><thead><tr><th class="l">What we checked</th><th class="l">${nm(g.away)}</th><th class="l">${nm(g.home)}</th><th class="l">A real game</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
      ${notes.length||adj?`<p class="rm-why">${[notes.length?'Against a short-handed opponent '+notes.join(' and ')+'.':'',adj].filter(Boolean).join(' ')}</p>`:''}`;
  }

  // FOUR FACTORS + EFFICIENCY (owner, Oct 16 2026: "what could we show from scrimmages for analytical data"):
  // shooting splits, possessions, points per possession and the four factors for both teams, each next to the
  // D-I average (team_pace_eff.json ffAvg). Box-score only, so it works for every game with a box.
  // Possessions = FGA − OREB + TOV + 0.44·FTA, averaged over both teams (box-score estimate; Duke–Belmont: 74 vs 73 counted).
  function teamNums(box){
    const T=box.totals||{}, P=box.players||[], sum=k=>P.reduce((a,p)=>a+(+p[k]||0),0);
    const n=k=>T[k]!=null?+T[k]:sum(k);
    return { pts:n('pts'), fgm:n('fgm'), fga:n('fga'), tpm:n('tpm'), tpa:n('tpa'), ftm:n('ftm'), fta:n('fta'), tov:n('tov'), ast:n('ast'),
      stl:n('stl'), blk:n('blk'), oreb:T.oreb!=null?+T.oreb:sum('oreb'), dreb:T.dreb!=null?+T.dreb:sum('dreb') };
  }
  function efficiency(box,g,byFull,ff){
    if(!box||!box.home||!box.away) return '';
    const A=teamNums(box.away), H=teamNums(box.home);
    if(!A.fga||!H.fga) return '';
    const poss=x=>x.fga-x.oreb+x.tov+0.44*x.fta, P=(poss(A)+poss(H))/2;
    const pc=(m,a)=>a?m/a:null, fmt=(v,d)=>v==null?'—':(100*v).toFixed(d==null?0:d)+'%';
    const two=x=>({m:x.fgm-x.tpm,a:x.fga-x.tpa});
    const ma=(m,a)=>`<span class="dim">${m}-${a}</span>`;
    // [label, away value, home value, display fn, higher is better?, D-I average (0-1 or raw), tooltip]
    const rows=[
      ['sec','Shooting'],
      ['Field goals',pc(A.fgm,A.fga),pc(H.fgm,H.fga),(v,x)=>fmt(v)+' '+ma(x.fgm,x.fga),1,null],
      ['2-pointers',pc(two(A).m,two(A).a),pc(two(H).m,two(H).a),(v,x)=>fmt(v)+' '+ma(two(x).m,two(x).a),1,null],
      ['3-pointers',pc(A.tpm,A.tpa),pc(H.tpm,H.tpa),(v,x)=>fmt(v)+' '+ma(x.tpm,x.tpa),1,null],
      ['Free throws',pc(A.ftm,A.fta),pc(H.ftm,H.fta),(v,x)=>fmt(v)+' '+ma(x.ftm,x.fta),1,null],
      ['3-point rate',pc(A.tpa,A.fga),pc(H.tpa,H.fga),v=>fmt(v),0,null,'Share of shots taken from three'],
      ['sec','Four factors'],
      ['Effective FG%',pc(A.fgm+0.5*A.tpm,A.fga),pc(H.fgm+0.5*H.tpm,H.fga),v=>fmt(v,1),1,ff&&ff.oeFG/100,'FG% with threes worth 1.5 makes'],
      ['Turnover rate',A.tov/P,H.tov/P,v=>fmt(v,1),-1,ff&&ff.oTOV/100,'Turnovers per possession'],
      ['Off. rebound rate',pc(A.oreb,A.oreb+H.dreb),pc(H.oreb,H.oreb+A.dreb),v=>fmt(v,1),1,ff&&ff.oORB/100,'Share of its own misses a team rebounded (player rebounds; team rebounds not counted)'],
      ['FT rate',pc(A.fta,A.fga),pc(H.fta,H.fga),v=>v==null?'—':v.toFixed(2),1,ff&&ff.oFTr/100,'Free-throw attempts per field-goal attempt'],
      ['sec','Efficiency'],
      ['Possessions',P,P,v=>Math.round(v),0,null,'FGA − OREB + TOV + 0.44 × FTA, averaged over both teams'],
      ['Points per possession',A.pts/P,H.pts/P,v=>v.toFixed(2),1,null],
      ['Assist rate',pc(A.ast,A.fgm),pc(H.ast,H.fgm),v=>fmt(v),1,null,'Share of made baskets that were assisted'],
      ['Steal rate',A.stl/P,H.stl/P,v=>fmt(v,1),1,null,'Steals per opponent possession'],
    ];
    const body=rows.map(r=>{
      if(r[0]==='sec') return `<tr data-noheat><td class="l sub" colspan="4">${r[1]}</td></tr>`;
      const [lab,a,h,f,dir,avg,tip]=r, better=(x,y)=>dir&&x!=null&&y!=null&&Math.abs(x-y)>1e-9&&(dir>0?x>y:x<y);
      const cell=(v,x,w)=>`<td class="${w?'c3':''}">${v==null?'—':f(v,x)}</td>`;
      const avgTxt=avg==null?'':(lab==='FT rate'?avg.toFixed(2):(100*avg).toFixed(1)+'%');
      return `<tr><td class="l"${tip?` title="${esc(tip)}"`:''}>${lab}</td>${cell(a,A,better(a,h))}${cell(h,H,better(h,a))}<td class="dim">${avgTxt}</td></tr>`;
    }).join('');
    const nm=full=>esc(shortOf(full,byFull));
    return `<div class="sec"><h2>Efficiency</h2><span class="hint">shooting · four factors · per possession</span></div>
      <div class="sheet-wrap" style="max-height:none;"><table class="sheet dense ef-tbl"><thead><tr><th class="l">Stat</th><th>${nm(g.away)}</th><th>${nm(g.home)}</th><th title="Division I average, 2025-26">D-I avg</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }

  async function main(){
    if(!id){ $app.innerHTML='<div class="empty">No scrimmage selected.</div>'; return; }
    const [S,D]=await Promise.all([TDCScrim.load(), window.TDC_RATINGS?TDC_RATINGS.get().catch(()=>null):null]);
    const g=S.games.find(x=>x.id===id);
    if(!g){ $app.innerHTML='<div class="empty">That scrimmage isn\'t on our list.</div>'; return; }
    const byFull={}; ((D&&D.teams)||[]).slice().sort((a,b)=>b.rating-a.rating).forEach((t,i)=>{ if(t.rank==null) t.rank=i+1; byFull[t.full]=t; });
    const res=S.results[g.id]||{}, box=res.box||null;
    const hS=shortOf(g.home,byFull), aS=shortOf(g.away,byFull);
    document.title=`${aS} ${g.neutral?'vs':'at'} ${hS} · Scrimmage — The Depth Chart`;
    const dd=new Date(g.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    const P=TDCScrim.price(g,byFull,S.eff);
    const has=res.hs!=null&&res.as!=null;
    const teamLink=full=>{ const t=byFull[full]; return t?`team.html?team=${encodeURIComponent(t.team)}&tab=schedule`:null; };
    // one side of the team-colour band (tdc-gamehead.js)
    const band=(full,pts)=>{ const t=byFull[full], c=TDC_GAMEHEAD.team((t&&t.team)||full), c2=TDC_GAMEHEAD.team(full);
      return { name:shortOf(full,byFull), href:teamLink(full), logo:logoOf(full,byFull), color:c.color||c2.color,
        sub:t&&t.rank?'#'+t.rank+' in our rankings':(t?'':'non-D-I'), pts:has?pts:null }; };
    let read='';
    if(P){ const fav=P.m>=0?g.home:g.away, sp=Math.abs(P.m);
      read=`Our line: <b>${esc(shortOf(fav,byFull))} −${(Math.round(sp*2)/2).toFixed(1)}</b> (${Math.round(Math.max(P.probH,100-P.probH))}% to win)`;
      if(has){ const actual=res.hs-res.as, diff=actual-P.m, beat=(P.m>=0?diff:-diff);
        read+=` · Result: <b>${esc(shortOf(actual>=0?g.home:g.away,byFull))} by ${Math.abs(actual)}</b>, ${Math.abs(diff).toFixed(1)} points ${beat>=0?'better':'worse'} than our line for the favorite.`; } }
    const [rh,ra,PBP,TR]=await Promise.all([roster(byFull[g.home]&&byFull[g.home].team), roster(byFull[g.away]&&byFull[g.away].team), window.TDC_SCRIMFLOW?TDC_SCRIMFLOW.load():{}, window.TDC_SCRIMFLOW&&box?TDC_SCRIMFLOW.loadTrends():null]);
    const names={h:hS,a:aS}, initial=n=>{ const w=String(n).split(' '); return w.length>1?w[0][0]+'. '+w.slice(1).join(' '):n; };
    const proj=window.TDC_SCRIMFLOW&&TR?TDC_SCRIMFLOW.projHtml(TR,g.id,[{full:g.away,name:aS,short:initial},{full:g.home,name:hS,short:initial}]):'';
    // play-by-play analytics (tdc-scrimflow.js): game flow, rotations, +/-, lineups, shot profile
    let FL=null, SP=null, PM={h:null,a:null};
    const pb=PBP&&PBP[g.id];
    if(pb&&box){ try{
      const linkTo=(ros,short)=>{ const byKey={}; ros.forEach(p=>{ byKey[nk(p.name)]=p; });
        return name=>{ const r=byKey[nk(name)]; return r?(r.espn_id?`player.html?espn=${r.espn_id}`:`player.html?name=${encodeURIComponent(r.name)}&team=${encodeURIComponent(short||'')}`):null; }; };
      const rnOf=(side,name)=>{ const p=(box[side==='h'?'home':'away'].players||[]).find(x=>x.name===name); return (p&&p.rn)||name; };
      const lh=linkTo(rh,byFull[g.home]&&byFull[g.home].team), la=linkTo(ra,byFull[g.away]&&byFull[g.away].team);
      const tm=full=>{ const t=byFull[full], c=TDC_GAMEHEAD.team((t&&t.team)||full), c2=TDC_GAMEHEAD.team(full);
        return { name:shortOf(full,byFull), abbr:shortOf(full,byFull), color:c.color||c2.color, logo:logoOf(full,byFull) }; };
      const code=(s,full)=>String((pb.codes&&pb.codes[s])||shortOf(full,byFull).slice(0,4)).toUpperCase();
      FL=TDC_SCRIMFLOW.build(pb,box,{home:{...tm(g.home),abbr:code('h',g.home)},away:{...tm(g.away),abbr:code('a',g.away)},date:g.date+'T12:00:00',href:(side,name)=>(side==='h'?lh:la)(rnOf(side,name))});
      if(FL){ const pm=TDC_SCRIMFLOW.plusMinus(FL);
        ['h','a'].forEach(s=>{ if(!FL.ok[s]) return; PM[s]={}; Object.keys(pm).forEach(k=>{ if(k.slice(0,2)===s+'|') PM[s][k.slice(2)]=pm[k]; }); });
        SP=TDC_SCRIMFLOW.shotSplit(pb); }
    }catch(e){ console.error(e); FL=null; } }
    // player of the game (highest Game Score, either team) and each team's 0-10 rating from the result vs our line (game recap formula)
    const BX={potg:null,th:null,ta:null};
    if(box){ let best=-1e9; ['home','away'].forEach(k=>((box[k]&&box[k].players)||[]).forEach(p=>{ if(!(p.min>0)||p.pts==null) return; const gs=gameScore(p); if(gs>best){ best=gs; BX.potg=p; } }));
      const R0=res.reality||{}; if(has&&R0.pred!=null){ const rate=x=>Math.max(2,Math.min(10,Math.round((6.3+x*0.22)*10)/10)), d=(res.hs-res.as)-R0.pred; BX.th=rate(d); BX.ta=rate(-d); } }
    // ── layout (Oct 2026, owner: too much text) — band, stat strip, then labelled tabs (tdc-gametabs.js) ──
    const GT=window.TDCGameTabs, R0=res.reality||{};
    const nmS=full=>esc(shortOf(full,byFull));
    const statLine=p=>[`${v(p.pts)} PTS`,`${v(p.reb)} REB`,`${v(p.ast)} AST`].concat(+p.stl>=2?[p.stl+' STL']:[]).concat(+p.blk>=2?[p.blk+' BLK']:[]).join(' · ');
    const potgSide=BX.potg?(((box.home&&box.home.players)||[]).includes(BX.potg)?g.home:g.away):null;
    const possOf=()=>{ if(!box||!box.home||!box.away) return null; const A=teamNums(box.away), Hh=teamNums(box.home); if(!A.fga||!Hh.fga) return null;
      const q=x=>x.fga-x.oreb+x.tov+0.44*x.fta; return (q(A)+q(Hh))/2; };
    const poss=possOf();
    const cells=[];
    if(has){ const actual=res.hs-res.as; cells.push({v:Math.abs(actual),k:'Margin',s:nmS(actual>=0?g.home:g.away)+' won'}); }
    if(P){ const fav=P.m>=0?g.home:g.away; cells.push({v:'−'+(Math.round(Math.abs(P.m)*2)/2).toFixed(1),k:'Our line',s:nmS(fav)+' · '+Math.round(Math.max(P.probH,100-P.probH))+'% to win',tip:'Our pregame point spread for the favorite'}); }
    if(has&&P){ const d=(res.hs-res.as)-P.m; cells.push({v:Math.abs(d).toFixed(1),k:'vs. our line',s:nmS(d>=0?g.home:g.away)+' beat it',tip:'How many points the result landed away from our line'}); }
    if(has) cells.push({v:res.hs+res.as,k:'Total points',s:poss?Math.round((res.hs+res.as)/poss/2*100)+' per 100 poss.':''});
    if(poss) cells.push({v:Math.round(poss),k:'Possessions',s:poss>80?'fast':poss<60?'slow':'normal pace'});
    if(R0.score!=null) cells.push({v:Math.round(R0.score)+'%',k:'Counts as',s:'of a real game',tip:'Reality Meter: how much this scrimmage counts toward each player’s 2026-27 projection (100% = one full real game). See the “How much it counts” tab.'});
    const sum=GT.kv([
      ['Player of the game',BX.potg?`<b>${esc(BX.potg.rn||BX.potg.name)}</b> · ${nmS(potgSide)} · ${statLine(BX.potg)} · RTG ${playerRating(BX.potg).toFixed(1)}`:''],
      ['Report',res.note?esc(res.note):''],
      ['How much it counts',R0.score!=null?`<b>${esc(R0.label||'')}</b> · about ${Math.round(R0.score)}% of a real game toward each player’s projection`:''],
      ['RTG scale',box?'0–10 from the box score · 5 average · 6.5 strong · 8+ great':''],
    ])+(box?GT.leaders(['away','home'].map(k=>{ const full=k==='home'?g.home:g.away, ros=k==='home'?rh:ra, short=byFull[full]&&byFull[full].team, byKey={};
        ros.forEach(p=>{ byKey[nk(p.name)]=p; });
        return { name:shortOf(full,byFull), players:((box[k]&&box[k].players)||[]).map(p=>{ const r=byKey[nk(p.rn||p.name)];
          return { name:p.rn||p.name, pts:p.pts, reb:p.reb, ast:p.ast, min:p.min,
            href:r?(r.espn_id?`player.html?espn=${r.espn_id}`:`player.html?name=${encodeURIComponent(r.name)}&team=${encodeURIComponent(short||'')}`):null }; }) }; })):'')
      +(FL?GT.moments(FL.G,FL.R):'')
      +(proj?GT.head('Vs our projection','minutes and Game Score vs our pre-scrimmage projection · * started')+proj:'');
    const boxes=box?teamBlock('away',box.away,g.away,byFull[g.away]&&byFull[g.away].team,ra,byFull,PM.a,{potg:BX.potg,trtg:BX.ta})+teamBlock('home',box.home,g.home,byFull[g.home]&&byFull[g.home].team,rh,byFull,PM.h,{potg:BX.potg,trtg:BX.th})+'<p class="note">* = started · RTG = 0–10 game rating · Counts = share of a real game this line adds to his projection.</p>':'';
    const stats=(efficiency(box,g,byFull,S.eff&&S.eff.ffAvg)||'')+(FL?`<div class="sec"><h2>How each trip ended</h2><span class="hint">every possession, by what ended it</span></div>${TDC_SCRIMFLOW.possessionsHtml(pb,names)}`:'');
    const rotOK=FL&&FL.G.rotTeams.length;
    const nameGap=FL&&FL.G.rotTeams.length<2?`<p class="note">${['h','a'].filter(s=>!FL.ok[s]).map(s=>esc(shortOf(s==='h'?g.home:g.away,byFull))).join(' and ')}: the play-by-play’s names don’t match the box score, so no rotation, +/− or player shot rows.</p>`:'';
    const counts=meter(res.reality,g,byFull,res)+(R0.score!=null?`<ul class="gt-list">
        <li><b>Not official:</b> never counted in either team’s record, season stats or ratings.</li>
        <li><b>What it moves:</b> player projected rates (capped 15%), minutes, a newcomer’s OVR (±4) and the team rating (±2.5).</li>
        <li><b>How much:</b> a fully game-like scrimmage counts as one real game; this one counts ${Math.round(R0.score)}%.</li>
        <li><b>Where to see it:</b> each player’s Trends tab shows exactly what moved.</li></ul>`:'');
    $app.innerHTML=`
      <div><a href="scrimmages.html" style="font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;margin-right:10px;">← All scrimmages</a><span class="chip">Preseason scrimmage · unofficial</span></div>
      <h1 class="sr-only">${esc(aS)} ${g.neutral?'vs':'at'} ${esc(hS)}</h1>
      ${TDC_GAMEHEAD.html({ away:band(g.away,res.as), home:band(g.home,res.hs),
        status:has?'Final':'Not played yet', statusSub:has?'Unofficial':'',
        meta:`<span>${dd}${g.time?' · '+esc(g.time):''}</span><span>${g.neutral?'Neutral site':esc(hS)+' home floor'}</span>${g.tv?`<span>${esc(g.tv)}</span>`:''}` })}
      ${cells.length?GT.strip(cells):''}
      <div id="scTabs"></div>
      ${box||res.note?'':`<div class="empty" style="margin-top:20px;">${has?'Only the final score is in for this one; no box score has posted.':'This scrimmage hasn’t been played yet. Its box score lands here once it’s out.'}</div>`}
      ${res.src?`<p class="note"><a href="${esc(res.src)}" target="_blank" rel="noopener">Source box score</a></p>`:''}`;
    const shade=()=>document.querySelectorAll('table.sc-box').forEach(t=>window.tdcSheetHeat&&tdcSheetHeat(t));
    const flowTab=FL?{id:'flow',label:'Game flow',onShow:el=>{ el.innerHTML='<section class="gf-card sc-gf"></section>'; TDC_GAMEFLOW.renderFlow(el.firstChild,FL.G,FL.R); }}:null;
    const rotTab=rotOK?{id:'rotation',label:'Rotation',onShow:el=>{ el.innerHTML=GT.head('Starters vs bench','score margin by how many starters were on the floor')+TDC_SCRIMFLOW.unitsHtml(FL,names)+GT.head('Stints and lineups','coloured by +/−')+'<section class="gf-card sc-gf"></section>'+nameGap;
      TDC_GAMEFLOW.renderRotation(el.querySelector('section'),FL.G,FL.R); }}:null;
    if(box||res.note) GT.mount(document.getElementById('scTabs'),[
      {id:'summary',label:'Summary',html:sum},
      box?{id:'box',label:'Box score',html:boxes,onShow:shade}:null,
      {id:'stats',label:'Team stats',html:stats},
      flowTab,
      {id:'shots',label:'Shots',html:FL?shotProfile(SP,FL.ok,g,byFull,box):''},
      rotTab,
      {id:'counts',label:'How much it counts',html:counts},
    ]);
  }
  main().catch(e=>{ console.error(e); $app.innerHTML='<div class="empty">Could not load this box score.</div>'; });
})();
</script>
  <script src="tdc-sheets.js?v=2"></script>
  <script src="tdc-tour.js?v=32"></script>
</body>
