<!DOCTYPE html>
<html lang="en">
<head>
  <script src="tdc-loading.js?v=5"></script>   <!-- first, so it sees every request -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Today's Games — The Depth Chart</title>
  <meta name="description" content="Every college basketball game on the day, scrimmages and exhibitions included: live scores, finals, our line and win odds, with a box score or preview for each.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Depth Chart">
  <meta property="og:title" content="Today's Games — The Depth Chart">
  <meta property="og:description" content="Every game today, scrimmages included: live scores, finals, our line and win odds.">
  <meta property="og:url" content="https://www.thedepthchartcbb.com/today.html">

  <style>
    :root{--green:#2e8b57;--red:#c75d5d;}
    [data-theme="dark"]{--green:#6fbf7e;--red:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .page{padding:26px 0 60px;}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
    h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:14px;}
    /* date strip: a week of days around the chosen one, like the big scoreboards */
    .dates{display:flex;align-items:stretch;border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);margin-bottom:8px;}
    .dates .arw{background:none;border:none;border-right:1px solid var(--border);width:38px;font-size:20px;color:var(--text2);cursor:pointer;flex-shrink:0;}
    .dates .arw.r{border-right:none;border-left:1px solid var(--border);}
    .dates .arw:hover{background:var(--bg2);color:var(--text);}
    .dates .days{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;}
    .dates .days::-webkit-scrollbar{display:none;}
    .dates .d{flex:1 0 92px;text-align:center;padding:9px 6px 8px;text-decoration:none;color:var(--text2);border-bottom:3px solid transparent;}
    .dates .d b{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;}
    .dates .d span{display:block;font-size:12.5px;font-weight:600;margin-top:2px;}
    .dates .d:hover{background:var(--bg2);color:var(--text);}
    .dates .d.on{color:var(--text);border-bottom-color:var(--accent);}
    .dates .cal{position:relative;width:44px;flex-shrink:0;border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2);}
    .dates .cal input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;}
    .sub{font-size:12.5px;color:var(--text3);margin-bottom:18px;}
    .sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--text);}
    .sec h2{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;}
    .sec .n{font-size:12px;color:var(--text3);}
    .chip{display:inline-block;padding:0 6px;border:1px dashed var(--border2);border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-left:6px;vertical-align:1px;}
    /* game cards */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
    .gc{display:flex;flex-direction:column;border:1px solid var(--border2);border-radius:10px;background:var(--bg);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
    .gc:hover{border-color:var(--text3);box-shadow:0 4px 14px rgba(0,0,0,.07);}
    .gc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px 4px;font-size:11.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
    .gc-top .tv{color:var(--text3);font-weight:600;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;}
    .gc-top .live{color:var(--red);} .gc-top .live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px;animation:tdpulse 1.6s infinite;}
    @keyframes tdpulse{50%{opacity:.25}}
    .gc-t{display:flex;align-items:center;gap:10px;padding:6px 14px;}
    .gc-t img{width:28px;height:28px;object-fit:contain;flex-shrink:0;}
    .gc-t .nmw{min-width:0;flex:1;}
    .gc-t .nm{font-size:16px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
    .gc-t a.nm:hover{text-decoration:underline;}
    .gc-t .rk{font-size:11px;font-weight:700;color:var(--text3);margin-right:5px;}
    .gc-t .ex{font-size:11px;color:var(--text3);font-weight:500;margin-top:1px;}
    .gc-t .sc{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;}
    .gc-t .sc.pj{font-size:14px;font-weight:600;color:var(--text3);}
    .gc-t.lose .nm,.gc-t.lose .sc{color:var(--text3);} .gc-t.lose .sc{font-weight:600;}
    .gc-t.win .sc::after{content:'◂';font-size:11px;color:var(--text);margin-left:3px;vertical-align:4px;}
    .gc-ft{margin-top:auto;border-top:1px solid var(--border);padding:8px 14px 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12px;color:var(--text2);background:var(--bg2);}
    .gc-ft .ln b{color:var(--text);}
    .gc-ft .go{font-weight:700;color:var(--accent);white-space:nowrap;text-decoration:none;}
    .gc-note{padding:2px 14px 10px;font-size:11.5px;color:var(--text3);line-height:1.45;}
    .empty{padding:26px;text-align:center;color:var(--text3);border:1px dashed var(--border2);border-radius:12px;font-size:13px;}
    @media(max-width:640px){
      h1{font-size:26px;margin-bottom:10px;}
      .grid{grid-template-columns:minmax(0,1fr);gap:10px;}
      .dates .d{flex:0 0 74px;padding:8px 4px 7px;} .dates .d span{font-size:11.5px;}
      .dates .arw{width:30px;}
      .gc-t .nm{font-size:15px;} .gc-t .sc{font-size:21px;} .gc-t img{width:24px;height:24px;}
      .sec{flex-wrap:wrap;} .sec .n{flex:1 0 100%;}
    }
  </style>
  <link rel="stylesheet" href="tdc-skin.css?v=15"/>
  <link rel="stylesheet" href="tdc-sheets.css?v=6"/>
  <link rel="stylesheet" href="tdc-column.css?v=4"/>
  <link rel="stylesheet" href="tdc-ui.css?v=10"/>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

</head>
<body>
<script src="tdc-nav.js?v=81"></script>
<div class="page">
  <div class="eyebrow">Scoreboard · men's college basketball</div>
  <h1 id="ttl">Today's Games</h1>
  <div class="dates"><button type="button" class="arw" id="prev" aria-label="Previous day">‹</button><div class="days" id="days"></div><button type="button" class="arw r" id="next" aria-label="Next day">›</button><label class="cal" title="Pick a day">📅<input type="date" id="pick" aria-label="Pick a day"/></label></div>
  <div class="sub" id="sub">Loading the slate…</div>
  <div id="scrimSec"></div>
  <div id="gameSec"></div>
</div>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const etDay=d=>(d||new Date()).toLocaleDateString('en-CA',{timeZone:'America/New_York'});   // YYYY-MM-DD, US Eastern
  const P=new URLSearchParams(location.search);
  const TODAY=etDay(), DAY=/^\d{4}-\d{2}-\d{2}$/.test(P.get('date')||'')?P.get('date'):TODAY;
  const shift=(d,n)=>{ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
  // tdc-live.js reads ?livedate=YYYYMMDD at load, so another day is a reload with both params
  const go=d=>{ location.href='today.html'+(d===TODAY?'':'?date='+d+'&livedate='+d.replace(/-/g,'')); };
  const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const url=d=>'today.html'+(d===TODAY?'':'?date='+d+'&livedate='+d.replace(/-/g,''));
  document.getElementById('ttl').textContent=DAY===TODAY?"Today's Games":nice(DAY);
  // a week of days centred on the chosen one
  document.getElementById('days').innerHTML=[-3,-2,-1,0,1,2,3].map(k=>{ const d=shift(DAY,k), x=new Date(d+'T12:00:00');
    const wd=d===TODAY?'TODAY':x.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
    return `<a class="d${k===0?' on':''}" href="${url(d)}"><b>${wd}</b><span>${x.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></a>`; }).join('');
  { const dz=document.getElementById('days'), on=dz.querySelector('.d.on');   // phones: open centred on the chosen day
    if(on) dz.scrollLeft=Math.max(0,on.offsetLeft-dz.offsetLeft-(dz.clientWidth-on.offsetWidth)/2); }
  const pk=document.getElementById('pick'); pk.value=DAY; pk.onchange=()=>pk.value&&go(pk.value);
  document.getElementById('prev').onclick=()=>go(shift(DAY,-1));
  document.getElementById('next').onclick=()=>go(shift(DAY,1));
  if(DAY!==TODAY) document.title=nice(DAY)+' — Games — The Depth Chart';

  let BY={}, SCR=null, BOARD=null;
  const short=full=>{ const t=BY[full]; const s=(t&&t.team)||String(full||'').replace(/ \S+$/,''); try{ return (window.tdcShortSchool&&tdcShortSchool(s))||s; }catch(e){ return s; } };
  const logo=full=>{ try{ const t=BY[full]; const c=window.tdcTeamColor&&(tdcTeamColor((t&&t.team)||full)||tdcTeamColor(full)); return (c&&c.logo)||''; }catch(e){ return ''; } };
  // one game card. t = {full, logo, rank, score, proj}; state 'pre' | 'in' | 'post'
  const nameA=(full)=>{ const t=BY[full]; return t?`<a class="nm" href="team.html?team=${encodeURIComponent(t.team)}" onclick="event.stopPropagation()">${esc(short(full))}</a>`:`<span class="nm">${esc(short(full))}</span>`; };
  const teamRow=(t,state,win,lose)=>{ const img=t.logo||logo(t.full), r=t.rank||(BY[t.full]&&BY[t.full].rank);
    const sc=state==='pre'?(t.proj!=null?`<span class="sc pj">${t.proj}</span>`:'<span class="sc"></span>'):`<span class="sc">${t.score==null?'':t.score}</span>`;
    return `<div class="gc-t${win?' win':''}${lose?' lose':''}">${img?`<img src="${esc(img)}" alt="" onerror="this.style.visibility='hidden'">`:'<span style="width:28px"></span>'}`+
      `<div class="nmw"><div style="display:flex;align-items:baseline;min-width:0">${r&&r<=25?`<span class="rk">${r}</span>`:''}${nameA(t.full)}</div>${t.ex?`<div class="ex">${t.ex}</div>`:''}</div>${sc}</div>`; };
  const card=o=>{ const fin=o.state==='post', hw=fin&&o.home.score>o.away.score, aw=fin&&o.away.score>o.home.score;
    return `<div class="gc"${o.gid?` data-gid="${esc(o.gid)}"`:''} onclick="location.href='${o.href.replace(/'/g,'%27')}'">`+
      `<div class="gc-top"><span class="${o.state==='in'?'live':''}">${o.status}</span><span class="tv">${esc(o.tv||'')}</span></div>`+
      teamRow(o.away,o.state,aw,hw)+teamRow(o.home,o.state,hw,aw)+
      (o.note?`<div class="gc-note">${esc(o.note)}</div>`:'')+
      `<div class="gc-ft"><span class="ln">${o.line||''}</span><a class="go" href="${o.href}" onclick="event.stopPropagation()">${fin?'Box score':o.state==='in'?'Live':'Preview'} ›</a></div></div>`; };
  const sg=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1);
  const lineTxt=(home,away,m)=>m==null?'—':Math.abs(m)<0.25?'Pick':`${esc(short(m>0?home:away))} <span class="sp">−${Math.abs(m).toFixed(1)}</span>`;
  const pairKey=(a,b)=>[a,b].sort().join('|');

  // "7:30 PM" → minutes after midnight (TBA last), so the day reads in order
  const mins=t=>{ const m=String(t||'').match(/(\d{1,2})(?::(\d{2}))?\s*([AP])M/i); if(!m) return 9999; return (+m[1]%12+(m[3].toUpperCase()==='P'?12:0))*60+(+m[2]||0); };
  // ── scrimmages & exhibitions (scripts/data/scrimmages_2027.json + results) ──
  function renderScrims(){
    const el=document.getElementById('scrimSec'); if(!SCR) return;
    const list=SCR.games.filter(x=>x.date===DAY).sort((a,b)=>mins(a.time)-mins(b.time));
    if(!list.length){ el.innerHTML=''; return; }
    const live={}; ((BOARD&&BOARD.games)||[]).forEach(g=>{ live[pairKey(g.home.name,g.away.name)]=g; });
    const cards=list.map(x=>{
      const res=SCR.results[x.id], played=res&&res.hs!=null&&res.as!=null, lv=live[pairKey(x.home,x.away)];
      const P=window.TDCScrim?TDCScrim.price(x,BY,SCR.eff):null;
      let state='pre', status=esc(x.time?x.time+' ET':'TBA'), hs=null, as=null;
      if(played){ state='post'; status='Final'; hs=res.hs; as=res.as; }
      else if(lv&&lv.state!=='pre'&&lv.home.score!=null){ state=lv.state==='post'?'post':'in'; status=esc(lv.state==='post'?'Final':lv.detail);
        const hm=lv.home.name===x.home; hs=hm?lv.home.score:lv.away.score; as=hm?lv.away.score:lv.home.score; }
      const pj=(!played&&P&&P.tot!=null)?{h:Math.round((P.tot+P.m)/2),a:Math.round((P.tot-P.m)/2)}:null;
      const href=played?'scrimmage.html?id='+encodeURIComponent(x.id):'preview.html?team='+encodeURIComponent(x.home)+'&opp='+encodeURIComponent(x.away)+'&date='+x.date;
      const fav=P?(P.probH>=50?P.probH:100-P.probH):null;
      const line=played?'<span class="chip" style="margin:0">Scrimmage · unofficial</span>':(P?`Our line <b>${lineTxt(x.home,x.away,P.m)}</b>${fav!=null?' · '+Math.round(fav)+'%':''} <span class="chip">Scrimmage</span>`:'<span class="chip" style="margin:0">Scrimmage</span>');
      return card({state,status,tv:x.tv,href,line,note:(res&&(res.note||res.auto_note))||'',
        away:{full:x.away,score:as,proj:pj&&pj.a,ex:x.neutral?'Neutral site':''},home:{full:x.home,score:hs,proj:pj&&pj.h}}); }).join('');
    el.innerHTML=`<div class="sec"><h2>Scrimmages &amp; exhibitions <span class="chip">Unofficial</span></h2><span class="n">${list.length} game${list.length===1?'':'s'} · not counted in records, stats or ratings</span></div><div class="grid">${cards}</div>`;
  }

  // ── games: ESPN's scoreboard for the day (live + finals), else our 2026-27 schedule ──
  async function renderGames(){
    const el=document.getElementById('gameSec');
    const scrimPairs=new Set(((SCR&&SCR.games)||[]).filter(x=>x.date===DAY).map(x=>pairKey(x.home,x.away)));
    let games=((BOARD&&BOARD.games)||[]).filter(g=>!scrimPairs.has(pairKey(g.home.name,g.away.name)));
    let fromSched=false;
    if(!games.length){   // ESPN had nothing (or the day is far off): the slate we've pulled
      try{ const all=await fetch('scripts/data/schedule_2027.json?v=5').then(r=>r.json()); const T=all.teams;
        games=all.games.filter(g=>g[1]===DAY).map(g=>({id:String(g[0]),date:DAY,state:'pre',detail:'',neutral:!!g[4],home:{name:T[g[2]]},away:{name:T[g[3]]},tv:null})); fromSched=true; }catch(e){}
    }
    if(!games.length){ el.innerHTML=(document.getElementById('scrimSec').innerHTML?'':`<div class="empty">No games on ${esc(nice(DAY))}.</div>`); return; }
    const ord={in:0,pre:1,post:2};
    games.sort((a,b)=>(ord[a.state]-ord[b.state])||String(a.date).localeCompare(String(b.date)));
    const time=g=>{ if(g.state==='in') return esc(g.detail||'Live'); if(g.state==='post') return esc(g.detail||'Final');
      if(fromSched||!g.date||g.timeValid===false) return 'TBA';
      return new Date(g.date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET'; };
    const cards=games.map(g=>{
      const href=fromSched?'preview.html?team='+encodeURIComponent(g.home.name)+'&opp='+encodeURIComponent(g.away.name)+'&date='+DAY:'game.html?id='+encodeURIComponent(g.id);
      return card({gid:g.id,state:g.state,status:time(g),tv:g.tv,href,line:'<span class="lnv">…</span>',
        away:{full:g.away.name,logo:g.away.logo,rank:g.away.rank,score:g.away.score,ex:g.neutral?'Neutral site':''},
        home:{full:g.home.name,logo:g.home.logo,rank:g.home.rank,score:g.home.score}}); }).join('');
    el.innerHTML=`<div class="sec"><h2>Games</h2><span class="n">${games.length} game${games.length===1?'':'s'}${fromSched?' · from the announced schedule':''}</span></div><div class="grid">${cards}</div>`;
    // our pregame line for each (tdc-schedule pricing; same as the game page)
    games.forEach(async g=>{
      const cd=el.querySelector(`.gc[data-gid="${CSS.escape(g.id)}"]`); if(!cd) return;
      let l=null; try{ l=window.TDC_LIVE?await TDC_LIVE.pregame(g):null; }catch(e){}
      cd.querySelector('.ln').innerHTML=l?`Our line <b>${lineTxt(g.home.name,g.away.name,l.margin)}</b>${l.p!=null?' · '+Math.round(100*Math.max(l.p,1-l.p))+'%':''}`:'';
    });
  }

  function summary(){
    const s=((SCR&&SCR.games)||[]).filter(x=>x.date===DAY).length, n=document.querySelectorAll('#gameSec .gc').length;
    const live=((BOARD&&BOARD.games)||[]).filter(g=>g.state==='in').length;
    const parts=[n?`${n} game${n===1?'':'s'}`:'',s?`${s} scrimmage${s===1?'':'s'}`:'',live?`${live} live now`:''].filter(Boolean);
    document.getElementById('sub').textContent=(parts.length?parts.join(' · '):'Nothing scheduled')+(DAY===TODAY?' · scores update automatically':'');
  }

  Promise.all([window.TDC_RATINGS?TDC_RATINGS.get():null, window.TDCScrim?TDCScrim.load():null]).then(([D,S])=>{
    ((D&&D.teams)||[]).forEach(t=>{ if(t.full) BY[t.full]=t; });
    SCR=S; renderScrims();
    const onBoard=async b=>{ BOARD=b; renderScrims(); await renderGames(); summary(); };
    if(window.TDC_LIVE) TDC_LIVE.subscribe(onBoard);
    else renderGames().then(summary);
    // ESPN unreachable: still show the scheduled slate
    setTimeout(()=>{ if(!BOARD) renderGames().then(summary); },6000);
  });
})();
</script>
<script src="tdc-version.js?v=2"></script>
<script src="tdc-sheets.js?v=2"></script>
  <script src="tdc-tour.js?v=31"></script>
<script src="tdc-panelize.js?v=18"></script>
<script>/* one anatomy for every stat section (tdc-panelize.js) */ if(window.TDCPanelize) TDCPanelize.watchPage('.sec:has(> h2), h2:not(.sec > h2)');</script>
</body>
</html>
