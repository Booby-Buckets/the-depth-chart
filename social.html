  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--accent-soft:rgba(168,132,60,.13);--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3D;--border2:#36405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--accent-soft:rgba(230,213,168,.12);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;}
    /* STUDIO LAYOUT (Oct 2026 revamp): library | preview | inspector, full width, each pane scrolls on its own */
    .wrap{max-width:1760px;margin:0 auto;padding:18px 24px 40px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
    h1{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;letter-spacing:-.02em;margin:2px 0 0;}
    .sub{color:var(--text3);font-size:14px;margin-bottom:20px;}
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;}
    .top .sub{margin:0;font-size:13px;}
    .grid{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:18px;align-items:start;}
    .grid>*{min-width:0;}
    .pane{border:1px solid var(--border);background:var(--bg2);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;}
    .pane-h{position:sticky;top:0;z-index:2;background:var(--bg2);padding:12px 14px 10px;border-bottom:1px solid var(--border);}
    .pane-t{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);}
    /* library */
    .lib-q{margin-top:8px;}
    .lib{padding:6px 8px 14px;}
    .lib-g{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:14px 6px 4px;}
    .lib-i{display:block;width:100%;text-align:left;font:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--text);}
    .lib-i b{display:block;font-size:13px;font-weight:700;line-height:1.25;}
    .lib-i span{display:block;font-size:11px;color:var(--text3);line-height:1.3;margin-top:1px;}
    .lib-i:hover{background:var(--bg);}
    .lib-i.on{background:var(--accent-soft);border-color:var(--accent);}
    .lib-i.on b{color:var(--text);}
    .lib-s{font-size:10.5px;font-weight:700;color:var(--accent);margin:10px 8px 2px;}
    .lib-empty{font-size:12px;color:var(--text3);padding:12px 8px;}
    /* stage */
    .stagecol{position:sticky;top:12px;}
    .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--border);border-bottom:none;background:var(--bg2);padding:9px 12px;}
    .bar .nm{font-weight:800;font-size:14px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;}
    .bar select{width:auto;padding:6px 8px;font-size:12px;font-weight:600;}
    .bar .b{padding:7px 12px;}
    .stage{border:1px solid var(--border);background:var(--bg3);padding:18px;display:flex;justify-content:center;align-items:center;min-height:300px;height:calc(100vh - 80px);}
    .pager{display:flex;gap:12px;align-items:center;justify-content:center;padding:8px 0;font-size:13px;font-weight:700;color:var(--text2);}
    .pager[hidden]{display:none;}
    .pager button{min-width:38px;font-size:18px;line-height:1;}
    @media(min-width:981px){ .stagecol:has(.pager:not([hidden])) .stage{height:calc(100vh - 128px);} }
    .stage canvas{max-width:100%;max-height:100%;height:auto;width:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
    /* inspector */
    .insp .body{padding:4px 14px 16px;}
    details.sec{border-bottom:1px solid var(--border);}
    details.sec:last-child{border-bottom:none;}
    details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);}
    details.sec>summary::-webkit-details-marker{display:none;}
    details.sec>summary::after{content:'+';font-size:15px;color:var(--text3);font-weight:600;letter-spacing:0;}
    details.sec[open]>summary::after{content:'–';}
    details.sec>.sb{padding-bottom:14px;}
    .panel h3{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;}
    .seg{display:flex;flex-wrap:wrap;gap:6px;}
    .seg button{font:inherit;font-size:12px;font-weight:700;padding:7px 11px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;}
    .seg button.on{background:var(--accent);border-color:var(--accent);color:#1a1206;}
    label.f{display:block;font-size:11px;font-weight:700;color:var(--text3);margin:10px 0 4px;}
    input,select,textarea{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border2);background:var(--bg);color:var(--text);border-radius:4px;}
    textarea{min-height:96px;resize:vertical;}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .chk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text2);margin-top:10px;cursor:pointer;}
    .chk input{width:auto;}
    .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .b{font:inherit;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;border-radius:4px;}
    .b.sm{padding:6px 10px;font-size:11px;}
    .b.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;}
    .b:disabled{opacity:.5;cursor:wait;}
    /* row editor */
    .rows{max-height:460px;overflow:auto;border:1px solid var(--border);background:var(--bg);margin-top:8px;}
    .row{display:grid;grid-template-columns:26px minmax(0,1.4fr) minmax(0,1fr) 62px 22px 22px 22px;gap:4px;align-items:center;padding:3px 5px;border-bottom:1px solid var(--border);}
    .row.nov{grid-template-columns:26px minmax(0,1.4fr) minmax(0,1fr) 22px 22px 22px;}
    .row:last-child{border-bottom:none;}
    .row .n{font-size:12px;font-weight:800;color:var(--text3);text-align:right;padding-right:2px;}
    .row input{padding:5px 6px;font-size:12.5px;border-color:var(--border);}
    .row button{border:none;background:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0;}
    .row button:hover{color:var(--accent);}
    .grp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:14px 0 4px;}
    .status{font-size:12px;color:var(--text3);min-height:16px;}
    .status.err{color:var(--red);}
    .gate{max-width:520px;margin:80px auto;text-align:center;}
    .gate a{color:var(--accent);font-weight:700;}
    .hide{display:none!important;}
    .hint{font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.45;}
    .mbar{display:none;}
    /* laptops: inspector narrows */
    @media(max-width:1280px){ .grid{grid-template-columns:220px minmax(0,1fr) 340px;gap:14px;} }
    /* tablets + phones: ONE pane at a time, picked from a bottom tab bar (Graphics / Edit / Preview / Save) */
    @media(max-width:980px){
      .wrap{padding:14px 16px 96px;} .top{margin-bottom:10px;} .top .sub{display:none;}
      .grid{grid-template-columns:minmax(0,1fr);gap:0;}
      .pane,.stagecol{position:static;max-height:none;}
      #app[data-m="lib"] .stagecol, #app[data-m="lib"] .insp,
      #app[data-m="edit"] .stagecol, #app[data-m="edit"] .libp,
      #app[data-m="prev"] .libp, #app[data-m="prev"] .insp{display:none;}
      .stage{height:auto;padding:10px;min-height:0;} .stage canvas{max-height:70vh;}
      .bar .nm{max-width:100%;flex-basis:100%;}
      .mbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);}
      .mbar .b{padding:10px 4px;}
      .mbar .b.on{border-color:var(--accent);background:var(--accent-soft);}
    }
    @media(max-width:640px){
      input,select,textarea{font-size:16px;}
      .rows{max-height:none;}
      .row{display:flex!important;flex-wrap:wrap;gap:4px;padding:6px 5px;}
      .row .n{flex:0 0 20px;}
      .row input{flex:1 1 calc(50% - 20px);min-width:0;font-size:16px;}
      .row button{flex:0 0 32px;height:30px;font-size:15px;}
      .seg button{padding:9px 12px;}
      h1{font-size:24px;}
    }
  </style>
</head>
<body>
<script src="tdc-nav.js?v=80"></script>

<div id="gate" class="gate hide">
  <div class="eyebrow">Owner only</div>
  <h1>Social Studio</h1>
  <p class="sub">Sign in with the owner account to make post graphics. <a href="signin.html?next=social.html">Sign in →</a></p>
</div>

<div id="app" class="wrap hide" data-m="prev">
  <div class="top">
    <div><div class="eyebrow">Owner tools</div><h1>Social Studio</h1></div>
    <div class="sub">Pick a graphic, load the data, edit anything. Edits save in this browser.</div>
  </div>

  <div class="grid">
    <!-- 1. LIBRARY: every graphic + every data post, grouped and searchable -->
    <aside class="pane libp">
      <div class="pane-h"><div class="pane-t">Graphics</div><input class="lib-q" id="libQ" type="search" placeholder="Search graphics…"></div>
      <div class="lib" id="tplSeg"></div>
    </aside>

    <!-- 2. PREVIEW -->
    <div class="stagecol">
      <div class="bar">
        <div class="nm" id="curName">Graphic</div>
        <select id="size" title="Size">
          <option value="igp">Instagram 4:5</option>
          <option value="igs">Square 1:1</option>
          <option value="x">X 16:9</option>
          <option value="story">Story 9:16</option>
        </select>
        <select id="theme" title="Look"><option value="light">Light</option><option value="dark">Dark</option></select>
        <button class="b" id="shareBtn">Share</button>
        <button class="b primary" id="dlBtn">Download PNG</button>
      </div>
      <div class="stage" id="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
      <div class="pager" id="pager" hidden><button class="b sm" id="pgPrev" aria-label="Previous page">‹</button><span id="pgLbl"></span><button class="b sm" id="pgNext" aria-label="Next page">›</button></div>
    </div>

    <!-- 3. INSPECTOR: the graphic's own settings (folding sections) + publish -->
    <aside class="pane insp panel">
      <div class="pane-h"><div class="pane-t">Edit</div><div class="status" id="status"></div></div>
      <div class="body">
        <div id="editor"></div>
        <details class="sec" data-sec="Publish" open><summary>Publish</summary><div class="sb">
          <label class="chk" style="margin-top:0"><input type="checkbox" id="shots"> Player headshots</label>
          <label class="chk"><input type="checkbox" id="brandLogo"> Our logo in the top left</label>
          <label class="f" for="handle">Handle shown on graphics</label>
          <input id="handle" placeholder="@yourhandle">
          <label class="f" for="caption">Caption</label>
          <textarea id="caption"></textarea>
          <div class="btns"><button class="b sm" id="copyBtn">Copy caption</button></div>
        </div></details>
      </div>
    </aside>
  </div>
  <div class="mbar"><button class="b" id="mLib">Graphics</button><button class="b" id="mEdit">Edit</button><button class="b on" id="mPrev">Preview</button><button class="b primary" id="mSave">Save</button></div>
</div>

<datalist id="tmList"></datalist>
<datalist id="plList"></datalist>

<script>
(function(){
  var SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  var SIZES={ x:[1600,900], igp:[1080,1350], igs:[1080,1080], story:[1080,1920] };
  var THEMES={
    light:{ bg:'#F7F6F2', text:'#15130F', text2:'#3B3830', mut:'#86827A', line:'#D6D2C8', alt:'rgba(0,0,0,.028)', acc:'#A8843C', chip:'#ECEAE4' },
    dark:{ bg:'#0B0F19', text:'#EEF1F7', text2:'#C9CFDC', mut:'#7A849A', line:'rgba(255,255,255,.12)', alt:'rgba(255,255,255,.03)', acc:'#E6D5A8', chip:'#161C2B' }
  };
  var SITE='thedepthchartcbb.com', SEASON='2026-27';
  var $=function(id){ return document.getElementById(id); };
  var cv=$('cv'), ctx=cv.getContext('2d'), P=THEMES.light;

  // UI gate only (all data here is public); localhost skips it so the page can be previewed locally.
  function isOwner(){ if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return true; try{ return !!(window.tdcOwnerToken && tdcOwnerToken()); }catch(e){ return false; } }
  if(!isOwner()){ $('gate').classList.remove('hide'); return; }
  $('app').classList.remove('hide');
  function status(t,err){ var s=$('status'); s.textContent=t||''; s.className='status'+(err?' err':''); }

  // ── persisted state: each template keeps its own editable document ──
  var LS='tdc_social_v2';
  var S=(function(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } })() || {};
  S.tpl=(S.tpl&&S.tpl!=='player')?S.tpl:'list'; S.size=S.size||'igp'; S.theme=S.theme||'light'; S.shots=!!S.shots; S.handle=S.handle||''; if(S.brandLogo==null) S.brandLogo=true;
  S.docs=S.docs||{};
  function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

  // ── data ──
  var D={ ratings:null, players:null, byEspn:{}, board:null, awards:null };
  async function ratings(){ if(!D.ratings){ var r=await TDC_RATINGS.get(); D.ratings=(r&&r.teams)||[]; } return D.ratings; }
  async function players(){
    if(D.players) return D.players;
    status('Loading players…');
    var out=[], from=0, step=1000;
    while(true){
      var r=await fetch(SB+'/rest/v1/players?select=*&order=id.asc',{ headers:{ apikey:KEY, Authorization:'Bearer '+KEY, Range:from+'-'+(from+step-1), 'Range-Unit':'items' } });
      var d=await r.json(); if(!Array.isArray(d)) break;
      out=out.concat(d); if(d.length<step) break; from+=step;
    }
    await TDCProjGrade.ready; try{ await TDC_ARCH.ready; }catch(e){}
    out.forEach(function(p){ if(p.espn_id) D.byEspn[p.espn_id]=p; });
    D.players=out; status('');
    var seen={}, html=[]; out.forEach(function(p){ if(!p.name) return; var k=p.name+' — '+p.team; if(seen[k]) return; seen[k]=1; html.push('<option value="'+esc(k)+'">'); });
    $('plList').innerHTML=html.join('');
    return out;
  }
  async function dna(){ if(!D.dna){ var r=await fetch('scripts/data/team_dna.json'); var j=await r.json(); D.dna=(j['2027']&&j['2027'].teams)||{}; } return D.dna; }
  async function bigBoard(){
    if(D.board) return D.board;
    status('Building the Big Board…');
    var teamMap={}; var tr=await fetch(SB+'/rest/v1/teams?select=*',{ headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
    (await tr.json()).forEach(function(t){ teamMap[t.name]=t; });
    var pool=window.TDCPool?await TDCPool.get():[];
    var res=await TDC_BIGBOARD.board(pool,teamMap); D.board=res.prospects||[]; status(''); return D.board;
  }
  function findPlayer(name,team){
    if(!D.players||!name) return null; name=name.trim().toLowerCase(); team=(team||'').trim().toLowerCase();
    var hit=null; D.players.some(function(p){ var n=(p.name||'').toLowerCase(); if(n!==name) return false;
      if(!team||(p.team||'').toLowerCase()===team||(colorKey(p.team)===colorKey(team))){ hit=p; return true; } if(!hit) hit=p; return false; });
    return hit;
  }
  function colorKey(t){ var c=window.tdcTeamColor&&tdcTeamColor(t); return c&&c.logo||''; }
  function school(t){ return (window.tdcShortSchool?tdcShortSchool(t):t)||t||''; }
  var CONF={ 'BIG-12':'Big 12','B10':'Big Ten','PAC-12':'Pac-12','Big-East':'Big East','A10':'A-10','MWC':'Mountain West','Mountain West Conference':'Mountain West',
    'AAC':'American','Big West Conference':'Big West','Mid-American Conference':'MAC','Patriot League':'Patriot','Northeast Conference':'NEC',
    'Coastal Athletic Association':'CAA','Atlantic Sun Conference':'ASUN','Southland Conference':'Southland','Southwestern Athletic Conference':'SWAC',
    'Mid-Eastern Athletic Conference':'MEAC','AEC':'America East','CUSA':'C-USA' };
  function confName(c){ c=c||''; return CONF[c]||c.replace(/ Conference$/,''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  // ── drawing primitives ──
  var IMG={};
  function img(url){ if(!url) return Promise.resolve(null); if(IMG[url]) return IMG[url];
    return IMG[url]=new Promise(function(res){ var i=new Image(); i.crossOrigin='anonymous'; i.onload=function(){ res(i.naturalWidth>2?i:null); }; i.onerror=function(){ res(null); }; i.src=url; }); }
  function logoUrl(team){ var c=window.tdcTeamColor&&tdcTeamColor(team); return c&&c.logo||null; }
  function shotUrl(espn){ return espn?'https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/'+espn+'.png':null; }
  function tcol(team){ var c=window.tdcTeamColor&&tdcTeamColor(team); return (c&&c.c1)||P.acc; }
  function font(w,px,serif){ return w+' '+Math.max(8,Math.round(px))+'px '+(serif==='cond'?'"Barlow Condensed", "Arial Narrow", sans-serif':serif==='barlow'?'Barlow, Inter, system-ui, sans-serif':serif?'"Playfair Display", Georgia, serif':'Barlow, Inter, system-ui, sans-serif'); }   // Barlow everywhere = the sheet look (Oct 14 2026)
  function txt(t,x,y,o){ o=o||{}; t=String(t==null?'':t); ctx.save(); if('letterSpacing' in ctx) ctx.letterSpacing=(o.ls||0)+'px';
    var px=o.px||20; ctx.font=font(o.w||500,px,o.serif); if(o.max){ while(ctx.measureText(t).width>o.max && px>9){ px-=.5; ctx.font=font(o.w||500,px,o.serif); } }
    ctx.fillStyle=o.c||P.text; ctx.textAlign=o.al||'left'; ctx.textBaseline=o.bl||'middle'; ctx.fillText(t,x,y); ctx.restore(); return px; }
  function width(t,w,px,serif){ ctx.font=font(w,px,serif); return ctx.measureText(String(t)).width; }
  // a row's name + its small grey note (opponent, scrimmage count, class…): the NAME keeps its size (owner, Oct 2026:
  // "none of the names shrunk by who they played"); the note sits beside it when it fits, else on a line under it
  // (or, with no room for a second line, shrinks/ellipsises beside it). Returns the name's font size.
  function nameTag(name,tag,x,y,nfs,nmax,u,twoLine){
    var nwid=width(name,700,nfs,'barlow');
    if(!tag){ return txt(name,x,y,{ w:700,px:nfs,serif:'barlow',c:P.text,max:nmax }); }
    var tpx=nfs*.5, rest=nmax-Math.min(nwid,nmax)-6*u;
    if(twoLine!==2&&width(tag,700,tpx,'barlow')<=rest){ var f=txt(name,x,y,{ w:700,px:nfs,serif:'barlow',c:P.text,max:nmax }); txt(tag,x+width(name,700,f,'barlow')+6*u,y-f*.34,{ w:700,px:tpx,serif:'barlow',c:P.mut }); return f; }
    if(twoLine){ var f2=txt(name,x,y-nfs*.26,{ w:700,px:nfs,serif:'barlow',c:P.text,max:nmax }); txt(tag,x,y+nfs*.5,{ w:700,px:tpx,serif:'barlow',c:P.mut,max:nmax }); return f2; }

  // ════════════════ charts: original data, drawn as clean shareable graphics ════════════════
  var J={};   // fetched data files, by path
  async function json(path){ if(!J[path]){ var r=await fetch(path); if(!r.ok) throw new Error('Couldn’t load '+path); J[path]=await r.json(); } return J[path]; }
  function confOfFull(full){ var t=(D.ratings||[]).find(function(x){ return x.full===full||x.team===full; })||(D.ratings||[]).find(function(x){ return tkey(x.team)===tkey(full); }); return t?confName(t.conf):''; }
  // TEAM / CONFERENCE scope (Oct 2026): every chart can be cut to a conference and a team. The data files spell teams
  // three ways ("Villanova Wildcats", "Villanova", the sheet short name) — tkey() folds them to one key.
  function tkey(t){ return String(school(t)||t||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
  function onTeam(t,sel){ return !sel||tkey(t)===tkey(sel); }
  // THIS season's school for a player (players table, 2026-27 rosters). Last-season charts (crunch time, on/off, the
  // genome) filtered by a team should show THAT team's 2026-27 roster — each man's numbers from wherever he played —
  // not whoever wore the jersey last year (owner, Oct 14 2026).
  function nowTeam(espn){ var p=espn!=null?D.byEspn[espn]:null; return p?p.team:null; }
  function moved(prev,now){ return now&&prev&&tkey(prev)!==tkey(now)?school(prev)+' \u2192 '+school(now):''; }
  function scopeUI(d,o){ o=o||{};
    return '<div class="two">'+(o.noConf?'':'<div><label class="f">Conference</label><select data-k="conf">'+confOpts(d.conf)+'</select></div>')+
      '<div><label class="f">'+(o.hl?'Highlight a team':'Team')+'</label><input data-k="team" list="tmList" value="'+esc(d.team||'')+'" placeholder="'+(o.hl?'None':'All teams')+'"></div></div>'+
      (o.hint?'<div class="hint">'+o.hint+'</div>':''); }
  // titles name the scope they were loaded for: "Duke: …" for a team, " · ACC" on the subtitle for a conference
  function scopeTitle(d,base,sub){ d.title=(d.team?school(d.team)+': ':'')+base; d.subtitle=sub+(!d.team&&d.conf?' · '+d.conf:''); }
  // scatter highlight: the team's point(s) drawn last, ringed and always labelled; added if the filter left them out
  function highlight(pts,team,extra,lab){ if(!team) return; var hit=pts.filter(function(p){ return onTeam(p.team,team); });
    if(!hit.length&&extra) hit=[].concat(extra()||[]).filter(Boolean).map(function(p){ pts.push(p); return p; });
    hit.forEach(function(p){ p.hl=1; p.lab=lab?lab(p):(p.lab||school(p.team)); }); }
  function niceTicks(lo,hi,n){ var span=hi-lo, step=Math.pow(10,Math.floor(Math.log10(span/n))), e=span/n/step; step*=e>=5?10:e>=2?5:e>=1?2:1;
    var out=[]; for(var v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6)); return out; }
  function pctColor(p){ // red (low) → grey (mid) → green (high), like the site's sheet scale
    var lo=[200,70,60], mid=[150,150,150], hi=[40,150,80], a=p<50?lo:hi, b=mid, t=Math.abs(p-50)/50;
    return 'rgb('+[0,1,2].map(function(i){ return Math.round(b[i]+(a[i]-b[i])*t); }).join(',')+')'; }
  function fieldsEditor(rows,path,fields){

        '<button data-act="up" data-path="'+path+'" data-i="'+i+'">↑</button><button data-act="down" data-path="'+path+'" data-i="'+i+'">↓</button><button data-act="del" data-path="'+path+'" data-i="'+i+'">✕</button></div>';

  }
  function textEditor(d){ return '<h3>Text</h3><label class="f">Title</label><input data-k="title" value="'+esc(d.title)+'">'+

  function noteLine(W,u,pad,fTop,note){ if(!note||LK.hideSrc) return 0; txt(String(note).toUpperCase(),pad,fTop-17*u,{ w:600,px:13*u,c:P.mut,ls:1.2*u,max:W-pad*2 }); return 36*u; }

  // scatter with logo / headshot dots, median guides, corner labels and de-overlapped name labels
  async function scatter(W,H,u,pad,y0,fTop,o){
    var pts=o.pts; await preload(pts);
    var L=pad+56*u, R=W-pad-8*u, Tp=y0+16*u, B=fTop-70*u;
    var xs=pts.map(function(p){ return p.x; }), ys=pts.map(function(p){ return p.y; });
    var x0=o.xmin!=null?o.xmin:Math.min.apply(null,xs), x1=o.xmax!=null?o.xmax:Math.max.apply(null,xs), y0d=o.ymin!=null?o.ymin:Math.min.apply(null,ys), y1d=o.ymax!=null?o.ymax:Math.max.apply(null,ys);
    var px=(x1-x0)*.07||1, py=(y1d-y0d)*.07||1; if(o.xmin==null){ x0-=px; x1+=px; } if(o.ymin==null){ y0d-=py; y1d+=py; }
    var X=function(v){ return L+(R-L)*(v-x0)/(x1-x0); }, Y=function(v){ var t=(v-y0d)/(y1d-y0d); return o.yInvert?Tp+(B-Tp)*t:B-(B-Tp)*t; };
    // grid + ticks
    ctx.lineWidth=Math.max(1,u);
    niceTicks(x0,x1,6).forEach(function(v){ var x=X(v); ctx.strokeStyle=P.line; ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(x,Tp); ctx.lineTo(x,B); ctx.stroke(); ctx.globalAlpha=1;
      txt(o.fmtX?o.fmtX(v):v,x,B+18*u,{ w:600,px:14*u,c:P.mut,al:'center' }); });
    niceTicks(y0d,y1d,6).forEach(function(v){ var y=Y(v); ctx.strokeStyle=P.line; ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke(); ctx.globalAlpha=1;
      txt(o.fmtY?o.fmtY(v):v,L-10*u,y,{ w:600,px:14*u,c:P.mut,al:'right' }); });
    txt(o.xLabel,(L+R)/2,B+46*u,{ w:800,px:15*u,c:P.text2,al:'center',ls:1.5*u });
    ctx.save(); ctx.translate(pad+10*u,(Tp+B)/2); ctx.rotate(-Math.PI/2); txt(o.yLabel,0,0,{ w:800,px:15*u,c:P.text2,al:'center',ls:1.5*u }); ctx.restore();
    // median guides

    var mx=o.midX!=null?o.midX:med(xs), my=o.midY!=null?o.midY:med(ys);
    if(!o.noMed){ ctx.save(); ctx.setLineDash([6*u,6*u]); ctx.strokeStyle=P.acc; ctx.lineWidth=Math.max(1.2,1.5*u);
      ctx.beginPath(); ctx.moveTo(X(mx),Tp); ctx.lineTo(X(mx),B); ctx.moveTo(L,Y(my)); ctx.lineTo(R,Y(my)); ctx.stroke(); ctx.restore(); }
    if(o.line){ var k=o.line.k, b0=o.line.b||0, fy=function(x){ return k*x+b0; };   // y = k·x + b across the visible window
      ctx.save(); ctx.beginPath(); ctx.rect(L,Tp,R-L,B-Tp); ctx.clip(); ctx.setLineDash([8*u,6*u]); ctx.strokeStyle=P.acc; ctx.lineWidth=Math.max(1.5,2*u);
      ctx.beginPath(); ctx.moveTo(X(x0),Y(fy(x0))); ctx.lineTo(X(x1),Y(fy(x1))); ctx.stroke(); ctx.restore();
      if(o.line.label){ var lx2=k>0?Math.min(x1,(y1d-b0)/k):x1; lx2=x0+(lx2-x0)*.94; txt(o.line.label.toUpperCase(),X(lx2),Y(fy(lx2))-12*u,{ w:800,px:13*u,c:P.acc,al:'right',ls:1.2*u }); } }
    // dots: lowest-priority first so the stars sit on top
    var s=o.dot||Math.max(26*u,Math.min(54*u,(R-L)/Math.sqrt(pts.length)/3.2));
    var order=pts.slice().sort(function(a,b){ return (a.hl?1e9:(a.pri||0))-(b.hl?1e9:(b.pri||0)); });
    for(var i=0;i<order.length;i++){ var p=order[i], ss=p.hl?s*1.3:s;
      if(p.hl){ ctx.save(); ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),ss*.62,0,Math.PI*2); ctx.fillStyle=P.bg; ctx.fill(); ctx.lineWidth=Math.max(2,3*u); ctx.strokeStyle=P.acc; ctx.stroke(); ctx.restore(); }
      await mark(p,X(p.x)-ss/2,Y(p.y)-ss/2,ss); }

    [[0,L+cp,Tp+cp,'left','top'],[1,R-cp,Tp+cp,'right','top'],[2,L+cp,B-cp,'left','bottom'],[3,R-cp,B-cp,'right','bottom']].forEach(function(c){
      var t=cl[c[0]]; if(!t) return; t=t.toUpperCase(); var w=width(t,800,cfs)+cfs*.15*t.length*.1+14*u, h=cfs+10*u;
      var bx=c[3]==='left'?c[1]-7*u:c[1]-w+7*u, by=c[4]==='top'?c[2]-5*u:c[2]-h+5*u;

  // horizontal bars (diverging when values go negative), one row per item
  async function hbars(W,H,u,pad,y0,fTop,rows,o){
    rows=rows.filter(function(r){ return r.name&&isFinite(parseFloat(r.val)); }); await preload(rows.filter(function(r){ return r.team; }));
    var n=rows.length; if(!n){ txt('No rows',W/2,(y0+fTop)/2,{ px:26*u,c:P.mut,al:'center' }); return; }
    var vals=rows.map(function(r){ return parseFloat(r.val); }), mx=Math.max.apply(null,vals.map(Math.abs))||1, neg=vals.some(function(v){ return v<0; });
    var rh=Math.min((fTop-y0-(o.legend?36*u:8*u))/n,150*u), fs=Math.min(rh*.3,30*u), ms=rows.some(function(r){ return r.team; })?Math.min(rh*.62,fs*2):0;
    var labW=Math.min((W-pad*2)*.42, Math.max.apply(null,rows.map(function(r){ return width(r.name,700,fs); }))+ms+24*u);
    var vw=width('-00.0',800,fs*.92)+14*u, bx0=pad+labW, bx1=W-pad-vw, zero=neg?(bx0+vw+bx1)/2:bx0, half=neg?(bx1-bx0-vw)/2:(bx1-bx0);   // room for the value label on either side
    if(o.legend){ txt(o.legend[0].toUpperCase(),neg?zero-12*u:bx0,y0+12*u,{ w:800,px:13*u,c:P.mut,al:neg?'right':'left',ls:1.5*u }); if(neg) txt(o.legend[1].toUpperCase(),zero+12*u,y0+12*u,{ w:800,px:13*u,c:P.mut,ls:1.5*u }); }
    var ry=y0+(o.legend?36*u:8*u);
    ctx.fillStyle=P.line; ctx.fillRect(zero,ry,Math.max(1,1.5*u),n*rh);
    for(var i=0;i<n;i++){ var r=rows[i], v=vals[i], top=ry+i*rh, mid=top+rh/2;
      if(ms) await mark(r,pad,mid-ms/2,ms);
      var lx=pad+(ms?ms+12*u:0);
      if(r.sub&&rh>fs*2){ txt(r.name,lx,mid-fs*.32,{ w:700,px:fs,max:labW-(lx-pad)-10*u }); txt(r.sub,lx,mid+fs*.58,{ w:500,px:fs*.6,c:P.mut,max:labW-(lx-pad)-10*u }); }
      else txt(r.name,lx,mid,{ w:700,px:fs,max:labW-(lx-pad)-10*u });

    }
  }

  // ── Contender quadrant: offense vs defense, every team as its logo ──
  T.quad={
    defaults:function(){ return { src:'proj', conf:'', n:40, title:'Who’s Built Like a Contender?', subtitle:SEASON+' projected offense vs. defense', note:'Points per 100 possessions · lines = group median', labels:12 }; },
    load:async function(d){ d.title=d.title||this.defaults().title; },

    },
    draw:async function(d,W,H,u,pad){
      bg(W,H); var rs=await ratings(), pts=[];

        var q=await json('scripts/data/chart_quadrant.json');

          .forEach(function(t,i){ pts.push({ x:t.ortg, y:t.drtg, team:t.team, lab:school(t.team), pri:100-i }); });

        var dn=await dna();

          .forEach(function(t,i){ var x=dn[t.full]||dn[t.team]; if(x&&x.ORtg!=null) pts.push({ x:x.ORtg, y:x.DRtg, team:t.team, lab:school(t.full||t.team), pri:100-i }); });
      }

      highlight(pts,d.team,function(){
        if(d.src==='last'){ var t=(J['scripts/data/chart_quadrant.json']||[]).find(function(x){ return onTeam(x.team,d.team); }); return t&&{ x:t.ortg, y:t.drtg, team:t.team }; }

        corners:['Defense-first','Elite both ends','Below median both ends','Offense-first'] });
      var both=pts.filter(function(p){ return p.x>pts.map(function(q){ return q.x; }).sort(function(a,b){ return a-b; })[Math.floor(pts.length/2)]; });
      return d.title+'\n\n'+d.subtitle+'. Top-right = elite on both ends.\n\n'+SITE+'\n\n#CollegeBasketball #CBB #Analytics';
    }

  // ── Shot Genome: Shot-Making (SM+) vs Creation, our own shot-quality stats ──

    defaults:function(){ return { conf:'', n:30, minFga:200, labels:14, title:'The Shot Genome', subtitle:'Who makes tough shots, and who creates them · 2025-26', note:'Shot-making = points over expected per 100 shots · Creation = expected points created for teammates · competition-adjusted' }; },

  function confOpts(sel,req){ return (req?'':'<option value="">All of D-I</option>')+CONFS.map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'; }).join(''); }
  function rowsEditor(rows,path,withVal,withVal2){

        '<input data-p="'+path+'.'+i+'.name" list="plList" value="'+esc(r.name)+'" placeholder="Name">'+

    }).join('')+'</div>';
  }
  function getPath(o,p){ return p.split('.').reduce(function(a,k){ return a&&a[k]; },o); }
  function setPath(o,p,v){ var ks=p.split('.'), last=ks.pop(), t=ks.reduce(function(a,k){ return a[k]; },o); t[last]=v; }
  function doc(){ var t=S.tpl; if(!S.docs[t]) S.docs[t]=T[t].defaults(); return S.docs[t]; }

  // charts with editable rows keep a snapshot from their last load; say how old it is
  // LOAD_VER: bump whenever a chart's or post's loader changes what it puts in the rows (columns, order, maths). A saved

  // owner without clicking "Load / refresh data" (Oct 2026: the scrimmage scoreboard kept the old Margin rows).
  var LOAD_VER='2026-10-20r';
  function stamp(d){ if(d&&(Array.isArray(d.rows)||Array.isArray(d.starters))){ d.loadedAt=new Date().toISOString().slice(0,10); d._lv=LOAD_VER; d._edited=false; } }
  function paintEditor(){ var d=doc(), h=T[S.tpl].editor(d);
    if(d.loadedAt&&Array.isArray(d.rows)&&d.rows.length){ var age=Math.round((Date.now()-new Date(d.loadedAt+'T12:00:00'))/864e5);
      h+='<div class="hint" style="margin-top:10px">Rows last loaded '+(age<=0?'today':age===1?'yesterday':age+' days ago')+'. Load again to pick up the site’s latest numbers (replaces your row edits).</div>'; }
    $('editor').innerHTML=h; foldEditor(); }
  $('editor').addEventListener('input',function(e){
    var el=e.target, d=doc();
    if(el.dataset.k){ d[el.dataset.k]=el.type==='checkbox'?(el.dataset.neg?!el.checked:el.checked):el.value;
      if(el.type==='range'){ var sp=el.previousElementSibling&&el.previousElementSibling.querySelector('span'); if(sp) sp.textContent=el.value+'%'; } }
    else if(el.dataset.p){ setPath(d,el.dataset.p,el.value); if(/^(rows|starters|bench)\./.test(el.dataset.p)) d._edited=true;
      // a renamed player row re-resolves its headshot by name (+team)
      var mn=el.dataset.p.match(/^rows\.(\d+)\.n(\d)$/); if(mn){ var rr2=d.rows[+mn[1]], pp=findPlayer(el.value,rr2&&rr2.team)||findPlayer(el.value); if(rr2) rr2['e'+mn[2]]=pp&&pp.espn_id?String(pp.espn_id):''; }
      var m=el.dataset.p.match(/^(.*)\.(\d+)\.(name|team)$/);
      if(m){ var r=getPath(d,m[1]+'.'+m[2]); if(r&&typeof r==='object'&&!Array.isArray(r)){ var p=findPlayer(r.name,r.team); r.espn=p?p.espn_id:null; } } }
    else return;
    save(); later();
  });
  $('editor').addEventListener('change',function(e){ var el=e.target; if(el.dataset.k) doc()[el.dataset.k]=el.type==='checkbox'?(el.dataset.neg?!el.checked:el.checked):el.value;
    if(el.type==='checkbox'||el.tagName==='SELECT'){ save(); render(); }
    if(e.target.dataset.k==='val2Label'){ paintEditor(); }
    var ks=AUTO[S.tpl]; if(ks&&ks.indexOf(e.target.dataset.k)>-1){ (async function(){ try{ await T[S.tpl].load(doc()); stamp(doc()); save(); paintEditor(); paintLib(); render(); }catch(err){ status(err.message,true); } })(); } });
  $('editor').addEventListener('click',async function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return; var d=doc(), act=b.dataset.act, arr=b.dataset.path?getPath(d,b.dataset.path):null, i=+b.dataset.i;
    if(act!=='load'&&/^(rows|starters|bench)$/.test(b.dataset.path||'')) d._edited=true;
    if(act==='load'){ b.disabled=true; try{ await T[S.tpl].load(d); stamp(d); save(); paintEditor(); await render(); status('Loaded. Edit anything below.'); }catch(err){ status(err.message,true); } b.disabled=false; return; }
    if(act==='up'&&i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; }
    if(act==='down'&&i<arr.length-1){ var t2=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t2; }

    if(act==='add'){ arr.push({ name:'', team:'', val:'' }); }
    if(act==='clear'){ arr.length=0; }
    if(act==='tcol'){ var tc2=(d.cols||[]).slice(), ti=tc2.indexOf(b.dataset.col); if(ti>-1) tc2.splice(ti,1); else tc2.push(b.dataset.col); d.cols=TCOLS.map(function(x){ return x[0]; }).filter(function(k){ return tc2.indexOf(k)>-1; }); }
    if(act==='col'){ var cs=(d.cols||DSTATS_DEF).slice(), ci=cs.indexOf(b.dataset.col); if(ci>-1) cs.splice(ci,1); else cs.push(b.dataset.col); d.cols=DSTATS_ALL.map(function(x){ return x[0]; }).filter(function(k){ return cs.indexOf(k)>-1; }); }
    // column toggles on the sheet graphics, kept in their list's order
    if(act==='lcol'||act==='hcol'||act==='mcol'){ var L0=act==='lcol'?LCOLS:act==='hcol'?HCOLS:TMCOLS, c3=(d.cols||[]).slice(), i3=c3.indexOf(b.dataset.col); if(i3>-1) c3.splice(i3,1); else c3.push(b.dataset.col); d.cols=L0.map(function(x){ return x[0]; }).filter(function(k){ return c3.indexOf(k)>-1; }); }
    if(act==='scol'){ var sc=(d.cols&&d.cols.length?d.cols:['date','venue','line','win']).slice(), si=sc.indexOf(b.dataset.col); if(si>-1) sc.splice(si,1); else sc.push(b.dataset.col); d.cols=SCOLS.map(function(x){ return x[0]; }).filter(function(k){ return sc.indexOf(k)>-1; }); }
    if(act==='ssum'){ var sm=(d.sumKeys||['exp','range','pick','conf']).slice(), mi=sm.indexOf(b.dataset.col); if(mi>-1) sm.splice(mi,1); else sm.push(b.dataset.col); d.sumKeys=SSUM.map(function(x){ return x[0]; }).filter(function(k){ return sm.indexOf(k)>-1; }); }
    if(act==='pcol'){ var pc=(d.cols||[]).filter(function(c){ return c.k===b.dataset.col; })[0]; if(pc){ d.colOn=d.colOn||{}; d.colOn[pc.k]=postCols(d).indexOf(pc)<0; } }
    if(act==='tcreset'){ d.tcolor=''; }
    if(act==='pmet'||act==='pmetall'||act==='pmetdef'){ var pm=(d.mets||PMET_DEF).slice();
      if(act==='pmet'){ var pi=pm.indexOf(b.dataset.col); if(pi>-1) pm.splice(pi,1); else pm.push(b.dataset.col); } d.mets=act==='pmetall'?PMET.map(function(x){ return x.k; }):act==='pmetdef'?PMET_DEF.slice():PMET.map(function(x){ return x.k; }).filter(function(k){ return pm.indexOf(k)>-1; });
      if(d.name){ try{ await T.pcard.load(d); }catch(err){ status(err.message,true); } } }
    if(act==='acol'){ var a4=(d.tcols||['ppg','rpg','apg']).slice(), i4=a4.indexOf(b.dataset.col); if(i4>-1) a4.splice(i4,1); else a4.push(b.dataset.col); d.tcols=DSTATS_ALL.map(function(x){ return x[0]; }).filter(function(k){ return a4.indexOf(k)>-1; }); }
    if(act==='addaward'){ d.awards.push({ label:'Award', name:'', team:'' }); }
    save(); paintEditor(); render();
  });

  // ── render ──
  var busy=0, pend=false, deb;
  function later(){ clearTimeout(deb); deb=setTimeout(render,220); }
  // draw one page off-screen; returns the finished canvas + caption (render shows it, export saves every page)
  async function frame(pg){
    P=THEMES[S.theme]||THEMES.light;
    var sz=SIZES[S.size]||SIZES.igp, W=sz[0], H=sz[1];
    var off=document.createElement('canvas'); off.width=W; off.height=H; ctx=off.getContext('2d');
    var u=Math.min(W,H)/1080, pad=Math.round(56*u);
    await Promise.all(['800 40px "Playfair Display"','800 40px "Barlow Condensed"','900 40px Barlow','800 40px Barlow','700 40px Barlow','600 40px Barlow','500 40px Barlow','900 20px Inter','800 20px Inter','700 20px Inter','600 20px Inter','500 20px Inter'].map(function(f){ return document.fonts.load(f).catch(function(){}); }));
    LK=doc(); BRANDED=false; var t=T[S.tpl];
    PGN=t.pages?Math.max(1,+t.pages(doc(),W,H,u,pad)||1):1; PG=Math.max(0,Math.min(+pg||0,PGN-1));
    var cap=await t.draw(doc(),W,H,u,pad);
    if(S.brandLogo!==false&&!t.ownBrand&&!BRANDED) brandMark(W-pad*.45-brandSize(u),pad*.45,brandSize(u));   // top right, as on the sheet titles
    return { c:off, cap:cap, pg:PG, n:PGN };
  }
  async function render(){
    if(busy){ pend=true; return; } busy=1;
    try{
      // drawn off-screen and swapped in, so a half-loaded graphic never shows (or exports)
      var f=await frame(S.page||0); S.page=f.pg;
      cv.width=f.c.width; cv.height=f.c.height; cv.getContext('2d').drawImage(f.c,0,0);
      $('caption').value=f.cap||''; pager(f.pg,f.n);
    }catch(e){ console.error(e); status(e.message||'Couldn’t draw that graphic.',true); }
    busy=0; if(pend){ pend=false; render(); }
  }
  function pager(pg,n){ var el=$('pager'); el.hidden=n<2; if(n<2){ $('dlBtn').textContent='Download PNG'; return; } $('pgLbl').textContent='Page '+(pg+1)+' of '+n; $('pgPrev').disabled=pg<=0; $('pgNext').disabled=pg>=n-1;
    $('dlBtn').textContent='Download '+n+' PNGs'; }

  // ── controls ──
  // ── LIBRARY (Oct 2026 revamp): every template + every data post as its own entry, grouped and searchable ──
  var LIB=[
    ['Simple tables',[['table','Table','The go-to: roster or stat leaders, yellow lead column'],['list','Ranked list','Numbered list with a value'],['heat','Heat table','Leaders with percentile colours'],['teams','Team table','Team rankings sheet'],['allconf','All-Conference','Projected all-league teams']]],
    ['Charts',[['quad','Contender quadrant','Offense vs defense, every team plotted'],['genome','Shot Genome','Shot quality vs shot-making'],['money','Moneyball','What the transfer market misprices'],['crunch','Crunch time','Who takes over late in games'],['pcard','Player chart','One player\u2019s percentile profile'],['leaders','Percentile leaders','Top players by one stat'],['cards','Card grid','Player cards in a grid'],['onoff','On/Off swings','Biggest on/off impact'],['after','Shot value','What each shot zone is worth'],['nil','NIL value','Market value leaders']]],
    ['Odds',[['odds','POY odds','Award race odds'],['confodds','Conference odds','Title odds by league']]],
    ['Team pages',[['rgrid','Roster grid','Headshot grid: overall, logo and a stat line per player'],['sched','Schedule predictions','Every game: our line + win odds (multi-page)'],['shotchart','Shot chart','A team\u2019s real shot chart, offense + defense'],['move','Transfer move','A transfer at his new school: projection, team + fit'],['depth','Depth chart','A team\u2019s roster sheet'],['lineups','Lineups','Best five-man lineups'],['matchup','Matchup','Two teams side by side']]]
  ];
  function curPostKey(){ var d=S.docs.posts; return d&&d.key; }
  function paintLib(){ var q=(($('libQ')||{}).value||'').trim().toLowerCase(), h='';
    var groups=LIB.map(function(g){ return [g[0],g[1].map(function(x){ return { v:x[0], name:x[1], desc:x[2] }; })]; });
    if(window.TDC_POSTS){ var pg={}, order=[]; TDC_POSTS.list().forEach(function(p){ var gk='Data posts \u00b7 '+(p.group||'Other'); if(!pg[gk]){ pg[gk]=[]; order.push(gk); }
        pg[gk].push({ v:'posts', post:p.key, name:p.label, desc:(p.note||'').split(/\.\s/)[0].slice(0,70) }); });
      order.forEach(function(gk){ groups.push([gk,pg[gk]]); }); }
    var dpHead=false;
    groups.forEach(function(g){ var items=g[1].filter(function(x){ return !q||(x.name+' '+x.desc+' '+g[0]).toLowerCase().indexOf(q)>-1; }); if(!items.length) return;
      var dp=g[0].indexOf('Data posts \u00b7 ')===0;
      h+=dp?((dpHead?'':(dpHead=true,'<div class="lib-g">Data posts</div>'))+'<div class="lib-s">'+esc(g[0].slice(13))+'</div>'):'<div class="lib-g">'+esc(g[0])+'</div>';
      h+=items.map(function(x){ var on=x.v===S.tpl&&(!x.post||x.post===curPostKey());
        return '<button class="lib-i'+(on?' on':'')+'" data-v="'+x.v+'"'+(x.post?' data-post="'+x.post+'"':'')+'><b>'+esc(x.name)+'</b>'+(x.desc?'<span>'+esc(x.desc)+'</span>':'')+'</button>'; }).join(''); });
    $('tplSeg').innerHTML=h||'<div class="lib-empty">No graphic matches that.</div>';
    var on=$('tplSeg').querySelector('.lib-i.on'); $('curName').textContent=on?on.querySelector('b').textContent:'Graphic'; }
  $('libQ').addEventListener('input',paintLib);
  // the editor's <h3> headings become folding sections; which ones are open is remembered per heading
  function foldEditor(){ var ed=$('editor'), kids=[].slice.call(ed.childNodes), out=document.createDocumentFragment(), sec=null, fold=S.fold||(S.fold={});
    kids.forEach(function(n){ if(n.nodeType===1&&n.tagName==='H3'){ var t=n.textContent.trim(), key=t.replace(/\s*\(\d+\)$/,'');
        sec=document.createElement('details'); sec.className='sec'; sec.dataset.sec=key; sec.open=fold[key]!=null?fold[key]:!/^Rows/.test(key);
        sec.innerHTML='<summary></summary><div class="sb"></div>'; sec.firstChild.textContent=t; out.appendChild(sec); return; }
      if(!sec){ sec=document.createElement('details'); sec.className='sec'; sec.dataset.sec='Data'; sec.open=true; sec.innerHTML='<summary>Data</summary><div class="sb"></div>'; out.appendChild(sec); }
      sec.lastChild.appendChild(n); });
    ed.innerHTML=''; ed.appendChild(out); }
  document.addEventListener('toggle',function(e){ var el=e.target; if(el.classList&&el.classList.contains('sec')&&el.dataset.sec&&el.closest('#editor')){ (S.fold=S.fold||{})[el.dataset.sec]=el.open; save(); } },true);
  function syncControls(){ paintLib();
    $('size').value=S.size; $('theme').value=S.theme; $('shots').checked=S.shots; $('handle').value=S.handle; $('brandLogo').checked=S.brandLogo!==false; }
  var AUTO={ rgrid:['team','n'], sched:['team'], shotchart:['team','player','who','season','style'], list:['src','stat','season'], posts:['key','team','conf','n','season','dir','pstat','tier','pcls'], cards:['metric','season','who','minFga','n','conf','team','mix'], leaders:['metric','season','who','minFga','n','conf','team','mix'], heat:['metric','season','n','conf','team','mix'], lineups:['metric','season','minPoss','n','conf','team'], teams:['sort','n','conf'], depth:['team'], table:['src','stat','season','team','conf','n','mix'], money:['mode','n','conf','team'], crunch:['dir','who','n','min','conf','team','sort'], odds:['scope','award','n'], onoff:['metric','season','dir','n','minOn','conf','team'], after:['season','team','conf'], confodds:['conf','n'], nil:['mode','n','minMpg','conf','team'] };   // charts whose rows come from a load
  async function autoLoad(){ var d=doc(), R=d.rows||d.starters;   // depth charts keep their players in starters / bench
    if(AUTO[S.tpl]&&R&&(!R.length||(d._lv!==LOAD_VER&&!d._edited))&&(R.length||!d.starters||d.team)){ try{ await T[S.tpl].load(d); stamp(d); save(); paintEditor(); }catch(e){ status(e.message,true); } } }
  $('tplSeg').addEventListener('click',async function(e){ var b=e.target.closest('button[data-v]'); if(!b) return; S.tpl=b.dataset.v; S.page=0;
    // a data post picked from the library: point the Posts doc at it and load it fresh
    if(b.dataset.post){ var dp=doc(); if(dp.key!==b.dataset.post){ dp.key=b.dataset.post; dp.rows=[]; dp.title=''; dp.cols=[]; } }
    save(); syncControls(); paintEditor(); if(window.innerWidth<=980) mode('prev'); await autoLoad(); syncControls(); render();
    if(S.tpl!=='matchup') players().catch(function(){}); });
  // phones: one pane at a time
  function mode(m){ $('app').dataset.m=m; ['mLib','mEdit','mPrev'].forEach(function(id){ $(id).classList.toggle('on',id==='m'+{lib:'Lib',edit:'Edit',prev:'Prev'}[m]); }); window.scrollTo(0,0); }
  $('mLib').onclick=function(){ mode('lib'); }; $('mEdit').onclick=function(){ mode('edit'); };
  $('size').onchange=function(){ S.size=this.value; save(); render(); };
  $('theme').onchange=function(){ S.theme=this.value; save(); render(); };
  $('shots').onchange=async function(){ S.shots=this.checked; save(); if(S.shots){ await players(); backfillEspn(); } render(); };
  $('brandLogo').onchange=function(){ S.brandLogo=this.checked; save(); render(); };
  $('handle').oninput=function(){ S.handle=this.value; save(); later(); };
  // rows typed or loaded before players were available get their espn ids once the pool lands
  function backfillEspn(){ Object.keys(S.docs).forEach(function(k){ var d=S.docs[k];
    [].concat(d.rows||[],d.awards||[],d.starters||[],d.bench||[],[].concat.apply([],d.teams||[])).forEach(function(r){ if(r&&r.name&&!r.espn){ var p=findPlayer(r.name,r.team); if(p) r.espn=p.espn_id; } }); }); save(); }

  // ── export ──
  function fname(i,n){ return 'tdc-'+S.tpl+'-'+S.size+'-'+new Date().toISOString().slice(0,10)+(n>1?'-p'+(i+1):'')+'.png'; }
  function blobOf(c){ return new Promise(function(res){ c.toBlob(res,'image/png'); }); }
  // every page of the current graphic as PNG files (one file for single-page graphics)
  async function files(){ var n=PGN, cur=S.page||0, out=[];
    if(n<2){ out.push(new File([await blobOf(cv)],fname(0,1),{ type:'image/png' })); return out; }
    for(var i=0;i<n;i++){ var f=await frame(i); out.push(new File([await blobOf(f.c)],fname(i,n),{ type:'image/png' })); }
    await render(); S.page=cur; return out; }
  async function shareFiles(text){ var fs=await files();
    if(navigator.canShare&&navigator.canShare({ files:fs })){ await navigator.share(text?{ files:fs, text:text }:{ files:fs }); return true; } return false; }
  async function downloadAll(){ var fs=await files();
    for(var i=0;i<fs.length;i++){ var a=document.createElement('a'); a.href=URL.createObjectURL(fs[i]); a.download=fs[i].name; a.click(); (function(h){ setTimeout(function(){ URL.revokeObjectURL(h); },4000); })(a.href); if(fs.length>1) await new Promise(function(r){ setTimeout(r,350); }); } }
  $('mPrev').onclick=function(){ mode('prev'); };
  $('pgPrev').onclick=function(){ S.page=Math.max(0,(S.page||0)-1); save(); render(); };
  $('pgNext').onclick=function(){ S.page=(S.page||0)+1; save(); render(); };
  $('mSave').onclick=async function(){ try{ if(await shareFiles()) return; await downloadAll(); }catch(e){ if(e&&e.name!=='AbortError') status('Save failed: '+e.message,true); } };
  $('dlBtn').onclick=async function(){ try{ await downloadAll(); }catch(e){ status('Export failed: '+e.message,true); } };
  $('shareBtn').onclick=async function(){ try{ if(!await shareFiles($('caption').value)) status('Sharing files isn’t supported in this browser. Use Download.',true);
    }catch(e){ if(e.name!=='AbortError') status('Share failed: '+e.message,true); } };
  $('copyBtn').onclick=async function(){ try{ await navigator.clipboard.writeText($('caption').value); }catch(e){ $('caption').select(); document.execCommand('copy'); } status('Caption copied.'); };

  // ── boot ──
  (async function(){
    syncControls(); postsReady().then(paintLib).catch(function(){});
    try{
      var rs=await ratings(), seen={};
      rs.forEach(function(t){ var c=confName(t.conf); if(c&&!seen[c]){ seen[c]=1; CONFS.push(c); } }); CONFS.sort();
      $('tmList').innerHTML=rs.map(function(t){ return '<option value="'+esc(t.team)+'">'; }).join('');
      if(!S.docs.matchup&&rs[0]&&rs[1]){ S.docs.matchup=T.matchup.defaults(); S.docs.matchup.a=rs[0].team; S.docs.matchup.b=rs[1].team; }
    }catch(e){ status('Couldn’t load rankings: '+e.message,true); }
    var d=doc();
    paintEditor();
    // first visit: fill the list with real data so there's something to edit
    if(S.tpl==='list'&&!d.rows.length){ try{ await T.list.load(d); save(); paintEditor(); }catch(e){} }
    await autoLoad();
    render();
    players().then(function(){ if(S.shots){ backfillEspn(); render(); } }).catch(function(){});
  })();
})();
