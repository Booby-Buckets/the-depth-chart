  <script src="team-colors.js?v=11"></script>
  <script src="tdc-injury.js?v=5"></script>
  <script src="tdc-freshman.js?v=pub31"></script>

  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3D;--border2:#36405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;}
    .wrap{max-width:1440px;margin:0 auto;padding:28px 32px 60px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
    h1{font-family:'Playfair Display',serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin:6px 0 4px;}
    .sub{color:var(--text3);font-size:14px;margin-bottom:20px;}
    .grid{display:grid;grid-template-columns:420px minmax(0,1fr);gap:28px;align-items:start;}
    .panel{border:1px solid var(--border);background:var(--bg2);padding:18px;}
    .panel h3{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;}
    .panel h3:first-child{margin-top:0;}
    .seg{display:flex;flex-wrap:wrap;gap:6px;}
    .seg button{font:inherit;font-size:12px;font-weight:700;padding:7px 11px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;}
    .seg button.on{background:var(--accent);border-color:var(--accent);color:#1a1206;}
    label.f{display:block;font-size:11px;font-weight:700;color:var(--text3);margin:10px 0 4px;}
    input,select,textarea{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border2);background:var(--bg);color:var(--text);}
    textarea{min-height:96px;resize:vertical;}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .chk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text2);margin-top:10px;cursor:pointer;}
    .chk input{width:auto;}
    .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .b{font:inherit;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;}
    .b.sm{padding:6px 10px;font-size:11px;}
    .b.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;}
    .b:disabled{opacity:.5;cursor:wait;}
    /* row editor */
    .rows{max-height:460px;overflow:auto;border:1px solid var(--border);background:var(--bg);margin-top:8px;}
    .row{display:grid;grid-template-columns:26px minmax(0,1.4fr) minmax(0,1fr) 62px 22px 22px 22px;gap:4px;align-items:center;padding:3px 5px;border-bottom:1px solid var(--border);}
    .row.nov{grid-template-columns:26px minmax(0,1.4fr) minmax(0,1fr) 22px 22px 22px;}
    .row:last-child{border-bottom:none;}
    .row .n{font-size:12px;font-weight:800;color:var(--text3);text-align:right;padding-right:2px;}
    .row input{padding:5px 6px;font-size:12.5px;border-color:var(--border);}
    .row button{border:none;background:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0;}
    .row button:hover{color:var(--accent);}
    .grp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:14px 0 4px;}
    .stage{border:1px solid var(--border);background:var(--bg3);padding:16px;display:flex;justify-content:center;align-items:center;min-height:300px;position:sticky;top:16px;}
    .stage canvas{max-width:100%;max-height:84vh;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
    .status{font-size:12px;color:var(--text3);margin-top:10px;min-height:16px;}
    .status.err{color:var(--red);}
    .gate{max-width:520px;margin:80px auto;text-align:center;}
    .gate a{color:var(--accent);font-weight:700;}
    .hide{display:none!important;}
    .hint{font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.45;}
    @media(max-width:980px){.grid{grid-template-columns:1fr;} .stage{position:static;} .wrap{padding:20px 16px 48px;}}
  </style>
</head>
<body>
<script src="tdc-nav.js?v=75"></script>

<div id="gate" class="gate hide">
  <div class="eyebrow">Owner only</div>
  <h1>Social Studio</h1>
  <p class="sub">Sign in with the owner account to make post graphics. <a href="signin.html?next=social.html">Sign in →</a></p>
</div>

<div id="app" class="wrap hide">
  <div class="eyebrow">Owner tools</div>
  <h1>Social Studio</h1>
  <div class="sub">Load site data into a graphic, then edit anything: titles, names, order, how many. Edits are saved in this browser.</div>

  <div class="grid">
    <div class="panel">
      <h3>Graphic</h3>
      <div class="seg" id="tplSeg">
        <button data-v="list" class="on">Ranked list</button>
        <button data-v="allconf">All-Conference</button>
        <button data-v="player">Player card</button>
        <button data-v="matchup">Matchup</button>
      </div>

      <div class="two" style="margin-top:4px">
        <div>
          <h3>Size</h3>
          <select id="size">
            <option value="igp">Instagram 4:5 (1080×1350)</option>
            <option value="igs">Instagram 1:1 (1080×1080)</option>
            <option value="x">X 16:9 (1600×900)</option>
            <option value="story">Story 9:16 (1080×1920)</option>
          </select>
        </div>
        <div>
          <h3>Look</h3>
          <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
        </div>
      </div>
      <label class="chk" style="margin-bottom:4px"><input type="checkbox" id="shots"> Player headshots</label>

      <div id="editor"></div>

      <h3>Branding</h3>
      <label class="f" for="handle">Handle shown on graphics</label>
      <input id="handle" placeholder="@yourhandle">

      <div class="btns">
        <button class="b primary" id="dlBtn">Download PNG</button>
        <button class="b" id="shareBtn">Share…</button>
      </div>

      <h3>Caption</h3>
      <textarea id="caption"></textarea>
      <div class="btns"><button class="b sm" id="copyBtn">Copy caption</button></div>
      <div class="status" id="status"></div>
    </div>

    <div>
      <div class="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
    </div>
  </div>
</div>

<datalist id="tmList"></datalist>
<datalist id="plList"></datalist>

<script>
(function(){
  var SB='https://izlqhnxowdhtdofkwrho.supabase.co', KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
  var SIZES={ x:[1600,900], igp:[1080,1350], igs:[1080,1080], story:[1080,1920] };
  var THEMES={
    light:{ bg:'#F7F6F2', text:'#15130F', text2:'#3B3830', mut:'#86827A', line:'#D6D2C8', alt:'rgba(0,0,0,.028)', acc:'#A8843C', chip:'#ECEAE4' },
    dark:{ bg:'#0B0F19', text:'#EEF1F7', text2:'#C9CFDC', mut:'#7A849A', line:'rgba(255,255,255,.12)', alt:'rgba(255,255,255,.03)', acc:'#E6D5A8', chip:'#161C2B' }
  };
  var SITE='thedepthchartcbb.com', SEASON='2026-27';
  var $=function(id){ return document.getElementById(id); };
  var cv=$('cv'), ctx=cv.getContext('2d'), P=THEMES.light;

  // UI gate only (all data here is public); localhost skips it so the page can be previewed locally.
  function isOwner(){ if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return true; try{ return !!(window.tdcOwnerToken && tdcOwnerToken()); }catch(e){ return false; } }
  if(!isOwner()){ $('gate').classList.remove('hide'); return; }
  $('app').classList.remove('hide');
  function status(t,err){ var s=$('status'); s.textContent=t||''; s.className='status'+(err?' err':''); }

  // ── persisted state: each template keeps its own editable document ──
  var LS='tdc_social_v2';
  var S=(function(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } })() || {};
  S.tpl=S.tpl||'list'; S.size=S.size||'igp'; S.theme=S.theme||'light'; S.shots=!!S.shots; S.handle=S.handle||'';
  S.docs=S.docs||{};
  function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

  // ── data ──
  var D={ ratings:null, players:null, byEspn:{}, board:null, awards:null };
  async function ratings(){ if(!D.ratings){ var r=await TDC_RATINGS.get(); D.ratings=(r&&r.teams)||[]; } return D.ratings; }
  async function players(){
    if(D.players) return D.players;
    status('Loading players…');
    var out=[], from=0, step=1000;
    while(true){
      var r=await fetch(SB+'/rest/v1/players?select=*&order=id.asc',{ headers:{ apikey:KEY, Authorization:'Bearer '+KEY, Range:from+'-'+(from+step-1), 'Range-Unit':'items' } });
      var d=await r.json(); if(!Array.isArray(d)) break;
      out=out.concat(d); if(d.length<step) break; from+=step;
    }
    await TDCProjGrade.ready; try{ await TDC_ARCH.ready; }catch(e){}
    out.forEach(function(p){ if(p.espn_id) D.byEspn[p.espn_id]=p; });
    D.players=out; status('');
    var seen={}, html=[]; out.forEach(function(p){ if(!p.name) return; var k=p.name+' — '+p.team; if(seen[k]) return; seen[k]=1; html.push('<option value="'+esc(k)+'">'); });
    $('plList').innerHTML=html.join('');
    return out;
  }
  async function dna(){ if(!D.dna){ var r=await fetch('scripts/data/team_dna.json'); var j=await r.json(); D.dna=(j['2027']&&j['2027'].teams)||{}; } return D.dna; }
  async function bigBoard(){
    if(D.board) return D.board;
    status('Building the Big Board…');
    var teamMap={}; var tr=await fetch(SB+'/rest/v1/teams?select=*',{ headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
    (await tr.json()).forEach(function(t){ teamMap[t.name]=t; });
    var pool=window.TDCPool?await TDCPool.get():[];
    var res=await TDC_BIGBOARD.board(pool,teamMap); D.board=res.prospects||[]; status(''); return D.board;
  }
  function findPlayer(name,team){
    if(!D.players||!name) return null; name=name.trim().toLowerCase(); team=(team||'').trim().toLowerCase();
    var hit=null; D.players.some(function(p){ var n=(p.name||'').toLowerCase(); if(n!==name) return false;
      if(!team||(p.team||'').toLowerCase()===team||(colorKey(p.team)===colorKey(team))){ hit=p; return true; } if(!hit) hit=p; return false; });
    return hit;
  }
  function colorKey(t){ var c=window.tdcTeamColor&&tdcTeamColor(t); return c&&c.logo||''; }
  function school(t){ return (window.tdcShortSchool?tdcShortSchool(t):t)||t||''; }
  var CONF={ 'BIG-12':'Big 12','B10':'Big Ten','PAC-12':'Pac-12','Big-East':'Big East','A10':'A-10','MWC':'Mountain West','Mountain West Conference':'Mountain West',
    'AAC':'American','Big West Conference':'Big West','Mid-American Conference':'MAC','Patriot League':'Patriot','Northeast Conference':'NEC',
    'Coastal Athletic Association':'CAA','Atlantic Sun Conference':'ASUN','Southland Conference':'Southland','Southwestern Athletic Conference':'SWAC',
    'Mid-Eastern Athletic Conference':'MEAC','AEC':'America East','CUSA':'C-USA' };
  function confName(c){ c=c||''; return CONF[c]||c.replace(/ Conference$/,''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  // ── drawing primitives ──
  var IMG={};
  function img(url){ if(!url) return Promise.resolve(null); if(IMG[url]) return IMG[url];
    return IMG[url]=new Promise(function(res){ var i=new Image(); i.crossOrigin='anonymous'; i.onload=function(){ res(i.naturalWidth>2?i:null); }; i.onerror=function(){ res(null); }; i.src=url; }); }
  function logoUrl(team){ var c=window.tdcTeamColor&&tdcTeamColor(team); return c&&c.logo||null; }
  function shotUrl(espn){ return espn?'https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/'+espn+'.png':null; }
  function tcol(team){ var c=window.tdcTeamColor&&tdcTeamColor(team); return (c&&c.c1)||P.acc; }
  function font(w,px,serif){ return w+' '+Math.max(8,Math.round(px))+'px '+(serif?'"Playfair Display", Georgia, serif':'Inter, system-ui, sans-serif'); }
  function txt(t,x,y,o){ o=o||{}; t=String(t==null?'':t); ctx.save(); if('letterSpacing' in ctx) ctx.letterSpacing=(o.ls||0)+'px';
    var px=o.px||20; ctx.font=font(o.w||500,px,o.serif); if(o.max){ while(ctx.measureText(t).width>o.max && px>9){ px-=.5; ctx.font=font(o.w||500,px,o.serif); } }
    ctx.fillStyle=o.c||P.text; ctx.textAlign=o.al||'left'; ctx.textBaseline=o.bl||'middle'; ctx.fillText(t,x,y); ctx.restore(); return px; }
  function width(t,w,px,serif){ ctx.font=font(w,px,serif); return ctx.measureText(String(t)).width; }
  function drawFit(im,x,y,s){ if(!im) return; var r=Math.min(s/im.width,s/im.height); ctx.drawImage(im,x+(s-im.width*r)/2,y+(s-im.height*r)/2,im.width*r,im.height*r); }
  // headshot in a circle (ESPN shots are transparent PNGs, cropped to the face/shoulders)
  function drawShot(im,x,y,s,ring){
    ctx.save(); ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/2,0,Math.PI*2); ctx.closePath(); ctx.fillStyle=P.chip; ctx.fill(); ctx.clip();
    var w=s*1.35, h=w*(im.height/im.width); ctx.drawImage(im,x+(s-w)/2,y+s*.04,w,h); ctx.restore();
    if(ring){ ctx.save(); ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/2-1,0,Math.PI*2); ctx.lineWidth=Math.max(1.5,s*.04); ctx.strokeStyle=ring; ctx.stroke(); ctx.restore(); }
  }
  // the mark for a row: headshot (with a small logo badge) when on + available, else the team logo
  async function mark(row,x,y,s){
    var lg=await img(logoUrl(row.team)), sh=(S.shots&&row.espn)?await img(shotUrl(row.espn)):null;
    if(sh){ drawShot(sh,x,y,s,tcol(row.team)); if(lg){ var b=s*.42; ctx.save(); ctx.beginPath(); ctx.arc(x+s-b*.42,y+s-b*.42,b*.55,0,Math.PI*2); ctx.fillStyle=P.bg; ctx.fill(); ctx.restore(); drawFit(lg,x+s-b*.42-b*.42,y+s-b*.42-b*.42,b*.84); } }
    else drawFit(lg,x,y,s);
  }
  // start every logo/headshot download at once; mark() then resolves from the cache
  function preload(rows){ return Promise.all(rows.map(function(r){ return Promise.all([img(logoUrl(r.team)),(S.shots&&r.espn)?img(shotUrl(r.espn)):null]); })); }
  function bg(W,H){ ctx.fillStyle=P.bg; ctx.fillRect(0,0,W,H); }
  // centred title + subtitle + rule; returns content top
  function head(W,u,pad,title,subtitle){
    var y=pad+34*u;
    var tp=txt((title||'').toUpperCase(),W/2,y,{ w:900,px:54*u,al:'center',max:W-pad*2,ls:.5*u });
    y+=tp*.5+26*u;
    if(subtitle){ txt(subtitle.toUpperCase(),W/2,y,{ w:600,px:21*u,c:P.mut,al:'center',ls:2.5*u,max:W-pad*2 }); y+=30*u; }
    ctx.fillStyle=P.line; ctx.fillRect(pad,y,W-pad*2,Math.max(1,1.5*u));
    return y+22*u;
  }
  // slim brand footer; returns its top
  function foot(W,H,u,pad){
    var y=H-pad*.75, sz=24*u;
    ctx.fillStyle=P.line; ctx.fillRect(pad,y-sz-12*u,W-pad*2,Math.max(1,u));
    ctx.save(); ctx.font=font(800,sz,true); ctx.textBaseline='middle'; ctx.fillStyle=P.text; ctx.fillText('The Depth ',pad,y-sz*.35); ctx.fillStyle=P.acc; ctx.fillText('Chart',pad+ctx.measureText('The Depth ').width,y-sz*.35); ctx.restore();
    var h=(S.handle||'').trim(); txt(h?h+'  ·  '+SITE:SITE,W-pad,y-sz*.35,{ w:600,px:16*u,c:P.mut,al:'right' });
    return y-sz-12*u;
  }

  // ════════════════ templates: each has load (from data), editor (form) and draw ════════════════
  var T={};

  // ── Ranked list ──
  var LIST_SRC={ teams:'Team rankings', board:'NBA Big Board', ppg:'Leaders · points', rpg:'Leaders · rebounds', apg:'Leaders · assists', stl:'Leaders · steals', blk:'Leaders · blocks', ovr:'Leaders · projected OVR', blank:'Blank list' };
  T.list={
    defaults:function(){ return { src:'teams', conf:'', n:25, title:'Preseason Top 25', subtitle:SEASON+' · Power Rankings', showVal:true, showSub:true, valLabel:'PWR', val2Label:'NET', rows:[] }; },
    load:async function(d){
      var n=Math.max(1,Math.min(60,+d.n||25)), conf=d.conf;
      if(d.src==='teams'){
        var rs=(await ratings()).filter(function(t){ return !conf||confName(t.conf)===conf; }).slice(0,n), dn={};
        try{ dn=await dna(); }catch(e){}
        var sg=function(v){ return v==null||!isFinite(+v)?'':((+v>=0?'+':'')+(+v).toFixed(1)); };
        d.rows=rs.map(function(t){ var x=dn[t.full]||dn[t.team]||{}; return { name:school(t.full||t.team), team:t.team, sub:confName(t.conf), val:sg(t.rating), val2:sg(x.net) }; });
        d.title=conf?conf+' Preseason Rankings':'Preseason Top '+n; d.subtitle=SEASON+' · Power Rankings';
        d.showVal=true; d.showSub=!conf; d.valLabel='PWR'; d.val2Label='NET';
      } else if(d.src==='board'){
        var bb=await bigBoard(); await players();
        d.rows=bb.filter(function(p){ return !conf||confName((D.ratings||[]).reduce(function(a,t){ return t.team===p.team?t.conf:a; },''))===conf; }).slice(0,n)
          .map(function(p){ return { name:p.name, team:p.team, espn:p.espn_id||null, sub:school(p.team), val:p.posLabel||p.position||'', val2:'' }; });
        d.title='Preseason NBA Draft Big Board'; d.subtitle='Top '+n; d.valLabel='POS'; d.val2Label=''; d.showSub=false;
      } else if(d.src==='blank'){
        d.rows=[]; for(var i=0;i<n;i++) d.rows.push({ name:'', team:'', val:'' });
      } else {
        var ps=await players(); await ratings(); var confOf={}; D.ratings.forEach(function(t){ confOf[t.team]=t.conf; });
        var stat=d.src, rows=[], seen={};
        ps.forEach(function(p){ if(conf&&confName(confOf[p.team])!==conf) return; var L=TDCProjGrade.lineOf(p); if(!L) return;
          if(stat!=='ovr'&&!(+L.mpg>=15)) return; var v=stat==='ovr'?TDCProjGrade.gradeSolo(p):+L[stat]; if(v==null||!isFinite(v)) return; rows.push({ p:p, v:v }); });
        rows.sort(function(a,b){ return b.v-a.v; });
        d.rows=rows.filter(function(r){ var k=r.p.espn_id||r.p.name; if(seen[k]) return false; seen[k]=1; return true; }).slice(0,n)
          .map(function(r){ return { name:r.p.name, team:r.p.team, espn:r.p.espn_id||null, sub:[school(r.p.team),r.p.position].filter(Boolean).join(' · '), val:stat==='ovr'?String(Math.round(r.v)):r.v.toFixed(1), val2:'' }; });
        var lbl={ ppg:'Points per game', rpg:'Rebounds per game', apg:'Assists per game', stl:'Steals per game', blk:'Blocks per game', ovr:'Top players' }[stat];
        d.title=(conf?conf+' ':'')+lbl; d.subtitle=SEASON+' projections'; d.showVal=true; d.showSub=true;
        d.valLabel={ ppg:'PPG', rpg:'RPG', apg:'APG', stl:'STL', blk:'BLK', ovr:'OVR' }[stat]; d.val2Label='';
      }
    },
    editor:function(d){
      return '<h3>Data</h3><div class="two"><div><label class="f">Start from</label><select data-k="src">'+
        Object.keys(LIST_SRC).map(function(k){ return '<option value="'+k+'"'+(d.src===k?' selected':'')+'>'+LIST_SRC[k]+'</option>'; }).join('')+'</select></div>'+
        '<div><label class="f">How many</label><input data-k="n" type="number" min="1" max="60" value="'+d.n+'"></div></div>'+
        '<label class="f">Conference</label><select data-k="conf">'+confOpts(d.conf)+'</select>'+
        '<div class="btns"><button class="b sm primary" data-act="load">Load / refresh data</button></div>'+
        '<div class="hint">Loading replaces the rows below. After that, edit anything.</div>'+

      txt('WIN PROBABILITY',W/2,by-22*u,{ w:700,px:14*u,c:P.mut,al:'center',ls:2.5*u });
      ctx.fillStyle=ca; ctx.fillRect(pad,by,bw*pa,bh); ctx.fillStyle=cb; ctx.fillRect(pad+bw*pa,by,bw*(1-pa),bh);
      txt(Math.round(pa*100)+'%',pad+14*u,by+bh/2,{ w:800,px:18*u,c:'#fff' }); txt(Math.round((1-pa)*100)+'%',pad+bw-14*u,by+bh/2,{ w:800,px:18*u,c:'#fff',al:'right' });
      return d.nameA+' vs '+d.nameB+' — our projection\n\n'+(d.spread||'')+(d.scoreA?' · '+d.scoreA+'-'+d.scoreB:'')+'\n'+d.nameA+' '+Math.round(pa*100)+'% / '+d.nameB+' '+Math.round((1-pa)*100)+'%\n\n'+SITE+'\n\n#CollegeBasketball #CBB';
    }
  };
  function teamRow(q){ q=(q||'').trim().toLowerCase(); if(!q||!D.ratings) return null;
    return D.ratings.find(function(t){ return (t.team||'').toLowerCase()===q||(t.full||'').toLowerCase()===q; })||D.ratings.find(function(t){ return (t.full||'').toLowerCase().indexOf(q)===0||(t.team||'').toLowerCase().indexOf(q)===0; }); }

  // ── shared editor bits ──
  var CONFS=[];
  function confOpts(sel,req){ return (req?'':'<option value="">All of D-I</option>')+CONFS.map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'; }).join(''); }
  function rowsEditor(rows,path,withVal,withVal2){
    return '<div class="rows">'+rows.map(function(r,i){
      return '<div class="row'+(withVal?'':' nov')+'"'+(withVal2?' style="grid-template-columns:24px minmax(0,1.3fr) minmax(0,.9fr) 54px 54px 20px 20px 20px"':'')+'><span class="n">'+(i+1)+'</span>'+
        '<input data-p="'+path+'.'+i+'.name" list="plList" value="'+esc(r.name)+'" placeholder="Name">'+
        '<input data-p="'+path+'.'+i+'.team" list="tmList" value="'+esc(r.team)+'" placeholder="Team">'+
        (withVal?'<input data-p="'+path+'.'+i+'.val" value="'+esc(r.val)+'" placeholder="Value">':'')+
        (withVal2?'<input data-p="'+path+'.'+i+'.val2" value="'+esc(r.val2)+'" placeholder="Value 2">':'')+
        '<button data-act="up" data-path="'+path+'" data-i="'+i+'" title="Move up">↑</button><button data-act="down" data-path="'+path+'" data-i="'+i+'" title="Move down">↓</button><button data-act="del" data-path="'+path+'" data-i="'+i+'" title="Remove">✕</button></div>';
    }).join('')+'</div>';
  }
  function getPath(o,p){ return p.split('.').reduce(function(a,k){ return a&&a[k]; },o); }
  function setPath(o,p,v){ var ks=p.split('.'), last=ks.pop(), t=ks.reduce(function(a,k){ return a[k]; },o); t[last]=v; }
  function doc(){ var t=S.tpl; if(!S.docs[t]) S.docs[t]=T[t].defaults(); return S.docs[t]; }

  function paintEditor(){ $('editor').innerHTML=T[S.tpl].editor(doc()); }
  $('editor').addEventListener('input',function(e){
    var el=e.target, d=doc();
    if(el.dataset.k){ d[el.dataset.k]=el.type==='checkbox'?el.checked:el.value; }
    else if(el.dataset.p){ setPath(d,el.dataset.p,el.value);
      // a renamed player row re-resolves its headshot by name (+team)
      var m=el.dataset.p.match(/^(.*)\.(\d+)\.(name|team)$/);
      if(m){ var r=getPath(d,m[1]+'.'+m[2]); if(r&&typeof r==='object'&&!Array.isArray(r)){ var p=findPlayer(r.name,r.team); r.espn=p?p.espn_id:null; } } }
    else return;
    save(); later();
  });
  $('editor').addEventListener('change',function(e){ if(e.target.type==='checkbox'||e.target.tagName==='SELECT'){ save(); render(); }
    if(e.target.dataset.k==='val2Label'){ paintEditor(); } });
  $('editor').addEventListener('click',async function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return; var d=doc(), act=b.dataset.act, arr=b.dataset.path?getPath(d,b.dataset.path):null, i=+b.dataset.i;
    if(act==='load'){ b.disabled=true; try{ await T[S.tpl].load(d); save(); paintEditor(); await render(); status('Loaded. Edit anything below.'); }catch(err){ status(err.message,true); } b.disabled=false; return; }
    if(act==='up'&&i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; }
    if(act==='down'&&i<arr.length-1){ var t2=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t2; }
    if(act==='del'){ arr.splice(i,1); }
    if(act==='add'){ arr.push({ name:'', team:'', val:'' }); }
    if(act==='clear'){ arr.length=0; }
    if(act==='addaward'){ d.awards.push({ label:'Award', name:'', team:'' }); }
    save(); paintEditor(); render();
  });

  // ── render ──
  var busy=0, pend=false, deb;
  function later(){ clearTimeout(deb); deb=setTimeout(render,220); }
  async function render(){
    if(busy){ pend=true; return; } busy=1;
    try{
      P=THEMES[S.theme]||THEMES.light;
      var sz=SIZES[S.size]||SIZES.igp, W=sz[0], H=sz[1];
      // draw off-screen and swap the finished frame in, so a half-loaded graphic never shows (or exports)
      var off=document.createElement('canvas'); off.width=W; off.height=H; ctx=off.getContext('2d');
      var u=Math.min(W,H)/1080, pad=Math.round(56*u);
      await Promise.all(['800 40px "Playfair Display"','900 20px Inter','800 20px Inter','700 20px Inter','600 20px Inter','500 20px Inter'].map(function(f){ return document.fonts.load(f).catch(function(){}); }));
      var cap=await T[S.tpl].draw(doc(),W,H,u,pad);
      cv.width=W; cv.height=H; cv.getContext('2d').drawImage(off,0,0);
      $('caption').value=cap||'';
    }catch(e){ console.error(e); status(e.message||'Couldn’t draw that graphic.',true); }
    busy=0; if(pend){ pend=false; render(); }
  }

  // ── controls ──
  function syncControls(){ [].forEach.call($('tplSeg').children,function(x){ x.classList.toggle('on',x.dataset.v===S.tpl); });
    $('size').value=S.size; $('theme').value=S.theme; $('shots').checked=S.shots; $('handle').value=S.handle; }
  $('tplSeg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; S.tpl=b.dataset.v; save(); syncControls(); paintEditor(); render();
    if(S.tpl!=='matchup') players().catch(function(){}); });
  $('size').onchange=function(){ S.size=this.value; save(); render(); };
  $('theme').onchange=function(){ S.theme=this.value; save(); render(); };
  $('shots').onchange=async function(){ S.shots=this.checked; save(); if(S.shots){ await players(); backfillEspn(); } render(); };
  $('handle').oninput=function(){ S.handle=this.value; save(); later(); };
  // rows typed or loaded before players were available get their espn ids once the pool lands
  function backfillEspn(){ Object.keys(S.docs).forEach(function(k){ var d=S.docs[k];
    [].concat(d.rows||[],d.awards||[],[].concat.apply([],d.teams||[])).forEach(function(r){ if(r&&r.name&&!r.espn){ var p=findPlayer(r.name,r.team); if(p) r.espn=p.espn_id; } }); }); save(); }

  // ── export ──
  function fname(){ return 'tdc-'+S.tpl+'-'+S.size+'-'+new Date().toISOString().slice(0,10)+'.png'; }
  function blob(){ return new Promise(function(res){ cv.toBlob(res,'image/png'); }); }
  $('dlBtn').onclick=async function(){ try{ var b=await blob(), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname(); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },4000); }catch(e){ status('Export failed: '+e.message,true); } };
  $('shareBtn').onclick=async function(){ try{ var b=await blob(), f=new File([b],fname(),{ type:'image/png' });
      if(navigator.canShare&&navigator.canShare({ files:[f] })) await navigator.share({ files:[f], text:$('caption').value }); else status('Sharing files isn’t supported in this browser. Use Download.',true);
    }catch(e){ if(e.name!=='AbortError') status('Share failed: '+e.message,true); } };
  $('copyBtn').onclick=async function(){ try{ await navigator.clipboard.writeText($('caption').value); }catch(e){ $('caption').select(); document.execCommand('copy'); } status('Caption copied.'); };

  // ── boot ──
  (async function(){
    syncControls();
    try{
      var rs=await ratings(), seen={};
      rs.forEach(function(t){ var c=confName(t.conf); if(c&&!seen[c]){ seen[c]=1; CONFS.push(c); } }); CONFS.sort();
      $('tmList').innerHTML=rs.map(function(t){ return '<option value="'+esc(t.team)+'">'; }).join('');
      if(!S.docs.matchup&&rs[0]&&rs[1]){ S.docs.matchup=T.matchup.defaults(); S.docs.matchup.a=rs[0].team; S.docs.matchup.b=rs[1].team; }
    }catch(e){ status('Couldn’t load rankings: '+e.message,true); }
    var d=doc();
    paintEditor();
    // first visit: fill the list with real data so there's something to edit
    if(S.tpl==='list'&&!d.rows.length){ try{ await T.list.load(d); save(); paintEditor(); }catch(e){} }
    render();
    players().then(function(){ if(S.shots){ backfillEspn(); render(); } }).catch(function(){});
  })();
})();
</script>
</body>
</html>
