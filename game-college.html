  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;}
    .nav-wrap{border-bottom:1px solid var(--border);background:rgba(250,249,246,.66);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);position:sticky;top:0;z-index:200;}
    [data-theme="dark"] .nav-wrap{background:rgba(20,20,22,.84);border-bottom-color:rgba(26,43,68,.9);}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;letter-spacing:-.01em;white-space:nowrap;}
    .nav-logo span{color:var(--accent);}
    .nav-actions{display:flex;align-items:center;gap:20px;}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-toggle:hover{border-color:var(--accent);color:var(--text);}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;transition:color .2s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a:hover{color:var(--text);}
    .wrap{max-width:760px;margin:0 auto;padding:26px 20px 90px;}
    .g-head{text-align:center;margin-bottom:8px;}
    .g-title{font-family:'Playfair Display',serif;font-weight:800;font-size:34px;letter-spacing:-.01em;}
    .g-sub{font-size:13px;color:var(--text3);margin-top:4px;}
    .g-controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 6px;}
    .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border2);border-radius:9px;padding:3px;gap:3px;}
    .seg button{font-size:12px;font-weight:700;letter-spacing:.02em;padding:6px 13px;border:none;border-radius:6px;background:none;color:var(--text3);cursor:pointer;transition:background .12s,color .12s;}
    .seg button.on{background:var(--accent);color:#221c08;}
    .diff-seg{flex-wrap:wrap;justify-content:center;}
    @media(max-width:560px){ .diff-seg button{padding:6px 9px;font-size:11px;} }
    .g-meta{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 16px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);}
    .g-meta b{color:var(--accent);}
    .g-streak{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px auto 16px;max-width:440px;}
    .g-streak span{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--text2);}
    .g-streak span b{font-family:'Playfair Display',serif;font-size:16px;color:var(--accent);}
    .g-streak span.empty{opacity:.6;} .g-streak span.empty b{color:var(--text3);}
    /* mystery player card */
    .pc{max-width:440px;margin:0 auto 18px;border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:18px 20px;text-align:center;}
    .pc-eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
    .pc-name{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;line-height:1.05;margin:4px 0 3px;}
    .pc-meta{font-size:12.5px;color:var(--text2);font-weight:600;}
    .pc-school{margin-top:9px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
    .pc-stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .pc-stat{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 12px;min-width:56px;}
    .pc-stat .v{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;line-height:1;}
    .pc-stat .l{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-top:3px;}
    /* search */
    .g-hint-btn{display:block;margin:0 auto 16px;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;border:1px solid var(--border2);background:var(--bg2);color:var(--accent);cursor:pointer;transition:border-color .15s;}
    .g-hint-btn:hover{border-color:var(--accent);}
    .g-hint{max-width:440px;margin:0 auto 16px;padding:10px 14px;border-radius:9px;background:rgba(168,132,60,.08);border:1px solid rgba(168,132,60,.28);font-size:13px;color:var(--text2);text-align:center;}
    .g-hint b{color:var(--accent);font-weight:800;}
    .g-search{position:relative;max-width:440px;margin:0 auto 18px;}
    .g-input{width:100%;padding:13px 16px;font-size:15px;font-family:'Inter',sans-serif;font-weight:600;color:var(--text);background:var(--bg2);border:1.5px solid var(--border2);border-radius:10px;outline:none;transition:border-color .15s;}
    .g-input:focus{border-color:var(--accent);}
    .g-drop{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--bg);border:1px solid var(--border2);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:280px;overflow-y:auto;z-index:20;display:none;}
    .g-drop.on{display:block;}
    .g-opt{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
    .g-opt:last-child{border-bottom:none;}
    .g-opt:hover,.g-opt.sel{background:var(--bg2);}
    .g-opt img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
    .g-opt .nm{font-weight:700;font-size:14px;}
    .g-opt .tm{font-size:11px;color:var(--text3);margin-left:auto;}
    /* board */
    .g-board-scroll{overflow-x:auto;}
    .g-board{min-width:420px;max-width:520px;margin:0 auto;}
    .g-row{display:grid;grid-template-columns:1.6fr 1fr;gap:6px;margin-bottom:6px;}
    .g-row.head .cell{background:none;color:var(--text3);font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 2px;min-height:0;}
    .cell{background:var(--bg3);border-radius:8px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:6px 8px;font-size:13px;font-weight:700;line-height:1.15;}
    .cell.school{background:var(--bg2);border:1px solid var(--border);justify-content:flex-start;gap:9px;}
    .cell.school img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
    .cell.hit{background:#1f9d57;color:#fff;border-color:#1f9d57;}
    .cell.miss{background:var(--bg3);color:var(--text2);}
    /* result */
    .g-result{text-align:center;margin-top:22px;padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--bg2);display:none;}
    .g-result.on{display:block;animation:pop .4s cubic-bezier(.34,1.46,.64,1);}
    @keyframes pop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
    .g-result .rz-logo{width:76px;height:76px;object-fit:contain;margin:0 auto 10px;display:block;}
    .g-result .rz-verdict{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
    .g-result .rz-verdict.win{color:#1f9d57;} .g-result .rz-verdict.lose{color:#cf5a4e;}
    .g-result .rz-name{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;}
    .g-result .rz-line{font-size:13px;color:var(--text3);margin-top:4px;}
    .g-btn{display:inline-block;margin-top:16px;padding:10px 20px;font-size:13px;font-weight:700;letter-spacing:.04em;border-radius:9px;border:none;cursor:pointer;background:var(--accent);color:#221c08;text-decoration:none;}
    .g-btn.ghost{background:none;border:1px solid var(--border2);color:var(--text2);margin-left:8px;}
    .g-legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:11px;color:var(--text3);}
    .g-legend span{display:inline-flex;align-items:center;gap:6px;}
    .g-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
    .loading{padding:60px;text-align:center;color:var(--text3);}
    @media(max-width:520px){.nav-top,.nav-sub{padding-left:16px;padding-right:16px;}.g-title{font-size:27px;}}
  </style>

<body data-anim-auto>
<script src="tdc-nav.js?v=7"></script>
  <div class="wrap">
    <div class="g-head">
      <div class="g-title">Guess the College</div>
      <div class="g-sub">You're shown a player — name their college in <b>one guess</b> and build a streak. Hints are limited per run (3 easy · 2 medium · 1 hard) — spend them wisely.</div>
    </div>
    <div id="content"><div class="loading">Loading today's player…</div></div>
  </div>

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');var b=document.getElementById('themeBtn');if(b)b.textContent=d?'🌙':'☀️';try{localStorage.setItem('tdc_theme',d?'light':'dark');}catch(e){}}
(function(){try{var s=localStorage.getItem('tdc_theme');if(s){document.documentElement.setAttribute('data-theme',s);var b=document.getElementById('themeBtn');if(b)b.textContent=s==='dark'?'☀️':'🌙';}}catch(e){}})();

// Streak/survival: ONE guess per player. Hints are a shared budget for the whole
// run (streak) — spend them across players however you like; run out and you're on
// your own. Budget by difficulty.
var HINT_BUDGET={easy:3,medium:2,hard:1,difficult:1,impossible:0};
let scope='year', mode='unlimited', difficulty='medium';
let GUESS_YEAR=null, GUESS_ALL=null, CONF={}, MASCOT={}, LOGO={}, SCHOOLS=[], TARGET=null, DAY=0;
let streak=0, best=0, hintsLeft=0;
let state={guess:null,done:false,won:false,hp:0};   // hp = hints revealed for the CURRENT player
function guessPool(){ return scope==='year'?GUESS_YEAR:GUESS_ALL; }
function seasonLbl(y){ y=+y; return isNaN(y)?'':((y-1)+'-'+(''+y).slice(2)); }

// ── difficulty: filters WHICH players can be the mystery (grade + power conf) ──
var POWER=['acc','big ten','big 12','sec','big east','pac-12','pac 12'];
function isPower(p){ var c=(confOf(p.team)||'').toLowerCase(); if(!c||c==='—')return false; return POWER.some(function(x){return c.indexOf(x)>=0;}); }
var DIFFS={
  easy:      {lbl:'Easy',      hint:'85+ · power confs',  test:function(g,pw){return pw&&g>=85;}},
  medium:    {lbl:'Medium',    hint:'80+ · mostly power', test:function(g,pw){return pw?g>=80:g>=87;}},
  hard:      {lbl:'Hard',      hint:'75+ · mostly power', test:function(g,pw){return pw?g>=75:g>=83;}},
  difficult: {lbl:'Difficult', hint:'75+ · anywhere',     test:function(g,pw){return g>=75;}},
  impossible:{lbl:'Impossible',hint:'any player',         test:function(g,pw){return true;}}
};
function grNum(g){var n=parseInt(g);return isNaN(n)?null:n;}
function answerPool(){
  var gp=guessPool()||[], d=DIFFS[difficulty]||DIFFS.medium;
  return gp.filter(function(p){ if(!p.team||!CONF[p.team])return false; var g=(p._g||grNum(p.tdc_grade)||0); return d.test(g, isPower(p)); });
}
function currentPool(){ return answerPool(); }

// ── daily index ──
function todayIndex(){ const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})); return Math.floor(Date.UTC(et.getFullYear(),et.getMonth(),et.getDate())/86400000); }
function pickIndex(day,len){ let h=(day*2654435761)>>>0; h^=h>>>15; h=(h*2246822519)>>>0; return h%len; }

function classInfo(raw){var s=(raw||'').toLowerCase();
  if(s.includes('gr'))return'Grad'; if(s.includes('sr'))return'Sr'; if(s.includes('jr'))return'Jr';
  if(s.includes('so'))return'So'; if(s.includes('fr'))return'Fr'; return(raw||'—');}
function confOf(team){return CONF[team]||'—';}
function num1(v){ var n=parseFloat(v); return isFinite(n)?n.toFixed(1):null; }

// ── 3 progressive hints: conference → school initial → mascot ──
function hintText(n){
  if(!TARGET) return '';
  if(n===1){ var c=confOf(TARGET.team); return c&&c!=='—'?('Plays in the <b>'+c+'</b>'):'A non-major-conference school'; }
  if(n===2){ return 'School starts with <b>'+((TARGET.team||'?').charAt(0).toUpperCase())+'</b>'; }
  var m=MASCOT[TARGET.team]; return m?('The <b>'+m+'</b>'):('<b>'+TARGET.team+'</b>');
}

// ── mystery player card (school hidden until solved) ──
function playerCard(){
  if(!TARGET) return '';
  var pos=TARGET.position||'—', cls=classInfo(TARGET.class_year||TARGET.yr), ht=TARGET.height||'—';
  var yr=(scope==='all'&&TARGET.season_year)?(' · '+seasonLbl(TARGET.season_year)):'';
  var stats='';
  var ppg=num1(TARGET.ppg), rpg=num1(TARGET.rpg), apg=num1(TARGET.apg);
  if(ppg!=null||rpg!=null||apg!=null){
    stats='<div class="pc-stats">'+
      (ppg!=null?'<div class="pc-stat"><div class="v">'+ppg+'</div><div class="l">PPG</div></div>':'')+
      (rpg!=null?'<div class="pc-stat"><div class="v">'+rpg+'</div><div class="l">RPG</div></div>':'')+
      (apg!=null?'<div class="pc-stat"><div class="v">'+apg+'</div><div class="l">APG</div></div>':'')+
      '<div class="pc-stat"><div class="v">'+(TARGET.tdc_grade||'—')+'</div><div class="l">TDC</div></div>'+
    '</div>';
  } else {
    stats='<div class="pc-stats"><div class="pc-stat"><div class="v">'+(TARGET.tdc_grade||'—')+'</div><div class="l">TDC Grade</div></div></div>';
  }
  var school=state.done?('<div class="pc-school" style="color:var(--text2)">'+TARGET.team+'</div>'):'<div class="pc-school">🎓 ??? College</div>';
  return '<div class="pc">'+
    '<div class="pc-eyebrow">Where did this player go?</div>'+
    '<div class="pc-name">'+TARGET.name+'</div>'+
    '<div class="pc-meta">'+pos+' · '+cls+' · '+ht+yr+'</div>'+
    school+stats+'</div>';
}

function render(){
  var host=document.getElementById('content');
  var controls=
    '<div class="g-controls">'+
      '<div class="seg">'+
        '<button class="'+(scope==='year'?'on':'')+'" onclick="setScope(\'year\')">This Year</button>'+
        '<button class="'+(scope==='all'?'on':'')+'" onclick="setScope(\'all\')">All-Time</button>'+
      '</div>'+
      '<div class="seg">'+
        '<button class="'+(mode==='daily'?'on':'')+'" onclick="setMode(\'daily\')">Daily</button>'+
        '<button class="'+(mode==='unlimited'?'on':'')+'" onclick="setMode(\'unlimited\')">Unlimited</button>'+
      '</div>'+
      '<div class="seg diff-seg">'+
        Object.keys(DIFFS).map(function(k){return '<button class="'+(difficulty===k?'on':'')+'" onclick="setDifficulty(\''+k+'\')" title="'+DIFFS[k].hint+' · '+(HINT_BUDGET[k]||0)+' hints/run">'+DIFFS[k].lbl+'</button>';}).join('')+
      '</div>'+
    '</div>';
  if(!TARGET){ host.innerHTML=controls+'<div class="g-hint" style="margin-top:18px;">No players match <b>'+((DIFFS[difficulty]||{}).lbl||'')+'</b> for this scope. Try an easier tier.</div>'; return; }
  var streakBar='<div class="g-streak">'+
    '<span>🔥 Streak <b>'+streak+'</b></span>'+
    '<span>Best <b>'+best+'</b></span>'+
    '<span class="'+(hintsLeft<=0?'empty':'')+'">💡 <b>'+hintsLeft+'</b> hint'+(hintsLeft===1?'':'s')+' left</span>'+
  '</div>';
  var body;
  if(state.done){
    body=resultHtml();
  } else {
    var hintsShown='';
    for(var hi=1;hi<=state.hp;hi++){ hintsShown+='<div class="g-hint">💡 <b>Hint '+hi+':</b> '+hintText(hi)+'</div>'; }
    var canHint=(hintsLeft>0 && state.hp<3);
    var hintBtn=canHint?'<button class="g-hint-btn" onclick="useHint()">💡 Use a hint ('+hintsLeft+' left in this run)</button>'
                       :(state.hp>=3?'':'<div class="g-hint" style="opacity:.7">Out of hints — you\'re on your own.</div>');
    body=hintsShown+hintBtn+
      '<div class="g-search"><input class="g-input" id="gi" type="text" autocomplete="off" placeholder="Your one guess — name the school…" oninput="onInput(this.value)" onkeydown="onKey(event)"><div class="g-drop" id="gd"></div></div>'+
      '<div class="g-legend"><span>🎯 <b>One guess.</b> Get it right to extend your streak.</span></div>';
  }
  host.innerHTML=controls+streakBar+playerCard()+body;
  var gi=document.getElementById('gi'); if(gi) gi.focus();
}
function resultHtml(){
  var t=TARGET, lg=LOGO[t.team], correct=state.won;
  var msg=correct
    ? '<div class="rz-verdict win">✓ Correct — streak '+streak+'</div>'
    : '<div class="rz-verdict lose">✗ '+(state.guess?('You said '+state.guess):'No guess')+'</div>';
  var line=t.name+' · '+(t.position||'')+' · '+confOf(t.team);
  var action;
  if(mode==='daily'){
    action='<button class="g-btn" onclick="shareResult()">Share</button>';
  } else if(correct){
    action='<button class="g-btn" onclick="nextPlayer(false)">Next player →</button>';
  } else {
    action='<button class="g-btn" onclick="playAgain()">Play again</button><button class="g-btn ghost" onclick="shareResult()">Share</button>';
  }
  return '<div class="g-result on">'+
    (lg?'<img class="rz-logo" src="'+lg+'" alt="" onerror="this.style.display=\'none\'">':'')+
    msg+
    '<div class="rz-name">'+t.team+'</div>'+
    '<div class="rz-line">'+line+'</div>'+
    '<div>'+action+'</div></div>';
}

// ── autocomplete over SCHOOLS ──
let _sel=-1, _matches=[];
function onInput(v){
  v=(v||'').toLowerCase().trim(); _sel=-1;
  var d=document.getElementById('gd'); if(!d)return;
  if(!v){ d.classList.remove('on'); d.innerHTML=''; return; }
  _matches=SCHOOLS.filter(function(s){return s.toLowerCase().indexOf(v)>=0;}).slice(0,8);
  if(!_matches.length){ d.classList.remove('on'); return; }
  d.innerHTML=_matches.map(function(s,i){
    var lg=LOGO[s]?('<img src="'+LOGO[s]+'" alt="" onerror="this.style.display=\'none\'">'):'';
    return '<div class="g-opt'+(i===_sel?' sel':'')+'" onclick="submitGuess(\''+s.replace(/'/g,"\\'")+'\')">'+lg+'<span class="nm">'+s+'</span><span class="tm">'+confOf(s)+'</span></div>';
  }).join('');
  d.classList.add('on');
}
function onKey(e){
  var d=document.getElementById('gd');
  if(e.key==='ArrowDown'){e.preventDefault();_sel=Math.min(_sel+1,_matches.length-1);onInput(document.getElementById('gi').value);}
  else if(e.key==='ArrowUp'){e.preventDefault();_sel=Math.max(_sel-1,0);onInput(document.getElementById('gi').value);}
  else if(e.key==='Enter'){e.preventDefault(); if(_sel>=0&&_matches[_sel])submitGuess(_matches[_sel]); else if(_matches.length===1)submitGuess(_matches[0]);}
}
function submitGuess(school){
  if(state.done||!TARGET)return;
  state.guess=school; state.done=true;
  state.won=(school===TARGET.team);
  if(state.won){ streak++; if(streak>best){ best=streak; saveBest(); } }
  saveDaily(); render();
}

// ── share ──
function shareResult(){
  var head='The Depth Chart — Guess the College';
  var body=(mode==='daily')
    ? ('Daily · '+((DIFFS[difficulty]||{}).lbl||'')+': '+(state.won?('✅ '+TARGET.team):'❌'))
    : ('🔥 Streak: '+streak+' · '+((DIFFS[difficulty]||{}).lbl||''));
  var txt=head+'\n'+body+'\nplay: thedepthchartcbb.com/game-college.html';
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copied to clipboard!');},function(){toast('Copy failed');});}
  else toast(txt);
}
function toast(msg){var t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);';document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}

// ── persistence: best streak (per scope+difficulty) + today's daily result ──
function bestKey(){ return 'tdc_college_best_'+scope+'_'+difficulty; }
function saveBest(){ try{ localStorage.setItem(bestKey(), String(best)); }catch(e){} }
function loadBest(){ try{ best=parseInt(localStorage.getItem(bestKey()))||0; }catch(e){ best=0; } }
function dayKey(){ return 'tdc_college_daily_'+scope+'_'+difficulty+'_'+DAY; }
function saveDaily(){ if(mode!=='daily')return; try{ localStorage.setItem(dayKey(),JSON.stringify({guess:state.guess,done:state.done,won:state.won,hp:state.hp})); }catch(e){} }
function loadDaily(){ try{ var s=localStorage.getItem(dayKey()); if(s){ var o=JSON.parse(s); state.guess=o.guess||null; state.done=!!o.done; state.won=!!o.won; state.hp=o.hp||0; } }catch(e){} }
function useHint(){ if(state.done||!TARGET||hintsLeft<=0||state.hp>=3)return; state.hp++; hintsLeft--; saveDaily(); render(); }

// ── pools (mystery players) ──
async function loadYearPool(){
  var pl=await fetch(SB+'/rest/v1/players?select=id,name,team,position,class_year,yr,height,tdc_grade,espn_id,ppg,rpg,apg,mpg&tdc_grade=gte.70&gp=gte.15&order=name.asc',{headers:H}).then(r=>r.json()).catch(function(){return[];});
  var seen={},out=[]; (Array.isArray(pl)?pl:[]).forEach(function(p){ if(p&&p.name&&p.team&&!seen[p.name]){seen[p.name]=1;out.push(p);} });
  if(window.TDCProjGrade&&TDCProjGrade.ready){ try{ await TDCProjGrade.ready; }catch(e){} }
  if(window.TDCProjGrade&&TDCProjGrade.gradeSolo) out.forEach(function(p){ try{ var g=TDCProjGrade.gradeSolo(p); if(g!=null&&!isNaN(g)) p.tdc_grade=Math.round(g); }catch(e){} });
  return out;
}
async function loadAllPool(){
  const base=SB+'/rest/v1/player_history?select=name,team,season_year,position,yr,height,tdc_grade,espn_id,ppg,rpg,apg,mpg&tdc_grade=gte.75&gp=gte.18&mpg=gte.20';
  const cr=await fetch(base+'&limit=1',{headers:Object.assign({},H,{'Prefer':'count=exact','Range':'0-0','Range-Unit':'items'})});
  const total=parseInt((cr.headers.get('content-range')||'/0').split('/')[1]||0)||5000;
  const PG=1000, pages=Math.ceil(total/PG), jobs=[];
  for(let i=0;i<pages;i++) jobs.push(fetch(base,{headers:Object.assign({},H,{'Range-Unit':'items','Range':(i*PG)+'-'+(i*PG+PG-1)})}).then(r=>r.ok?r.json():[]));
  const parts=await Promise.all(jobs);
  var all=parts.reduce(function(a,b){return a.concat(b);},[]);
  if(window.TDCRating&&TDCRating.ready){ try{ await TDCRating.ready; }catch(e){} }
  if(window.TDCRating&&TDCRating.boxAdjust) all.forEach(function(p){ try{
    var a=TDCRating.boxAdjust(p.tdc_grade,{position:p.position,height:p.height},p,parseInt(p.season_year)||0);
    if(a&&a.grade!=null) p.tdc_grade=Math.round(a.grade); }catch(e){} });
  var best={};   // one row per player = their peak (highest-grade) season
  all.forEach(function(p){ if(!p||!p.name||!p.team)return; var g=grNum(p.tdc_grade)||0; if(!best[p.name]||g>best[p.name]._g){ p._g=g; best[p.name]=p; } });
  return Object.keys(best).map(function(k){return best[k];});
}
async function ensurePool(){
  if(scope==='year'){ if(!GUESS_YEAR) GUESS_YEAR=await loadYearPool(); }
  else { if(!GUESS_ALL){ document.getElementById('content').innerHTML='<div class="loading">Loading 20 years of players…</div>'; GUESS_ALL=await loadAllPool(); } }
}

// ── target + flow ──
var DSALT={easy:11111,medium:22222,hard:33333,difficult:44444,impossible:55555};
function pickTarget(){
  var pool=currentPool(); if(!pool||!pool.length){TARGET=null;return;}
  if(mode==='daily'){
    var stable=pool.slice().sort(function(a,b){return (a.name<b.name)?-1:(a.name>b.name)?1:0;});
    TARGET=stable[pickIndex(DAY+(scope==='all'?424242:0)+(DSALT[difficulty]||0), stable.length)];
  } else { TARGET=pool[Math.floor(Math.random()*pool.length)]; }
}
// nextPlayer(true) starts a fresh RUN (streak 0, hint budget refilled); nextPlayer(false)
// advances the current streak, keeping the shared hint budget.
function nextPlayer(newRun){
  if(newRun){ streak=0; hintsLeft=HINT_BUDGET[difficulty]||0; }
  pickTarget();
  state={guess:null,done:false,won:false,hp:0};
  if(mode==='daily'){ loadDaily(); hintsLeft=Math.max(0,(HINT_BUDGET[difficulty]||0)-state.hp); }
  render();
}
function playAgain(){ nextPlayer(true); }
function startRound(){ loadBest(); nextPlayer(true); }
async function setScope(s){ if(s===scope)return; scope=s; await ensurePool(); startRound(); }
async function setMode(m){ if(m===mode)return; mode=m; startRound(); }
function setDifficulty(d){ if(d===difficulty||!DIFFS[d])return; difficulty=d; startRound(); }

// ── init ──
async function init(){
  DAY=todayIndex();
  try{
    var tm=await fetch(SB+'/rest/v1/teams?select=name,conf',{headers:H}).then(r=>r.json()).catch(function(){return[];});
    (Array.isArray(tm)?tm:[]).forEach(function(t){ if(t.name){ CONF[t.name]=t.conf||'—'; } });
    SCHOOLS=Object.keys(CONF).sort();
    try{ var tc=await fetch('scripts/data/team_colors.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]);
      (tc||[]).forEach(function(e){ if(e&&e.location){ if(e.name) MASCOT[e.location]=e.name; if(e.logo) LOGO[e.location]=e.logo; } });
    }catch(e){}
    await ensurePool();
    if(!guessPool()||!guessPool().length){document.getElementById('content').innerHTML='<div class="loading">Could not load the player pool.</div>';return;}
    startRound();
  }catch(e){ document.getElementById('content').innerHTML='<div class="loading">Error: '+e.message+'</div>'; }
}
document.addEventListener('click',function(e){var d=document.getElementById('gd');if(d&&!e.target.closest('.g-search'))d.classList.remove('on');});
init();
</script>
