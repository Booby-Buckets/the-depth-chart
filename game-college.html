  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:inherit;}
    .gm-k{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
    /* mystery player (flat, top rule) */
    .pc{border-top:1px solid var(--border);padding:16px 0 18px;margin-bottom:4px;}
    .pc-name{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1.05;margin:0 0 4px;}
    .pc-meta{font-size:13px;color:var(--text2);font-weight:600;}
    .pc-school{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
    .pc-school.solved{color:var(--text2);}
    .pc-stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin:14px 0 0;}
    .pc-stats > div{display:flex;flex-direction:column;}
    .pc-stats dd{font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;order:1;}
    .pc-stats dt{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);order:2;}
    /* hints */
    .g-hints{margin:0 0 14px;}
    .g-hint{font-size:13px;color:var(--text2);padding:6px 0 6px 12px;border-left:2px solid var(--accent);margin-bottom:8px;line-height:1.45;}
    .g-hint b{color:var(--text);font-weight:800;}
    .g-hint .hk{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:8px;}
    .g-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
    .g-out{margin-bottom:12px;}
    /* search + autocomplete */
    .g-search{position:relative;max-width:460px;margin:0 0 12px;}
    .g-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg);border:1px solid var(--border2);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:280px;overflow-y:auto;z-index:20;display:none;}
    .g-drop.on{display:block;}
    .g-opt{padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
    .g-opt:last-child{border-bottom:none;}
    .g-opt:hover,.g-opt.sel{background:var(--bg2);}
    .g-opt img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
    .g-opt .nm{font-weight:700;font-size:14px;}
    .g-opt .tm{font-size:11px;color:var(--text3);margin-left:auto;text-align:right;}
    /* per-player reveal */
    .g-reveal{display:flex;align-items:center;gap:14px;border-top:2px solid var(--border2);padding-top:16px;margin-top:4px;}
    .rz-logo{width:56px;height:56px;object-fit:contain;flex-shrink:0;}
    .rz-verdict{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
    .rz-verdict.win{color:#1f9d57;} .rz-verdict.lose{color:#cf5a4e;}
    .rz-name{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1.1;}
    .rz-line{font-size:12.5px;color:var(--text3);margin-top:3px;}
    #gr .gm-result{border-top:1px solid var(--border);}
    #content > #gr:first-child .gm-result{border-top:none;padding-top:0;margin-top:0;}
    /* finished-daily list */
    .g-list{display:flex;flex-direction:column;}
    .g-li{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .g-mk{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
    .g-mk.hit{background:#1f9d57;} .g-mk.miss{background:#cf5a4e;}
    .g-li-n{font-weight:700;color:var(--text);}
    .g-li-s{color:var(--text2);}
    .g-li-s em{font-style:normal;color:var(--text3);}
    .loading{padding:40px 0;color:var(--text3);}
    #gmStatsPanel{margin-top:28px;}
    @media(max-width:520px){ .g-li{grid-template-columns:24px minmax(0,1fr);} .g-li-s{grid-column:2;} }

<script src="tdc-games.js?v=1"></script>
<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const T=window.TDCGames, GID='college';

// Streak/survival: ONE guess per player. Hints are a shared budget for the whole
// run (streak) — spend them across players however you like; run out and you're on
// your own. Budget by difficulty.
var HINT_BUDGET={easy:3,medium:2,hard:1,difficult:1,impossible:0};
// Daily = the same 10 players for everyone, in order, at Medium · this year. The run ends at the
// first miss; score = correct in a row (0-10), a win is 5+.
const DAILY_N=10, DAILY_WIN=5, DAILY_SCOPE='year', DAILY_DIFF='medium';
let scope=DAILY_SCOPE, mode='daily', difficulty=DAILY_DIFF;
let pScope='year', pDiff='medium';                 // practice settings, restored when leaving the daily
let GUESS_YEAR=null, GUESS_ALL=null, CONF={}, MASCOT={}, LOGO={}, SCHOOLS=[], TARGET=null;
let streak=0, best=0, hintsLeft=0, runOver=false, runShare=null;
let state={guess:null,done:false,won:false,hp:0};   // hp = hints revealed for the CURRENT player
// today's daily run: the 10 players, where we are, and each answered player
let DAILY={list:[], i:0, results:[], finished:null};
function guessPool(){ return scope==='year'?GUESS_YEAR:GUESS_ALL; }
function seasonLbl(y){ y=+y; return isNaN(y)?'':((y-1)+'-'+(''+y).slice(2)); }
function scopeLbl(){ return scope==='all'?'all-time':'this year'; }

// ── difficulty: filters WHICH players can be the mystery (grade + power conf) ──
var POWER=['acc','big ten','big 12','sec','big east','pac-12','pac 12'];
function isPower(p){ var c=(confOf(p.team)||'').toLowerCase(); if(!c||c==='—')return false; return POWER.some(function(x){return c.indexOf(x)>=0;}); }
var DIFFS={
  easy:      {lbl:'Easy',      hint:'85+ · power confs',  test:function(g,pw){return pw&&g>=85;}},
  medium:    {lbl:'Medium',    hint:'80+ · mostly power', test:function(g,pw){return pw?g>=80:g>=87;}},
  hard:      {lbl:'Hard',      hint:'75+ · mostly power', test:function(g,pw){return pw?g>=75:g>=83;}},
  difficult: {lbl:'Difficult', hint:'75+ · anywhere',     test:function(g,pw){return g>=75;}},
  impossible:{lbl:'Impossible',hint:'any player',         test:function(g,pw){return true;}}
};
function grNum(g){var n=parseInt(g);return isNaN(n)?null:n;}
function answerPool(){
  var gp=guessPool()||[], d=DIFFS[difficulty]||DIFFS.medium;
  return gp.filter(function(p){ if(!p.team||!CONF[p.team])return false; var g=(p._g||grNum(p.tdc_grade)||0); return d.test(g, isPower(p)); });
}
function currentPool(){ return answerPool(); }

function classInfo(raw){var s=(raw||'').toLowerCase();
  if(s.includes('gr'))return'Grad'; if(s.includes('sr'))return'Sr'; if(s.includes('jr'))return'Jr';
  if(s.includes('so'))return'So'; if(s.includes('fr'))return'Fr'; return(raw||'—');}
function confOf(team){return CONF[team]||'—';}
function num1(v){ var n=parseFloat(v); return isFinite(n)?n.toFixed(1):null; }
function esc(s){ return T.esc(s); }

// ── 3 progressive hints: conference → school initial → mascot ──
function hintText(n){
  if(!TARGET) return '';
  if(n===1){ var c=confOf(TARGET.team); return c&&c!=='—'?('Plays in the <b>'+c+'</b>'):'A non-major-conference school'; }
  if(n===2){ return 'School starts with <b>'+((TARGET.team||'?').charAt(0).toUpperCase())+'</b>'; }
  var m=MASCOT[TARGET.team]; return m?('The <b>'+m+'</b>'):('<b>'+TARGET.team+'</b>');
}

// ── mystery player card (school hidden until solved) ──
function playerCard(){
  if(!TARGET) return '';
  var pos=TARGET.position||'—', cls=classInfo(TARGET.class_year||TARGET.yr), ht=TARGET.height||'—';
  var yr=(scope==='all'&&TARGET.season_year)?(' · '+seasonLbl(TARGET.season_year)):'';
  var ppg=num1(TARGET.ppg), rpg=num1(TARGET.rpg), apg=num1(TARGET.apg);
  var cells=[];
  if(ppg!=null) cells.push(['PPG',ppg]); if(rpg!=null) cells.push(['RPG',rpg]); if(apg!=null) cells.push(['APG',apg]);
  cells.push([cells.length?'TDC':'TDC Grade', TARGET.tdc_grade||'—']);
  var stats='<dl class="pc-stats">'+cells.map(function(c){return '<div><dd>'+c[1]+'</dd><dt>'+c[0]+'</dt></div>';}).join('')+'</dl>';
  var school=state.done?('<div class="pc-school solved">'+TARGET.team+'</div>'):'<div class="pc-school">School hidden</div>';
  return '<div class="pc">'+
    '<div class="gm-k">Where did this player go?</div>'+
    '<div class="pc-name">'+TARGET.name+'</div>'+
    '<div class="pc-meta">'+pos+' · '+cls+' · '+ht+yr+'</div>'+
    school+stats+'</div>';
}

// ── controls: Daily/Practice, then era + difficulty (practice only; the daily is fixed) ──
function renderControls(){
  var daily=mode==='daily';
  T.modeBar('gmModes', mode, setMode);
  document.getElementById('gmEyebrow').textContent=daily?('Games · Daily #'+T.dayNumber()):'Games · Practice';
  var sc=document.getElementById('segScope'), df=document.getElementById('segDiff');
  sc.style.display=df.style.display=daily?'none':'';
  sc.innerHTML=
    '<button type="button" class="chip'+(scope==='year'?' on':'')+'" onclick="setScope(\'year\')">This year</button>'+
    '<button type="button" class="chip'+(scope==='all'?' on':'')+'" onclick="setScope(\'all\')">All-time</button>';
  df.innerHTML=Object.keys(DIFFS).map(function(k){return '<button type="button" class="chip'+(difficulty===k?' on':'')+'" onclick="setDifficulty(\''+k+'\')" title="'+DIFFS[k].hint+' · '+(HINT_BUDGET[k]||0)+' hints/run">'+DIFFS[k].lbl+'</button>';}).join('');
  var hb=HINT_BUDGET[difficulty]||0;
  document.getElementById('gmNote').textContent=daily
    ? 'Daily: Medium · this year · '+DAILY_N+' players · one guess each · '+HINT_BUDGET[DAILY_DIFF]+' hints'
    : (DIFFS[difficulty]||DIFFS.medium).hint+' · one guess each · '+hb+' hint'+(hb===1?'':'s')+' per run';
}
function renderStats(hide){
  document.getElementById('gmStats').innerHTML=T.statsHtml(GID,{score:'Avg score'});
  document.getElementById('gmStatsPanel').style.display=hide?'none':'';
}

function render(){
  renderControls();
  var host=document.getElementById('content');
  if(mode==='daily'&&DAILY.finished){ host.innerHTML=dailyDoneHtml(); wireRunResult(); renderStats(true); return; }
  if(!TARGET){ host.innerHTML='<div class="gm-done">No players match <b>'+((DIFFS[difficulty]||{}).lbl||'')+'</b> for this scope. Try an easier tier.</div>'; renderStats(false); return; }
  var daily=mode==='daily';
  var score='<dl class="gm-score">'+
    (daily?'<div><dt>Player</dt><dd>'+(DAILY.i+1)+' / '+DAILY_N+'</dd></div>':'')+
    '<div><dt>Streak</dt><dd>'+streak+'</dd></div>'+
    (daily?'':'<div><dt>Best</dt><dd>'+best+'</dd></div>')+
    '<div><dt>Hints left</dt><dd>'+hintsLeft+'</dd></div>'+
  '</dl>';
  var body;
  if(state.done){
    body=revealHtml();
  } else {
    var hintsShown='';
    for(var hi=1;hi<=state.hp;hi++){ hintsShown+='<div class="g-hint"><span class="hk">Hint '+hi+'</span>'+hintText(hi)+'</div>'; }
    var canHint=(hintsLeft>0 && state.hp<3);
    var hintBtn=canHint?'<div class="g-actions"><button type="button" class="gm-btn ghost" onclick="useHint()">Use a hint ('+hintsLeft+' left in this run)</button></div>'
                       :(state.hp>=3?'':'<div class="gm-note g-out">Out of hints. You\'re on your own.</div>');
    body=(hintsShown?'<div class="g-hints">'+hintsShown+'</div>':'')+
      '<div class="g-search"><input class="gm-input" id="gi" type="text" autocomplete="off" placeholder="Your one guess: name the school…" oninput="onInput(this.value)" onkeydown="onKey(event)"><div class="g-drop" id="gd"></div></div>'+
      hintBtn+
      '<div class="gm-note">One guess. Get it right to extend your streak.</div>';
  }
  host.innerHTML=score+playerCard()+body;
  if(state.done&&runOver) wireRunResult();
  renderStats(state.done&&runOver);
  var gi=document.getElementById('gi'); if(gi) gi.focus();
}
// the per-player answer reveal (logo + school); when the run is over, the shared result block follows
function revealHtml(){
  var t=TARGET, lg=LOGO[t.team], correct=state.won;
  var verdict=correct
    ? '<div class="rz-verdict win">Correct · streak '+streak+'</div>'
    : '<div class="rz-verdict lose">'+(state.guess?('You said '+esc(state.guess)):'No guess')+'</div>';
  var more='';
  if(!runOver) more='<div class="g-actions" style="margin-top:14px"><button type="button" class="gm-btn" onclick="nextPlayer(false)">Next player</button></div>';
  return '<div class="g-reveal">'+
    (lg?'<img class="rz-logo" src="'+lg+'" alt="" onerror="this.style.display=\'none\'">':'')+
    '<div>'+verdict+'<div class="rz-name">'+t.team+'</div><div class="rz-line">'+t.name+' · '+(t.position||'')+' · '+confOf(t.team)+'</div></div></div>'+
    more+(runOver?'<div id="gr">'+runResultHtml()+'</div>':'');
}
function runResultHtml(){
  var daily=mode==='daily', sc=daily?DAILY.results.filter(function(r){return r.hit;}).length:streak;
  var title=daily?(sc+' of '+DAILY_N):('Streak '+sc);
  var used=daily?(HINT_BUDGET[DAILY_DIFF]-hintsLeft):null;
  var line=daily
    ? (sc===DAILY_N?'Perfect run: all ten schools.':('Run ended on player '+Math.min(DAILY.results.length,DAILY_N)+'.'))+' '+used+' hint'+(used===1?'':'s')+' used.'
    : ('Run over · '+(DIFFS[difficulty]||DIFFS.medium).lbl+' · '+scopeLbl()+' · best '+best+'.');
  return T.resultHtml(GID,{title:title, line:line, shareText:runShare, statsOpts:{score:'Avg score'},
    again:daily?'Play practice':'Play again', daily:daily});
}
function wireRunResult(){
  var el=document.getElementById('gr'); if(!el) return;
  T.wireResult(el, runShare, mode==='daily'?function(){ setMode('practice'); }:playAgain);
}
// today's daily already finished: the result block + the ten players with how you did
function dailyDoneHtml(){
  var f=DAILY.finished, d=f.detail||{}, rows=(d.results||[]);
  runShare=f.share||'';
  var list=rows.length?('<div class="gm-panel"><div class="gm-k">Today\'s run</div><div class="g-list">'+rows.map(function(r,i){
    return '<div class="g-li"><span class="g-mk '+(r.hit?'hit':'miss')+'">'+(i+1)+'</span><span class="g-li-n">'+esc(r.name)+'</span>'+
      '<span class="g-li-s">'+esc(r.team)+(r.hit?'':' <em>· you said '+esc(r.guess||'nothing')+'</em>')+'</span></div>';
  }).join('')+'</div></div>'):'';
  var sc=f.score!=null?f.score:0, used=d.hints!=null?d.hints:0;
  var line=(sc===DAILY_N?'Perfect run: all ten schools.':'Run ended on player '+Math.max(rows.length,1)+'.')+' '+used+' hint'+(used===1?'':'s')+' used.';
  return '<div id="gr">'+T.resultHtml(GID,{title:sc+' of '+DAILY_N, line:line, shareText:runShare, statsOpts:{score:'Avg score'}, again:'Play practice', daily:true})+'</div>'+list;
}

// ── autocomplete over SCHOOLS ──
let _sel=-1, _matches=[];
function onInput(v){
  v=(v||'').toLowerCase().trim(); _sel=-1;
  var d=document.getElementById('gd'); if(!d)return;
  if(!v){ d.classList.remove('on'); d.innerHTML=''; return; }
  _matches=SCHOOLS.filter(function(s){return s.toLowerCase().indexOf(v)>=0;}).slice(0,8);
  if(!_matches.length){ d.classList.remove('on'); return; }
  drawDrop();
}
function drawDrop(){
  var d=document.getElementById('gd'); if(!d)return;
  d.innerHTML=_matches.map(function(s,i){
    var lg=LOGO[s]?('<img src="'+LOGO[s]+'" alt="" onerror="this.style.display=\'none\'">'):'';
    return '<div class="g-opt'+(i===_sel?' sel':'')+'" onclick="submitGuess(_matches['+i+'])">'+lg+'<span class="nm">'+s+'</span><span class="tm">'+confOf(s)+'</span></div>';
  }).join('');
  d.classList.add('on');
}
function onKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();_sel=Math.min(_sel+1,_matches.length-1);drawDrop();}
  else if(e.key==='ArrowUp'){e.preventDefault();_sel=Math.max(_sel-1,0);drawDrop();}
  else if(e.key==='Enter'){e.preventDefault(); if(_sel>=0&&_matches[_sel])submitGuess(_matches[_sel]); else if(_matches.length===1)submitGuess(_matches[0]);}
  else if(e.key==='Escape'){var d=document.getElementById('gd'); if(d)d.classList.remove('on');}
}
function submitGuess(school){
  if(state.done||!TARGET||runOver)return;
  if(mode==='daily'&&T.dailyResult(GID))return;          // a finished daily can't be replayed
  state.guess=school; state.done=true;
  state.won=(school===TARGET.team);
  if(state.won){ streak++; if(mode!=='daily'&&streak>best){ best=streak; saveBest(); } }
  if(mode==='daily'){
    DAILY.results.push({name:TARGET.name, team:TARGET.team, guess:school, hit:state.won});
    if(!state.won||DAILY.results.length>=DAILY_N) endRun(); else saveProgress();
  } else if(!state.won) endRun();
  render();
}
// the run just ended (a miss, or all ten dailies): record it once in the shared stats
function endRun(){
  runOver=true;
  var daily=mode==='daily', sc=daily?DAILY.results.filter(function(r){return r.hit;}).length:streak;
  runShare=buildShare(sc);
  T.record(GID,{daily:daily, win:sc>=DAILY_WIN, score:sc, share:runShare,
    detail:daily?{results:DAILY.results.slice(), hints:HINT_BUDGET[DAILY_DIFF]-hintsLeft}:{difficulty:difficulty, scope:scope}});
  if(daily){ clearProgress(); DAILY.finished=null; }
}

// ── share (spoiler-free: no names or schools) ──
function buildShare(sc){
  if(mode==='daily'){
    var row=''; for(var i=0;i<DAILY_N;i++){ var r=DAILY.results[i]; row+=r?(r.hit?'🟩':'🟥'):'⬜'; }
    var used=HINT_BUDGET[DAILY_DIFF]-hintsLeft;
    return T.shareText(GID,true,[sc+'/'+DAILY_N+(used?(' · '+used+' hint'+(used===1?'':'s')):''), row]);
  }
  return T.shareText(GID,false,['Streak '+sc+' 🔥','Practice · '+(DIFFS[difficulty]||DIFFS.medium).lbl+' · '+scopeLbl()]);
}

// ── persistence: best practice streak (per scope+difficulty) + today's in-progress daily run ──
function bestKey(){ return 'tdc_college_best_'+scope+'_'+difficulty; }
function saveBest(){ try{ localStorage.setItem(bestKey(), String(best)); }catch(e){} }
function loadBest(){ try{ best=parseInt(localStorage.getItem(bestKey()))||0; }catch(e){ best=0; } }
function progKey(){ return 'tdc_college_day_'+T.today(); }
function saveProgress(){ if(mode!=='daily')return; try{ localStorage.setItem(progKey(),JSON.stringify({ids:DAILY.list.map(function(p){return p.name;}),i:DAILY.i,results:DAILY.results,hintsLeft:hintsLeft,state:state})); }catch(e){} }
function loadProgress(){
  try{ var o=JSON.parse(localStorage.getItem(progKey())||'null');
    if(!o||!o.ids||o.ids.join('|')!==DAILY.list.map(function(p){return p.name;}).join('|')) return false;
    DAILY.i=o.i||0; DAILY.results=o.results||[]; hintsLeft=o.hintsLeft!=null?o.hintsLeft:HINT_BUDGET[DAILY_DIFF];
    state=o.state||{guess:null,done:false,won:false,hp:0};
    streak=DAILY.results.filter(function(r){return r.hit;}).length;
    return true;
  }catch(e){ return false; }
}
function clearProgress(){ try{ localStorage.removeItem(progKey()); }catch(e){} }
function useHint(){ if(state.done||!TARGET||hintsLeft<=0||state.hp>=3)return; state.hp++; hintsLeft--; saveProgress(); render(); }

// ── pools (mystery players) ──
async function loadYearPool(){
  var pl=await fetch(SB+'/rest/v1/players?select=id,name,team,position,class_year,yr,height,tdc_grade,espn_id,ppg,rpg,apg,mpg&tdc_grade=gte.70&gp=gte.15&order=name.asc,id.asc',{headers:H}).then(r=>r.json()).catch(function(){return[];});
  var seen={},out=[]; (Array.isArray(pl)?pl:[]).forEach(function(p){ if(p&&p.name&&p.team&&!seen[p.name]){seen[p.name]=1;out.push(p);} });
  if(window.TDCProjGrade&&TDCProjGrade.ready){ try{ await TDCProjGrade.ready; }catch(e){} }
  if(window.TDCProjGrade&&TDCProjGrade.gradeSolo) out.forEach(function(p){ try{ var g=TDCProjGrade.gradeSolo(p); if(g!=null&&!isNaN(g)) p.tdc_grade=Math.round(g); }catch(e){} });
  return out;
}
async function loadAllPool(){
  const base=SB+'/rest/v1/player_history?select=name,team,season_year,position,yr,height,tdc_grade,espn_id,ppg,rpg,apg,mpg&tdc_grade=gte.75&gp=gte.18&mpg=gte.20&order=name.asc,season_year.asc,team.asc';
  const cr=await fetch(base+'&limit=1',{headers:Object.assign({},H,{'Prefer':'count=exact','Range':'0-0','Range-Unit':'items'})});
  const total=parseInt((cr.headers.get('content-range')||'/0').split('/')[1]||0)||5000;
  const PG=1000, pages=Math.ceil(total/PG), jobs=[];
  for(let i=0;i<pages;i++) jobs.push(fetch(base,{headers:Object.assign({},H,{'Range-Unit':'items','Range':(i*PG)+'-'+(i*PG+PG-1)})}).then(r=>r.ok?r.json():[]));
  const parts=await Promise.all(jobs);
  var all=TDCTeamName.fix(parts.reduce(function(a,b){return a.concat(b);},[]));
  if(window.TDCRating&&TDCRating.ready){ try{ await TDCRating.ready; }catch(e){} }
  try{ if(window.TDCProjGrade&&TDCProjGrade.loadHist) await TDCProjGrade.loadHist(); }catch(e){}
    all.forEach(function(p){ try{
    var so=(function(p){ try{ if(window.TDCProjGrade&&TDCProjGrade.statOvr){ var so=TDCProjGrade.statOvr(p); if(so!=null&&isFinite(so)) return Math.round(so); } }catch(e){} return null; })(p); if(so!=null){ p.tdc_grade=so; return; }   // that season's statistical overall first
    if(window.TDCRating&&TDCRating.boxAdjust){ var a=TDCRating.boxAdjust(p.tdc_grade,{position:p.position,height:p.height},p,parseInt(p.season_year)||0);
    if(a&&a.grade!=null) p.tdc_grade=Math.round(a.grade); } }catch(e){} });
  var best={};   // one row per player = their peak (highest-grade) season
  all.forEach(function(p){ if(!p||!p.name||!p.team)return; var g=grNum(p.tdc_grade)||0; if(!best[p.name]||g>best[p.name]._g){ p._g=g; best[p.name]=p; } });
  return Object.keys(best).map(function(k){return best[k];});
}
async function ensurePool(){
  if(scope==='year'){ if(!GUESS_YEAR) GUESS_YEAR=await loadYearPool(); }
  else { if(!GUESS_ALL){ document.getElementById('content').innerHTML='<div class="loading">Loading 20 years of players…</div>'; GUESS_ALL=await loadAllPool(); } }
}

// ── target + flow ──
function byNameCmp(a,b){ return (a.name<b.name)?-1:(a.name>b.name)?1:0; }
function pickTarget(){
  var pool=currentPool(); if(!pool||!pool.length){TARGET=null;return;}
  TARGET=pool[Math.floor(Math.random()*pool.length)];     // practice only; the daily list is seeded
}
// the daily: today's ten from a stable (name-sorted) pool + the shared daily seed
function startDaily(){
  runOver=false; runShare=null; streak=0; hintsLeft=HINT_BUDGET[DAILY_DIFF];
  state={guess:null,done:false,won:false,hp:0};
  DAILY={list:[], i:0, results:[], finished:T.dailyResult(GID)};
  var pool=currentPool();
  DAILY.list=(pool&&pool.length)?T.pick(GID, pool.slice().sort(byNameCmp), DAILY_N):[];
  if(!DAILY.finished) loadProgress();
  TARGET=DAILY.list[DAILY.i]||null;
  render();
}
// nextPlayer(true) starts a fresh RUN (streak 0, hint budget refilled); nextPlayer(false)
// advances the current streak, keeping the shared hint budget.
function nextPlayer(newRun){
  if(mode==='daily'){
    if(newRun){ startDaily(); return; }
    if(runOver) return;
    DAILY.i++; TARGET=DAILY.list[DAILY.i]||null;
    state={guess:null,done:false,won:false,hp:0}; saveProgress(); render(); return;
  }
  if(newRun){ streak=0; hintsLeft=HINT_BUDGET[difficulty]||0; runOver=false; runShare=null; }
  pickTarget();
  state={guess:null,done:false,won:false,hp:0};
  render();
}
function playAgain(){ nextPlayer(true); }
function startRound(){ loadBest(); nextPlayer(true); }
async function setScope(s){ if(mode!=='practice'||s===scope)return; scope=pScope=s; await ensurePool(); startRound(); }
async function setMode(m){
  if(m===mode)return;
  if(m==='daily'){ pScope=scope; pDiff=difficulty; scope=DAILY_SCOPE; difficulty=DAILY_DIFF; }
  else { scope=pScope; difficulty=pDiff; }
  mode=m; await ensurePool(); startRound();
}
function setDifficulty(d){ if(mode!=='practice'||d===difficulty||!DIFFS[d])return; difficulty=pDiff=d; startRound(); }

// ── init ──
async function init(){
  try{
    var tm=await fetch(SB+'/rest/v1/teams?select=name,conf&order=name.asc',{headers:H}).then(r=>r.json()).catch(function(){return[];});
    (Array.isArray(tm)?tm:[]).forEach(function(t){ if(t.name){ CONF[t.name]=t.conf||'—'; } });
    SCHOOLS=Object.keys(CONF).sort();
    try{ var tc=await fetch('scripts/data/team_colors.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]);
      (tc||[]).forEach(function(e){ if(e&&e.location){ if(e.name) MASCOT[e.location]=e.name; if(e.logo) LOGO[e.location]=e.logo; } });
    }catch(e){}
    await ensurePool();
    if(!guessPool()||!guessPool().length){document.getElementById('content').innerHTML='<div class="loading">Could not load the player pool.</div>';return;}
    startRound();
  }catch(e){ document.getElementById('content').innerHTML='<div class="loading">Error: '+e.message+'</div>'; }
}
document.addEventListener('click',function(e){var d=document.getElementById('gd');if(d&&!e.target.closest('.g-search'))d.classList.remove('on');});
init();
</script>
