<style>
  :root:not([data-theme="dark"]) body{background:var(--bg);}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);margin:0;}
  .nav-wrap{border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
  .nav-top{display:flex;align-items:center;justify-content:space-between;padding:12px 40px;}
  .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;}
  .nav-logo span{color:var(--accent);}
  .theme-toggle{width:32px;height:32px;border:1px solid var(--border2);border-radius:8px;background:var(--bg2);cursor:pointer;font-size:15px;}
  .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;}
  .nav-sub::-webkit-scrollbar{display:none;}
  .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;}
  .nav-sub a:first-child{padding-left:0;}
  .nav-sub a:hover,.nav-sub a.active{color:var(--text);border-bottom-color:var(--accent);}
  .wrap{max-width:1400px;margin:0 auto;padding:26px 40px 80px;}
  @media(max-width:820px){.nav-top,.nav-sub,.wrap{padding-left:16px;padding-right:16px;}}

  /* hero */
  .nb-hero{display:flex;gap:24px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:18px;}
  .nb-id{flex:1;min-width:0;}
  @media(max-width:1100px){.nb-hero{flex-wrap:wrap;}.nb-hero .ui-dial-wrap{width:100%;}}
  .nb-shot{width:118px;height:86px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);}
  .nb-shot img{width:100%;height:100%;object-fit:cover;object-position:top;}
  .nb-eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .nb-eyebrow img{width:20px;height:20px;object-fit:contain;}
  .nb-eyebrow .sep{color:var(--text3);}
  .nb-name{font-family:'Playfair Display',serif;font-weight:800;font-size:40px;line-height:1.05;margin:0 0 12px;}
  .nb-bio{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--text2);}
  .nb-bio b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
  .nb-bio a{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--text3);}
  .nb-bio a:hover{color:var(--accent);}
  .nb-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text);margin-left:8px;vertical-align:4px;}
  @media(max-width:640px){.nb-name{font-size:30px;}}

  /* tabs */
  .nb-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .nb-tabs::-webkit-scrollbar{display:none;}
  .nb-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;cursor:pointer;white-space:nowrap;}
  .nb-tab.on{color:var(--text);border-bottom-color:var(--accent);}
  .nb-tab:hover:not(.on){color:var(--text);}
  .nb-panel{display:none;}
  .nb-panel.on{display:block;}

  /* sections / controls */
  .nb-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin:22px 0 8px;}
  .nb-h:first-child{margin-top:0;}
  .nb-note{font-size:12px;color:var(--text3);line-height:1.55;margin:8px 0 0;max-width:900px;}
  .nb-note b{color:var(--text2);}
  .nb-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;}
  .nb-seg{display:inline-flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:2px;}
  .nb-seg button{background:none;border:none;color:var(--text3);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:7px;cursor:pointer;}
  .nb-seg button.on{background:var(--accent);color:#221c08;}
  .nb-ctl select{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:12.5px;font-weight:600;padding:7px 10px;font-family:inherit;}
  .sheet td.tm img{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:6px;}
  .sheet tr.split td{color:var(--text3);font-size:11.5px;}
  .sheet tr.split td.tm{padding-left:22px;}
  .sheet tr.career td{font-weight:800;border-top:2px solid var(--border2);}
  .sheet th[title]{cursor:help;}
  .sheet th.sortable{cursor:pointer;}
  .sheet th.sortable:hover{color:var(--text);}
  .sheet td.star::after{content:'★';color:var(--accent);margin-left:4px;font-size:10px;}
  /* percentile bar-in-cell */
  .pbar{position:relative;height:14px;background:var(--bg3);border-radius:4px;min-width:140px;overflow:hidden;}
  .pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;}
  .pbar span{position:absolute;right:6px;top:0;font-size:10.5px;font-weight:800;line-height:14px;color:var(--text);}
  .verdict{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .verdict.up{color:hsl(125,55%,45%);} .verdict.dn{color:hsl(0,65%,55%);} .verdict.eq{color:var(--text3);}
  .ui-panel-body > .nb-strip{margin:-12px -14px 12px !important;border:0 !important;border-bottom:1px solid var(--border) !important;border-radius:0 !important;}
  .ui-panel-body > .nb-strip:last-child{margin-bottom:-12px !important;border-bottom:0 !important;}
  .nb-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:0 0 6px;}
  .nb-strip div{background:var(--bg2);padding:12px 14px;}
  .nb-strip b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
  .nb-strip span{font-size:18px;font-weight:800;}
  .nb-strip small{display:block;font-size:11px;color:var(--text3);margin-top:2px;}
  .empty{padding:60px 20px;text-align:center;color:var(--text3);}
  .nb-search{position:relative;max-width:420px;}
  .nb-search input{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-size:14px;padding:10px 12px;font-family:inherit;}
  .nb-results{margin-top:8px;}
  .nb-results a{display:block;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13.5px;}
  .nb-results a:hover{background:var(--bg2);}
  .nb-results small{color:var(--text3);margin-left:6px;}
</style>

<script>
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var P = null, IDX = null, TEAMS = {}, GL = null;

/* ---------- formatting ---------- */
function n1(v){ return v == null ? '—' : (+v).toFixed(1); }
function n0(v){ return v == null ? '—' : Math.round(+v).toLocaleString(); }
function pc(v){ return v == null ? '—' : (100 * v).toFixed(1); }          // fraction -> "58.7"
function sg(v, d){ if(v == null) return '—'; var x = (+v).toFixed(d == null ? 1 : d); if(Math.abs(v) >= 1000) x = Math.round(+v).toLocaleString(); return (v > 0 ? '+' : '') + x; }
function seasonLbl(y){ return (y - 1) + '-' + String(y).slice(2); }
function ht(i){ return i ? Math.floor(i / 12) + "' " + Math.round(i % 12) + '"' : null; }
function age(dob){ if(!dob) return null; var d = new Date(dob), n = new Date(); var a = n.getFullYear() - d.getFullYear(); if(n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; }
function teamCell(abbr){ return abbr ? '<img src="' + TDCNba.logo(abbr) + '" alt="" onerror="this.remove()">' + esc(abbr) : '—'; }
function teamName(abbr){ return TEAMS[abbr] || abbr || ''; }

/* plain-English header tips */
var TIP = {
  ts: 'True shooting: scoring efficiency counting 3s and free throws. League average is around 57.',
  efg: 'Effective FG%: field-goal % with a made 3 counted as 1.5 makes.',
  usg: 'Usage: share of his team\'s possessions he ends (shot, free throws or turnover) while on the floor.',
  ast: 'Assist %: share of teammates\' baskets he assisted while on the floor.',
  tov: 'Turnover %: turnovers per 100 of his own plays. Lower is better.',
  orb: 'Offensive rebound %: share of available offensive boards he grabbed while on the floor.',
  drb: 'Defensive rebound %: share of available defensive boards he grabbed while on the floor.',
  trb: 'Total rebound %.',
  stl: 'Steal %: share of opponent possessions he ended with a steal while on the floor.',
  blk: 'Block %: share of opponent two-point tries he blocked while on the floor.',
  ti40: 'TDC Impact per 40: our points-value box metric, the same formula as on the college pages. NBA scale runs lower than college.',
  ti100: 'TDC Impact per 100 possessions.',
  par: 'Points above replacement: TDC Impact over a replacement-level NBA player (the bottom 15% of minutes), times his minutes.',
  onoff: 'On/off per 48: his team\'s scoring margin with him on the floor minus with him off, per 48 minutes, within games he played. Noisy in small samples.',
  pm: 'Box-score plus/minus: his team\'s margin while he was on the floor, summed.',
  tpar: '3PA rate: share of his shots that were 3s.',
  ftr: 'FT rate: free-throw attempts per field-goal attempt.'
};
function th(label, tip, heat, cls){
  return '<th' + (cls ? ' class="' + cls + '"' : '') + (tip ? ' title="' + esc(TIP[tip] || tip) + '"' : '') +
         (heat ? ' data-heat="' + heat + '"' : '') + '>' + label + '</th>';
}

/* ---------- boot ---------- */
var qp = new URLSearchParams(location.search);
var ID = qp.get('id'), FROM_COLLEGE = qp.get('college');
Promise.all([TDCNba.index()]).then(function(r){
  IDX = r[0]; TEAMS = IDX.teams || {};
  if(!ID && FROM_COLLEGE) ID = (IDX.by_college || {})[FROM_COLLEGE];
  if(!ID) return renderSearch();
  return fetch('nba/p/' + encodeURIComponent(ID) + '.json').then(function(x){
    if(!x.ok) throw new Error('missing'); return x.json();
  }).then(function(p){ P = p; render(); });
}).catch(function(){
  $('#app').innerHTML = '<div class="empty">We don\'t have that NBA player yet. <a href="nba.html" style="color:var(--accent)">Search NBA players →</a></div>';
});

/* ---------- College to the NBA (no id) ----------
   Framed around college: only players with a college page here (final college season 2010+),
   searchable by player or school. NBA-only players stay reachable from comps, not listed. */
function renderSearch(){
  document.title = 'College to the NBA — The Depth Chart';
  var list = (IDX.players || []).filter(function(p){ return p[2]; });   // [id,name,cid,first,last,pos,team,school,par,pick]
  $('#app').innerHTML = '<div class="nb-eyebrow">College to the NBA</div><h1 class="nb-name">Where they ended up</h1>' +
    '<p class="nb-note" style="margin:0 0 16px">Every college player since 2010 who reached the NBA, ' + list.length.toLocaleString() + ' in all. Search a player or a school to see his NBA numbers and how his college game translated. You can also flip any of their college pages to NBA.</p>' +
    '<div class="nb-search"><input id="nbQ" placeholder="Search a player or school…" autocomplete="off" aria-label="Search college players in the NBA"></div>' +
    '<div class="nb-h" id="nbHead" style="margin-top:18px"></div><div class="sheet-wrap"><table class="sheet dense" id="nbTbl"></table></div>';
  function go(){
    var q = $('#nbQ').value.trim().toLowerCase(), hits;
    if(q.length >= 2){
      hits = list.filter(function(p){ return (p[1] || '').toLowerCase().indexOf(q) >= 0 || (p[7] || '').toLowerCase().indexOf(q) >= 0; });
      $('#nbHead').textContent = hits.length + ' match' + (hits.length === 1 ? '' : 'es');
    } else {
      hits = list; $('#nbHead').textContent = 'Biggest NBA careers from college';
    }
    hits = hits.slice().sort(function(a, b){ return (b[8] || 0) - (a[8] || 0); }).slice(0, q.length >= 2 ? 200 : 50);
    $('#nbTbl').innerHTML = '<thead><tr><th class="l">Player</th><th class="l">College</th><th>Pick</th><th class="l">NBA seasons</th><th class="l">Latest team</th>' + th('Career value', 'par') + '</tr></thead><tbody>' +
      hits.map(function(p){ return '<tr><td class="l nm"><a href="nba.html?id=' + p[0] + '">' + esc(p[1]) + '</a></td><td class="l"><a href="player.html?espn=' + p[2] + '&name=' + encodeURIComponent(p[1]) + '" style="color:var(--text2);text-decoration:none">' + esc(p[7] || '') + '</a></td>' +
        '<td>' + (p[9] ? '#' + p[9] : '<span style="color:var(--text3)">UDFA</span>') + '</td><td class="l">' + (p[3] ? seasonLbl(p[3]) + (p[4] !== p[3] ? ' to ' + seasonLbl(p[4]) : '') : '') +
        '</td><td class="l tm">' + teamCell(p[6]) + '</td><td>' + n0(p[8]) + '</td></tr>'; }).join('') + '</tbody>';
  }
  $('#nbQ').oninput = go; go();
}

/* ---------- page ---------- */
var TABS = [['overview', 'Overview'], ['stats', 'Stats'], ['profile', 'Profile'], ['gamelog', 'Game Log'], ['college', 'College → NBA']];
function render(){
  document.title = P.name + ' NBA Stats — The Depth Chart';
  var cl = P.college_link, d = P.draft || {};
  var draftTxt = d.pick ? (d.year + ' · Round ' + d.round + ', #' + d.pick + (d.team ? ' (' + d.team + ')' : '')) : (d.year ? d.year : 'Undrafted');
  var regs = P.seasons.filter(function(s){ return s.type === 'regular'; });
  var last = regs[regs.length - 1], prev = regs[regs.length - 2];
  var lg = P.team ? TDCNba.logo(P.team) : '';
  // photo tile: ESPN cut-out on the team colour (owner-only photo); everyone else gets the team logo on the tile
  var mark = lg ? '<img class="mark" src="' + lg + '" alt="" onerror="this.parentNode.remove()">' : '';
  var tile = (window.tdcShowPhotos && window.tdcShowPhotos() && P.headshot)
    ? '<div class="ui-ptile" id="nbTile"><img class="photo" src="' + esc(P.headshot) + '" alt="' + esc(P.name) + '" onerror="nbTileFallback()"></div>'
    : (mark ? '<div class="ui-ptile logo" id="nbTile">' + mark + '</div>' : '');
  window.nbTileFallback = function(){ var t = $('#nbTile'); if(!t) return; if(!mark){ t.remove(); return; } t.classList.add('logo'); t.innerHTML = mark; };
  // counting stats from the latest regular season, with the change from the season before
  var ROW = [['PPG', 'ppg', n1, 1], ['RPG', 'rpg', n1, 1], ['APG', 'apg', n1, 1], ['MPG', 'mpg', n1, 1], ['FG%', 'fg_pct', pc, 100], ['3P%', 'tp_pct', pc, 100], ['FT%', 'ft_pct', pc, 100], ['TS%', 'ts_pct', pc, 100]];
  var statRow = last ? '<div class="ui-statrow">' + ROW.map(function(r){
    var v = last[r[1]], q = prev ? prev[r[1]] : null, d = (v != null && q != null) ? (v - q) * r[3] : null;
    return '<div><b>' + r[0] + '</b><span>' + r[2](v) + '</span>' + (d == null ? '<em>&nbsp;</em>' : '<em class="' + (d > 0.05 ? 'up' : d < -0.05 ? 'dn' : '') + '">' + (d > 0 ? '+' : '') + d.toFixed(1) + '</em>') + '</div>';
  }).join('') + '</div>' : '';
  // rating dial: TDC Impact per 40 (the college pages' box metric), ring = league percentile that season
  var dial = '';
  if(last && last.pct && last.pct.ti40 != null && last.ti40 != null){
    var pt = last.pct.ti40, C = 2 * Math.PI * 44, tier = pt >= 85 ? 'p4' : pt >= 65 ? 'p3' : pt >= 35 ? 'p2' : pt >= 15 ? 'p1' : 'p0';
    var dt = prev && prev.ti40 != null ? last.ti40 - prev.ti40 : null;
    var ord = function(n){ var m = n % 100; return n + ((m > 10 && m < 14) ? 'th' : ({1: 'st', 2: 'nd', 3: 'rd'}[n % 10] || 'th')); };
    dial = '<div class="ui-dial-wrap"><div class="ui-dial ' + tier + '" title="' + esc(TIP.ti40) + ' The ring fills to the player’s league percentile that season.">' +
      '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44" style="stroke-dashoffset:' + (C * (1 - Math.max(.02, pt / 100))).toFixed(1) + '"/></svg>' +
      '<div class="v">' + n1(last.ti40) + '</div><div class="k">TI/40</div></div>' +
      '<div class="ui-dial-ctx"><div><b>' + ord(pt) + '</b>percentile · ' + seasonLbl(last.season) + '</div>' +
      (dt == null ? '' : '<div><b class="' + (dt > 0.05 ? 'up' : dt < -0.05 ? 'dn' : '') + '">' + (dt > 0.05 ? '▲ ' + dt.toFixed(1) : dt < -0.05 ? '▼ ' + (-dt).toFixed(1) : 'Same') + '</b>' + (Math.abs(dt) > 0.05 ? 'from ' + n1(prev.ti40) + ' ' : 'as ') + seasonLbl(prev.season) + '</div>') +
      (last.par != null ? '<div><b>' + n0(last.par) + '</b>pts above replacement</div>' : '') + '</div></div>';
  }
  var tabs = TABS.filter(function(t){ return t[0] !== 'college' || cl; });
  var tc = P.team && TDCNba.color(P.team);
  $('#app').innerHTML =
    '<div id="lgSwitch"></div>' +
    '<div class="nb-hero"' + (tc && window.tdcBandColor ? ' style="--tc-band:' + tdcBandColor(tc) + '"' : '') + '>' + tile + '<div class="nb-id">' +
      '<div class="nb-eyebrow">' + (P.team ? '<img src="' + lg + '" alt="" onerror="this.remove()">' + esc(teamName(P.team)) + '<span class="sep">·</span>' : '') + 'NBA' + (P.active === false ? '<span class="sep">·</span>Inactive' : '') + '</div>' +
      '<h1 class="nb-name">' + esc(P.name) + (P.career.star_seasons ? '<span class="nb-tag" title="Seasons in the top 5% of qualified NBA players by TDC Impact per 40">' + P.career.star_seasons + '× star season</span>' : '') + '</h1>' +
      '<div class="nb-bio">' +
        '<div><b>Pos</b>' + esc(P.pos || '—') + '</div>' +
        (P.height_in ? '<div><b>Ht / Wt</b>' + ht(P.height_in) + (P.weight ? ' · ' + Math.round(P.weight) : '') + '</div>' : '') +
        (P.dob ? '<div><b>Age</b>' + age(P.dob) + '</div>' : '') +
        '<div><b>Draft</b>' + esc(draftTxt) + '</div>' +
        (P.college ? '<div><b>College</b>' + (cl ? '<a href="player.html?espn=' + cl.college_id + '&name=' + encodeURIComponent(P.name) + '">' + esc(P.college) + '</a>' : esc(P.college)) + '</div>' : '') +
        '<div><b>Seasons</b>' + regs.length + (regs.length ? ' (' + seasonLbl(regs[0].season) + ' to ' + seasonLbl(regs[regs.length - 1].season) + ')' : '') + '</div>' +
      '</div>' + statRow + '</div>' + dial + '</div>' +

    '<th title="What a player with this college number usually does in his first 4 NBA seasons (fit on every drafted player 2010-2022)">Typical NBA result</th><th title="His actual number over his first 4 NBA seasons (1,000+ minutes)">His NBA result</th><th class="l">Verdict</th>' +
    '<th title="How tightly this stat carries over from college to the NBA: 1 = perfectly, 0 = not at all">How well it carries</th></tr></thead><tbody>';
  cl.translation.forEach(function(t){
    var v = '—', cls = 'eq';
    if(t.actual != null && t.expected != null){
      var diff = t.actual - t.expected, tol = Math.max(Math.abs(t.expected) * 0.1, FRAC[t.key] ? 0.01 : 0.3);
      var good = t.key === 'tov_pct' ? -diff : diff;
      if(Math.abs(diff) <= tol){ v = 'As expected'; }
      else if(NEUTRAL[t.key]){ v = diff > 0 ? 'Higher' : 'Lower'; }          // more usage isn't better or worse
      else if(good > 0){ v = 'Better'; cls = 'up'; } else { v = 'Worse'; cls = 'dn'; }
    }
    h += '<tr><td class="l">' + esc(t.stat) + '</td><td>' + fmt(t.key, t.college) + '</td><td>' + fmt(t.key, t.expected) + '</td><td>' + fmt(t.key, t.actual) +
      '</td><td class="l"><span class="verdict ' + cls + '">' + v + '</span></td><td>' + (t.r != null ? t.r.toFixed(2) : '—') + '</td></tr>';
  });
  h += '</tbody></table></div><p class="nb-note"><b>Typical NBA result</b> comes from every drafted college player 2010-2022: what a final college season like his usually becomes over the first four NBA seasons. "Better" or "Worse" means he beat or missed that by more than 10%. Shot blocking, offensive rebounding and passing carry over closely; efficiency and 3P% much less. College FT% predicts NBA 3P% better than college 3P% does.</p>';
  h += '<div class="nb-h">College seasons</div><div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l">Season</th><th class="l">Team</th><th>G</th><th>MIN</th><th>PPG</th><th>RPG</th><th>APG</th>' +
    th('TS%', 'ts') + '<th>3P%</th><th>FT%</th>' + th('USG%', 'usg') + th('AST%', 'ast') + th('BLK%', 'blk') + th('TI/40', 'TDC Impact per 40 (college scale)') + '</tr></thead><tbody>' +
    cl.seasons.map(function(s){ return '<tr><td class="l">' + seasonLbl(s.season) + '</td><td class="l">' + esc(s.team) + '</td><td>' + n0(s.g) + '</td><td>' + n0(s.min) + '</td><td>' + n1(s.ppg) + '</td><td>' + n1(s.rpg) + '</td><td>' + n1(s.apg) +
      '</td><td>' + pc(s.ts_pct) + '</td><td>' + pc(s.tp_pct) + '</td><td>' + pc(s.ft_pct) + '</td><td>' + n1(s.usg_pct) + '</td><td>' + n1(s.ast_pct) + '</td><td>' + n1(s.blk_pct) + '</td><td>' + n1(s.ti40) + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="nb-note"><a href="player.html?espn=' + cl.college_id + '&name=' + encodeURIComponent(P.name) + '" style="color:var(--accent)">Open his full college page →</a></p>';
  $('#pn-college').innerHTML = h;
}
})();
</script>
