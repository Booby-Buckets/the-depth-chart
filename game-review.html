  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--amber:#b5872a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#5ab875;--amber:#d8b05a;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    .page{max-width:940px;margin:0 auto;padding:30px 22px 90px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
    .eyebrow .lock{font-size:10px;color:var(--text3);border:1px solid var(--border2);border-radius:20px;padding:2px 8px;letter-spacing:.06em;}
    h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;}
    .sub{font-size:13px;color:var(--text3);margin-bottom:22px;max-width:760px;line-height:1.6;}
    .combo{position:relative;max-width:420px;margin-bottom:16px;}
    .search{width:100%;padding:12px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent);}
    .combo-list{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:30;max-height:340px;overflow-y:auto;background:var(--bg);border:1px solid var(--border2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);}
    .combo-item{padding:9px 13px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;font-weight:600;}
    .combo-item:hover{background:var(--bg3);}
    .combo-item .cr{color:var(--text3);font-weight:500;}
    .combo-empty{padding:12px;font-size:12px;color:var(--text3);}
    .loading{padding:40px;text-align:center;color:var(--text3);}
    .muted{font-size:12.5px;color:var(--text3);line-height:1.7;padding:22px 20px;text-align:center;}
    /* game log */
    .glog{display:flex;flex-direction:column;gap:6px;max-height:none;}
    .gitem{display:grid;grid-template-columns:64px 24px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);cursor:pointer;transition:border-color .15s;}
    .gitem:hover{border-color:var(--accent);}
    .gitem.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);}
    .gitem .gd{font-size:11px;color:var(--text3);font-weight:600;}
    .gitem .wl{font-weight:800;font-size:13px;text-align:center;}
    .gitem .wl.w{color:var(--green);} .gitem .wl.l{color:var(--red);}
    .gitem .go{font-size:13.5px;font-weight:700;}
    .gitem .go .at{color:var(--text3);font-weight:600;font-size:11px;}
    .gitem .gs{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text2);}
    .sec-h{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
    .sec-h::after{content:'';flex:1;height:1px;background:var(--border);}
    /* review */
    .rvhead{border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:18px 22px;margin-bottom:6px;}
    .rvscore{display:flex;align-items:center;justify-content:center;gap:16px;font-family:'Playfair Display',serif;font-weight:800;}
    .rvscore .tm{font-size:19px;} .rvscore .sc{font-size:30px;} .rvscore .dim{opacity:.5;}
    .rvverdict{font-size:14px;color:var(--text2);line-height:1.65;text-align:center;margin-top:10px;}
    .rvverdict b{color:var(--text);}
    .fcard{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;border:1px solid var(--border);border-radius:12px;background:var(--bg2);padding:13px 16px;margin-bottom:9px;position:relative;overflow:hidden;}
    .fcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fk);}
    .fnum{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text3);text-align:center;}
    .ftext .fh{font-weight:800;font-size:14px;margin-bottom:2px;}
    .ftext .fb{font-size:12.5px;color:var(--text2);line-height:1.55;}
    .fimp{text-align:right;white-space:nowrap;}
    .fimp .fv{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;}
    .fimp .fl{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .hurt .fv{color:var(--red);} .help .fv{color:var(--green);}
    .ctx{display:flex;flex-direction:column;gap:8px;}
    .ctxrow{font-size:12.5px;color:var(--text2);line-height:1.6;border-left:2px solid var(--border2);padding:2px 0 2px 12px;}
    .note{font-size:11px;color:var(--text3);line-height:1.6;margin-top:26px;max-width:760px;}

    .gr-band{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;border:1px solid var(--border2);border-radius:16px;background:var(--bg2);padding:18px 20px;}
    .gr-band .t{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-weight:800;font-size:20px;}
    .gr-band .t.r{justify-content:flex-end;text-align:right;} .gr-band .t img{width:34px;height:34px;object-fit:contain;}
    .gr-band .sc{font-family:'Playfair Display',serif;font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;text-align:center;line-height:1;}
    .gr-band .m{font-size:11.5px;color:var(--text3);text-align:center;margin-top:6px;} .gr-band .m a{color:var(--text2);}
    .gr-band .dim{opacity:.5;}
    @media(max-width:600px){.gr-band{grid-template-columns:1fr;text-align:center;} .gr-band .t,.gr-band .t.r{justify-content:center;}}
    .swing{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
    .swing td{padding:9px 8px;border-bottom:1px solid var(--border);}
    .swing .lab{font-weight:700;white-space:nowrap;width:30%;} .swing .v{width:70px;text-align:right;font-weight:800;}
    .swing .bar{position:relative;height:14px;}
    .swing .bar i{position:absolute;top:0;bottom:0;border-radius:4px;} .swing .bar b{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--text3);}
    .swing tr.tot td{border-top:2px solid var(--text);border-bottom:none;font-weight:800;}
    .swing .why{font-size:11px;color:var(--text3);font-weight:500;}
    .gr-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;} @media(max-width:860px){.gr-2{grid-template-columns:1fr;}}
    .gr-lbl{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin:0 0 8px;}
    .gr-muted{padding:24px 10px;text-align:center;color:var(--text3);font-size:12.5px;}
  </style>

<script>
const SB_URL='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
const tdch=()=>(window.tdcH?window.tdcH():H);
const el=id=>document.getElementById(id);
const esc=s=>(''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const sn=t=>(window.tdcShortSchool?window.tdcShortSchool(t):t);
const get=(u,h)=>fetch(SB_URL+'/rest/v1/'+u,{headers:h||H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
const SEASONS=[2027,2026,2025,2024,2023,2022,2021,2020];
const sl=y=>(y-1)+'-'+String(y).slice(2);

let D=null, selKey=null, SEASON=2026, GAMES=[], COLORMAP={}, EXP={rim:0.5615,mid:0.3848,three:0.341}, _gen=0;
const poolRow=k=>k!=null?D.teams[k]:null;
const labelOf=r=>r?r.full:'';
function _lum(hex){hex=(hex||'').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');if(hex.length<6)return .5;const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)/255;}
function colorOf(full){ const c=COLORMAP[full]||COLORMAP[sn(full)]; const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#A8843C';
  if(!c) return null; const dark=document.documentElement.getAttribute('data-theme')==='dark', l=_lum(c); if(!dark&&l>0.72) return null; if(dark&&l<0.16) return null; return c; }
function apart(c1,c2){ const h=x=>{x=(x||'').replace('#','');if(x.length===3)x=x.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(x.slice(i,i+2),16)||0);};
  const a=h(c1),b=h(c2); return Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])*(v-b[i]),0))>90; }

// ── picker ──
function comboMatches(q){
  const toks=(q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const ok=s=>{s=s.toLowerCase();return toks.every(t=>s.includes(t));};
  let out=[]; D.teams.forEach((r,i)=>{ if(!toks.length||ok(r.full+' '+r.team)) out.push({key:i,r}); });
  if(toks.length){ const pre=e=>e.r.full.toLowerCase().startsWith(toks[0])?0:1; out.sort((a,b)=>pre(a)-pre(b)||(a.r.rank||999)-(b.r.rank||999)); }
  else out.sort((a,b)=>(a.r.rank||999)-(b.r.rank||999));
  return out.slice(0,30);
}
function renderList(){
  const list=el('list'), m=comboMatches(el('sel').value);
  list.innerHTML=m.length? m.map(e=>`<div class="combo-item" data-key="${e.key}"><span>${(window.TDC_TEAM?TDC_TEAM.logoImg(e.r.full):'')}${esc(labelOf(e.r))}${e.r.conf?` <span class="cr">${esc(e.r.conf)}</span>`:''}</span><span class="cr">#${e.r.rank||'—'}</span></div>`).join('')
    : '<div class="combo-empty">No teams match</div>';
  list.style.display='block';
}
function pick(key){ selKey=+key; el('sel').value=labelOf(poolRow(+key)); el('list').style.display='none'; syncUrl(null); loadGames(); }
function syncUrl(gid){ const r=poolRow(selKey); if(!r) return; const q=new URLSearchParams(); q.set('team',r.team); if(SEASON!==2026) q.set('season',SEASON); if(gid) q.set('game',gid); history.replaceState(null,'','?'+q.toString()); }
(function wire(){
  const inp=el('sel'), list=el('list');
  inp.addEventListener('focus',()=>{ inp.select(); renderList(); });
  inp.addEventListener('input',()=>renderList());
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=list.querySelector('.combo-item'); if(f) pick(f.dataset.key); inp.blur(); }
    if(e.key==='Escape'){ list.style.display='none'; inp.value=labelOf(poolRow(selKey)); inp.blur(); } });
  inp.addEventListener('blur',()=>setTimeout(()=>{ list.style.display='none'; inp.value=labelOf(poolRow(selKey)); },160));
  list.addEventListener('mousedown',e=>{ const it=e.target.closest('.combo-item'); if(it){ e.preventDefault(); pick(it.dataset.key); } });
  const ss=el('season'); ss.innerHTML=SEASONS.map(y=>`<option value="${y}">${sl(y)}</option>`).join('');
  ss.addEventListener('change',()=>{ SEASON=+ss.value; syncUrl(null); loadGames(); });
})();

const fmtDate=d=>{ if(!d) return ''; const x=new Date(d+'T12:00:00'); return x.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };

// ── the season's game log as a sheet: click a row to review it ──
async function loadGames(wantGid){
  const row=poolRow(selKey); if(!row) return; const me=row.full, gen=++_gen;
  el('out').innerHTML=''; el('log').innerHTML='<div class="gr-muted">Loading games…</div>';
  const g=await get(`games?or=(home.eq.${encodeURIComponent(me)},away.eq.${encodeURIComponent(me)})&season_year=eq.${SEASON}&home_score=not.is.null&select=id,home,away,home_score,away_score,date,neutral&order=date.asc&limit=60`);
  if(gen!==_gen) return;
  GAMES=g||[];
  if(!GAMES.length){ el('log').innerHTML=`<div class="gr-muted">No completed ${sl(SEASON)} games on file for ${esc(me)}.</div>`; return; }
  const maxM=Math.max(10,...GAMES.map(x=>Math.abs(x.home_score-x.away_score)));
  let w=0,l=0;
  const rows=GAMES.map((x,i)=>{ const home=x.home===me, my=home?x.home_score:x.away_score, opp=home?x.away_score:x.home_score, m=my-opp, win=m>0; win?w++:l++;
    const pc=Math.min(50,50*Math.abs(m)/maxM);
    const bar=`<div class="mbar"><b></b><i style="${m>=0?`left:50%;width:${pc}%;background:var(--green)`:`right:50%;width:${pc}%;background:var(--red)`}"></i></div>`;
    return `<tr data-id="${x.id}"><td class="rk">${i+1}</td><td class="l dim">${fmtDate(x.date)}</td><td class="l dim">${x.neutral?'N':home?'vs':'@'}</td><td class="l nm">${esc(sn(home?x.away:x.home))}</td><td class="l" style="font-weight:800;color:${win?'var(--green)':'var(--red)'}">${win?'W':'L'}</td><td>${my}–${opp}</td><td class="big">${m>0?'+':''}${m}</td><td style="width:34%">${bar}</td><td class="dim">${w}–${l}</td></tr>`; }).join('');
  el('log').innerHTML=`<div class="sec-h">${sl(SEASON)} games <span class="hint">${w}–${l} · pick a game</span></div><div class="sheet-wrap gr-log"><table class="sheet dense"><thead><tr><th class="rk">#</th><th class="l">Date</th><th class="l"></th><th class="l">Opponent</th><th class="l"></th><th>Score</th><th>Margin</th><th class="l"></th><th>Record</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  el('log').querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener("click",()=>openGame(tr.dataset.id)));
  const start=wantGid&&GAMES.find(x=>String(x.id)===String(wantGid))?wantGid:GAMES[GAMES.length-1].id;
  openGame(start);
}
function openGame(gid){
  el('log').querySelectorAll('tbody tr').forEach(x=>x.classList.toggle('on',String(x.dataset.id)===String(gid)));
  const tr=el('log').querySelector(`tr[data-id="${gid}"]`); if(tr) tr.scrollIntoView({block:'nearest'});
  syncUrl(gid); review(gid, poolRow(selKey).full);
}

const N=v=>v==null?0:+v||0;
function agg(box){ const t={}; box.forEach(b=>{ const s=t[b.team]||(t[b.team]={pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,tov:0});
  ['pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','tov'].forEach(k=>s[k]+=N(b[k])); }); return t; }
function zoneOf(s){ if(s.sv===3) return 'three'; const st=(s.stype||'').toLowerCase(); return /layup|dunk|tip|alley|finger|slam/.test(st)?'rim':'mid'; }
function expEfgOf(shots){ if(!shots||!shots.length) return null; let e=0; shots.forEach(s=>{ const z=zoneOf(s); e+= z==='three'?EXP.three*1.5:EXP[z]; }); return e/shots.length; }

// ── one game ──
async function review(gid, me){
  const gen=++_gen;
  el('out').innerHTML='<div class="gr-muted">Loading the game…</div>';
  const g=GAMES.find(x=>String(x.id)===String(gid))||{};
  const [box, shots, tids]=await Promise.all([
    get(`box_scores?game_id=eq.${gid}&select=team,pts,fgm,fga,tpm,tpa,ftm,fta,oreb,dreb,tov`),
    get(`shots?game_id=eq.${gid}&select=x,y,made,sv,dist,stype,team_id,espn_id,game_id&limit=900`, tdch()),
    get(`team_seasons?team=in.(${[g.home,g.away].filter(Boolean).map(t=>'"'+t.replace(/"/g,'')+'"').join(',')})&select=team,team_id&limit=4`)]);
  if(gen!==_gen) return;
  const t=agg(box||[]); const names=Object.keys(t);
  if(names.length!==2){ el('out').innerHTML=`<div class="gr-muted">No box score on file for this game. <a href="game.html?id=${gid}">Open the game page →</a></div>`; return; }
  const nameA=me in t?me:names[0], nameB=names.find(x=>x!==nameA);
  const A=t[nameA], B=t[nameB];
  let cA=colorOf(nameA)||'#B07D17', cB=colorOf(nameB)||'#2F7FC1'; if(!apart(cA,cB)) cB='#8A867A';
  const nA=sn(nameA), nB=sn(nameB), margin=A.pts-B.pts;
  const tid={}; (tids||[]).forEach(r=>tid[r.team]=String(r.team_id));
  const shotsA=(shots||[]).filter(s=>String(s.team_id)===tid[nameA]), shotsB=(shots||[]).filter(s=>String(s.team_id)===tid[nameB]);

  // EXACT decomposition of the margin (sums to the final score, no fitted weights):
  //   points = 2·eFG·FGA + FTM, and FGA = possessions − TOV − 0.44·FTA + OREB, so
  //   margin = 2·ΔeFG·avgFGA (shooting) − 2·ē·ΔTOV (turnovers) + 2·ē·ΔOREB (off. rebounds)
  //          + (ΔFTM − 2·ē·0.44·ΔFTA) (free throws, net of the shots they replace) + 2·ē·Δposs (possessions)
  const efg=x=>x.fga?(x.fgm+0.5*x.tpm)/x.fga:0, orp=(x,y)=>{ const d=x.oreb+y.dreb; return d?x.oreb/d:0; }, tp=x=>x.tpa?x.tpm/x.tpa:0;
  const eA=efg(A), eB=efg(B), oA=orp(A,B), oB=orp(B,A), eM=(eA+eB)/2;
  const possOf=x=>x.fga-x.oreb+x.tov+0.44*x.fta;
  const F=[
    {lab:'Shooting (eFG%)', imp:2*(eA-eB)*(A.fga+B.fga)/2, why:`${(100*eA).toFixed(1)}% to ${(100*eB).toFixed(1)}% on ${A.fga} and ${B.fga} shots`},
    {lab:'Turnovers', imp:-2*eM*(A.tov-B.tov), why:`${A.tov} to ${B.tov} · each one is a shot not taken`},
    {lab:'Offensive rebounds', imp:2*eM*(A.oreb-B.oreb), why:`${A.oreb} to ${B.oreb} · ${(100*oA).toFixed(0)}% to ${(100*oB).toFixed(0)}% of their misses`},
    {lab:'Free throws', imp:(A.ftm-B.ftm)-2*eM*0.44*(A.fta-B.fta), why:`${A.ftm}/${A.fta} to ${B.ftm}/${B.fta} · net of the shots they replace`},
    {lab:'Possessions', imp:2*eM*(possOf(A)-possOf(B)), why:`${possOf(A).toFixed(1)} to ${possOf(B).toFixed(1)} (estimated)`},
  ];
  const mx=Math.max(4,Math.abs(margin),...F.map(f=>Math.abs(f.imp)));
  const bar=v=>{ const p=Math.min(50,50*Math.abs(v)/mx); return `<div class="bar"><b></b><i style="${v>=0?`left:50%;width:${p}%;background:${cA}`:`right:50%;width:${p}%;background:${cB}`}"></i></div>`; };
  const swing=`<table class="swing"><tbody>${F.map(f=>`<tr><td class="lab">${f.lab}<div class="why">${f.why}</div></td><td>${bar(f.imp)}</td><td class="v" style="color:${Math.abs(f.imp)<0.05?'var(--text3)':f.imp>=0?cA:cB}">${Math.abs(f.imp)<0.05?'0.0':(f.imp>=0?'+':'')+f.imp.toFixed(1)}</td></tr>`).join('')}
    <tr class="tot"><td class="lab">Final margin</td><td>${bar(margin)}</td><td class="v">${margin>0?'+':''}${margin}</td></tr></tbody></table>`;

  // context rows (explanatory, not additive): three-point variance and shot quality
  const ctx=[];
  const par3=x=>(tp(x)-EXP.three)*x.tpa*3;
  ctx.push(['3-point shooting vs D-I rate', `${A.tpm}/${A.tpa} (${(100*tp(A)).toFixed(0)}%)`, `${(par3(A)>=0?'+':'')+par3(A).toFixed(1)} pts`, `${B.tpm}/${B.tpa} (${(100*tp(B)).toFixed(0)}%)`, `${(par3(B)>=0?'+':'')+par3(B).toFixed(1)} pts`]);
  const xA=expEfgOf(shotsA.length>=25?shotsA:null), xB=expEfgOf(shotsB.length>=25?shotsB:null);
  if(xA!=null&&xB!=null) ctx.push(['Shot quality → shot-making', `${(100*xA).toFixed(1)}% exp. eFG`, `${((eA-xA)*A.fga*2>=0?'+':'')+((eA-xA)*A.fga*2).toFixed(1)} pts`, `${(100*xB).toFixed(1)}% exp. eFG`, `${((eB-xB)*B.fga*2>=0?'+':'')+((eB-xB)*B.fga*2).toFixed(1)} pts`]);
  const poss=x=>x.fga-x.oreb+x.tov+0.44*x.fta, pA=poss(A), pB=poss(B);
  const BX=[['Points',A.pts,B.pts],['Possessions (est.)',pA.toFixed(0),pB.toFixed(0)],['Points per possession',(A.pts/pA).toFixed(2),(B.pts/pB).toFixed(2)],
    ['FG',`${A.fgm}/${A.fga}`,`${B.fgm}/${B.fga}`],['eFG%',(100*eA).toFixed(1),(100*eB).toFixed(1)],['3P',`${A.tpm}/${A.tpa}`,`${B.tpm}/${B.tpa}`],
    ['FT',`${A.ftm}/${A.fta}`,`${B.ftm}/${B.fta}`],['Off. rebounds',A.oreb,B.oreb],['Def. rebounds',A.dreb,B.dreb],['Turnovers',A.tov,B.tov]];
  const boxT=`<div class="sheet-wrap"><table class="sheet dense"><thead><tr><th class="l"></th><th>${esc(nA)}</th><th>${esc(nB)}</th></tr></thead><tbody>${BX.map(r=>`<tr><td class="l nm">${r[0]}</td><td class="big">${r[1]}</td><td class="big">${r[2]}</td></tr>`).join('')}</tbody></table></div>`;
  const ctxT=`<div class="sheet-wrap" style="margin-top:12px"><table class="sheet dense"><thead><tr><th class="l">Context · not part of the sum</th><th>${esc(nA)}</th><th>vs par</th><th>${esc(nB)}</th><th>vs par</th></tr></thead><tbody>${ctx.map(r=>`<tr><td class="l nm">${r[0]}</td><td>${r[1]}</td><td class="big">${r[2]}</td><td>${r[3]}</td><td class="big">${r[4]}</td></tr>`).join('')}</tbody></table></div>`;

  const logo=n=>window.TDC_TEAM&&TDC_TEAM.logo?TDC_TEAM.logo(n):'';
  const site=g.neutral?'Neutral site':(g.home===nameA?`at ${esc(nA)}`:`at ${esc(nB)}`);
  const won=margin>0;
  el('out').innerHTML=`
    <section class="gr-sec"><div class="gr-band">
      <div class="t${won?'':' dim'}">${logo(nameA)?`<img src="${logo(nameA)}" alt="">`:''}${esc(nA)}</div>
      <div><div class="sc"><span${won?'':' class="dim"'}>${A.pts}</span> – <span${won?' class="dim"':''}>${B.pts}</span></div><div class="m">${fmtDate(g.date)} · ${site} · <a href="game.html?id=${gid}">box score</a></div></div>
      <div class="t r${won?' dim':''}">${esc(nB)}${logo(nameB)?`<img src="${logo(nameB)}" alt="">`:''}</div>
    </div></section>
    <section class="gr-sec"><div class="sec-h">Where the margin came from <span class="hint">points each factor was worth — they add up to the final margin · bars toward ${esc(nA)} (right) or ${esc(nB)} (left)</span></div>${swing}</section>
    <section class="gr-sec"><div class="sec-h">Side by side <span class="hint">the box numbers</span></div><div class="gr-2"><div>${boxT}</div><div>${ctxT}</div></div></section>
    <section class="gr-sec"><div class="sec-h">Game flow &amp; rotation <span class="hint">ESPN play-by-play</span></div><div id="grFlow"><div class="gr-muted">Loading play-by-play…</div></div></section>
    <section class="gr-sec"><div class="sec-h">Shot charts <span class="hint">this game</span></div><div class="gr-2"><div><div class="gr-lbl">${esc(nA)}</div><div id="grShotA"></div></div><div><div class="gr-lbl">${esc(nB)}</div><div id="grShotB"></div></div></div></section>`;
  if(window.TDC_GAMEFLOW) TDC_GAMEFLOW.mount(el('grFlow'), gid); else el('grFlow').innerHTML='';
  if(window.TDC_SHOTCHART){
    TDC_SHOTCHART.render(el('grShotA'), shotsA, {subtitle:nA, kind:'team', season:SEASON, color:cA});
    TDC_SHOTCHART.render(el('grShotB'), shotsB, {subtitle:nB, kind:'team', season:SEASON, color:cB});
  }
  if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(el('out'));
}

(async function(){
  try{ const arr=await fetch('scripts/data/team_colors.json').then(r=>r.ok?r.json():[]);
    (arr||[]).forEach(e=>{ if(e&&e.c1){ if(e.location) COLORMAP[e.location]=e.c1; if(e.display) COLORMAP[e.display]=e.c1; } });
  }catch(e){}
  try{ const sg=await fetch('scripts/data/shot_genome_teams.json').then(r=>r.ok?r.json():null);
    const zm=sg&&sg.meta&&sg.meta.zone_make; if(zm){ EXP.rim=zm.rim||EXP.rim; EXP.mid=zm.mid||EXP.mid; EXP.three=((zm.atb3||.335)*3+(zm.corner3||.359))/4; }
  }catch(e){}
  D=await TDC_RATINGS.get();
  D.teams=(D.teams||[]).filter(t=>t.rating!=null).sort((a,b)=>(a.rank||999)-(b.rank||999));
  const qs=new URLSearchParams(location.search);
  const ys=+qs.get('season'); if(SEASONS.indexOf(ys)>=0){ SEASON=ys; } el('season').value=String(SEASON);
  const want=(qs.get('team')||'').toLowerCase();
  if(want){ const i=D.teams.findIndex(t=>t.full.toLowerCase()===want||t.team.toLowerCase()===want); if(i>=0){ selKey=i; el('sel').value=labelOf(poolRow(i)); loadGames(qs.get('game')); } }
})();
</script>
