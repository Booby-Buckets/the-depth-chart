// ── Projected 2026-27 grade ───────────────────────────────────────────────
// The grade for the projection should MOVE with the projected line — a bigger
// role/production raises it, a reduced role or efficiency drop lowers it — instead
// of statically carrying forward last year's grade. Anchored on the real grade, so
// it stays calibrated per-player; nudged by the change in box-score value.
function _effAdj(s){ var fg=parseFloat(s.fg_pct)||0, ppg=parseFloat(s.ppg)||0; return fg?(fg/100-0.47)*ppg*1.1:0; } // reward efficient scoring, penalize inefficient volume
function _prodVal(s){ if(!s) return 0;
  return 1.0*(parseFloat(s.ppg)||0)+0.7*(parseFloat(s.apg)||0)+0.65*(parseFloat(s.rpg)||0)
        +1.5*(parseFloat(s.stl)||0)+0.9*(parseFloat(s.blk)||0)-1.2*(parseFloat(s.tovs)||0)
        +_effAdj(s)+0.04*(parseFloat(s.mpg)||0); }

function _projectedGrade(){
  var pl=playerProjLine(); if(!pl || pl._frosh || pl._noStatEst) return null;   // no real projection to grade
  if(!((parseFloat(player.ppg)||0)>0 || (parseFloat(player.mpg)||0)>=2)) return null; // need a real prior line to delta from
  var anchor=parseInt(player.tdc_grade); if(isNaN(anchor)) return null;
  var delta=(_prodVal(pl)-_prodVal(player))*0.45;                  // box-value change -> grade points
  var g=Math.round(anchor+delta);
  return Math.max(anchor-8, Math.min(anchor+8, Math.min(99,g)));   // clamp swings; stay anchored
}

// Overall progression chart — player's TDC grade across seasons, over a faint
// "normal progression" (Fr→Grad) reference ramp.
function buildProgression(p){
  // dedupe career history by season (keep most games), chronological, graded only
  var byYear={};
  (careerHistory||[]).forEach(function(s){
    var g=parseInt(s.tdc_grade); if(isNaN(g)) return;
    var yr=+s.season_year, gp=+s.gp||0;
    if(!byYear[yr]||gp>(byYear[yr].gp||0)) byYear[yr]={yr:yr,grade:g,gp:gp,cls:s.yr};
  });
  var pts=Object.keys(byYear).map(function(k){return byYear[k];}).sort(function(a,b){return a.yr-b.yr;});
  // Only project a 2026-27 point if the player is actually on a current roster
  // (proj is set). Graduated/departed players — loaded from history, proj=null —
  // end at the last season they played.
  var pg=_projectedGrade(); if(pg==null||isNaN(pg)) pg=parseInt(p.tdc_grade);
  if(proj && !isNaN(pg)) pts.push({yr:2027,grade:pg,proj:true,cls:p.yr||p.class_year});
  if(!pts.length) return '';

  var CLS=['Fr','So','Jr','Sr','Gr'], BASE=[64,69,73,76,79];
  pts.forEach(function(pt,i){
    var ci=Math.min(i,4);  // chronological class position (yr field is unreliable)
    pt.cidx=ci; pt.base=BASE[ci];
    pt.label=(''+(pt.yr-1)).slice(-2)+'-'+(''+pt.yr).slice(-2);
    pt.clsLabel=CLS[ci];
  });

  var W=1180,H=270,padL=42,padR=24,padT=30,padB=46;
  var vals=pts.map(function(x){return x.grade;}).concat(pts.map(function(x){return x.base;}));
  var lo=Math.max(45,Math.floor((Math.min.apply(null,vals)-5)/5)*5);
  var hi=Math.min(99,Math.ceil((Math.max.apply(null,vals)+5)/5)*5);
  if(hi-lo<15){hi=Math.min(99,lo+15);}
  var xx=function(i){ return pts.length<2?(W/2):(padL+(W-padL-padR)*i/(pts.length-1)); };
  var yy=function(g){ return padT+(H-padT-padB)*(1-(g-lo)/(hi-lo)); };
  var accent=(teamData&&teamData.color)||'#B16BFF';

  // y gridlines
  var grid='';
  for(var gv=lo; gv<=hi; gv+=5){ var gy=yy(gv).toFixed(1);
    grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1" opacity=".5"/>'
        +'<text x="'+(padL-9)+'" y="'+gy+'" font-size="9" fill="var(--text3)" font-weight="600" text-anchor="end" dominant-baseline="middle">'+gv+'</text>'; }

  // baseline ("normal progression") — faint area + dashed line
  var baseLine=pts.map(function(pt,i){return (i?'L':'M')+xx(i).toFixed(1)+' '+yy(pt.base).toFixed(1);}).join(' ');
  var baseArea='M'+xx(0).toFixed(1)+' '+yy(lo).toFixed(1)+' '+pts.map(function(pt,i){return 'L'+xx(i).toFixed(1)+' '+yy(pt.base).toFixed(1);}).join(' ')+' L'+xx(pts.length-1).toFixed(1)+' '+yy(lo).toFixed(1)+' Z';

  // player line + dots + value labels + x labels
  var line=pts.map(function(pt,i){return (i?'L':'M')+xx(i).toFixed(1)+' '+yy(pt.grade).toFixed(1);}).join(' ');
  var dots='', xlabels='';
  pts.forEach(function(pt,i){
    var cx=xx(i).toFixed(1), cy=yy(pt.grade).toFixed(1);
    var anc=(i===0)?'start':(i===pts.length-1?'end':'middle');
    var lx=(i===0)?(xx(i)-2):(i===pts.length-1?(xx(i)+2):xx(i));
    dots+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(pt.proj?4.5:4)+'" fill="'+(pt.proj?'var(--bg)':accent)+'" stroke="'+accent+'" stroke-width="2.5"/>'
       +'<text x="'+lx.toFixed(1)+'" y="'+(yy(pt.grade)-11).toFixed(1)+'" font-size="12" font-weight="800" fill="'+accent+'" text-anchor="'+anc+'" font-family="Playfair Display,serif">'+pt.grade+'</text>';
    xlabels+='<text x="'+cx+'" y="'+(H-padB+18)+'" font-size="10" fill="var(--text2)" font-weight="700" text-anchor="middle">'+pt.label+(pt.proj?' ★':'')+'</text>'
          +'<text x="'+cx+'" y="'+(H-padB+31)+'" font-size="9" fill="var(--text3)" font-weight="600" text-anchor="middle">'+pt.clsLabel+'</text>';
  });

  return '<div class="sec-title" style="margin-bottom:6px;">Overall Progression</div>'
    +'<div class="prog-legend"><span><i class="pl-line"></i>'+p.name.split(' ')[0]+'</span><span><i class="pl-base"></i>Typical Fr→Grad arc</span></div>'
    +'<div class="prog-wrap"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;">'
    +grid
    +'<path d="'+baseArea+'" fill="var(--text3)" opacity=".08"/>'
    +'<path d="'+baseLine+'" fill="none" stroke="var(--text3)" stroke-width="2" stroke-dasharray="5 4" opacity=".45"/>'
    +'<path d="'+line+'" fill="none" stroke="'+accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+xlabels
    +'</svg></div>';
}

function buildStatNarrative(p){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const pos=p.position||'G'; const name=p.name.split(' ')[0];
  const yr=(p.yr||p.class_year||'');

  let parts=[];
  if(ppg>0) parts.push(`${name} averaged ${ppg.toFixed(1)} points, ${rpg.toFixed(1)} rebounds, and ${apg.toFixed(1)} assists per game in 2026-27.`);
  if(fg>0){
    const fgDesc=fg>=52?'highly efficient':fg>=46?'efficient':fg>=42?'average':'below-average';
    parts.push(`Shot ${fg.toFixed(1)}% from the field — ${fgDesc} for the position.`);
  }
  if(tp>0&&(parseFloat(p.tpa)||0)>2){
    const tpDesc=tp>=40?'elite':tp>=36?'solid':tp>=32?'adequate':'concerning';
    parts.push(`Connected at ${tp.toFixed(1)}% from three — ${tpDesc} efficiency on ${(parseFloat(p.tpa)||0).toFixed(1)} attempts.`);
  }
  if(stl+blk>1.5) parts.push(`Provides defensive value with ${stl.toFixed(1)} steals and ${blk.toFixed(1)} blocks per game.`);
  if(yr) parts.push(`As a ${yr} ${pos}, ${name} will be an important piece of the program going forward.`);

  return parts.join(' ')||'Insufficient stats for narrative.';
}

// ── RADAR CHART ─────────────────────────────────────────
function _rgbaOf(hex,a){var c=(typeof _hexToRgb==='function')?_hexToRgb(hex):null;return c?'rgba('+c.r+','+c.g+','+c.b+','+a+')':'rgba(150,150,150,'+a+')';}
// smooth closed Catmull-Rom curve through points (rounded radar)
function _radarSmooth(ctx,pts){
  var nn=pts.length;
  if(nn<3){ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<nn;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();return;}
  ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=0;i<nn;i++){
    var p0=pts[(i-1+nn)%nn],p1=pts[i],p2=pts[(i+1)%nn],p3=pts[(i+2)%nn];
    var c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    ctx.bezierCurveTo(c1x,c1y,c2x,c2y,p2.x,p2.y);
  }
  ctx.closePath();
}
function drawRadar(progress){
  const prog=(typeof progress==='number')?progress:1;
  const canvas=document.getElementById('radarChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=player;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textCol=isDark?'#a0a0a0':'#888';
  const gridCol=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const color=teamData?.color||'#8B6914';

  // 8 skill axes — percentile vs EVERY player in the database
  const AXLAB=['Scoring','Efficiency','3-Point','Playmaking','Rebounding','Defense','Usage','Ball Care'];
  function axesOf(s){
    return [
      Math.min(100,getPctNat(s.ppg,'ppg')),
      Math.min(100,Math.round((getPctNat(s.fg_pct,'fg_pct')+getPctNat(s.ft_pct,'ft_pct'))/2)),
      getPctNat(s.tp_pct,'tp_pct'),
      getPctNat(s.apg,'apg'),
      getPctNat(s.rpg,'rpg'),
      Math.round((getPctNat(s.stl,'stl')+getPctNat(s.blk,'blk'))/2),
      getPctNat(s.mpg,'mpg'),
      getPctNat(s.tovs,'tovs'),
    ];
  }

  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-30;
  const n=AXLAB.length;
  const accent=(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim())||'#B16BFF';

  // concentric circular grid rings
  for(let ring=5;ring>=1;ring--){
    ctx.beginPath(); ctx.arc(cx,cy,r*ring/5,0,Math.PI*2);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  }
  // axis spokes + labels
  AXLAB.forEach((lab,i)=>{
    const angle=Math.PI*2*i/n-Math.PI/2;
    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
    const lx=cx+Math.cos(angle)*(r+15), ly=cy+Math.sin(angle)*(r+15);
    ctx.fillStyle=textCol; ctx.font='bold 9.5px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(lab,lx,ly);
  });

  function drawShape(vals, baseCol, fillA, alpha){
    ctx.save(); ctx.globalAlpha=(alpha==null?1:alpha);
    const pts=vals.map((v,i)=>{const angle=Math.PI*2*i/n-Math.PI/2;const val=v/100*prog;return {x:cx+Math.cos(angle)*r*val, y:cy+Math.sin(angle)*r*val};});
    if(fillA>0){
      ctx.beginPath(); _radarSmooth(ctx,pts);
      const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      grad.addColorStop(0,_rgbaOf(baseCol,Math.min(0.5,fillA*1.7)));
      grad.addColorStop(1,_rgbaOf(baseCol,fillA*0.4));
      ctx.fillStyle=grad; ctx.fill();
    }
    ctx.beginPath(); _radarSmooth(ctx,pts);
    ctx.shadowColor=_rgbaOf(baseCol,0.45); ctx.shadowBlur=10;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=baseCol; ctx.lineWidth=2.2; ctx.stroke(); ctx.shadowBlur=0;
    if(prog>0.82){
      pts.forEach(pt=>{
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fillStyle=baseCol; ctx.fill();
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.lineWidth=1.5; ctx.strokeStyle=isDark?'#0b0a12':'#fff'; ctx.stroke();
      });
    }
    ctx.restore();
  }

  // build a series per season actually played (deduped, with stats) + projected
  var byYear={};
  (careerHistory||[]).forEach(function(s){ if(s.ppg==null) return; var yr=+s.season_year, gp=+s.gp||0; if(!byYear[yr]||gp>(byYear[yr].gp||0)) byYear[yr]=s; });
  var seasons=Object.keys(byYear).map(function(k){return byYear[k];}).sort(function(a,b){return a.season_year-b.season_year;});
  if(!seasons.length) seasons=[p];
  var PAL=['#6d6589','#74aedd','#e0a35a','#cf7d72','#5ab875','#c98bd4','#5b9d8f'];
  var series=seasons.map(function(s,i){
    var isLast=(i===seasons.length-1);
    return {lbl:_seasonLbl(s.season_year)||'Actual', col:(isLast?color:PAL[i%PAL.length]),
            vals:axesOf(s), alpha:1, fill:(isLast?0.16:0), proj:false};
  });
  if(proj && !proj._frosh) series.push({lbl:_seasonLbl(2027)+' Proj', col:accent, vals:axesOf(proj), alpha:0.95, fill:0.14, proj:true});

  var vis=window._radarVis=window._radarVis||{};
  // projected behind, then seasons oldest→newest (most recent on top)
  var pj=series.filter(function(s){return s.proj;})[0];
  if(pj && vis[pj.lbl]!==false) drawShape(pj.vals, pj.col, pj.fill, pj.alpha);
  series.filter(function(s){return !s.proj;}).forEach(function(sv){ if(vis[sv.lbl]!==false) drawShape(sv.vals, sv.col, sv.fill, sv.alpha); });

  // toggleable legend
  const legendEl=document.getElementById('radarLegend');
  if(legendEl){
    legendEl.innerHTML=series.map(function(sv){
      var off=(vis[sv.lbl]===false);
      return '<div class="radar-legend-item'+(off?' off':'')+'" onclick="_radarToggle(\''+sv.lbl+'\')">'
        +'<div class="radar-legend-dot" style="background:'+sv.col+';'+(sv.proj?'opacity:.95;':'')+'"></div>'+sv.lbl+'</div>';
    }).join('');
  }
}
function _radarToggle(lbl){ var v=window._radarVis=window._radarVis||{}; v[lbl]=(v[lbl]===false); drawRadar(1); }
function animateRadar(){
  var start=null, dur=780, done=false;
  function ease(t){return 1-Math.pow(1-t,3);}
  function step(ts){ if(start===null)start=ts; var p=Math.min(1,(ts-start)/dur); drawRadar(ease(p)); if(p<1)requestAnimationFrame(step); else done=true; }
  requestAnimationFrame(step);

  setTimeout(function(){ if(!done) drawRadar(1); }, dur+260);
}

  // vertices + value labels (labels fade in near the end)
  axes.forEach(function(ax,i){
    var a=Math.PI*2*i/n-Math.PI/2, v=ax.val/100*prog, x=cx+Math.cos(a)*r*v, y=cy+Math.sin(a)*r*v, isBest=i===_archFitBest;
    ctx.beginPath(); ctx.arc(x,y,isBest?4.2:2.8,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,isBest?4.2:2.8,0,Math.PI*2); ctx.lineWidth=1.6; ctx.strokeStyle=isDark?'#0b0a12':'#fff'; ctx.stroke();
    if(ax.val>=14&&prog>=0.6){var lp=(prog-0.6)/0.4,tv=ax.val/100,tx=cx+Math.cos(a)*(r*tv+ (isBest?14:12)), ty=cy+Math.sin(a)*(r*tv+ (isBest?14:12));
      ctx.globalAlpha=lp; ctx.fillStyle=isBest?color:textCol; ctx.font=(isBest?'bold ':'600 ')+'10px Inter,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ax.val+'%',tx,ty); ctx.globalAlpha=1;}
  });

function animateArchFit(){
  var start=null, dur=760, done=false;
  function ease(t){return 1-Math.pow(1-t,3);}
  function step(ts){ if(start===null)start=ts; var p=Math.min(1,(ts-start)/dur); drawArchFit(ease(p)); if(p<1)requestAnimationFrame(step); else done=true; }
  requestAnimationFrame(step);
  setTimeout(function(){ if(!done) drawArchFit(1); }, dur+260);
}

async function renderArchetype(){
  var el=document.getElementById('archetypeContent'); if(!el||!player) return;
  if(_archDone) return; _archDone=true;
  el.innerHTML='<div style="padding:50px;text-align:center;color:var(--text3);">Analyzing archetype & finding comps…</div>';
  if(!_allHistory){
    try{
      // Get total row count first, then fetch all pages concurrently in batches
      var _PG=1000;
      var _hd=await fetch(SB+'/rest/v1/player_history?select=name&mpg=gte.10',
        {method:'HEAD',headers:{...H,'Prefer':'count=exact'}});
      var _total=parseInt((_hd.headers.get('content-range')||'/0').split('/')[1]||0);
      var _pages=Math.ceil(_total/_PG);
      var _url=SB+'/rest/v1/player_history?select=name,season_year,team,position,ppg,rpg,apg,stl,blk,tpm,mpg,fg_pct,tp_pct,ft_pct,fga,fta&mpg=gte.10';
      var _fetches=Array.from({length:_pages},function(_,pg){
        return fetch(_url,{headers:{...H,'Range-Unit':'items','Range':pg*_PG+'-'+(pg*_PG+_PG-1)}}).then(function(r){return r.ok?r.json():[]; });
      });
      // Process concurrently in batches of 8 to stay within browser connection limits
      var _allRows=[];
      for(var _j=0;_j<_fetches.length;_j+=8){
        var _res=await Promise.all(_fetches.slice(_j,_j+8));
        _res.forEach(function(b){ _allRows=_allRows.concat(b); });
      }
      _allHistory=_allRows;
    }catch(e){ _allHistory=[]; }
  }
  if(!_allCurrent){
    try{ var rc=await fetch(SB+'/rest/v1/players?select=name,team,position,height,ppg,rpg,apg,mpg,fg_pct,tp_pct,ft_pct,fgm,fga,tpm,tpa,ftm,fta,stl,blk,tovs,tdc_grade&ppg=not.is.null&limit=5000',{headers:H}); _allCurrent=rc.ok?await rc.json():[]; }catch(e){ _allCurrent=[]; }
  }
  if(!window._teamConf){
    try{ var rt=await fetch(SB+'/rest/v1/teams?select=name,conf',{headers:H}); window._teamConf={}; (rt.ok?await rt.json():[]).forEach(function(t){window._teamConf[t.name]=t.conf||'';}); }catch(e){ window._teamConf={}; }
  }
  var grp=_norm3(player.position);
  var pf=_feat(player), ph=_htIn(player.height);

  // projected (2026-27) percentile pool — every player's predicted line, so the
  // archetype ranks predicted production against predicted peers (same basis as Impact)
  if(!_gPctProj){
    var plines=_allCurrent.map(function(q){return projLine(q);}).filter(function(l){return (+l.mpg||0)>=8;});
    _gPctProj={};
    ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs'].forEach(function(k){
      _gPctProj[k]=plines.map(function(l){return +l[k]||0;}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
    });
  }
  // getPctProj is a global (defined near buildArchFit) so the season switcher can reuse it

  // archetype-fit radar — player's real projected 2026-27 line vs projected peers
  var projP=playerProjLine();
  var fit=buildArchFit(projP,grp,getPctProj);
  _archFitAxes=fit.axes; _archFitBest=fit.best;
  _archFitColor=(teamData&&teamData.color)||'#B16BFF';
  var fitBasis='projected';
  // hero archetype = the radar's strongest fit, so label and chart always agree
  var bestDef=(ARCH_FIT[grp]||ARCH_FIT.W)[fit.best]||{name:'Combo Guard',desc:''};
  var info={name:bestDef.name, desc:bestDef.desc, group:grp};

  // advanced percentile chart: projected national vs projected archetype peers
  var peerPool=_allCurrent.filter(function(q){return q.name&&q.name!=='—'&&(parseFloat(q.mpg)||0)>=10&&_norm3(q.position)===grp;});
  var peerProj=peerPool.map(function(q){return projLine(q);});
  var DEFS=[{l:'PPG',k:'ppg'},{l:'RPG',k:'rpg'},{l:'APG',k:'apg'},{l:'FG%',k:'fg_pct'},{l:'3P%',k:'tp_pct'},{l:'FT%',k:'ft_pct'},{l:'STL',k:'stl'},{l:'BLK',k:'blk'},{l:'TO',k:'tovs',inv:1}];
  var peerCache={};
  var cols=DEFS.map(function(d){
    var nat=getPctProj(projP[d.k],d.k);
    if(d.inv&&nat!=null) nat=100-nat;
    if(!peerCache[d.k]) peerCache[d.k]=peerProj.map(function(l){return +l[d.k]||0;}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
    var pr=pctIn(peerCache[d.k],projP[d.k],d.inv);
    function bar(v,cls){if(v==null)return '';return '<div class="arch-bar '+cls+'" style="height:'+Math.max(v,3)+'%;"><div class="arch-v">'+v+'</div></div>';}
    return '<div class="arch-col"><div class="arch-bars">'+bar(nat,'nat')+bar(pr,'peer')+'</div><div class="arch-lbl">'+d.l+'</div></div>';
  }).join('');

  // Comp pool: real played seasons only (player_history, 2012-2026).
  // Excludes 2026-27 projections from _allCurrent.
  var allPool=[];
  (_allHistory||[]).filter(function(q){return q.name&&q.name!==player.name&&(parseFloat(q.mpg)||0)>=10&&_norm3(q.position)===grp;})
    .forEach(function(q){allPool.push({p:q,isCur:false,ht:0});});

  // Normalize z-scores across the pool
  var nAll=_normStats(allPool.map(function(c){return _feat(c.p);}).concat([pf]));

  // Score each candidate — apply archetype bonus and conference tier penalty
  var playerArchName=info.name;
  var pTier=_confTier(player.team);
  var scored=allPool.map(function(c){
    var bArch=archetypeInfo(c.p).name;
    var cTier=_confTier(c.p.team);
    var d=_dist(pf,_feat(c.p),nAll,ph,c.ht,pTier,cTier);
    if(bArch===playerArchName) d=Math.max(0,d-0.5);
    return {p:c.p,d:d};
  }).sort(function(a,b){return a.d-b.d;});

  // Top 6 unique players — max 2 from any single season year to enforce era diversity
  var seenNames={},seenYears={},topComps=[];
  for(var i=0;i<scored.length&&topComps.length<6;i++){
    var nm=scored[i].p.name,yr=scored[i].p.season_year||0;
    if(seenNames[nm]) continue;
    if((seenYears[yr]||0)>=2) continue;
    seenNames[nm]=true; seenYears[yr]=(seenYears[yr]||0)+1; topComps.push(scored[i]);
  }

  function fmt(v){return (v!=null&&v!==''&&!isNaN(v))?Number(v).toFixed(1):'—';}
  function fmtP(v){return (v!=null&&v!==''&&!isNaN(v))?Number(v).toFixed(1)+'%':'—';}
  function compCard(x){
    var q=x.p, simPct=_sim(x.d);
    var seasonBadge='<span class="comp-season">'+(q.season_year-1)+'-'+(''+q.season_year).slice(2)+' · </span>';
    var inner='<div class="comp-top"><div><div class="comp-name">'+q.name+'</div>'+
      '<div class="comp-meta">'+seasonBadge+(q.team||'')+' · '+(q.position||'')+'</div></div>'+
      '<div class="comp-sim" style="color:#5b9d8f;">'+simPct+'%<small>match</small></div></div>'+
      '<div class="comp-stats">'+fmt(q.ppg)+' PPG · '+fmt(q.rpg)+' RPG · '+fmt(q.apg)+' APG · '+fmtP(q.fg_pct)+' FG · '+fmtP(q.tp_pct)+' 3P</div>';
    return '<div class="comp-card">'+inner+'</div>';
  }

  el.innerHTML=
    '<div class="arch-sec-h" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;"><span>Archetype Fit &amp; Comparisons</span>'+_archSeasonSelect()+'</div>'+
    '<div class="arch-note" id="archFitNote" style="margin-top:-4px;margin-bottom:10px;">How closely '+player.name+'&rsquo;s '+fitBasis+' profile matches each '+({G:'guard',W:'wing',B:'big'}[grp])+' archetype — strongest fit highlighted. Compared within '+({G:'guards',W:'wings',B:'bigs'}[grp])+' ('+peerPool.length+' players).</div>'+
    '<div class="radar-wrap" style="margin-bottom:8px;"><canvas id="archRadar" width="440" height="440"></canvas></div>'+
    '<div class="arch-sec-h">Projected Percentile — vs National &amp; Archetype</div>'+
    '<div class="arch-legend"><span><i style="background:var(--accent)"></i>vs All D1</span><span><i style="background:#5b9d8f"></i>vs '+({G:'Guards',W:'Wings',B:'Bigs'}[grp])+'</span></div>'+
    '<div class="arch-chart">'+cols+'</div>'+
    '<div class="arch-sec-h">Most Similar Players</div>'+
    '<div class="comp-grid">'+(topComps.length?topComps.map(compCard).join(''):'<div class="arch-note">No close matches found.</div>')+'</div>'+
    '<div class="arch-note">Similarity blends stats, efficiency, shooting profile, role (minutes), archetype, and build. Comps draw from real played seasons (2011-12 through 2025-26).</div>';
  setTimeout(animateArchFit,40);
  setTimeout(function(){ growBarsIn(document.getElementById('panel-scout')); }, 60);
}

<script>
/* ── Particle system ──────────────────────────────────────── */
(function(){
  const cv=document.getElementById('particleCanvas');
  if(!cv) return;
  const ctx=cv.getContext('2d');
  const N=14,SMIN=5,SMAX=8,RMIN=1.0,RMAX=2.0,OMIN=0.05,OMAX=0.16;
  let W,H,pts=[];
  function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener('resize',rsz,{passive:true});rsz();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function mk(){const a=rnd(0,Math.PI*2),s=rnd(SMIN,SMAX);
    return{x:rnd(0,W),y:rnd(0,H),vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(RMIN,RMAX),op:rnd(OMIN,OMAX),p:rnd(0,Math.PI*2),ps:rnd(.004,.010)};}
  for(let i=0;i<N;i++) pts.push(mk());
  let last=0;
  function frame(ts){
    const dt=Math.min((ts-last)/1000,.05);last=ts;
    ctx.clearRect(0,0,W,H);
    const dk=document.documentElement.getAttribute('data-theme')==='dark';
    pts.forEach(p=>{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;
      if(p.y<-4)p.y=H+4;if(p.y>H+4)p.y=-4;
      p.p+=p.ps;
      const al=p.op*(0.6+0.4*Math.sin(p.p))*(dk?1:.5);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
      g.addColorStop(0,`rgba(177,107,255,${al})`);
      g.addColorStop(.4,`rgba(177,107,255,${al*.5})`);
      g.addColorStop(1,`rgba(177,107,255,0)`);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function(){
  if(window.__tdcAnim) return; window.__tdcAnim=1;
  if(!('IntersectionObserver' in window) ||
     matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        var el=e.target, d=el.__tdcDelay||0;
        if(d) el.style.transitionDelay=d+'ms';
        el.classList.add('tdc-in');
        setTimeout(function(){el.style.transitionDelay='';}, 650+d);
        io.unobserve(el);
      }
    });
  },{threshold:.05, rootMargin:'0px 0px -36px 0px'});
  var batch=0,last=0;
  function tag(el){
    if(!el||el.__tdc||el.nodeType!==1) return;
    var t=el.tagName;
    if(t==='SCRIPT'||t==='STYLE'||t==='LINK'||t==='BR'||t==='HR') return;
    if(el.closest('.tdc-noanim')) return;
    el.__tdc=1;
    var now=performance.now();
    batch = (now-last>140) ? 0 : Math.min(batch+1,6);
    last=now; el.__tdcDelay=batch*45;
    el.classList.add('tdc-reveal'); io.observe(el);
  }
  var DYN='.proj-table tbody tr,.sortable-table tbody tr,.rotation-row,.team-row,.card,.stat-card,.panel,[data-reveal]';
  function scan(root){
    try{
      var wrap=(root&&root.querySelector?root:document)
        .querySelector('.page,main,.container,.content,.layout');
      if(wrap){ for(var i=0;i<wrap.children.length;i++) tag(wrap.children[i]); }
      (root||document).querySelectorAll(DYN).forEach(tag);
    }catch(e){}
  }
  function boot(){
    scan(document);
    try{
      new MutationObserver(function(muts){
        muts.forEach(function(m){
          if(!m.addedNodes) return;
          for(var i=0;i<m.addedNodes.length;i++){
            var n=m.addedNodes[i];
            if(n.nodeType===1){ if(n.matches&&n.matches(DYN)) tag(n); scan(n); }
          }
        });
      }).observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
