  var el=document.getElementById('archetypeContent'); if(!el||!player) return;
  if(_archDone) return; _archDone=true;
  el.innerHTML='<div style="padding:50px;text-align:center;color:var(--text3);">Analyzing archetype & finding comps…</div>';
  // an empty array is truthy, so the old `if(!_allHistory)` cached a failed fetch forever
  if(!_allHistory || !_allHistory.length){
    try{ _allHistory=await _fetchHistoryPool(); }
    catch(e){ _allHistory=null; _archDone=false; }   // don't cache a failed fetch — let comps retry
  }
  if(!_allCurrent){
    try{ _allCurrent=(window.TDCPool?await TDCPool.get():[]).filter(p=>p.ppg!=null); }catch(e){ _allCurrent=[]; }
  }
  if(!window._teamConf){
    try{ var rt=await fetch(SB+'/rest/v1/teams?select=name,conf',{headers:H}); window._teamConf={}; (rt.ok?await rt.json():[]).forEach(function(t){window._teamConf[t.name]=t.conf||'';}); }catch(e){ window._teamConf={}; }
  }
  var grp=_norm3(player.position);
  // Match on the player's PROJECTED line (identical to the radar/Impact basis), not the
  // raw players-table row — otherwise freshmen (ppg=null → 0) comp to other zero-stat
  // players instead of real seasons that resemble their predicted production.
  var pf=_feat(playerProjLine()), ph=_htIn(player.height);

  // projected (2026-27) percentile pool — every player's predicted line, so the
  // archetype ranks predicted production against predicted peers (same basis as Impact)
  if(!_gPctProj){
    var plines=_allCurrent.map(function(q){return projLine(q);}).filter(function(l){return (+l.mpg||0)>=8;});
    _gPctProj={};
    ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs'].forEach(function(k){
      _gPctProj[k]=plines.map(function(l){return +l[k]||0;}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
    });
  }
  // getPctProj is a global (defined near buildArchFit) so the season switcher can reuse it

  // archetype-fit radar — player's real projected 2026-27 line vs projected peers
  var projP=playerProjLine();
  var fit=buildArchFit(projP,grp,getPctProj);
  _archFitAxes=fit.axes; _archFitBest=fit.best;
  _archFitColor=(teamData&&teamData.color)||'#E6D5A8';
  var fitBasis='projected';
  // hero archetype = the radar's strongest fit, so label and chart always agree
  var bestDef=(ARCH_FIT[grp]||ARCH_FIT.W)[fit.best]||{name:'Combo Guard',desc:''};
  var info={name:bestDef.name, desc:bestDef.desc, group:grp};

  // advanced percentile chart: projected national vs projected archetype peers
  var peerPool=_allCurrent.filter(function(q){return q.name&&q.name!=='—'&&(parseFloat(q.mpg)||0)>=10&&_norm3(q.position)===grp;});
  var peerProj=peerPool.map(function(q){return projLine(q);});
  var DEFS=[{l:'PPG',k:'ppg'},{l:'RPG',k:'rpg'},{l:'APG',k:'apg'},{l:'FG%',k:'fg_pct'},{l:'3P%',k:'tp_pct'},{l:'FT%',k:'ft_pct'},{l:'STL',k:'stl'},{l:'BLK',k:'blk'},{l:'TO',k:'tovs',inv:1}];
  var peerCache={};
  var cols=DEFS.map(function(d){
    var nat=getPctProj(projP[d.k],d.k);
    if(d.inv&&nat!=null) nat=100-nat;
    if(!peerCache[d.k]) peerCache[d.k]=peerProj.map(function(l){return +l[d.k]||0;}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
    var pr=pctIn(peerCache[d.k],projP[d.k],d.inv);
    function bar(v,cls){if(v==null)return '';return '<div class="arch-bar '+cls+'" style="height:'+Math.max(v,3)+'%;"><div class="arch-v">'+v+'</div></div>';}
    return '<div class="arch-col"><div class="arch-bars">'+bar(nat,'nat')+bar(pr,'peer')+'</div><div class="arch-lbl">'+d.l+'</div></div>';
  }).join('');

  // Comp pool: real played seasons only (player_history, 2012-2026).
  // Excludes 2026-27 projections from _allCurrent.
  var allPool=[];
  (_allHistory||[]).filter(function(q){return q.name&&q.name!==player.name&&(parseFloat(q.mpg)||0)>=10&&_norm3(q.position)===grp;})
    .forEach(function(q){allPool.push({p:q,isCur:false,ht:_htIn(q.height)});});

  // Normalize z-scores across the pool
  var nAll=_normStats(allPool.map(function(c){return _feat(c.p);}).concat([pf]));

  // Score each candidate — style distance, then reward a same-archetype match strongly
  // and penalize opposite big styles (a stretch/playmaking big shouldn't comp to a
  // rim-running anchor). Player uses the SAME archetypeInfo scheme as candidates so
  // the match actually fires (previously it compared two different naming schemes).
  var playerArchName=archetypeInfo(Object.assign({position:player.position}, projP)).name;
  var _bigOpposite={ 'Stretch Big':'Interior Anchor','Interior Anchor':'Stretch Big',
    'Playmaking Big':'Interior Anchor','Interior Anchor ':'Playmaking Big' };
  var pTier=_confTier(player.team);
  var scored=allPool.map(function(c){
    var bArch=archetypeInfo(c.p).name;
    var cTier=_confTier(c.p.team);
    var d=_dist(pf,_feat(c.p),nAll,ph,c.ht,pTier,cTier);
    if(bArch===playerArchName) d*=0.70;                       // same style → much closer
    else if(_bigOpposite[playerArchName]===bArch) d*=1.25;    // opposite big style → push away
    return {p:c.p,d:d};
  }).sort(function(a,b){return a.d-b.d;});

  // Top 6 unique players — max 2 from any single season year to enforce era diversity
  var seenNames={},seenYears={},topComps=[];
  for(var i=0;i<scored.length&&topComps.length<6;i++){
    var nm=scored[i].p.name,yr=scored[i].p.season_year||0;
    if(seenNames[nm]) continue;
    if((seenYears[yr]||0)>=2) continue;
    seenNames[nm]=true; seenYears[yr]=(seenYears[yr]||0)+1; topComps.push(scored[i]);
  }
  // cache for the Overview "Plays like" box
  try{ window._ovcComps=topComps.map(function(x){return {name:x.p.name, season:x.p.season_year, team:x.p.team, pos:x.p.position, m:_sim(x.d)};}); if(typeof fillOvcComps==='function') fillOvcComps(); }catch(e){}

  function fmt(v){return (v!=null&&v!==''&&!isNaN(v))?Number(v).toFixed(1):'—';}
  function fmtP(v){return (v!=null&&v!==''&&!isNaN(v))?Number(v).toFixed(1)+'%':'—';}
  function compCard(x){
    var q=x.p, simPct=_sim(x.d);
    var seasonBadge='<span class="comp-season">'+(q.season_year-1)+'-'+(''+q.season_year).slice(2)+' · </span>';
    var inner='<div class="comp-top"><div><div class="comp-name">'+q.name+'</div>'+
      '<div class="comp-meta">'+seasonBadge+(q.team||'')+' · '+(q.position||'')+'</div></div>'+
      '<div class="comp-sim" style="color:#5b9d8f;">'+simPct+'%<small>match</small></div></div>'+
      '<div class="comp-stats">'+fmt(q.ppg)+' PPG · '+fmt(q.rpg)+' RPG · '+fmt(q.apg)+' APG · '+fmtP(q.fg_pct)+' FG · '+fmtP(q.tp_pct)+' 3P</div>';
    return '<div class="comp-card">'+inner+'</div>';
  }

  el.innerHTML=
    '<div class="arch-sec-h" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;"><span>Archetype Fit &amp; Comparisons</span>'+_archSeasonSelect()+'</div>'+
    '<div class="arch-note" id="archFitNote" style="margin-top:-4px;margin-bottom:10px;">How closely '+player.name+'&rsquo;s '+fitBasis+' profile matches each '+({G:'guard',W:'wing',B:'big'}[grp])+' archetype — strongest fit highlighted. Compared within '+({G:'guards',W:'wings',B:'bigs'}[grp])+' ('+peerPool.length+' players).</div>'+
    '<div class="radar-wrap" style="margin-bottom:8px;"><canvas id="archRadar" width="440" height="440"></canvas></div>'+
    '<div class="arch-sec-h">Projected Percentile — vs National &amp; Archetype</div>'+
    '<div class="arch-legend"><span><i style="background:var(--accent)"></i>vs All D1</span><span><i style="background:#5b9d8f"></i>vs '+({G:'Guards',W:'Wings',B:'Bigs'}[grp])+'</span></div>'+
    '<div class="arch-chart">'+cols+'</div>'+
    '<div class="arch-sec-h">Most Similar Players</div>'+
    '<div class="comp-grid">'+(topComps.length?topComps.map(compCard).join(''):'<div class="arch-note">No close matches found.</div>')+'</div>'+
    '<div class="arch-note">Similarity blends stats, efficiency, shooting profile, role (minutes), archetype, and build. Comps draw from real played seasons (2011-12 through 2025-26).</div>';
  setTimeout(animateArchFit,40);
  setTimeout(function(){ growBarsIn(document.getElementById('panel-scout')); }, 60);
}

    const uname=p?.username||'User';
    const av=p?.avatar_url?`<img src="${p.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);">`:`<div style="width:32px;height:32px;border-radius:50%;background:var(--bg2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);">${uname[0].toUpperCase()}</div>`;

<script>
/* ── Particle system ──────────────────────────────────────── */
(function(){
  const cv=document.getElementById('particleCanvas');
  if(!cv) return;
  const ctx=cv.getContext('2d');
  const N=14,SMIN=5,SMAX=8,RMIN=1.0,RMAX=2.0,OMIN=0.05,OMAX=0.16;
  let W,H,pts=[];
  function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener('resize',rsz,{passive:true});rsz();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function mk(){const a=rnd(0,Math.PI*2),s=rnd(SMIN,SMAX);
    return{x:rnd(0,W),y:rnd(0,H),vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(RMIN,RMAX),op:rnd(OMIN,OMAX),p:rnd(0,Math.PI*2),ps:rnd(.004,.010)};}
  for(let i=0;i<N;i++) pts.push(mk());
  let last=0;
  function frame(ts){
    const dt=Math.min((ts-last)/1000,.05);last=ts;
    ctx.clearRect(0,0,W,H);
    const dk=document.documentElement.getAttribute('data-theme')==='dark';
    pts.forEach(p=>{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;
      if(p.y<-4)p.y=H+4;if(p.y>H+4)p.y=-4;
      p.p+=p.ps;
      const al=p.op*(0.6+0.4*Math.sin(p.p))*(dk?1:.5);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
      g.addColorStop(0,`rgba(230,213,168,${al})`);
      g.addColorStop(.4,`rgba(230,213,168,${al*.5})`);
      g.addColorStop(1,`rgba(230,213,168,0)`);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function(){
  if(window.__tdcAnim) return; window.__tdcAnim=1;
  if(!('IntersectionObserver' in window) ||
     matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        var el=e.target, d=el.__tdcDelay||0;
        if(d) el.style.transitionDelay=d+'ms';
        el.classList.add('tdc-in');
        setTimeout(function(){el.style.transitionDelay='';}, 650+d);
        io.unobserve(el);
      }
    });
  },{threshold:.05, rootMargin:'0px 0px -36px 0px'});
  var batch=0,last=0;
  function tag(el){
    if(!el||el.__tdc||el.nodeType!==1) return;
    var t=el.tagName;
    if(t==='SCRIPT'||t==='STYLE'||t==='LINK'||t==='BR'||t==='HR') return;
    if(el.closest('.tdc-noanim')) return;
    el.__tdc=1;
    var now=performance.now();
    batch = (now-last>140) ? 0 : Math.min(batch+1,6);
    last=now; el.__tdcDelay=batch*45;
    el.classList.add('tdc-reveal'); io.observe(el);
  }
  var DYN='.proj-table tbody tr,.sortable-table tbody tr,.rotation-row,.team-row,.card,.stat-card,.panel,[data-reveal]';
  function scan(root){
    try{
      var wrap=(root&&root.querySelector?root:document)
        .querySelector('.page,main,.container,.content,.layout');
      if(wrap){ for(var i=0;i<wrap.children.length;i++) tag(wrap.children[i]); }
      (root||document).querySelectorAll(DYN).forEach(tag);
    }catch(e){}
  }
  function boot(){
    scan(document);
    try{
      new MutationObserver(function(muts){
        muts.forEach(function(m){
          if(!m.addedNodes) return;
          for(var i=0;i<m.addedNodes.length;i++){
            var n=m.addedNodes[i];
            if(n.nodeType===1){ if(n.matches&&n.matches(DYN)) tag(n); scan(n); }
          }
        });
      }).observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>

    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('tdc_theme',next);}catch(e){}
    syncBtn(next);
  };
  try{var s=localStorage.getItem('tdc_theme'); if(s) document.documentElement.setAttribute('data-theme',s);}catch(e){}
  function init(){ syncBtn(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'); }

})();
