     matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        var el=e.target, d=el.__tdcDelay||0;
        if(d) el.style.transitionDelay=d+'ms';
        el.classList.add('tdc-in');
        setTimeout(function(){el.style.transitionDelay='';}, 650+d);
        io.unobserve(el);
      }
    });
  },{threshold:.05, rootMargin:'0px 0px -36px 0px'});
  var batch=0,last=0;
  function tag(el){
    if(!el||el.__tdc||el.nodeType!==1) return;
    var t=el.tagName;
    if(t==='SCRIPT'||t==='STYLE'||t==='LINK'||t==='BR'||t==='HR') return;
    if(el.closest('.tdc-noanim')) return;
    el.__tdc=1;
    var now=performance.now();
    batch = (now-last>140) ? 0 : Math.min(batch+1,6);
    last=now; el.__tdcDelay=batch*45;
    el.classList.add('tdc-reveal'); io.observe(el);
  }
  var DYN='.proj-table tbody tr,.sortable-table tbody tr,.rotation-row,.team-row,.card,.stat-card,.panel,[data-reveal]';
  function scan(root){
    try{
      var wrap=(root&&root.querySelector?root:document)
        .querySelector('.page,main,.container,.content,.layout');
      if(wrap){ for(var i=0;i<wrap.children.length;i++) tag(wrap.children[i]); }
      (root||document).querySelectorAll(DYN).forEach(tag);
    }catch(e){}
  }
  function boot(){
    scan(document);
    try{
      new MutationObserver(function(muts){
        muts.forEach(function(m){
          if(!m.addedNodes) return;
          for(var i=0;i<m.addedNodes.length;i++){
            var n=m.addedNodes[i];
            if(n.nodeType===1){ if(n.matches&&n.matches(DYN)) tag(n); scan(n); }
          }
        });
      }).observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();

.tdc-blob.b2{animation:tdcB2 24s linear infinite!important;}
.tdc-blob.b3{animation:tdcB3 21s linear infinite!important;}
@keyframes tdcMesh{0%{transform:translate(0,0) scale(1.05) rotate(0deg);}25%{transform:translate(5%,-4%) scale(1.15) rotate(4deg);}50%{transform:translate(-4%,3%) scale(1.08) rotate(-3deg);}75%{transform:translate(3%,5%) scale(1.12) rotate(3deg);}100%{transform:translate(0,0) scale(1.05) rotate(0deg);}}
@keyframes tdcB1{0%{transform:translate(0,0) scale(1);}25%{transform:translate(240px,120px) scale(1.2);}50%{transform:translate(140px,300px) scale(.85);}75%{transform:translate(-70px,180px) scale(1.12);}100%{transform:translate(0,0) scale(1);}}
@keyframes tdcB2{0%{transform:translate(0,0) scale(1);}25%{transform:translate(-230px,-140px) scale(1.15);}50%{transform:translate(-320px,80px) scale(.9);}75%{transform:translate(-90px,-240px) scale(1.1);}100%{transform:translate(0,0) scale(1);}}
@keyframes tdcB3{0%{transform:translate(0,0) scale(1);}25%{transform:translate(-170px,120px) scale(1.22);}50%{transform:translate(110px,-140px) scale(.85);}75%{transform:translate(190px,100px) scale(1.15);}100%{transform:translate(0,0) scale(1);}}
</style>
<script>
(function(){
  if(window.__tdcTheme) return; window.__tdcTheme=1;
  // session persistence: drop non-persistent logins when the browser is reopened
  try{
    if(localStorage.getItem('tdc_session') && localStorage.getItem('tdc_persist')==='0'){
      if(!sessionStorage.getItem('tdc_alive')){ localStorage.removeItem('tdc_session'); localStorage.removeItem('tdc_persist'); }
      else { sessionStorage.setItem('tdc_alive','1'); }
    }
  }catch(e){}
  function syncBtn(t){var b=document.getElementById('themeBtn'); if(b) b.textContent=(t==='dark'?'☀️':'🌙');}
  window.toggleTheme=function(){
    var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('tdc_theme',next);}catch(e){}
    syncBtn(next);
  };
  try{var s=localStorage.getItem('tdc_theme'); if(s) document.documentElement.setAttribute('data-theme',s);}catch(e){}
  function init(){ syncBtn(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</body>
</html>
