<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;--border:#e0e0e0;--border2:#cccccc;--text:#111111;--text2:#444444;--text3:#888888;--accent:#C8A020;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#070C18;--bg2:#0C1526;--bg3:#14203A;--border:#1A2B44;--border2:#22375A;--text:#E6EAF2;--text2:#9AA4BC;--text3:#4C5C78;--accent:#C8A020;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    /* NAV — frosted glass */
    .nav-wrap{border-bottom:1px solid var(--border);background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);position:sticky;top:0;z-index:200;}
    [data-theme="dark"] .nav-wrap{background:rgba(7,12,24,.84);border-bottom-color:rgba(26,43,68,.9);}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    @keyframes logoReveal{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;letter-spacing:-.01em;white-space:nowrap;animation:logoReveal .55s cubic-bezier(.22,1,.36,1) both;}
    .nav-logo span{color:var(--accent);}
    .nav-actions{display:flex;align-items:center;gap:14px;}
    .nav-actions a{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s;}
    .nav-actions a:hover{color:var(--text);}
    .nav-signin{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--text);padding:6px 16px;text-decoration:none;display:inline-block;transition:opacity .15s;}
    .nav-signin:hover{opacity:.85;}
    .theme-toggle,.theme-btn{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
    .theme-toggle:hover,.theme-btn:hover{border-color:var(--accent);}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;position:relative;white-space:nowrap;flex-shrink:0;transition:color .2s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .22s cubic-bezier(.22,1,.36,1);}
    .nav-sub a:first-child::after{left:0;}
    .nav-sub a:hover{color:var(--text);}
    .nav-sub a:hover::after,.nav-sub a.active::after{transform:scaleX(1);}
    .nav-sub a.active{color:var(--text);}

    /* HERO */
    .player-hero{padding:32px 40px 24px;border-bottom:1px solid var(--border);display:flex;gap:24px;align-items:flex-start;}
    .hero-avatar{width:72px;height:72px;border-radius:50%;background:var(--bg2);border:3px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:26px;color:var(--accent);flex-shrink:0;}
    .hero-info{flex:1;min-width:0;}
    .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .hero-name{font-family:'Playfair Display',serif;font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px;}
    .hero-team{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 5px;border:1px solid var(--border);font-size:12px;font-weight:700;text-decoration:none;color:var(--text);}
    .team-dot{width:9px;height:9px;border-radius:50%;}
    .hero-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
    .hero-meta-item{font-size:12px;color:var(--text3);}
    .hero-meta-item strong{color:var(--text2);}
    .hero-grade{font-family:'Playfair Display',serif;font-weight:800;font-size:48px;line-height:1;flex-shrink:0;}
    .gA{color:#071e5a;}.gB{color:#1040b8;}.gC{color:#4278d4;}.gD{color:#88aadd;}.gF{color:#b8cee8;}

    /* STAT TOGGLE */
    .stat-toggle{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border2);width:fit-content;}
    .stat-toggle-btn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border:none;background:none;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
    .stat-toggle-btn.active{background:var(--text);color:var(--bg);}

    /* TABS — animated */
    .tab-row{display:flex;border-bottom:1px solid var(--border);padding:0 40px;overflow-x:auto;scrollbar-width:none;}
    .tab-row::-webkit-scrollbar{display:none;}
    .tab-btn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Inter',sans-serif;transition:color .2s;white-space:nowrap;position:relative;}
    .tab-btn::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:center;transition:transform .25s cubic-bezier(.22,1,.36,1);}
    .tab-btn.active{color:var(--text);}
    .tab-btn.active::after{transform:scaleX(1);}
    .tab-btn:hover:not(.active){color:var(--text2);}
    .tab-panel{display:none;padding:28px 40px 60px;}
    .tab-panel.active{display:block;}
    @keyframes tabIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes tabOut{from{opacity:1;}to{opacity:0;transform:translateY(-5px);}}
    .tab-panel.entering{animation:tabIn .26s cubic-bezier(.22,1,.36,1) both;}
    .tab-panel.leaving{animation:tabOut .14s ease forwards;pointer-events:none;}

    /* STAT CARDS */
    .stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-bottom:24px;}
    .stat-card{border:1px solid var(--border);padding:12px 10px;text-align:center;position:relative;}
    .stat-card-val{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1;margin-bottom:3px;}
    .stat-card-proj{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px;}
    .stat-card-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .stat-card-diff{font-size:10px;font-weight:700;margin-top:3px;}
    .stat-card-diff.up{color:var(--green);}.stat-card-diff.dn{color:var(--red);}.stat-card-diff.eq{color:var(--text3);}

    /* FULL STAT TABLE */
    .sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .stat-table{width:100%;border-collapse:collapse;min-width:680px;}
    .stat-table th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 8px;border-bottom:2px solid var(--border2);text-align:right;white-space:nowrap;}
    .stat-table th:first-child{text-align:left;}
    .stat-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;text-align:right;white-space:nowrap;}
    .stat-table td:first-child{text-align:left;font-weight:700;}
    .stat-table tr.actual td{color:var(--text2);}
    .stat-table tr.proj td{color:var(--accent);}
    .stat-table tr.proj td:first-child{color:var(--accent);}

    /* PERCENTILE BARS */
    .pct-wrap{margin-bottom:28px;}
    .pct-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .pct-label{font-size:12px;font-weight:600;color:var(--text3);width:52px;flex-shrink:0;text-align:right;}
    .pct-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:visible;position:relative;}
    .pct-fill{height:100%;border-radius:4px;transition:width .5s ease;}
    .pct-val{font-size:12px;font-weight:700;width:38px;text-align:right;flex-shrink:0;}
    .pct-pct{font-size:11px;font-weight:600;color:var(--text3);width:36px;flex-shrink:0;}

    /* RADAR / SPIDER CHART */
    .radar-wrap{display:flex;justify-content:center;margin-bottom:28px;}
    .radar-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px;}
    .radar-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text3);}
    .radar-legend-dot{width:10px;height:10px;border-radius:50%;}

    /* SCOUTING REPORT — enhanced */
    .scout-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;padding:20px;border:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
    .scout-archetype-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .scout-archetype-name{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.1;}
    .scout-archetype-desc{font-size:13px;color:var(--text2);line-height:1.65;max-width:380px;}
    .scout-ratings{display:flex;flex-direction:column;gap:7px;min-width:160px;}
    .scout-rating-row{display:flex;align-items:center;gap:8px;}
    .scout-rating-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);width:52px;flex-shrink:0;text-align:right;}
    .scout-rating-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
    .scout-rating-fill{height:100%;border-radius:3px;background:var(--accent);}
    .scout-rating-val{font-size:12px;font-weight:700;color:var(--text2);width:28px;text-align:right;flex-shrink:0;}
    .scout-fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
    .scout-fc-card{padding:14px;border:1px solid var(--border);background:var(--bg2);}
    .scout-fc-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .scout-fc-val{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;color:var(--text);margin-bottom:3px;}
    .scout-fc-desc{font-size:11px;color:var(--text3);line-height:1.5;}
    .scout-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
    .scout-card{border:1px solid var(--border);padding:16px;transition:border-color .2s;}
    .scout-card:hover{border-color:var(--border2);}
    .scout-card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
    .scout-card-title::after{content:'';flex:1;height:1px;background:rgba(200,160,32,.25);}
    .scout-card-body{font-size:13px;color:var(--text2);line-height:1.7;}
    .scout-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 8px;margin:2px;border-radius:2px;}
    .scout-tag.pos{background:rgba(26,140,58,.1);color:#1a8c3a;border:1px solid rgba(26,140,58,.2);}
    .scout-tag.neg{background:rgba(204,34,0,.08);color:#cc2200;border:1px solid rgba(204,34,0,.18);}
    .scout-tag.neu{background:var(--bg2);color:var(--text3);border:1px solid var(--border);}
    .scout-tag.gold{background:rgba(200,160,32,.1);color:var(--accent);border:1px solid rgba(200,160,32,.25);}
    .archetype-badge{display:none;}
    /* SKILL BREAKDOWN */
    .skill-section-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:8px;display:flex;align-items:center;gap:12px;}
    .skill-section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(200,160,32,.4),transparent);}
    .skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;margin-bottom:28px;}
    .skill-bar-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
    .skill-bar-label{font-size:11px;font-weight:600;color:var(--text3);width:48px;flex-shrink:0;text-align:right;}
    .skill-bar-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
    .skill-bar-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.22,1,.36,1);}
    .skill-bar-val{font-family:'Playfair Display',serif;font-weight:700;font-size:12px;width:34px;text-align:right;flex-shrink:0;}
    .skill-bar-pct{font-size:10px;font-weight:700;color:var(--text3);width:32px;text-align:right;flex-shrink:0;}

    /* PAGE-LOAD ANIMATIONS */
    @keyframes heroSlideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes avatarPop{0%{opacity:0;transform:scale(.6);}70%{transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
    @keyframes gradeStamp{0%{opacity:0;transform:scale(.5) rotate(-4deg);}65%{transform:scale(1.1) rotate(1deg);}100%{opacity:1;transform:scale(1) rotate(0deg);}}
    @keyframes statCardIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

    .player-hero{animation:heroSlideUp .5s .05s cubic-bezier(.22,1,.36,1) both;}
    .hero-avatar{animation:avatarPop .55s .15s cubic-bezier(.34,1.56,.64,1) both!important;}
    .hero-name{animation:heroSlideUp .45s .2s cubic-bezier(.22,1,.36,1) both;}
    .hero-grade{animation:gradeStamp .6s .3s cubic-bezier(.34,1.46,.64,1) both!important;}

    /* Stat cards stagger in when tab is active */
    .stat-card{opacity:0;animation:statCardIn .35s cubic-bezier(.22,1,.36,1) both;}
    .tab-panel.active .stat-card:nth-child(1){animation-delay:.05s;}
    .tab-panel.active .stat-card:nth-child(2){animation-delay:.09s;}
    .tab-panel.active .stat-card:nth-child(3){animation-delay:.13s;}
    .tab-panel.active .stat-card:nth-child(4){animation-delay:.17s;}
    .tab-panel.active .stat-card:nth-child(5){animation-delay:.21s;}
    .tab-panel.active .stat-card:nth-child(6){animation-delay:.25s;}
    .tab-panel.active .stat-card:nth-child(7){animation-delay:.29s;}
    .tab-panel.active .stat-card:nth-child(8){animation-delay:.33s;}
    .tab-panel.active .stat-card:nth-child(9){animation-delay:.37s;}
    .tab-panel.active .stat-card:nth-child(10){animation-delay:.41s;}
    @media(max-width:768px){
      .nav-top,.nav-sub,.player-hero,.tab-panel,.tab-row{padding-left:16px;padding-right:16px;}
      .player-hero{flex-wrap:wrap;}
      .hero-name{font-size:24px;}
      .stat-cards{grid-template-columns:repeat(3,1fr);}
      .scout-grid{grid-template-columns:1fr;}
    }
  
    /* AMBIENT + PARTICLES */
    .ambient-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .ambient-blob{position:absolute;border-radius:50%;will-change:transform;}
    .amb-1{width:800px;height:800px;background:radial-gradient(circle at center,rgba(200,160,32,.04) 0%,transparent 65%);filter:blur(60px);top:-280px;right:-200px;animation:ambA 22s ease-in-out infinite alternate;}
    .amb-2{width:700px;height:700px;background:radial-gradient(circle at center,rgba(20,60,160,.04) 0%,transparent 65%);filter:blur(70px);bottom:-240px;left:-180px;animation:ambB 28s ease-in-out infinite alternate;}
    .amb-3{width:400px;height:400px;background:radial-gradient(circle at center,rgba(200,160,32,.025) 0%,transparent 65%);filter:blur(50px);top:40%;left:35%;animation:ambC 16s ease-in-out infinite alternate;}
    [data-theme="dark"] .amb-1{background:radial-gradient(circle at center,rgba(200,160,32,.09) 0%,transparent 65%);}
    [data-theme="dark"] .amb-2{background:radial-gradient(circle at center,rgba(20,60,200,.12) 0%,transparent 65%);}
    @keyframes ambA{0%{transform:translate(0,0) scale(1);}33%{transform:translate(-45px,30px) scale(1.06);}100%{transform:translate(38px,18px) scale(1.04);}}
    @keyframes ambB{0%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,-30px) scale(1.08);}100%{transform:translate(-32px,16px) scale(1.05);}}
    @keyframes ambC{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-20px,14px) scale(.90);}}
    #particleCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
    .nav-wrap{z-index:200!important;}
    /* fade-up for page header content */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .page-eyebrow{animation:fadeUp .45s .06s cubic-bezier(.22,1,.36,1) both;}
    .page-h1{animation:fadeUp .5s .12s cubic-bezier(.22,1,.36,1) both;}
    .page-sub{animation:fadeUp .5s .18s cubic-bezier(.22,1,.36,1) both;}
    /* tab panel fade */
    .tab-panel.active{animation:panelIn .28s cubic-bezier(.22,1,.36,1) forwards;}
    @keyframes panelIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  </style>
  <script src="tdc-engine.js"></script>
</head>

function getProjSchoolConf(school){
  if(!school) return null;
  const lo=school.toLowerCase().trim();
  if(PROJ_SCHOOL_CONF[lo]) return PROJ_SCHOOL_CONF[lo];
  // Fuzzy match
  for(const k of Object.keys(PROJ_SCHOOL_CONF)){
    if(lo.includes(k)||k.includes(lo)) return PROJ_SCHOOL_CONF[k];
  }
  return null;
}

function getSchoolConfFallback(school){ return getProjSchoolConf(school); }

function getProjTransFactor(originConf, destConf, grade){
  if(!originConf||!destConf||originConf===destConf) return 1.0;
  const ot=PROJ_CONF_TIERS[originConf]||4, dt=PROJ_CONF_TIERS[destConf]||4;
  if(ot===dt) return 1.0;
  // ACC special case going down conferences
  const base=originConf==='ACC'?PROJ_ACC_OUT[dt]||1.0:(PROJ_TRANS_MAT[ot]||{})[dt]||1.0;
  const g=parseFloat(grade)||70;
  // Grade boost: elite players translate better going up in conference
  // Grade penalty: lower-grade players struggle MORE going up
  const boost=g>=90?1.22:g>=85?1.14:g>=80?1.07:g>=75?1.02:g>=70?0.97:g>=65?0.91:0.85;
  return Math.max(0.20,Math.min(1.6,base*boost));
}

// ── POSITION FIT ENGINE ─────────────────────────────────────────────────────
// Determines if a player is deployed at their primary or secondary position.
// If a player has position2 and their primary slot is already occupied by someone
// with a lower depth_order, but the secondary slot is open → deployed at secondary.
function getDeployedPos(p, roster) {
  const pos1 = (p.position  || 'G').replace(/\d/g,'').trim();
  const pos2 = (p.position2 || '').replace(/\d/g,'').trim();
  if (!pos2 || !['PG','SG','SF','PF','C'].includes(pos2)) return pos1;

  const dOrder = p.depth_order || 99;

  // How many players share pos1 AND rank higher in depth order?
  const pos1Ahead = roster.filter(r =>
    r.name && r.name !== '—' && r.name !== p.name &&
    (r.position||'G').replace(/\d/g,'').trim() === pos1 &&
    (r.depth_order||99) < dOrder
  ).length;

  // How many players have pos2 as their PRIMARY and rank higher?
  const pos2Ahead = roster.filter(r =>
    r.name && r.name !== '—' && r.name !== p.name &&
    (r.position||'G').replace(/\d/g,'').trim() === pos2 &&
    (r.depth_order||99) < dOrder
  ).length;

  // Deployed at secondary if primary slot is occupied AND secondary is open ahead of them
  return (pos1Ahead >= 1 && pos2Ahead === 0) ? pos2 : pos1;
}

    .filter(p => p.is_injured)
    .map(p => ({...p, ppg:0, rpg:0, apg:0, mpg:0, fgm:0, fga:0, tpm:0, tpa:0,
      ftm:0, fta:0, oreb:0, dreb:0, stl:0, blk:0, tovs:0, _dnp:true, _injured:true}));

  if(!roster.length) return [];

  const r1 = v => v!=null ? Math.round((v+Number.EPSILON)*10)/10 : null;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

  const projected = roster.map(p => {
    const yr     = (p.yr||p.class_year||'').toLowerCase();
    const isFr   = yr.includes('fr.')||yr.includes('r-fr');
    const isSo   = yr.includes('so.')||yr.includes('r-so.');
    const isJr   = yr.includes('jr.')||yr.includes('r-jr.');
    const isSr   = yr.includes('sr.')||yr.includes('r-sr')||yr.includes('gr.');
    const grade  = parseFloat(p.tdc_grade)||70;
    const pos    = (p.position||'G').replace(/\d/g,'').trim();
    const posNorm= ['PG','SG','SF','PF','C'].includes(pos)?pos:pos==='CG'?'SG':'G';
    const isBig  = pos==='C'||pos==='PF';
    const isGuard= pos==='PG'||pos==='SG'||pos==='CG';

    const deployedPos = getDeployedPos(p, roster);
    const isOutOfPos  = !!(p.position2 && deployedPos !== pos);
    const posFitMult  = p.position2 ? (isOutOfPos ? 0.97 : 1.02) : 1.0;

    const key    = (p.name||'').toLowerCase().trim();
    const history= (window._careerHistoryMap&&window._careerHistoryMap[key])||[];

    const played = history
      .filter(h => !h.sat_out && parseFloat(h.ppg||0)>0 && parseFloat(h.mpg||0)>=6)
      .sort((a,b) => b.season_year - a.season_year);

    const meaningful = played.filter(h => parseFloat(h.mpg||0)>=12);
    const latestH    = played[0]||null;

    const newMpg = computePlayerMpg(p, roster);

    const hasCareerStats  = latestH && parseFloat(latestH.ppg||0)>0;
    const hasCurrentStats = parseFloat(p.ppg||0)>0;

    if(!hasCareerStats && !hasCurrentStats){
      const fb   = getFrBase(grade, posNorm);
      const effMpg = newMpg < 12 ? Math.min(13, newMpg*1.35) : newMpg;
      const scale  = effMpg/FR_BASE_MPG;
      const fga    = r1(newMpg*0.28);
      return {...p,
        ppg: r1(fb.ppg*scale), rpg: r1((fb.oreb+fb.dreb)*scale), apg: r1(fb.apg*scale),
        mpg: r1(newMpg),
        fgm: r1(fga*(fb.fg_pct/100)), fga, fg_pct: fb.fg_pct,
        tpm: r1(fga*0.42*(fb.tp_pct/100)), tpa: r1(fga*0.42), tp_pct: fb.tp_pct,
        fta: r1(newMpg*0.09), ftm: r1(newMpg*0.09*(fb.ft_pct/100)), ft_pct: fb.ft_pct,
        oreb: r1(fb.oreb*scale), dreb: r1(fb.dreb*scale),
        stl: r1(fb.stl*scale), blk: r1(fb.blk*scale), tovs: r1(fb.tovs*scale),
        _frosh:true, _noStatEst:true, _deployedPos:deployedPos, _posFit:posFitMult,
      };
    }

    const base    = hasCareerStats ? latestH : p;
    const baseMpg = Math.max(1, parseFloat(base.mpg||0)||1);
    const g = k => parseFloat(base[k]||0)||0;

    const orebBase = g('oreb');
    const drebBase = g('dreb');
    const rpgBase  = (orebBase+drebBase) > 0 ? orebBase+drebBase : g('rpg');

    const pm = {
      ppg:  g('ppg')/baseMpg,  rpg:  rpgBase/baseMpg,   apg:  g('apg')/baseMpg,
      fgm:  g('fgm')/baseMpg,  fga:  g('fga')/baseMpg,
      tpm:  g('tpm')/baseMpg,  tpa:  g('tpa')/baseMpg,
      ftm:  g('ftm')/baseMpg,  fta:  g('fta')/baseMpg,
      oreb: orebBase/baseMpg,  dreb: drebBase/baseMpg,
      stl:  g('stl')/baseMpg,  blk:  g('blk')/baseMpg,  tovs: g('tovs')/baseMpg,
    };

    let trendMult = 1.0;
    if(meaningful.length >= 2){
      const n=meaningful[0], p2=meaningful[1];
      const nPm=parseFloat(n.ppg||0)/Math.max(1,parseFloat(n.mpg||1));
      const pPm=parseFloat(p2.ppg||0)/Math.max(1,parseFloat(p2.mpg||1));
      if(pPm>0){
        const rt=nPm/pPm;
        const mpgGrowth=parseFloat(n.mpg||0)/Math.max(1,parseFloat(p2.mpg||0));
        const isBreakout=rt>=1.40&&mpgGrowth>=1.20;
        const cap=isBreakout?0.15:0.10;
        trendMult=1.0+Math.max(-cap,Math.min(cap,(rt-1)*0.35));
      }
    } else if(meaningful.length===1&&played.length>=2){
      const n=meaningful[0],p2=played.find(h=>h!==n);
      if(p2){
        const nPm=parseFloat(n.ppg||0)/Math.max(1,parseFloat(n.mpg||1));
        const pPm=parseFloat(p2.ppg||0)/Math.max(1,parseFloat(p2.mpg||1));
        if(pPm>0&&nPm/pPm>=1.5) trendMult=1.06;
      }
    }
    // Cap trend for upperclassmen — seniors don't suddenly spike, jrs get moderate ceiling
    if(isSr) trendMult = Math.min(1.05, trendMult);
    else if(isJr) trendMult = Math.min(1.08, trendMult);

    const isTransferIn = !!(p.hometown && p.hometown.trim());
    const isReturnee   = !isTransferIn;
    // Year progression is grade-sensitive for seniors:
    // Elite Sr (87+): still developing ceiling, e.g. projected NBA picks → modest bump
    // Good Sr (80-86): minimal progression — mostly established
    // Role Sr (<80): plateaued — project at per-minute rate only
    const srYr       = grade>=87 ? 1.02 : grade>=80 ? 1.01 : 1.0;
    const srReturn   = isReturnee ? (grade>=85 ? 1.01 : 1.0) : 1.0;
    const returnBoost  = isReturnee ? (isSr ? srReturn : isJr?1.02 : isSo?1.04 : 1.02) : 1.0;
    const transferTrim = isTransferIn ? 0.96 : 1.0;
    const yrMult = (isSo?1.06 : isJr?1.03 : isSr?srYr : 1.04) * returnBoost * transferTrim;

    const gradeExpPpg = grade>=90?19:grade>=85?16:grade>=80?13:grade>=75?10:grade>=70?8:6;
    const statsPer32  = pm.ppg*32;
    const gapRatio    = gradeExpPpg>0 ? statsPer32/gradeExpPpg : 1;
    // Raw gap: how far player is from their grade expectation
    const gapMultRaw  = gapRatio<0.50?1.14:gapRatio<0.65?1.09:gapRatio<0.80?1.05
                      : gapRatio<0.95?1.02:gapRatio>1.40?0.96:gapRatio>1.20?0.98:1.0;
    // Upperclassmen have found their level — don't push them toward a grade ceiling they may never hit
    // Fr/So: full gap adjustment (still developing)
    // Jr: 40% of adjustment (mostly established)
    // Sr/Gr: 15% of adjustment (this IS their level)
    const gapMult = isSr ? 1.0+(gapMultRaw-1)*0.15
                  : isJr ? 1.0+(gapMultRaw-1)*0.40
                  : gapMultRaw;

    const rateGrowth = yrMult * gapMult * trendMult;

    let transferFactor = 1.0;
    if(p.hometown && p.hometown.trim()){
      const originConf = getProjSchoolConf(p.hometown)||getSchoolConfFallback(p.hometown);
      if(originConf && conf) transferFactor = getProjTransFactor(originConf, conf, grade);
    }

    // Percentage adjustment from conference difficulty
    const transPctAdj = transferFactor<0.75?-3.5:transferFactor<0.85?-2.5
                      : transferFactor<0.92?-1.5:transferFactor<0.97?-0.8
                      : transferFactor>1.20?+1.2:transferFactor>1.10?+0.8
                      : transferFactor>1.04?+0.4:0;

    // RPG conference adjustment: stronger competition = fewer easy boards
    const rpgConfAdj = isTransferIn ? (
      isBig  ? (transferFactor<0.80?-1.2:transferFactor<0.90?-0.7:transferFactor<0.96?-0.3:transferFactor>1.15?+0.6:0)
             : (transferFactor<0.80?-0.5:transferFactor<0.90?-0.2:transferFactor>1.15?+0.3:0)
    ) : 0;

    // APG conference adjustment: tighter defense = fewer assist opportunities
    const apgConfAdj = isTransferIn ? (
      isGuard ? (transferFactor<0.80?-1.0:transferFactor<0.90?-0.5:transferFactor<0.96?-0.2:transferFactor>1.15?+0.5:0)
              : (transferFactor<0.80?-0.4:transferFactor<0.90?-0.2:transferFactor>1.15?+0.2:0)
    ) : 0;

    // FG%: career-smoothed (55% last season, 45% career avg) then conference-adjusted
    const fgBase      = parseFloat(base.fg_pct||0)||44;
    const careerFgPct = meaningful.length>=2
      ? meaningful.reduce((s,h)=>s+parseFloat(h.fg_pct||0),0)/meaningful.length : fgBase;
    const fgSmoothed  = fgBase*0.55 + careerFgPct*0.45;

    const tpBase = meaningful.length
      ? meaningful.reduce((s,h)=>s+parseFloat(h.tp_pct||0),0)/meaningful.length
      : (parseFloat(base.tp_pct||0)||parseFloat(p.tp_pct||0)||33);

    const ftBase      = parseFloat(base.ft_pct||0)||70;
    const careerFtPct = meaningful.length>=2
      ? meaningful.reduce((s,h)=>s+parseFloat(h.ft_pct||0),0)/meaningful.length : ftBase;
    const ftSmoothed  = ftBase*0.65 + careerFtPct*0.35;

    const oldFga     = parseFloat(base.fga||0)||1;
    const newFgaE    = oldFga*(newMpg/baseMpg);
    const volChange  = (baseMpg>=12) ? (newFgaE/oldFga-1) : 0;
    const volPenalty = volChange*3.5;
    const yearEff    = isSo?1.2:isJr?0.6:isSr?0.0:1.8;

    // Role-reduction efficiency boost: returning players in reduced shot volume
    // take only their best shots → FG% rises. High-assist PGs also benefit
    // from playing within a system (they create easier looks for themselves too).
    // Not for transfers stepping up — they're still adjusting.
    const roleVolDrop = (isReturnee && baseMpg >= 15 && volChange < -0.12);
    const roleEffBoost = roleVolDrop ? Math.min(2.5, Math.abs(volChange) * 12) : 0;
    const pgSystemBoost = (pos==='PG' && parseFloat(p.apg||0)>=4 && isReturnee && !isTransferIn && !isFr)
      ? 1.0 : 0;

    const fgProj = r1(clamp(fgSmoothed + yearEff - volPenalty + transPctAdj + roleEffBoost + pgSystemBoost, 30, 65));

    const careerTpa  = meaningful.length
      ? meaningful.reduce((s,h)=>s+parseFloat(h.tpa||0),0)/meaningful.length
      : parseFloat(base.tpa||0);
    const is3Shooter = careerTpa >= 0.5;
    const tpProj = is3Shooter
      ? r1(clamp(tpBase+(isSo?0.8:isJr?0.4:isSr?0:1.5)-(volChange*2)+transPctAdj*0.6, 20, 50))
      : tpBase;
    const ftProj = r1(clamp(ftSmoothed+(isSo?1.0:isJr?0.5:isSr?0:1.5), 45, 97));

    // Shot volume scales with minutes only — rateGrowth should not inflate attempts/min.
    // Year progression means better efficiency on the same shots, not more shots per minute.
    const newFga = r1(pm.fga*newMpg);
    const newTpa = r1(pm.tpa*newMpg);

    const pf     = posFitMult;
    // Derive all stats from components so PPG is always consistent with FGA.
    // Year progression shows through efficiency (fgProj) not shot-volume inflation.
    const fgm_v  = r1(newFga*(fgProj/100)*pf);
    const tpm_v  = r1(newTpa*(tpProj/100)*pf);
    const fta_v  = r1(pm.fta*newMpg*pf);
    const ftm_v  = r1(fta_v*(ftProj/100));
    // PPG from components: 2×FGM + bonus point per 3PM + FTM
    const ppg_comp = fgm_v*2 + tpm_v + ftm_v;
    // PPG floor: per-minute scoring rate × new minutes × rateGrowth.
    // Catches cases where player_history FTA is incomplete (under-projects free throws).
    // Stars who get to the line heavily (e.g. Haugh) stay accurate.
    const ppg_floor = pm.ppg * rateGrowth * newMpg * pf * 0.88;
    const ppg_v  = r1(Math.max(ppg_comp, ppg_floor));

    const rawRpg = r1(pm.rpg*rateGrowth*newMpg*pf);
    const rawApg = r1(pm.apg*rateGrowth*newMpg*pf);

    return {...p,
      ppg:  ppg_v,
      rpg:  r1(Math.max(0, rawRpg + rpgConfAdj)),
      apg:  r1(Math.max(0, rawApg + apgConfAdj)),
      mpg:  r1(newMpg),
      fgm:  fgm_v, fga: r1(newFga*pf), fg_pct:fgProj,
      tpm:  tpm_v,  tpa: r1(newTpa*pf), tp_pct:tpProj,
      ftm:  ftm_v,  fta: fta_v,         ft_pct:ftProj,
      oreb: r1(pm.oreb*rateGrowth*newMpg*pf),
      dreb: r1(pm.dreb*rateGrowth*newMpg*pf),
      stl:  r1(pm.stl *rateGrowth*newMpg*pf),
      blk:  r1(pm.blk *rateGrowth*newMpg*pf),
      tovs: r1(pm.tovs*rateGrowth*newMpg*pf),
      _frosh:false, _factor:transferFactor, _trend:trendMult, _seasons:played.length,
      _deployedPos:deployedPos, _posFit:posFitMult,
    };
  }).filter(Boolean);

  // ── SHOT VOLUME CAP (bench-first) ────────────────────────
  // Teams take ~62-76 FGA per game. When over, bench players absorb
  // the cut first — starters keep their projections. Only if starters
  // alone exceed the cap do they get a light proportional trim.
  // FG%/3P%/FT% never touched — only shot volume scales.
  const fgaCap  = 76;
  const bySlt   = [...projected].sort((a,b)=>(a.depth_order||99)-(b.depth_order||99));
  const totalFga= bySlt.reduce((s,p)=>s+(parseFloat(p.fga)||0),0);

  if(totalFga > fgaCap){
    const scale = (p, vol) => {
      p.fgm = r1(p.fgm*vol); p.fga = r1(p.fga*vol);
      p.tpm = r1(p.tpm*vol); p.tpa = r1(p.tpa*vol);
      p.ftm = r1(p.ftm*vol); p.fta = r1(p.fta*vol);
      p.ppg = r1(p.fgm*2 + p.tpm + p.ftm);
    };

    const starters   = bySlt.slice(0,5);
    const bench      = bySlt.slice(5);
    const starterFga = starters.reduce((s,p)=>s+(parseFloat(p.fga)||0),0);
    const benchFga   = bench.reduce((s,p)=>s+(parseFloat(p.fga)||0),0);

    if(starterFga >= fgaCap){
      // Loaded starting 5 alone fills the cap — trim everything proportionally
      const vol = fgaCap/totalFga;
      bySlt.forEach(p => scale(p, vol));
    } else {
      // Bench takes the full cut — starters untouched
      const benchBudget = Math.max(6, fgaCap - starterFga);
      if(benchFga > benchBudget){
        const vol = benchBudget/benchFga;
        bench.forEach(p => scale(p, vol));
      }
    }
  }

  return [...projected, ...injuredDnp];
}



function buildScoutingReport(p, proj, globalPct){
  var ppg=parseFloat(p.ppg)||0,rpg=parseFloat(p.rpg)||0,apg=parseFloat(p.apg)||0;
  var fg=parseFloat(p.fg_pct)||0,tp=parseFloat(p.tp_pct)||0,ft=parseFloat(p.ft_pct)||0;
  var stl=parseFloat(p.stl)||0,blk=parseFloat(p.blk)||0;
  var oreb=parseFloat(p.oreb)||0,dreb=parseFloat(p.dreb)||0;
  var tovs=parseFloat(p.tovs)||0,mpg=parseFloat(p.mpg)||0;
  var pos=p.position||'G', grade=parseFloat(p.tdc_grade)||70;
  var yr=(p.yr||p.class_year||'').toLowerCase();

  var isSo=yr.includes('so.')||yr.includes('r-so');
  var isJr=yr.includes('jr.')||yr.includes('r-jr');
  var isSr=yr.includes('sr.')||yr.includes('r-sr')||yr.includes('gr.');
  var isGuard=pos==='PG'||pos==='SG'||pos==='CG'||pos==='G';
  var isBig=pos==='C'||pos==='PF';

  var isPg = pos==='PG';
  var isSg = pos==='SG'||pos==='CG';
  var archetype='', archetypeDesc='';
  if(isGuard){
    if(ppg>=16&&apg>=4){
      archetype='Primary Playmaker';
      archetypeDesc=isPg
        ?'A ball-dominant PG who scores at volume while running the offense. Attacks closeouts, creates off the dribble, and can find teammates when defenses collapse on him.'
        :'A high-usage guard who initiates the offense and scores at volume. Dangerous both as a finisher and distributor, creating for teammates while maintaining his own scoring threat.';
    }
    else if(ppg>=16&&apg<3){
      if(isPg){
        archetype='Scoring Point Guard';
        archetypeDesc='A ball-dominant PG who prioritizes his own offense over distribution. Gets his own shot off the dribble and thrives as a primary option, but looks to score first and facilitate second.';
      } else {
        archetype='Scoring Guard';
        archetypeDesc='An off-ball guard built around scoring. Creates his own shot through screens and isolation. A bucket-getter first, with limited but functional playmaking.';
      }
    }
    else if(isPg&&apg>=3&&ppg>=10){archetype='Floor General';archetypeDesc='A true point guard who controls the game through pace and decision-making. Keeps the offense organized, creates shots for teammates, and limits mistakes under pressure.';}
    else if(apg>=5&&ppg<12){archetype='Pass-First Guard';archetypeDesc='A true facilitator who makes the offense run. Prioritizes finding shooters and creating easy looks. His value shows up most in others stats.';}
    else if(tp>=38&&ppg>=10){archetype='Perimeter Shooter';archetypeDesc='A floor-spacer whose shooting gravity opens drives for teammates. Most dangerous off the catch, with reliable mechanics and consistent release point.';}
    else if(stl>=1.5){archetype='Disruptive Defender';archetypeDesc='A defensive specialist whose anticipation and activity make him a nightmare for ball-handlers. Can change a game without scoring a point.';}
    else if(mpg>=28&&ppg<10){archetype='Glue Guy';archetypeDesc='A veteran presence who wins with effort and execution. Does the dirty work — screens, defense, communication — that winning teams need.';}
    else{archetype='Two-Way Guard';archetypeDesc='A balanced guard who contributes on both ends without a single dominant skill. His floor is consistent; ceiling depends on which skill develops further.';}
  } else if(isBig){
    if(blk>=1.5&&oreb>=2){archetype='Interior Anchor';archetypeDesc='A presence-player whose shot-blocking and rebounding change the defensive geometry. Opponents think twice near the rim, creating space for teammates.';}
    else if(ppg>=14&&rpg>=7){archetype='Dominant Big';archetypeDesc='A complete interior force — scores on the block, controls the glass, and protects the rim. Among the most impactful players at his position.';}
    else if(tp>=1.5&&fg>=45){archetype='Stretch Big';archetypeDesc='A modern big who combines interior size with perimeter shooting. His range pulls defenders away from the paint, creating driving lanes for guards.';}
    else if(dreb>=5&&oreb>=2){archetype='Rebounding Specialist';archetypeDesc='A relentless worker on the boards with exceptional positioning and motor. Gives his team extra possessions every night.';}
    else if(ppg>=12){archetype='Scoring Big';archetypeDesc='A reliable interior scorer who can punish smaller lineups. Effective in post-ups, pick-and-rolls, and in transition.';}
    else{archetype='Developmental Big';archetypeDesc='A project with physical tools that have not fully translated to production yet. The upside is real; consistency and polish are works in progress.';}
  } else {
    if(ppg>=14&&rpg>=5&&apg>=2){archetype='Versatile Wing';archetypeDesc='The most coveted modern archetype — a wing who can guard multiple positions, initiate the offense, and create his own shot. A genuine multi-level threat.';}
    else if(tp>=1.5&&ppg>=10){archetype='3-and-D Wing';archetypeDesc='A specialist built for the modern game. Hits open threes and holds his own defensively, playing a defined but highly valuable role on winning teams.';}
    else if(ppg>=16){archetype='Wing Scorer';archetypeDesc='An offensive engine from the wing who can create in isolation and off movement. A top scoring option who needs the right supporting cast to thrive.';}
    else{archetype='Role Wing';archetypeDesc='A contributor whose value is situational. Offers specific skills but lacks the all-around impact to be a rotation anchor without ideal lineup fits.';}
  }

  var strengths=[];
  if(ppg>=18)strengths.push('Elite scorer');else if(ppg>=14)strengths.push('Consistent scorer');else if(ppg>=10)strengths.push('Reliable contributor');

  if(tp>=40)strengths.push('Elite 3-point shooting');else if(tp>=36)strengths.push('Consistent from deep');
  if(ft>=85)strengths.push('Free throw specialist');else if(ft>=78)strengths.push('Reliable at the line');
  if(apg>=6)strengths.push('Elite playmaker');else if(apg>=4)strengths.push('Strong playmaker');
  if(rpg>=9)strengths.push('Elite rebounder');else if(rpg>=6)strengths.push('Strong rebounder');
  if(stl>=2)strengths.push('Elite perimeter disruptor');else if(stl>=1.3)strengths.push('Active ball thief');
  if(blk>=2)strengths.push('Elite shot blocker');else if(blk>=1.2)strengths.push('Rim protector');
  if(oreb>=2.5)strengths.push('Exceptional offensive glass');
  if(tovs>0&&(ppg+apg)/Math.max(1,tovs)>5)strengths.push('Excellent ball security');

  var weaknesses=[];
  if(fg<40&&(parseFloat(p.fga)||0)>4)weaknesses.push('Field goal efficiency concerns');
  if(tp<31&&(parseFloat(p.tpa)||0)>3)weaknesses.push('Below-average from three');
  if(ft<62)weaknesses.push('Significant foul line liability');else if(ft<70)weaknesses.push('Inconsistent at free throws');
  if(tovs>3.2)weaknesses.push('Ball security issues');else if(tovs>2.5)weaknesses.push('Turnover-prone');
  if(apg<1.5&&isGuard&&ppg>8)weaknesses.push('Limited playmaking');
  if(rpg<3.5&&isBig)weaknesses.push('Below-average rebounding for position');
  if(blk<0.4&&isBig)weaknesses.push('Limited shot-blocking');
  if(mpg<16&&ppg>0)weaknesses.push('Limited role');

  var tags=[];
  if((parseFloat(p.tpa)||0)/Math.max(1,parseFloat(p.fga)||1)>0.38)tags.push({t:'Three-Point Heavy',c:'neu'});
  if(fg>=50)tags.push({t:'Efficient',c:'pos'});
  if((parseFloat(p.fta)||0)/Math.max(1,parseFloat(p.fga)||1)>0.42)tags.push({t:'Draws Fouls',c:'pos'});
  if(tovs>3.2)tags.push({t:'Ball Security Risk',c:'neg'});else if(tovs<1.5&&ppg>8)tags.push({t:'Low-Turnover',c:'pos'});
  if(stl+blk>2.8)tags.push({t:'Defensive Disruptor',c:'pos'});
  if(oreb>2.2)tags.push({t:'Offensive Glass',c:'pos'});
  if(tp>=38)tags.push({t:'Shooting Threat',c:'pos'});
  if(apg>4.5)tags.push({t:'Shot Creator',c:'pos'});
  if(grade>=90)tags.push({t:'Top-100 Grade',c:'gold'});
  if(p.starter)tags.push({t:'Returning Starter',c:'neu'});
  if(p.hometown)tags.push({t:'Transfer',c:'neu'});

  var floor='', ceiling='', floorDesc='', ceilingDesc='';
  if(grade>=92){
    ceiling='All-Conference'; ceilingDesc='Has the tools to be a first-team all-conference performer and a legitimate NBA prospect.';
    floor=isFr||isSo?'Solid Starter':'Dependable Starter'; floorDesc='Even in a down year, should contribute 25+ MPG and provide positive impact.';
  } else if(grade>=85){
    ceiling='All-Conference Fringe'; ceilingDesc='Could earn conference recognition with continued development.';
    floor='Rotation Player'; floorDesc='Reliable contributor in the 18-25 MPG range who fills a defined role.';
  } else if(grade>=75){
    ceiling='Starter'; ceilingDesc='Has the ability to crack a starting lineup on the right team.';
    floor='Deep Rotation'; floorDesc='Will see time off the bench and contribute in specific situations.';
  } else {
    ceiling='Rotation Piece'; ceilingDesc='Can carve a niche role in the right system with continued improvement.';
    floor='Development Player'; floorDesc='Currently a project; needs time and reps to develop college-level impact.';
  }

  var roleFit = grade>=88?'Starter / Star':grade>=80?'Starting Caliber':grade>=72?'Rotation Player':'Bench Contributor';

  var draftOutlook='', draftNote='';
  if(grade>=94&&(isFr||isSo)){draftOutlook='Lottery Prospect';draftNote='Elite profile suggests top-30 NBA draft consideration if production matches grade.';}
  else if(grade>=90&&(isFr||isSo||isJr)){draftOutlook='Draft Prospect';draftNote='High-end grade and age suggest pro-level athleticism. A strong season could earn draft board attention.';}
  else if(grade>=85&&(isFr||isSo)){draftOutlook='One to Watch';draftNote='Physical tools are there. Development arc will determine professional viability.';}

  var comparable='';
  if(archetype==='Primary Playmaker')comparable='High-usage PG prototype';
  else if(archetype==='Scoring Guard')comparable='Off-guard scoring specialist';
  else if(archetype==='Scoring Point Guard')comparable='Ball-dominant scoring PG';
  else if(archetype==='Floor General')comparable='Pass-first PG prototype';
  else if(archetype==='3-and-D Wing')comparable='Modern role-player archetype';
  else if(archetype==='Stretch Big')comparable='Modern 4/5 hybrid prototype';
  else comparable=archetype;

  var projNote='';
  if(proj){
    if(proj._frosh){projNote='Freshman projection based on '+pos+' baseline and TDC grade '+grade+'. High variance expected.';}
    else if(proj._origin){
      var dc=(typeof teamData!=='undefined'&&teamData&&(teamData.conf||teamData.conference))||'this conference';
      projNote='Transfer from '+proj._origin+'. Conference translation applied ('+dc+', factor '+(proj._factor||1).toFixed(2)+').';
    } else {
      if(yr.includes('fr.')||yr.includes('so.'))projNote='Sophomore/Junior leap projected — typically the largest year-over-year improvement window.';
      else if(yr.includes('jr.'))projNote='Junior-to-senior projection — peak years, modest improvement expected.';
      else projNote='Returning veteran — projection based on role continuity and career trend.';
    }
  }

  var scoutScore = Math.round(Math.min(100, Math.max(0,
    (grade-60)/37*60 + ppg/22*15 + (fg-38)/20*10 + (stl+blk)/3*8 + apg/8*7
  )));

  return {
    archetype:archetype, archetypeDesc:archetypeDesc,
    strengths:strengths, weaknesses:weaknesses, tags:tags, projNote:projNote,
    floor:floor, ceiling:ceiling, floorDesc:floorDesc, ceilingDesc:ceilingDesc,
    roleFit:roleFit, draftOutlook:draftOutlook, draftNote:draftNote,
    comparable:comparable, scoutScore:scoutScore
  };
}




// ── SKILL BREAKDOWN ─────────────────────────────────────
function buildSkillBreakdown(p){
  function barColor(pct){
    if(pct>=80)return '#1a8c3a';
    if(pct>=60)return '#1a5fbf';
    if(pct>=40)return 'var(--accent)';
    if(pct>=20)return '#b07000';
    return '#cc2200';
  }
  var metrics=[
    {l:'PPG',k:'ppg',   v:p.ppg,   f:fmt},
    {l:'RPG',k:'rpg',   v:p.rpg,   f:fmt},
    {l:'APG',k:'apg',   v:p.apg,   f:fmt},
    {l:'MPG',k:'mpg',   v:p.mpg,   f:fmt},
    {l:'FG%',k:'fg_pct',v:p.fg_pct,f:fmtP},
    {l:'3P%',k:'tp_pct',v:p.tp_pct,f:fmtP},
    {l:'FT%',k:'ft_pct',v:p.ft_pct,f:fmtP},
    {l:'STL',k:'stl',   v:p.stl,   f:fmt},
    {l:'BLK',k:'blk',   v:p.blk,   f:fmt},
    {l:'OREB',k:'rpg',  v:p.oreb,  f:fmt},
    {l:'DREB',k:'rpg',  v:p.dreb,  f:fmt},
    {l:'TO',  k:'tovs', v:p.tovs,  f:fmt},
  ];
  var rows=metrics.map(function(m){
    var display=m.f(m.v);
    if(display==='--'||display==='—')return '';
    var pct=getPct(m.v,m.k);
    var col=barColor(pct);
    return '<div class="skill-bar-row">'
      +'<div class="skill-bar-label">'+m.l+'</div>'
      +'<div class="skill-bar-track"><div class="skill-bar-fill" style="width:'+pct+'%;background:'+col+';"></div></div>'
      +'<div class="skill-bar-val" style="color:'+col+';">'+display+'</div>'
      +'<div class="skill-bar-pct">'+pct+'th</div>'
      +'</div>';
  }).filter(Boolean);
  var half=Math.ceil(rows.length/2);
  return '<div class="skill-section-title">Skill Breakdown \u2014 National Percentiles</div>'
    +'<div class="skill-grid"><div>'+rows.slice(0,half).join('')+'</div>'
    +'<div>'+rows.slice(half).join('')+'</div></div>';
}


// ── PERCENTILE HELPERS ──────────────────────────────────
function r1(v){return v!=null?Math.round(v*10)/10:null;}
function fmt(v){return v!=null&&v!==''?Number(v).toFixed(1):'—';}
function fmtP(v){return v!=null&&v!==''?Number(v).toFixed(1)+'%':'—';}
function pctCol(p){return p>=80?'rgb(18,60,185)':p>=60?'rgb(30,82,200)':p>=40?'rgb(45,100,210)':p>=20?'rgb(60,120,220)':'var(--text3)';}
function gradeClass(g){const n=parseFloat(g);if(!isNaN(n)){if(n>=90)return 'gA';if(n>=80)return 'gB';if(n>=70)return 'gC';if(n>=60)return 'gD';return 'gF';}if(!g)return '';if(g[0]==='A')return 'gA';if(g[0]==='B')return 'gB';if(g[0]==='C')return 'gC';if(g[0]==='D')return 'gD';return 'gF';}

let player=null, teamData=null, allPlayers=[], gPct={}, proj=null, teamPlayers=[], careerHistory=[];

async function init(){
  const s=JSON.parse(localStorage.getItem('tdc_session')||'null');
  const params=new URLSearchParams(location.search);
  const pid=params.get('id'), pname=params.get('name'), pteam=params.get('team');
  if(!pid&&!pname){document.getElementById('heroSection').innerHTML='<div style="padding:80px;text-align:center;color:var(--text3);">No player specified. <a href="roster.html" style="color:var(--accent);">Browse players →</a></div>';return;}
  try{
    if(s?.access_token) updateNav(s);
    // PostgREST eq. filter — special chars like + * Jr. need to be handled
    // Use the player id if available, otherwise fetch by name with proper encoding
    // Strip any URL-unsafe chars that PostgREST can't handle in eq. comparisons
    function sbEncode(str){ return encodeURIComponent(str); }
    let url;
    if(pid){
      url=`${SB}/rest/v1/players?id=eq.${pid}&select=*&limit=1`;
    } else if(pteam){
      url=`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&team=eq.${sbEncode(pteam)}&select=*&limit=1`;
    } else {
      url=`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&select=*&limit=1`;
    }
    const [pr,apr]=await Promise.all([
      fetch(url,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/players?select=ppg,rpg,apg,mpg,fg_pct,tp_pct,ft_pct,stl,blk,tovs&ppg=not.is.null&limit=5000`,{headers:H}).then(r=>r.json()),
    ]);
    let playerRow=Array.isArray(pr)?pr[0]:null;
    // Fallback 1: try name-only if team match failed
    if(!playerRow&&pname&&pteam){
      const fb=await fetch(`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&select=*&limit=1`,{headers:H});
      const fbRows=await fb.json();
      playerRow=Array.isArray(fbRows)?fbRows[0]:null;
    }
    // Fallback 2: fetch all players for this team and find by name client-side
    // handles special chars that break URL encoding (Jr., +, *, etc.)
    if(!playerRow&&pname){
      const teamParam=pteam?`&team=eq.${sbEncode(pteam)}`:'';
      const fb2=await fetch(`${SB}/rest/v1/players?select=*${teamParam}&limit=500`,{headers:H});
      const fb2Rows=await fb2.json();
      if(Array.isArray(fb2Rows)){
        const nameLower=pname.toLowerCase().trim();
        playerRow=fb2Rows.find(r=>r.name&&r.name.toLowerCase().trim()===nameLower);
        // Fuzzy: if exact still fails, try contains
        if(!playerRow) playerRow=fb2Rows.find(r=>r.name&&r.name.toLowerCase().includes(nameLower.slice(0,8)));
      }
    }
    if(!playerRow) throw new Error('Player not found — check name spelling or try searching from the roster page.');
    player=playerRow; allPlayers=apr;

    // Team fetch — use client-side match to handle special chars in team names
    let teamConf='', teamConfFull='';
    try{
      const tr=await fetch(`${SB}/rest/v1/teams?select=*&limit=500`,{headers:H});
      const allTeams=await tr.json();
      if(Array.isArray(allTeams)){
        const tnameLower=(player.team||'').toLowerCase().trim();
        teamData=allTeams.find(t=>(t.name||'').toLowerCase().trim()===tnameLower)||{};
        teamConf=teamData?.conf||teamData?.conference||'';
      }
    } catch(e2){ teamData={}; }

    calcPct();

    // ── FETCH CAREER HISTORY ─────────────────────────────────────
    // Do this FIRST — projection depends on it
    try{
      const chR = await fetch(`${SB}/rest/v1/player_history?name=eq.${sbEncode(player.name)}&select=*&order=season_year.asc&limit=20`,{headers:H});
      if(chR.ok){
        careerHistory = await chR.json();
        if(!Array.isArray(careerHistory)) careerHistory = [];
      }
      // Suffix fallback: "Billy Richmond" ↔ "Billy Richmond III"
      if(!careerHistory.length){
        const base = player.name.replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i,'').trim();
        const r2 = await fetch(`${SB}/rest/v1/player_history?name=ilike.${sbEncode(base+'*')}&select=*&order=season_year.asc&limit=20`,{headers:H});
        if(r2.ok){ const d=await r2.json(); if(Array.isArray(d)&&d.length) careerHistory=d; }
      }
      if(!careerHistory.length){
        const stripped = player.name.replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i,'').trim();
        if(stripped!==player.name){
          const r3 = await fetch(`${SB}/rest/v1/player_history?name=eq.${sbEncode(stripped)}&select=*&order=season_year.asc&limit=20`,{headers:H});
          if(r3.ok){ const d=await r3.json(); if(Array.isArray(d)&&d.length) careerHistory=d; }
        }
      }
    }catch(e){ console.warn('Career history fetch failed:',e); careerHistory=[]; }

    // ── BUILD _careerHistoryMap for projectPlayer ─────────────────
    window._careerHistoryMap = {};
    if(careerHistory.length){
      const key = (player.name||'').toLowerCase().trim();
      window._careerHistoryMap[key] = careerHistory;
    }

    // ── FETCH TEAM ROSTER (for MPG context) ──────────────────────
    try{
      const teamParam = player.team ? `&team=eq.${sbEncode(player.team)}` : '';
      const rr = await fetch(`${SB}/rest/v1/players?select=*&order=depth_order.asc&limit=500${teamParam}`,{headers:H});
      const allRows = await rr.json();
      teamPlayers = Array.isArray(allRows) ? allRows.filter(r=>r.name&&r.name!=='—') : [];
    }catch(e){ teamPlayers=[]; }

    // ── PROJECTION ─────────────────────────────────────────────────
    // Project the ENTIRE team using buildTeamProjections (same as team page).
    // This ensures normalization is applied identically and numbers match.
    proj = null;
    try{
      const conf = (teamData&&teamData.conf)||(player.team_conf)||'';

      // Build _careerHistoryMap for the full roster
      window._careerHistoryMap = {};
      if(careerHistory.length){
        window._careerHistoryMap[(player.name||'').toLowerCase().trim()] = careerHistory;
      }

      // Also fetch career history for teammates so team normalization is accurate
      if(teamPlayers.length > 1){
        try{
          const teammates = teamPlayers.filter(p=>p.name&&p.name!=='—'&&p.name!==player.name);
          const orParam = teammates.map(p=>`"${p.name}"`).join(',');
          const tr = await fetch(`${SB}/rest/v1/player_history?name=in.(${orParam})&select=*&order=season_year.asc&limit=500`,{headers:H});
          if(tr.ok){
            const td = await tr.json();
            if(Array.isArray(td)) td.forEach(row=>{
              const k=(row.name||'').toLowerCase().trim();
              if(!window._careerHistoryMap[k]) window._careerHistoryMap[k]=[];
              window._careerHistoryMap[k].push(row);
            });
          }
        }catch(e){ console.warn('Teammate history fetch failed:',e); }
      }

      // Project full team — includes normalization cap
      // Then find this player in the result
      const allProj = buildTeamProjections(teamPlayers, conf);
      const playerLower = (player.name||'').toLowerCase().trim();
      const match = allProj.find(pp =>
        (pp.name||'').toLowerCase().trim() === playerLower
      );

      if(match){
        proj = match;
      } else {
        // Player not found in team projections (name mismatch) — project standalone
        console.warn('Player not found in team projections, using standalone');
        // Build careerHistoryMap for just this player and project alone
        const singleTeam = [player];
        const singleProj = buildTeamProjections(singleTeam, conf);
        proj = singleProj[0] || null;
      }
    }catch(projErr){
      console.warn('Projection failed:',projErr);
      proj = null;
    }

    renderPage();
  }catch(e){
    console.error('Player load error:',e);
    document.getElementById('heroSection').innerHTML=`<div style="padding:80px;text-align:center;"><div style="font-family:'Playfair Display',serif;font-weight:800;font-size:24px;margin-bottom:8px;">Player not found</div><p style="color:var(--text3);margin-bottom:16px;">${e.message}</p><a href="roster.html" style="color:var(--accent);">← Back to players</a></div>`;
  }
}

function calcPct(){
  ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs'].forEach(k=>{
    gPct[k]=allPlayers.map(p=>parseFloat(p[k])).filter(v=>!isNaN(v)&&v>0).sort((a,b)=>a-b);
  });
}

function getPct(val,key){
  const arr=gPct[key]; if(!arr?.length||val==null) return 0;
  const v=parseFloat(val); if(isNaN(v)||v===0) return 0;
  let lo=0,hi=arr.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<v)lo=mid+1;else hi=mid;}
  const p=Math.round(lo/arr.length*100);
  return key==='tovs'?100-p:p;
}

function buildOverviewCards(p, proj){
  const STATS = [{l:'PPG',k:'ppg'},{l:'RPG',k:'rpg'},{l:'APG',k:'apg'},{l:'MPG',k:'mpg'},
    {l:'FG%',k:'fg_pct',pct:true},{l:'3P%',k:'tp_pct',pct:true},{l:'FT%',k:'ft_pct',pct:true},
    {l:'STL',k:'stl'},{l:'BLK',k:'blk'},{l:'TO',k:'tovs'}];

  function card(val, label, accent, diff){
    const col = accent ? 'color:var(--accent);' : '';
    const diffHtml = diff != null ? '<div class="stat-card-diff '+(diff>0.05?'up':diff<-0.05?'dn':'eq')+'">'+(diff>0.05?'+':'')+diff+'</div>' : '';
    return '<div class="stat-card"><div class="stat-card-val" style="'+col+'">'+val+'</div><div class="stat-card-label">'+label+'</div>'+diffHtml+'</div>';
  }

  function cards(src, accent, compare){
    return STATS.map(s=>{
      const v = s.pct ? fmtP(src[s.k]) : fmt(src[s.k]);
      let diff = null;
      if(compare != null){
        const d = r1((parseFloat(src[s.k])||0)-(parseFloat(compare[s.k])||0));
        diff = d;
      }
      return card(v, s.l, accent, diff);
    }).join('');
  }

  const hasActual = p.ppg && parseFloat(p.ppg) > 0;

  if(!proj){
    return '<div class="stat-cards" style="margin-bottom:24px;">'+cards(p, false, null)+'</div>';
  }

  // Injured player — show DNP banner instead of projection stats
  if(proj._injured || player.is_injured){
    const injuredHTML = [
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">',
      '<div>',
      '<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border2);">2026-27 Actual</div>',
      '<div class="stat-cards">' + cards(p, false, null) + '</div>',
      '</div>',
      '<div>',
      '<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ef4444;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #ef4444;">2026-27 Projected</div>',
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.2);border-radius:8px;text-align:center;gap:10px;">',
      '<div style="font-size:28px;">🏥</div>',
      '<div style="font-size:14px;font-weight:700;color:#ef4444;">Projected DNP</div>',
      '<div style="font-size:12px;color:var(--text3);line-height:1.5;max-width:220px;">Expected to miss the 2026-27 season. Minutes redistributed to healthy teammates.</div>',
      '</div>',
      '</div>',
      '</div>'
    ].join('');
    return injuredHTML;
  }

  if(!hasActual){
    return '<div style="margin-bottom:24px;">'
      +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:8px;">2026-27 Projected <span style="font-size:9px;padding:1px 4px;background:rgba(139,105,20,.12);">EST</span></div>'
      +'<div class="stat-cards">'+cards(proj, true, null)+'</div>'
      +'</div>';
  }

  const estBadge = proj._frosh ? ' <span style="font-size:9px;padding:1px 4px;background:rgba(139,105,20,.12);">EST</span>' : '';
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">'
    +'<div>'
    +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border2);">2026-27 Actual</div>'
    +'<div class="stat-cards">'+cards(p, false, null)+'</div>'
    +'</div>'
    +'<div>'
    +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);">2026-27 Projected'+estBadge+'</div>'
    +'<div class="stat-cards">'+cards(proj, true, p)+'</div>'
    +'</div>'
    +'</div>';
}

            <div class="pct-pct" style="color:${col};">${pct}th</div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:11px;color:var(--text3);">Turnovers inverted — lower TO = better percentile.</div>
    </div>

    <!-- SCOUTING REPORT TAB -->
    <div class="tab-panel" id="panel-scout">
      <div class="scout-header">
        <div>
          <div class="scout-archetype-label">Player Archetype</div>
          <div class="scout-archetype-name">${scout.archetype}</div>
          <div class="scout-archetype-desc">${scout.archetypeDesc}</div>
          <div style="margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="scout-tag gold">Role: ${scout.roleFit}</span>
            ${scout.draftOutlook ? '<span class="scout-tag pos">' + scout.draftOutlook + '</span>' : ''}
          </div>
        </div>
        <div class="scout-ratings">
          <div style="font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;">Scouting Profile</div>
          ${(function(){
            var items=[
              {l:'Overall', v:scout.scoutScore},
              {l:'Offense', v:Math.round(Math.min(100,(parseFloat(p.ppg)||0)/22*50+((parseFloat(p.fg_pct)||0)-30)/30*30+(parseFloat(p.apg)||0)/8*20))},
              {l:'Defense', v:Math.round(Math.min(100,getPct(p.stl,'stl')*.5+getPct(p.blk,'blk')*.5))},
              {l:'Rebnd',   v:Math.round(getPct(p.rpg,'rpg'))},
              {l:'Effcncy', v:Math.round(Math.min(100,Math.max(0,((parseFloat(p.fg_pct)||0)-30)/35*60+((parseFloat(p.ft_pct)||0)-40)/55*40)))}
            ];
            return items.map(function(r){
              var v=Math.max(0,Math.min(100,r.v));
              return '<div class="scout-rating-row"><div class="scout-rating-label">'+r.l+'</div><div class="scout-rating-bar"><div class="scout-rating-fill" style="width:'+v+'%"></div></div><div class="scout-rating-val">'+v+'</div></div>';
            }).join('');
          })()}
        </div>
      </div>
      <div class="scout-fc-grid">
        <div class="scout-fc-card"><div class="scout-fc-label">Floor</div><div class="scout-fc-val">${scout.floor}</div><div class="scout-fc-desc">${scout.floorDesc}</div></div>
        <div class="scout-fc-card"><div class="scout-fc-label">Ceiling</div><div class="scout-fc-val" style="color:var(--accent);">${scout.ceiling}</div><div class="scout-fc-desc">${scout.ceilingDesc}</div></div>
        ${scout.draftOutlook ? '<div class="scout-fc-card" style="grid-column:1/-1"><div class="scout-fc-label">Draft Outlook</div><div class="scout-fc-val">' + scout.draftOutlook + '</div><div class="scout-fc-desc">' + scout.draftNote + '</div></div>' : ''}
      </div>
      <div class="scout-grid">
        <div class="scout-card">
          <div class="scout-card-title">Strengths</div>
          <div class="scout-card-body">
            ${scout.strengths.length?scout.strengths.map(s=>`<span class="scout-tag pos">✓ ${s}</span>`).join(' '):'<span style="color:var(--text3);font-size:12px;">Insufficient data</span>'}
          </div>
        </div>
        <div class="scout-card">
          <div class="scout-card-title">Areas to Improve</div>
          <div class="scout-card-body">
            ${scout.weaknesses.length?scout.weaknesses.map(s=>`<span class="scout-tag neg">✗ ${s}</span>`).join(' '):'<span style="color:var(--text3);font-size:12px;">No notable concerns</span>'}
          </div>
        </div>
        <div class="scout-card">
          <div class="scout-card-title">Playing Style</div>
          <div class="scout-card-body">${scout.tags.map(t=>`<span class="scout-tag ${t.c}">${t.t}</span>`).join(' ')||'—'}</div>
        </div>
        ${proj?`<div class="scout-card">
          <div class="scout-card-title">2026-27 Projection Context</div>
          <div class="scout-card-body">${scout.projNote}</div>
        </div>`:''}
      </div>
      <div class="scout-card" style="margin-top:0;">
        <div class="scout-card-title">Statistical Summary</div>
        <div class="scout-card-body">${buildStatNarrative(p)}</div>
      </div>
    </div>`;

  // Draw radar after DOM is ready
  setTimeout(drawRadar, 100);
}

function renderStatTable(p, projData){
  const seasonLabel = y => {
    const yr = parseInt(y);
    return isNaN(yr) ? y : `${yr-1}-${String(yr).slice(2)}`;
  };

  let rowsHtml = '';

  // If we have career history, show every season the player was rostered
  if(careerHistory && careerHistory.length){
    careerHistory.forEach(s=>{
      if(s.sat_out || (s.ppg==null && (s.gp==null||s.gp===0))){
        // Sat-out / redshirt season — show team + "Did not play"
        rowsHtml += `<tr style="opacity:.55;">
          <td>${seasonLabel(s.season_year)}</td>
          <td colspan="19" style="text-align:left;font-style:italic;color:var(--text3);">
            Redshirt / Did not play
          </td>
        </tr>`;
      } else {
        rowsHtml += `<tr class="actual">
          <td>${seasonLabel(s.season_year)}</td>
          <td>${s.gp||'—'}</td>
          <td>${fmt(s.ppg)}</td><td>${fmt(s.rpg)}</td><td>${fmt(s.apg)}</td><td>${fmt(s.mpg)}</td>
          <td>${fmt(s.fgm)}</td><td>${fmt(s.fga)}</td><td>${fmtP(s.fg_pct)}</td>
          <td>${fmt(s.tpm)}</td><td>${fmt(s.tpa)}</td><td>${fmtP(s.tp_pct)}</td>
          <td>${fmt(s.ftm)}</td><td>${fmt(s.fta)}</td><td>${fmtP(s.ft_pct)}</td>
          <td>${fmt(s.oreb)}</td><td>${fmt(s.dreb)}</td>
          <td>${fmt(s.stl)}</td><td>${fmt(s.blk)}</td><td>${fmt(s.tovs)}</td>
        </tr>`;
      }
    });
  } else {
    // No career history — fall back to the current season row from players table
    rowsHtml += `<tr class="actual">
      <td>2026-27</td>
      <td>${p.gp||'—'}</td>
      <td>${fmt(p.ppg)}</td><td>${fmt(p.rpg)}</td><td>${fmt(p.apg)}</td><td>${fmt(p.mpg)}</td>
      <td>${fmt(p.fgm)}</td><td>${fmt(p.fga)}</td><td>${fmtP(p.fg_pct)}</td>
      <td>${fmt(p.tpm)}</td><td>${fmt(p.tpa)}</td><td>${fmtP(p.tp_pct)}</td>
      <td>${fmt(p.ftm)}</td><td>${fmt(p.fta)}</td><td>${fmtP(p.ft_pct)}</td>
      <td>${fmt(p.oreb)}</td><td>${fmt(p.dreb)}</td>
      <td>${fmt(p.stl)}</td><td>${fmt(p.blk)}</td><td>${fmt(p.tovs)}</td>
    </tr>`;
  }

  // Always append the 2026-27 projection row
  if(projData){
    rowsHtml += `<tr class="proj">
      <td>2026-27 ★<div style="font-size:9px;color:var(--text3);font-weight:600;">Projected</div></td>
      <td>—</td>
      <td>${fmt(projData.ppg)}</td><td>${fmt(projData.rpg)}</td><td>${fmt(projData.apg)}</td><td>${fmt(projData.mpg)}</td>
      <td>${fmt(projData.fgm)}</td><td>${fmt(projData.fga)}</td><td>${fmtP(projData.fg_pct)}</td>
      <td>${fmt(projData.tpm)}</td><td>${fmt(projData.tpa)}</td><td>${fmtP(projData.tp_pct)}</td>
      <td>${fmt(projData.ftm)}</td><td>${fmt(projData.fta)}</td><td>${fmtP(projData.ft_pct)}</td>
      <td>${fmt(projData.oreb)}</td><td>${fmt(projData.dreb)}</td>
      <td>${fmt(projData.stl)}</td><td>${fmt(projData.blk)}</td><td>${fmt(projData.tovs)}</td>
    </tr>`;
  }

  return `<table class="stat-table">
    <thead><tr>
      <th>Season</th><th>GP</th><th>PPG</th><th>RPG</th><th>APG</th><th>MPG</th>
      <th>FGM</th><th>FGA</th><th>FG%</th><th>3PM</th><th>3PA</th><th>3P%</th>
      <th>FTM</th><th>FTA</th><th>FT%</th><th>OR</th><th>DR</th><th>STL</th><th>BLK</th><th>TO</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

function buildStatNarrative(p){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const pos=p.position||'G'; const name=p.name.split(' ')[0];
  const yr=(p.yr||p.class_year||'');

  let parts=[];
  if(ppg>0) parts.push(`${name} averaged ${ppg.toFixed(1)} points, ${rpg.toFixed(1)} rebounds, and ${apg.toFixed(1)} assists per game in 2026-27.`);
  if(fg>0){
    const fgDesc=fg>=52?'highly efficient':fg>=46?'efficient':fg>=42?'average':'below-average';
    parts.push(`Shot ${fg.toFixed(1)}% from the field — ${fgDesc} for the position.`);
  }
  if(tp>0&&(parseFloat(p.tpa)||0)>2){
    const tpDesc=tp>=40?'elite':tp>=36?'solid':tp>=32?'adequate':'concerning';
    parts.push(`Connected at ${tp.toFixed(1)}% from three — ${tpDesc} efficiency on ${(parseFloat(p.tpa)||0).toFixed(1)} attempts.`);
  }
  if(stl+blk>1.5) parts.push(`Provides defensive value with ${stl.toFixed(1)} steals and ${blk.toFixed(1)} blocks per game.`);
  if(yr) parts.push(`As a ${yr} ${pos}, ${name} will be an important piece of the program going forward.`);

  return parts.join(' ')||'Insufficient stats for narrative.';
}

// ── RADAR CHART ─────────────────────────────────────────
function drawRadar(){
  const canvas=document.getElementById('radarChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=player;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textCol=isDark?'#a0a0a0':'#888';
  const gridCol=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const color=teamData?.color||'#8B6914';

  // 8 axes
  const axes=[
    {label:'Scoring',    val:Math.min(100,getPct(p.ppg,'ppg'))},
    {label:'Efficiency', val:Math.min(100,Math.round((getPct(p.fg_pct,'fg_pct')+getPct(p.ft_pct,'ft_pct'))/2))},
    {label:'3-Point',    val:Math.min(100,getPct(p.tp_pct,'tp_pct'))},
    {label:'Playmaking', val:Math.min(100,getPct(p.apg,'apg'))},
    {label:'Rebounding', val:Math.min(100,getPct(p.rpg,'rpg'))},
    {label:'Defense',    val:Math.min(100,Math.round((getPct(p.stl,'stl')+getPct(p.blk,'blk'))/2))},
    {label:'Usage',      val:Math.min(100,getPct(p.mpg,'mpg'))},
    {label:'Ball Care',  val:Math.min(100,getPct(p.tovs,'tovs'))},
  ];


  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-40;
  const n=axes.length;

  // Draw grid rings
  for(let ring=1;ring<=5;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const angle=Math.PI*2*i/n-Math.PI/2;
      const x=cx+Math.cos(angle)*r*(ring/5);
      const y=cy+Math.sin(angle)*r*(ring/5);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  }

  // Draw axis lines and labels
  axes.forEach((ax,i)=>{
    const angle=Math.PI*2*i/n-Math.PI/2;
    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
    const lx=cx+Math.cos(angle)*(r+18), ly=cy+Math.sin(angle)*(r+18);
    ctx.fillStyle=textCol; ctx.font='bold 11px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ax.label,lx,ly);
  });

  function drawShape(axData, fillCol, strokeCol, alpha){
    ctx.beginPath();
    axData.forEach((ax,i)=>{
      const angle=Math.PI*2*i/n-Math.PI/2;
      const val=ax.val/100;
      const x=cx+Math.cos(angle)*r*val, y=cy+Math.sin(angle)*r*val;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle=fillCol; ctx.globalAlpha=alpha; ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=strokeCol; ctx.lineWidth=2; ctx.stroke();
  }

  // Draw actual
  drawShape(axes,color,color,0.15);
  // Always show projected overlay if available
  const showProjRadar = proj && !proj._frosh;
  if(showProjRadar){
    const projAxes=[
      {label:'Scoring',    val:Math.min(100,getPct(proj.ppg,'ppg'))},
      {label:'Efficiency', val:Math.min(100,Math.round((getPct(proj.fg_pct,'fg_pct')+getPct(proj.ft_pct,'ft_pct'))/2))},
      {label:'3-Point',    val:Math.min(100,getPct(proj.tp_pct,'tp_pct'))},
      {label:'Playmaking', val:Math.min(100,getPct(proj.apg,'apg'))},
      {label:'Rebounding', val:Math.min(100,getPct(proj.rpg,'rpg'))},
      {label:'Defense',    val:Math.min(100,Math.round((getPct(proj.stl,'stl')+getPct(proj.blk,'blk'))/2))},
      {label:'Usage',      val:Math.min(100,getPct(proj.mpg,'mpg'))},
      {label:'Ball Care',  val:Math.min(100,getPct(proj.tovs,'tovs'))},
    ];
    drawShape(projAxes,'rgba(139,105,20,0.8)','#8B6914',0.12);
  }

  // Legend
  const legendEl=document.getElementById('radarLegend');
  if(legendEl){
    legendEl.innerHTML=`<div class="radar-legend-item"><div class="radar-legend-dot" style="background:${color};"></div>2026-27 Actual</div>${showProjRadar?`<div class="radar-legend-item"><div class="radar-legend-dot" style="background:var(--accent);opacity:.6;"></div>2026-27 Projected</div>`:''}`;
  }
}

function switchTab(t){
  const tabs=['overview','stats','percentiles','scout'];
  const cur=tabs.map(x=>document.getElementById('panel-'+x)).find(el=>el&&el.classList.contains('active'));
  function activate(id){
    tabs.forEach(x=>{
      const btn=document.getElementById('tab-'+x);
      const pnl=document.getElementById('panel-'+x);
      if(btn)btn.classList.toggle('active',x===id);
      if(pnl){
        pnl.classList.remove('active','entering','leaving');
        if(x===id){pnl.style.display='block';requestAnimationFrame(function(){requestAnimationFrame(function(){pnl.classList.add('active','entering');});});}
        else pnl.style.display='none';
      }
    });
    if(id==='overview')setTimeout(drawRadar,80);
  }
  if(cur&&!cur.id.endsWith(t)){cur.classList.add('leaving');setTimeout(function(){activate(t);},150);}
  else activate(t);
}

  try{

function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  const n=d?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('tdc_theme',n);
  setTimeout(drawRadar,50);
}
(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('tdc_theme')||'light');})();
init();
</script>

<script>
/* ── Particle system ──────────────────────────────────────── */
(function(){
  const cv=document.getElementById('particleCanvas');
  if(!cv) return;
  const ctx=cv.getContext('2d');
  const N=14,SMIN=5,SMAX=8,RMIN=1.0,RMAX=2.0,OMIN=0.05,OMAX=0.16;
  let W,H,pts=[];
  function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener('resize',rsz,{passive:true});rsz();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function mk(){const a=rnd(0,Math.PI*2),s=rnd(SMIN,SMAX);
    return{x:rnd(0,W),y:rnd(0,H),vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(RMIN,RMAX),op:rnd(OMIN,OMAX),p:rnd(0,Math.PI*2),ps:rnd(.004,.010)};}
  for(let i=0;i<N;i++) pts.push(mk());
  let last=0;
  function frame(ts){
    const dt=Math.min((ts-last)/1000,.05);last=ts;
    ctx.clearRect(0,0,W,H);
    const dk=document.documentElement.getAttribute('data-theme')==='dark';
    pts.forEach(p=>{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;
      if(p.y<-4)p.y=H+4;if(p.y>H+4)p.y=-4;
      p.p+=p.ps;
      const al=p.op*(0.6+0.4*Math.sin(p.p))*(dk?1:.5);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
      g.addColorStop(0,`rgba(200,160,32,${al})`);
      g.addColorStop(.4,`rgba(200,160,32,${al*.5})`);
      g.addColorStop(1,`rgba(200,160,32,0)`);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
