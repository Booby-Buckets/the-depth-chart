<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#fff;--bg2:#f5f5f5;--border:#e0e0e0;--border2:#ccc;--text:#111;--text2:#444;--text3:#888;--accent:#8B6914;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#111;--bg2:#181818;--border:#2a2a2a;--border2:#333;--text:#e8e8e8;--text2:#a0a0a0;--text3:#606060;--accent:#c8a96e;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .nav-wrap{border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;}
    .nav-logo span{color:var(--accent);}
    .nav-actions{display:flex;align-items:center;gap:14px;}
    .nav-signin{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--text);padding:6px 16px;text-decoration:none;}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a:hover,.nav-sub a.active{color:var(--text);border-bottom-color:var(--accent);}

    /* HERO */
    .player-hero{padding:32px 40px 24px;border-bottom:1px solid var(--border);display:flex;gap:24px;align-items:flex-start;}
    .hero-avatar{width:72px;height:72px;border-radius:50%;background:var(--bg2);border:3px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:26px;color:var(--accent);flex-shrink:0;}
    .hero-info{flex:1;min-width:0;}
    .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .hero-name{font-family:'Playfair Display',serif;font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px;}
    .hero-team{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 5px;border:1px solid var(--border);font-size:12px;font-weight:700;text-decoration:none;color:var(--text);}
    .team-dot{width:9px;height:9px;border-radius:50%;}
    .hero-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
    .hero-meta-item{font-size:12px;color:var(--text3);}
    .hero-meta-item strong{color:var(--text2);}
    .hero-grade{font-family:'Playfair Display',serif;font-weight:800;font-size:48px;line-height:1;flex-shrink:0;}
    .gA{color:#1a8c3a;}.gB{color:#2d7a2d;}.gC{color:#b8860b;}.gD{color:#cc5500;}.gF{color:#cc2200;}

    /* STAT TOGGLE */
    .stat-toggle{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border2);width:fit-content;}
    .stat-toggle-btn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border:none;background:none;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
    .stat-toggle-btn.active{background:var(--text);color:var(--bg);}

    /* TABS */
    .tab-row{display:flex;border-bottom:1px solid var(--border);padding:0 40px;}
    .tab-btn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Inter',sans-serif;transition:all .15s;}
    .tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
    .tab-panel{display:none;padding:28px 40px 60px;}
    .tab-panel.active{display:block;}

    /* STAT CARDS */
    .stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-bottom:24px;}
    .stat-card{border:1px solid var(--border);padding:12px 10px;text-align:center;position:relative;}
    .stat-card-val{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1;margin-bottom:3px;}
    .stat-card-proj{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px;}
    .stat-card-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .stat-card-diff{font-size:10px;font-weight:700;margin-top:3px;}
    .stat-card-diff.up{color:var(--green);}.stat-card-diff.dn{color:var(--red);}.stat-card-diff.eq{color:var(--text3);}

    /* FULL STAT TABLE */
    .sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .stat-table{width:100%;border-collapse:collapse;min-width:680px;}
    .stat-table th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 8px;border-bottom:2px solid var(--border2);text-align:right;white-space:nowrap;}
    .stat-table th:first-child{text-align:left;}
    .stat-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;text-align:right;white-space:nowrap;}
    .stat-table td:first-child{text-align:left;font-weight:700;}
    .stat-table tr.actual td{color:var(--text2);}
    .stat-table tr.proj td{color:var(--accent);}
    .stat-table tr.proj td:first-child{color:var(--accent);}

    /* PERCENTILE BARS */
    .pct-wrap{margin-bottom:28px;}
    .pct-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .pct-label{font-size:12px;font-weight:600;color:var(--text3);width:52px;flex-shrink:0;text-align:right;}
    .pct-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:visible;position:relative;}
    .pct-fill{height:100%;border-radius:4px;transition:width .5s ease;}
    .pct-val{font-size:12px;font-weight:700;width:38px;text-align:right;flex-shrink:0;}
    .pct-pct{font-size:11px;font-weight:600;color:var(--text3);width:36px;flex-shrink:0;}

    /* RADAR / SPIDER CHART */
    .radar-wrap{display:flex;justify-content:center;margin-bottom:28px;}
    .radar-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px;}
    .radar-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text3);}
    .radar-legend-dot{width:10px;height:10px;border-radius:50%;}

    /* SCOUTING REPORT */
    .scout-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
    .scout-card{border:1px solid var(--border);padding:16px;}
    .scout-card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .scout-card-body{font-size:13px;color:var(--text2);line-height:1.6;}
    .scout-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:2px;margin:2px;}
    .scout-tag.pos{background:rgba(26,140,58,.1);color:#1a8c3a;}
    .scout-tag.neg{background:rgba(204,34,0,.1);color:#cc2200;}
    .scout-tag.neu{background:var(--bg2);color:var(--text3);}
    .archetype-badge{display:inline-block;font-family:'Playfair Display',serif;font-weight:800;font-size:18px;color:var(--accent);margin-bottom:12px;}

    .loading-state{text-align:center;padding:80px;color:var(--text3);}
    .loading-spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @media(max-width:768px){
      .nav-top,.nav-sub,.player-hero,.tab-panel,.tab-row{padding-left:16px;padding-right:16px;}
      .player-hero{flex-wrap:wrap;}
      .hero-name{font-size:24px;}
      .stat-cards{grid-template-columns:repeat(3,1fr);}
      .scout-grid{grid-template-columns:1fr;}
    }
  </style>
</head>

// ── CONF / TRANSLATION SYSTEM ───────────────────────────
const CONF_MULT={'SEC':1.00,'B10':1.00,'BIG-12':1.00,'Big-East':0.95,'ACC':0.97,'PAC-12':0.92,'A10':0.88,'AAC':0.82,'WCC':0.85,'MVC':0.76,'Big South':0.68,'SBC':0.68,'CAA':0.70,'Horizon':0.70,'Sun Belt':0.71,'Big Sky':0.68,'Ivy':0.72,'Summit':0.67,'SoCon':0.67,'ASUN':0.67,'MAAC':0.67,'OVC':0.67,'Patriot':0.60,'SWAC':0.58,'NEC':0.58,'MEAC':0.55};

const ACC_OUT={1:1.00,2:1.10,3:1.25,4:1.40,5:1.40,6:1.40,7:1.40};
const TRANS_MAT={1:{1:1.00,2:1.15,3:1.28,4:1.40,5:1.40,6:1.40,7:1.40},2:{1:0.90,2:1.00,3:1.15,4:1.20,5:1.20,6:1.20,7:1.20},3:{1:0.75,2:0.90,3:1.00,4:1.05,5:1.10,6:1.10,7:1.10},4:{1:0.49,2:0.68,3:0.82,4:1.00,5:1.05,6:1.05,7:1.05},5:{1:0.43,2:0.49,3:0.69,4:0.82,5:1.00,6:1.00,7:1.00},6:{1:0.40,2:0.42,3:0.50,4:0.69,5:0.82,6:1.00,7:1.00},7:{1:0.30,2:0.34,3:0.42,4:0.48,5:0.69,6:0.82,7:1.00}};

  [['Illinois','Indiana','Iowa','Maryland','Michigan','Michigan State','Minnesota','Nebraska','Northwestern','Ohio State','Penn State','Purdue','Rutgers','Wisconsin','UCLA','USC','Oregon','Washington'],'B10'],
  [['Arizona','Arizona State','Baylor','BYU','Cincinnati','Colorado','Houston','Iowa State','Kansas','Kansas State','Oklahoma State','TCU','Texas Tech','UCF','Utah','West Virginia'],'BIG-12'],

  [['Dayton','Davidson','Duquesne','Fordham','George Mason','George Washington','La Salle','Loyola Chicago','Rhode Island','Richmond',"Saint Joseph's",'Saint Louis','St. Bonaventure','VCU','Massachusetts'],'A10'],

  [['Akron','Ball State','Bowling Green','Buffalo','Central Michigan','Eastern Michigan','Kent State','Miami (OH)','Northern Illinois','Ohio','Toledo','Western Michigan'],'MAC'],

  [['UC Davis','UC Irvine','UC Riverside','UC Santa Barbara','UC San Diego','Cal Poly','Long Beach State','Pacific','Cal State Fullerton','Cal State Northridge'],'Big West'],
  [['Iona','Manhattan','Marist','Niagara','Quinnipiac','Rider','Saint Peter\'s','Siena','Canisius','Fairfield'],'MAAC'],
  [['Colgate','Bucknell','Lafayette','Lehigh','Army','Navy','Holy Cross','American','Loyola Maryland'],'Patriot'],
  [['Grambling','Jackson State','Alabama A&M','Alabama State','Alcorn State','Arkansas Pine Bluff','Bethune-Cookman','Coppin State','Delaware State','Florida A&M','Howard','Maryland Eastern Shore','Mississippi Valley State','Morgan State','Norfolk State','North Carolina A&T','North Carolina Central','Prairie View','Savannah State','South Carolina State','Southern','Texas Southern'],'SWAC'],

].forEach(function(pair){if(pair&&pair[0]&&pair[1])pair[0].forEach(function(s){m[s.toLowerCase()]=pair[1];});});return m;})();

function getTransFactor(origin, dest, grade){
  if(!origin||!dest||origin===dest) return 1.0;
  const ot=CONF_TIERS[origin]||4, dt=CONF_TIERS[dest]||4;
  if(ot===dt) return 1.0;
  const base=origin==='ACC'?ACC_OUT[dt]||1.0:(TRANS_MAT[ot]||{})[dt]||1.0;
  const g=parseFloat(grade)||70;
  const boost=g>=90?1.22:g>=85?1.14:g>=80?1.07:g>=75?1.02:g>=70?0.97:g>=65?0.91:0.85;
  return Math.max(0.20,Math.min(1.6,base*boost));
}

function getSchoolConf(school){
  if(!school) return null;
  const lo=school.toLowerCase().trim();
  if(SCHOOL_CONF[lo]) return SCHOOL_CONF[lo];
  for(const k of Object.keys(SCHOOL_CONF)){if(lo.includes(k)||k.includes(lo)) return SCHOOL_CONF[k];}
  return null;
}

// ── POSITION BASELINES ──────────────────────────────────
const POS_BASE={'PG':{ppg:10.5,rpg:3.2,apg:4.1,mpg:26,fg_pct:42,tp_pct:36,ft_pct:75,stl:1.2,blk:0.2},'SG':{ppg:11.2,rpg:3.8,apg:2.2,mpg:26,fg_pct:42,tp_pct:37,ft_pct:76,stl:1.0,blk:0.3},'CG':{ppg:10.8,rpg:3.5,apg:3.0,mpg:26,fg_pct:42,tp_pct:36,ft_pct:75,stl:1.1,blk:0.2},'SF':{ppg:10.8,rpg:5.2,apg:1.8,mpg:26,fg_pct:43,tp_pct:37,ft_pct:72,stl:0.9,blk:0.5},'PF':{ppg:10.2,rpg:6.8,apg:1.2,mpg:24,fg_pct:45,tp_pct:33,ft_pct:69,stl:0.6,blk:1.1},'C':{ppg:9.8,rpg:7.4,apg:0.9,mpg:22,fg_pct:49,tp_pct:30,ft_pct:66,stl:0.4,blk:1.6},'G':{ppg:10.0,rpg:3.5,apg:3.0,mpg:25,fg_pct:42,tp_pct:35,ft_pct:74,stl:1.1,blk:0.2},'F':{ppg:10.5,rpg:6.0,apg:1.5,mpg:25,fg_pct:44,tp_pct:35,ft_pct:70,stl:0.7,blk:0.8}};

// ── PROJECTION ──────────────────────────────────────────
function projectPlayer(p, teamConf){
  const yr=(p.yr||p.class_year||'').toLowerCase();
  const isFr=yr.includes('fr.')||yr.includes('r-fr');
  const isSo=yr.includes('so.')||yr.includes('r-so.');
  const isJr=yr.includes('jr.')||yr.includes('r-jr.');
  const pos=p.position||'G';
  const base=POS_BASE[pos]||POS_BASE['G'];
  const conf=teamConf||'';
  const destMult=CONF_MULT[conf]||0.85;
  const grade=parseFloat(p.tdc_grade)||70;
  const depth=p.depth_order||8;
  const hasStats=p.ppg&&parseFloat(p.ppg)>0;
  const isTransfer=p.hometown&&p.hometown.trim()!=='';

  let transferFactor=1.0, originConf=null;
  if(isTransfer&&hasStats){
    originConf=getSchoolConf(p.hometown);
    if(originConf) transferFactor=getTransFactor(originConf,conf,grade);
  }

  if(isFr&&!hasStats){
    const gm=grade>=90?0.85:grade>=85?0.72:grade>=80?0.58:grade>=75?0.44:grade>=70?0.32:grade>=65?0.22:0.14;
    const dm=depth<=2?1.1:depth<=5?1.0:depth<=8?0.65:0.40;
    const t=gm*dm*destMult;
    return {ppg:r1(base.ppg*t),rpg:r1(base.rpg*t),apg:r1(base.apg*t),mpg:r1(base.mpg*t),
      fg_pct:r1(base.fg_pct),tp_pct:r1(base.tp_pct),ft_pct:r1(base.ft_pct),
      stl:r1(base.stl*t),blk:r1(base.blk*t),_frosh:true,_origin:originConf,_factor:transferFactor};
  }

  if(!hasStats) return null;

  const ym=isFr?1.12:isSo?1.07:isJr?1.04:1.02;
  const rm=depth<=2?1.08:depth<=5?1.03:depth<=8?0.97:0.88;
  const gb=grade>=88?1.04:grade>=82?1.02:grade>=75?1.00:grade>=68?0.98:0.95;
  const fm=ym*rm*gb*transferFactor;
  const s=k=>parseFloat(p[k])||0;

  // Percentages are skill-based — they change very little year to year
  // Max change: ±3% for FG/3P, ±2% for FT regardless of multiplier
  // Transfer effect on pct is also small — conference difficulty changes volume not skill
  const fgBase=s('fg_pct'), tpBase=s('tp_pct'), ftBase=s('ft_pct');
  const pctDelta=(fm-1)*0.08; // tiny nudge based on progression
  const transPctAdj=transferFactor<1?-1.5:transferFactor>1?0.5:0; // slight dip going up in conf
  const fgProj =r1(Math.max(30,Math.min(65, fgBase + pctDelta*3 + transPctAdj)));
  const tpProj =r1(Math.max(20,Math.min(50, tpBase + pctDelta*2 + transPctAdj*0.8)));
  const ftProj =r1(Math.max(50,Math.min(95, ftBase + pctDelta*1.5)));

  return {
    ppg:r1(s('ppg')*fm),rpg:r1(s('rpg')*fm),apg:r1(s('apg')*fm),
    mpg:r1(Math.min(36,s('mpg')*(1+(fm-1)*0.4))),
    fgm:r1(s('fgm')*fm),fga:r1(s('fga')*fm),
    fg_pct:fgProj,
    tpm:r1(s('tpm')*fm),tpa:r1(s('tpa')*fm),
    tp_pct:tpProj,
    ftm:r1(s('ftm')*fm),fta:r1(s('fta')*fm),
    ft_pct:ftProj,
    oreb:r1(s('oreb')*fm),dreb:r1(s('dreb')*fm),
    stl:r1(s('stl')*fm),blk:r1(s('blk')*fm),tovs:r1(s('tovs')*fm),
    _frosh:false,_origin:originConf,_factor:transferFactor,
  };
}

// ── PLAYER ARCHETYPE / SCOUTING ─────────────────────────
function buildScoutingReport(p, proj, globalPct){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const oreb=parseFloat(p.oreb)||0, dreb=parseFloat(p.dreb)||0;
  const tovs=parseFloat(p.tovs)||0, mpg=parseFloat(p.mpg)||0;
  const pos=p.position||'G';
  const grade=parseFloat(p.tdc_grade)||70;

  // Determine archetype
  let archetype='', archetypeDesc='';
  const isGuard=pos==='PG'||pos==='SG'||pos==='CG'||pos==='G';
  const isBig=pos==='C'||pos==='PF';

  if(isGuard){
    if(ppg>=16&&apg>=4) archetype='Primary Playmaker';
    else if(ppg>=16&&apg<3) archetype='Scoring Guard';
    else if(apg>=5&&ppg<12) archetype='Pass-First Guard';
    else if(tp>=38&&ppg>=10) archetype='Perimeter Shooter';
    else if(stl>=1.5) archetype='Disruptive Defender';
    else if(mpg>=28&&ppg<10) archetype='Role Player';
    else archetype='Two-Way Guard';
  } else if(isBig){
    if(blk>=1.5&&oreb>=2) archetype='Interior Anchor';
    else if(ppg>=14&&rpg>=7) archetype='Dominant Big';
    else if(tp>=1.5&&fg>=45) archetype='Stretch Big';
    else if(dreb>=5&&oreb>=2) archetype='Rebounding Specialist';
    else if(ppg>=12) archetype='Scoring Big';
    else archetype='Developmental Big';
  } else { // SF
    if(ppg>=14&&rpg>=5&&apg>=2) archetype='Versatile Wing';
    else if(tp>=1.5&&ppg>=10) archetype='3-and-D Wing';
    else if(ppg>=16) archetype='Wing Scorer';
    else archetype='Role Wing';
  }

  // Strengths
  const strengths=[];
  if(ppg>=15) strengths.push('Elite scorer');
  else if(ppg>=10) strengths.push('Reliable scorer');
  if(fg>=50) strengths.push('Efficient shooter');
  if(tp>=38) strengths.push('Three-point threat');
  if(ft>=80) strengths.push('Free throw specialist');
  if(apg>=4) strengths.push('Playmaker');
  if(rpg>=7) strengths.push('Elite rebounder');
  else if(rpg>=5) strengths.push('Strong rebounder');
  if(stl>=1.5) strengths.push('Perimeter disruptor');
  if(blk>=1.5) strengths.push('Rim protector');
  if(oreb>=2) strengths.push('Second chance creator');

  // Weaknesses
  const weaknesses=[];
  if(fg<40&&(parseFloat(p.fga)||0)>4) weaknesses.push('Shooting efficiency concerns');
  if(tp<32&&(parseFloat(p.tpa)||0)>3) weaknesses.push('Below-average from three');
  if(ft<65) weaknesses.push('Foul line liability');
  if(tovs>2.5) weaknesses.push('Turnover prone');
  if(apg<1&&isGuard) weaknesses.push('Limited playmaking');
  if(rpg<3&&isBig) weaknesses.push('Below-average rebounding for position');
  if(blk<0.5&&isBig) weaknesses.push('Limited shot-blocking');
  if(mpg<18) weaknesses.push('Limited role / development player');

  // Style tags
  const tags=[];
  if(tp>=(parseFloat(p.fga)||1)*0.35) tags.push({t:'High-Volume 3PA',c:'neu'});
  if(fg>=50) tags.push({t:'Efficient',c:'pos'});
  if((parseFloat(p.fta)||0)/(parseFloat(p.fga)||1)>0.4) tags.push({t:'Gets to the Line',c:'pos'});
  if(tovs>3) tags.push({t:'Ball Security Risk',c:'neg'});
  if(stl+blk>2.5) tags.push({t:'Defensive Impact',c:'pos'});
  if(oreb>2) tags.push({t:'Offensive Glass',c:'pos'});
  if(tp>=38) tags.push({t:'Shooting Threat',c:'pos'});
  if(apg>3) tags.push({t:'Playmaker',c:'pos'});
  if(apg>4&&tovs<2) tags.push({t:'Low-Turnover PG',c:'pos'});

  // Projection context
  let projNote='';
  if(proj){
    if(proj._frosh) projNote=`Freshman projection based on ${pos} position baseline, ${p.height||'—'} height, and TDC grade ${grade}. High variance expected.`;
    else if(proj._origin) projNote=`Transfer from ${proj._origin} — stats translated using conference tier matrix (×${r1(proj._factor||1)}). ${(proj._factor||1)<1?'Conference difficulty increase may reduce production.':'Conference step-down may inflate production.'}`;
    else{
      const yr=(p.yr||'').toLowerCase();
      if(yr.includes('fr.')||yr.includes('so.')) projNote='Sophomore/Junior leap projected — typically the largest year-over-year improvement window.';
      else if(yr.includes('jr.')) projNote='Junior-to-senior projection — peak years, modest improvement expected.';
      else projNote='Returning veteran — projection based on role continuity.';
    }
  }

  return {archetype, archetypeDesc, strengths, weaknesses, tags, projNote};
}

// ── PERCENTILE HELPERS ──────────────────────────────────
function r1(v){return v!=null?Math.round(v*10)/10:null;}
function fmt(v){return v!=null&&v!==''?Number(v).toFixed(1):'—';}
function fmtP(v){return v!=null&&v!==''?Number(v).toFixed(1)+'%':'—';}
function pctCol(p){return p>=80?'#1a8c3a':p>=60?'#4a9a4a':p>=40?'#b8860b':p>=20?'#cc5500':'#cc2200';}
function gradeClass(g){const n=parseFloat(g);if(!isNaN(n)){if(n>=90)return 'gA';if(n>=80)return 'gB';if(n>=70)return 'gC';if(n>=60)return 'gD';return 'gF';}if(!g)return '';if(g[0]==='A')return 'gA';if(g[0]==='B')return 'gB';if(g[0]==='C')return 'gC';if(g[0]==='D')return 'gD';return 'gF';}

let player=null, teamData=null, allPlayers=[], gPct={}, proj=null;

async function init(){
  const s=JSON.parse(localStorage.getItem('tdc_session')||'null');
  const params=new URLSearchParams(location.search);
  const pid=params.get('id'), pname=params.get('name'), pteam=params.get('team');
  if(!pid&&!pname){document.getElementById('heroSection').innerHTML='<div style="padding:80px;text-align:center;color:var(--text3);">No player specified. <a href="roster.html" style="color:var(--accent);">Browse players →</a></div>';return;}
  try{
    if(s?.access_token) updateNav(s);
    const url=pid?`${SB}/rest/v1/players?id=eq.${pid}&select=*&limit=1`:`${SB}/rest/v1/players?name=eq.${encodeURIComponent(pname)}&team=eq.${encodeURIComponent(pteam)}&select=*&limit=1`;
    const [pr,apr]=await Promise.all([
      fetch(url,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/players?select=ppg,rpg,apg,mpg,fg_pct,tp_pct,ft_pct,stl,blk,tovs&ppg=not.is.null&limit=5000`,{headers:H}).then(r=>r.json()),
    ]);
    if(!pr.length) throw new Error('Player not found');
    player=pr[0]; allPlayers=apr;
    const tr=await fetch(`${SB}/rest/v1/teams?name=eq.${encodeURIComponent(player.team||'')}&select=*&limit=1`,{headers:H});
    const teams=await tr.json(); teamData=teams[0]||{};
    calcPct();
    proj=projectPlayer(player, teamData?.conf||'');
    renderPage();
  }catch(e){
    document.getElementById('heroSection').innerHTML=`<div style="padding:80px;text-align:center;"><div style="font-family:'Playfair Display',serif;font-weight:800;font-size:24px;margin-bottom:8px;">Player not found</div><a href="roster.html" style="color:var(--accent);">← Back to players</a></div>`;
  }
}

function calcPct(){
  ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs'].forEach(k=>{
    gPct[k]=allPlayers.map(p=>parseFloat(p[k])).filter(v=>!isNaN(v)&&v>0).sort((a,b)=>a-b);
  });
}

function getPct(val,key){
  const arr=gPct[key]; if(!arr?.length||val==null) return 0;
  const v=parseFloat(val); if(isNaN(v)||v===0) return 0;
  let lo=0,hi=arr.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<v)lo=mid+1;else hi=mid;}
  const p=Math.round(lo/arr.length*100);
  return key==='tovs'?100-p:p;
}

function buildStatNarrative(p){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const pos=p.position||'G'; const name=p.name.split(' ')[0];
  const yr=(p.yr||p.class_year||'');

  let parts=[];
  if(ppg>0) parts.push(`${name} averaged ${ppg.toFixed(1)} points, ${rpg.toFixed(1)} rebounds, and ${apg.toFixed(1)} assists per game in 2025-26.`);
  if(fg>0){
    const fgDesc=fg>=52?'highly efficient':fg>=46?'efficient':fg>=42?'average':'below-average';
    parts.push(`Shot ${fg.toFixed(1)}% from the field — ${fgDesc} for the position.`);
  }
  if(tp>0&&(parseFloat(p.tpa)||0)>2){
    const tpDesc=tp>=40?'elite':tp>=36?'solid':tp>=32?'adequate':'concerning';
    parts.push(`Connected at ${tp.toFixed(1)}% from three — ${tpDesc} efficiency on ${(parseFloat(p.tpa)||0).toFixed(1)} attempts.`);
  }
  if(stl+blk>1.5) parts.push(`Provides defensive value with ${stl.toFixed(1)} steals and ${blk.toFixed(1)} blocks per game.`);
  if(yr) parts.push(`As a ${yr} ${pos}, ${name} will be an important piece of the program going forward.`);

  return parts.join(' ')||'Insufficient stats for narrative.';
}

// ── RADAR CHART ─────────────────────────────────────────
function drawRadar(){
  const canvas=document.getElementById('radarChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=player;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textCol=isDark?'#a0a0a0':'#888';
  const gridCol=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const color=teamData?.color||'#8B6914';

  // 6 axes: Scoring, Shooting, Playmaking, Rebounding, Defense, Efficiency
  const axes=[
    {label:'Scoring', val:Math.min(100,getPct(p.ppg,'ppg'))},
    {label:'Shooting', val:Math.min(100,Math.round((getPct(p.fg_pct,'fg_pct')+getPct(p.tp_pct,'tp_pct'))/2))},
    {label:'Playmaking', val:Math.min(100,getPct(p.apg,'apg'))},
    {label:'Rebounding', val:Math.min(100,getPct(p.rpg,'rpg'))},
    {label:'Defense', val:Math.min(100,Math.round((getPct(p.stl,'stl')+getPct(p.blk,'blk'))/2))},
    {label:'Free Throws', val:Math.min(100,getPct(p.ft_pct,'ft_pct'))},
  ];


  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-40;
  const n=axes.length;

  // Draw grid rings
  for(let ring=1;ring<=5;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const angle=Math.PI*2*i/n-Math.PI/2;
      const x=cx+Math.cos(angle)*r*(ring/5);
      const y=cy+Math.sin(angle)*r*(ring/5);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  }

  // Draw axis lines and labels
  axes.forEach((ax,i)=>{
    const angle=Math.PI*2*i/n-Math.PI/2;
    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
    const lx=cx+Math.cos(angle)*(r+18), ly=cy+Math.sin(angle)*(r+18);
    ctx.fillStyle=textCol; ctx.font='bold 11px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ax.label,lx,ly);
  });

  function drawShape(axData, fillCol, strokeCol, alpha){
    ctx.beginPath();
    axData.forEach((ax,i)=>{
      const angle=Math.PI*2*i/n-Math.PI/2;
      const val=ax.val/100;
      const x=cx+Math.cos(angle)*r*val, y=cy+Math.sin(angle)*r*val;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle=fillCol; ctx.globalAlpha=alpha; ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=strokeCol; ctx.lineWidth=2; ctx.stroke();
  }

  // Draw actual
  drawShape(axes,color,color,0.15);
  // Always show projected overlay if available
  const showProjRadar = proj && !proj._frosh;
  if(showProjRadar){
    const projAxes=[
      {label:'Scoring', val:Math.min(100,getPct(proj.ppg,'ppg'))},
      {label:'Shooting', val:Math.min(100,Math.round((getPct(proj.fg_pct,'fg_pct')+getPct(proj.tp_pct,'tp_pct'))/2))},
      {label:'Playmaking', val:Math.min(100,getPct(proj.apg,'apg'))},
      {label:'Rebounding', val:Math.min(100,getPct(proj.rpg,'rpg'))},
      {label:'Defense', val:Math.min(100,Math.round((getPct(proj.stl,'stl')+getPct(proj.blk,'blk'))/2))},
      {label:'Free Throws', val:Math.min(100,getPct(proj.ft_pct,'ft_pct'))},
    ];
    drawShape(projAxes,'rgba(139,105,20,0.8)','#8B6914',0.12);
  }

  // Legend
  const legendEl=document.getElementById('radarLegend');
  if(legendEl){
    legendEl.innerHTML=`<div class="radar-legend-item"><div class="radar-legend-dot" style="background:${color};"></div>2025-26 Actual</div>${showProjRadar?`<div class="radar-legend-item"><div class="radar-legend-dot" style="background:var(--accent);opacity:.6;"></div>2026-27 Projected</div>`:''}`;
  }
}

function switchTab(t){
  ['overview','stats','percentiles','scout'].forEach(x=>{
    document.getElementById('tab-'+x)?.classList.toggle('active',x===t);
    document.getElementById('panel-'+x)?.classList.toggle('active',x===t);
  });
  if(t==='overview') setTimeout(drawRadar,50);
}

async function updateNav(s){
  try{
    const [p]=await fetch(`${SB}/rest/v1/profiles?id=eq.${s.user?.id}&select=username,avatar_url`,{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}}).then(r=>r.json());
    const uname=p?.username||'User';
    const av=p?.avatar_url?`<img src="${p.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);">`:`<div style="width:32px;height:32px;border-radius:50%;background:var(--bg2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);">${uname[0].toUpperCase()}</div>`;
    document.getElementById('navActions').innerHTML=`<button class="theme-toggle" onclick="toggleTheme()">${localStorage.getItem('tdc_theme')==='dark'?'☀️':'🌙'}</button><a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;">${av}<span style="font-size:13px;font-weight:700;color:var(--text);">${uname}</span></a>`;
  }catch(e){}
}

function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  const n=d?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('tdc_theme',n);
  setTimeout(drawRadar,50);
}
(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('tdc_theme')||'light');})();
init();
</script>
