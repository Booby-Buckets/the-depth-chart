  var hist=(typeof careerHistory!=='undefined'&&careerHistory.length)?careerHistory[careerHistory.length-1]:null;
  var adv=src._advanced||(projected&&hist&&hist._advanced)||{};
  var p40=src._per40||(projected&&hist&&hist._per40)||{};
  var pgs=src._pergame||(projected&&hist&&hist._pergame)||{};
  var f1=function(x){return (x==null||x==='')?'—':(+x).toFixed(1);};
  var f3=function(x){return (x==null||x==='')?'—':(+x).toFixed(3).replace(/^(-?)0\./,'$1.');};
  var fpc=function(x){return (x==null||x==='')?'—':(+x).toFixed(1)+'%';};      // already a percent
  var ffr=function(x){return (x==null||x==='')?'—':(+x*100).toFixed(1)+'%';};  // fraction -> %
  var metrics=[
    {l:'PPG',k:'ppg',   v:src.ppg,   f:fmt},
    {l:'RPG',k:'rpg',   v:src.rpg,   f:fmt},
    {l:'APG',k:'apg',   v:src.apg,   f:fmt},
    {l:'MPG',k:'mpg',   v:src.mpg,   f:fmt},
    {l:'FG%',k:'fg_pct',v:src.fg_pct,f:fmtP},
    {l:'3P%',k:'tp_pct',v:src.tp_pct,f:fmtP},
    {l:'FT%',k:'ft_pct',v:src.ft_pct,f:fmtP},
    {l:'eFG%',k:'efg_pct',v:pgs.efg_pct,f:ffr},
    {l:'TS%', k:'ts_pct', v:adv.ts_pct, f:ffr},
    {l:'USG%',k:'usg_pct',v:adv.usg_pct,f:fpc},
    {l:'TI/40', k:'ti40', v:adv.ti40, f:f1},
    {l:'TI/100',k:'ti100',v:adv.ti100,f:f1},
    {l:'AST%',k:'ast_pct',v:adv.ast_pct,f:fpc},
    {l:'TRB%',k:'trb_pct',v:adv.trb_pct,f:fpc},
    {l:'ORB%',k:'orb_pct',v:adv.orb_pct,f:fpc},
    {l:'DRB%',k:'drb_pct',v:adv.drb_pct,f:fpc},
    {l:'STL%',k:'stl_pct',v:adv.stl_pct,f:fpc},
    {l:'BLK%',k:'blk_pct',v:adv.blk_pct,f:fpc},
    {l:'TOV%',k:'tov_pct',v:adv.tov_pct,f:fpc},
    {l:'STL',k:'stl',   v:src.stl,   f:fmt},
    {l:'BLK',k:'blk',   v:src.blk,   f:fmt},
    {l:'OREB',k:'oreb', v:src.oreb,  f:fmt},
    {l:'DREB',k:'dreb', v:src.dreb,  f:fmt},
    {l:'TO',  k:'tovs', v:src.tovs,  f:fmt},
    {l:'PTS/40',k:'pts40',v:p40.pts_per_min,f:f1},
    {l:'REB/40',k:'reb40',v:p40.trb_per_min,f:f1},
    {l:'AST/40',k:'ast40',v:p40.ast_per_min,f:f1},
    {l:'STL/40',k:'stl40',v:p40.stl_per_min,f:f1},
    {l:'BLK/40',k:'blk40',v:p40.blk_per_min,f:f1},
    {l:'TO/40', k:'tov40',v:p40.tov_per_min,f:f1},
  ];
  var rows=metrics.map(function(m){
    var display=m.f(m.v);
    if(display==='--'||display==='—')return '';
    var pct=getPctNat(m.v,m.k);   // vs every player in the database
    var col=tierCol(pct);
    return '<div class="skill-bar-row">'
      +'<div class="skill-bar-label">'+m.l+'</div>'
      +'<div class="skill-bar-track"><div class="skill-bar-fill" style="width:'+pct+'%;background:'+col+';"></div></div>'
      +'<div class="skill-bar-val" style="color:var(--text);">'+display+'</div>'
      +'<div class="skill-bar-pct" style="color:'+col+';">'+_ord(pct)+'</div>'
      +'</div>';
  }).filter(Boolean);
  var half=Math.ceil(rows.length/2);
  return '<div class="skill-section-title">Skill Breakdown \u2014 '+(projected?'Projected ':(label?label+' ':''))+'vs Every Player (National)</div>'
    +'<div class="skill-grid"><div>'+rows.slice(0,half).join('')+'</div>'
    +'<div>'+rows.slice(half).join('')+'</div></div>';
}


// ── PERCENTILE HELPERS ──────────────────────────────────
function r1(v){return v!=null?Math.round(v*10)/10:null;}
function fmt(v){return v!=null&&v!==''?Number(v).toFixed(1):'—';}
function fmtP(v){return v!=null&&v!==''?Number(v).toFixed(1)+'%':'—';}
function pctCol(p){var m=p>=80?88:p>=60?68:p>=40?52:p>=20?38:0;return m?('color-mix(in srgb, var(--tc) '+m+'%, var(--text2))'):'var(--text3)';}
function gradeClass(g){const n=parseFloat(g);if(!isNaN(n)){if(n>=90)return 'gA';if(n>=80)return 'gB';if(n>=70)return 'gC';if(n>=60)return 'gD';return 'gF';}if(!g)return '';if(g[0]==='A')return 'gA';if(g[0]==='B')return 'gB';if(g[0]==='C')return 'gC';if(g[0]==='D')return 'gD';return 'gF';}

let player=null, teamData=null, allPlayers=[], gPct={}, proj=null, teamPlayers=[], careerHistory=[];

// Build a player from box scores when they have no season-stat row (so every
// player who ever played a game is viewable). Aggregates per-season averages;
// no tdc_grade (box scores don't carry one), so the grade/progression is omitted.
async function buildFromBoxScores(espn, name, season){
  try{
    const bx=await fetch(`${SB}/rest/v1/box_scores?espn_id=eq.${espn}&select=*&order=date.asc&limit=400`,{headers:H}).then(r=>r.json());
    if(!Array.isArray(bx)||!bx.length) return null;
    const S={};
    bx.forEach(b=>{ const k=b.season_year; const s=S[k]||(S[k]={team:b.team,g:new Set(),sum:{}}); s.team=b.team; s.g.add(b.game_id);
      ['min','pts','reb','oreb','dreb','ast','stl','blk','tov','pf','fgm','fga','tpm','tpa','ftm','fta'].forEach(x=>{s.sum[x]=(s.sum[x]||0)+(b[x]||0);}); });
    const rows=Object.keys(S).sort().map(yr=>{ const s=S[yr],g=s.g.size||1, pg=x=>Math.round(s.sum[x]/g*10)/10, pct=(m,a)=>s.sum[a]?Math.round(1000*s.sum[m]/s.sum[a])/10:null;
      return {name:name||bx[0].player, team:s.team, season_year:+yr, gp:g, mpg:pg('min'), ppg:pg('pts'), rpg:pg('reb'),
        oreb:pg('oreb'), dreb:pg('dreb'), apg:pg('ast'), stl:pg('stl'), blk:pg('blk'), tovs:pg('tov'),
        fg_pct:pct('fgm','fga'), tp_pct:pct('tpm','tpa'), ft_pct:pct('ftm','fta'), espn_id:+espn}; });
    window._boxCareer=rows;
    return (season&&rows.find(r=>String(r.season_year)===String(season)))||rows[rows.length-1];
  }catch(e){ return null; }
}

// Flatten a bbref_seasons row into the flat shape the page uses (ppg/rpg/…),
// converting BBRef ".532" rate strings to 53.2, and keep the raw per-game /
// per-40 / advanced dicts attached for the Full Stats + Rankings tabs.
function _bn(v){ const n=parseFloat(v); return isNaN(n)?null:n; }
function _bp(v){ const n=parseFloat(v); return isNaN(n)?null:Math.round(n*1000)/10; } // ".532" -> 53.2
function _winsAdded(adv){ // OWNED: TI value above replacement over the season, on the wins scale
  const ti=parseFloat((adv||{}).ti40), mp=parseFloat((adv||{}).mp);
  if(isNaN(ti)||isNaN(mp)) return null;
  return Math.round(((ti-5.0)*(mp/40)/69.87)*10)/10;   // REPL=5.0, PPW=69.87 (build_wins_added.py)
}
function bbrefToFlat(rows){
  return (rows||[]).map(r=>{
    const pg=r.pergame||{}, p4=r.per40||{}, adv={...(r.advanced||{})};
    adv.wa=_winsAdded(adv);
    return {
      season_year:r.season_year, team:r.school, school:r.school, school_slug:r.school_slug,
      position:r.pos, height:r.height, weight:r.weight, hometown:r.hometown,
      class_year:r.class, yr:r.class, tdc_grade:r.tdc_grade, espn_id:r.espn_id, name:r.player,
      gp:_bn(pg.games), gs:_bn(pg.games_started),
      ppg:_bn(pg.pts_per_g), rpg:_bn(pg.trb_per_g), apg:_bn(pg.ast_per_g), mpg:_bn(pg.mp_per_g),
      stl:_bn(pg.stl_per_g), blk:_bn(pg.blk_per_g), tovs:_bn(pg.tov_per_g), pf:_bn(pg.pf_per_g),
      fgm:_bn(pg.fg_per_g), fga:_bn(pg.fga_per_g), fg_pct:_bp(pg.fg_pct),
      tpm:_bn(pg.fg3_per_g), tpa:_bn(pg.fg3a_per_g), tp_pct:_bp(pg.fg3_pct),
      ftm:_bn(pg.ft_per_g), fta:_bn(pg.fta_per_g), ft_pct:_bp(pg.ft_pct),
      oreb:_bn(pg.orb_per_g), dreb:_bn(pg.drb_per_g), wa:adv.wa,
      _pergame:pg, _per40:p4, _advanced:adv, _pillars:r.grade_pillars||null,
    };
  });
}

// Neutralize corrupt rows: a per-game stat physically impossible for the
// player's minutes (e.g. Sin'Cere Jones — 6.4 APG at 0.3 MPG) is capped to the
// most it could plausibly be. Only sub-8-MPG samples are touched and the
// per-minute ceilings sit far above any real player, so legit stats never move.
const TDC_STAT_CAPS={ppg:1.4,rpg:0.75,apg:0.6,stl:0.28,blk:0.30,tovs:0.45,oreb:0.45,dreb:0.55};
function tdcSane(p){
  const mpg=parseFloat(p&&p.mpg)||0;
  if(mpg<=0||mpg>=8) return p;
  let out=null;
  for(const k in TDC_STAT_CAPS){
    const v=parseFloat(p[k]);
    if(!isNaN(v) && v > mpg*TDC_STAT_CAPS[k]){
      if(!out) out=Object.assign({},p);
      out[k]=Math.round(mpg*TDC_STAT_CAPS[k]*10)/10;
    }
  }
  return out||p;
}

async function init(){
  const s=JSON.parse(localStorage.getItem('tdc_session')||'null');
  const params=new URLSearchParams(location.search);
  const pid=params.get('id'), pname=params.get('name'), pteam=params.get('team'), pseason=params.get('season'), pespn=params.get('espn');
  if(!pid&&!pname&&!pespn){document.getElementById('heroSection').innerHTML='<div style="padding:80px;text-align:center;color:var(--text3);">No player specified. <a href="roster.html" style="color:var(--accent);">Browse players →</a></div>';return;}
  try{
    if(s?.access_token) updateNav(s);
    // PostgREST eq. filter — special chars like + * Jr. need to be handled
    // Use the player id if available, otherwise fetch by name with proper encoding
    // Strip any URL-unsafe chars that PostgREST can't handle in eq. comparisons
    function sbEncode(str){ return encodeURIComponent(str); }
    let url;
    if(pid){
      url=`${SB}/rest/v1/players?id=eq.${pid}&select=*&limit=1`;
    } else if(pespn){
      url=`${SB}/rest/v1/players?espn_id=eq.${pespn}&select=*&limit=1`;
    } else if(pteam){
      url=`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&team=eq.${sbEncode(pteam)}&select=*&limit=1`;
    } else {
      url=`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&select=*&limit=1`;
    }
    const [pr,_poolA]=await Promise.all([
      fetch(url,{headers:H}).then(r=>r.json()),
      (window.TDCPool?TDCPool.get():Promise.resolve([])),   // shared session-cached players pool
    ]);
    const apr=_poolA.filter(p=>p.ppg!=null);
    let playerRow=Array.isArray(pr)?pr[0]:null;
    if(pespn){
      // ESPN id is authoritative — NEVER fall back to a name match (which merges
      // different people who share a name). Roster -> player_history -> box scores.
      if(!playerRow){
        const hrows=bbrefToFlat(await TDCOwnedSeasons.byEspn(pespn, 'desc'));
        if(hrows.length){
          playerRow=(pseason&&hrows.find(r=>String(r.season_year)===String(pseason)))||hrows[0];
          window._historicalView=true;
        }
      }
      if(!playerRow){
        // box-score-only player (no season-stat row) — build a page from box scores
        playerRow=await buildFromBoxScores(pespn, pname, pseason);
        if(playerRow) window._historicalView=true;
      }
    } else {
      const _stripSuffix=s=>s.replace(/\s+(jr\.?|sr\.?|ii|iii|iv|v)$/i,'').trim();
      // Fallback 1: name-only if team match failed
      if(!playerRow&&pname&&pteam){
        const fb=await fetch(`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&select=*&limit=1`,{headers:H});
        const fbRows=await fb.json();
        playerRow=Array.isArray(fbRows)?fbRows[0]:null;
      }
      // Fallback 2: client-side EXACT name match (handles special chars / suffixes)
      if(!playerRow&&pname){
        const teamParam=pteam?`&team=eq.${sbEncode(pteam)}`:'';
        const fb2=await fetch(`${SB}/rest/v1/players?select=*${teamParam}&limit=500`,{headers:H});
        const fb2Rows=await fb2.json();
        if(Array.isArray(fb2Rows)){
          const nl=pname.toLowerCase().trim(), nls=_stripSuffix(nl);
          playerRow=fb2Rows.find(r=>r.name&&r.name.toLowerCase().trim()===nl)
                 || fb2Rows.find(r=>r.name&&_stripSuffix(r.name.toLowerCase().trim())===nls);
        }
      }
      // Fallback 3: historical-only player by name (any ranked player is viewable)
      if(!playerRow&&pname){
        let hrows=await fetch(`${SB}/rest/v1/player_history?name=eq.${sbEncode(pname)}&select=*&order=season_year.desc&limit=40`,{headers:H}).then(r=>r.json()).catch(()=>[]);
        if(Array.isArray(hrows)&&hrows.length){
          let row=null;
          if(pseason) row=hrows.find(r=>String(r.season_year)===String(pseason)&&(!pteam||r.team===pteam))||hrows.find(r=>String(r.season_year)===String(pseason));
          if(!row&&pteam) row=hrows.find(r=>r.team===pteam);
          playerRow=row||hrows[0];
          window._historicalView=true;
        }
      }
      // Fallback 4: bbref-only player (no espn_id, absent from player_history) —
      // e.g. Trey Wertz, who exists solely in bbref_seasons. Resolve by full name.
      if(!playerRow&&pname){
        const brows=bbrefToFlat(await TDCOwnedSeasons.byName(pname, 'desc'));
        if(brows.length){
          const tl=(pteam||'').toLowerCase().trim();
          let idx=-1;
          if(pseason) idx=brows.findIndex(r=>String(r.season_year)===String(pseason)&&(!tl||(r.school||'').toLowerCase().trim()===tl));
          if(idx<0&&pseason) idx=brows.findIndex(r=>String(r.season_year)===String(pseason));
          if(idx<0&&tl) idx=brows.findIndex(r=>(r.school||'').toLowerCase().trim()===tl);
          if(idx<0) idx=0;
          playerRow=brows[idx];
          // Remember the bbref_id so career history loads this exact person's
          // seasons (stable per-player key) instead of a namesake collision.
          window._bbrefId=(rawArr[idx]&&rawArr[idx].bbref_id)||null;
          window._historicalView=true;
        }
      }
    }
    if(!playerRow) throw new Error('Player not found — check name spelling or try searching from the roster page.');
    player=tdcSane(playerRow); allPlayers=(Array.isArray(apr)?apr:[]).map(tdcSane);

    // Team fetch — use client-side match to handle special chars in team names
    let teamConf='', teamConfFull='';
    try{
      const tr=await fetch(`${SB}/rest/v1/teams?select=*&limit=500`,{headers:H});
      const allTeams=await tr.json();
      if(Array.isArray(allTeams)){
        const tnameLower=(player.team||'').toLowerCase().trim();
        teamData=allTeams.find(t=>(t.name||'').toLowerCase().trim()===tnameLower)||{};
        teamConf=teamData?.conf||teamData?.conference||'';
        window._tdcTeamMap={}; allTeams.forEach(t=>{window._tdcTeamMap[t.name]=t;});
      }
    } catch(e2){ teamData={}; }

    calcPct();

    // ── FETCH CAREER HISTORY ─────────────────────────────────────
    // Do this FIRST — projection depends on it
    // Career history is keyed by ESPN id (from box scores), NOT name, so we never
    // merge different people who share a name (e.g. several "Cameron Williams").
    // No id — e.g. a true freshman with no college games — means no prior history,
    // which is correct. Fall back to name only when the player genuinely has no id.
    let _espnId = pespn || (playerRow && playerRow.espn_id) || null;
    // Resyncs can drop players.espn_id — recover it from player_history when
    // the name maps to exactly ONE id (same-team match breaks ties). Namesakes
    // with different ids stay ambiguous and are skipped, never merged.
    if(!_espnId && playerRow && playerRow.name){
      try{
        const nh=await fetch(`${SB}/rest/v1/player_history?name=eq.${sbEncode(playerRow.name)}&select=espn_id,team&limit=60`,{headers:H}).then(r=>r.ok?r.json():[]);
        const ids=[...new Set((nh||[]).map(r=>r.espn_id).filter(x=>x!=null))];
        if(ids.length===1) _espnId=ids[0];
        else if(ids.length>1 && playerRow.team){
          const tids=[...new Set((nh||[]).filter(r=>r.team===playerRow.team).map(r=>r.espn_id).filter(x=>x!=null))];
          if(tids.length===1) _espnId=tids[0];
        }
      }catch(e){}
    }
    window._playerEspn = _espnId;
    try{
      if(_espnId){
        // OWNED career: player_advanced + player_history (bbref-shaped) → bbrefToFlat unchanged.
        careerHistory = bbrefToFlat(await TDCOwnedSeasons.byEspn(_espnId, 'asc'));
      }
      // no ESPN id (e.g. true freshman) → no prior college history; leave empty
      // rather than risk merging a different person who shares the name.
    }catch(e){ console.warn('Career history fetch failed:',e); careerHistory=[]; }
    // box-score-only player: no season-stat rows, use the per-season aggregates
    if(!careerHistory.length && window._boxCareer && window._boxCareer.length) careerHistory = window._boxCareer;

    // Career-by-name fallback: a current-roster player (e.g. a returning pro like
    // RJ Luis) can have players.espn_id null and no player_history, so the id path
    // finds nothing even though bbref has their whole career. Recover it by name —
    // but only if every matched row shares ONE identity, so we never merge namesakes.
    if(!careerHistory.length && player && player.name){
      try{
        const rows=await TDCOwnedSeasons.byName(player.name, 'asc');
        const ids=[...new Set(rows.map(r=>r.espn_id).filter(x=>x!=null))];
        if(rows.length && ids.length===1){
          careerHistory = bbrefToFlat(rows);
          if(!_espnId && rows[0].espn_id){ _espnId=rows[0].espn_id; window._playerEspn=_espnId; }
        }
      }catch(e){}
    }

    // (Historical hometown came from bbref_seasons — removed with the SR migration.
    // Current-roster hometown still comes from the players table via player.hometown.)

    // ── BUILD _careerHistoryMap for projectPlayer ─────────────────
    window._careerHistoryMap = {};
    if(careerHistory.length){
      const key = (player.name||'').toLowerCase().trim();
      window._careerHistoryMap[key] = careerHistory;
    }

    // ── FETCH TEAM ROSTER (for MPG context) ──────────────────────
    try{
      const teamParam = player.team ? `&team=eq.${sbEncode(player.team)}` : '';
      const rr = await fetch(`${SB}/rest/v1/players?select=*&order=depth_order.asc&limit=500${teamParam}`,{headers:H});
      const allRows = await rr.json();
      teamPlayers = Array.isArray(allRows) ? allRows.filter(r=>r.name&&r.name!=='—') : [];
    }catch(e){ teamPlayers=[]; }

    // ROBUSTNESS: the projection engine zeroes players flagged out for the season
    // (is_injured, or the sheet convention hometown="Injured"/"Out") — correct for TEAM
    // ratings, but on a player's OWN page it produces a useless all-zero line and also makes
    // the engine mis-read "Injured" as a transfer origin. So on this page treat HIM as healthy
    // (project his ability); flag it so the UI can note it. Team/rankings pages are unaffected.
    const _statusOut = s => { const h=((s||'')+'').trim().toLowerCase(); return h==='injured'||h==='out'; };
    if(player && (_statusOut(player.hometown) || player.is_injured===true)){
      player._injuredFlag = true;
      if(_statusOut(player.hometown)) player.hometown='';
      player.is_injured=false;
      const _pk=(player.name||'').toLowerCase().trim();
      teamPlayers.forEach(p=>{ const isMe=(player.espn_id!=null&&String(p.espn_id)===String(player.espn_id))||(p.name||'').toLowerCase().trim()===_pk;
        if(isMe){ if(_statusOut(p.hometown)) p.hometown=''; p.is_injured=false; } });
    }

    // Projection model v5: the OVR comes from the whole-roster rotation model (same call as
    // the team page), so the player page, depth chart and rankings show an IDENTICAL grade.
    try{
      if(window.TDCFresh && TDCFresh.load){ try{ await TDCFresh.load(); }catch(e){} }
      if(window.TDCProjGrade && TDCProjGrade.gradeRoster && teamPlayers.length){
        await TDCProjGrade.ready;
        const _fp = p => (window.TDCFresh&&TDCFresh.profileFor)?TDCFresh.profileFor({team:p.team,name:p.name}):null;
        const rr2 = teamPlayers.map(p=>{ const f=_fp(p); const g=(f&&f.ovr!=null)?Math.round(parseFloat(f.ovr)):parseFloat(p.tdc_grade);
                                         return Object.assign({},p,{tdc_grade:g}); });
        const gres = TDCProjGrade.gradeRoster(rr2);
        teamPlayers.forEach((p,i)=>{ if(!gres[i])return; const f=_fp(p);
          p._projMin=gres[i].min;
          // Statistical overall is authoritative for the OVR; gradeRoster now only
          // supplies projected MINUTES. Freshmen (not in the stat maps) keep the old grade.
          const _sg = TDCProjGrade.gradeSolo ? TDCProjGrade.gradeSolo(p) : null;
          p._projGrade = (_sg!=null && !isNaN(_sg)) ? _sg : ((f&&f.ovr!=null)?Math.round(parseFloat(f.ovr)):gres[i].grade); });
        const key=(player.name||'').toLowerCase().trim();
        const me = teamPlayers.find(p=>(p.name||'').toLowerCase().trim()===key);
        if(me){ player._projGrade=me._projGrade; player._projMin=me._projMin; }
        try{ _setHeroGrade(_projectedGrade()); }catch(e){}   // refresh hero once the stat overall is loaded
      }
    }catch(e){}

    // ── PROJECTION ─────────────────────────────────────────────────
    // Project the ENTIRE team using buildTeamProjections (same as team page).
    // This ensures normalization is applied identically and numbers match.
    proj = null;
    if(!window._historicalView) try{
      const conf = (teamData&&teamData.conf)||(player.team_conf)||'';

      // Build _careerHistoryMap for the full roster
      window._careerHistoryMap = {};
      if(careerHistory.length){
        window._careerHistoryMap[(player.name||'').toLowerCase().trim()] = careerHistory;
      }

      // Also fetch career history for teammates so team normalization is accurate
      if(teamPlayers.length > 1){
        try{
          const teammates = teamPlayers.filter(p=>p.name&&p.name!=='—'&&p.name!==player.name);
          const orParam = teammates.map(p=>`"${p.name}"`).join(',');
          const tr = await fetch(`${SB}/rest/v1/player_history?name=in.(${orParam})&select=*&order=season_year.asc&limit=500`,{headers:H});
          if(tr.ok){
            const td = await tr.json();
            if(Array.isArray(td)) td.forEach(row=>{
              const k=(row.name||'').toLowerCase().trim();
              if(!window._careerHistoryMap[k]) window._careerHistoryMap[k]=[];
              window._careerHistoryMap[k].push(row);
            });
          }
        }catch(e){ console.warn('Teammate history fetch failed:',e); }
      }

      // Prefetch OWNED advanced stats (computed from box_scores by derived_stats.py —
      // no Sports-Reference values) so the shared model's usage-vacancy logic can gate
      // on real USG%/TS%. Static map keyed by espn_id, same shape the engine expects.
      try{
        if(!window._advByEspn){
          window._advByEspn = await fetch('scripts/data/proj_advanced_2026.json?v=1').then(r=>r.ok?r.json():{}).catch(()=>({}));
        }
      }catch(e){}
      // Fold in the team's current coach tendencies (pace) — sets window._projCoach
      try{ if(typeof loadProjCoachStyle==='function') await loadProjCoachStyle(player.team); }catch(e){}
      // Project full team — includes normalization cap
      // Then find this player in the result
      const _rawAllProj = buildTeamProjections(teamPlayers, conf);
  const allProj = applyPredictionWalls(_rawAllProj);
      const playerLower = (player.name||'').toLowerCase().trim();
      const match = allProj.find(pp =>
        (pp.name||'').toLowerCase().trim() === playerLower
      );

      if(match){
        proj = match;
      } else {
        // Player not found in team projections (name mismatch) — project standalone
        console.warn('Player not found in team projections, using standalone');
        // Build careerHistoryMap for just this player and project alone
        const singleTeam = [player];
        const singleProj = buildTeamProjections(singleTeam, conf);
        proj = singleProj[0] || null;
      }
      // RECONCILE the projection with the GRADE: the OVR is computed from the statistical-
      // overall projected line (stat_overall_projected.json). Display THAT same line so the
      // shown stats and the grade come from one source (no more 21ppg-shown-but-graded-at-18).
      try{
        const _spk = (window.TDCProjGrade && TDCProjGrade.projRowOf && player && player.espn_id!=null)
          ? TDCProjGrade.projRowOf(player.espn_id) : null;
        if(_spk && _spk.ppg!=null){
          proj = Object.assign({}, proj||{}, {_reconciled:true});
          ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs','oreb','dreb',
           'fgm','fga','tpm','tpa','ftm','fta'].forEach(k=>{ if(_spk[k]!=null) proj[k]=_spk[k]; });
        }
      }catch(e){}
      // ROBUSTNESS: the team minutes model can zero a PROVEN player who's buried in a noisy
      // depth chart (transfers often default to depth_order 14+, so they project 0 minutes on
      // a stacked new team) — an all-zero line is useless on his OWN page. Fallback: carry his
      // DEMONSTRATED line forward at ~his usual minutes (top-level stats, so a sparse row with
      // null oreb/dreb/fga doesn't break it, and no team-usage over/under-shoot). Team/rankings
      // pages keep the honest depth-chart order.
      if((!proj || !(parseFloat(proj.mpg)>2)) && parseFloat(player.mpg)>8 && parseFloat(player.ppg)>0){
        const _dm=parseFloat(player.mpg)||1, _pm=Math.min(_dm*0.95, 32), _sc=_pm/_dm;   // ~usual minutes, capped
        const _F=k=>{ const v=parseFloat(player[k]); return isFinite(v)?Math.round(v*_sc*10)/10:null; };
        proj=Object.assign({}, player, {
          mpg:Math.round(_pm*10)/10,
          ppg:_F('ppg'), rpg:_F('rpg'), apg:_F('apg'), oreb:_F('oreb'), dreb:_F('dreb'),
          stl:_F('stl'), blk:_F('blk'), tovs:_F('tovs'),
          fgm:_F('fgm'), fga:_F('fga'), tpm:_F('tpm'), tpa:_F('tpa'), ftm:_F('ftm'), fta:_F('fta'),
          fg_pct:player.fg_pct, tp_pct:player.tp_pct, ft_pct:player.ft_pct, _proj:true, _carryFwd:true
        });
        player._carryFwd=true;
      }
    }catch(projErr){
      console.warn('Projection failed:',projErr);
      proj = null;
    }

    // Owner's custom freshman projection (from Supabase) overrides the model line
    try{ if(window.TDCFresh){ await TDCFresh.load(); _applyFreshProfile(); } }catch(e){}

    // Projected RPG is derived from oreb+dreb, which the roster SHEET line lacks →
    // it can come out 0 (e.g. Davis Fogle). Backfill from his REAL rebounds, scaled
    // to projected minutes, so a rebounder never projects to 0 boards.
    try{
      if(proj && !proj._frosh && !(parseFloat(proj.rpg)>0)){
        const real=(typeof _ovrSeasons==='function' && _ovrSeasons()[0]) ? _ovrSeasons()[0] : null;
        if(real && parseFloat(real.rpg)>0){
          const rm=parseFloat(real.mpg)||1, pm=parseFloat(proj.mpg)||rm, sc=pm/rm, R1=v=>Math.round((parseFloat(v)||0)*sc*10)/10;
          proj.rpg=R1(real.rpg);
          if(!(parseFloat(proj.oreb)>0)) proj.oreb=R1(real.oreb);
          if(!(parseFloat(proj.dreb)>0)) proj.dreb=R1(real.dreb);
        }
      }
    }catch(e){}

    renderPage();
    loadDraftSticker();
  }catch(e){
    console.error('Player load error:',e);
    document.getElementById('heroSection').innerHTML=`<div style="padding:80px;text-align:center;"><div style="font-family:'Playfair Display',serif;font-weight:800;font-size:24px;margin-bottom:8px;">Player not found</div><p style="color:var(--text3);margin-bottom:16px;">${e.message}</p><a href="roster.html" style="color:var(--accent);">← Back to players</a></div>`;
  }
}

function calcPct(){
  ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs'].forEach(k=>{
    gPct[k]=allPlayers.map(p=>parseFloat(p[k])).filter(v=>!isNaN(v)&&v>0).sort((a,b)=>a-b);
  });
}

function getPct(val,key){
  const arr=gPct[key]; if(!arr?.length||val==null) return 0;
  const v=parseFloat(val); if(isNaN(v)||v===0) return 0;
  let lo=0,hi=arr.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<v)lo=mid+1;else hi=mid;}
  const p=Math.round(lo/arr.length*100);
  return p; // TOV: higher raw rank shown directly — consistent with national comparison
}

function _pillarScore(p){
  if(!p||typeof p!=='object') return null;

  return any?s:null;
}

  return null; }

function _bandPctile(band,s){
  var q=band[3], n=q.length-1;

  function card(val, label, accent, diff, invert, lb){
    const col = accent ? 'color:var(--tcr,var(--accent));' : '';   // projected stats in the team color, not generic accent
    let cls = 'eq';
    if(diff != null){
      if(invert) cls = diff < -0.05 ? 'up' : diff > 0.05 ? 'dn' : 'eq';
      else cls = diff > 0.05 ? 'up' : diff < -0.05 ? 'dn' : 'eq';
    }
    const diffHtml = diff != null ? '<div class="stat-card-diff '+cls+'">'+(diff>0.05?'+':'')+diff+'</div>' : '';
    const clk = lb ? ' style="cursor:pointer" onclick="window.TDC_LEADERBOARD&&TDC_LEADERBOARD.open(\''+lb+'\')" title="'+label+' — see the top 50"' : '';
    return '<div class="stat-card"'+clk+'><div class="stat-card-val" style="'+col+'">'+val+'</div><div class="stat-card-label">'+label+'</div>'+diffHtml+'</div>';
  }

  function cards(src, accent, compare){
    return STATS.map(s=>{
      const v = s.pct ? fmtP(src[s.k]) : fmt(src[s.k]);
      let diff = null;

        const d = r1((parseFloat(src[s.k])||0)-(parseFloat(compare[s.k])||0));

         '</div>'].join('');
    return [
      '<div class="ov-split" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">',
      '<div>',
      '<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border2);">2025-26 Actual</div>',

  var lbl=document.getElementById('ovcCompLbl');
  var isProj=(val==='proj')||(x&&x.projected);
  if(lbl) lbl.textContent=isProj?'':(val&&/^\d{4}$/.test(''+val)?_seasonLbl2(val):'');
  var key=isProj?'proj':(val==null?'cur':val);
  window._ovcCompCache=window._ovcCompCache||{};
  if(window._ovcCompCache[key]){ window._ovcComps=window._ovcCompCache[key]; fillOvcComps(); return; }
  if(!(typeof _allHistory!=='undefined' && _allHistory && _allHistory.length)) return;  // pool not fetched yet
  var line=isProj?playerProjLine():((x&&x.src)||player);
  var tn=(x&&x.src&&x.src.team)||player.team;
  var c=_ovcCompsFor(line,tn);
  if(c && !c.length) c=_ovcCompsFor(line,tn,true);      // last resort: ignore position
  if(c && c.length){ window._ovcCompCache[key]=c; window._ovcComps=c; fillOvcComps(); }
}
function fillOvcComps(){
  var el=document.getElementById('ovcComps'); if(!el) return;
  var c=window._ovcComps; if(c===undefined) return;      // not computed yet
  if(!c.length){ el.innerHTML='<div class="ovc-muted">No close historical comps.</div>'; return; }
  el.innerHTML=c.slice(0,3).map(function(x){
    var ini=(x.name||'').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    return '<div class="ovc-cp"><div class="cav">'+ini+'</div><div><div class="cn">'+x.name+'</div><div class="cs">'+(x.team||'')+' · '+_seasonLbl2(x.season)+'</div></div><div class="cm">'+x.m+'%</div></div>';
  }).join('');
}
function loadOvcCompsNow(retry){
  var el=document.getElementById('ovcComps');
  if(window._ovcComps&&window._ovcComps.length){ fillOvcComps(); return; }
  if(el) el.innerHTML='<div class="ovc-muted">Finding similar players…</div>';
  if(typeof renderArchetype!=='function'){ if(el) el.innerHTML='<div class="ovc-muted">Comps unavailable.</div>'; return; }
  // Backstop: renderArchetype awaits several things, and if any never settles the box
  // would sit on "Finding similar players" forever, as it did during the 22 Jul outage.
  var _settled=false;
  setTimeout(function(){
    if(_settled) return;
    var b=document.getElementById('ovcComps');
    if(b && /Finding similar/.test(b.innerText||'')){
      b.innerHTML='<div class="ovc-muted">Could not load the comparison pool. '+
        '<button class="ovc-complink" style="margin-left:6px;padding:3px 9px" '+
        'onclick="_archDone=false;_allHistory=null;window._ovcComps=undefined;window._ovcCompCache={};loadOvcCompsNow()">Retry</button></div>';
    }
  }, 50000);
  Promise.resolve(renderArchetype()).then(function(){
    _settled=true;
    // renderArchetype() scores the PROJECTED line; re-score for the selected season
    try{ var _sv=(document.getElementById('ovrSeasonSel')||{}).value;
         _ovcSyncComps(_sv,_skillSrcFor(_sv==='proj'?'proj':_sv)); }catch(e){}
    var got=(window._ovcComps||[]).length;
    // An empty comp pool almost always means the history fetch failed, not that
    // the player genuinely has no match — retry once before giving up.
    if(!got && !retry && !(_allHistory&&_allHistory.length)){
      _archDone=false; _allHistory=null; return loadOvcCompsNow(true);
    }
    if(!got && el){
      var poolOk=(typeof _allHistory!=='undefined' && _allHistory && _allHistory.length);
      el.innerHTML='<div class="ovc-muted">'+
        (poolOk?'No close historical comps.':'Could not load the comparison pool.')+
        ' <button class="ovc-complink" style="margin-left:6px;padding:3px 9px" onclick="_archDone=false;_allHistory=null;window._ovcComps=undefined;window._ovcCompCache={};loadOvcCompsNow()">Retry</button></div>';
    }
  }).catch(function(){
    _settled=true;
    if(el) el.innerHTML='<div class="ovc-muted">Comps unavailable. <button class="ovc-complink" style="margin-left:6px;padding:3px 9px" onclick="_archDone=false;_allHistory=null;window._ovcComps=undefined;window._ovcCompCache={};loadOvcCompsNow()">Retry</button></div>';
  });
}

// Arm the comps load. Idempotent, and deliberately triggered three ways.
// It used to be IntersectionObserver-only, set up once behind the _ovcAuxLoaded
// flag -- and the flag was set BEFORE the call, so the first renderOvcExtras (which
// can run before the overview markup exists) burned it on a null element and nothing
// was ever observed. Even once that's fixed, IO can silently never fire in embedded
// and webview contexts, so scroll and an idle timer back it up: this box is the whole
// point of the card and it should not depend on one API behaving.
function _ovcSetupCompsObserver(){
  var box=document.getElementById('ovcComps');
  if(!box) return false;
  if(window._ovcCompsArmed) return true;
  window._ovcCompsArmed=true;
  var fired=false;
  function go(){
    if(fired) return; fired=true;
    window.removeEventListener('scroll', go);
    try{ loadOvcCompsNow(); }catch(x){}
  }
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ obs.disconnect(); go(); } });
    },{rootMargin:'200px'});
    obs.observe(box);
  }
  window.addEventListener('scroll', go, {passive:true});
  setTimeout(go, 3000);
  return true;
}

      rev.forEach(function(x,i){ var v=+x.pts||0, bx=pad+(W-2*pad)*(i+0.5)/n, by=pad+(Hh-2*pad-6)*(1-v/mx)+6;
        sv+='<rect x="'+(bx-bw/2)+'" y="'+by+'" width="'+bw+'" height="'+((Hh-3)-by)+'" rx="1.5" fill="var(--accent)" opacity="'+(0.55+0.08*i)+'"/>'; });
      sv+='</svg>';
      var cells=[['PTS',r1(avg('pts'))],['REB',r1(avg('reb'))],['AST',r1(avg('ast'))],['MIN',r1(avg('min'))],
                 ['FG%',fgp==null?'—':r1(fgp)],['3P%',tpp==null?'—':r1(tpp)],['STL',r1(avg('stl'))],['TO',r1(avg('tov'))]];
      el.innerHTML='<div class="ovc-trend" style="margin-bottom:10px">'+sv+

  return ({PG:'PG',SG:'SG',CG:'SG',G:'SG',SF:'SF',GF:'SF',F:'PF',PF:'PF',FC:'C',C:'C'})[p]||'SF'; }

// Season-scoped grade ranks. Counts everyone graded strictly higher that year,
// then breaks ties inside the same integer grade with the pillar score, so the
// three 95s of 2018-19 land at #2/#3/#4 instead of all showing #2.
function _seasonRanks(year, g, posRaw, pillars, eN, eP, ePL){
  if(!year||isNaN(g)) return;
  var pos=(''+posRaw).trim().toUpperCase().charAt(0);   // bbref pos is coarse: G/F/C
  if('GFC'.indexOf(pos)<0) pos='';
  if(ePL) ePL.textContent=(pos||'Pos')+' Rank';
  var gi=Math.round(g), mine=_pillarScore(pillars);
  var qs='season_year=eq.'+year;
  function count(extra,cb){
    fetch(SB+'/rest/v1/player_history?'+qs+extra+'&select=espn_id&limit=1',
      {headers:Object.assign({},H,{Prefer:'count=exact'})}).then(function(r){
        var n=parseInt(((r.headers.get('content-range')||'').split('/')[1]||''),10);
        cb(isNaN(n)?null:n);
      }).catch(function(){ cb(null); });
  }
  // rows sharing this exact grade -> how many out-score us on pillars (tie-break).
  // player_history has a `position` column (coarse G/F/C), NOT `pos` — querying the missing
  // `pos` column errored the whole fetch, which is why the position rank was blank.
  fetch(SB+'/rest/v1/player_history?'+qs+'&tdc_grade=eq.'+gi+'&select=position,grade_pillars&limit=2000',
    {headers:H}).then(function(r){ return r.ok?r.json():[]; }).then(function(same){
      function tie(filterPos){
        if(mine==null) return 0;
        var c=0; for(var i=0;i<same.length;i++){
          var s=_pillarScore(same[i].grade_pillars); if(s==null||s<=mine) continue;
          if(filterPos){ var pp=(''+(same[i].position||'')).trim().toUpperCase().charAt(0); if(pp!==pos) continue; }
          c++; }
        return c;
      }
      count('&tdc_grade=gt.'+gi,function(n){ if(n!=null&&eN) eN.textContent='#'+(n+tie(false)+1).toLocaleString(); });
      if(pos) count('&tdc_grade=gt.'+gi+'&position=eq.'+pos,function(n){ if(n!=null&&eP) eP.textContent='#'+(n+tie(true)+1).toLocaleString(); });
    }).catch(function(){
      count('&tdc_grade=gt.'+gi,function(n){ if(n!=null&&eN) eN.textContent='#'+(n+1).toLocaleString(); });
    });
}
// Box-only archetype fit for a HISTORICAL season, so past-season hero grades match
// the rankings tab + the index/roster lists (every year graded the same box way).
function _boxHistGrade(row){
  if(!row) return null;
  var g=parseFloat(row.tdc_grade); if(!isFinite(g)) return (row.tdc_grade!=null?row.tdc_grade:null);
  if(window.TDCRating && TDCRating.boxAdjust){
    try{ var pos=row.position||player.position, ht=row.height||player.height;
      var a=TDCRating.boxAdjust(g,{position:pos,height:ht},Object.assign({},row,{position:pos,height:ht}),parseInt(row.season_year)||0);
      if(a && a.grade!=null) return Math.round(a.grade);
    }catch(e){}
  }
  return Math.round(g);
}
var _heroBoxReady=false, _heroHistReady=false;
function _updateHeroGridForSeason(val){
  var isProj=(val==='proj'||val==null||+val>=2027);
  var row=isProj?null:_ovrSeasonRow(val);
  // grade — projected already carries the box archetype (via arch_bonus); historical
  // gets it applied here so every season is consistent.
  // Hero grade IS the statistical overall (cutover): projected for the outlook,
  // demonstrated for the current season; older seasons keep the historical box grade.
  (function(){
    // <3 games played = no rating (noise). Show "—" instead of any fallback grade.
    var _gp=isProj ? (player.gp!=null?+player.gp:null)
                   : (row ? ((row.gp!=null&&row.gp!=='')?+row.gp:((row.g!=null&&row.g!=='')?+row.g:null)) : null);
    if(_gp!=null && _gp>0 && _gp<3){ _setHeroGrade('—'); return; }
    var maps=(window.TDCProjGrade&&TDCProjGrade.statMaps)?TDCProjGrade.statMaps():null;
    var eid=player.espn_id!=null?String(player.espn_id):null;
    var projO=(maps&&eid)?maps.proj[eid]:null;
    var sy=row?+row.season_year:null, hg=null;
    if(isProj){ hg=(projO!=null)?projO:null; }
    else if(window.TDCProjGrade&&TDCProjGrade.gradeSolo){   // season-aware: demonstrated(2026) or historical
      hg=TDCProjGrade.gradeSolo({espn_id:player.espn_id, season_year:sy, tdc_grade:row&&row.tdc_grade});
    }
    if(hg==null||isNaN(hg)) hg=isProj?(_projectedGrade()||player.tdc_grade):_boxHistGrade(row);
    _setHeroGrade(hg);
    if(typeof _renderScoutCard==='function') _renderScoutCard();   // keep the scouting card's grade in sync with the hero
  })();
  // past season selected: lazily fetch the historical grades once, then re-render
  if(!isProj && row && +row.season_year<=2025 && !_heroHistReady && window.TDCProjGrade && TDCProjGrade.loadHist){
    _heroHistReady=true; TDCProjGrade.loadHist().then(function(){ _updateHeroGridForSeason(val); });
  }
  var g=parseFloat(isProj?(_projectedGrade()||player.tdc_grade):_boxHistGrade(row));
  // if the archetype data isn't loaded yet, re-run once it is (idempotent)
  if(!isProj && !_heroBoxReady && window.TDCRating && TDCRating.ready){ _heroBoxReady=true; TDCRating.ready.then(function(){ _updateHeroGridForSeason(val); }); }
  // wins added
  var wa=isProj?_curSeasonWA():(row?(row.wa!=null&&row.wa!==''?parseFloat(row.wa):(row._advanced?_winsAdded(row._advanced):null)):null);
  var eWA=document.getElementById('heroWA'); if(eWA) eWA.textContent=(wa==null||isNaN(wa))?'—':((wa>0?'+':'')+(+wa).toFixed(1));
  // all-time wins-added rank
  var eAll=document.getElementById('heroRank');
  if(eAll){
    var gr=_gradeAllTimeRank(g, (row&&row._pillars)||player._pillars||null);
    eAll.textContent=(gr==null)?'—':('#'+gr.toLocaleString());
    var eAllL=eAll.parentNode&&eAll.parentNode.querySelector('.hg-l');
    if(eAllL) eAllL.textContent='of '+Math.round(GRADE_POOL_N/1000)+'K all-time';
  }
  // player STYLE archetype — quiet tag in the header
  if(window.TDC_ARCH&&TDC_ARCH.ready) TDC_ARCH.ready.then(function(){
    var a=TDC_ARCH.of(player&&player.espn_id, player&&player.name); if(!a) return;
    var pill=document.getElementById('heroArchPill'), v=document.getElementById('heroArch');
    var b=TDC_ARCH.breakout(a.name);
    var tip=a.desc;
    if(b){ var pct=Math.round(b.rate*100);
      tip+=(tip?' · ':'')+pct+'% of young non-star '+a.name+'s grow into stars ('+
           (b.meta.years?b.meta.years[0]+'–'+b.meta.years[1]:'')+', n='+b.n+')'; }
    if(pill&&v){ v.textContent=a.name; if(a.color) v.style.color=a.color; pill.style.display=''; pill.title=tip; }
    // visible Style-breakout pill: the style's base rate. Meaningless once a player is
    // already a star, so suppress it for stars; otherwise show it for everyone (class year
    // is too sparse to gate on). Labeled "Style breakout" so it reads as a style stat.
    if(b){
      var star=(b.meta&&b.meta.star)||88;
      var notStar=!(isFinite(g)&&g>=star);
      var bp=document.getElementById('heroBreakPill'), bv=document.getElementById('heroBreak');
      if(bp&&bv&&notStar){
        var pct2=Math.round(b.rate*100);
        bv.textContent=pct2+'%'; if(a.color) bv.style.color=a.color; bp.style.display='';
        bp.title='Style base rate — historically '+pct2+'% of '+a.name+'s who were young non-stars (grade ≤ '+
          ((b.meta&&b.meta.young_max)||84)+') later reached star grade (≥ '+star+'), '+
          (b.meta.years?b.meta.years[0]+'–'+b.meta.years[1]:'')+'. A style trend, not a projection for this player.';
      }
    }
  });
  // national + position rank
  var eN=document.getElementById('heroNatRank'), eP=document.getElementById('heroPosRank'),

  // proj view shows the 2026 NBA Draft big board (demonstrated production + draft

  if(eNL) eNL.textContent=isProj ? '’27 Big Board' : ("Nat'l Rank ’"+(''+row.season_year).slice(2));
  if(isProj && window._bbNat!=null){
    if(eN) eN.textContent='#'+window._bbNat;
    if(eP) eP.textContent='#'+window._bbPos;
    if(ePL) ePL.textContent=(window._bbPosLbl||'Pos')+' Rank';
  } else if(!isNaN(g) && row){
    // Rank within THAT SEASON. (This used to compare a past season's grade to
    // the CURRENT player pool, so any old elite season came back #1.)
    // rank by the RAW stored grade — the pool is raw tdc_grade, so comparing the box-adjusted
    // display grade (which the archetype bonus lifts above raw) over-ranked the player (#2).
    _seasonRanks(row.season_year, parseFloat(row.tdc_grade), (row.position||player.position||''), (row._pillars||null), eN, eP, ePL);
  }
}

var EXP_STATS=[
  {k:'ppg',l:'Points / G'},{k:'rpg',l:'Rebounds / G'},{k:'apg',l:'Assists / G'},
  {k:'mpg',l:'Minutes / G'},{k:'fg_pct',l:'FG%'},{k:'tp_pct',l:'3P%'},{k:'ft_pct',l:'FT%'},
  {k:'stl',l:'Steals / G'},{k:'blk',l:'Blocks / G'},{k:'tovs',l:'Turnovers / G'},
  {k:'oreb',l:'Off Reb / G'},{k:'dreb',l:'Def Reb / G'},
  {k:'_ht',l:'Height (in)'},{k:'tdc_grade',l:'TDC Grade'},{k:'_wa',l:'Wins Added'},
  {k:'_p40',l:'Points / 40'},{k:'_a40',l:'Assists / 40'},{k:'_r40',l:'Rebounds / 40'},{k:'_ts',l:'True Shooting %'}
];
function expHtIn(h){if(!h)return 0;var m=(''+h).match(/(\d+)\s*[-']\s*(\d+)/);return m?(+m[1])*12+(+m[2]):0;}
function expPosGrp(pos){ return tdcPosGroup(pos); }   // shared canonical (tdc-pos.js)
function expVal(p,key){
  var ppg=parseFloat(p.ppg)||0,mpg=parseFloat(p.mpg)||0,apg=parseFloat(p.apg)||0,rpg=parseFloat(p.rpg)||0;
  if(key==='_ht'){var _hh=expHtIn(p.height);return _hh>0?_hh:null;}
  var RATE_MIN=5;
  if(key==='_p40')return mpg>=RATE_MIN?+(ppg*40/mpg).toFixed(1):null;
  if(key==='_a40')return mpg>=RATE_MIN?+(apg*40/mpg).toFixed(1):null;
  if(key==='_r40')return mpg>=RATE_MIN?+(rpg*40/mpg).toFixed(1):null;
  if(key==='_ts'){if(mpg<RATE_MIN)return null;var fga=parseFloat(p.fga)||0,fta=parseFloat(p.fta)||0,d=2*(fga+0.44*fta);return d>0?+(ppg/d*100).toFixed(1):null;}
  if(key==='_wa'){   // OWNED Wins Added from TI (build_wins_added.py: REPL 5.0, PPW 69.87)
    var ti=p.ti!=null?parseFloat(p.ti):(p._advanced?parseFloat(p._advanced.ti40):NaN);
    var mp=p.mp!=null?parseFloat(p.mp):(p._advanced?parseFloat(p._advanced.mp):NaN);
    return (isFinite(ti)&&isFinite(mp))?+(((ti-5.0)*(mp/40)/69.87)).toFixed(1):null;
  }

}

// Run a raw player line through the team engine so the editor preview shows the
// SAME number that appears in the lineup (team pace + the real rotation minutes).
function _projectWithLine(customLine){
  try{
    if(typeof buildTeamProjections!=='function' || !teamPlayers || !teamPlayers.length) return customLine;
    var conf=(teamData&&(teamData.conf||teamData.conference))||'';
    var lower=(player.name||'').toLowerCase().trim();
    // Give every unproven teammate an estimated line too, so total minutes ~= 200 and
    // the normalization isn't inflated (mirrors the team page's readyPlayers step).
    var roster=teamPlayers.map(function(pp){
      if((pp.name||'').toLowerCase().trim()===lower) return Object.assign({},pp,customLine);
      if(window.TDCFresh && TDCFresh.isFreshman(pp)) return TDCFresh.line(pp, TDCFresh.profileFor(pp));
      return pp;
    });
    var out=buildTeamProjections(roster,conf);
    if(typeof applyPredictionWalls==='function') out=applyPredictionWalls(out);
    // mirror the team page's final step: normalize the top-10 rotation to 200 minutes
    var sumM=out.map(function(p){return parseFloat(p.mpg)||0;}).sort(function(a,b){return b-a;}).slice(0,10).reduce(function(s,v){return s+v;},0);
    if(sumM>0 && Math.abs(sumM-200)>0.5){
      var f=200/sumM, CNT=['ppg','rpg','apg','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','stl','blk','tovs'];
      out.forEach(function(p){ var m=parseFloat(p.mpg)||0; if(!m) return; var nm=Math.min(40,m*f), r=nm/m; p.mpg=Math.round(nm*10)/10; CNT.forEach(function(k){ if(p[k]!=null) p[k]=Math.round(parseFloat(p[k])*r*10)/10; }); });
    }
    var mine=out.find(function(pp){ return (pp.name||'').toLowerCase().trim()===lower; });
    return mine?Object.assign({},customLine,mine):customLine;
  }catch(e){ return customLine; }
}

// The Full Stats OVR column must show the SAME statistical overall as the hero/rankings
// (gradeSolo, season-aware) — not the raw per-season players/player_history tdc_grade,
// which is a legacy grade and made a season read 95 while the site's overall said 85.
function _statOvrRow(sy, fallback){
  if(window.TDCProjGrade && TDCProjGrade.gradeSolo){
    var g=TDCProjGrade.gradeSolo({espn_id:(player&&player.espn_id), season_year:sy, tdc_grade:fallback});
    if(g!=null && !isNaN(g)) return g;
  }
  return fallback;
}
var _statsHistReady=false;
function _rerenderStatTables(){
  var a=document.getElementById('sm-body-pergame'); if(a) a.innerHTML=renderStatTable(player, proj);
  var b=document.getElementById('sm-body-per40'); if(b) b.innerHTML=renderModeTable('per40');
  var c=document.getElementById('sm-body-advanced'); if(c) c.innerHTML='<div style="overflow-x:auto;">'+renderModeTable('advanced')+'</div>';
}
// Past-season statistical overalls live in the lazy history file — load it once, then
// repaint the tables so 2024/25 rows show the real overall instead of the raw fallback.
function _ensureStatsHist(){
  if(_statsHistReady || !(window.TDCProjGrade && TDCProjGrade.loadHist)) return;
  _statsHistReady=true;
  TDCProjGrade.loadHist().then(function(){ _rerenderStatTables(); });
}
function renderStatTable(p, projData){
  _ensureStatsHist();
  const seasonLabel = y => {
    const yr = parseInt(y);
    return isNaN(yr) ? y : `${yr-1}-${String(yr).slice(2)}`;
  };
  const gradeC = g => { g=parseInt(g); if(isNaN(g)) return 'var(--text3)';
    return g>=85?'#5ab875':g>=78?'var(--accent)':g>=70?'var(--text)':g>=64?'var(--text2)':'var(--text3)'; };
  const ovrCell = g => `<td style="font-family:'Playfair Display',serif;font-weight:800;font-size:15px;color:${gradeC(g)};">${(g!=null&&g!==''&&!isNaN(parseInt(g)))?parseInt(g):'—'}</td>`;

  let rowsHtml = '';
  const teamSub = t => t ? `<div style="font-size:9px;color:var(--text3);font-weight:600;margin-top:1px;">${t}</div>` : '';

  // Deduplicate history by season_year — keep the row with the most games played per year
  const dedupedHistory = (() => {
    const byYear = {};
    (careerHistory || []).forEach(s => {
      const yr = s.season_year;
      const gp = s.gp || 0;
      if(!byYear[yr] || gp > (byYear[yr].gp || 0)) byYear[yr] = s;
    });
    return Object.values(byYear).sort((a,b) => a.season_year - b.season_year);
  })();

  // Show all seasons from player_history (each row has the correct school for that year)
  if(dedupedHistory.length){
    dedupedHistory.forEach(s=>{
      if(s.sat_out || (s.ppg==null && (s.gp==null||s.gp===0))){
        rowsHtml += `<tr style="opacity:.55;">
          <td>${seasonLabel(s.season_year)}${teamSub(s.team)}</td>
          ${ovrCell(_statOvrRow(s.season_year, s.tdc_grade))}
          <td colspan="19" style="text-align:left;font-style:italic;color:var(--text3);">
            Redshirt / Did not play
          </td>
        </tr>`;
      } else {
        const pgd=s._pergame||{};
        rowsHtml += `<tr class="actual">
          <td>${seasonLabel(s.season_year)}${teamSub(s.team)}</td>
          ${ovrCell(_statOvrRow(s.season_year, s.tdc_grade))}
          <td>${s.gp||'—'}</td>
          <td ${_cc(pgd,'pts_per_g')}>${fmt(s.ppg)}</td><td ${_cc(pgd,'trb_per_g')}>${fmt(s.rpg)}</td><td ${_cc(pgd,'ast_per_g')}>${fmt(s.apg)}</td><td ${_cc(pgd,'mp_per_g')}>${fmt(s.mpg)}</td>
          <td ${_cc(pgd,'fg_per_g')}>${fmt(s.fgm)}</td><td ${_cc(pgd,'fga_per_g')}>${fmt(s.fga)}</td><td ${_cc(pgd,'fg_pct')}>${fmtP(s.fg_pct)}</td>
          <td ${_cc(pgd,'fg3_per_g')}>${fmt(s.tpm)}</td><td ${_cc(pgd,'fg3a_per_g')}>${fmt(s.tpa)}</td><td ${_cc(pgd,'fg3_pct')}>${fmtP(s.tp_pct)}</td>
          <td ${_cc(pgd,'ft_per_g')}>${fmt(s.ftm)}</td><td ${_cc(pgd,'fta_per_g')}>${fmt(s.fta)}</td><td ${_cc(pgd,'ft_pct')}>${fmtP(s.ft_pct)}</td>
          <td ${_cc(pgd,'orb_per_g')}>${fmt(s.oreb)}</td><td ${_cc(pgd,'drb_per_g')}>${fmt(s.dreb)}</td>
          <td ${_cc(pgd,'stl_per_g')}>${fmt(s.stl)}</td><td ${_cc(pgd,'blk_per_g')}>${fmt(s.blk)}</td><td ${_cc(pgd,'tov_per_g')}>${fmt(s.tovs)}</td>
        </tr>`;
      }
    });
  } else {
    // No career history — fall back to current season row from players table
    rowsHtml += `<tr class="actual">
      <td>2025-26${teamSub(p.team)}</td>
      ${ovrCell(_statOvrRow(2026, p.tdc_grade))}
      <td>${p.gp||'—'}</td>
      <td>${fmt(p.ppg)}</td><td>${fmt(p.rpg)}</td><td>${fmt(p.apg)}</td><td>${fmt(p.mpg)}</td>
      <td>${fmt(p.fgm)}</td><td>${fmt(p.fga)}</td><td>${fmtP(p.fg_pct)}</td>
      <td>${fmt(p.tpm)}</td><td>${fmt(p.tpa)}</td><td>${fmtP(p.tp_pct)}</td>
      <td>${fmt(p.ftm)}</td><td>${fmt(p.fta)}</td><td>${fmtP(p.ft_pct)}</td>
      <td>${fmt(p.oreb)}</td><td>${fmt(p.dreb)}</td>
      <td>${fmt(p.stl)}</td><td>${fmt(p.blk)}</td><td>${fmt(p.tovs)}</td>
    </tr>`;
  }

  // Always append the 2026-27 projection row
  if(projData){
    rowsHtml += `<tr class="proj">
      <td>2026-27 ★<div style="font-size:9px;color:var(--text3);font-weight:600;">Projected</div></td>
      ${ovrCell(_statOvrRow(undefined, p.tdc_grade))}
      <td>—</td>
      <td>${fmt(projData.ppg)}</td><td>${fmt(projData.rpg)}</td><td>${fmt(projData.apg)}</td><td>${fmt(projData.mpg)}</td>
      <td>${fmt(projData.fgm)}</td><td>${fmt(projData.fga)}</td><td>${fmtP(projData.fg_pct)}</td>

// ── RANKINGS: how the tdc_grade is built ──────────────────────────────────────
// The ACTUAL inputs the grade model (RidgeCV, scripts/grade_features.py) measures,
// each z-scored within its own season and conference-tier-adjusted. NOT Wins Added
// or BPM — those are derived views the model never sees.
const GRADE_W=[
  {k:'ppg',   lbl:'Scoring',      stat:'PPG',  max:20,  good:1},
  {k:'ts',    lbl:'Shooting Eff.',stat:'TS%',  max:64,  good:1},
  {k:'rpg',   lbl:'Rebounding',   stat:'RPG',  max:11,  good:1},
  {k:'apg',   lbl:'Playmaking',   stat:'APG',  max:7,   good:1},
  {k:'stl',   lbl:'Steals',       stat:'STL',  max:2.2, good:1},
  {k:'blk',   lbl:'Blocks',       stat:'BLK',  max:2.8, good:1},
  {k:'ast_to',lbl:'Ball Control', stat:'A/TO', max:3,   good:1},
  {k:'mpg',   lbl:'Workload',     stat:'MPG',  max:35,  good:1},
];
const GRP_LBL={G:'Guards',W:'Wings & Forwards',B:'Bigs'};
function _tsPct(s){ const t=s._advanced&&s._advanced.ts_pct; if(t!=null&&t!=='') return parseFloat(t)*100;
  const fga=parseFloat(s.fga)||0, fta=parseFloat(s.fta)||0, den=2*(fga+0.44*fta); return den>0?(parseFloat(s.ppg)||0)/den*100:null; }

// ── Projected grade for RETURNERS ─────────────────────────────────────────────
// tdc_grade is DEMONSTRATED — what a player proved. For the 2026-27 outlook we want
// the grade to reflect his PROJECTED role: a bench freshman projected to start should
// grade like a starter. We anchor on the demonstrated grade (inheriting the real
// backend model's calibration) and move it only by the projected CHANGE in the grade's
// drivers — role/minutes (→ Wins Added), scoring, efficiency. No circularity: the
// projection is built FROM the demonstrated grade; this grades that projection's OUTPUT.
const _CLS_BUMP={FR:0.5,SO:0.2,JR:0.1,SR:0,GR:0};
function _clsCode(y){ y=(''+(y||'')).toUpperCase();
  return y.indexOf('FR')===0?'FR':y.indexOf('SO')===0?'SO':y.indexOf('JR')===0?'JR':y.indexOf('SR')===0?'SR':y.indexOf('GR')===0?'GR':(y==='RS'?'SO':''); }
function _projDrivers(lastAct, projLine){
  const aM=parseFloat(lastAct.mpg)||0, pM=parseFloat(projLine.mpg)||0;
  const aWA=parseFloat(lastAct.wa)||0;
  const aBpm=parseFloat(lastAct._advanced&&lastAct._advanced.bpm)||0;
  const cls=_clsCode(player.yr||player.class_year||projLine.yr);
  // projected Wins Added: same per-minute value, scaled by the projected minute load
  const pWA = aM>0 ? aWA*Math.min(2.2, pM/aM) : aWA;
  // projected BPM: regress toward mean + class-development bump (matches tdc-ratings.js)
  const pBpm = 0.635 + 0.785*aBpm + (_CLS_BUMP[cls]||0);
  const aTs=_tsPct(lastAct), pTsRaw=_tsPct(projLine);
  return {aM,pM,aWA,pWA,aBpm,pBpm,aTs:(aTs!=null?aTs:55), pTs:(pTsRaw!=null?pTsRaw:(aTs!=null?aTs:55))};
}
function _rankComposite(L){
  return GRADE_W.reduce((sum,d)=>{
    const v = d.k==='ts' ? (L.ts||0) : d.k==='bpm' ? (L.bpm||0) : (parseFloat(L[d.k])||0);
    return sum + d.w*Math.max(0,Math.min(1,v/d.max))*(d.good?1:-1);
  },0);
}
function _projReturnerGrade(lastAct, projLine){
  // Single source of truth: the shared coupled OVR (tdc-projgrade.js gradeSolo, which
  // returns the role-aware coupled grade) so the header, Rankings tab, team page and
  // every list show an IDENTICAL projected OVR. (Was TDCProjGrade.grade — a stale
  // pre-v5 engine that disagreed with the header.)
  if(window.TDCProjGrade && TDCProjGrade.gradeSolo){ const _g=TDCProjGrade.gradeSolo(player); if(_g!=null&&!isNaN(_g)) return _g; }
  const demo=parseInt(lastAct&&lastAct.tdc_grade!=null?lastAct.tdc_grade:player.tdc_grade);
  if(isNaN(demo)||!projLine||!lastAct) return null;
  const D=_projDrivers(lastAct, projLine);
  if(D.aM<=0||D.pM<=0) return demo;
  const A={wa:D.aWA, ppg:lastAct.ppg, ts:D.aTs, bpm:D.aBpm, rpg:lastAct.rpg, apg:lastAct.apg, mpg:D.aM, tovs:lastAct.tovs};
  const P={wa:D.pWA, ppg:projLine.ppg, ts:D.pTs, bpm:D.pBpm, rpg:projLine.rpg, apg:projLine.apg, mpg:D.pM, tovs:projLine.tovs};
  let pg = demo + 10*(_rankComposite(P)-_rankComposite(A));
  pg = Math.max(demo-6, Math.min(demo+9, pg));          // cap how far the projection can move it
  return Math.max(40, Math.min(99, Math.round(pg)));
}
// A projected-2026-27 line the Rankings drivers can read directly (projected advanced baked in).
function _buildProjRankLine(lastAct, projLine){
  const D=_projDrivers(lastAct, projLine);
  const pg=_projReturnerGrade(lastAct, projLine);
  return Object.assign({}, projLine, {
    wa: Math.round(D.pWA*10)/10,
    _advanced:{ bpm: Math.round(D.pBpm*10)/10, ts_pct: D.pTs/100 },
    tdc_grade: pg,
    height: lastAct.height||projLine.height||player.height
  });
}

// ── BUZZ TAB — headlines + social feed ────────────────────────────────────
// LIVE: real per-player headlines from scripts/data/player_news.json (Google News
// RSS via scripts/build_player_news.py) + optional fan buzz from player_buzz.json
// (Reddit r/CollegeBasketball, when REDDIT_* secrets are set). Both refreshed daily
// by .github/workflows/refresh-news.yml. Keyed by espn_id (name fallback).
// ── BUZZ INDEX ── volume × recency × source credibility, percentile-normalized
// across every tracked player so it reads "vs the field", not raw media-market size.
function _buzzSourceWeight(src){
  const s=(src||'').toLowerCase();
  if(/espn|the athletic|cbs|yahoo|sports illustrated|si\.com|usa today|associated press|\bap\b|fox sports|bleacher/.test(s)) return 1.0;
  if(/247|on3|rivals|247sports/.test(s)) return 0.92;
  if(/athletics|university|\.edu|official site/.test(s)) return 0.5;   // team/school PR
  return 0.68;                                                          // regional / unknown
}
function _ensureBuzzIndex(){
  if(window._buzzIdx) return window._buzzIdx;
  const news=window._playerNews, red=window._playerBuzz;
  const nowRef = (news&&news.generated_utc) ? Date.parse(news.generated_utc) : Date.now();
  const HALF=45*86400*1000;   // 45-day recency half-life
  const rec=t=>{ const ms=nowRef-t; return isNaN(ms)?0.3:Math.pow(0.5, Math.max(0,ms)/HALF); };
  const score={};   // key -> raw buzz score
  const add=(key,v)=>{ score[key]=(score[key]||0)+v; };
  if(news&&news.players) Object.keys(news.players).forEach(k=>{
    const its=(news.players[k]&&news.players[k].items)||[]; let s=0;
    its.forEach(n=>{ s+=_buzzSourceWeight(n.source)*rec(Date.parse(n.date)); });
    add(k, s);
  });
  if(red&&red.players) Object.keys(red.players).forEach(k=>{
    const its=(red.players[k]&&red.players[k].items)||[]; let s=0;
    its.forEach(b=>{ s+=0.6*Math.log10(2+(+b.score||0)+(+b.comments||0))*rec((+b.created||0)*1000); });
    add(k, s);
  });
  const vals=Object.values(score).filter(v=>v>0).sort((a,b)=>a-b);
  const pct=v=>{ if(!vals.length||v<=0) return 0; let lo=0,hi=vals.length; while(lo<hi){const m=(lo+hi)>>1; if(vals[m]<v) lo=m+1; else hi=m;} return Math.round(100*lo/vals.length); };
  const idx={}; Object.keys(score).forEach(k=>{ idx[k]={score:score[k], index:pct(score[k])}; });
  return (window._buzzIdx={by:idx, n:vals.length});
}
// ── BETTING PROPS TAB ─────────────────────────────────────────────────────────
// Model/trend-driven prop analysis from the player's OWN box scores (no live
// sportsbook odds — those are archived forward from the Nov 2026 season). Per prop
// stat: a suggested .5 line, over/under hit-rate from ACTUAL games, L10 form,
// floor/ceiling and a game-by-game vs-line strip. Line is adjustable per stat.
var _BET={ box:null, season:null, lines:{} };
var BET_STATS=[
  {k:'pts',lab:'Points',   get:function(g){return g.pts;}},
  {k:'reb',lab:'Rebounds', get:function(g){return g.reb;}},
  {k:'ast',lab:'Assists',  get:function(g){return g.ast;}},
  {k:'tpm',lab:'3-Pointers',get:function(g){return g.tpm;}},
  {k:'pra',lab:'Pts+Reb+Ast',get:function(g){return (g.pts||0)+(g.reb||0)+(g.ast||0);}},
  {k:'stk',lab:'Stl+Blk',  get:function(g){return (g.stl||0)+(g.blk||0);}}
];
function _betSuggestLine(vals){
  var s=vals.slice().sort(function(a,b){return a-b;}); var med=s[Math.floor(s.length/2)];
  var line=Math.round(med*2)/2;
  if(line===Math.round(line)) line-=0.5;   // keep it a .5 prop line, never a whole number
  return Math.max(0.5,line);
}
async function renderBetting(){
  var el=document.getElementById('bettingContent');
  el.innerHTML='<div class="bet-empty">Loading game data…</div>';
  var espn=window._playerEspn||(window.player&&player.espn_id);
  if(!espn){ el.innerHTML='<div class="bet-empty">No game data available for prop analysis.</div>'; return; }
  try{
    if(!_BET.box){
      var bx=await fetch(SB+'/rest/v1/box_scores?espn_id=eq.'+espn+'&select=season_year,date,opp,opp_tier,min,pts,reb,ast,stl,blk,tpm,tov&order=date.asc&limit=400',{headers:H}).then(function(r){return r.json();});
      _BET.box=Array.isArray(bx)?bx.filter(function(b){return (b.min||0)>0;}):[];
    }
    if(!_BET.box.length){ el.innerHTML='<div class="bet-empty">No box-score history yet — prop analysis needs games played.</div>'; return; }
    var bySea={}; _BET.box.forEach(function(b){ (bySea[b.season_year]=bySea[b.season_year]||[]).push(b); });
    var seasons=Object.keys(bySea).map(Number).sort(function(a,b){return b-a;});
    if(_BET.season==null) _BET.season = seasons.find(function(s){return bySea[s].length>=5;}) || seasons[0];
    _betPaint();
  }catch(e){ el.innerHTML='<div class="bet-empty">Could not load prop data.</div>'; }
}
function _betGames(){ return _BET.season==='career'?_BET.box:_BET.box.filter(function(b){return String(b.season_year)===String(_BET.season);}); }
function _betPaint(){
  var el=document.getElementById('bettingContent');
  var games=_betGames();
  var bySea={}; _BET.box.forEach(function(b){ (bySea[b.season_year]=bySea[b.season_year]||[]).push(b); });
  var seasons=Object.keys(bySea).map(Number).sort(function(a,b){return b-a;});
  var pills=seasons.map(function(s){ return '<button class="'+(String(_BET.season)===String(s)?'on':'')+'" onclick="_betSetSeason('+s+')">’'+String(s).slice(2)+'</button>'; }).join('')
    +'<button class="'+(_BET.season==='career'?'on':'')+'" onclick="_betSetSeason(&quot;career&quot;)">Career</button>';
  var cards=[], best=[];
  BET_STATS.forEach(function(st){
    var vals=games.map(st.get).filter(function(v){return v!=null;});
    if(vals.length<3) return;
    var line=_BET.lines[st.k]; if(line==null){ line=_betSuggestLine(vals); _BET.lines[st.k]=line; }
    var over=vals.filter(function(v){return v>line;}).length;
    var pOver=Math.round(100*over/vals.length), pUnder=100-pOver;
    var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
    var l10=vals.slice(-10), l10o=l10.filter(function(v){return v>line;}).length, pL10=Math.round(100*l10o/l10.length);
    var sorted=vals.slice().sort(function(a,b){return a-b;});
    var floor=sorted[0], ceil=sorted[sorted.length-1];
    var sp=vals.slice(-16).map(function(v){ var h=Math.max(2,Math.round(v/(ceil||1)*44)); return '<i class="'+(v>line?'o':'u')+'" style="height:'+h+'px"></i>'; }).join('');
    var hotO=pOver>=pUnder;
    cards.push(
      '<div class="bet-card">'
      +'<div class="bet-card-top"><span class="bet-stat">'+st.lab+'</span><span class="bet-proj">Proj <b>'+avg.toFixed(1)+'</b></span></div>'
      +'<div class="bet-line-row"><button onclick="_betLine(&quot;'+st.k+'&quot;,-1)" aria-label="lower line">−</button>'
        +'<div class="bet-line-val"><div class="bet-line-num">'+line.toFixed(1)+'</div><div class="bet-line-lab">Prop Line</div></div>'
        +'<button onclick="_betLine(&quot;'+st.k+'&quot;,1)" aria-label="raise line">+</button></div>'
      +'<div class="bet-ou">'
        +'<div class="bet-ou-side bet-ou-o '+(hotO?'hot':'')+'"><div class="bet-ou-pct">'+pOver+'%</div><div class="bet-ou-lab">Over</div></div>'
        +'<div class="bet-ou-side bet-ou-u '+(!hotO?'hot':'')+'"><div class="bet-ou-pct">'+pUnder+'%</div><div class="bet-ou-lab">Under</div></div>'
      +'</div>'
      +'<div class="bet-spark" title="Last '+Math.min(16,vals.length)+' games vs the line">'+sp+'</div>'
      +'<div class="bet-facts">'
        +'<div class="bet-fact"><b>'+pL10+'%</b><span>L10 Over</span></div>'
        +'<div class="bet-fact"><b>'+floor+'</b><span>Floor</span></div>'
        +'<div class="bet-fact"><b>'+ceil+'</b><span>Ceiling</span></div>'
      +'</div></div>'
    );
    best.push({lab:st.lab,line:line,side:hotO?'o':'u',pct:Math.max(pOver,pUnder),l10:hotO?pL10:100-pL10});
  });
  if(!cards.length){ el.innerHTML='<div class="bet-empty">Not enough games in this span for prop analysis.</div>'; return; }
  best.sort(function(a,b){return b.pct-a.pct;});
  var bestHtml=best.slice(0,3).map(function(b){

        </div>`;
      // EVERY-YEAR: a historical/demonstrated season shows the raw trained grade; add the

            <div class="bu-row total"><span class="bu-lbl">${_seasonLbl(_season)||_season} Overall</span><span class="bu-val">${adj}</span></div>

// ── Projected 2026-27 grade ───────────────────────────────────────────────
// The grade for the projection should MOVE with the projected line — a bigger

function _projectedGrade(){

    var fg=parseInt(proj.tdc_grade); if(!isNaN(fg)) return fg;
  }
  // Projection model v5: the whole-roster rotation grade, stamped on `player` at load — the
  // SAME value the depth chart and rankings show. Identical everywhere by construction.
  if(player && player._projGrade!=null && !isNaN(player._projGrade)) return player._projGrade;
  // Fallback (roster not yet stamped, or a former player with no current season): the shared
  // statistical overall for the player's MOST RECENT demonstrated season. gradeSolo(player)
  // with no season returns null for former players and used to drop us to the stale legacy
  // grade (e.g. Dillon Jones 88 instead of 84) — pass the latest season so it resolves.
  if(window.TDCProjGrade && (TDCProjGrade.gradeSolo||TDCProjGrade.grade)){
    var _dr=null; try{ var _hh=(typeof _dedupHist==='function')?_dedupHist():[]; _dr=_hh.length?_hh[_hh.length-1]:null; }catch(e){}
    var _sarg=_dr?{espn_id:player.espn_id,season_year:+_dr.season_year,tdc_grade:_dr.tdc_grade,position:player.position}:player;
    var _pg=TDCProjGrade.gradeSolo?TDCProjGrade.gradeSolo(_sarg):TDCProjGrade.grade(player);
    if(_pg!=null&&!isNaN(_pg)) return _pg;
  }
  // Legacy fallback: history-based projection when the shared model is unavailable.
  try{
    var _h=(typeof _dedupHist==='function')?_dedupHist():[]; var _la=_h.length?_h[_h.length-1]:null;
    if(_la && proj && (parseFloat(proj.ppg)>0||parseFloat(proj.mpg)>0) && _la.tdc_grade!=null){
      var rg=_projReturnerGrade(_la, proj); if(rg!=null&&!isNaN(rg)) return rg;
    }
  }catch(e){}
  var g=parseInt(player.tdc_grade); return isNaN(g)?null:g;
}

// Overall progression chart — player's TDC grade across seasons, over a faint
// "normal progression" (Fr→Grad) reference ramp.
function buildProgression(p){
  // dedupe career history by season (keep most games), chronological, graded only
  var byYear={};
  (careerHistory||[]).forEach(function(s){
    var g=parseInt(s.tdc_grade); if(isNaN(g)) return;
    var yr=+s.season_year, gp=+s.gp||0;
    if(!byYear[yr]||gp>(byYear[yr].gp||0)) byYear[yr]={yr:yr,grade:g,gp:gp,cls:s.yr};
  });
  var pts=Object.keys(byYear).map(function(k){return byYear[k];}).sort(function(a,b){return a.yr-b.yr;});
  // Only project a 2026-27 point if the player is actually on a current roster
  // (proj is set). Graduated/departed players — loaded from history, proj=null —
  // end at the last season they played.
  var pg=_projectedGrade(); if(pg==null||isNaN(pg)) pg=parseInt(p.tdc_grade);
  if(proj && !isNaN(pg)) pts.push({yr:2027,grade:pg,proj:true,cls:p.yr||p.class_year});
  if(!pts.length) return '';

  var CLS=['Fr','So','Jr','Sr','Gr'], BASE=[64,69,73,76,79];
  pts.forEach(function(pt,i){
    var ci=Math.min(i,4);  // chronological class position (yr field is unreliable)
    pt.cidx=ci; pt.base=BASE[ci];
    pt.label=(''+(pt.yr-1)).slice(-2)+'-'+(''+pt.yr).slice(-2);
    pt.clsLabel=CLS[ci];
  });

  var W=1180,H=270,padL=42,padR=24,padT=30,padB=46;
  var vals=pts.map(function(x){return x.grade;}).concat(pts.map(function(x){return x.base;}));
  var lo=Math.max(45,Math.floor((Math.min.apply(null,vals)-5)/5)*5);
  var hi=Math.min(99,Math.ceil((Math.max.apply(null,vals)+5)/5)*5);
  if(hi-lo<15){hi=Math.min(99,lo+15);}

          +'<text x="'+cx+'" y="'+(H-padB+31)+'" font-size="9" fill="var(--text3)" font-weight="600" text-anchor="middle">'+pt.clsLabel+'</text>';
  });

  return '<div class="sec-title" style="margin-bottom:6px;">Overall Progression</div>'
    +'<div class="prog-legend"><span><i class="pl-line"></i>'+p.name.split(' ')[0]+'</span><span><i class="pl-base"></i>Typical Fr→Grad arc</span></div>'
    +'<div class="prog-wrap"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;">'
    +grid
    +'<path d="'+baseArea+'" fill="var(--text3)" opacity=".08"/>'
    +'<path d="'+baseLine+'" fill="none" stroke="var(--text3)" stroke-width="2" stroke-dasharray="5 4" opacity=".45"/>'
    +'<path d="'+line+'" fill="none" stroke="'+accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+xlabels

}

function buildStatNarrative(p, proj, scout){
  function _n(o,k){var v=parseFloat(o&&o[k]);return isNaN(v)?0:v;}
  const useProj=!!(proj&&!proj._injured&&!proj._dnp&&(_n(proj,'ppg')>0||proj._frosh||proj._noStatEst));
  const s=useProj?proj:p;
  const ppg=_n(s,'ppg'),rpg=_n(s,'rpg'),apg=_n(s,'apg'),mpg=_n(s,'mpg');
  const fg=_n(s,'fg_pct'),tp=_n(s,'tp_pct'),ft=_n(s,'ft_pct'),tpa=_n(s,'tpa');
  const stl=_n(s,'stl'),blk=_n(s,'blk'),oreb=_n(s,'oreb');
  const pos=p.position||'G'; const name=(p.name||'This player').split(' ')[0];
  const yr=(p.yr||p.class_year||'').toString();
  const isBig=pos==='C'||pos==='PF'||pos==='FC';
  const arch=(scout&&scout.archetype)||'';
  const basis=useProj?'projects to':'averaged';
  const when=useProj?'in his 2026-27 projection':'this past season';
  const A=/^[aeiou]/i.test(arch)?'an':'a';

  let parts=[];
  // 1) Archetype + core line
  if(ppg>0||rpg>0||apg>0){
    const line=`${ppg.toFixed(1)} points, ${rpg.toFixed(1)} rebounds, and ${apg.toFixed(1)} assists`;
    parts.push(arch
      ? `${name} ${basis} ${A} ${arch.toLowerCase()} ${when}, putting up ${line}${mpg?` across ${Math.round(mpg)} minutes`:''}.`
      : `${name} ${basis} ${line} per game ${when}.`);
  }
  // 2) Scoring efficiency — honest about interior vs perimeter
  if(fg>0){
    const fgDesc=fg>=54?'a highly efficient':fg>=48?'an efficient':fg>=43?'an average':'a below-average';
    let shootTail='';
    if(tp>0&&tp<31) shootTail=`, but he offers little floor spacing — just ${tp.toFixed(1)}% from three, a mark defenses can sag off`;
    else if(tp>=37&&tpa>=1.5) shootTail=`, and he stretches the floor at ${tp.toFixed(1)}% from deep`;
    else if(tp>0&&tpa>=2) shootTail=`, with ${tp.toFixed(1)}% three-point shooting`;
    parts.push(`He finishes as ${fgDesc} ${isBig?'interior':''} scorer at ${fg.toFixed(1)}% from the field${shootTail}.`);
  }
  // 3) Defense / secondary skill
  if(stl+blk>=1.4){
    parts.push(`His calling card is defense: ${stl.toFixed(1)} steals and ${blk.toFixed(1)} blocks per game${blk>=1&&isBig?' anchor the rim':stl>=1.2?' pressure the perimeter':''}.`);
  } else if(oreb>=2||rpg>=7){
    parts.push(`He earns his minutes on the glass (${rpg.toFixed(1)} rebounds, ${oreb.toFixed(1)} offensive).`);
  } else if(apg>=4){
    parts.push(`He creates for others at ${apg.toFixed(1)} assists per game, keeping the offense flowing.`);
  }
  // 4) Ceiling / floor framing
  if(scout&&scout.ceiling){
    const c=scout.ceiling.toLowerCase(), f=String(scout.floor||'').replace(/\s*floor$/i,'').toLowerCase();
    parts.push(`The projection reads ${A} ${(scout.role||'rotation').toLowerCase()} role now, with a ${c} ceiling${f?` and ${f} floor`:''}.`);
  }
  // 5) Context / variance
  if(proj&&(proj._frosh||proj._noStatEst)) parts.push(`As an unproven ${yr} ${pos}, expect real variance — this is a grade-and-baseline projection, not a track record.`);
  else if(yr) parts.push(`At ${yr}, ${name} profiles as a piece the staff can build a role around.`);

  return parts.join(' ')||'Insufficient stats for a narrative.';
}

// ── RADAR CHART ─────────────────────────────────────────
function _rgbaOf(hex,a){var c=(typeof _hexToRgb==='function')?_hexToRgb(hex):null;return c?'rgba('+c.r+','+c.g+','+c.b+','+a+')':'rgba(150,150,150,'+a+')';}
// smooth closed Catmull-Rom curve through points (rounded radar)
function _radarSmooth(ctx,pts){
  var nn=pts.length;
  if(nn<3){ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<nn;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();return;}
  ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=0;i<nn;i++){
    var p0=pts[(i-1+nn)%nn],p1=pts[i],p2=pts[(i+1)%nn],p3=pts[(i+2)%nn];
    var c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    ctx.bezierCurveTo(c1x,c1y,c2x,c2y,p2.x,p2.y);
  }
  ctx.closePath();
}
function drawRadar(progress){

  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=player;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textCol=isDark?'#a0a0a0':'#888';
  const gridCol=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  // colourise by the team he played for in the SELECTED season (transfers were

  const color=_teamColor(_selT)||(teamData&&teamData.color)||'#8B6914';

  // 8 skill axes — percentile vs EVERY player in the database
  const AXLAB=['Scoring','Efficiency','3-Point','Playmaking','Rebounding','Defense','Usage','Ball Care'];
  function axesOf(s){
    return [

      Math.min(100,Math.round((getPctNat(s.fg_pct,'fg_pct')+getPctNat(s.ft_pct,'ft_pct'))/2)),
      getPctNat(s.tp_pct,'tp_pct'),

      getPctNat(s.rpg,'rpg'),

  AXLAB.forEach((lab,i)=>{

    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);

function animateRadar(){

// ── SCHEME LAB ────────────────────────────────────────────────────────────
// How the coaching SYSTEM reshapes a player's projected line. The live engine only
// applies scheme deltas to NEWCOMERS, so for returners/freshmen this is a counterfactual:
// neutralize his production to a league-average system, then re-apply each preset system's
// scheme scales (same formulas as tdc-proj.js applyCoachContext). Multi-system comparison.
async function _schScales(team){
  var Z={pace:1,havoc:1,orb:1,drb:1,ast:1,lean:1,fgb:0,coach:'',poss:68};
  if(!team) return Z;
  try{ if(typeof loadProjCoachStyle==='function') await loadProjCoachStyle(team); }catch(e){ return Z; }
  var C=window._projCoach||{}, cl=function(v,a,b){return v<a?a:v>b?b:v;};
  var V=2.0, _a=function(raw,lo,hi){return cl(1+V*(raw-1),lo,hi);};   // must match tdc-proj.js applyCoachContext
  return {
    pace: (C.poss_pg&&C.lgPace)?_a(C.poss_pg/C.lgPace,0.80,1.26):1,
    havoc:(C.havoc!=null&&C.lgHavoc)?_a(C.havoc/C.lgHavoc,0.60,1.60):1,
    orb:  (C.oreb!=null&&C.lgOreb)?_a(C.oreb/C.lgOreb,0.64,1.40):1,
    drb:  (C.dreb!=null&&C.lgDreb)?_a(C.dreb/C.lgDreb,0.86,1.16):1,
    ast:  (C.astpp!=null&&C.lgAstpp)?_a(C.astpp/C.lgAstpp,0.58,1.52):1,
    lean: (C.three_pa_pctl!=null)?_a(1+0.34*(C.three_pa_pctl-50)/100,0.64,1.36):1,
    fgb:  (C.lookq!=null&&C.lgLookq)?cl((C.lookq-C.lgLookq)*0.70,-4.5,4.5):0,
    tpb:  (C.lookq!=null&&C.lgLookq)?cl((C.lookq-C.lgLookq)*0.60,-4.5,4.5):0,
    coach:C.coach||'', poss:C.poss_pg||68
  };
}
async function renderScheme(){

    {name:'Crash Glass',sub:'off. rebounding',pace:1.0,havoc:1.0,orb:1.40,drb:1.14,ast:0.95,lean:0.90,fgb:1.0,tpb:-1.0},
    {name:'Slow Grind',sub:'patient, good shots',pace:0.86,havoc:0.85,orb:1.0,drb:1.05,ast:1.10,lean:1.0,fgb:3.2,tpb:3.0}
  ];
  const _tc=t=>(window.tdcTeamColorHex&&tdcTeamColorHex(t))||'#7a7a7a';
  const _logo=t=>((window.tdcTeamColor&&tdcTeamColor(t))||{}).logo||'';
  const own={name:player.team||'His System',sub:ownScales.coach||'current staff',pace:ownScales.pace,havoc:ownScales.havoc,orb:ownScales.orb,drb:ownScales.drb,ast:ownScales.ast,lean:ownScales.lean,fgb:ownScales.fgb,tpb:ownScales.tpb,_own:true,team:player.team,eyebrow:'2026-27'};
  // transfers: add the team he's LEAVING (his demonstrated stats were earned there)

  host.innerHTML=`

function switchTab(t){

// Comp pool: every player-season with real minutes, ~50k rows.
// Three things went wrong with the old loader and each one produced a silent
// "no close historical comps" on a page that has plenty of data:
//   1. it paged with Range headers and NO order by -- PostgREST is free to return
//      rows in a different order per request, so pages overlapped and dropped rows
//   2. a page that failed became [] instead of retrying, leaving a short pool with
//      no signal that anything was missing
//   3. if the HEAD count failed, _total was 0 -> zero pages -> _allHistory=[] , and
//      because [] is truthy it was cached and never refetched
async function _fetchHistoryPool(){
  var PG=1000;
  var cols='id,name,season_year,team,position,height,ppg,rpg,apg,stl,blk,tpm,tpa,tovs,'
          +'mpg,fg_pct,tp_pct,ft_pct,fga,fta';
  var base=SB+'/rest/v1/player_history?select='+cols+'&mpg=gte.10&order=id';
  var total=0;
  try{
    var _ac=(typeof AbortController!=='undefined')?new AbortController():null;
    var _t=setTimeout(function(){ if(_ac) _ac.abort(); },8000);
    var hd=await fetch(SB+'/rest/v1/player_history?select=id&mpg=gte.10',
      {method:'HEAD',headers:{...H,'Prefer':'count=exact'},signal:_ac?_ac.signal:undefined});
    clearTimeout(_t);
    total=parseInt((hd.headers.get('content-range')||'/0').split('/')[1]||0,10)||0;
  }catch(e){}                                   // no count is fine, we page until short
  // Hard deadlines. During the outage on 2026-07-22 these requests simply never
  // settled, so ~50 of them piled up and locked the tab. A comps box is not worth
  // freezing the page over: give up and let the caller show "unavailable".
  var DEADLINE=Date.now()+45000;
  function timedFetch(url,ms){
    var ac=(typeof AbortController!=='undefined')?new AbortController():null;
    var t=setTimeout(function(){ if(ac) ac.abort(); }, ms);
    return fetch(url,{headers:H, signal:ac?ac.signal:undefined})
      .finally(function(){ clearTimeout(t); });
  }
  async function page(pg){
    for(var a=0;a<3;a++){
      if(Date.now()>DEADLINE) throw new Error('comp pool timed out');
      try{
        var r=await timedFetch(base+'&limit='+PG+'&offset='+(pg*PG), 12000);
        if(r.ok) return await r.json();
      }catch(e){}
      await new Promise(function(z){ setTimeout(z, 400*(a+1)); });
    }
    throw new Error('history page '+pg+' failed');
  }
  var rows=[];
  if(total){
    var pages=Math.ceil(total/PG);
    for(var j=0;j<pages;j+=6){                  // 6 at a time: browser connection cap
      var batch=[];
      for(var k=j;k<Math.min(j+6,pages);k++) batch.push(page(k));
      (await Promise.all(batch)).forEach(function(b){ rows=rows.concat(b); });
    }
  } else {
    for(var pg=0; pg<120; pg++){
      var b=await page(pg); rows=rows.concat(b);
      if(b.length<PG) break;
    }
  }
  if(!rows.length) throw new Error('empty comp pool');
  if(total && rows.length < total*0.9) throw new Error('short comp pool '+rows.length+'/'+total);
  return rows;
}
