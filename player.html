<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg: #FBFAFF;--bg2: #F2EFFB;--bg3: #E9E4F7;--border: #E1DBF2;--border2: #C9BFE6;--text: #14101F;--text2: #463D5E;--text3: #847B9C;--accent: #8B3FE0;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg: #07060C;--bg2: #100D1A;--bg3: #181426;--border: #241F36;--border2: #382F54;--text: #F2EFFB;--text2: #A8A1C4;--text3: #6D6589;--accent: #B16BFF;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    /* NAV — frosted glass */
    .nav-wrap{border-bottom:1px solid var(--border);background:rgba(251,250,255,.66);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);position:sticky;top:0;z-index:200;}
    [data-theme="dark"] .nav-wrap{background:rgba(12,10,22,.62);border-bottom-color:rgba(26,43,68,.9);}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    @keyframes logoReveal{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;letter-spacing:-.01em;white-space:nowrap;animation:logoReveal .55s cubic-bezier(.22,1,.36,1) both;}
    .nav-logo span{color:var(--accent);}
    .nav-actions{display:flex;align-items:center;gap:14px;}
    .nav-actions a{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s;}
    .nav-actions a:hover{color:var(--text);}
    .nav-signin{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--text);padding:6px 16px;text-decoration:none;display:inline-block;transition:opacity .15s;}
    .nav-signin:hover{opacity:.85;}
    .theme-toggle,.theme-btn{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
    .theme-toggle:hover,.theme-btn:hover{border-color:var(--accent);}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;position:relative;white-space:nowrap;flex-shrink:0;transition:color .2s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .22s cubic-bezier(.22,1,.36,1);}
    .nav-sub a:first-child::after{left:0;}
    .nav-sub a:hover{color:var(--text);}
    .nav-sub a:hover::after,.nav-sub a.active::after{transform:scaleX(1);}
    .nav-sub a.active{color:var(--text);}

    /* HERO — premium player card */
    .player-hero{position:relative;padding:34px 40px 28px;border-bottom:1px solid var(--border);display:flex;gap:26px;align-items:center;overflow:hidden;isolation:isolate;}
    .player-hero::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(102deg, color-mix(in srgb, var(--tc) 26%, transparent) 0%, color-mix(in srgb, var(--tc) 7%, transparent) 34%, transparent 60%);pointer-events:none;}
    .player-hero::after{content:'';position:absolute;top:-55%;right:-4%;width:460px;height:460px;border-radius:50%;z-index:-1;background:radial-gradient(circle, color-mix(in srgb, var(--tc) 34%, transparent), transparent 66%);filter:blur(34px);pointer-events:none;}
    .hero-avatar{width:86px;height:86px;border-radius:22px;background:linear-gradient(155deg, color-mix(in srgb, var(--tc) 34%, var(--bg2)), var(--bg2) 78%);border:1.5px solid color-mix(in srgb, var(--tc) 55%, var(--border2));box-shadow:0 0 0 4px color-mix(in srgb, var(--tc) 13%, transparent), 0 14px 34px rgba(0,0,0,.34);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:34px;color:#fff;flex-shrink:0;text-shadow:0 2px 10px rgba(0,0,0,.4);}
    .hero-info{flex:1;min-width:0;}
    .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
    .hero-name{font-family:'Playfair Display',serif;font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1.04;margin-bottom:11px;}
    .hero-team{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 9px;border:1px solid color-mix(in srgb, var(--tc) 32%, var(--border));border-radius:30px;background:color-mix(in srgb, var(--tc) 11%, var(--bg2));font-size:12.5px;font-weight:700;text-decoration:none;color:var(--text);transition:border-color .18s, background .18s;}
    .hero-team:hover{border-color:color-mix(in srgb, var(--tc) 60%, var(--border));background:color-mix(in srgb, var(--tc) 18%, var(--bg2));}
    .team-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px color-mix(in srgb, var(--tc) 80%, transparent);}
    .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;}
    .hero-meta-item{font-size:11.5px;font-weight:600;color:var(--text2);background:color-mix(in srgb, var(--tc) 8%, var(--bg2));border:1px solid var(--border);border-radius:30px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;}
    .hero-meta-item strong{color:var(--text);font-weight:800;}
    .hero-grade-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-left:6px;}
    .hero-grade{font-family:'Playfair Display',serif;font-weight:800;font-size:60px;line-height:.9;background:linear-gradient(155deg, color-mix(in srgb, var(--tc) 88%, #fff), var(--tc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 4px 18px color-mix(in srgb, var(--tc) 40%, transparent));}
    .hero-grade-lbl{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);}
    /* NBA Draft prospect sticker */
    .draft-sticker{display:inline-flex;align-items:center;gap:11px;margin-top:14px;padding:7px 16px 7px 11px;border-radius:30px;background:linear-gradient(100deg, color-mix(in srgb, var(--tc) 30%, var(--bg2)), var(--bg2) 80%);border:1px solid color-mix(in srgb, var(--tc) 50%, var(--border2));box-shadow:0 0 0 1px color-mix(in srgb, var(--tc) 16%, transparent), 0 6px 22px color-mix(in srgb, var(--tc) 20%, rgba(0,0,0,.32));animation:gradeStamp .55s .35s cubic-bezier(.34,1.46,.64,1) both;}
    .ds-rank{font-family:'Playfair Display',serif;font-weight:800;font-size:23px;line-height:1;background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 88%, #fff), var(--tc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    .ds-text{display:flex;flex-direction:column;line-height:1.18;}
    .ds-lbl{font-size:8.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);}
    .ds-pos{font-size:12px;font-weight:800;color:var(--text);}
    .ds-emoji{font-size:15px;}
    .gA{color:#071e5a;}.gB{color:#1040b8;}.gC{color:#4278d4;}.gD{color:#88aadd;}.gF{color:#b8cee8;}

    /* STAT TOGGLE */
    .stat-toggle{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border2);width:fit-content;}
    .stat-toggle-btn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border:none;background:none;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
    .stat-toggle-btn.active{background:var(--text);color:var(--bg);}

    /* TABS — animated */
    .tab-row{display:flex;border-bottom:1px solid var(--border);padding:0 40px;overflow-x:auto;scrollbar-width:none;}
    .tab-row::-webkit-scrollbar{display:none;}
    /* scroll-hint fade on the right when more tabs are off-screen */
    .tab-row-wrap{position:relative;}
    .tab-row-wrap::after{content:'';position:absolute;top:0;right:0;bottom:1px;width:48px;pointer-events:none;
      background:linear-gradient(to right, transparent, var(--bg));opacity:0;transition:opacity .2s;}
    .tab-row-wrap.more::after{opacity:1;}
    .tab-btn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Inter',sans-serif;transition:color .2s;white-space:nowrap;position:relative;}
    .tab-btn::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:center;transition:transform .25s cubic-bezier(.22,1,.36,1);}
    .tab-btn.active{color:var(--text);}
    .tab-btn.active::after{transform:scaleX(1);}
    .tab-btn:hover:not(.active){color:var(--text2);}
    .tab-panel{display:none;padding:28px 40px 60px;}
    .tab-panel.active{display:block;}
    @keyframes tabIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes tabOut{from{opacity:1;}to{opacity:0;transform:translateY(-5px);}}
    .tab-panel.entering{animation:tabIn .26s cubic-bezier(.22,1,.36,1) both;}
    .tab-panel.leaving{animation:tabOut .14s ease forwards;pointer-events:none;}

    /* STAT CARDS */
    .stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-bottom:24px;}
    .stat-card{border:1px solid var(--border);padding:12px 10px;text-align:center;position:relative;border-radius:8px;transition:border-color .2s ease, box-shadow .25s ease, background .25s ease;}
    .stat-card:hover{border-color:color-mix(in srgb, var(--tc) 55%, var(--border2));background:color-mix(in srgb, var(--tc) 8%, transparent);box-shadow:0 0 0 1px color-mix(in srgb, var(--tc) 28%, transparent), 0 6px 22px color-mix(in srgb, var(--tc) 16%, rgba(0,0,0,.28));}
    .stat-card-val{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1;margin-bottom:3px;}
    .stat-card-proj{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px;}
    .stat-card-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .stat-card-diff{font-size:10px;font-weight:700;margin-top:3px;}
    /* merged last-year → projected card */
    .sc-merge{display:flex;align-items:baseline;justify-content:center;gap:5px;margin-top:6px;white-space:nowrap;}
    .sc-last{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--text3);}
    .sc-arrow{font-size:11px;font-weight:700;color:var(--text3);}
    .sc-proj{font-family:'Playfair Display',serif;font-weight:800;font-size:21px;line-height:1;color:var(--accent);}
    .stat-card .stat-card-label.top{margin-bottom:0;}
    /* IMPACT SCORE */
    .impact-wrap{border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:26px;background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 9%, var(--bg2)), var(--bg2) 70%);position:relative;overflow:hidden;}
    .impact-head{display:flex;align-items:center;gap:18px;margin-bottom:14px;}
    .impact-num{font-family:'Playfair Display',serif;font-weight:800;font-size:52px;line-height:.9;background:linear-gradient(150deg, color-mix(in srgb,var(--tc) 88%,#fff), var(--tc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    .impact-num span{font-size:18px;color:var(--text3);-webkit-text-fill-color:var(--text3);}
    .impact-meta{flex:1;}
    .impact-rank{font-size:14px;font-weight:800;color:var(--text);}
    .impact-pctl{font-size:11px;font-weight:600;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}
    .impact-bar{height:8px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-bottom:18px;}
    .impact-bar .impact-fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg, color-mix(in srgb,var(--tc) 60%,#fff), var(--tc));}
    .impact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;}
    .imp-card{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 12px;}
    .imp-card-l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .imp-card-v{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;line-height:1;color:var(--text);margin-bottom:8px;}
    .imp-card-bar{height:4px;border-radius:3px;background:var(--bg3);overflow:hidden;}
    .imp-card-bar .impact-fill{display:block;height:100%;border-radius:3px;}
    .impact-fill{transition:width .85s cubic-bezier(.22,1,.36,1);}
    /* PLAYER SPECTRUM */
    .spec-wrap{border:1px solid var(--border);border-radius:12px;padding:18px 20px 20px;margin-bottom:26px;background:var(--bg2);}
    .spec-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .spec-sel{padding:8px 12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--text);outline:none;cursor:pointer;}
    .spec-sel:focus{border-color:var(--accent);}
    .spec-vs{font-size:12px;font-weight:700;color:var(--text3);}
    .spec-poles{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;}
    .spec-poles b{color:var(--text2);}
    .spec-mid{color:var(--text3);}
    @media(max-width:560px){.spec-mid{display:none;}}
    .spec-band{position:relative;height:230px;border-radius:10px;overflow:hidden;background:linear-gradient(90deg, rgba(79,147,196,.10), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, rgba(224,130,60,.10));border:1px solid var(--border);}
    .spec-band::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;border-left:1px dashed var(--border2);}
    .spec-dot{position:absolute;width:11px;height:11px;border-radius:50%;opacity:.5;transform:translate(-50%,-50%);transition:opacity .2s;}
    .spec-dot.me{width:20px;height:20px;opacity:1;z-index:5;border:2px solid var(--bg);}
    .spec-melabel{position:absolute;top:calc(50% - 22px);transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--text);background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:3px 8px;white-space:nowrap;z-index:6;}
    .spec-splitlbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;}
    .spec-split{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
    .spec-pct{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;flex-shrink:0;}
    .spec-pct.l{color:#4f93c4;} .spec-pct.r{color:#e0823c;}
    .spec-bar{flex:1;height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--bg3);}
    .spec-bar i{display:block;height:100%;transition:width .7s cubic-bezier(.22,1,.36,1);}
    .spec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .spec-card{border:1px solid var(--border);border-radius:10px;padding:13px 14px;background:var(--bg);}
    .spec-card.l{border-top:2px solid #4f93c4;} .spec-card.r{border-top:2px solid #e0823c;}
    .spec-card-l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .spec-card-v{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;line-height:1;}
    .spec-card-s{font-size:10px;font-weight:600;color:var(--text3);margin-top:6px;}
    .stat-card-diff.up{color:var(--green);}.stat-card-diff.dn{color:var(--red);}.stat-card-diff.eq{color:var(--text3);}

    /* FULL STAT TABLE */
    .sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .stat-table{width:100%;border-collapse:collapse;min-width:680px;}
    .stat-table th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 8px;border-bottom:2px solid var(--border2);text-align:right;white-space:nowrap;}
    .stat-table th:first-child{text-align:left;}
    .stat-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;text-align:right;white-space:nowrap;}
    .stat-table td:first-child{text-align:left;font-weight:700;}
    .stat-table tr.actual td{color:var(--text2);}
    .stat-table tr.proj td{color:var(--accent);}
    .stat-table tr.proj td:first-child{color:var(--accent);}

    /* PERCENTILE BARS */
    /* PERCENTILE DISTRIBUTION CARDS */
    .dist-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
    .dist-controls .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;}
    .dist-controls .seg button{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--text3);background:transparent;border:none;cursor:pointer;padding:7px 14px;border-radius:6px;transition:all .15s;white-space:nowrap;}
    .dist-controls .seg button.on{background:var(--accent);color:#fff;}
    [data-theme="dark"] .dist-controls .seg button.on{color:#0a0710;}
    .dist-cap{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
    .dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
    .dist-card{border:1px solid var(--border);border-radius:11px;padding:15px 17px 12px;background:var(--bg2);}
    .dist-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
    .dist-name{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);}
    .dist-rank{font-size:11px;font-weight:600;color:var(--text3);text-align:right;line-height:1.35;}
    .dist-rank b{font-weight:800;}
    .dist-rank span{display:block;font-size:10px;color:var(--text3);}
    .dist-val{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;line-height:1;margin-bottom:6px;}
    .dist-svg{width:100%;height:84px;display:block;}
    .dist-axis{display:flex;justify-content:space-between;font-size:9.5px;font-weight:600;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums;}
    @media(max-width:620px){.dist-grid{grid-template-columns:1fr;}}
    .pct-wrap{margin-bottom:28px;}
    .pct-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .pct-label{font-size:12px;font-weight:600;color:var(--text3);width:52px;flex-shrink:0;text-align:right;}
    .pct-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:visible;position:relative;}
    .pct-fill{height:100%;border-radius:4px;transition:width .5s ease;}
    .pct-val{font-size:12px;font-weight:700;width:38px;text-align:right;flex-shrink:0;}
    .pct-pct{font-size:11px;font-weight:600;color:var(--text3);width:36px;flex-shrink:0;}

    /* RADAR / SPIDER CHART */
    .radar-wrap{display:flex;justify-content:center;margin-bottom:28px;}
    .prog-section{margin-bottom:28px;}
    .prog-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 8px 4px;margin-top:8px;max-width:860px;margin-left:auto;margin-right:auto;}
    .prog-legend{display:flex;gap:18px;align-items:center;font-size:11px;font-weight:600;color:var(--text2);}
    .prog-legend i{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:6px;}
    .prog-legend .pl-line{border-top:2.5px solid var(--accent);}
    .prog-legend .pl-base{border-top:2px dashed var(--text3);opacity:.6;}
    .radar-wrap canvas{width:100%;max-width:600px;height:auto;}
    .radar-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px;}
    .radar-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;user-select:none;padding:3px 7px;border-radius:6px;transition:background .12s,opacity .12s;}
    .radar-legend-item:hover{background:var(--bg2);color:var(--text2);}
    .radar-legend-item.off{opacity:.4;}
    .radar-legend-item.off .radar-legend-dot{filter:grayscale(1);}
    .radar-legend-dot{width:10px;height:10px;border-radius:50%;}

    /* SCOUTING REPORT — enhanced */

function getProjSchoolConf(school){
  if(!school) return null;
  const lo=school.toLowerCase().trim();
  if(PROJ_SCHOOL_CONF[lo]) return PROJ_SCHOOL_CONF[lo];
  // Fuzzy match
  for(const k of Object.keys(PROJ_SCHOOL_CONF)){
    if(lo.includes(k)||k.includes(lo)) return PROJ_SCHOOL_CONF[k];
  }
  return null;
}

function getSchoolConfFallback(school){ return getProjSchoolConf(school); }

function getProjTransFactor(originConf, destConf, grade){
  if(!originConf||!destConf||originConf===destConf) return 1.0;
  const ot=PROJ_CONF_TIERS[originConf]||4, dt=PROJ_CONF_TIERS[destConf]||4;
  if(ot===dt) return 1.0;
  // ACC special case going down conferences
  const base=originConf==='ACC'?PROJ_ACC_OUT[dt]||1.0:(PROJ_TRANS_MAT[ot]||{})[dt]||1.0;
  const g=parseFloat(grade)||70;
  // Grade boost: elite players translate better going up in conference
  // Grade penalty: lower-grade players struggle MORE going up
  const boost=g>=90?1.22:g>=85?1.14:g>=80?1.07:g>=75?1.02:g>=70?0.97:g>=65?0.91:0.85;
  return Math.max(0.20,Math.min(1.6,base*boost));
}

// ── POSITION FIT ENGINE ─────────────────────────────────────────────────────
// Determines if a player is deployed at their primary or secondary position.
// If a player has position2 and their primary slot is already occupied by someone
// with a lower depth_order, but the secondary slot is open → deployed at secondary.
function getDeployedPos(p, roster) {
  const pos1 = (p.position  || 'G').replace(/\d/g,'').trim();
  const pos2 = (p.position2 || '').replace(/\d/g,'').trim();
  if (!pos2 || !['PG','SG','SF','PF','C'].includes(pos2)) return pos1;

  const dOrder = p.depth_order || 99;

  // How many players share pos1 AND rank higher in depth order?
  const pos1Ahead = roster.filter(r =>
    r.name && r.name !== '—' && r.name !== p.name &&
    (r.position||'G').replace(/\d/g,'').trim() === pos1 &&
    (r.depth_order||99) < dOrder
  ).length;

  // How many players have pos2 as their PRIMARY and rank higher?
  const pos2Ahead = roster.filter(r =>
    r.name && r.name !== '—' && r.name !== p.name &&
    (r.position||'G').replace(/\d/g,'').trim() === pos2 &&
    (r.depth_order||99) < dOrder
  ).length;

  // Deployed at secondary if primary slot is occupied AND secondary is open ahead of them
  return (pos1Ahead >= 1 && pos2Ahead === 0) ? pos2 : pos1;
}


function applyPredictionWalls(projected){
  const active=projected.filter(p=>!p._dnp&&!p._injured&&(parseFloat(p.ppg||0)>0||p._noStatEst));

  const stlScale=rawStl>0?tgtStl/rawStl:1,blkScale=rawBlk>0?tgtBlk/rawBlk:1;

    if(p._dnp||p._injured||(!parseFloat(p.ppg||0)&&!p._noStatEst)) return p;
    const sp={...p};
    if(ppgScale!==1){sp.ppg=r1(parseFloat(p.ppg||0)*ppgScale);sp.fgm=r1(parseFloat(p.fgm||0)*ppgScale);sp.fga=r1(parseFloat(p.fga||0)*ppgScale);sp.tpm=r1(parseFloat(p.tpm||0)*ppgScale);sp.tpa=r1(parseFloat(p.tpa||0)*ppgScale);sp.ftm=r1(parseFloat(p.ftm||0)*ppgScale);sp.fta=r1(parseFloat(p.fta||0)*ppgScale);}
    if(orebScale!==1) sp.oreb=r1(parseFloat(p.oreb||0)*orebScale);
    if(drebScale!==1) sp.dreb=r1(parseFloat(p.dreb||0)*drebScale);
    sp.rpg=r1((parseFloat(sp.oreb||0))+(parseFloat(sp.dreb||0)));
    if(apgScale!==1) sp.apg=r1(parseFloat(p.apg||0)*apgScale);
    if(tovScale!==1) sp.tovs=r1(parseFloat(p.tovs||0)*tovScale);
    if(stlScale!==1) sp.stl=r1(parseFloat(p.stl||0)*stlScale);
    if(blkScale!==1) sp.blk=r1(parseFloat(p.blk||0)*blkScale);
    return sp;
  });
}

function buildTeamProjections(players, conf){
  const roster = players
    .filter(p => p.name && p.name !== '—')
    .sort((a,b) => (a.depth_order||99)-(b.depth_order||99));

  // Injured players: zero stats, excluded from minute distribution
  const injuredDnp = roster
    .filter(p => p.is_injured)
    .map(p => ({...p, ppg:0, rpg:0, apg:0, mpg:0, fgm:0, fga:0, tpm:0, tpa:0,
      ftm:0, fta:0, oreb:0, dreb:0, stl:0, blk:0, tovs:0, _dnp:true, _injured:true}));

  if(!roster.length) return [];

  const r1 = v => v!=null ? Math.round((v+Number.EPSILON)*10)/10 : null;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

  const projected = roster.map(p => {
    const yr     = (p.yr||p.class_year||'').toLowerCase();
    const isFr   = yr.includes('fr.')||yr.includes('r-fr');
    const isSo   = yr.includes('so.')||yr.includes('r-so.');
    const isJr   = yr.includes('jr.')||yr.includes('r-jr.');
    const isSr   = yr.includes('sr.')||yr.includes('r-sr')||yr.includes('gr.');
    const grade  = parseFloat(p.tdc_grade)||70;
    const pos    = (p.position||'G').replace(/\d/g,'').trim();
    const posNorm= ['PG','SG','SF','PF','C'].includes(pos)?pos:pos==='CG'?'SG':'G';
    const isBig  = pos==='C'||pos==='PF';
    const isGuard= pos==='PG'||pos==='SG'||pos==='CG';

    const deployedPos = getDeployedPos(p, roster);
    const isOutOfPos  = !!(p.position2 && deployedPos !== pos);
    const posFitMult  = p.position2 ? (isOutOfPos ? 0.97 : 1.02) : 1.0;

    const key    = (p.name||'').toLowerCase().trim();
    const history= (window._careerHistoryMap&&window._careerHistoryMap[key])||[];

    const played = history
      .filter(h => !h.sat_out && parseFloat(h.ppg||0)>0 && parseFloat(h.mpg||0)>=6)
      .sort((a,b) => b.season_year - a.season_year);

    const meaningful = played.filter(h => parseFloat(h.mpg||0)>=12);
    const latestH    = played[0]||null;

    // No anchoring to actual previous MPG — a transfer C who played 22 MPG due to
    // foul trouble can project for more; a PG at 35 MPG can project for less
    // if the team added competition. Let the roster context decide.
    const newMpg    = computePlayerMpg(p, roster);
    const actualMpg = parseFloat(p.mpg||0)||0;

    const hasCareerStats  = latestH && parseFloat(latestH.ppg||0)>0;
    const hasCurrentStats = parseFloat(p.ppg||0)>0;

    // A negligible sample (e.g. <6 MPG with no meaningful prior season) can't be trusted —
    // its noisy per-minute rates explode when projected into a real role (a 4-minute player

    const tinySample = !hasCareerStats && hasCurrentStats && (parseFloat(p.mpg||0)||0) < 6;
    if((!hasCareerStats && !hasCurrentStats) || tinySample){

                   : newMpg < 20 ? Math.min(22, newMpg*(grade>=87?1.15:1.08))
                   : newMpg;
      const scale  = effMpg/FR_BASE_MPG;
      // FGA rate: more bullish for elite recruits — they earn real looks from day 1
      const fgaRate = grade>=92 ? 0.42 : grade>=87 ? 0.37 : grade>=78 ? 0.31 : 0.27;
      const fga     = r1(newMpg*fgaRate);
      const fgm_fr  = r1(fga*(fb.fg_pct/100));
      const tpm_fr  = r1(fga*0.42*(fb.tp_pct/100));
      const fta_fr  = r1(newMpg*0.10);
      const ftm_fr  = r1(fta_fr*(fb.ft_pct/100));
      // PPG derived from components — consistent with rest of model
      const ppg_fr  = r1(fgm_fr*2 + tpm_fr + ftm_fr);
      return {...p,
        ppg: ppg_fr, rpg: r1((fb.oreb+fb.dreb)*scale), apg: r1(fb.apg*scale),
        mpg: r1(newMpg),
        fgm: fgm_fr, fga, fg_pct: fb.fg_pct,
        tpm: tpm_fr, tpa: r1(fga*0.42), tp_pct: fb.tp_pct,
        fta: fta_fr, ftm: ftm_fr, ft_pct: fb.ft_pct,
        oreb: r1(fb.oreb*scale), dreb: r1(fb.dreb*scale),
        stl: r1(fb.stl*scale), blk: r1(fb.blk*scale), tovs: r1(fb.tovs*scale),
        _frosh:true, _noStatEst:true, _deployedPos:deployedPos, _posFit:posFitMult,
      };
    }

    const base    = hasCareerStats ? latestH : p;
    const baseMpg = Math.max(1, parseFloat(base.mpg||0)||1);
    const g = k => parseFloat(base[k]||0)||0;

    const orebBase = g('oreb');
    const drebBase = g('dreb');
    const rpgBase  = (orebBase+drebBase) > 0 ? orebBase+drebBase : g('rpg');

    const pm = {
      ppg:  g('ppg')/baseMpg,  rpg:  rpgBase/baseMpg,   apg:  g('apg')/baseMpg,
      fgm:  g('fgm')/baseMpg,  fga:  g('fga')/baseMpg,
      tpm:  g('tpm')/baseMpg,  tpa:  g('tpa')/baseMpg,
      ftm:  g('ftm')/baseMpg,  fta:  g('fta')/baseMpg,
      oreb: orebBase/baseMpg,  dreb: drebBase/baseMpg,
      stl:  g('stl')/baseMpg,  blk:  g('blk')/baseMpg,  tovs: g('tovs')/baseMpg,
    };

    let trendMult = 1.0;
    if(meaningful.length >= 2){
      const n=meaningful[0], p2=meaningful[1];
      const nPm=parseFloat(n.ppg||0)/Math.max(1,parseFloat(n.mpg||1));
      const pPm=parseFloat(p2.ppg||0)/Math.max(1,parseFloat(p2.mpg||1));
      if(pPm>0){
        const rt=nPm/pPm;
        const mpgGrowth=parseFloat(n.mpg||0)/Math.max(1,parseFloat(p2.mpg||0));
        const isBreakout=rt>=1.40&&mpgGrowth>=1.20;
        const cap=isBreakout?0.15:0.10;
        trendMult=1.0+Math.max(-cap,Math.min(cap,(rt-1)*0.35));
      }
    } else if(meaningful.length===1&&played.length>=2){
      const n=meaningful[0],p2=played.find(h=>h!==n);
      if(p2){
        const nPm=parseFloat(n.ppg||0)/Math.max(1,parseFloat(n.mpg||1));
        const pPm=parseFloat(p2.ppg||0)/Math.max(1,parseFloat(p2.mpg||1));
        if(pPm>0&&nPm/pPm>=1.5) trendMult=1.06;
      }
    }
    // Cap trend for upperclassmen — seniors don't suddenly spike, jrs get moderate ceiling
    if(isSr) trendMult = Math.min(1.05, trendMult);
    else if(isJr) trendMult = Math.min(1.08, trendMult);

    const isTransferIn = !!(p.hometown && p.hometown.trim());
    const isReturnee   = !isTransferIn;
    // Year progression is grade-sensitive for seniors:
    // Elite Sr (87+): still developing ceiling, e.g. projected NBA picks → modest bump
    // Good Sr (80-86): minimal progression — mostly established
    // Role Sr (<80): plateaued — project at per-minute rate only
    const srYr       = grade>=87 ? 1.02 : grade>=80 ? 1.01 : 1.0;
    const srReturn   = isReturnee ? (grade>=85 ? 1.01 : 1.0) : 1.0;
    const returnBoost  = isReturnee ? (isSr ? srReturn : isJr?1.02 : isSo?1.04 : 1.02) : 1.0;
    const transferTrim = isTransferIn ? 0.96 : 1.0;
    const yrMult = (isSo?1.06 : isJr?1.03 : isSr?srYr : 1.04) * returnBoost * transferTrim;

    const gradeExpPpg = grade>=90?19:grade>=85?16:grade>=80?13:grade>=75?10:grade>=70?8:6;
    const statsPer32  = pm.ppg*32;
    const gapRatio    = gradeExpPpg>0 ? statsPer32/gradeExpPpg : 1;
    // Raw gap: how far player is from their grade expectation
    const gapMultRaw  = gapRatio<0.50?1.14:gapRatio<0.65?1.09:gapRatio<0.80?1.05
                      : gapRatio<0.95?1.02:gapRatio>1.40?0.96:gapRatio>1.20?0.98:1.0;
    // Upperclassmen have found their level — don't push them toward a grade ceiling they may never hit
    // Fr/So: full gap adjustment (still developing)
    // Jr: 40% of adjustment (mostly established)
    // Sr/Gr: 15% of adjustment (this IS their level)
    const gapMult = isSr ? 1.0+(gapMultRaw-1)*0.15
                  : isJr ? 1.0+(gapMultRaw-1)*0.40
                  : gapMultRaw;

    const rateGrowth = yrMult * gapMult * trendMult;

    let transferFactor = 1.0;
    if(p.hometown && p.hometown.trim()){
      const originConf = getProjSchoolConf(p.hometown)||getSchoolConfFallback(p.hometown);
      if(originConf && conf) transferFactor = getProjTransFactor(originConf, conf, grade);
    }

    // Percentage adjustment from conference difficulty
    const transPctAdj = transferFactor<0.75?-3.5:transferFactor<0.85?-2.5
                      : transferFactor<0.92?-1.5:transferFactor<0.97?-0.8
                      : transferFactor>1.20?+1.2:transferFactor>1.10?+0.8
                      : transferFactor>1.04?+0.4:0;

    // RPG conference adjustment: stronger competition = fewer easy boards
    const rpgConfAdj = isTransferIn ? (
      isBig  ? (transferFactor<0.80?-1.2:transferFactor<0.90?-0.7:transferFactor<0.96?-0.3:transferFactor>1.15?+0.6:0)
             : (transferFactor<0.80?-0.5:transferFactor<0.90?-0.2:transferFactor>1.15?+0.3:0)
    ) : 0;

    // APG conference adjustment: tighter defense = fewer assist opportunities
    const apgConfAdj = isTransferIn ? (
      isGuard ? (transferFactor<0.80?-1.0:transferFactor<0.90?-0.5:transferFactor<0.96?-0.2:transferFactor>1.15?+0.5:0)
              : (transferFactor<0.80?-0.4:transferFactor<0.90?-0.2:transferFactor>1.15?+0.2:0)
    ) : 0;

    // Recency-weighted career avg: latest season 70%, older seasons 30% (split equally).
    // Prevents a weak freshman year from dragging down a breakout sophomore's projection.
    const recencyAvg=(arr,key)=>{
      if(!arr.length) return 0;
      if(arr.length===1) return parseFloat(arr[0][key]||0);
      const latest=parseFloat(arr[0][key]||0);
      const restAvg=arr.slice(1).reduce((s,h)=>s+parseFloat(h[key]||0),0)/arr.slice(1).length;
      return arr.length===2?latest*0.70+restAvg*0.30:latest*0.60+restAvg*0.40;
    };

    // FG%: recency-weighted career smooth, lean heavily on most recent season
    const fgBase      = parseFloat(base.fg_pct||0)||44;
    const careerFgPct = meaningful.length>=2 ? recencyAvg(meaningful,'fg_pct') : fgBase;
    const fgSmoothed  = fgBase*0.65 + careerFgPct*0.35;

    const tpBase = meaningful.length
      ? (meaningful.length>=2 ? recencyAvg(meaningful,'tp_pct') : parseFloat(meaningful[0].tp_pct||0))
      : (parseFloat(base.tp_pct||0)||parseFloat(p.tp_pct||0)||33);

    const ftBase      = parseFloat(base.ft_pct||0)||70;
    const careerFtPct = meaningful.length>=2 ? recencyAvg(meaningful,'ft_pct') : ftBase;
    const ftSmoothed  = ftBase*0.70 + careerFtPct*0.30;

    const oldFga     = parseFloat(base.fga||0)||1;
    const newFgaE    = oldFga*(newMpg/baseMpg);
    const volChange  = (baseMpg>=12) ? (newFgaE/oldFga-1) : 0;
    const volPenalty = volChange*3.5;
    const yearEff    = isSo?1.2:isJr?0.6:isSr?0.0:1.8;

    // Role-reduction efficiency boost: returning players in reduced shot volume
    // take only their best shots → FG% rises. High-assist PGs also benefit
    // from playing within a system (they create easier looks for themselves too).
    // Not for transfers stepping up — they're still adjusting.
    const roleVolDrop = (isReturnee && baseMpg >= 15 && volChange < -0.12);
    const roleEffBoost = roleVolDrop ? Math.min(2.5, Math.abs(volChange) * 12) : 0;
    const pgSystemBoost = (pos==='PG' && parseFloat(p.apg||0)>=4 && isReturnee && !isTransferIn && !isFr)
      ? 1.0 : 0;

    const fgProj = r1(clamp(fgSmoothed + yearEff - volPenalty + transPctAdj + roleEffBoost + pgSystemBoost, 30, 65));

    const careerTpa  = meaningful.length
      ? meaningful.reduce((s,h)=>s+parseFloat(h.tpa||0),0)/meaningful.length
      : parseFloat(base.tpa||0);
    const is3Shooter = careerTpa >= 0.5;
    const tpProj = is3Shooter
      ? r1(clamp(tpBase+(isSo?0.8:isJr?0.4:isSr?0:1.5)-(volChange*2)+transPctAdj*0.6, 20, 50))
      : tpBase;
    const ftProj = r1(clamp(ftSmoothed+(isSo?1.0:isJr?0.5:isSr?0:1.5), 45, 97));

    // Shot volume scales with minutes only — rateGrowth should not inflate attempts/min.
    // Year progression means better efficiency on the same shots, not more shots per minute.
    const newFga = r1(pm.fga*newMpg);
    const newTpa = r1(pm.tpa*newMpg);

    const pf     = posFitMult;
    // Derive all stats from components so PPG is always consistent with FGA.
    // Year progression shows through efficiency (fgProj) not shot-volume inflation.
    const fgm_v  = r1(newFga*(fgProj/100)*pf);
    const tpm_v  = r1(newTpa*(tpProj/100)*pf);
    const fta_v  = r1(pm.fta*newMpg*pf);
    const ftm_v  = r1(fta_v*(ftProj/100));
    // PPG from components: 2×FGM + bonus point per 3PM + FTM
    const ppg_comp = fgm_v*2 + tpm_v + ftm_v;
    // PPG floor: per-minute scoring rate × new minutes × rateGrowth.
    // Catches cases where player_history FTA is incomplete (under-projects free throws).
    const ppgFloorMult = grade>=90?0.95:grade>=83?0.91:0.88;
    const ppg_floor = pm.ppg * rateGrowth * newMpg * pf * ppgFloorMult;

    // Transfer scoring volume penalty for big conference jumps.
    // transPctAdj hits FG% but per-minute scoring also drops in stronger competition.
    // e.g. Winthrop → ACC: grade 84 player who scored 18 PPG won't replicate that rate.
    const scoringTransMult = (isTransferIn && transferFactor < 0.90)
      ? Math.max(0.78, 0.50 + transferFactor * 0.60)
      : 1.0;

    const ppg_v  = r1(Math.max(ppg_comp, ppg_floor) * scoringTransMult);

    const rawRpg = r1(pm.rpg*rateGrowth*newMpg*pf);
    const rawApg = r1(pm.apg*rateGrowth*newMpg*pf);

    return {...p,
      ppg:  ppg_v,
      rpg:  r1(Math.max(0, rawRpg + rpgConfAdj)),
      apg:  r1(Math.max(0, rawApg + apgConfAdj)),
      mpg:  r1(newMpg),
      fgm:  fgm_v, fga: r1(newFga*pf), fg_pct:fgProj,
      tpm:  tpm_v,  tpa: r1(newTpa*pf), tp_pct:tpProj,
      ftm:  ftm_v,  fta: fta_v,         ft_pct:ftProj,
      oreb: r1(pm.oreb*rateGrowth*newMpg*pf),
      dreb: r1(pm.dreb*rateGrowth*newMpg*pf),
      stl:  r1(pm.stl *rateGrowth*newMpg*pf),
      blk:  r1(pm.blk *rateGrowth*newMpg*pf),
      // Turnovers: don't use rateGrowth — experience improves ball security.
      // Expanded roles get a proportional increase; same/reduced roles get a slight cut.
      // baseMpg already defined above from the career/current base season.
      tovs: r1((()=>{
        const roleRatio = baseMpg > 0 ? newMpg/baseMpg : 1;
        // Returning players in same/smaller role: veteran experience = fewer TOs
        const tovBase = pm.tovs * newMpg * pf;
        if(isTransferIn){
          // Transfers adjusting to new system: modest bump
          return tovBase * (roleRatio > 1.15 ? 1.05 : 1.0);
        }
        if(roleRatio > 1.20){
          // Clearly expanded role: more possessions, more responsibility → more TOs
          // But experience still helps — scale is gentler than the role expansion
          const expFactor = 1.0 + (roleRatio - 1.0) * 0.30;
          return tovBase * Math.min(1.25, expFactor);
        }
        // Same or reduced role: veterans protect the ball better each year
        const expCut = isSr ? 0.90 : isJr ? 0.93 : isSo ? 0.96 : 1.0;
        return tovBase * expCut;
      })()),
      _frosh:false, _factor:transferFactor, _trend:trendMult, _seasons:played.length,
      _deployedPos:deployedPos, _posFit:posFitMult,
    };
  }).filter(Boolean);

  // ── SHOT VOLUME CAP (bench-first) ────────────────────────
  // Teams take ~62-76 FGA per game. When over, bench players absorb
  // the cut first — starters keep their projections. Only if starters
  // alone exceed the cap do they get a light proportional trim.
  // FG%/3P%/FT% never touched — only shot volume scales.
  const fgaCap  = 76;
  const bySlt   = [...projected].sort((a,b)=>(a.depth_order||99)-(b.depth_order||99));
  const totalFga= bySlt.reduce((s,p)=>s+(parseFloat(p.fga)||0),0);

  if(totalFga > fgaCap){
    const scale = (p, vol) => {
      p.fgm = r1(p.fgm*vol); p.fga = r1(p.fga*vol);
      p.tpm = r1(p.tpm*vol); p.tpa = r1(p.tpa*vol);
      p.ftm = r1(p.ftm*vol); p.fta = r1(p.fta*vol);
      p.ppg = r1(p.fgm*2 + p.tpm + p.ftm);
    };

    const starters   = bySlt.slice(0,5);
    const bench      = bySlt.slice(5);
    const starterFga = starters.reduce((s,p)=>s+(parseFloat(p.fga)||0),0);
    const benchFga   = bench.reduce((s,p)=>s+(parseFloat(p.fga)||0),0);

    if(starterFga >= fgaCap){
      // Loaded starting 5 alone fills the cap — trim everything proportionally
      const vol = fgaCap/totalFga;
      bySlt.forEach(p => scale(p, vol));
    } else {
      // Bench takes the full cut — starters untouched
      const benchBudget = Math.max(6, fgaCap - starterFga);
      if(benchFga > benchBudget){
        const vol = benchBudget/benchFga;
        bench.forEach(p => scale(p, vol));
      }
    }
  }

  return [...projected, ...injuredDnp];
}

  var R1=function(x){return Math.round(x*10)/10;};
  // ── TEAM ROLE (depth chart + projected minutes) ──
  var dord=parseInt(p.depth_order)||9, role, roleDesc;

  // ── PROJECTED JUMP / DECLINE vs last season ──
  var lastPpg=parseFloat(p.ppg)||0, lastMpg=parseFloat(p.mpg)||0, jumpDir='flat', jumpText='';
  if(proj&&(proj._frosh||proj._noStatEst)){jumpDir='new';jumpText='No prior college production — projection built from a '+pos+' baseline and his TDC grade ('+grade+'). Expect higher variance.';}
  else if(proj&&proj._origin){jumpDir='transfer';jumpText='Transfer from '+proj._origin+' — last year’s output re-scaled for a new level of competition.';}
  else if(useProj&&lastMpg>0){
    var dPpg=R1(ppg-lastPpg), dMpg=Math.round(mpg-lastMpg);
    if(dMpg>=6||dPpg>=4){jumpDir='up';jumpText='Projected leap — role expands (+'+dMpg+' MPG) and scoring climbs '+(dPpg>0?'+':'')+dPpg+' PPG over last season.';}
    else if(dMpg<=-6||dPpg<=-3){jumpDir='down';jumpText='Projected step back — a reduced role ('+dMpg+' MPG) trims his counting stats from last year.';}

  // ── FLOOR / CEILING: statistical scoring range + tier outlook ──
  var variance=(proj&&(proj._frosh||proj._noStatEst))?0.40:(proj&&proj._origin)?0.27:isFr?0.32:isSo?0.24:isJr?0.18:0.14;
  // Ceiling upside is capped and diminishes for high scorers — a high projection

  // production index — both grade AND output must justify a tier (stops over/under-hyping)

  else if(grade>=90&&ppg>=14){ceiling='First-Team All-Conference';ceilingDesc='Carries a first-team all-conference ceiling and pro radar in a big season — up to ~'+ceilPpg+' PPG.';}
  else if(grade>=85&&ppg>=12){ceiling='All-Conference';ceilingDesc='An all-conference ceiling with a strong, healthy year — up to ~'+ceilPpg+' PPG.';}
  else if(grade>=80&&ppg>=10){ceiling='All-Conference Fringe';ceilingDesc='Conference recognition is in range if he takes a step — up to ~'+ceilPpg+' PPG.';}

  else if(starterish||grade>=70){ceiling='Rotation Starter';ceilingDesc='Upside is a spot starter / high-rotation role — up to ~'+ceilPpg+' PPG.';}
  else {ceiling='Rotation Piece';ceilingDesc='Upside is a defined bench role — up to ~'+ceilPpg+' PPG.';}
  // FLOOR — grade + established role lift the floor so vets aren't under-sold
  if(grade>=96){floor='All-American Floor';floorDesc='An elite profile that rarely busts — even a quiet year is an all-conference-level season (~'+floorPpg+' PPG).';}
  else if(grade>=91&&starterish){floor='All-Conference Floor';floorDesc='A proven high-end starter who stays a conference standout at worst (~'+floorPpg+' PPG).';}
  else if(grade>=86&&starterish){floor='High-End Starter';floorDesc='A reliable, high-level starter even in a down year (~'+floorPpg+' PPG).';}
  else if(grade>=81&&starterish){floor='Solid Starter';floorDesc='A dependable starter floor near ~'+floorPpg+' PPG.';}
  else if(grade>=75||starterish){floor='Rotation Player';floorDesc='Settles in as a rotation contributor (~'+floorPpg+' PPG) at worst.';}
  else if(grade>=70){floor='Bench Contributor';floorDesc='A bench role with situational minutes is the realistic downside.';}

  var roleFit = grade>=88?'Starter / Star':grade>=80?'Starting Caliber':grade>=72?'Rotation Player':'Bench Contributor';

  var draftOutlook='', draftNote='';

  else if(grade>=90&&(isFr||isSo||isJr)){draftOutlook='Draft Prospect';draftNote='High-end grade and age suggest pro-level athleticism. A strong season could earn draft board attention.';}
  else if(grade>=85&&(isFr||isSo)){draftOutlook='One to Watch';draftNote='Physical tools are there. Development arc will determine professional viability.';}

  var comparable='';

  else if(archetype==='Scoring Guard')comparable='Off-guard scoring specialist';
  else if(archetype==='Scoring Point Guard')comparable='Ball-dominant scoring PG';
  else if(archetype==='Floor General')comparable='Pass-first PG prototype';
  else if(archetype==='3-and-D Wing')comparable='Modern role-player archetype';
  else if(archetype==='Stretch Big')comparable='Modern 4/5 hybrid prototype';

  var projNote='';
  if(proj){
    if(proj._frosh){projNote='Freshman projection based on '+pos+' baseline and TDC grade '+grade+'. High variance expected.';}
    else if(proj._origin){

      else if(yr.includes('jr.'))projNote='Junior-to-senior projection — peak years, modest improvement expected.';
      else projNote='Returning veteran — projection based on role continuity and career trend.';

  var scoutScore = Math.round(Math.min(100, Math.max(0,
    (grade-60)/37*60 + ppg/22*15 + (fg-38)/20*10 + (stl+blk)/3*8 + apg/8*7

  var clamp=function(x){return Math.round(Math.max(0,Math.min(100,x)));};
  // position-aware defensive weighting — guards lean steals, bigs lean blocks
  var dStl=isGuard?0.72:isBig?0.30:0.52, dBlk=isGuard?0.28:isBig?0.70:0.48;
  // Overall IS the grade. Every other slider is anchored to the grade so the

  scoutScore=clamp(grade);
  var anchor=function(raw){return clamp(0.55*grade + 0.45*raw);};
  var offRtg=anchor(0.55*gp('ppg',ppg)+0.25*gp('apg',apg)+0.20*gp('tp_pct',tp));
  var defRtg=anchor(dStl*gp('stl',stl)+dBlk*gp('blk',blk));

  return {
    archetype:archetype, archetypeDesc:archetypeDesc,
    strengths:strengths, weaknesses:weaknesses, tags:tags, projNote:projNote,
    floor:floor, ceiling:ceiling, floorDesc:floorDesc, ceilingDesc:ceilingDesc,
    roleFit:roleFit, draftOutlook:draftOutlook, draftNote:draftNote,

    role:role, roleDesc:roleDesc, jumpText:jumpText, jumpDir:jumpDir,
    floorPpg:floorPpg, projPpg:projPpg, ceilPpg:ceilPpg,

}
function scoutRangeBar(f,pj,c){

// ── SKILL BREAKDOWN ─────────────────────────────────────
function buildSkillBreakdown(p){
  // blue gradient by percentile — deeper blue = higher (matches the database)
  function barColor(pct){
    return pct>=80?'rgb(18,60,185)':pct>=60?'rgb(30,82,200)':pct>=40?'rgb(45,100,210)':pct>=20?'rgb(70,135,225)':'rgb(110,160,230)';
  }
  // grade vs the PROJECTED line where available (graduated → their last actual)
  var src=(proj&&!proj._frosh)?proj:p;
  var projected=(proj&&!proj._frosh);
  var metrics=[
    {l:'PPG',k:'ppg',   v:src.ppg,   f:fmt},
    {l:'RPG',k:'rpg',   v:src.rpg,   f:fmt},
    {l:'APG',k:'apg',   v:src.apg,   f:fmt},
    {l:'MPG',k:'mpg',   v:src.mpg,   f:fmt},
    {l:'FG%',k:'fg_pct',v:src.fg_pct,f:fmtP},
    {l:'3P%',k:'tp_pct',v:src.tp_pct,f:fmtP},
    {l:'FT%',k:'ft_pct',v:src.ft_pct,f:fmtP},
    {l:'STL',k:'stl',   v:src.stl,   f:fmt},
    {l:'BLK',k:'blk',   v:src.blk,   f:fmt},
    {l:'OREB',k:'oreb', v:src.oreb,  f:fmt},
    {l:'DREB',k:'dreb', v:src.dreb,  f:fmt},
    {l:'TO',  k:'tovs', v:src.tovs,  f:fmt},
  ];
  var rows=metrics.map(function(m){
    var display=m.f(m.v);
    if(display==='--'||display==='—')return '';
    var pct=getPctNat(m.v,m.k);   // vs every player in the database
    var col=barColor(pct);
    return '<div class="skill-bar-row">'
      +'<div class="skill-bar-label">'+m.l+'</div>'
      +'<div class="skill-bar-track"><div class="skill-bar-fill" style="width:'+pct+'%;background:'+col+';"></div></div>'
      +'<div class="skill-bar-val" style="color:'+col+';">'+display+'</div>'
      +'<div class="skill-bar-pct">'+pct+'th</div>'
      +'</div>';
  }).filter(Boolean);
  var half=Math.ceil(rows.length/2);
  return '<div class="skill-section-title">Skill Breakdown \u2014 '+(projected?'Projected ':'')+'vs Every Player (National)</div>'
    +'<div class="skill-grid"><div>'+rows.slice(0,half).join('')+'</div>'
    +'<div>'+rows.slice(half).join('')+'</div></div>';
}


// ── PERCENTILE HELPERS ──────────────────────────────────
function r1(v){return v!=null?Math.round(v*10)/10:null;}
function fmt(v){return v!=null&&v!==''?Number(v).toFixed(1):'—';}
function fmtP(v){return v!=null&&v!==''?Number(v).toFixed(1)+'%':'—';}
function pctCol(p){return p>=80?'rgb(18,60,185)':p>=60?'rgb(30,82,200)':p>=40?'rgb(45,100,210)':p>=20?'rgb(60,120,220)':'var(--text3)';}
function gradeClass(g){const n=parseFloat(g);if(!isNaN(n)){if(n>=90)return 'gA';if(n>=80)return 'gB';if(n>=70)return 'gC';if(n>=60)return 'gD';return 'gF';}if(!g)return '';if(g[0]==='A')return 'gA';if(g[0]==='B')return 'gB';if(g[0]==='C')return 'gC';if(g[0]==='D')return 'gD';return 'gF';}

let player=null, teamData=null, allPlayers=[], gPct={}, proj=null, teamPlayers=[], careerHistory=[];

// Neutralize corrupt rows: a per-game stat physically impossible for the
// player's minutes (e.g. Sin'Cere Jones — 6.4 APG at 0.3 MPG) is capped to the
// most it could plausibly be. Only sub-8-MPG samples are touched and the
// per-minute ceilings sit far above any real player, so legit stats never move.
const TDC_STAT_CAPS={ppg:1.4,rpg:0.75,apg:0.6,stl:0.28,blk:0.30,tovs:0.45,oreb:0.45,dreb:0.55};
function tdcSane(p){
  const mpg=parseFloat(p&&p.mpg)||0;
  if(mpg<=0||mpg>=8) return p;
  let out=null;
  for(const k in TDC_STAT_CAPS){
    const v=parseFloat(p[k]);
    if(!isNaN(v) && v > mpg*TDC_STAT_CAPS[k]){
      if(!out) out=Object.assign({},p);
      out[k]=Math.round(mpg*TDC_STAT_CAPS[k]*10)/10;
    }
  }
  return out||p;
}

async function init(){
  const s=JSON.parse(localStorage.getItem('tdc_session')||'null');
  const params=new URLSearchParams(location.search);
  const pid=params.get('id'), pname=params.get('name'), pteam=params.get('team'), pseason=params.get('season');
  if(!pid&&!pname){document.getElementById('heroSection').innerHTML='<div style="padding:80px;text-align:center;color:var(--text3);">No player specified. <a href="roster.html" style="color:var(--accent);">Browse players →</a></div>';return;}
  try{
    if(s?.access_token) updateNav(s);
    // PostgREST eq. filter — special chars like + * Jr. need to be handled
    // Use the player id if available, otherwise fetch by name with proper encoding
    // Strip any URL-unsafe chars that PostgREST can't handle in eq. comparisons
    function sbEncode(str){ return encodeURIComponent(str); }
    let url;
    if(pid){
      url=`${SB}/rest/v1/players?id=eq.${pid}&select=*&limit=1`;
    } else if(pteam){
      url=`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&team=eq.${sbEncode(pteam)}&select=*&limit=1`;
    } else {
      url=`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&select=*&limit=1`;
    }
    const [pr,apr]=await Promise.all([
      fetch(url,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/players?select=ppg,rpg,apg,mpg,fg_pct,tp_pct,ft_pct,stl,blk,tovs&ppg=not.is.null&limit=5000`,{headers:H}).then(r=>r.json()),
    ]);
    let playerRow=Array.isArray(pr)?pr[0]:null;
    // Fallback 1: try name-only if team match failed
    if(!playerRow&&pname&&pteam){
      const fb=await fetch(`${SB}/rest/v1/players?name=eq.${sbEncode(pname)}&select=*&limit=1`,{headers:H});
      const fbRows=await fb.json();
      playerRow=Array.isArray(fbRows)?fbRows[0]:null;
    }
    // Fallback 2: fetch all players for this team and find by name client-side
    // handles special chars that break URL encoding (Jr., +, *, etc.)
    if(!playerRow&&pname){
      const teamParam=pteam?`&team=eq.${sbEncode(pteam)}`:'';
      const fb2=await fetch(`${SB}/rest/v1/players?select=*${teamParam}&limit=500`,{headers:H});
      const fb2Rows=await fb2.json();
      if(Array.isArray(fb2Rows)){
        const nameLower=pname.toLowerCase().trim();
        playerRow=fb2Rows.find(r=>r.name&&r.name.toLowerCase().trim()===nameLower);
        // Fuzzy: if exact still fails, try contains
        if(!playerRow) playerRow=fb2Rows.find(r=>r.name&&r.name.toLowerCase().includes(nameLower.slice(0,8)));
      }
    }
    // Fallback 3: historical-only player (not on a current roster) — build
    // the page from their player_history record so any ranked player is viewable
    if(!playerRow&&pname){

      let hrows=await fetch(hq,{headers:H}).then(r=>r.json()).catch(()=>[]);

    if(!playerRow) throw new Error('Player not found — check name spelling or try searching from the roster page.');
    player=tdcSane(playerRow); allPlayers=(Array.isArray(apr)?apr:[]).map(tdcSane);

    // Team fetch — use client-side match to handle special chars in team names
    let teamConf='', teamConfFull='';

    try{
      const chR = await fetch(`${SB}/rest/v1/player_history?name=eq.${sbEncode(player.name)}&select=*&order=season_year.asc&limit=20`,{headers:H});
      if(chR.ok){

      if(!careerHistory.length){

          const r3 = await fetch(`${SB}/rest/v1/player_history?name=eq.${sbEncode(stripped)}&select=*&order=season_year.asc&limit=20`,{headers:H});

    window._careerHistoryMap = {};

var FROSH_BASE={

function _impPgrp(pos){pos=((pos||'')+'').toUpperCase().split(/[\/,\s]/)[0];
  if(pos==='PG'||pos==='SG'||pos==='G'||pos==='CG')return 'G';
  if(pos==='SF'||pos==='F')return 'W'; if(pos==='PF'||pos==='C')return 'B'; return 'W';}
// light, frosh-aware projected stat line (consistent across the whole pool)
function projLine(p){
  var yr=((p.class_year||p.yr||'')+'').toLowerCase();
  var has=(parseFloat(p.ppg)||0)>0 || (parseFloat(p.mpg)||0)>=2;
  var cnt=['ppg','rpg','apg','mpg','stl','blk','tovs','fga','fta','fgm','tpm','tpa','oreb','dreb'];
  var o={};
  if(has){
    var mult=yr.indexOf('fr')>=0?1.12:yr.indexOf('so')>=0?1.10:yr.indexOf('jr')>=0?1.05:0.99;
    var bump=yr.indexOf('fr')>=0?1.5:yr.indexOf('so')>=0?1.0:yr.indexOf('jr')>=0?0.5:0;
    cnt.forEach(function(k){o[k]=(parseFloat(p[k])||0)*mult;});
    ['fg_pct','tp_pct','ft_pct'].forEach(function(k){o[k]=(parseFloat(p[k])||0)+bump;});
    return o;
  }
  // incoming freshman / no sample — estimate from grade + position
  var g=parseFloat(p.tdc_grade)||72, sc=Math.max(0.4,Math.min(1.9,0.4+(g-70)*0.045));
  var b=FROSH_BASE[_impPgrp(p.position)];
  cnt.forEach(function(k){o[k]=b[k]*sc;});
  ['fg_pct','tp_pct','ft_pct'].forEach(function(k){o[k]=b[k];});
  return o;
}
// The player's AUTHORITATIVE projected line — the heavy team-engine projection
// shown on the Overview. Falls back to the light projLine only if the engine

function playerProjLine(){
  if(typeof proj!=='undefined' && proj && !proj._injured && !proj._dnp && (parseFloat(proj.ppg)||0)>0) return proj;
  return projLine(player);
}
function _impPctOf(arr,v,inv){if(!arr||!arr.length)return 0;var lo=0,hi=arr.length;while(lo<hi){var m=(lo+hi)>>1;if(arr[m]<v)lo=m+1;else hi=m;}var pc=Math.round(lo/arr.length*100);return inv?100-pc:pc;}
// per-40 rate (minutes floored at 16 so low-minute lines aren't wildly inflated)
function _imp40(s,k){var mp=Math.max(16,+s.mpg||16);return (+s[k]||0)*40/mp;}
function _impComponents(s,D){
  var apg=+s.apg||0, tov=+s.tovs||0, astto=apg/Math.max(0.7,tov);
  // each counting component blends per-game volume with per-40 production-in-role,
  // so a strong-in-his-minutes bench player is rewarded, not just high-minute starters.
  var W40=0.4;
  function blend(k){return (1-W40)*_impPctOf(D[k],+s[k]||0)+W40*_impPctOf(D[k+'40'],_imp40(s,k));}
  return {
    scoring:    blend('ppg'),
    creation:   0.74*((1-W40)*_impPctOf(D.apg,apg)+W40*_impPctOf(D.apg40,_imp40(s,'apg')))+0.26*_impPctOf(D.astto,astto),
    rebounding: blend('rpg'),
    defense:    (1-W40)*((_impPctOf(D.stl,+s.stl||0)+_impPctOf(D.blk,+s.blk||0))/2)
               +W40*((_impPctOf(D.stl40,_imp40(s,'stl'))+_impPctOf(D.blk40,_imp40(s,'blk')))/2),
    efficiency: (_impPctOf(D.fg_pct,+s.fg_pct||0)+_impPctOf(D.ft_pct,+s.ft_pct||0)+_impPctOf(D.tp_pct,+s.tp_pct||0))/3
  };
}
function _impScore(c){
  // base weighted blend...
  var base=0.30*c.scoring+0.20*c.creation+0.15*c.rebounding+0.17*c.defense+0.18*c.efficiency;
  // ...plus a peak-skill bonus so being elite at something is highly valued
  // (an elite creator/scorer shouldn't be dragged down by positional weak spots).
  var arr=[c.scoring,c.creation,c.rebounding,c.defense,c.efficiency].sort(function(a,b){return b-a;});
  var peak=0.62*arr[0]+0.38*arr[1];
  return 0.5*base+0.5*peak;
}
function renderImpact(){

  if(!lines.length) return;

    D[k]=lines.map(function(l){return +l[k]||0;}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});});
  // per-40 distributions for the counting stats (production-in-role)
  ['ppg','rpg','apg','stl','blk'].forEach(function(k){
    D[k+'40']=lines.map(function(l){return _imp40(l,k);}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});});

  var pctl=Math.max(1,Math.round((1-(rank-1)/Math.max(1,M))*100));

    {l:'Scoring',v:Math.round(c.scoring)},{l:'Creation',v:Math.round(c.creation)},

  }).join('');

  arr.forEach(function(v){var t=(v-lo)/(hi-lo);var bi=Math.min(B-1,Math.max(0,Math.floor(t*B)));bins[bi]++;});
  var sm=bins.map(function(_,i){return ((bins[i-1]||0)+2*bins[i]+(bins[i+1]||0))/4;});
  var mx=Math.max.apply(null,sm)||1;

  var d='M '+padL.toFixed(1)+' '+baseY+' L '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;

  }

function _hexToRgb(h){h=(h||'').replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);if(isNaN(n))return null;return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}

function renderSpectrum(){
  if(typeof Chart==='undefined') return;
  var pool=_pexpPool||window._tdcAllPlayers; if(!pool||!pool.length||!player) return;
  var xk=document.getElementById('pexpX').value, yk=document.getElementById('pexpY').value;
  var posF=document.getElementById('pexpPos').value, minM=parseFloat(document.getElementById('pexpMin').value)||0;
  var xl=(EXP_STATS.find(function(s){return s.k===xk;})||{}).l||xk;
  var yl=(EXP_STATS.find(function(s){return s.k===yk;})||{}).l||yk;
  var COL={G:'#B16BFF',W:'#38BDF8',B:'#FF4D9D'}, groups={G:[],W:[],B:[]};
  pool.forEach(function(p){
    if((parseFloat(p.mpg)||0)<minM) return;
    if(p.name===player.name) return;   // this player drawn separately
    var g=expPosGrp(p.position); if(posF&&g!==posF) return;
    var xv=expVal(p,xk), yv=expVal(p,yk);
    if(xv==null||yv==null||isNaN(xv)||isNaN(yv)) return;
    if(xk!=='_ht'&&xv===0&&yk!=='_ht'&&yv===0) return;
    groups[g].push({x:xv,y:yv,nm:p.name,tm:p.team,pos:p.position||g});
  });
  var datasets=['G','W','B'].map(function(g){return {
    label:{G:'Guards',W:'Wings',B:'Bigs'}[g],
    data:groups[g], backgroundColor:COL[g]+'aa', borderColor:COL[g], pointRadius:3.2, pointHoverRadius:6
  };});
  var tc=(teamData&&teamData.color)||'#5ab875';
  var meRow=_pexpPlayerRow(_pexpSeason);
  var mx=meRow?expVal(meRow,xk):null, my=meRow?expVal(meRow,yk):null;
  var hasMe=(mx!=null&&my!=null&&!isNaN(mx)&&!isNaN(my));
  if(hasMe){
    datasets.push({label:'__you',order:-1,data:[{x:mx,y:my,nm:player.name,tm:player.team,pos:player.position||''}],
      backgroundColor:tc,borderColor:'#fff',borderWidth:2.5,pointRadius:8.5,pointHoverRadius:11});
  }
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  var grid=isDark?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)', tickc=isDark?'#9a93b8':'#6d6589';
  var total=groups.G.length+groups.W.length+groups.B.length;
  var nt=document.getElementById('pexpNote'); if(nt) nt.innerHTML='<b>'+total+'</b> players · '+_pexpSeasonLbl(_pexpSeason)+' · '+xl+' (x) vs '+yl+' (y) · '+(hasMe?(player.name||'')+' highlighted':(player.name||'')+' did not qualify this season');
  if(_pexpChart) _pexpChart.destroy();
  var ctx=document.getElementById('pexpChart').getContext('2d');
  _pexpChart=new Chart(ctx,{type:'scatter',data:{datasets:datasets},
    plugins:[{afterDatasetsDraw:function(chart){
      var di=chart.data.datasets.findIndex(function(d){return d.label==='__you';}); if(di<0)return;
      var m=chart.getDatasetMeta(di), pt=m.data&&m.data[0]; if(!pt)return;
      var c=chart.ctx, name=(player.name||'').toUpperCase();
      c.save(); c.font='800 11px Inter,sans-serif'; var w=c.measureText(name).width+14, bx=pt.x-w/2, by=pt.y-30;
      c.fillStyle=isDark?'#15101f':'#15101f'; c.strokeStyle=tc; c.lineWidth=1.5;
      if(c.roundRect){c.beginPath();c.roundRect(bx,by,w,19,5);c.fill();c.stroke();}else{c.fillRect(bx,by,w,19);}
      c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(name,pt.x,by+10); c.restore();
    }}],
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:400},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){var d=c.raw;return d.nm+' ('+d.pos+', '+d.tm+') — '+xl+': '+d.x+', '+yl+': '+d.y;}}}},
      scales:{
        x:{title:{display:true,text:xl,color:tickc,font:{weight:'700',size:12}},grid:{color:grid},ticks:{color:tickc}},
        y:{title:{display:true,text:yl,color:tickc,font:{weight:'700',size:12}},grid:{color:grid},ticks:{color:tickc}}
      }
    }
  });
}

function renderStatTable(p, projData){
  const seasonLabel = y => {
    const yr = parseInt(y);
    return isNaN(yr) ? y : `${yr-1}-${String(yr).slice(2)}`;
  };
  const gradeC = g => { g=parseInt(g); if(isNaN(g)) return 'var(--text3)';
    return g>=85?'#5ab875':g>=78?'var(--accent)':g>=70?'var(--text)':g>=64?'var(--text2)':'var(--text3)'; };
  const ovrCell = g => `<td style="font-family:'Playfair Display',serif;font-weight:800;font-size:15px;color:${gradeC(g)};">${(g!=null&&g!==''&&!isNaN(parseInt(g)))?parseInt(g):'—'}</td>`;

  let rowsHtml = '';
  const teamSub = t => t ? `<div style="font-size:9px;color:var(--text3);font-weight:600;margin-top:1px;">${t}</div>` : '';

  // Deduplicate history by season_year — keep the row with the most games played per year
  const dedupedHistory = (() => {
    const byYear = {};
    (careerHistory || []).forEach(s => {
      const yr = s.season_year;
      const gp = s.gp || 0;
      if(!byYear[yr] || gp > (byYear[yr].gp || 0)) byYear[yr] = s;
    });
    return Object.values(byYear).sort((a,b) => a.season_year - b.season_year);
  })();

  // Show all seasons from player_history (each row has the correct school for that year)
  if(dedupedHistory.length){
    dedupedHistory.forEach(s=>{
      if(s.sat_out || (s.ppg==null && (s.gp==null||s.gp===0))){
        rowsHtml += `<tr style="opacity:.55;">
          <td>${seasonLabel(s.season_year)}${teamSub(s.team)}</td>
          ${ovrCell(s.tdc_grade)}
          <td colspan="19" style="text-align:left;font-style:italic;color:var(--text3);">
            Redshirt / Did not play
          </td>
        </tr>`;
      } else {
        rowsHtml += `<tr class="actual">
          <td>${seasonLabel(s.season_year)}${teamSub(s.team)}</td>
          ${ovrCell(s.tdc_grade)}
          <td>${s.gp||'—'}</td>
          <td>${fmt(s.ppg)}</td><td>${fmt(s.rpg)}</td><td>${fmt(s.apg)}</td><td>${fmt(s.mpg)}</td>
          <td>${fmt(s.fgm)}</td><td>${fmt(s.fga)}</td><td>${fmtP(s.fg_pct)}</td>
          <td>${fmt(s.tpm)}</td><td>${fmt(s.tpa)}</td><td>${fmtP(s.tp_pct)}</td>
          <td>${fmt(s.ftm)}</td><td>${fmt(s.fta)}</td><td>${fmtP(s.ft_pct)}</td>
          <td>${fmt(s.oreb)}</td><td>${fmt(s.dreb)}</td>
          <td>${fmt(s.stl)}</td><td>${fmt(s.blk)}</td><td>${fmt(s.tovs)}</td>
        </tr>`;
      }
    });
  } else {
    // No career history — fall back to current season row from players table
    rowsHtml += `<tr class="actual">
      <td>2025-26${teamSub(p.team)}</td>
      ${ovrCell(p.tdc_grade)}
      <td>${p.gp||'—'}</td>
      <td>${fmt(p.ppg)}</td><td>${fmt(p.rpg)}</td><td>${fmt(p.apg)}</td><td>${fmt(p.mpg)}</td>
      <td>${fmt(p.fgm)}</td><td>${fmt(p.fga)}</td><td>${fmtP(p.fg_pct)}</td>
      <td>${fmt(p.tpm)}</td><td>${fmt(p.tpa)}</td><td>${fmtP(p.tp_pct)}</td>
      <td>${fmt(p.ftm)}</td><td>${fmt(p.fta)}</td><td>${fmtP(p.ft_pct)}</td>
      <td>${fmt(p.oreb)}</td><td>${fmt(p.dreb)}</td>
      <td>${fmt(p.stl)}</td><td>${fmt(p.blk)}</td><td>${fmt(p.tovs)}</td>
    </tr>`;
  }

  // Always append the 2026-27 projection row
  if(projData){
    rowsHtml += `<tr class="proj">
      <td>2026-27 ★<div style="font-size:9px;color:var(--text3);font-weight:600;">Projected</div></td>
      ${ovrCell(p.tdc_grade)}
      <td>—</td>
      <td>${fmt(projData.ppg)}</td><td>${fmt(projData.rpg)}</td><td>${fmt(projData.apg)}</td><td>${fmt(projData.mpg)}</td>
      <td>${fmt(projData.fgm)}</td><td>${fmt(projData.fga)}</td><td>${fmtP(projData.fg_pct)}</td>
      <td>${fmt(projData.tpm)}</td><td>${fmt(projData.tpa)}</td><td>${fmtP(projData.tp_pct)}</td>
      <td>${fmt(projData.ftm)}</td><td>${fmt(projData.fta)}</td><td>${fmtP(projData.ft_pct)}</td>
      <td>${fmt(projData.oreb)}</td><td>${fmt(projData.dreb)}</td>
      <td>${fmt(projData.stl)}</td><td>${fmt(projData.blk)}</td><td>${fmt(projData.tovs)}</td>
    </tr>`;
  }

  return `<table class="stat-table">
    <thead><tr>
      <th>Season</th><th>OVR</th><th>GP</th><th>PPG</th><th>RPG</th><th>APG</th><th>MPG</th>
      <th>FGM</th><th>FGA</th><th>FG%</th><th>3PM</th><th>3PA</th><th>3P%</th>
      <th>FTM</th><th>FTA</th><th>FT%</th><th>OR</th><th>DR</th><th>STL</th><th>BLK</th><th>TO</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

// Overall progression chart — player's TDC grade across seasons, over a faint
// "normal progression" (Fr→Grad) reference ramp.
function buildProgression(p){
  // dedupe career history by season (keep most games), chronological, graded only
  var byYear={};
  (careerHistory||[]).forEach(function(s){
    var g=parseInt(s.tdc_grade); if(isNaN(g)) return;
    var yr=+s.season_year, gp=+s.gp||0;
    if(!byYear[yr]||gp>(byYear[yr].gp||0)) byYear[yr]={yr:yr,grade:g,gp:gp,cls:s.yr};
  });
  var pts=Object.keys(byYear).map(function(k){return byYear[k];}).sort(function(a,b){return a.yr-b.yr;});
  // Only project a 2026-27 point if the player is actually on a current roster
  // (proj is set). Graduated/departed players — loaded from history, proj=null —
  // end at the last season they played.
  var pg=parseInt(p.tdc_grade);
  if(proj && !isNaN(pg)) pts.push({yr:2027,grade:pg,proj:true,cls:p.yr||p.class_year});
  if(!pts.length) return '';

  var CLS=['Fr','So','Jr','Sr','Gr'], BASE=[64,69,73,76,79];
  pts.forEach(function(pt,i){
    var ci=Math.min(i,4);  // chronological class position (yr field is unreliable)
    pt.cidx=ci; pt.base=BASE[ci];
    pt.label=(''+(pt.yr-1)).slice(-2)+'-'+(''+pt.yr).slice(-2);
    pt.clsLabel=CLS[ci];
  });

  var W=720,H=250,padL=42,padR=24,padT=30,padB=46;

  var lo=Math.max(45,Math.floor((Math.min.apply(null,vals)-5)/5)*5);
  var hi=Math.min(99,Math.ceil((Math.max.apply(null,vals)+5)/5)*5);
  if(hi-lo<15){hi=Math.min(99,lo+15);}
  var xx=function(i){ return pts.length<2?(W/2):(padL+(W-padL-padR)*i/(pts.length-1)); };
  var yy=function(g){ return padT+(H-padT-padB)*(1-(g-lo)/(hi-lo)); };
  var accent=(teamData&&teamData.color)||'#B16BFF';

  // y gridlines
  var grid='';
  for(var gv=lo; gv<=hi; gv+=5){ var gy=yy(gv).toFixed(1);
    grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1" opacity=".5"/>'
        +'<text x="'+(padL-9)+'" y="'+gy+'" font-size="9" fill="var(--text3)" font-weight="600" text-anchor="end" dominant-baseline="middle">'+gv+'</text>'; }

  var baseLine=pts.map(function(pt,i){return (i?'L':'M')+xx(i).toFixed(1)+' '+yy(pt.base).toFixed(1);}).join(' ');
  var baseArea='M'+xx(0).toFixed(1)+' '+yy(lo).toFixed(1)+' '+pts.map(function(pt,i){return 'L'+xx(i).toFixed(1)+' '+yy(pt.base).toFixed(1);}).join(' ')+' L'+xx(pts.length-1).toFixed(1)+' '+yy(lo).toFixed(1)+' Z';

  // player line + dots + value labels + x labels
  var line=pts.map(function(pt,i){return (i?'L':'M')+xx(i).toFixed(1)+' '+yy(pt.grade).toFixed(1);}).join(' ');
  var dots='', xlabels='';
  pts.forEach(function(pt,i){
    var cx=xx(i).toFixed(1), cy=yy(pt.grade).toFixed(1);
    var anc=(i===0)?'start':(i===pts.length-1?'end':'middle');
    var lx=(i===0)?(xx(i)-2):(i===pts.length-1?(xx(i)+2):xx(i));
    dots+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(pt.proj?4.5:4)+'" fill="'+(pt.proj?'var(--bg)':accent)+'" stroke="'+accent+'" stroke-width="2.5"/>'
       +'<text x="'+lx.toFixed(1)+'" y="'+(yy(pt.grade)-11).toFixed(1)+'" font-size="12" font-weight="800" fill="'+accent+'" text-anchor="'+anc+'" font-family="Playfair Display,serif">'+pt.grade+'</text>';
    xlabels+='<text x="'+cx+'" y="'+(H-padB+18)+'" font-size="10" fill="var(--text2)" font-weight="700" text-anchor="middle">'+pt.label+(pt.proj?' ★':'')+'</text>'
          +'<text x="'+cx+'" y="'+(H-padB+31)+'" font-size="9" fill="var(--text3)" font-weight="600" text-anchor="middle">'+pt.clsLabel+'</text>';
  });

  return '<div class="sec-title" style="margin-bottom:6px;">Overall Progression</div>'
    +'<div class="prog-legend"><span><i class="pl-line"></i>'+p.name.split(' ')[0]+'</span><span><i class="pl-base"></i>Typical Fr→Grad arc</span></div>'
    +'<div class="prog-wrap"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;">'
    +grid
    +'<path d="'+baseArea+'" fill="var(--text3)" opacity=".08"/>'
    +'<path d="'+baseLine+'" fill="none" stroke="var(--text3)" stroke-width="2" stroke-dasharray="5 4" opacity=".45"/>'
    +'<path d="'+line+'" fill="none" stroke="'+accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+xlabels
    +'</svg></div>';
}

function buildStatNarrative(p){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const pos=p.position||'G'; const name=p.name.split(' ')[0];
  const yr=(p.yr||p.class_year||'');

  let parts=[];
  if(ppg>0) parts.push(`${name} averaged ${ppg.toFixed(1)} points, ${rpg.toFixed(1)} rebounds, and ${apg.toFixed(1)} assists per game in 2026-27.`);
  if(fg>0){
    const fgDesc=fg>=52?'highly efficient':fg>=46?'efficient':fg>=42?'average':'below-average';
    parts.push(`Shot ${fg.toFixed(1)}% from the field — ${fgDesc} for the position.`);
  }
  if(tp>0&&(parseFloat(p.tpa)||0)>2){
    const tpDesc=tp>=40?'elite':tp>=36?'solid':tp>=32?'adequate':'concerning';
    parts.push(`Connected at ${tp.toFixed(1)}% from three — ${tpDesc} efficiency on ${(parseFloat(p.tpa)||0).toFixed(1)} attempts.`);
  }
  if(stl+blk>1.5) parts.push(`Provides defensive value with ${stl.toFixed(1)} steals and ${blk.toFixed(1)} blocks per game.`);
  if(yr) parts.push(`As a ${yr} ${pos}, ${name} will be an important piece of the program going forward.`);

  return parts.join(' ')||'Insufficient stats for narrative.';
}

function _rgbaOf(hex,a){var c=(typeof _hexToRgb==='function')?_hexToRgb(hex):null;return c?'rgba('+c.r+','+c.g+','+c.b+','+a+')':'rgba(150,150,150,'+a+')';}
// smooth closed Catmull-Rom curve through points (rounded radar)
function _radarSmooth(ctx,pts){
  var nn=pts.length;
  if(nn<3){ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<nn;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();return;}
  ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=0;i<nn;i++){
    var p0=pts[(i-1+nn)%nn],p1=pts[i],p2=pts[(i+1)%nn],p3=pts[(i+2)%nn];
    var c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    ctx.bezierCurveTo(c1x,c1y,c2x,c2y,p2.x,p2.y);
  }
  ctx.closePath();
}
function drawRadar(progress){
  const prog=(typeof progress==='number')?progress:1;
  const canvas=document.getElementById('radarChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=player;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textCol=isDark?'#a0a0a0':'#888';
  const gridCol=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const color=teamData?.color||'#8B6914';

  // 8 skill axes — percentile vs EVERY player in the database
  const AXLAB=['Scoring','Efficiency','3-Point','Playmaking','Rebounding','Defense','Usage','Ball Care'];
  function axesOf(s){
    return [
      Math.min(100,getPctNat(s.ppg,'ppg')),
      Math.min(100,Math.round((getPctNat(s.fg_pct,'fg_pct')+getPctNat(s.ft_pct,'ft_pct'))/2)),
      getPctNat(s.tp_pct,'tp_pct'),
      getPctNat(s.apg,'apg'),
      getPctNat(s.rpg,'rpg'),
      Math.round((getPctNat(s.stl,'stl')+getPctNat(s.blk,'blk'))/2),
      getPctNat(s.mpg,'mpg'),
      getPctNat(s.tovs,'tovs'),

  }

  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-40;
  const n=AXLAB.length;
  const accent=(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim())||'#B16BFF';

  // concentric circular grid rings
  for(let ring=5;ring>=1;ring--){
    ctx.beginPath(); ctx.arc(cx,cy,r*ring/5,0,Math.PI*2);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  }
  // axis spokes + labels
  AXLAB.forEach((lab,i)=>{
    const angle=Math.PI*2*i/n-Math.PI/2;
    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
    const lx=cx+Math.cos(angle)*(r+18), ly=cy+Math.sin(angle)*(r+18);
    ctx.fillStyle=textCol; ctx.font='bold 11px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(lab,lx,ly);
  });

  function drawShape(vals, baseCol, fillA, alpha){
    ctx.save(); ctx.globalAlpha=(alpha==null?1:alpha);
    const pts=vals.map((v,i)=>{const angle=Math.PI*2*i/n-Math.PI/2;const val=v/100*prog;return {x:cx+Math.cos(angle)*r*val, y:cy+Math.sin(angle)*r*val};});
    if(fillA>0){
      ctx.beginPath(); _radarSmooth(ctx,pts);
      const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      grad.addColorStop(0,_rgbaOf(baseCol,Math.min(0.5,fillA*1.7)));
      grad.addColorStop(1,_rgbaOf(baseCol,fillA*0.4));
      ctx.fillStyle=grad; ctx.fill();
    }
    ctx.beginPath(); _radarSmooth(ctx,pts);
    ctx.shadowColor=_rgbaOf(baseCol,0.45); ctx.shadowBlur=10;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=baseCol; ctx.lineWidth=2.2; ctx.stroke(); ctx.shadowBlur=0;
    if(prog>0.82){
      pts.forEach(pt=>{
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fillStyle=baseCol; ctx.fill();
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.lineWidth=1.5; ctx.strokeStyle=isDark?'#0b0a12':'#fff'; ctx.stroke();
      });
    }
    ctx.restore();
  }

  // build a series per season actually played (deduped, with stats) + projected
  var byYear={};
  (careerHistory||[]).forEach(function(s){ if(s.ppg==null) return; var yr=+s.season_year, gp=+s.gp||0; if(!byYear[yr]||gp>(byYear[yr].gp||0)) byYear[yr]=s; });
  var seasons=Object.keys(byYear).map(function(k){return byYear[k];}).sort(function(a,b){return a.season_year-b.season_year;});
  if(!seasons.length) seasons=[p];
  var PAL=['#6d6589','#74aedd','#e0a35a','#cf7d72','#5ab875','#c98bd4','#5b9d8f'];
  var series=seasons.map(function(s,i){
    var isLast=(i===seasons.length-1);
    return {lbl:_seasonLbl(s.season_year)||'Actual', col:(isLast?color:PAL[i%PAL.length]),
            vals:axesOf(s), alpha:1, fill:(isLast?0.16:0), proj:false};
  });
  if(proj && !proj._frosh) series.push({lbl:_seasonLbl(2027)+' Proj', col:accent, vals:axesOf(proj), alpha:0.95, fill:0.14, proj:true});

  var vis=window._radarVis=window._radarVis||{};
  // projected behind, then seasons oldest→newest (most recent on top)
  var pj=series.filter(function(s){return s.proj;})[0];
  if(pj && vis[pj.lbl]!==false) drawShape(pj.vals, pj.col, pj.fill, pj.alpha);
  series.filter(function(s){return !s.proj;}).forEach(function(sv){ if(vis[sv.lbl]!==false) drawShape(sv.vals, sv.col, sv.fill, sv.alpha); });

  // toggleable legend
  const legendEl=document.getElementById('radarLegend');
  if(legendEl){
    legendEl.innerHTML=series.map(function(sv){
      var off=(vis[sv.lbl]===false);
      return '<div class="radar-legend-item'+(off?' off':'')+'" onclick="_radarToggle(\''+sv.lbl+'\')">'
        +'<div class="radar-legend-dot" style="background:'+sv.col+';'+(sv.proj?'opacity:.95;':'')+'"></div>'+sv.lbl+'</div>';
    }).join('');
  }
}
function _radarToggle(lbl){ var v=window._radarVis=window._radarVis||{}; v[lbl]=(v[lbl]===false); drawRadar(1); }
function animateRadar(){
  var start=null, dur=780, done=false;
  function ease(t){return 1-Math.pow(1-t,3);}
  function step(ts){ if(start===null)start=ts; var p=Math.min(1,(ts-start)/dur); drawRadar(ease(p)); if(p<1)requestAnimationFrame(step); else done=true; }

}

  const cur=tabs.map(x=>document.getElementById('panel-'+x)).find(el=>el&&el.classList.contains('active'));
  function activate(id){
    tabs.forEach(x=>{
      const btn=document.getElementById('tab-'+x);
      const pnl=document.getElementById('panel-'+x);
      if(btn)btn.classList.toggle('active',x===id);
      if(pnl){
        pnl.classList.remove('active','entering','leaving');
        if(x===id){pnl.style.display='block';requestAnimationFrame(function(){requestAnimationFrame(function(){pnl.classList.add('active','entering');});});}

<script>
/* ── Particle system ──────────────────────────────────────── */
(function(){
  const cv=document.getElementById('particleCanvas');
  if(!cv) return;
  const ctx=cv.getContext('2d');
  const N=14,SMIN=5,SMAX=8,RMIN=1.0,RMAX=2.0,OMIN=0.05,OMAX=0.16;
  let W,H,pts=[];
  function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener('resize',rsz,{passive:true});rsz();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function mk(){const a=rnd(0,Math.PI*2),s=rnd(SMIN,SMAX);
    return{x:rnd(0,W),y:rnd(0,H),vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(RMIN,RMAX),op:rnd(OMIN,OMAX),p:rnd(0,Math.PI*2),ps:rnd(.004,.010)};}
  for(let i=0;i<N;i++) pts.push(mk());
  let last=0;
  function frame(ts){
    const dt=Math.min((ts-last)/1000,.05);last=ts;
    ctx.clearRect(0,0,W,H);
    const dk=document.documentElement.getAttribute('data-theme')==='dark';
    pts.forEach(p=>{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;
      if(p.y<-4)p.y=H+4;if(p.y>H+4)p.y=-4;
      p.p+=p.ps;
      const al=p.op*(0.6+0.4*Math.sin(p.p))*(dk?1:.5);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
      g.addColorStop(0,`rgba(177,107,255,${al})`);
      g.addColorStop(.4,`rgba(177,107,255,${al*.5})`);
      g.addColorStop(1,`rgba(177,107,255,0)`);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function(){
