    .nav-actions{display:flex;align-items:center;gap:14px;}

    .player-hero{padding:32px 40px 24px;border-bottom:1px solid var(--border);display:flex;gap:24px;align-items:flex-start;}

  </style>

  const posCounts={};
  projected.forEach(p=>{const pos=(p.position||'G').replace(/\d/g,'').trim();const pk=['PG','SG','SF','PF','C'].includes(pos)?pos:pos==='CG'?'SG':pos.includes('G')?'SG':pos.includes('F')?'SF':'C';posCounts[pk]=(posCounts[pk]||0)+1;p._posKey=pk;});

    if(diff<=3){const c=p1._targetMpg+p2._targetMpg;p1._targetMpg=c*0.53;p2._targetMpg=c*0.47;}
    else if(diff<=6){const c=p1._targetMpg+p2._targetMpg;p1._targetMpg=c*0.65;p2._targetMpg=c*0.35;}
  }
  for(let i=1;i<projected.length;i++){if(projected[i]._targetMpg>projected[i-1]._targetMpg)projected[i]._targetMpg=projected[i-1]._targetMpg*0.95;}
  const top5=projected.slice(0,Math.min(5,projected.length));

    if(p.fg_pct!=null)p.fg_pct=r1t(Math.min(68,Math.max(28,parseFloat(p.fg_pct)||0)));
    if(p.tp_pct!=null)p.tp_pct=r1t(Math.min(50,Math.max(15,parseFloat(p.tp_pct)||0)));
    if(p.ft_pct!=null)p.ft_pct=r1t(Math.min(97,Math.max(45,parseFloat(p.ft_pct)||0)));
    if(p.ppg!=null)p.ppg=r1t(Math.min(35,Math.max(0,parseFloat(p.ppg)||0)));
    if(p.rpg!=null)p.rpg=r1t(Math.min(15,Math.max(0,parseFloat(p.rpg)||0)));
    if(p.apg!=null)p.apg=r1t(Math.min(11,Math.max(0,parseFloat(p.apg)||0)));
    if(p.mpg!=null)p.mpg=r1t(Math.min(38,Math.max(1,parseFloat(p.mpg)||0)));
  });
  return withStats;
}

// ── PLAYER ARCHETYPE / SCOUTING ─────────────────────────
function buildScoutingReport(p, proj, globalPct){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const oreb=parseFloat(p.oreb)||0, dreb=parseFloat(p.dreb)||0;
  const tovs=parseFloat(p.tovs)||0, mpg=parseFloat(p.mpg)||0;
  const pos=p.position||'G';
  const grade=parseFloat(p.tdc_grade)||70;
  let archetype='', archetypeDesc='';
  const isGuard=pos==='PG'||pos==='SG'||pos==='CG'||pos==='G';
  const isBig=pos==='C'||pos==='PF';
  if(isGuard){
    if(ppg>=16&&apg>=4) archetype='Primary Playmaker';
    else if(ppg>=16&&apg<3) archetype='Scoring Guard';
    else if(apg>=5&&ppg<12) archetype='Pass-First Guard';
    else if(tp>=38&&ppg>=10) archetype='Perimeter Shooter';
    else if(stl>=1.5) archetype='Disruptive Defender';
    else if(mpg>=28&&ppg<10) archetype='Role Player';
    else archetype='Two-Way Guard';
  } else if(isBig){
    if(blk>=1.5&&oreb>=2) archetype='Interior Anchor';
    else if(ppg>=14&&rpg>=7) archetype='Dominant Big';
    else if(tp>=1.5&&fg>=45) archetype='Stretch Big';
    else if(dreb>=5&&oreb>=2) archetype='Rebounding Specialist';
    else if(ppg>=12) archetype='Scoring Big';
    else archetype='Developmental Big';
  } else {
    if(ppg>=14&&rpg>=5&&apg>=2) archetype='Versatile Wing';
    else if(tp>=1.5&&ppg>=10) archetype='3-and-D Wing';
    else if(ppg>=16) archetype='Wing Scorer';
    else archetype='Role Wing';
  }
  const strengths=[];
  if(ppg>=15) strengths.push('Elite scorer');
  else if(ppg>=10) strengths.push('Reliable scorer');
  if(fg>=50) strengths.push('Efficient shooter');
  if(tp>=38) strengths.push('Three-point threat');
  if(ft>=80) strengths.push('Free throw specialist');
  if(apg>=4) strengths.push('Playmaker');
  if(rpg>=7) strengths.push('Elite rebounder');
  else if(rpg>=5) strengths.push('Strong rebounder');
  if(stl>=1.5) strengths.push('Perimeter disruptor');
  if(blk>=1.5) strengths.push('Rim protector');
  if(oreb>=2) strengths.push('Second chance creator');
  const weaknesses=[];
  if(fg<40&&(parseFloat(p.fga)||0)>4) weaknesses.push('Shooting efficiency concerns');
  if(tp<32&&(parseFloat(p.tpa)||0)>3) weaknesses.push('Below-average from three');
  if(ft<65) weaknesses.push('Foul line liability');
  if(tovs>2.5) weaknesses.push('Turnover prone');
  if(apg<1&&isGuard) weaknesses.push('Limited playmaking');
  if(rpg<3&&isBig) weaknesses.push('Below-average rebounding for position');
  if(blk<0.5&&isBig) weaknesses.push('Limited shot-blocking');
  if(mpg<18) weaknesses.push('Limited role / development player');
  const tags=[];
  if(tp>=(parseFloat(p.fga)||1)*0.35) tags.push({t:'High-Volume 3PA',c:'neu'});
  if(fg>=50) tags.push({t:'Efficient',c:'pos'});
  if((parseFloat(p.fta)||0)/(parseFloat(p.fga)||1)>0.4) tags.push({t:'Gets to the Line',c:'pos'});
  if(tovs>3) tags.push({t:'Ball Security Risk',c:'neg'});
  if(stl+blk>2.5) tags.push({t:'Defensive Impact',c:'pos'});
  if(oreb>2) tags.push({t:'Offensive Glass',c:'pos'});
  if(tp>=38) tags.push({t:'Shooting Threat',c:'pos'});
  if(apg>3) tags.push({t:'Playmaker',c:'pos'});
  if(apg>4&&tovs<2) tags.push({t:'Low-Turnover PG',c:'pos'});
  let projNote='';
  if(proj){
    if(proj._frosh) projNote=`Freshman projection based on ${pos} position baseline, ${p.height||'—'} height, and TDC grade ${grade}. High variance expected.`;
    else if(proj._origin){const destConf=teamData?.conf||teamData?.conference||'this conf';projNote=`Transfer from ${proj._origin} (${proj._factor>=1?'step down':'step up'} to ${destConf}). Conference translation applied to shooting percentages only (${(proj._factor||1)<1?'−':'+'} ${Math.abs(Math.round(((proj._factor||1)-1)*100))}% difficulty). Per-minute production scales with minutes.`;}
    else{const yr=(p.yr||'').toLowerCase();if(yr.includes('fr.')||yr.includes('so.'))projNote='Sophomore/Junior leap projected — typically the largest year-over-year improvement window.';else if(yr.includes('jr.'))projNote='Junior-to-senior projection — peak years, modest improvement expected.';else projNote='Returning veteran — projection based on role continuity.';}
  }
  return {archetype, archetypeDesc, strengths, weaknesses, tags, projNote};
}

function gradeClass(g){const n=parseFloat(g);if(!isNaN(n)){if(n>=90)return 'gA';if(n>=80)return 'gB';if(n>=70)return 'gC';if(n>=60)return 'gD';return 'gF';}if(!g)return '';if(g[0]==='A')return 'gA';if(g[0]==='B')return 'gB';if(g[0]==='C')return 'gC';if(g[0]==='D')return 'gD';return 'gF';}

      } else {
        // ── Career-aware projection ──────────────────────────
        const base = hasCareerStats ? latestH : player;
        const baseMpg = Math.max(1, parseFloat(base.mpg||0)||1);
        const g = v => parseFloat(base[v]||0)||0;

        // Per-minute rates from base season
        const pm = {
          ppg:g('ppg')/baseMpg,  rpg:g('rpg')/baseMpg,   apg:g('apg')/baseMpg,
          fgm:g('fgm')/baseMpg,  fga:g('fga')/baseMpg,
          tpm:g('tpm')/baseMpg,  tpa:g('tpa')/baseMpg,
          ftm:g('ftm')/baseMpg,  fta:g('fta')/baseMpg,
          oreb:g('oreb')/baseMpg, dreb:g('dreb')/baseMpg,
          stl:g('stl')/baseMpg,  blk:g('blk')/baseMpg,  tovs:g('tovs')/baseMpg,
        };

        // Career trend — only compare MEANINGFUL seasons (≥12 MPG)
        // Recency weighted: most recent season matters most
        // Also: if the most recent meaningful season is a clear breakout

        let trendMult = 1.0;
        if(meaningful.length >= 2){
          const n  = meaningful[0];  // most recent meaningful
          const p2 = meaningful[1];  // season before that
          const nPm  = parseFloat(n.ppg ||0)/Math.max(1,parseFloat(n.mpg ||1));

            const mpgGrowth = parseFloat(n.mpg||0) / Math.max(1,parseFloat(p2.mpg||0));
            const isBreakout = rawTrend >= 1.40 && mpgGrowth >= 1.20;

                          : gapRatio<0.95?1.02 : gapRatio>1.40?0.97 : gapRatio>1.20?0.99 : 1.0;

        const rateGrowth = yrMult * gapMult * trendMult;

        // Transfer factor
        const PROJ_CONF_TIERS_P = {'B10':1,'SEC':1,'BIG-12':1,'ACC':1,'Big-East':2,'A10':2,'WCC':2,'PAC-12':2,'MWC':3,'AAC':3,'Ivy':3,'MVC':4,'WAC':4,'CUSA':4,'MAC':4,'Big West':4,'Big Sky':5,'CAA':5,'Horizon':5,'Sun Belt':5,'Big South':5,'SBC':5,'SoCon':6,'ASUN':6,'MAAC':6,'OVC':6,'Summit':6,'Patriot':7,'SWAC':7,'NEC':7,'MEAC':7,'AEC':7};
        const PROJ_TRANS_MAT_P  = {1:{1:1.00,2:1.15,3:1.28,4:1.40,5:1.40,6:1.40,7:1.40},2:{1:0.90,2:1.00,3:1.15,4:1.20,5:1.20,6:1.20,7:1.20},3:{1:0.75,2:0.90,3:1.00,4:1.05,5:1.10,6:1.10,7:1.10},4:{1:0.49,2:0.68,3:0.82,4:1.00,5:1.05,6:1.05,7:1.05},5:{1:0.43,2:0.49,3:0.69,4:0.82,5:1.00,6:1.00,7:1.00},6:{1:0.40,2:0.42,3:0.50,4:0.69,5:0.82,6:1.00,7:1.00},7:{1:0.30,2:0.34,3:0.42,4:0.48,5:0.69,6:0.82,7:1.00}};
        let transferFactor = 1.0;
        if(player.hometown && player.hometown.trim()){
          const school = (player.hometown||'').toLowerCase().trim();
          const schoolConfs = {'alabama':1,'arkansas':1,'auburn':1,'florida':1,'georgia':1,'kentucky':1,'lsu':1,'mississippi state':1,'missouri':1,'ole miss':1,'south carolina':1,'tennessee':1,'texas':1,'texas a&m':1,'vanderbilt':1,'illinois':1,'indiana':1,'iowa':1,'maryland':1,'michigan':1,'michigan state':1,'minnesota':1,'nebraska':1,'northwestern':1,'ohio state':1,'penn state':1,'purdue':1,'rutgers':1,'wisconsin':1,'ucla':1,'usc':1,'oregon':1,'washington':1,'arizona':1,'arizona state':1,'baylor':1,'byu':1,'cincinnati':1,'colorado':1,'houston':1,'iowa state':1,'kansas':1,'kansas state':1,'oklahoma state':1,'tcu':1,'texas tech':1,'ucf':1,'utah':1,'west virginia':1,'boston college':1,'clemson':1,'duke':1,'florida state':1,'georgia tech':1,'louisville':1,'miami':1,'nc state':1,'north carolina':1,'notre dame':1,'pittsburgh':1,'syracuse':1,'virginia':1,'virginia tech':1,'wake forest':1,'california':1,'smu':1,'stanford':1,'butler':2,'connecticut':2,'uconn':2,'creighton':2,'depaul':2,'georgetown':2,'marquette':2,'providence':2,'seton hall':2,"st. john's":2,'villanova':2,'xavier':2,'belmont':5,'winthrop':5,'samford':6,'furman':6,'appalachian state':5,'eastern kentucky':6,'morehead state':6,'western carolina':6,'unc asheville':6,'st. bonaventure':4,'duquesne':4,'fordham':4,'la salle':4,'davidson':4,'vcu':4};
          let originTier = null;
          for(const [k,tier] of Object.entries(schoolConfs)){
            if(school.includes(k)){ originTier = tier; break; }
          }
          if(originTier && conf){
            const dt = PROJ_CONF_TIERS_P[conf]||3;
            const base_tf = (PROJ_TRANS_MAT_P[originTier]||{})[dt]||1.0;
            const gBoost  = grade>=90?1.22 : grade>=85?1.14 : grade>=80?1.07 : grade>=75?1.02 : grade>=70?0.97 : 0.91;
            transferFactor = Math.max(0.20, Math.min(1.6, base_tf*gBoost));
          }
        }

        // Efficiency adjustments
        const fgBase = parseFloat(base.fg_pct||0)||44;
        const tpBase = parseFloat(base.tp_pct||0)||0;
        const ftBase = parseFloat(base.ft_pct||0)||70;
        // FT% smoothing — use meaningful seasons only (avoids bench noise)
        const careerFtPct = meaningful.length>=2
          ? meaningful.reduce((s,h)=>s+parseFloat(h.ft_pct||0),0)/meaningful.length : ftBase;
        const ftSmoothed = ftBase*0.65 + careerFtPct*0.35;
        const oldFga  = parseFloat(base.fga||0)||1;
        const newFgaE = oldFga*(newMpg/baseMpg);
        // Only penalize volume increase if player already had a real role (≥12 MPG base)
        const volChange  = (baseMpg >= 12) ? (newFgaE/oldFga)-1 : 0;
        const volPenalty = volChange*3.5;
        const yearEff = isSo?1.2 : isJr?0.6 : isSr?0.0 : 1.8;
        const transPctAdj = transferFactor<0.75?-3.5 : transferFactor<0.85?-2.5
                          : transferFactor<0.92?-1.5 : transferFactor<0.97?-0.8
                          : transferFactor>1.20?+1.2 : transferFactor>1.10?+0.8
                          : transferFactor>1.04?+0.4 : 0;
        const fgProj = r1(Math.max(30,Math.min(65, fgBase+yearEff-volPenalty+transPctAdj)));

        // 3P% — only project if player actually shoots threes (career avg ≥0.5 3PA/game)
        // Prevents centers who shoot 0.0 3PA from getting a fake 3P% projection
        const careerTpa = meaningful.length
          ? meaningful.reduce((s,h)=>s+parseFloat(h.tpa||0),0)/meaningful.length : parseFloat(base.tpa||0);
        const is3Shooter = careerTpa >= 0.5;
        const tpProj = is3Shooter
          ? r1(Math.max(18,Math.min(50, tpBase+(isSo?0.8:isJr?0.4:isSr?0:1.5)-(volChange*2)+transPctAdj*0.6)))
          : tpBase;  // preserve their actual 3P% (0% for non-shooters)

        const ftProj = r1(Math.max(45,Math.min(97, ftSmoothed+(isSo?1.0:isJr?0.5:isSr?0:1.5))));

        const newFga = r1(pm.fga*rateGrowth*newMpg);
        const newTpa = is3Shooter ? r1(pm.tpa*rateGrowth*newMpg) : r1(pm.tpa*newMpg);
        proj = {...player,
          ppg: r1(pm.ppg *rateGrowth*newMpg),
          rpg: r1(pm.rpg *rateGrowth*newMpg),
          apg: r1(pm.apg *rateGrowth*newMpg),
          mpg: r1(newMpg),
          fgm: r1(newFga*(fgProj/100)), fga: newFga, fg_pct: fgProj,
          tpm: r1(newTpa*(tpProj/100)),
          tpa: newTpa, tp_pct: tpProj,
          ftm: r1(pm.fta*rateGrowth*newMpg*(ftProj/100)),
          fta: r1(pm.fta*rateGrowth*newMpg), ft_pct: ftProj,
          oreb: r1(pm.oreb*rateGrowth*newMpg),
          dreb: r1(pm.dreb*rateGrowth*newMpg),
          stl:  r1(pm.stl *rateGrowth*newMpg),
          blk:  r1(pm.blk *rateGrowth*newMpg),
          tovs: r1(pm.tovs*rateGrowth*newMpg),
          _frosh:false, _factor:transferFactor, _trend:trendMult, _seasons:played.length,
        };
      }
    }catch(projErr){
      console.warn('Projection failed:',projErr);
      proj = null;
    }

    renderPage();
  }catch(e){
    console.error('Player load error:',e);
    document.getElementById('heroSection').innerHTML=`<div style="padding:80px;text-align:center;"><div style="font-family:'Playfair Display',serif;font-weight:800;font-size:24px;margin-bottom:8px;">Player not found</div><p style="color:var(--text3);margin-bottom:16px;">${e.message}</p><a href="roster.html" style="color:var(--accent);">← Back to players</a></div>`;
  }
}

function calcPct(){
  ['ppg','rpg','apg','mpg','fg_pct','tp_pct','ft_pct','stl','blk','tovs'].forEach(k=>{
    gPct[k]=allPlayers.map(p=>parseFloat(p[k])).filter(v=>!isNaN(v)&&v>0).sort((a,b)=>a-b);
  });
}

function getPct(val,key){
  const arr=gPct[key]; if(!arr?.length||val==null) return 0;
  const v=parseFloat(val); if(isNaN(v)||v===0) return 0;
  let lo=0,hi=arr.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<v)lo=mid+1;else hi=mid;}
  const p=Math.round(lo/arr.length*100);
  return key==='tovs'?100-p:p;
}

function buildOverviewCards(p, proj){
  const STATS = [{l:'PPG',k:'ppg'},{l:'RPG',k:'rpg'},{l:'APG',k:'apg'},{l:'MPG',k:'mpg'},
    {l:'FG%',k:'fg_pct',pct:true},{l:'3P%',k:'tp_pct',pct:true},{l:'FT%',k:'ft_pct',pct:true},
    {l:'STL',k:'stl'},{l:'BLK',k:'blk'},{l:'TO',k:'tovs'}];

  function card(val, label, accent, diff){
    const col = accent ? 'color:var(--accent);' : '';
    const diffHtml = diff != null ? '<div class="stat-card-diff '+(diff>0.05?'up':diff<-0.05?'dn':'eq')+'">'+(diff>0.05?'+':'')+diff+'</div>' : '';
    return '<div class="stat-card"><div class="stat-card-val" style="'+col+'">'+val+'</div><div class="stat-card-label">'+label+'</div>'+diffHtml+'</div>';
  }

  function cards(src, accent, compare){
    return STATS.map(s=>{
      const v = s.pct ? fmtP(src[s.k]) : fmt(src[s.k]);
      let diff = null;
      if(compare != null){
        const d = r1((parseFloat(src[s.k])||0)-(parseFloat(compare[s.k])||0));
        diff = d;
      }
      return card(v, s.l, accent, diff);
    }).join('');
  }

  const hasActual = p.ppg && parseFloat(p.ppg) > 0;

  if(!proj){
    return '<div class="stat-cards" style="margin-bottom:24px;">'+cards(p, false, null)+'</div>';
  }

  if(!hasActual){
    return '<div style="margin-bottom:24px;">'
      +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:8px;">2026-27 Projected <span style="font-size:9px;padding:1px 4px;background:rgba(139,105,20,.12);">EST</span></div>'
      +'<div class="stat-cards">'+cards(proj, true, null)+'</div>'
      +'</div>';
  }

  const estBadge = proj._frosh ? ' <span style="font-size:9px;padding:1px 4px;background:rgba(139,105,20,.12);">EST</span>' : '';
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">'
    +'<div>'
    +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border2);">2025-26 Actual</div>'
    +'<div class="stat-cards">'+cards(p, false, null)+'</div>'
    +'</div>'
    +'<div>'
    +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);">2026-27 Projected'+estBadge+'</div>'
    +'<div class="stat-cards">'+cards(proj, true, p)+'</div>'
    +'</div>'
    +'</div>';
}

function renderStatTable(p, projData){
  const seasonLabel = y => {
    const yr = parseInt(y);
    return isNaN(yr) ? y : `${yr-1}-${String(yr).slice(2)}`;
  };

  let rowsHtml = '';

  // If we have career history, show every season the player was rostered
  if(careerHistory && careerHistory.length){
    careerHistory.forEach(s=>{
      if(s.sat_out || (s.ppg==null && (s.gp==null||s.gp===0))){
        // Sat-out / redshirt season — show team + "Did not play"
        rowsHtml += `<tr style="opacity:.55;">
          <td>${seasonLabel(s.season_year)}</td>
          <td colspan="19" style="text-align:left;font-style:italic;color:var(--text3);">
            Redshirt / Did not play
          </td>
        </tr>`;
      } else {
        rowsHtml += `<tr class="actual">
          <td>${seasonLabel(s.season_year)}</td>
          <td>${s.gp||'—'}</td>
          <td>${fmt(s.ppg)}</td><td>${fmt(s.rpg)}</td><td>${fmt(s.apg)}</td><td>${fmt(s.mpg)}</td>
          <td>${fmt(s.fgm)}</td><td>${fmt(s.fga)}</td><td>${fmtP(s.fg_pct)}</td>
          <td>${fmt(s.tpm)}</td><td>${fmt(s.tpa)}</td><td>${fmtP(s.tp_pct)}</td>
          <td>${fmt(s.ftm)}</td><td>${fmt(s.fta)}</td><td>${fmtP(s.ft_pct)}</td>
          <td>${fmt(s.oreb)}</td><td>${fmt(s.dreb)}</td>
          <td>${fmt(s.stl)}</td><td>${fmt(s.blk)}</td><td>${fmt(s.tovs)}</td>

    // No career history — fall back to the current season row from players table
    rowsHtml += `<tr class="actual">
      <td>2025-26</td>
      <td>${p.gp||'—'}</td>
      <td>${fmt(p.ppg)}</td><td>${fmt(p.rpg)}</td><td>${fmt(p.apg)}</td><td>${fmt(p.mpg)}</td>

      <td>${fmt(p.oreb)}</td><td>${fmt(p.dreb)}</td>
      <td>${fmt(p.stl)}</td><td>${fmt(p.blk)}</td><td>${fmt(p.tovs)}</td>
    </tr>`;
  }

  // Always append the 2026-27 projection row
  if(projData){
    rowsHtml += `<tr class="proj">

      <td>—</td>

function buildStatNarrative(p){
  const ppg=parseFloat(p.ppg)||0, rpg=parseFloat(p.rpg)||0, apg=parseFloat(p.apg)||0;
  const fg=parseFloat(p.fg_pct)||0, tp=parseFloat(p.tp_pct)||0, ft=parseFloat(p.ft_pct)||0;
  const stl=parseFloat(p.stl)||0, blk=parseFloat(p.blk)||0;
  const pos=p.position||'G'; const name=p.name.split(' ')[0];
  const yr=(p.yr||p.class_year||'');

  let parts=[];
  if(ppg>0) parts.push(`${name} averaged ${ppg.toFixed(1)} points, ${rpg.toFixed(1)} rebounds, and ${apg.toFixed(1)} assists per game in 2025-26.`);
  if(fg>0){
    const fgDesc=fg>=52?'highly efficient':fg>=46?'efficient':fg>=42?'average':'below-average';
    parts.push(`Shot ${fg.toFixed(1)}% from the field — ${fgDesc} for the position.`);
  }
  if(tp>0&&(parseFloat(p.tpa)||0)>2){
    const tpDesc=tp>=40?'elite':tp>=36?'solid':tp>=32?'adequate':'concerning';
    parts.push(`Connected at ${tp.toFixed(1)}% from three — ${tpDesc} efficiency on ${(parseFloat(p.tpa)||0).toFixed(1)} attempts.`);
  }
  if(stl+blk>1.5) parts.push(`Provides defensive value with ${stl.toFixed(1)} steals and ${blk.toFixed(1)} blocks per game.`);
  if(yr) parts.push(`As a ${yr} ${pos}, ${name} will be an important piece of the program going forward.`);

  return parts.join(' ')||'Insufficient stats for narrative.';
}

// ── RADAR CHART ─────────────────────────────────────────
function drawRadar(){
  const canvas=document.getElementById('radarChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=player;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const textCol=isDark?'#a0a0a0':'#888';
  const gridCol=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const color=teamData?.color||'#8B6914';

  // 6 axes: Scoring, Shooting, Playmaking, Rebounding, Defense, Efficiency
  const axes=[
    {label:'Scoring', val:Math.min(100,getPct(p.ppg,'ppg'))},
    {label:'Shooting', val:Math.min(100,Math.round((getPct(p.fg_pct,'fg_pct')+getPct(p.tp_pct,'tp_pct'))/2))},
    {label:'Playmaking', val:Math.min(100,getPct(p.apg,'apg'))},
    {label:'Rebounding', val:Math.min(100,getPct(p.rpg,'rpg'))},
    {label:'Defense', val:Math.min(100,Math.round((getPct(p.stl,'stl')+getPct(p.blk,'blk'))/2))},
    {label:'Free Throws', val:Math.min(100,getPct(p.ft_pct,'ft_pct'))},
  ];


  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-40;
  const n=axes.length;

  // Draw grid rings
  for(let ring=1;ring<=5;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const angle=Math.PI*2*i/n-Math.PI/2;
      const x=cx+Math.cos(angle)*r*(ring/5);
      const y=cy+Math.sin(angle)*r*(ring/5);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  }

  // Draw axis lines and labels
  axes.forEach((ax,i)=>{
    const angle=Math.PI*2*i/n-Math.PI/2;
    const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
    const lx=cx+Math.cos(angle)*(r+18), ly=cy+Math.sin(angle)*(r+18);
    ctx.fillStyle=textCol; ctx.font='bold 11px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ax.label,lx,ly);
  });

  function drawShape(axData, fillCol, strokeCol, alpha){
    ctx.beginPath();
    axData.forEach((ax,i)=>{
      const angle=Math.PI*2*i/n-Math.PI/2;
      const val=ax.val/100;
      const x=cx+Math.cos(angle)*r*val, y=cy+Math.sin(angle)*r*val;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle=fillCol; ctx.globalAlpha=alpha; ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=strokeCol; ctx.lineWidth=2; ctx.stroke();
  }

  // Draw actual
  drawShape(axes,color,color,0.15);
  // Always show projected overlay if available
  const showProjRadar = proj && !proj._frosh;
  if(showProjRadar){
    const projAxes=[
      {label:'Scoring', val:Math.min(100,getPct(proj.ppg,'ppg'))},
      {label:'Shooting', val:Math.min(100,Math.round((getPct(proj.fg_pct,'fg_pct')+getPct(proj.tp_pct,'tp_pct'))/2))},
      {label:'Playmaking', val:Math.min(100,getPct(proj.apg,'apg'))},
      {label:'Rebounding', val:Math.min(100,getPct(proj.rpg,'rpg'))},
      {label:'Defense', val:Math.min(100,Math.round((getPct(proj.stl,'stl')+getPct(proj.blk,'blk'))/2))},
      {label:'Free Throws', val:Math.min(100,getPct(proj.ft_pct,'ft_pct'))},
    ];
    drawShape(projAxes,'rgba(139,105,20,0.8)','#8B6914',0.12);
  }

  // Legend
  const legendEl=document.getElementById('radarLegend');
  if(legendEl){
    legendEl.innerHTML=`<div class="radar-legend-item"><div class="radar-legend-dot" style="background:${color};"></div>2025-26 Actual</div>${showProjRadar?`<div class="radar-legend-item"><div class="radar-legend-dot" style="background:var(--accent);opacity:.6;"></div>2026-27 Projected</div>`:''}`;
  }
}

function switchTab(t){
  ['overview','stats','percentiles','scout'].forEach(x=>{
    document.getElementById('tab-'+x)?.classList.toggle('active',x===t);
    document.getElementById('panel-'+x)?.classList.toggle('active',x===t);
  });
  if(t==='overview') setTimeout(drawRadar,50);
}

async function updateNav(s){
  try{
    const [p]=await fetch(`${SB}/rest/v1/profiles?id=eq.${s.user?.id}&select=username,avatar_url`,{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}}).then(r=>r.json());
    const uname=p?.username||'User';
    const av=p?.avatar_url?`<img src="${p.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);">`:`<div style="width:32px;height:32px;border-radius:50%;background:var(--bg2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);">${uname[0].toUpperCase()}</div>`;
    document.getElementById('navActions').innerHTML=`<button class="theme-toggle" onclick="toggleTheme()">${localStorage.getItem('tdc_theme')==='dark'?'☀️':'🌙'}</button><a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;">${av}<span style="font-size:13px;font-weight:700;color:var(--text);">${uname}</span></a>`;
  }catch(e){}
}

function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  const n=d?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('tdc_theme',n);
  setTimeout(drawRadar,50);
}
(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('tdc_theme')||'light');})();
init();
</script>
