  <style>
    .nil-card{border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:130px;background:var(--bg2);}
    .nil-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .nil-big{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;line-height:1;}
    .nil-steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
    .nil-step{flex:1;min-width:150px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--bg2);font-size:11px;color:var(--text3);line-height:1.5;}
    .nil-step b{color:var(--text);font-size:13px;}
    .nil-step-n{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#221c08;font-weight:800;font-size:10px;margin-bottom:7px;}
    .nil-step-final{background:var(--bg3);}
    .nil-table{width:100%;border-collapse:collapse;font-size:12px;max-width:640px;}
    .nil-table th{text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:8px;border-bottom:1px solid var(--border2);}
    .nil-table th.left,.nil-table td.left{text-align:left;}
    .nil-table td{text-align:right;padding:8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
  </style>

  <style>
    :root{--bg: #FAF9F6;--bg2: #F1EFEA;--bg3: #E6E3DB;--border: #DEDACF;--border2: #C6C0B2;--text: #1A1814;--text2: #4A463C;--text3: #8A867A;--accent: #A8843C;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg: #141416;--bg2: #1D1D20;--bg3: #28282C;--border: #2E2E34;--border2: #45454D;--text: #F1EFEA;--text2: #B4B0A8;--text3: #807C74;--accent: #E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;}
    /* NAV — frosted glass */
    .nav-wrap{border-bottom:1px solid var(--border);background:rgba(250,249,246,.66);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);position:sticky;top:0;z-index:200;}
    [data-theme="dark"] .nav-wrap{background:rgba(12,10,22,.62);border-bottom-color:rgba(26,43,68,.9);}
    .nav-top{padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;}
    @keyframes logoReveal{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;letter-spacing:-.01em;white-space:nowrap;animation:logoReveal .55s cubic-bezier(.22,1,.36,1) both;}
    .nav-logo span{color:var(--accent);}
    .nav-actions{display:flex;align-items:center;gap:14px;}
    .nav-actions a{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s;}
    .nav-actions a:hover{color:var(--text);}
    .nav-signin{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--text);padding:6px 16px;text-decoration:none;display:inline-block;transition:opacity .15s;}
    .nav-signin:hover{opacity:.85;}
    .theme-toggle,.theme-btn{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
    .theme-toggle:hover,.theme-btn:hover{border-color:var(--accent);}
    .nav-sub{border-top:1px solid var(--border);padding:0 40px;height:36px;display:flex;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .nav-sub::-webkit-scrollbar{display:none;}
    .nav-sub a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;position:relative;white-space:nowrap;flex-shrink:0;transition:color .2s;}
    .nav-sub a:first-child{padding-left:0;}
    .nav-sub a::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .22s cubic-bezier(.22,1,.36,1);}
    .nav-sub a:first-child::after{left:0;}
    .nav-sub a:hover{color:var(--text);}
    .nav-sub a:hover::after,.nav-sub a.active::after{transform:scaleX(1);}
    .nav-sub a.active{color:var(--text);}

    /* HERO — premium player card */
    .player-hero{position:relative;padding:34px 40px 28px;border-bottom:1px solid var(--border);display:flex;gap:26px;align-items:center;overflow:hidden;isolation:isolate;}
    .player-hero::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(102deg, color-mix(in srgb, var(--tc) 13%, transparent) 0%, color-mix(in srgb, var(--tc) 4%, transparent) 34%, transparent 58%);pointer-events:none;}
    .player-hero::after{content:'';position:absolute;top:-55%;right:-4%;width:420px;height:420px;border-radius:50%;z-index:-1;background:radial-gradient(circle, color-mix(in srgb, var(--tc) 16%, transparent), transparent 66%);filter:blur(38px);pointer-events:none;}
    .hero-avatar{width:130px;height:130px;border-radius:26px;background:linear-gradient(155deg, color-mix(in srgb, var(--tc) 34%, var(--bg2)), var(--bg2) 78%);border:1.5px solid color-mix(in srgb, var(--tc) 55%, var(--border2));box-shadow:0 0 0 4px color-mix(in srgb, var(--tc) 13%, transparent), 0 14px 34px rgba(0,0,0,.34);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:52px;color:#fff;flex-shrink:0;text-shadow:0 2px 10px rgba(0,0,0,.4);}
    .hero-avatar{position:relative;}
    .hero-badge-medal{position:absolute;right:-11px;bottom:-9px;width:48px;height:48px;padding:0;border:none;background:none;cursor:pointer;z-index:3;filter:drop-shadow(0 4px 11px rgba(0,0,0,.5));transition:transform .16s cubic-bezier(.34,1.46,.64,1);}
    .hero-badge-medal:hover{transform:translateY(-2px) scale(1.07);}
    .hero-badge-medal svg{width:100%;height:auto;display:block;}
    @media(max-width:520px){.hero-badge-medal{width:40px;height:40px;right:-8px;bottom:-7px;}}
    .hero-info{flex:1;min-width:0;}
    .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
    .hero-name{font-family:'Playfair Display',serif;font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1.04;margin-bottom:11px;}
    .hero-team{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 9px;border:1px solid color-mix(in srgb, var(--tc) 32%, var(--border));border-radius:30px;background:color-mix(in srgb, var(--tc) 11%, var(--bg2));font-size:12.5px;font-weight:700;text-decoration:none;color:var(--text);transition:border-color .18s, background .18s;}
    .hero-team:hover{border-color:color-mix(in srgb, var(--tc) 60%, var(--border));background:color-mix(in srgb, var(--tc) 18%, var(--bg2));}
    .team-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px color-mix(in srgb, var(--tc) 80%, transparent);}
    .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;}
    .hero-meta-item{font-size:11.5px;font-weight:600;color:var(--text2);background:color-mix(in srgb, var(--tc) 8%, var(--bg2));border:1px solid var(--border);border-radius:30px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;}
    .hero-meta-item strong{color:var(--text);font-weight:800;}
    .hero-grade-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-left:6px;}
    .hero-grade{font-family:'Inter','Helvetica Neue',system-ui,sans-serif;font-weight:800;font-size:88px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:linear-gradient(155deg, color-mix(in srgb, var(--tc) 70%, #fff), var(--tc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    [data-theme="dark"] .hero-grade{background:linear-gradient(155deg, #ffffff, color-mix(in srgb, var(--tc) 38%, #fff));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .hero-grade-lbl{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);}
    /* hero tier-shield badges */
    .badges-cell{display:flex !important;gap:7px;align-items:flex-end;justify-content:center;min-height:30px;}
    .bshield{display:inline-flex;flex-direction:column;align-items:center;gap:1px;line-height:1;}
    .bshield svg{width:22px;height:25px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
    .bshield b{font-size:12px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
    /* NBA Draft prospect sticker */
    .draft-sticker{display:inline-flex;align-items:center;gap:11px;margin-top:14px;padding:7px 16px 7px 11px;border-radius:30px;background:linear-gradient(100deg, color-mix(in srgb, var(--tc) 30%, var(--bg2)), var(--bg2) 80%);border:1px solid color-mix(in srgb, var(--tc) 50%, var(--border2));box-shadow:0 0 0 1px color-mix(in srgb, var(--tc) 16%, transparent), 0 6px 22px color-mix(in srgb, var(--tc) 20%, rgba(0,0,0,.32));animation:gradeStamp .55s .35s cubic-bezier(.34,1.46,.64,1) both;}
    .ds-rank{font-family:'Playfair Display',serif;font-weight:800;font-size:23px;line-height:1;background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 88%, #fff), var(--tc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    .ds-text{display:flex;flex-direction:column;line-height:1.18;}
    .ds-lbl{font-size:8.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);}
    .ds-pos{font-size:12px;font-weight:800;color:var(--text);}
    .ds-emoji{font-size:15px;}
    .gA{color:#071e5a;}.gB{color:#1040b8;}.gC{color:#4278d4;}.gD{color:#88aadd;}.gF{color:#b8cee8;}

    /* STAT TOGGLE */
    .stat-toggle{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border2);width:fit-content;}
    .stat-toggle-btn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border:none;background:none;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
    .stat-toggle-btn.active{background:var(--text);color:var(--bg);}

    /* TABS — animated */
    .tab-row{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:0 40px;overflow:visible;}
    .tab-row::-webkit-scrollbar{display:none;}
    /* scroll-hint fade on the right when more tabs are off-screen */
    .tab-row-wrap{position:relative;}
    .tab-row-wrap::after{content:'';position:absolute;top:0;right:0;bottom:1px;width:48px;pointer-events:none;
      background:linear-gradient(to right, transparent, var(--bg));opacity:0;transition:opacity .2s;}
    .tab-row-wrap.more::after{opacity:1;}
    .tab-btn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Inter',sans-serif;transition:color .2s;white-space:nowrap;position:relative;}
    .tab-btn::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:center;transition:transform .25s cubic-bezier(.22,1,.36,1);}
    .tab-btn.active{color:var(--text);}
    .tab-btn.active::after{transform:scaleX(1);}
    .tab-btn:hover:not(.active){color:var(--text2);}
    /* ── Grouped tab menus (Overview · Stats & Shots ▾ · Coach's Tier 🔒 ▾ · Market ▾) ── */
    .tab-grp{position:relative;display:inline-flex;}
    .tab-grp-btn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 18px;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Inter',sans-serif;transition:color .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;position:relative;}
    .tab-grp-btn::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .25s cubic-bezier(.22,1,.36,1);}
    .tab-grp.grp-active .tab-grp-btn,.tab-grp.open .tab-grp-btn{color:var(--text);}
    .tab-grp.grp-active .tab-grp-btn::after,.tab-grp.open .tab-grp-btn::after{transform:scaleX(1);}
    .tab-grp-btn:hover{color:var(--text2);}
    .tab-grp-car{font-size:8px;opacity:.6;transition:transform .2s;}
    .tab-grp.open .tab-grp-car{transform:rotate(180deg);}
    .tab-grp-lock{font-size:.82em;opacity:.75;}
    .tab-grp-menu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:6px;min-width:194px;display:none;flex-direction:column;gap:1px;z-index:400;box-shadow:0 18px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);}
    .tab-grp.open .tab-grp-menu{display:flex;}
    .tab-grp-menu .tab-btn{display:block;width:100%;text-align:left;padding:9px 13px;border-radius:8px;border-bottom:none;margin:0;letter-spacing:.03em;}
    .tab-grp-menu .tab-btn::after{display:none;}
    .tab-grp-menu .tab-btn:hover:not(.active){background:var(--bg3);color:var(--text2);}
    .tab-grp-menu .tab-btn.active{background:var(--bg3);color:var(--tc-readable,var(--accent));}
    .tab-grp-div{height:1px;background:var(--border);margin:5px 6px;}
    .tab-grp-ext{display:block;padding:9px 13px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);text-decoration:none;border-radius:8px;}
    .tab-grp-ext:hover{background:var(--bg3);color:var(--tc-readable,var(--accent));}
    /* Coach's Tier mega-menu — the full player toolkit in a 2-column card grid */
    .tab-grp-mega{min-width:440px;max-width:min(92vw,520px);}
    .hgm-sec{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:8px 10px 5px;}
    .hgm-item{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:8px 12px;border:none;border-radius:8px;background:none;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;}
    .hgm-item:hover{background:var(--bg3);}
    .hgm-item.active{background:var(--bg3);}
    .hgm-item.active .hgm-t{color:var(--tc-readable,var(--accent));}
    .hgm-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;}
    .hgm-card{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border-radius:8px;text-decoration:none;cursor:pointer;}
    .hgm-card:hover{background:var(--bg3);}
    .hgm-t{font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:0;text-transform:none;}
    .hgm-d{font-size:10.5px;color:var(--text3);font-weight:500;letter-spacing:0;text-transform:none;}
    .hgm-card .hgm-t::after{content:'↗';font-size:.75em;color:var(--text3);margin-left:4px;opacity:0;transition:opacity .15s;}
    .hgm-card:hover .hgm-t::after{opacity:1;}
    /* Phones: mega menus go single-column and fit the screen (were 440px 2-col → overflowed) */
    @media (max-width:640px){
      .tab-grp-mega{min-width:0!important;width:min(90vw,340px);}
      .tab-grp-mega .hgm-grid{grid-template-columns:1fr;}
      .tab-grp-menu{max-width:90vw;}
    }
    .tab-panel{display:none;padding:28px 40px 60px;}
    /* BUZZ TAB — headlines + social (live: player_news.json / player_buzz.json) */
    .buzz-note{font-size:12px;color:var(--text3);background:var(--bg2);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;margin-bottom:24px;line-height:1.5;}
    .buzz-note b{color:var(--text2);}
    .buzz-index-card{display:flex;align-items:center;gap:18px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:22px;}
    .buzz-index-card .bi-num{font-family:'Playfair Display',serif;font-weight:800;font-size:46px;line-height:1;flex:0 0 auto;min-width:62px;text-align:center;}
    .buzz-index-card .bi-body{flex:1;min-width:0;}
    .buzz-index-card .bi-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
    .buzz-index-card .bi-label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);}
    .buzz-index-card .bi-tier{font-size:14px;font-weight:800;}
    .buzz-index-card .bi-track{height:8px;border-radius:5px;background:rgba(130,150,200,.14);overflow:hidden;}
    .buzz-index-card .bi-track i{display:block;height:100%;border-radius:5px;opacity:.9;}
    .buzz-index-card .bi-foot{font-size:11.5px;color:var(--text2);margin-top:8px;line-height:1.4;}
    .buzz-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
    @media(max-width:820px){.buzz-cols{grid-template-columns:1fr;gap:30px;}}
    .buzz-list{display:flex;flex-direction:column;gap:11px;}
    .news-card{display:block;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s;}
    .news-card:hover{border-color:var(--accent);transform:translateY(-1px);}
    .news-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;}
    .news-src{font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);}
    .news-dot{color:var(--text3);}
    .news-time{color:var(--text3);}
    .news-head{font-size:14.5px;font-weight:700;line-height:1.35;color:var(--text);}
    .news-dek{font-size:12.5px;color:var(--text3);line-height:1.45;margin-top:5px;}
    .buzz-empty{font-size:12.5px;color:var(--text3);line-height:1.5;padding:18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;}
    .tweet-card{padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;}
    .tw-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
    .tw-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;font-family:'Inter',sans-serif;}
    .tw-id{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
    .tw-name{font-size:13.5px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:4px;}
    .tw-check{color:#1d9bf0;font-size:13px;}
    .tw-handle{font-size:12px;color:var(--text3);}
    .tw-time{margin-left:auto;font-size:12px;color:var(--text3);flex-shrink:0;}
    .tw-text{font-size:13.5px;line-height:1.5;color:var(--text2);}
    .tw-stats{display:flex;gap:20px;margin-top:11px;font-size:12px;color:var(--text3);}

    .shot-analytics{display:grid;grid-template-columns:1fr;gap:34px;margin:34px auto;max-width:1720px;}
    .sa-col{min-width:0;}
    @media(min-width:1360px){.shot-analytics{grid-template-columns:660px minmax(0,1fr);gap:40px;align-items:start;}}
    /* ── Shot Genome card ── */
    .sg-card{max-width:1720px;margin:8px auto 0;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 22px;}
    .sg-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
    .sg-title{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;letter-spacing:-.01em;}
    .sg-title small{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-left:8px;}
    .sg-type{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--accent);border-radius:6px;padding:4px 10px;}
    .sg-verdict{font-size:13px;color:var(--text2);line-height:1.5;margin:2px 0 16px;max-width:720px;}
    .sg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .sg-grid.cols4{grid-template-columns:repeat(4,1fr);}
    @media(max-width:900px){.sg-grid.cols4{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:680px){.sg-grid,.sg-grid.cols4{grid-template-columns:1fr;}}
    .sg-metric{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 15px;}
    .sg-mlbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);cursor:help;text-decoration:underline dotted var(--text3);text-underline-offset:2px;}
    .sg-mval{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1;margin:8px 0 3px;}
    .sg-msub{font-size:11px;color:var(--text3);}
    .sg-bar{height:6px;border-radius:4px;background:var(--bg3,rgba(130,150,200,.14));overflow:hidden;margin:11px 0 6px;}
    .sg-bar i{display:block;height:100%;border-radius:4px;}
    .sg-pctl{font-size:11px;font-weight:700;}
    .sg-desc{font-size:11.5px;color:var(--text2);margin-top:7px;line-height:1.45;}
    .sg-empty{color:var(--text3);font-size:13px;padding:8px 0 4px;}
    /* player Scoring Consistency (Heat Index) card — sits below Shot Genome */
    .heat-card{margin-top:14px;}
    .hc-body{display:grid;grid-template-columns:216px 1fr;gap:28px;align-items:center;}
    @media(max-width:680px){.hc-body{grid-template-columns:1fr;gap:20px;}}
    .hc-num{font-family:'Playfair Display',serif;font-weight:800;font-size:44px;line-height:1;}
    .hc-num sup{font-size:19px;font-weight:800;margin-left:1px;}
    .hc-num-sub{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:7px 0 13px;}
    .heat-mini-track{height:8px;border-radius:5px;background:linear-gradient(90deg,rgba(90,169,255,.28),rgba(130,150,200,.14),rgba(224,145,58,.3));overflow:hidden;}
    .heat-mini-fill{height:100%;border-radius:5px;opacity:.9;}
    .heat-mini-scale{display:flex;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-top:5px;}
    .hc-range-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;}
    .hc-range-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .hc-range-ppg{font-family:'Share Tech Mono',monospace;font-size:12.5px;font-weight:700;color:var(--text2);}
    .hc-track{position:relative;height:12px;border-radius:6px;background:var(--bg3,rgba(130,150,200,.14));}
    .hc-span{position:absolute;top:0;bottom:0;border-radius:6px;opacity:.9;}
    .hc-avg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);transform:translateX(-1px);border-radius:2px;}
    .hc-ends{position:relative;height:30px;margin-top:7px;}
    .hc-end{position:absolute;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;text-align:center;}
    .hc-end small{display:block;font-family:inherit;font-size:8.5px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
    .hc-ceil{left:auto;right:0;transform:none;text-align:right;}
    .hc-ceil small{text-align:right;}
    .hc-foot{font-size:11.5px;color:var(--text2);margin-top:15px;line-height:1.45;}
    .sg-link{font-size:11.5px;font-weight:700;color:var(--accent);text-decoration:none;}
    .sg-link:hover{text-decoration:underline;}
    .tab-panel.active{display:block;}
    /* Full Stats sub-modes */
    .statmode-row{display:inline-flex;gap:4px;padding:4px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;margin-bottom:16px;}
    .statmode-btn{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:7px 15px;border:none;border-radius:6px;background:none;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .18s;}
    .statmode-btn:hover:not(.active){color:var(--text2);}
    .statmode-btn.active{background:var(--accent);color:#221c08;}
    .statmode-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
    .statmode-bar .statmode-row{margin-bottom:0;}
    .pct-toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
    .pct-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
    .pct-toggle input{position:absolute;opacity:0;width:0;height:0;}
    .pct-track{position:relative;width:38px;height:21px;border-radius:11px;background:var(--border2);transition:background .2s;flex-shrink:0;}
    .pct-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
    .pct-toggle input:checked + .pct-track{background:rgba(30,82,205,.9);}
    .pct-toggle input:checked + .pct-track .pct-knob{transform:translateX(17px);}
    /* Game log */
    .gl-seasons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
    .gl-season-btn{font-size:12px;font-weight:700;padding:6px 13px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .16s;}
    .gl-season-btn:hover:not(.active){color:var(--text);border-color:var(--border2);}
    .gl-season-btn.active{background:var(--accent);color:#221c08;border-color:var(--accent);}
    .gl-table th,.gl-table td{white-space:nowrap;}
    .gl-row:hover{background:var(--bg2);}
    .gl-date{color:var(--text3);font-weight:600;text-align:left;}
    .gl-opp{text-align:left;font-weight:600;color:var(--text);}
    .gl-tier{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:4px;color:#fff;vertical-align:middle;}
    .gl-tier-1{background:#c99a2e;} .gl-tier-2{background:#3d8f6b;} .gl-tier-3{background:#64748b;} .gl-tier-4{background:#9aa3b2;}
    .gl-tier-head{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
    .gl-tier-clear{color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:700;margin-left:6px;}
    .gl-tier-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
    .gl-tcard{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:13px 14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;}
    .gl-tcard:hover:not(.empty){transform:translateY(-2px);border-color:var(--border2);}
    .gl-tcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
    .gl-tcard.empty{opacity:.5;cursor:default;}
    .gl-tcard-h{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;}
    .gl-tcard-big{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;line-height:1;}
    .gl-tcard-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:3px;}
    .gl-tcard-sub{font-size:10.5px;color:var(--text3);margin-top:7px;}
    .gl-tcard-none{font-size:13px;color:var(--text3);font-style:italic;padding:8px 0;}
    .gl-season-btn.dim{opacity:.4;}
    @media(max-width:640px){.gl-tier-grid{grid-template-columns:repeat(2,1fr);}}
    .gl-pts{font-weight:800;}
    .gl-res{text-align:left;white-space:nowrap;}
    .gl-rating{display:inline-block;min-width:36px;padding:3px 8px;border-radius:5px;font-weight:800;font-size:12.5px;color:#fff;text-align:center;font-variant-numeric:tabular-nums;}
    .gl-chart{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 18px 10px;margin-bottom:18px;}
    .gl-chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
    .gl-chart-head span:first-child{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .gl-chart-avg{font-size:12px;color:var(--text2);}
    .gl-chart-avg b{font-family:'Playfair Display',serif;font-size:15px;color:var(--text);}
    .gl-gsc{font-family:'Playfair Display',serif;font-weight:700;}
    /* Rankings tab */
    /* Statistical Overall card (new model) */
    .so-card{border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:24px;
      background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 8%, var(--bg2)), var(--bg2));}
    .so-head{display:flex;align-items:center;gap:18px;}
    .so-num{font-family:'Playfair Display',serif;font-weight:800;font-size:60px;line-height:.9;font-variant-numeric:tabular-nums;}
    .so-lbl{font-size:15px;font-weight:800;letter-spacing:.01em;color:var(--text);}
    .so-sub{font-size:12px;color:var(--text3);margin-top:3px;}
    .so-flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 2px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:11px;}
    .so-flow-item{display:flex;flex-direction:column;gap:2px;}
    .so-flow-k{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
    .so-flow-v{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text);}
    .so-flow-arrow{color:var(--text3);font-size:16px;}
    .so-chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px;}
    .so-chip{display:inline-flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--border);
      border-radius:9px;padding:7px 12px;font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
    .so-chip-k{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .so-chip-k em{font-style:normal;opacity:.7;}
    .so-note{font-size:12.5px;line-height:1.55;color:var(--text2);margin:14px 0 0;max-width:70ch;}
    .rk-top{display:grid;grid-template-columns:170px 1fr;gap:26px;align-items:start;}
    .rk-gradebox{text-align:center;padding:22px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;}
    .rk-grade{font-family:'Playfair Display',serif;font-weight:800;font-size:64px;line-height:1;}
    .rk-grade-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:8px;}
    .rk-season{font-size:12px;color:var(--text2);margin-top:6px;font-weight:600;}
    .rk-wa{margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}
    .rk-wa-num{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1;color:#5ab875;}
    .rk-wa-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:4px;}
    .rk-method{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;}
    .rk-method li{font-size:13px;line-height:1.5;color:var(--text2);padding-left:16px;position:relative;}
    .rk-method li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
    .rk-method b{color:var(--text);font-weight:700;}
    .rk-profile{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
    .rk-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 13px;}
    .rk-chip-k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);}
    .rk-sub{font-size:12.5px;color:var(--text3);margin-bottom:16px;line-height:1.5;}
    .rk-drivers{display:flex;flex-direction:column;gap:11px;}
    .rk-row{display:grid;grid-template-columns:160px 56px 1fr;gap:14px;align-items:center;}
    /* Grade build-up: the real, honest decomposition of the projected OVR */
    .rk-buildup{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2);}
    /* TDC Rating (beta) */
    .tdcr-head{display:flex;align-items:baseline;gap:16px;margin:6px 0 14px;}
    .tdcr-num{font-family:'Inter',sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums;}
    .tdcr-meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text3);}
    .tdcr-arch{font-weight:700;}
    .tdcr-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    @media(max-width:600px){.tdcr-cats{grid-template-columns:repeat(2,1fr);}}
    .tdcr-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);}
    .tdcr-cl{font-size:12px;font-weight:600;color:var(--text2);}
    .tdcr-cv{font-family:'Playfair Display',serif;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;}
    /* Archetype fit — box-only, every-year contribution table */
    .acat-tbl{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2);}
    .acat-hd,.acat-row{display:grid;grid-template-columns:1fr 66px 44px 60px;gap:10px;align-items:center;padding:10px 15px;}
    .acat-hd{background:var(--bg3);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
    .acat-hd span:not(:first-child),.acat-row span:not(.acat-l){text-align:right;}
    .acat-row{border-top:1px solid var(--border);}
    .acat-l{font-size:13px;font-weight:700;color:var(--text);}
    .acat-l em{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--text3);margin-top:1px;}
    .acat-z,.acat-w,.acat-p{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;}
    .acat-z{font-weight:800;} .acat-w{color:var(--text3);font-weight:600;}
    .acat-p{font-family:'Playfair Display',serif;font-size:15px;}
    .acat-foot{display:grid;grid-template-columns:1fr 66px;gap:10px;padding:10px 15px;border-top:1px solid var(--border);}
    .acat-foot.tot{background:color-mix(in srgb, var(--accent) 12%, var(--bg2));border-top:1px solid var(--border2);}
    .af-l{font-size:12.5px;color:var(--text2);font-weight:700;}
    .af-l em{font-style:normal;color:var(--text3);font-weight:500;}
    .acat-foot.tot .af-l{color:var(--text);font-weight:800;font-size:13px;}
    .af-v{text-align:right;font-family:'Playfair Display',serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;color:var(--text2);}
    .acat-foot.tot .af-v{color:var(--text);font-size:18px;}
    .af-v.pos{color:#5ab875;} .af-v.neg{color:#e0885a;}
    /* Scheme Lab */
    .sch-intro{font-size:13px;line-height:1.55;color:var(--text2);margin:6px 0 18px;}
    .sch-intro b{color:var(--text);}
    .sch-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--bg2);}
    .sch-tbl{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums;}
    .sch-tbl th,.sch-tbl td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
    .sch-tbl thead th{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);background:var(--bg3);position:sticky;top:0;}
    .sch-tbl th.sch-stat,.sch-tbl td.sch-stat{text-align:left;font-weight:800;color:var(--text);position:sticky;left:0;background:var(--bg2);z-index:1;min-width:118px;}
    .sch-tbl thead th.sch-stat{background:var(--bg3);}
    .sch-tbl td{font-size:13.5px;font-weight:700;color:var(--text2);}
    .sch-col-own{background:color-mix(in srgb, var(--accent) 12%, var(--bg2));}
    .sch-tbl thead th.sch-col-own{background:color-mix(in srgb, var(--accent) 22%, var(--bg3));color:var(--text);}
    .sch-own-tag{display:block;font-size:8.5px;font-weight:800;color:var(--text3);letter-spacing:.04em;margin-top:1px;text-transform:none;}
    .sch-eyebrow{display:block;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
    .sch-logo{display:block;width:24px;height:24px;object-fit:contain;margin:0 auto 4px;}
    .sch-sysname{display:block;font-size:11.5px;font-weight:800;color:var(--text);letter-spacing:.01em;text-transform:none;line-height:1.15;}
    .sch-tbl thead th.sch-col-old,.sch-tbl thead th.sch-col-own{color:var(--text);}
    .sch-tbl td.sch-col-old,.sch-tbl td.sch-col-own{font-weight:800;color:var(--text);}
    .sch-hi{color:#5ab875;font-weight:800;} .sch-lo{color:var(--text3);}
    .sch-stat em{display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--text3);margin-top:1px;}
    .bu-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:11px 16px;border-top:1px solid var(--border);}
    .bu-row:first-child{border-top:none;}
    .bu-lbl{font-size:13px;font-weight:700;color:var(--text);}
    .bu-lbl em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--text3);margin-top:2px;}
    .bu-val{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .bu-val.pos{color:#5ab875;} .bu-val.neg{color:#e0885a;}
    .bu-row.total{background:color-mix(in srgb, var(--accent) 12%, var(--bg2));border-top:1px solid var(--border2);}
    .bu-row.total .bu-lbl{font-weight:800;} .bu-row.total .bu-val{color:var(--text);font-size:22px;}
    .rk-name{font-size:13px;font-weight:700;color:var(--text);}
    .rk-stat{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--text3);margin-left:7px;}
    .rk-val{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--text);text-align:right;}
    .rk-bar{height:9px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
    .rk-fill{height:100%;background:linear-gradient(90deg,var(--accent),#5ab875);border-radius:6px;transition:width .7s cubic-bezier(.22,1,.36,1);}
    .rk-fill.neg{background:linear-gradient(90deg,#c77,#e08a6a);}
    .rk-wt{font-size:12px;font-weight:800;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums;}
    .rk-foot{font-size:11.5px;color:var(--text3);font-style:italic;margin-top:18px;line-height:1.5;}
    @media(max-width:640px){.rk-top{grid-template-columns:1fr;}.rk-row{grid-template-columns:120px 46px 1fr 44px;gap:9px;}}
    @keyframes tabIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes tabOut{from{opacity:1;}to{opacity:0;transform:translateY(-5px);}}
    .tab-panel.entering{animation:tabIn .26s cubic-bezier(.22,1,.36,1) both;}
    .tab-panel.leaving{animation:tabOut .14s ease forwards;pointer-events:none;}

    /* STAT CARDS */
    .stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-bottom:24px;}
    .stat-card{border:1px solid var(--border);background:var(--bg2);padding:12px 10px;text-align:center;position:relative;border-radius:10px;transition:border-color .2s ease, box-shadow .25s ease, background .25s ease;}
    .stat-card:hover{border-color:color-mix(in srgb, var(--tc) 45%, var(--border2));background:color-mix(in srgb, var(--tc) 9%, var(--bg2));box-shadow:0 6px 20px rgba(0,0,0,.28);}
    .stat-card-val{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1;margin-bottom:3px;}
    .stat-card-proj{font-size:11px;font-weight:700;color:var(--tcr,var(--accent));margin-bottom:3px;}
    .stat-card-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .stat-card-diff{font-size:10px;font-weight:700;margin-top:3px;}
    /* merged last-year → projected card */
    .sc-merge{display:flex;align-items:baseline;justify-content:center;gap:5px;margin-top:6px;white-space:nowrap;}
    .sc-last{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--text3);}
    .sc-arrow{font-size:11px;font-weight:700;color:var(--text3);}
    .sc-proj{font-family:'Playfair Display',serif;font-weight:800;font-size:21px;line-height:1;color:var(--tcr,var(--accent));}
    .stat-card .stat-card-label.top{margin-bottom:0;}
    /* IMPACT SCORE */
    .impact-wrap{border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:26px;background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 9%, var(--bg2)), var(--bg2) 70%);position:relative;overflow:hidden;}
    .impact-head{display:flex;align-items:center;gap:18px;margin-bottom:14px;}
    .impact-num{font-family:'Playfair Display',serif;font-weight:800;font-size:52px;line-height:.9;background:linear-gradient(150deg, color-mix(in srgb,var(--tc) 88%,#fff), var(--tc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    .impact-num span{font-size:18px;color:var(--text3);-webkit-text-fill-color:var(--text3);}
    .impact-meta{flex:1;}
    .impact-rank{font-size:14px;font-weight:800;color:var(--text);}
    .impact-pctl{font-size:11px;font-weight:600;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}
    .impact-bar{height:8px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-bottom:18px;}
    .impact-bar .impact-fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg, color-mix(in srgb,var(--tc) 60%,#fff), var(--tc));}
    /* Dark mode: a dark-but-saturated team color (navy) used as gradient/solid fill
       vanishes on the dark ground (the reason the resolver used to reject navy). Now
       that navy is the identity color, brighten these accents to --tcr in dark so they
       stay legible. Light mode keeps raw --tc — dark navy pops on the white ground. */
    [data-theme="dark"] .impact-num,
    [data-theme="dark"] .ds-rank{ background:linear-gradient(150deg, #ffffff, color-mix(in srgb, var(--tcr) 45%, #fff)); -webkit-background-clip:text; background-clip:text; }
    [data-theme="dark"] .impact-bar .impact-fill,
    [data-theme="dark"] .imp-card-bar .impact-fill{ background:linear-gradient(90deg, color-mix(in srgb, var(--tcr) 70%, #fff), var(--tcr)) !important; }
    .impact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;}
    .imp-card{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 12px;}
    .imp-card-l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .imp-card-v{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;line-height:1;color:var(--text);margin-bottom:8px;}
    .imp-card-bar{height:4px;border-radius:3px;background:var(--bg3);overflow:hidden;}
    .imp-card-bar .impact-fill{display:block;height:100%;border-radius:3px;}
    .impact-fill{transition:width .85s cubic-bezier(.22,1,.36,1);}
    /* PLAYER SPECTRUM */
    .spec-wrap{border:1px solid var(--border);border-radius:12px;padding:18px 20px 20px;margin-bottom:26px;background:var(--bg2);}
    .spec-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .spec-sel{padding:8px 12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--text);outline:none;cursor:pointer;}
    .spec-sel:focus{border-color:var(--accent);}
    .spec-vs{font-size:12px;font-weight:700;color:var(--text3);}
    .spec-poles{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;}
    .spec-poles b{color:var(--text2);}
    .spec-mid{color:var(--text3);}
    @media(max-width:560px){.spec-mid{display:none;}}
    .spec-band{position:relative;height:230px;border-radius:10px;overflow:hidden;background:linear-gradient(90deg, rgba(79,147,196,.10), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, rgba(224,130,60,.10));border:1px solid var(--border);}
    .spec-band::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;border-left:1px dashed var(--border2);}
    .spec-dot{position:absolute;width:11px;height:11px;border-radius:50%;opacity:.5;transform:translate(-50%,-50%);transition:opacity .2s;}
    .spec-dot.me{width:20px;height:20px;opacity:1;z-index:5;border:2px solid var(--bg);}
    .spec-melabel{position:absolute;top:calc(50% - 22px);transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--text);background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:3px 8px;white-space:nowrap;z-index:6;}
    .spec-splitlbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;}
    .spec-split{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
    .spec-pct{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;flex-shrink:0;}
    .spec-pct.l{color:#4f93c4;} .spec-pct.r{color:#e0823c;}
    .spec-bar{flex:1;height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--bg3);}
    .spec-bar i{display:block;height:100%;transition:width .7s cubic-bezier(.22,1,.36,1);}
    .spec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .spec-card{border:1px solid var(--border);border-radius:10px;padding:13px 14px;background:var(--bg);}
    .spec-card.l{border-top:2px solid #4f93c4;} .spec-card.r{border-top:2px solid #e0823c;}
    .spec-card-l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .spec-card-v{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;line-height:1;}
    .spec-card-s{font-size:10px;font-weight:600;color:var(--text3);margin-top:6px;}
    .stat-card-diff.up{color:var(--green);}.stat-card-diff.dn{color:var(--red);}.stat-card-diff.eq{color:var(--text3);}

    /* FULL STAT TABLE */
    .sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .stat-table{width:100%;border-collapse:collapse;min-width:680px;}
    .stat-table th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 8px;border-bottom:2px solid var(--border2);text-align:right;white-space:nowrap;}
    .stat-table th:first-child{text-align:left;}
    .stat-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;text-align:right;white-space:nowrap;}
    .stat-table td:first-child{text-align:left;font-weight:700;}
    .stat-table tr.actual td{color:var(--text2);}
    .stat-table tr.proj td{color:var(--tcr,var(--accent));}
    .stat-table tr.proj td:first-child{color:var(--tcr,var(--accent));}

    /* PERCENTILE BARS */
    /* PERCENTILE DISTRIBUTION CARDS */
    .dist-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
    .dist-controls .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;}
    .dist-controls .seg button{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--text3);background:transparent;border:none;cursor:pointer;padding:7px 14px;border-radius:6px;transition:all .15s;white-space:nowrap;}
    .dist-controls .seg button.on{background:var(--accent);color:#221c08;}
    [data-theme="dark"] .dist-controls .seg button.on{color:#0a0710;}
    .dist-slider{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;min-width:300px;}
    .dist-slider-lbl{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;min-width:108px;}
    .dist-slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--border2);outline:none;cursor:pointer;}
    .dist-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);}
    .dist-slider input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;}
    .dist-cap{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
    .dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
    .dist-card{border:1px solid var(--border);border-radius:11px;padding:15px 17px 12px;background:var(--bg2);}
    .dist-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
    .dist-name{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);}
    .dist-rank{font-size:11px;font-weight:600;color:var(--text3);text-align:right;line-height:1.35;}
    .dist-rank b{font-weight:800;}
    .dist-rank span{display:block;font-size:10px;color:var(--text3);}
    .dist-val{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;line-height:1;margin-bottom:6px;}
    .dist-svg{width:100%;height:84px;display:block;}
    .dist-axis{display:flex;justify-content:space-between;font-size:9.5px;font-weight:600;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums;}
    @media(max-width:620px){.dist-grid{grid-template-columns:1fr;}}
    .pct-wrap{margin-bottom:28px;}
    .pct-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .pct-label{font-size:12px;font-weight:600;color:var(--text3);width:52px;flex-shrink:0;text-align:right;}
    .pct-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:visible;position:relative;}
    .pct-fill{height:100%;border-radius:4px;transition:width .5s ease;}
    .pct-val{font-size:12px;font-weight:700;width:38px;text-align:right;flex-shrink:0;}
    .pct-pct{font-size:11px;font-weight:600;color:var(--text3);width:36px;flex-shrink:0;}

    /* RADAR / SPIDER CHART */
    .radar-wrap{display:flex;justify-content:center;margin-bottom:28px;}
    .prog-section{margin-bottom:28px;}
    .prog-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 8px 4px;margin-top:8px;}
    .prog-legend{display:flex;gap:18px;align-items:center;font-size:11px;font-weight:600;color:var(--text2);}
    .prog-legend i{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:6px;}
    .prog-legend .pl-line{border-top:2.5px solid var(--accent);}
    .prog-legend .pl-base{border-top:2px dashed var(--text3);opacity:.6;}
    .radar-wrap canvas{width:100%;max-width:460px;height:auto;}
    .radar-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px;}
    .radar-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;user-select:none;padding:3px 7px;border-radius:6px;transition:background .12s,opacity .12s;}
    .radar-legend-item:hover{background:var(--bg2);color:var(--text2);}
    .radar-legend-item.off{opacity:.4;}
    .radar-legend-item.off .radar-legend-dot{filter:grayscale(1);}
    .radar-legend-dot{width:10px;height:10px;border-radius:50%;}

    /* SCOUTING REPORT — enhanced */
    .scout-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;padding:20px;border:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
    .scout-archetype-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .scout-archetype-name{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.1;}
    .scout-archetype-desc{font-size:13px;color:var(--text2);line-height:1.65;max-width:380px;}
    .scout-ratings{display:flex;flex-direction:column;gap:7px;min-width:160px;}
    .scout-rating-row{display:flex;align-items:center;gap:8px;}
    .scout-rating-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);width:52px;flex-shrink:0;text-align:right;}
    .scout-rating-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
    .scout-rating-fill{height:100%;border-radius:3px;background:var(--accent);}
    .scout-rating-val{font-size:12px;font-weight:700;color:var(--text2);width:28px;text-align:right;flex-shrink:0;}
    .scout-fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
    .scout-fc-card{padding:14px;border:1px solid var(--border);background:var(--bg2);}
    .scout-fc-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
    .scout-fc-val{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;color:var(--text);margin-bottom:3px;}
    .scout-fc-desc{font-size:11px;color:var(--text3);line-height:1.5;}
    .scout-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
    .scout-card{border:1px solid var(--border);padding:16px;transition:border-color .2s;}
    .scout-card:hover{border-color:var(--border2);}
    .scout-card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
    .scout-card-title::after{content:'';flex:1;height:1px;background:rgba(230,213,168,.25);}
    .scout-card-body{font-size:13px;color:var(--text2);line-height:1.7;}
    .scout-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 8px;margin:2px;border-radius:2px;}
    .scout-tag.pos{background:rgba(26,140,58,.1);color:#1a8c3a;border:1px solid rgba(26,140,58,.2);}
    .scout-tag.neg{background:rgba(204,34,0,.08);color:#cc2200;border:1px solid rgba(204,34,0,.18);}
    .scout-tag.neu{background:var(--bg2);color:var(--text3);border:1px solid var(--border);}
    .scout-tag.gold{background:rgba(230,213,168,.1);color:var(--accent);border:1px solid rgba(230,213,168,.25);}
    .archetype-badge{display:none;}
    /* PLAYER BADGES */
    .badge-legend{display:flex;gap:12px;flex-wrap:wrap;}
    .badge-leg{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);}
    .badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    .badge-col{display:flex;flex-direction:column;gap:7px;}
    .badge-cat{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--border);color:var(--text2);}
    .badge-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;transition:transform .12s;}
    .badge-chip:hover{transform:translateY(-1px);}
    .badge-pips{display:inline-flex;gap:2px;flex-shrink:0;}
    .badge-pip{width:5px;height:5px;border-radius:50%;display:inline-block;}
    .badge-nm{font-size:12.5px;font-weight:700;color:var(--text);flex:1;line-height:1.2;}
    .badge-tl{font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;}
    .badge-empty{font-size:11px;color:var(--text3);font-style:italic;padding:6px 2px;}
    .hero-right{display:flex;align-items:center;gap:24px;flex-shrink:0;}
    .hero-badge-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;flex-shrink:0;}
    .hero-badge-shield{width:82px;filter:drop-shadow(0 7px 16px rgba(24,20,14,.42));transition:transform .16s cubic-bezier(.34,1.46,.64,1);}
    .hero-badge-wrap:hover .hero-badge-shield{transform:translateY(-2px) scale(1.04);}
    .hero-badge-shield svg{width:100%;height:auto;display:block;}
    .hbs-dots{display:flex;gap:9px;}
    .hbs-dot{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--text2);}
    .hbs-dot i{width:6px;height:6px;border-radius:50%;display:inline-block;}
    @media(max-width:520px){.hero-badge-shield{width:66px;}.hero-right{gap:14px;}}
    @media(max-width:820px){.badge-grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:480px){.badge-grid{grid-template-columns:1fr;}}
    /* badge tier ladder — grouped by tier, pills colored by category */
    /* badge emblem tiles: hex crest (tier-tinted) + category icon + tier ribbon */
    .badge-grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;margin-top:12px;}
    /* premium framed tier badges */
    .badge-sub{font-size:11px;color:var(--text3);}
    .bcats{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;margin-top:14px;}
    @media(max-width:640px){.bcats{grid-template-columns:1fr;}}
    .bcat-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--border);}
    .bcat-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
    .bbadge{display:flex;align-items:center;gap:13px;padding:7px 0;}
    .bframe{width:52px;height:52px;flex-shrink:0;position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .bf-disc{position:absolute;inset:0;border-radius:50%;}
    .bf-rim{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 2px 2px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.42),0 0 0 2px rgba(255,255,255,.1);}
    .bf-gloss{position:absolute;top:5px;left:10px;right:10px;height:40%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);}
    .bframe svg{width:27px;height:27px;position:relative;z-index:2;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.5));}
    .bb-txt{display:flex;flex-direction:column;gap:1px;min-width:0;}
    .bb-nm{font-size:13.5px;font-weight:800;line-height:1.15;color:var(--text);}
    .bb-tier{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
    .badge-tile{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 9px 9px;text-align:center;overflow:hidden;}
    .bt-glow{position:absolute;left:-30%;right:-30%;top:-42%;height:110px;filter:blur(26px);opacity:.45;pointer-events:none;}
    .bt-em{position:relative;width:42px;height:42px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
    .bt-hex{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);}
    .bt-hex.bt-in{inset:2px;background:var(--bg2);}
    .bt-em svg{position:relative;z-index:1;width:20px;height:20px;}
    .bt-nm{position:relative;display:block;font-size:11.5px;font-weight:700;line-height:1.25;min-height:29px;}
    .bt-tier{position:relative;display:block;margin-top:7px;font-family:var(--mono);font-size:7.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 0;border-radius:5px;}
    @media(max-width:520px){.badge-grid2{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));}}
    .badge-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
    .badge-count{font-size:12px;font-weight:700;color:var(--text2);}
    .badge-ladder{display:flex;flex-direction:column;gap:11px;}
    .tl-rung{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:14px;padding:3px 0;}

    /* PROSPECT SCOUTING CARD */
    .pcard{border:1px solid var(--border);background:var(--bg);margin-bottom:20px;overflow:hidden;}
    .pcard-band{background:var(--accent);color:#221c08;text-align:center;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;font-size:11px;}
    .pcard-name{font-family:'Playfair Display',serif;font-size:27px;font-weight:800;text-align:center;padding:12px 10px 2px;line-height:1.05;}
    .pcard-sub{text-align:center;color:var(--text3);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-bottom:12px;}
    .pcard-meas{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);}
    .pcard-meas>div{padding:10px 8px;text-align:center;border-right:1px solid var(--border);}

    .pcard-meas .v{font-size:15px;font-weight:800;color:var(--text);font-family:'Playfair Display',serif;}

    .pcard-sw>div:first-child{border-right:1px solid var(--border);}

    /* SKILL BREAKDOWN */
    .skill-section-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:8px;display:flex;align-items:center;gap:12px;}

    /* PAGE-LOAD ANIMATIONS */
    @keyframes heroSlideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes avatarPop{0%{opacity:0;transform:scale(.6);}70%{transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
    @keyframes gradeStamp{0%{opacity:0;transform:scale(.5) rotate(-4deg);}65%{transform:scale(1.1) rotate(1deg);}100%{opacity:1;transform:scale(1) rotate(0deg);}}
    @keyframes statCardIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

    .player-hero{animation:heroSlideUp .5s .05s cubic-bezier(.22,1,.36,1) both;}
    .hero-avatar{animation:avatarPop .55s .15s cubic-bezier(.34,1.56,.64,1) both!important;}
    .hero-name{animation:heroSlideUp .45s .2s cubic-bezier(.22,1,.36,1) both;}
    .hero-grade{animation:gradeStamp .6s .3s cubic-bezier(.34,1.46,.64,1) both!important;}

    /* Stat cards stagger in when tab is active */
    .stat-card{opacity:0;animation:statCardIn .35s cubic-bezier(.22,1,.36,1) both;}
    .tab-panel.active .stat-card:nth-child(1){animation-delay:.05s;}
    .tab-panel.active .stat-card:nth-child(2){animation-delay:.09s;}
    .tab-panel.active .stat-card:nth-child(3){animation-delay:.13s;}
    .tab-panel.active .stat-card:nth-child(4){animation-delay:.17s;}
    .tab-panel.active .stat-card:nth-child(5){animation-delay:.21s;}
    .tab-panel.active .stat-card:nth-child(6){animation-delay:.25s;}
    .tab-panel.active .stat-card:nth-child(7){animation-delay:.29s;}
    .tab-panel.active .stat-card:nth-child(8){animation-delay:.33s;}
    .tab-panel.active .stat-card:nth-child(9){animation-delay:.37s;}
    .tab-panel.active .stat-card:nth-child(10){animation-delay:.41s;}

    /* Bars grow from 0 via JS (growBarsIn); ensure each fill has a transition */
    .scout-rating-fill{transition:width .8s cubic-bezier(.22,1,.36,1);}
    .arch-bar{transition:height .7s cubic-bezier(.22,1,.36,1);}
    /* Comp cards stagger in when archetype tab is active */
    .tab-panel.active .comp-card{opacity:0;animation:statCardIn .4s cubic-bezier(.22,1,.36,1) both;}
    .tab-panel.active .comp-card:nth-child(2){animation-delay:.06s;}
    .tab-panel.active .comp-card:nth-child(3){animation-delay:.12s;}
    .tab-panel.active .comp-card:nth-child(4){animation-delay:.18s;}
    .tab-panel.active .comp-card:nth-child(5){animation-delay:.24s;}
    .tab-panel.active .comp-card:nth-child(6){animation-delay:.3s;}
    @media (prefers-reduced-motion: reduce){
      .tab-panel.active .comp-card{animation:none;opacity:1;}
    }
    @media(max-width:768px){
      .nav-top,.nav-sub,.player-hero,.tab-panel,.tab-row{padding-left:16px;padding-right:16px;}
      .player-hero{flex-wrap:wrap;}
      .hero-name{font-size:24px;}
      .ov-split{grid-template-columns:1fr!important;}  /* stack Actual / Projected */
      .stat-cards{grid-template-columns:repeat(3,1fr);}
      .scout-grid{grid-template-columns:1fr;}
      .dist-grid{grid-template-columns:1fr;}
    }
  
    /* AMBIENT + PARTICLES */
    .ambient-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .ambient-blob{position:absolute;border-radius:50%;will-change:transform;}
    .amb-1{width:800px;height:800px;background:radial-gradient(circle at center,rgba(230,213,168,.04) 0%,transparent 65%);filter:blur(60px);top:-280px;right:-200px;animation:ambA 22s ease-in-out infinite alternate;}
    .amb-2{width:700px;height:700px;background:radial-gradient(circle at center,rgba(140,140,150,.03) 0%,transparent 65%);filter:blur(70px);bottom:-240px;left:-180px;animation:ambB 28s ease-in-out infinite alternate;}
    .amb-3{width:400px;height:400px;background:radial-gradient(circle at center,rgba(230,213,168,.025) 0%,transparent 65%);filter:blur(50px);top:40%;left:35%;animation:ambC 16s ease-in-out infinite alternate;}
    [data-theme="dark"] .amb-1{background:radial-gradient(circle at center,rgba(230,213,168,.09) 0%,transparent 65%);}
    [data-theme="dark"] .amb-2{background:radial-gradient(circle at center,rgba(140,140,150,.05) 0%,transparent 65%);}
    @keyframes ambA{0%{transform:translate(0,0) scale(1);}33%{transform:translate(-45px,30px) scale(1.06);}100%{transform:translate(38px,18px) scale(1.04);}}
    @keyframes ambB{0%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,-30px) scale(1.08);}100%{transform:translate(-32px,16px) scale(1.05);}}
    @keyframes ambC{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-20px,14px) scale(.90);}}
    #particleCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
    .nav-wrap{z-index:200!important;}
    /* fade-up for page header content */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .page-eyebrow{animation:fadeUp .45s .06s cubic-bezier(.22,1,.36,1) both;}
    .page-h1{animation:fadeUp .5s .12s cubic-bezier(.22,1,.36,1) both;}
    .page-sub{animation:fadeUp .5s .18s cubic-bezier(.22,1,.36,1) both;}
    /* tab panel fade */
    .tab-panel.active{animation:panelIn .28s cubic-bezier(.22,1,.36,1) forwards;}
    @keyframes panelIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  
/* ===== ANIMATED NEON BACKGROUND ===== */
html{background:var(--bg);}
body{background:transparent!important;}
/* bg palette — neon by default; team pages override --bgc/--bgm via JS */
:root{--tc:var(--accent);--tcr:var(--accent);--tc-rgb:45,224,166;--tcr-rgb:45,224,166;--bgc1:#9a9aa8;--bgc2:#7c7c8c;--bgc3:#adadbd;--bgm1:rgba(158,158,174,.30);--bgm2:rgba(128,128,146,.28);--bgm3:rgba(176,176,192,.32);--bgm4:rgba(116,116,134,.22);}
.tdc-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg);}
.tdc-mesh{position:absolute;inset:-25%;background:radial-gradient(38% 48% at 22% 26%, var(--bgm1), transparent 62%),radial-gradient(44% 52% at 80% 28%, var(--bgm2), transparent 62%),radial-gradient(50% 50% at 62% 80%, var(--bgm3), transparent 62%),radial-gradient(40% 44% at 14% 82%, var(--bgm4), transparent 62%);filter:blur(46px);animation:tdcMesh 28s ease-in-out infinite alternate;transition:background 1.1s ease;}
[data-theme="dark"] .tdc-mesh{opacity:.42;} :root:not([data-theme="dark"]) .tdc-mesh{opacity:.28;}

  else if(sc>=51){g='C+';}else if(sc>=43){g='C';}else if(sc>=35){g='C-';}
  else if(sc>=27){g='D+';}else if(sc>=19){g='D';}else{g='F';}
  var t=g.charAt(0);

  else if(t==='B')c='#4a9d54';          // muted green
  else if(t==='C')c='#c99a1e';          // amber

// Map a TDC grade (≈58-99) to a 0-100 scouting score whose letter aligns with

  var src=srcRow||((proj&&!proj._frosh)?proj:player);
