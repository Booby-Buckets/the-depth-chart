  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#5ab875;--red:#e07070;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);}
    .logo{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--text);text-decoration:none;}
    .logo span{color:var(--accent);}
    .page{max-width:1180px;margin:0 auto;padding:30px 24px 90px;}
    h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;}
    .sub{font-size:13px;color:var(--text3);margin-bottom:24px;max-width:860px;line-height:1.6;}
    .sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:34px 0 14px;display:flex;align-items:center;gap:12px;}
    .sec::after{content:'';flex:1;height:1px;background:var(--border);}
    .sec .shint{font-weight:600;letter-spacing:0;text-transform:none;color:var(--text3);}
    /* champion banner */
    .champ{display:flex;align-items:center;gap:22px;border:1px solid var(--border);border-radius:18px;padding:22px 26px;
      background:radial-gradient(130% 200% at 0% 0%,color-mix(in srgb,var(--champ,var(--accent)) 22%,var(--bg2)),var(--bg2));}
    .champ-mono{width:66px;height:66px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-family:'Playfair Display',serif;font-weight:800;font-size:24px;color:#fff;
      background:var(--champ,var(--accent));border:3px solid color-mix(in srgb,var(--champ,var(--accent)) 60%,#fff);}
    .champ .ce{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
    .champ h2{font-family:'Playfair Display',serif;font-weight:800;font-size:32px;line-height:1;margin:5px 0 6px;}
    .champ .cm{font-size:12.5px;color:var(--text2);font-weight:600;}
    .champ .cm b{color:var(--text);}
    /* regions */
    .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    @media(max-width:900px){.rgrid{grid-template-columns:1fr;}}
    .rbr{border:1px solid var(--border);border-radius:14px;background:var(--bg2);overflow:hidden;}
    .rbr-h{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;padding:12px 15px;border-bottom:1px solid var(--border);
      background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 9%,var(--bg2)),var(--bg2));display:flex;align-items:baseline;gap:9px;}
    .rbr-h .rw{font-size:10.5px;font-weight:700;color:var(--text3);letter-spacing:.02em;font-family:'Inter',sans-serif;}
    .rbr-body{padding:12px;display:flex;flex-direction:column;gap:7px;}
    .rbr-scroll{overflow-x:auto;padding:12px;}
    .rounds{display:flex;gap:8px;min-width:600px;}
    .col{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px;min-width:0;}
    .col-h{font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:2px;}
    .gm{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--bg);}
    .tm{display:flex;align-items:center;gap:6px;padding:5px 7px;font-size:11.5px;line-height:1.1;}
    .tm+.tm{border-top:1px solid var(--border);}
    .tm.w{font-weight:800;} .tm.w .tnm{color:var(--text);}
    .tm.l{color:var(--text3);} .tm.l .tnm{color:var(--text3);font-weight:600;}
    .tm .seed{width:15px;text-align:center;font-size:9.5px;font-weight:800;color:var(--text3);flex-shrink:0;font-variant-numeric:tabular-nums;}
    .tm.w .seed{color:var(--accent);}
    .tm .tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
    .tm .tlogo{width:24px;height:24px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1px rgba(15,23,42,.10);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .tm .tlogo img{width:18px;height:18px;object-fit:contain;}
    .tm .tnm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tm .tr{font-size:9px;color:var(--text3);flex-shrink:0;font-variant-numeric:tabular-nums;}
    .tm .up{font-size:8px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);padding:1px 4px;border-radius:5px;flex-shrink:0;letter-spacing:.03em;}
    .tm .fftag{font-size:7.5px;font-weight:800;text-transform:uppercase;color:var(--text3);background:var(--bg3);padding:1px 5px;border-radius:5px;flex-shrink:0;letter-spacing:.04em;}
    /* final four */
    .ff-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;border:1px solid var(--border);border-radius:16px;background:var(--bg2);padding:20px 18px;}
    @media(max-width:760px){.ff-wrap{grid-template-columns:1fr;}}
    .ff-col{display:flex;flex-direction:column;gap:12px;}
    .ff-title{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:6px;}
    .ff-nc{text-align:center;padding:0 6px;}
    .ff-nc .lbl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .gm.ncg{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));min-width:190px;}
    /* opening round */
    .orgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
    .note{font-size:11px;color:var(--text3);line-height:1.6;margin-top:30px;max-width:860px;}
    .loading{padding:70px;text-align:center;color:var(--text3);}
    .bubgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:8px;}
  @media(max-width:900px){ .bubgrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .bub{border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .bubh{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
  .bubr{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-top:1px solid var(--border);}
  .bubr:first-of-type{border-top:none;}
  .tmc{display:inline-flex;align-items:center;gap:6px;} .tmc img{width:16px;height:16px;object-fit:contain;}
  .tmc a{color:var(--text);text-decoration:none;font-weight:700;} .tmc a:hover{color:var(--accent);text-decoration:underline;}
</style>

<body class="hqsite">
  <script src="tdc-nav.js?v=51"></script>
  <div class="page">
    <div class="page-eyebrow">Postseason · 2026-27</div>
    <h1 data-anim>Bracketology</h1>
    <div class="sub" data-anim>The projected 2026-27 NCAA Tournament and NIT, from thousands of simulated seasons: every league's real conference tournament, résumé at-large bids, the First Four and the committee's bracketing rules.</div>
    <div id="out"><div class="loading">Projecting the seed field…</div></div>
    
  </div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  2026-27 projected NCAA Tournament — VERBATIM engine from tournaments.html's
//  buildProjectedNCAA (kept identical so this page matches the postseason bracket).
//  76-team field, conference-protected S-curve seeding, every game projected to
//  the higher-rated team AFTER a team_dna style-matchup adjustment (realistic
//  upsets, not chalk). If the postseason engine changes, mirror it here.
// ═══════════════════════════════════════════════════════════════════════════
const PROJ_REGIONS=['South Region','West Region','East Region','Midwest Region'];
const PROJ_DATE={open:'2027-03-16',r1:'2027-03-18',r2:'2027-03-20',s16:'2027-03-25',e8:'2027-03-27',ff:'2027-04-03',nc:'2027-04-05'};
let _projBuilt=null;
// the field, seeds and regions come from the shared postseason simulation (tdc-postseason.js): real
// conference tournaments → automatic bids, résumé at-larges, the First Four and the committee's
// conference separation — the same engine the team, conference and fantasy pages read
async function buildProjectedNCAA(){
  if(_projBuilt) return _projBuilt;
  _projBuilt=await TDCPost.projectedGames();
  return _projBuilt;
}

// ── theme toggle (parity with the rest of the site) ──
function toggleTheme(){ const d=document.documentElement; const dark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',dark?'light':'dark'); const b=document.getElementById('themeBtn'); if(b) b.textContent=dark?'☾':'☀';
  try{ localStorage.setItem('tdc_theme',dark?'light':'dark'); }catch(e){} }

// ── team colors ──
let COLORMAP={};
function _lum(hex){ hex=(hex||'').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  if(hex.length<6) return .5; const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)/255; }
function teamColor(full,team){
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#A8843C';
  const c=COLORMAP[team]||COLORMAP[full]; if(!c) return accent;
  const dark=document.documentElement.getAttribute('data-theme')==='dark', l=_lum(c);
  if(!dark && l>0.74) return accent; if(dark && l<0.15) return accent; return c;
}
const el=id=>document.getElementById(id);
const fmtR=r=>r==null?'':(r>=0?'+':'')+(+r).toFixed(1);

(async function(){
  try{ const arr=await fetch('scripts/data/team_colors.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]);
    (arr||[]).forEach(e=>{ if(e&&e.c1){ if(e.location) COLORMAP[e.location]=e.c1; if(e.display) COLORMAP[e.display]=e.c1; } });
  }catch(e){}

  let games, byFull={};
  try{
    const built=await buildProjectedNCAA();
    games=built.games;
    const D=await TDC_RATINGS.get();
    (D.teams||[]).forEach(t=>{ byFull[t.full]=t; });
  }catch(e){ el('out').innerHTML='<div class="loading">Could not build the projection.</div>'; return; }

  const shortName=full=>{ const t=byFull[full]; return (t&&t.team)||full; };

  // group games
  const byRound=o=>games.filter(g=>g.round_order===o);
  const regionGames=(region,o)=>games.filter(g=>g.division===region&&g.round_order===o);
  // teams that had to win a play-in to reach the field of 64 (shown as "First Four")
  const playIn=new Set(byRound(0).map(g=>g.winner));

  // one seed line inside a matchup box — NEUTRAL (this is a projected SEED, not a
  // predicted result), so no winner highlight and no upset tag.
  const logoFor=full=>{ const s=shortName(full);
    const c=(window.tdcTeamColor&&(tdcTeamColor(s)||tdcTeamColor(full)))||null; return (c&&c.logo)||''; };
  const teamRow=(full,seed,rating,ff)=>{ const s=shortName(full), lg=logoFor(full);
    return `<div class="tm">
      <span class="seed">${seed!=null?seed:''}</span>
      <span class="tlogo">${lg?`<img src="${lg}" alt="" onerror="this.style.display='none'">`:''}</span>
      <span class="tnm">${s}</span>
      ${ff&&playIn.has(full)?'<span class="fftag" title="Reached the field through the Opening Round">Opening Rd</span>':''}
      <span class="tr">${fmtR(rating)}</span></div>`; };
  const matchBox=(g,ff)=>`<div class="gm">${teamRow(g.home,g.home_seed,g._hr,ff)}${teamRow(g.away,g.away_seed,g._ar,ff)}</div>`;

  // ── regions: the projected SEED FIELD (the eight seed-line pairings), no games run ──
  const regionHtml=region=>{
    const gs=regionGames(region,1);              // round_order 1 = the seeded field, in bracket order
    const top=gs[0]?gs[0].home:'';               // the region's No. 1 seed
    const short=region.replace(' Region','');
    return `<div class="rbr" data-anim><div class="rbr-h">${short}<span class="rw">No. 1 seed · ${top}</span></div>
      <div class="rbr-body">${gs.map(g=>matchBox(g,true)).join('')}</div></div>`;
  };
  const regionsBlock=`<div class="rgrid">${PROJ_REGIONS.map(regionHtml).join('')}</div>`;

  // ── Opening Round (12 play-in pairings) — shown as matchups, not predicted winners ──
  const orG=byRound(0);
  const orHtml=orG.length?`<div class="orgrid">${orG.map(g=>matchBox(g,false)).join('')}</div>`:'';

  el('out').innerHTML=
    `<div class="sec">The Regions <span class="shint">projected seed lines 1–16 in each region</span></div>${regionsBlock}`+
    (orHtml?`<div class="sec">Opening Round <span class="shint">${orG.length} play-in games · seed lines ${[...new Set(orG.map(g=>g.home_seed))].sort((a,b)=>a-b).join(' / ')}</span></div>${orHtml}`:'')+
    `<div id="oddsOut"></div>`;
  renderOdds();

  if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(el('out'));

  // ── odds from the simulation ──
  async function renderOdds(){
    const B=(await TDCPost.projectedGames()).bracket, P=B.P;
    const pc=v=>v==null?'':(v>=.995?'>99':v<.005?(v>0?'<1':'—'):Math.round(v*100))+'%';
    const nm=t=>{ const s=shortName(t.team), lg=logoFor(t.team); return `<span class="tmc">${lg?`<img src="${lg}" alt="" onerror="this.style.display='none'">`:''}<a href="team.html?team=${encodeURIComponent(s)}">${s}</a></span>`; };
    const conf=t=>(window.tdcConfFull&&TDC_CONFS&&TDC_CONFS[tdcConfFull(t.conf)]&&TDC_CONFS[tdcConfFull(t.conf)].short)||t.conf;
    const inF=P.teams.filter(t=>t.ncaa>=0.005).sort((a,b)=>(b.champ-a.champ)||(b.ncaa-a.ncaa));
    const oddsRows=inF.map(t=>`<tr><td class="l nm">${nm(t)}</td><td class="l dim">${conf(t)}</td><td>${pc(t.ncaa)}</td><td>${pc(t.auto)}</td><td>${t.avgSeed?t.avgSeed.toFixed(1):''}</td><td>${pc(t.seed[1])}</td><td>${pc(t.r32)}</td><td>${pc(t.s16)}</td><td>${pc(t.e8)}</td><td>${pc(t.f4)}</td><td>${pc(t.final)}</td><td class="strong">${pc(t.champ)}</td></tr>`).join('');
    const bubbleList=(arr,lab)=>`<div class="bub"><div class="bubh">${lab}</div>${arr.map(t=>`<div class="bubr">${nm(t)}<span class="dim">${conf(t)} · in ${pc(t.ncaa)}</span></div>`).join('')}</div>`;
    const li=B.lastIn.slice().reverse(), fo=B.firstOut;
    const nit=P.teams.filter(t=>t.nit>=0.02).sort((a,b)=>(b.nitChamp-a.nitChamp)||(b.nit-a.nit)).slice(0,60);
    const nitRows=nit.map(t=>`<tr><td class="l nm">${nm(t)}</td><td class="l dim">${conf(t)}</td><td>${pc(t.nit)}</td><td>${pc(t.nitAuto)}</td><td>${pc(t.ncaa)}</td><td>${pc(t.nitQ)}</td><td>${pc(t.nitSF)}</td><td>${pc(t.nitF)}</td><td class="strong">${pc(t.nitChamp)}</td></tr>`).join('');
    const R=P.rules||{}, nitR=R.nit||{};
    el('oddsOut').innerHTML=`<div class="sec">Bubble watch <span class="shint">the projected bracket's last teams in and first out</span></div>
      <div class="bubgrid">${bubbleList(li.slice(0,4),'Last four byes')}${bubbleList(li.slice(4,8),'Last four in')}${bubbleList(fo.slice(0,4),'First four out')}${bubbleList(fo.slice(4,8),'Next four out')}</div>
      <div class="sec">Tournament odds <span class="shint">${P.sims.toLocaleString()} simulated seasons · ${P.field}-team field</span></div>
      <div class="sheet-wrap"><table class="sheet dense freeze2" id="oddsT"><thead><tr><th class="l">Team</th><th class="l">Conf</th><th data-heat="1">Makes it</th><th data-heat="1" title="wins the conference tournament (automatic bid)">Auto bid</th><th data-heat="-1">Avg seed</th><th data-heat="1">1 seed</th><th data-heat="1">2nd rd</th><th data-heat="1">Sweet 16</th><th data-heat="1">Elite 8</th><th data-heat="1">Final Four</th><th data-heat="1">Title game</th><th data-heat="1">Champion</th></tr></thead><tbody>${oddsRows}</tbody></table></div>
      <div class="sec">NIT <span class="shint">${nitR.field||32} teams${(nitR.auto_conferences||[]).length?' · automatic berths for the top '+(nitR.auto_per_conference||2)+' left out of the '+nitR.auto_conferences.join(', '):''} · higher seed hosts until the semifinals${nitR.venue_final?' at '+nitR.venue_final:''}</span></div>
      <div class="sheet-wrap"><table class="sheet dense freeze2" id="nitT"><thead><tr><th class="l">Team</th><th class="l">Conf</th><th data-heat="1">Makes NIT</th><th data-heat="1">Auto berth</th><th title="makes the NCAA field instead">NCAA</th><th data-heat="1">Quarters</th><th data-heat="1">Semis</th><th data-heat="1">Final</th><th data-heat="1">Champion</th></tr></thead><tbody>${nitRows}</tbody></table></div>`;
    if(window.tdcSheetHeat){ tdcSheetHeat(el('oddsT')); tdcSheetHeat(el('nitT')); }
  }
})();
</script>
