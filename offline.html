<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — The Depth Chart</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <style>
    :root{--bg:#FAF9F6;--text:#1A1814;--text2:#4A463C;--accent:#A8843C;--card:#fff;--border:#DEDACF;}
    @media (prefers-color-scheme: dark){:root{--bg:#141416;--text:#F1EFEA;--text2:#B4B0A8;--accent:#E6D5A8;--card:#1D1D20;--border:#2E2E34;}}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
    .box{max-width:420px;text-align:center;}
    .mark{width:64px;height:64px;margin:0 auto 22px;}
    h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px;}
    p{font-size:14.5px;color:var(--text2);line-height:1.6;margin-bottom:24px;}
    button{font:inherit;font-weight:700;font-size:14px;color:var(--bg);background:var(--accent);border:none;
      border-radius:24px;padding:11px 26px;cursor:pointer;}
    button:active{transform:translateY(1px);}
  </style>
</head>
<body>
  <div class="box">
    <img class="mark" src="favicon.svg" alt="The Depth Chart"/>
    <h1>You're offline</h1>
    <p>The Depth Chart needs a connection to load fresh data. Pages you've already visited are still available — reconnect to see the latest grades, projections and rankings.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
