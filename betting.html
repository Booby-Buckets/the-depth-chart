<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TDC Bet — The Depth Chart</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.thedepthchartcbb.com/bet/">
  <!-- The Betting Lab became its own site, TDC Bet (Oct 2026): bet.thedepthchartcbb.com, or /bet/ on this domain.
       Old links keep working: ?tab= maps to the matching TDC Bet page and ?date= carries over. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search), tab = q.get('tab') || (location.hash || '').replace('#', '');
      var page = { games: 'games', markets: 'markets', props: 'props', futures: 'futures', conferences: 'futures', wins: 'futures', awards: 'futures', trends: 'trends', tools: 'tools' }[tab] || '';
      var out = new URLSearchParams();
      if (q.get('date')) out.set('date', q.get('date'));
      if (page === 'futures' && tab !== 'futures') out.set('tab', tab);
      var s = out.toString();
      location.replace('/bet/' + (page ? page + '.html' : '') + (s ? '?' + s : ''));
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/bet/">
</head>
<body><a href="/bet/">The Betting Lab is now TDC Bet →</a></body>
</html>
