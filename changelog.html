<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="tdc-a11y.css?v=1">
  <script src="tdc-a11y.js?v=1" defer></script>
  <meta name="description" content="What's new on The Depth Chart — release notes and updates.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Depth Chart">
  <meta property="og:title" content="Changelog — The Depth Chart">
  <meta property="og:description" content="What's new on The Depth Chart — release notes and updates.">
  <meta property="og:url" content="https://www.thedepthchartcbb.com/changelog.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Changelog — The Depth Chart">
  <meta charset="UTF-8"/>
  <script src="tdc-theme.js?v=2"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Changelog — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="tdc-anim.css?v=4"/>
  <script src="tdc-anim.js?v=5"></script>
  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--blue:#3b6fd4;--amber:#b5872a;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--bg3:#28282C;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;--green:#5ab875;--blue:#7da2f0;--amber:#d8b05a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .wrap{max-width:760px;margin:0 auto;padding:0 22px;}
    .hero{padding:40px 0 8px;text-align:center;}
    .kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border:1px solid var(--border2);border-radius:30px;padding:6px 14px;margin-bottom:16px;}
    h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(32px,5vw,46px);letter-spacing:-.02em;line-height:1.05;}
    .lede{font-size:14px;color:var(--text2);max-width:520px;margin:12px auto 0;line-height:1.6;}
    /* timeline */
    #log{padding:34px 0 60px;}
    .rel{position:relative;padding:0 0 30px 26px;border-left:2px solid var(--border);margin-left:6px;}
    .rel:last-child{border-left-color:transparent;padding-bottom:10px;}
    .rel::before{content:'';position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--border2);}
    .rel.cur::before{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);}
    .rh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
    .rv{font-family:'Playfair Display',serif;font-weight:800;font-size:23px;letter-spacing:-.01em;}
    .rcur{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#221c08;background:var(--accent);border-radius:20px;padding:2px 9px;}
    .rd{font-size:12px;color:var(--text3);font-weight:600;margin-left:auto;}
    .items{display:flex;flex-direction:column;gap:9px;}
    .it{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;background:var(--bg2);padding:11px 14px;}
    .tag{flex-shrink:0;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-top:1px;min-width:66px;text-align:center;}
    .tag.new{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent);}
    .tag.improved{color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,transparent);}
    .tag.fixed{color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent);}
    .ix{font-size:13.5px;line-height:1.55;color:var(--text2);}
    .ix b{color:var(--text);font-weight:700;}
    .foot{text-align:center;padding:10px 0 60px;font-size:12px;color:var(--text3);}
  </style>
  <link rel="stylesheet" href="tdc-dense.css?v=30"/>
  <link rel="stylesheet" href="tdc-skin.css?v=8"/>
  <style>
    :root:not([data-theme="dark"]){background:var(--bg)!important;}
    :root:not([data-theme="dark"]) .tdc-bg{background:var(--bg)!important;}
    :root:not([data-theme="dark"]) .nav-wrap{background:var(--bg)!important;}
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Depth Chart">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="tdc-pwa.js?v=2" defer></script>
</head>
<body data-anim-auto>
<script src="tdc-nav.js?v=15"></script>
  <div class="wrap">
    <div class="hero">
      <div class="kicker" data-anim>⬡ What's new</div>
      <h1 data-anim>Changelog</h1>
      <div class="lede" data-anim>Every update to The Depth Chart, newest first. We're in active beta — new tools and fixes ship often.</div>
    </div>
    <div id="log"></div>
    <div class="foot">Have a bug or a request? We read everything on the <a href="community.html" style="color:var(--accent);font-weight:700">community page</a>.</div>
  </div>

<script>
/* ── Add a new release by prepending an object here. Each item: {t:'new'|'improved'|'fixed', x:'text (may use <b>)'} ── */
const CHANGELOG = [
  { v:'Beta 1.1', date:'August 12, 2026', current:true, items:[
    { t:'new', x:"<b>Install the app</b> — The Depth Chart is now installable to your phone or desktop home screen from the <b>Install</b> button. It launches full-screen with its own icon and keeps pages you've already visited available offline." },
    { t:'new', x:"<b>Player Archetypes</b> — every Division I player is now clustered by <em>how he plays</em> into ten style roles (Rim Protector, 3&amp;D Wing, Lead Creator and more). See a player's style on his page, browse the full explorer, find which styles the market underpays in Moneyball, and see which styles most often grow into stars." },
    { t:'new', x:"<b>Coach's Tier Command Center</b> — choose the team you represent and the hub becomes its dashboard: NIL value, your projection, a schedule that fills in once games post, and every tool pre-loaded for your roster." },
    { t:'new', x:"<b>Guess the College</b> — a new daily/unlimited game: you're shown a player, name their school in one guess and build a streak, with five difficulty tiers." },
    { t:'improved', x:"<b>Coach's Tier, consolidated</b> — the Opponent Scouting Report, Self-Scout Report and Player Dossier now each hold a full report; 15 single-purpose pages were merged into these deep flagships." },
    { t:'improved', x:"<b>Bracketology</b> now projects the seed field — who's in and what seed line — instead of simulating who wins each game." },
    { t:'improved', x:"Refreshed the rotation and grade visuals, and deep-bench players now carry a baseline overall instead of showing blank." },
    { t:'fixed', x:"The <b>On/Off</b> tab no longer mixed same-named schools (Florida / Florida State / Florida Atlantic); USC and 11 other teams now have on/off data." },
    { t:'fixed', x:"Closed a gap where one Coach's Tier tool skipped the paywall, plus assorted layout and data cleanups." },
  ]},
  { v:'Beta 1.0', date:'Initial beta', items:[
    { t:'new', x:"<b>The Depth Chart goes live</b> — roster-based rankings and 2026-27 projections for all of Division I, team & player pages, analytics, NIL values, the Coach's Tier, and the games hub." },
  ]},
];

const esc=s=>(''+(s==null?'':s));
document.getElementById('log').innerHTML = CHANGELOG.map(r=>`
  <div class="rel${r.current?' cur':''}" data-anim>
    <div class="rh"><span class="rv">${esc(r.v)}</span>${r.current?'<span class="rcur">Current</span>':''}<span class="rd">${esc(r.date)}</span></div>
    <div class="items">${r.items.map(i=>`<div class="it"><span class="tag ${i.t}">${i.t}</span><span class="ix">${i.x}</span></div>`).join('')}</div>
  </div>`).join('');
if(window.TDCAnim&&TDCAnim.scan) TDCAnim.scan(document.getElementById('log'));
</script>
  <script src="tdc-version.js?v=2"></script>
</body>
</html>
