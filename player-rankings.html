<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Player Rankings — The Depth Chart</title>
<link rel="canonical" href="https://www.thedepthchartcbb.com/roster.html">
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0; url=roster.html"></noscript>
<script>
// Oct 24 2026 (owner): Player Rankings and Player Projected Stats were the same table twice, so they merged into
// roster.html ("Player Rankings"). Old links keep working: their filters carry across.
(function () {
  var q = new URLSearchParams(location.search), o = new URLSearchParams();
  var g = q.get('g'), v = q.get('v'), by = q.get('by');
  if (g === 'pos' && v) o.set('pos', v);
  if (g === 'type' && v) o.set('type', v);
  if (g === 'role' && v) o.set('style', v);
  if (g === 'move') o.set('sort', '_chg');
  if (q.get('c')) o.set('conf', q.get('c'));
  if (q.get('lv')) o.set('lv', q.get('lv'));
  var SORT = { ovr: 'tdc_grade', ppg: 'ppg', rpg: 'rpg', apg: 'apg', stl: 'stl', blk: 'blk', tpm: 'tpm', fg_pct: 'fg_pct', tp_pct: 'tp_pct',
               ft_pct: 'ft_pct', mpg: 'mpg', tovs: 'tovs', wa: 'wa', nil: 'nil', bb: 'bb' };
  if (by && SORT[by] && g !== 'move') o.set('sort', SORT[by]);
  var s = o.toString();
  location.replace('roster.html' + (s ? '?' + s : '') + location.hash);
})();
</script>
</head>
<body><p style="font-family:system-ui,sans-serif;padding:24px">Player Rankings moved. <a href="roster.html">Go to Player Rankings →</a></p></body>
</html>
