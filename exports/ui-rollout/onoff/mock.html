<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>On/Off mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tdc-dense.css?v=41"><link rel="stylesheet" href="../../../tdc-skin.css?v=15">
<link rel="stylesheet" href="../../../tdc-sheets.css?v=6"><link rel="stylesheet" href="../../../tdc-ui.css?v=12">
<style>
  body{font-family:Inter,system-ui,sans-serif;margin:0;color:var(--text);background:var(--bg)}
  .wrap{max-width:1400px;margin:0 auto;padding:30px 40px 60px}
  .lab{font:800 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:#a07b2c;margin:0 0 6px}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:38px;margin:0 0 18px}
  .bar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
  .pane{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .strip{background:#1b1a17;color:#fff;padding:12px 16px;font:800 12px Inter;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .strip span{font-weight:600;letter-spacing:0;text-transform:none;opacity:.7}
  .pos{color:#1f8a45}.neg{color:#c0392b}.dim{color:var(--text3)}
  /* A */
  .ta{width:100%;border-collapse:collapse;font-size:13.5px}
  .ta th{font:800 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg2)}
  .ta td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  .ta td.r,.ta th.r{text-align:right}
  .ta .nm{font-weight:700}.ta .nm img{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:8px}
  .ta .tm{color:var(--text3);font-weight:500;margin-left:6px;font-size:12.5px}
  .ib{display:flex;align-items:center;gap:10px}.ib .v{font-weight:800;width:44px;text-align:right}
  .ib .track{position:relative;flex:1;height:10px;background:var(--bg2);border-radius:5px}
  .ib .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border2)}
  .ib .fill{position:absolute;top:0;bottom:0;border-radius:5px}
  .tier{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text2);font-size:12.5px}.tier i{width:8px;height:8px;border-radius:50%}
  .db svg{display:block}
  .samp{font-size:12px;color:var(--text3)}
  tr.open td{background:var(--bg2)}
  .exp td{background:var(--bg2);padding:4px 12px 14px}
  .expg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-left:46px}
  .expg .k{font:800 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);font-weight:600}
  /* B */
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0}
  .list{border-right:1px solid var(--border)}
  .li{display:grid;grid-template-columns:28px 1fr 150px 50px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13.5px}
  .li .rk{color:var(--text3);font-weight:700;text-align:right}
  .li.sel{background:var(--bg2);box-shadow:inset 3px 0 0 #a07b2c}
  .li .who b{display:block}.li .who small{color:var(--text3);font-size:12px}
  .li .who img{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:6px}
  .li .v{font-weight:800;text-align:right}
  .det{padding:22px 26px}
  .det h2{font-family:'Playfair Display',serif;font-size:30px;margin:0}
  .det .sub2{color:var(--text3);font-size:13px;margin:4px 0 18px}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:10px;margin-bottom:22px}
  .kp>div{padding:14px 16px;border-left:1px solid var(--border)}.kp>div:first-child{border-left:0}
  .kp .n{font-size:28px;font-weight:800}.kp .k{font:800 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:2px}
  .row3{display:grid;grid-template-columns:110px 1fr 120px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:13.5px}
  .row3 .k{font-weight:700}.row3 .d{text-align:right;font-weight:800}
  .legend2{display:flex;gap:16px;font-size:12px;color:var(--text3);margin:0 0 6px}.legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .meter{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;display:flex;margin:6px 0 4px}
  /* C */
  .cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .chart{padding:16px;border-right:1px solid var(--border)}
  .mini{width:100%;border-collapse:collapse;font-size:13px}
  .mini td{padding:8px 14px;border-bottom:1px solid var(--border)}
  .mini td.r{text-align:right;font-weight:800}
  .mini img{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:6px}
  .mini .h td{font:800 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);background:var(--bg2)}
  section{margin-bottom:60px}
</style></head><body>
<div class="wrap">
  <section id="A"><div class="lab">Option A · Impact board</div><h1>On/Off</h1><div id="barA"></div><div class="pane" id="mA"></div></section>
  <section id="B"><div class="lab">Option B · List + scouting card</div><h1>On/Off</h1><div id="barB"></div><div class="pane" id="mB"></div></section>
  <section id="C"><div class="lab">Option C · Two-way map</div><h1>On/Off</h1><div id="barC"></div><div class="pane" id="mC"></div></section>
</div>
<script src="../../../team-colors.js?v=13"></script>
<script>
var G='#1f8a45',R='#c0392b',ON='#1b1a17',OFF='#b9b3a6';
function short(t){ try{ return (window.tdcShortSchool&&tdcShortSchool(t))||t; }catch(e){ return t; } }
function logo(t){ try{ var c=tdcTeamColor(t); return c&&c.logo||''; }catch(e){ return ''; } }
function sg(v,d){ d=d==null?1:d; return (v>0?'+':'')+(+v).toFixed(d); }
function tier(p){ return p>=90?['Elite','#1f9d57']:p>=70?['Strong','#2bb673']:p>=40?['Neutral','#8a93a3']:p>=15?['Below','#e0885a']:['Drag','#e06552']; }
function toolbar(){ return '<div class="bar"><span class="ui-seg"><button class="on">Players</button><button>Lineups</button><button>Trios</button><button>Pairs</button></span><select class="ui-select"><option>2025-26</option></select><select class="ui-select"><option>400+ poss</option></select><input class="ui-input" placeholder="Search player or team…" style="min-width:240px"></div>'; }
// dumbbell: on vs off on a shared axis
function dumb(on,off,lo,hi,w){ w=w||220; var x=function(v){ return 8+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(w-16); };
  var z=x(0), a=x(off), b=x(on), c=on>=off?G:R;
  return '<svg width="'+w+'" height="18"><line x1="'+z+'" x2="'+z+'" y1="1" y2="17" stroke="var(--border2)"/><line x1="'+a+'" x2="'+b+'" y1="9" y2="9" stroke="'+c+'" stroke-width="3" opacity=".55"/><circle cx="'+a+'" cy="9" r="5" fill="var(--bg)" stroke="'+OFF+'" stroke-width="2.5"/><circle cx="'+b+'" cy="9" r="5.5" fill="'+ON+'"/></svg>'; }
function ibar(v,max){ var w=Math.min(50,Math.abs(v)/max*50); return '<div class="track"><div class="mid"></div><div class="fill" style="background:'+(v>=0?G:R)+';'+(v>=0?'left:50%':'right:50%')+';width:'+w+'%"></div></div>'; }

fetch('../../../scripts/data/player_onoff.json?v=3').then(r=>r.json()).then(function(D){
  var rows=D['2026'].map(r=>Object.assign({},r)), q=[];
  rows.forEach(function(r){ if(r.onoff_net!=null&&r.on_poss>=200&&r.off_poss>=100){ var c=Math.max(-35,Math.min(35,r.onoff_net)); r.adj=Math.round(c*r.off_poss/(r.off_poss+300)*10)/10; q.push(r.adj);} });
  q.sort((a,b)=>a-b); rows.forEach(function(r){ if(r.adj==null) return; var lo=0; while(lo<q.length&&q[lo]<r.adj) lo++; r.pct=Math.round(lo/(q.length-1)*100); });
  var top=rows.filter(r=>r.adj!=null&&r.on_poss>=400).sort((a,b)=>b.adj-a.adj);
  var list=top.slice(0,10).concat(top.slice(-2));

  // ---------- A
  var h='<div class="strip">Player on/off · 2025-26 <span>'+top.length.toLocaleString()+' players · ⓘ</span></div><table class="ta"><thead><tr><th class="r" style="width:30px">#</th><th>Player</th><th style="width:300px">Impact <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:600">· sample-adjusted swing</span></th><th>Tier</th><th style="width:280px">Team net rating · <span style="color:'+ON+'">● on</span> <span style="color:#8a8578">○ off</span></th><th class="r">Sample</th></tr></thead><tbody>';
  list.forEach(function(r,i){ var t=tier(r.pct), rk=i<10?i+1:top.length-(list.length-1-i);
    h+='<tr class="'+(i===1?'open':'')+'"><td class="r dim">'+rk+'</td><td class="nm"><img src="'+logo(r.team)+'">'+r.name+'<span class="tm">'+short(r.team)+'</span></td>'+
      '<td><div class="ib"><span class="v '+(r.adj>=0?'pos':'neg')+'">'+sg(r.adj)+'</span>'+ibar(r.adj,25)+'</div></td>'+
      '<td><span class="tier"><i style="background:'+t[1]+'"></i>'+t[0]+'</span></td>'+
      '<td class="db"><div style="display:flex;align-items:center;gap:8px"><span class="dim" style="width:38px;text-align:right">'+sg(r.off_net)+'</span>'+dumb(r.on_net,r.off_net,-35,40,170)+'<b>'+sg(r.on_net)+'</b></div></td>'+
      '<td class="r samp">'+r.on_poss+' on · '+r.off_poss+' off</td></tr>';
    if(i===1) h+='<tr class="exp"><td colspan="6"><div class="expg">'+
      [['Offense · pts scored /100',r.on_o,r.off_o,1],['Defense · pts allowed /100',r.on_d,r.off_d,-1],['Raw swing',r.on_net,r.off_net,1]].map(function(x){
        var d=x[1]-x[2];
        return '<div><div class="k">'+x[0]+'</div><div style="display:flex;align-items:center;gap:8px"><span class="dim">'+x[2].toFixed(1)+'</span>'+(x[0]=='Raw swing'?dumb(x[1],x[2],-35,40,170):dumb(x[3]>0?x[1]:-x[1],x[3]>0?x[2]:-x[2],x[3]>0?85:-135,x[3]>0?135:-85,170))+'<b>'+x[1].toFixed(1)+'</b><span class="'+((d*x[3])>=0?'pos':'neg')+'" style="font-weight:800;margin-left:6px">'+sg(d)+'</span></div></div>'; }).join('')+
      '</div></td></tr>';
    if(i===9) h+='<tr><td colspan="6" class="dim" style="text-align:center;font-size:12px;padding:6px">· · ·</td></tr>';
  });
  document.getElementById('mA').innerHTML=h+'</tbody></table>'; document.getElementById('barA').innerHTML=toolbar();

  // ---------- B
  var s=list[3], t=tier(s.pct);
  var L=list.slice(0,10).map(function(r,i){ return '<div class="li'+(r===s?' sel':'')+'"><span class="rk">'+(i+1)+'</span><span class="who"><b><img src="'+logo(r.team)+'">'+r.name+'</b><small>'+short(r.team)+'</small></span><div class="ib">'+ibar(r.adj,25)+'</div><span class="v pos">'+sg(r.adj)+'</span></div>'; }).join('');
  var seg=function(k,on,off,dir,lo,hi){ var d=on-off; return '<div class="row3"><span class="k">'+k+'</span><div style="display:flex;align-items:center;gap:10px"><span class="dim" style="width:42px;text-align:right">'+off.toFixed(1)+'</span>'+(dir>0?dumb(on,off,lo,hi,260):dumb(-on,-off,-hi,-lo,260))+'<b>'+on.toFixed(1)+'</b></div><span class="d '+((d*dir)>=0?'pos':'neg')+'">'+sg(d)+(dir<0?' <small class="dim" style="font-weight:600">allowed</small>':'')+'</span></div>'; };
  var tot=s.on_poss+s.off_poss;
  var det='<div class="det"><div class="lab" style="color:var(--text3)">'+short(s.team)+'</div><h2>'+s.name+'</h2><div class="sub2">'+s.games+' games · team was <b class="pos">'+sg(s.on_net)+'</b> per 100 with him, <b class="'+(s.off_net>=0?'pos':'neg')+'">'+sg(s.off_net)+'</b> without</div>'+
    '<div class="kp"><div><div class="n pos">'+sg(s.adj)+'</div><div class="k">Impact</div></div><div><div class="n"><span class="tier" style="font-size:22px;font-weight:800;color:var(--text)"><i style="background:'+t[1]+';width:12px;height:12px"></i>'+t[0]+'</span></div><div class="k">Tier</div></div><div><div class="n">'+s.pct+'<small style="font-size:14px" class="dim">th</small></div><div class="k">Percentile</div></div></div>'+
    '<div class="legend2"><span><i style="background:'+ON+'"></i>With him on</span><span><i style="border:2px solid '+OFF+';width:7px;height:7px"></i>Off</span></div>'+
    seg('Net rating',s.on_net,s.off_net,1,-35,40)+seg('Offense',s.on_o,s.off_o,1,85,135)+seg('Defense',s.on_d,s.off_d,-1,85,135)+
    '<div class="row3" style="grid-template-columns:110px 1fr"><span class="k">Sample</span><div><div class="meter"><div style="width:'+(s.on_poss/tot*100)+'%;background:'+ON+'"></div><div style="flex:1;background:'+OFF+'"></div></div><span class="samp">'+s.on_poss+' possessions on · '+s.off_poss+' off</span></div></div></div>';
  document.getElementById('mB').innerHTML='<div class="strip">Player on/off · 2025-26 <span>'+top.length.toLocaleString()+' players · ⓘ</span></div><div class="split"><div class="list">'+L+'</div>'+det+'</div>';
  document.getElementById('barB').innerHTML=toolbar();

  // ---------- C: offense swing vs defense swing
  var W=760,H=470,P=40, pts=top.filter(r=>r.on_poss>=600);
  var xs=function(v){ return P+(Math.max(-25,Math.min(25,v))+25)/50*(W-2*P); }, ys=function(v){ return H-P-(Math.max(-25,Math.min(25,v))+25)/50*(H-2*P); };
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><rect x="'+xs(0)+'" y="'+ys(25)+'" width="'+(xs(25)-xs(0))+'" height="'+(ys(0)-ys(25))+'" fill="'+G+'" opacity=".06"/>'+
    '<line x1="'+xs(0)+'" x2="'+xs(0)+'" y1="'+P+'" y2="'+(H-P)+'" stroke="var(--border2)"/><line y1="'+ys(0)+'" y2="'+ys(0)+'" x1="'+P+'" x2="'+(W-P)+'" stroke="var(--border2)"/>'+
    '<text x="'+(W-P)+'" y="'+(P+14)+'" text-anchor="end" font-size="11" font-weight="800" fill="'+G+'" letter-spacing="1">HELPS BOTH ENDS</text>'+
    '<text x="'+(P+4)+'" y="'+(H-P-8)+'" font-size="11" font-weight="800" fill="'+R+'" letter-spacing="1">HURTS BOTH ENDS</text>'+
    '<text x="'+(W/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text3)">OFFENSE SWING (pts scored /100, on − off) →</text>'+
    '<text transform="translate(14,'+(H/2)+') rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text3)">DEFENSE SWING (pts saved /100) →</text>';
  pts.forEach(function(r){ var ox=r.on_o-r.off_o, dy=r.off_d-r.on_d; svg+='<circle cx="'+xs(ox)+'" cy="'+ys(dy)+'" r="3.2" fill="'+(r.adj>=0?G:R)+'" opacity=".35"/>'; });
  list.slice(0,6).forEach(function(r){ var ox=r.on_o-r.off_o, dy=r.off_d-r.on_d; svg+='<circle cx="'+xs(ox)+'" cy="'+ys(dy)+'" r="5.5" fill="'+ON+'"/><text x="'+(xs(ox)+8)+'" y="'+(ys(dy)+4)+'" font-size="11.5" font-weight="700" fill="var(--text)">'+r.name.split(' ').slice(-1)[0]+'</text>'; });
  svg+='</svg>';
  var mini='<table class="mini"><tr class="h"><td>Top impact</td><td class="r">Off</td><td class="r">Def</td><td class="r">Impact</td></tr>'+list.slice(0,10).map(function(r){ var ox=r.on_o-r.off_o, dy=r.off_d-r.on_d;
    return '<tr><td><img src="'+logo(r.team)+'"><b>'+r.name+'</b> <span class="dim">'+short(r.team)+'</span></td><td class="r '+(ox>=0?'pos':'neg')+'" style="font-weight:600">'+sg(ox)+'</td><td class="r '+(dy>=0?'pos':'neg')+'" style="font-weight:600">'+sg(dy)+'</td><td class="r">'+sg(r.adj)+'</td></tr>'; }).join('')+'</table>';
  document.getElementById('mC').innerHTML='<div class="strip">Where the swing comes from · 2025-26 <span>600+ possessions · ⓘ</span></div><div class="cgrid"><div class="chart">'+svg+'</div><div>'+mini+'</div></div>';
  document.getElementById('barC').innerHTML=toolbar();
});
</script></body></html>
