<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Box Score — The Depth Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FBFAFF;--bg2:#F2EFFB;--border:#E1DBF2;--border2:#C9BFE6;--text:#14101F;--text2:#463D5E;--text3:#847B9C;--accent:#8B3FE0;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#07060C;--bg2:#100D1A;--border:#241F36;--border2:#382F54;--text:#F2EFFB;--text2:#A8A1C4;--text3:#6D6589;--accent:#B16BFF;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;min-height:100vh;}
    a{color:inherit;}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;text-decoration:none;color:var(--text);}
    .nav-logo span{color:var(--accent);}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;border-radius:6px;}
    .wrap{max-width:960px;margin:0 auto;padding:26px 22px 80px;}
    .back{font-size:12px;font-weight:600;color:var(--text3);text-decoration:none;text-transform:uppercase;letter-spacing:.05em;}
    .back:hover{color:var(--accent);}
    /* matchup header */
    .gh{margin:18px 0 8px;border-bottom:1px solid var(--border);padding-bottom:16px;}
    .gh-meta{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
    .gh-score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
    .gh-team{display:flex;align-items:baseline;gap:12px;}
    .gh-team .nm{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;letter-spacing:-.01em;}
    .gh-team .pts{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;}
    .gh-team.win .nm,.gh-team.win .pts{color:var(--text);}
    .gh-team.lose{opacity:.55;}
    .gh-at{color:var(--text3);font-size:13px;font-weight:700;}
    .gh-win-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:1px 5px;}
    /* box tables */
    .bs{margin-top:26px;}
    .bs-team{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;margin-bottom:8px;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;}
    th{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);}
    th:first-child{text-align:left;}
    td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;color:var(--text2);}
    td:first-child{text-align:left;font-weight:700;color:var(--text);}
    td.pts{font-weight:800;color:var(--text);}
    tr.starter td:first-child::after{content:' ★';color:var(--text3);font-size:9px;}
    tr.totals td{border-top:2px solid var(--border2);border-bottom:none;font-weight:800;color:var(--text);padding-top:8px;}
    .loading,.err{padding:50px;text-align:center;color:var(--text3);}
    /* player links + player of the game */
    .bs-name{color:inherit;text-decoration:none;}
    .bs-name:hover{color:var(--accent);text-decoration:underline;}
    tr.potg td{background:color-mix(in srgb,#f5b301 17%,transparent);}
    tr.potg td:first-child{font-weight:800;}
    [data-theme="dark"] tr.potg td{background:color-mix(in srgb,#f5b301 13%,transparent);}
    .potg-badge{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.04em;color:#7a4f00;background:#ffd45e;border-radius:3px;padding:1px 5px;margin-right:6px;vertical-align:middle;}
    [data-theme="dark"] .potg-badge{color:#1a1206;background:#f0b429;}
    .potg-callout{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border:1px solid color-mix(in srgb,#f5b301 45%,var(--border));background:color-mix(in srgb,#f5b301 9%,transparent);border-radius:8px;}
    .potg-callout .crown{font-size:20px;}
    .potg-callout .lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#a36a00;}
    [data-theme="dark"] .potg-callout .lbl{color:#f0b429;}
    .potg-callout .nm{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;}
    .potg-callout .ln{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums;}
    .potg-callout a{text-decoration:none;color:inherit;}
    .potg-callout a:hover .nm{color:var(--accent);}
    @media(max-width:620px){th.h,td.h{display:none;}.wrap{padding:18px 12px 60px;}}
  </style>
</head>
<body>
  <div class="nav">
    <a class="nav-logo" href="index.html">The Depth <span>Chart</span></a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="wrap">
    <a class="back" id="backLink" href="#" onclick="history.length>1?history.back():(location.href='index.html');return false;">← Back</a>
    <div id="content"><div class="loading">Loading box score…</div></div>
  </div>

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';try{localStorage.setItem('tdc_theme',d?'light':'dark');}catch(e){}}
(function(){try{var s=localStorage.getItem('tdc_theme');if(s){document.documentElement.setAttribute('data-theme',s);document.getElementById('themeBtn').textContent=s==='dark'?'☀️':'🌙';}}catch(e){}})();

const qs=new URLSearchParams(location.search);
const gid=qs.get('id');
const N=v=>v==null?0:v;
const fmtD=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}};

// John Hollinger's Game Score — single-number box-score rating
function gameScore(p){
  return N(p.pts)+0.4*N(p.fgm)-0.7*N(p.fga)-0.4*(N(p.fta)-N(p.ftm))+0.7*N(p.oreb)+0.3*N(p.dreb)
    +N(p.stl)+0.7*N(p.ast)+0.7*N(p.blk)-0.4*N(p.pf)-N(p.tov);
}
function plink(p){ return `<a class="bs-name" href="player.html?name=${encodeURIComponent(p.player)}">${p.player}</a>`; }
function statline(p){
  const bits=[`${N(p.pts)} PTS`,`${N(p.reb)} REB`,`${N(p.ast)} AST`];
  if(N(p.stl)>=2) bits.push(`${N(p.stl)} STL`);
  if(N(p.blk)>=2) bits.push(`${N(p.blk)} BLK`);
  return bits.join(' · ');
}
function row(p,tot,isPotg){
  const fg=`${N(p.fgm)}-${N(p.fga)}`, tp=`${N(p.tpm)}-${N(p.tpa)}`, ft=`${N(p.ftm)}-${N(p.fta)}`;
  const cls=[tot?'totals':'',(!tot&&p.starter)?'starter':'',isPotg?'potg':''].filter(Boolean).join(' ');
  const nameCell=tot?'Team':`${isPotg?'<span class="potg-badge">★ POTG</span>':''}${plink(p)}`;
  return `<tr class="${cls}">
    <td>${nameCell}</td>
    <td>${tot?'':N(p.min)}</td>
    <td class="h">${fg}</td><td class="h">${tp}</td><td class="h">${ft}</td>
    <td>${N(p.reb)}</td><td>${N(p.ast)}</td>
    <td class="h">${N(p.stl)}</td><td class="h">${N(p.blk)}</td><td class="h">${N(p.tov)}</td><td class="h">${N(p.pf)}</td>
    <td class="pts">${N(p.pts)}</td></tr>`;
}
function tableFor(team,players,potgId){
  const sorted=[...players].sort((a,b)=> (b.starter?1:0)-(a.starter?1:0) || N(b.min)-N(a.min));
  const tot={}; ['min','fgm','fga','tpm','tpa','ftm','fta','reb','ast','stl','blk','tov','pf','pts'].forEach(k=>tot[k]=players.reduce((s,p)=>s+N(p[k]),0));
  return `<div class="bs">
    <div class="bs-team">${team}</div>
    <table><thead><tr>
      <th>Player</th><th>Min</th><th class="h">FG</th><th class="h">3PT</th><th class="h">FT</th>
      <th>Reb</th><th>Ast</th><th class="h">Stl</th><th class="h">Blk</th><th class="h">TO</th><th class="h">PF</th><th>Pts</th>
    </tr></thead><tbody>
      ${sorted.map(p=>row(p,false,p.espn_id===potgId)).join('')}
      ${row(tot,true)}
    </tbody></table></div>`;
}

async function load(){
  const c=document.getElementById('content');
  if(!gid){c.innerHTML='<div class="err">No game specified.</div>';return;}
  try{
    const [gA,bA]=await Promise.all([
      fetch(`${SB}/rest/v1/games?id=eq.${gid}&select=*&limit=1`,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/box_scores?game_id=eq.${gid}&select=*`,{headers:H}).then(r=>r.json()),
    ]);
    const g=gA&&gA[0];
    if(!bA||!bA.length){c.innerHTML='<div class="err">No box score available for this game.</div>';return;}
    // group by team
    const byTeam={}; bA.forEach(p=>{(byTeam[p.team]=byTeam[p.team]||[]).push(p);});
    let home,away,hs,as_,date,loc;
    if(g){home=g.home;away=g.away;hs=g.home_score;as_=g.away_score;date=g.date;loc=g.neutral?'Neutral site':null;}
    else{ // fall back to box-score data
      const teams=Object.keys(byTeam); away=teams[0];home=teams[1]||teams[0];
      as_=byTeam[away].reduce((s,p)=>s+N(p.pts),0); hs=home?byTeam[home].reduce((s,p)=>s+N(p.pts),0):0;
      date=bA[0].date;
    }
    const homeWin=N(hs)>N(as_);
    document.title=`${away} at ${home} — Box Score`;
    const header=`<div class="gh">
      <div class="gh-meta">${fmtD(date)}${loc?' · '+loc:''}${g&&g.conf_game?' · Conference':''}</div>
      <div class="gh-score">
        <div class="gh-team ${homeWin?'lose':'win'}"><span class="nm">${away}</span><span class="pts">${N(as_)}</span>${!homeWin?'<span class="gh-win-tag">Win</span>':''}</div>
        <span class="gh-at">@</span>
        <div class="gh-team ${homeWin?'win':'lose'}"><span class="nm">${home}</span><span class="pts">${N(hs)}</span>${homeWin?'<span class="gh-win-tag">Win</span>':''}</div>
      </div></div>`;
    // player of the game = highest Game Score across both teams
    let potg=null,bestGs=-1e9;
    bA.forEach(p=>{const gs=gameScore(p); if(gs>bestGs){bestGs=gs;potg=p;}});
    const potgId=potg?potg.espn_id:null;
    const callout=potg?`<div class="potg-callout">
      <span class="crown">👑</span>
      <div><div class="lbl">Player of the Game</div>
        <a href="player.html?name=${encodeURIComponent(potg.player)}"><span class="nm">${potg.player}</span></a>
        <span class="ln"> — ${statline(potg)} · ${potg.team}</span></div></div>`:'';
    // away team first, then home
    const order=[away,home].filter(t=>byTeam[t]);
    Object.keys(byTeam).forEach(t=>{ if(!order.includes(t)) order.push(t); });
    c.innerHTML=header+callout+order.map(t=>tableFor(t,byTeam[t],potgId)).join('');
  }catch(e){ c.innerHTML='<div class="err">Could not load box score. '+e.message+'</div>'; }
}
load();
</script>
</body>
</html>
