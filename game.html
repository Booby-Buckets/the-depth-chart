<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';try{localStorage.setItem('tdc_theme',d?'light':'dark');}catch(e){}}
(function(){try{var s=localStorage.getItem('tdc_theme');if(s){document.documentElement.setAttribute('data-theme',s);document.getElementById('themeBtn').textContent=s==='dark'?'☀️':'🌙';}}catch(e){}})();

const qs=new URLSearchParams(location.search);
const gid=qs.get('id');
const N=v=>v==null?0:v;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}};

// John Hollinger's Game Score — single-number box-score rating
function gameScore(p){
  return N(p.pts)+0.4*N(p.fgm)-0.7*N(p.fga)-0.4*(N(p.fta)-N(p.ftm))+0.7*N(p.oreb)+0.3*N(p.dreb)
    +N(p.stl)+0.7*N(p.ast)+0.7*N(p.blk)-0.4*N(p.pf)-N(p.tov);
}
// per-player 0-10 game rating — same scale as the player pages & tournament box scores
function playerRating(p){ return Math.max(2.0,Math.min(10.0,Math.round((5.0+0.135*gameScore(p))*10)/10)); }
function ratingColor(r){ return r==null?'var(--text3)':r>=8?'#1f9d57':r>=6.5?'#3d8f6b':r>=5.5?'#c2912f':'#cf5a4e'; }
function ratingWord(r){ return r==null?'':r>=8.5?'Dominant':r>=7.5?'Great':r>=6.5?'Strong':r>=5.5?'Solid':r>=4.5?'Shaky':'Poor'; }
// team game rating (0-10) vs SRS-implied expectation — same formula as the tournament view
function teamRatings(g,SRS){
  if(!g||g.home_score==null||g.away_score==null) return null;
  const hw=N(g.home_score)>N(g.away_score);              // winner from the score
  const winNm=hw?g.home:g.away, losNm=hw?g.away:g.home;
  const margin=Math.abs(N(g.home_score)-N(g.away_score));
  const sW=SRS[winNm], sL=SRS[losNm];
  if(sW==null||sL==null) return null;
  const res=margin-(sW-sL);
  const rate=perf=>Math.max(2.0,Math.min(10.0,Math.round((6.3+perf*0.22)*10)/10));
  return {home:hw?rate(res):rate(-res), away:hw?rate(-res):rate(res)};
}
// phones get "G. Placide" so a name stays on one line beside the numbers
function shortPlayer(n){ const w=String(n||'').trim().split(/\s+/); return w.length<2?String(n||''):w[0][0]+'. '+w.slice(1).join(' '); }
function plink(p){ return `<a class="bs-name" href="player.html?espn=${p.espn_id}&name=${encodeURIComponent(p.player)}"><span class="n-f">${p.player}</span><span class="n-s">${shortPlayer(p.player)}</span></a>`; }
function statline(p){
  const bits=[`${N(p.pts)} PTS`,`${N(p.reb)} REB`,`${N(p.ast)} AST`];
  if(N(p.stl)>=2) bits.push(`${N(p.stl)} STL`);
  if(N(p.blk)>=2) bits.push(`${N(p.blk)} BLK`);
  return bits.join(' · ');
}
// Box score = the site sheet (tdc-sheets.css), laid out like the scrimmage box (owner, Nov 1 2026: "make it more like
// our scrimmage ones"): points first, offensive-defensive boards, shooting at the end, +/− from the play-by-play once it
// loads, * = started, the team line in the footer (so the c0-c4 shading stays within the players). FG/3PT/FT shade by %.
const pctV=(m,a)=>N(a)>0?(N(m)/N(a)*100).toFixed(1):'';
const signedPm=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
const pmShade=d=>d>=10?' c4':d>=4?' c3':d<=-10?' c0':d<=-4?' c1':'';
function row(p,tot,isPotg,rating,pm,firstBench){
  const fg=`${N(p.fgm)}-${N(p.fga)}`, tp=`${N(p.tpm)}-${N(p.tpa)}`, ft=`${N(p.ftm)}-${N(p.fta)}`;
  const lead=tot?`<td class="l">Team</td>`
    :`<td class="l nm">${plink(p)}${isPotg?'<span class="potg-tag" title="Player of the Game: highest Game Score on either team">POTG</span>':''}</td>`;
  const rtg=rating!=null?`<span title="0-10 game rating${tot?' (team: the result vs expected)':''}">${rating.toFixed(1)}</span>`:(tot?'':'—');
  const pmTd=pm===undefined?'':tot||pm==null?'<td class="dim">'+(tot?'':'—')+'</td>':`<td class="strong${pmShade(pm)}">${signedPm(pm)}</td>`;
  // shading is for real minutes and real volume: a walk-on's 1 minute or an 0-for-1 from three isn't a red flag
  const thin=!tot&&N(p.min)<5, dv=thin?' data-v=""':'', vol=(m,a,n)=>N(a)>=n&&!thin?pctV(m,a):'';
  return `<tr${firstBench?' class="bs-bench"':''}>${lead}<td class="strong"${dv}>${rtg}</td><td>${tot?'':N(p.min)}</td><td class="strong"${dv}>${N(p.pts)}</td>
    <td${dv}>${N(p.reb)}</td><td class="dim">${N(p.oreb)}-${N(p.dreb)}</td><td${dv}>${N(p.ast)}</td><td>${N(p.stl)}</td><td>${N(p.blk)}</td><td>${N(p.tov)}</td><td class="dim">${N(p.pf)}</td>
    <td data-v="${vol(p.fgm,p.fga,3)}">${fg}</td><td data-v="${vol(p.tpm,p.tpa,3)}">${tp}</td><td data-v="${vol(p.ftm,p.fta,3)}">${ft}</td>${pmTd}</tr>`;
}
function boxHead(rtgTip,pm){
  return `<thead><tr><th class="l">Player</th><th data-heat="1" title="${rtgTip}">RTG</th><th data-fit-keep>MIN</th><th data-heat="1">PTS</th>
      <th data-heat="1">REB</th><th title="Offensive-defensive rebounds">O-D</th><th data-heat="1">AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PF</th>
      <th data-heat="1" data-fit-keep title="Field goals made-attempted, shaded by FG% (3+ attempts)">FG</th><th data-heat="1" title="Threes made-attempted, shaded by 3P% (3+ attempts)">3PT</th><th data-heat="1" title="Free throws made-attempted, shaded by FT% (3+ attempts)">FT</th>${pm?'<th title="Score margin while he was on the floor (from the play-by-play)">+/−</th>':''}</tr></thead>`;
}
// one team's block: logo + name heading, the sheet, then who sat (ESPN lists its did-not-play players)
function tableFor(team,players,potgId,teamRating,pm,ext){
  ext=ext||{};
  const played=players.filter(p=>N(p.min)>0||p.min==null), zero=players.filter(p=>p.min!=null&&N(p.min)===0);
  const sorted=[...played].sort((a,b)=> (b.starter?1:0)-(a.starter?1:0) || N(b.min)-N(a.min));
  const tot={}; ['min','fgm','fga','tpm','tpa','ftm','fta','reb','oreb','dreb','ast','stl','blk','tov','pf','pts'].forEach(k=>tot[k]=players.reduce((s,p)=>s+N(p[k]),0));
  const pmOf=p=>pm?(pm[String(p.espn_id)]!=null?pm[String(p.espn_id)]:null):undefined;
  const dnp=(ext.dnp||[]).concat(zero.map(p=>p.player));
  const GT=window.TDCGameTabs;
  const firstBenchAt=sorted.some(p=>p.starter)?sorted.findIndex(p=>!p.starter):-1;
  return GT.head(esc(ext.name||team)+(ext.pts!=null?`<span class="bs-sc">${N(ext.pts)}</span>`:''), played.length+' played'+(ext.dnp?' · '+dnp.length+' did not play':''), ext.logo)+
    `<div class="sheet-wrap" style="max-height:none;"><table class="sheet dense freeze bs-sheet">${boxHead('0-10 game rating from the box score (Game Score): 5 ≈ an average game · 6.5 strong · 8+ great',!!pm)}<tbody>
      ${sorted.map((p,i)=>row(p,false,p.espn_id===potgId,N(p.min)>0?playerRating(p):null,pmOf(p),i===firstBenchAt)).join('')}
    </tbody><tfoot>${row(tot,true,false,teamRating!=null?teamRating:null,pm?null:undefined)}</tfoot></table></div>`+
    (ext.dnp?`<div class="gt-dnp"><b>Did not play:</b> ${dnp.length?dnp.map(esc).join(', '):'<span class="none">everyone played</span>'}</div>`:'');
}
function shadeBoxes(host){ if(window.tdcSheetHeat) (host||document).querySelectorAll('table.sheet').forEach(t=>tdcSheetHeat(t)); }

// Live mode (tdc-live.js + tdc-livegame.js): a game that isn't final, or isn't in our
// box_scores yet, is shown from ESPN's live summary and polled every 20s. ?live=1 forces it,
// ?livetest=1 feeds the recorded mid-game fixture (scripts/data/live-fixture-*.json).
let liveView=null;
function goLive(c){
  if(liveView||!window.TDCLiveGame||!window.TDC_LIVE){ if(!liveView) c.innerHTML='<div class="err">No box score available for this game.</div>'; return; }
  const forced=qs.has('livetest')||qs.get('live')==='1';
  liveView=TDCLiveGame.mount(c,gid,{onFinal:forced?null:()=>{ load(true); }});
}
// A finished game whose box hasn't reached our box_scores yet (the results job runs every ~20 minutes, later when
// GitHub's scheduler lags): build the same rows from ESPN's summary so the final view shows straight away, with
// ESPN's did-not-play list. Returns {g, bA, dnp:{team:[names]}} or null when ESPN doesn't have it final either.
async function espnFinal(){
  if(!window.TDC_LIVE||!TDC_LIVE.summary) return null;
  let d=null; try{ d=await TDC_LIVE.summary(gid); }catch(e){ return null; }
  if(!d||d.state!=='post'||d.home.score==null||d.away.score==null) return null;
  const date=new Date(d.date).toLocaleDateString('en-CA',{timeZone:'America/New_York'}), yr=+date.slice(0,4), mo=+date.slice(5,7);
  const g={ id:+gid, season_year:mo>=8?yr+1:yr, date, home:d.home.name, away:d.away.name, home_score:d.home.score, away_score:d.away.score,
    neutral:d.neutral, conf_game:d.conf, status:'STATUS_FINAL', venue:d.venue };
  const nameOf={[d.home.id]:d.home.name,[d.away.id]:d.away.name}, bA=[], dnp={};
  (d.players||[]).forEach(tp=>{
    const team=nameOf[tp.id]; if(!team) return; const L=tp.labels||[];
    (tp.athletes||[]).forEach(a=>{
      if(a.dnp){ (dnp[team]=dnp[team]||[]).push(a.name); return; }
      const val=k=>{ const i=L.indexOf(k); return i<0?null:a.stats[i]; };
      const n=k=>{ const x=parseFloat(val(k)); return isFinite(x)?x:0; };
      const ma=k=>{ const m=String(val(k)||'').match(/^(\d+)-(\d+)$/); return m?[+m[1],+m[2]]:[0,0]; };
      const fg=ma('FG'), tp3=ma('3PT'), ft=ma('FT');
      bA.push({ game_id:+gid, team, player:a.name, espn_id:+a.id, starter:a.starter, min:n('MIN'), pts:n('PTS'), fgm:fg[0], fga:fg[1], tpm:tp3[0], tpa:tp3[1],
        ftm:ft[0], fta:ft[1], reb:n('REB'), oreb:n('OREB'), dreb:n('DREB'), ast:n('AST'), tov:n('TO'), stl:n('STL'), blk:n('BLK'), pf:n('PF') });
    });
  });
  return bA.length?{g,bA,dnp}:null;
}
async function load(afterLive){
  const c=document.getElementById('content');
  if(!gid){c.innerHTML='<div class="err">No game specified.</div>';return;}
  if(!afterLive && (qs.has('livetest')||qs.get('live')==='1')){ goLive(c); return; }
  try{
    let [gA,bA]=await Promise.all([
      fetch(`${SB}/rest/v1/games?id=eq.${gid}&select=*&limit=1`,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/box_scores?game_id=eq.${gid}&select=*`,{headers:H}).then(r=>r.json()),
    ]);
    let g=gA&&gA[0], DNP=null;
    const notFinal=g&&g.status&&g.status!=='STATUS_FINAL';
    if(!bA||!bA.length||notFinal){
      const E=await espnFinal();   // final on ESPN, not in our tables yet: same final view, from ESPN's box
      if(!E){ if(!afterLive) goLive(c); return; }
      g=Object.assign({},g||{},E.g); bA=E.bA; DNP=E.dnp;
    }
    if(liveView){ liveView.stop(); liveView=null; }
    // group by team
    const byTeam={}; bA.forEach(p=>{(byTeam[p.team]=byTeam[p.team]||[]).push(p);});
    let home,away,hs,as_,date,loc;
    if(g){home=g.home;away=g.away;hs=g.home_score;as_=g.away_score;date=g.date;loc=g.neutral?'Neutral site'+(g.venue?' · '+esc(g.venue):''):(g.venue?esc(g.venue):null);}
    else{ // fall back to box-score data
      const teams=Object.keys(byTeam); away=teams[0];home=teams[1]||teams[0];
      as_=byTeam[away].reduce((s,p)=>s+N(p.pts),0); hs=home?byTeam[home].reduce((s,p)=>s+N(p.pts),0):0;
      date=bA[0].date;
    }
    document.title=`${away} at ${home} — Box Score`;
    // season SRS map → team game ratings (0-10), same scale as the player scores
    let SRS={};
    if(g && g.season_year!=null){
      try{ const sr=await fetch(`${SB}/rest/v1/team_seasons?season_year=eq.${g.season_year}&srs=not.is.null&select=team,srs`,{headers:H}).then(r=>r.ok?r.json():[]);
        (sr||[]).forEach(x=>{ SRS[x.team]=parseFloat(x.srs); }); }catch(e){}
    }
    let tr=teamRatings(g,SRS);
    const ratePill=v=>v!=null?`<span class="gh-rate" style="background:${ratingColor(v)};" title="Team game rating (0-10): ${ratingWord(v)}">${v.toFixed(1)}</span>`:'';
    // team-colour scoreboard band (tdc-gamehead.js); the game rating pill rides under each name
    const shortNm=t=>{ try{ return (window.TDCTeamName&&TDCTeamName.short)?TDCTeamName.short(t):t; }catch(e){ return t; } };
    const bandSide=(t,pts,rate)=>{ const c=window.TDC_GAMEHEAD?TDC_GAMEHEAD.team(t):{};
      return { name:shortNm(t), href:'team.html?team='+encodeURIComponent(t), logo:c.logo, color:c.color,
        sub:rate!=null?'Game rating '+ratePill(rate)+' '+ratingWord(rate):'', pts:N(pts) }; };
    if(window.TDC_OT) await TDC_OT.ready();   // "Final/OT" in the band
    const header=()=>`<h1 class="sr-only">${away} at ${home}</h1>`+(window.TDC_GAMEHEAD?TDC_GAMEHEAD.html({
        away:bandSide(away,as_,tr?tr.away:null), home:bandSide(home,hs,tr?tr.home:null), status:window.TDC_OT?TDC_OT.final(gid):'Final',
        meta:`<span>${fmtD(date)}</span>${loc?`<span>${loc}</span>`:''}${g&&g.conf_game?'<span>Conference game</span>':''}` })
      :`<div class="gh-meta">${fmtD(date)}</div>`);
    // the read under the band: what was expected vs what happened. 2026-27 games use our pregame line (same as
    // the scrimmage page); any season gets the season power ratings the team game rating is measured against.
    let expM=null, expLbl='';   // expected margin (home − away) for the strip: our pregame line (2026-27) or season power
    const read=await (async()=>{   // [label, value] rows for the Summary tab
      const mg=N(hs)-N(as_), res=`<b>${esc(shortNm(mg>=0?home:away))} by ${Math.abs(mg)}</b>`;
      if(g&&g.season_year>=2027&&window.TDC_LIVE&&TDC_LIVE.pregame){ try{
        if(window.TDCLiveGame&&TDCLiveGame.deps) await TDCLiveGame.deps();   // ratings + schedule for our line
        const l=await TDC_LIVE.pregame({id:String(gid),date:g.date,home:{name:home},away:{name:away},neutral:!!g.neutral});
        if(l&&l.margin!=null){ const d=mg-l.margin, fav=l.margin>=0?home:away; expM=l.margin; expLbl='Our line';
          return [['Our line',`<b>${esc(shortNm(fav))} −${Math.abs(l.margin).toFixed(1)}</b>${l.p!=null?` · ${Math.round(100*Math.max(l.p,1-l.p))}% to win`:''}`],
                  ['Result',`${res} · ${Math.abs(d).toFixed(1)} points ${(l.margin>=0?d:-d)>=0?'better':'worse'} than our line for the favorite`]]; }
      }catch(e){} }
      const sH=SRS[home], sA=SRS[away]; if(sH==null||sA==null) return [['Result',res]];
      const exp=sH-sA, over=mg-exp; expM=exp; expLbl='Power ratings';
      return [['Expected',`<b>${esc(shortNm(exp>=0?home:away))} by ${Math.abs(exp).toFixed(1)}</b> · season power ratings`],
              ['Result',`${res} · ${esc(shortNm(over>=0?home:away))} played ${Math.abs(over).toFixed(1)} points better than expected`]];
    })();
    // no season power ratings yet (2026-27): each team's game rating comes from the result vs our line, as on the scrimmage page
    if(!tr&&expLbl==='Our line'&&expM!=null){ const d=(N(hs)-N(as_))-expM, rate=x=>Math.max(2,Math.min(10,Math.round((6.3+x*0.22)*10)/10));
      tr={home:rate(d), away:rate(-d)}; }
    // player of the game = highest Game Score across both teams
    let potg=null,bestGs=-1e9;
    bA.forEach(p=>{const gs=gameScore(p); if(gs>bestGs){bestGs=gs;potg=p;}});
    const potgId=potg?potg.espn_id:null;
    // away team first, then home
    const order=[away,home].filter(t=>byTeam[t]);
    Object.keys(byTeam).forEach(t=>{ if(!order.includes(t)) order.push(t); });
    const trFor=t=>tr?(t===home?tr.home:t===away?tr.away:null):null;
    // the strip: margin · expected · total · pace · site
    const strip=(()=>{ const mg=N(hs)-N(as_), win=mg>=0?home:away;
      const tm=t=>(byTeam[t]||[]).reduce((a,p)=>{ a.fga+=N(p.fga); a.fta+=N(p.fta); a.tov+=N(p.tov); a.oreb+=N(p.oreb); return a; },{fga:0,fta:0,tov:0,oreb:0});
      const poss=t=>{ const x=tm(t); return x.fga+0.44*x.fta+x.tov-x.oreb; }, pa=poss(home), pb=poss(away), pace=(pa>0&&pb>0)?(pa+pb)/2:null;
      const vsExp=expM!=null?mg-expM:null, T=window.TDCGameTabs;
      return T.strip([
        {v:Math.abs(mg),k:'Margin',s:esc(shortNm(win))+' won'},
        {v:expM!=null?'−'+Math.abs(expM).toFixed(1):'—',k:'Expected',s:expM!=null?esc(shortNm(expM>=0?home:away))+' · '+expLbl:'no pregame rating'},
        {v:vsExp!=null?Math.abs(vsExp).toFixed(1):'—',k:'vs. expected',s:vsExp!=null?esc(shortNm(vsExp>=0?home:away))+' beat it':'',tip:'How far the result landed from the expected margin. This gap sets each team’s game rating (6.3 = exactly as expected).'},
        {v:N(hs)+N(as_),k:'Total points',s:pace?((N(hs)+N(as_))/pace/2*100).toFixed(0)+' per 100 poss.':''},
        {v:pace?Math.round(pace):'—',k:'Possessions',s:g&&g.neutral?'neutral site':esc(shortNm(home))+' home floor'}]); })();
    const GT=window.TDCGameTabs;
    // SUMMARY like the scrimmage page: player-of-the-game card + head-to-head leaders, the key-moment tiles once the
    // play-by-play loads, then the result against what we expected
    const href=p=>p.espn_id?`player.html?espn=${p.espn_id}&name=${encodeURIComponent(p.player)}`:null;
    const look=t=>(window.TDC_GAMEHEAD?TDC_GAMEHEAD.team(t):null)||{};
    const sideOf=t=>({ name:shortNm(t), logo:look(t).logo, color:look(t).color,
      players:(byTeam[t]||[]).map(p=>({ name:p.player, pts:p.pts, reb:p.reb, ast:p.ast, min:p.min, href:href(p) })) });
    const card=potg?GT.potg({ name:potg.player, href:href(potg), team:shortNm(potg.team), logo:look(potg.team).logo, color:look(potg.team).color,
      min:potg.min, fg:potg.fga!=null?N(potg.fgm)+'-'+N(potg.fga):'', pts:potg.pts, reb:potg.reb, ast:potg.ast, stl:potg.stl, blk:potg.blk, rtg:playerRating(potg) }):'';
    // THE GAME tab (owner, Nov 2026: box score first, the analysis as a dashboard under it). Chart panels fill in from the
    // play-by-play and drop out when ESPN has none.
    const dash='<div class="gt-sumgrid">'+card+(order.length===2?GT.duel(order.map(sideOf)):'')+'</div>'+
      '<div class="gt-sumgrid gt-dash"><div class="gt-sumcol"><div id="gmFlowP">'+GT.panel('Game flow','<div id="gmFlow"><div class="loading">Loading the play-by-play…</div></div>')+'</div><div id="gmMoments"></div></div>'+
      '<div id="gmEff"></div></div>'+
      '<div id="gmShotsP">'+GT.panel('Shot charts','<div id="gmShots"><div class="loading">Loading the play-by-play…</div></div>','<span class="gt-tools">by-player zones on the Shot chart tab</span>')+'</div>'+
      '<div class="gt-sumgrid gt-sum2" style="margin-top:18px;">'+(order.length===2?GT.compare(order.map(t=>({name:shortNm(t),players:byTeam[t]}))):'')+
      '<div class="gt-sumcol"><div id="gmLineupsP">'+GT.panel('Most-used lineups','<div id="gmLineups"></div>',null,'gt-flush')+'</div>'+GT.panel('The result',GT.kv(read||[]),null,'gt-flush')+'</div></div>'+
      '<p class="gt-foot">'+(tr?'Team game rating: 6.3 = played exactly as expected · ':'')+'Player RTG: 5 average · 6.5 strong · 8+ great</p>';
    // box scores; +/− joins once the play-by-play has been walked
    let PM;
    const ptsOf=t=>t===home?hs:t===away?as_:null;
    // team switch: opens on the winner; "Both" stacks them
    let boxSel=order.length===2?(N(ptsOf(order[1]))>N(ptsOf(order[0]))?1:0):'both';
    const boxSeg=()=>order.length!==2?'':'<div class="gt-seg" role="group" aria-label="Which team">'+order.map((t,i)=>`<button type="button" data-b="${i}">${look(t).logo?`<img src="${esc(look(t).logo)}" alt="">`:''}${esc(shortNm(t))} <b>${N(ptsOf(t))}</b></button>`).join('')+'<button type="button" data-b="both">Both</button></div>';
    const boxApply=el=>{ el.querySelectorAll('.bs-team').forEach(d=>{ d.hidden=boxSel!=='both'&&String(boxSel)!==d.dataset.t; });
      el.querySelectorAll('.gt-seg button').forEach(b=>{ const on=b.dataset.b===String(boxSel); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); });
      window.dispatchEvent(new Event('resize')); };   // the phone sheet fit skips hidden tables: let it measure the one just shown
    const boxDraw=(el,pm)=>{ el.innerHTML=boxSeg()+boxesHtml(pm); shadeBoxes(el); boxApply(el);
      el.querySelectorAll('.gt-seg button').forEach(b=>{ b.onclick=()=>{ boxSel=b.dataset.b==='both'?'both':+b.dataset.b; boxApply(el); }; }); };
    const boxesHtml=pm=>order.map((t,i)=>`<div class="bs-team" data-t="${i}">`+tableFor(t,byTeam[t],potgId,trFor(t),pm,{ name:shortNm(t), logo:look(t).logo, pts:ptsOf(t), dnp:DNP?(DNP[t]||[]):null })+'</div>').join('')+
      '<p class="note">Starters above the line · RTG = 0–10 game rating (team line: the result vs expected)'+(DNP?' · from ESPN’s box until ours posts':'')+'</p>';
    const pmFrom=res=>{ const S=res&&res.R&&res.R.stints; if(!S||!Object.keys(S).length) return null;
      const o={}; Object.keys(S).forEach(id=>{ o[id]=S[id].reduce((a,x)=>a+x.pm,0); }); return o; };
    // TEAM STATS: the scrimmage page's efficiency sheet (shooting · four factors · per possession vs the D-I average)
    const ffP=fetch('scripts/data/team_pace_eff.json?v=8').then(r=>r.ok?r.json():null).then(j=>j&&j.ffAvg||null).catch(()=>null);
    c.innerHTML=header()+strip+`<div style="text-align:right;margin:-4px 0 6px;"><a href="compare-games.html?a=${encodeURIComponent(gid)}" style="font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;">Compare this game with another →</a></div>`+'<div id="gmTabs"></div>';
    // play-by-play tabs draw on first open (the charts measure their width); they drop out when ESPN has no PBP
    const gfP=window.TDC_GAMEFLOW?TDC_GAMEFLOW.load(gid).catch(()=>null):Promise.resolve(null);
    const gfTab=(id,label,draw)=>({id,label,onShow:el=>{ el.innerHTML='<section class="gf-card"><div class="loading">Loading the play-by-play…</div></section>';
      gfP.then(res=>{ if(!res){ el.innerHTML='<div class="loading">No play-by-play for this game.</div>'; return; } try{ draw(el.firstChild,res); }catch(e){ console.error(e); el.innerHTML='<div class="loading">Couldn’t draw this from the play-by-play.</div>'; } }); }});
    const tabs=GT.mount(document.getElementById('gmTabs'),[
      {id:'game',label:'Game',onShow:el=>{ el.innerHTML='<div id="gmBox"></div>'+dash;
        const bx=document.getElementById('gmBox'); boxDraw(bx,PM);
        ffP.then(ff=>{ const t=GT.efficiency({away:{players:byTeam[away]||[]},home:{players:byTeam[home]||[]}},{away:shortNm(away),home:shortNm(home)},ff), h=document.getElementById('gmEff');
          if(h) h.innerHTML=t?GT.panel('Efficiency',t,null,'gt-flush gt-eff'):''; });
        gfP.then(res=>{ const off=id=>{ const d=document.getElementById(id); if(d) d.remove(); };
          if(!res){ ['gmFlowP','gmShotsP','gmLineupsP'].forEach(off); return; }
          PM=pmFrom(res); if(PM) boxDraw(bx,PM);
          try{ TDC_GAMEFLOW.renderChart(document.getElementById('gmFlow'),res.G,res.R); }catch(e){ console.error(e); off('gmFlowP'); }
          try{ if(!TDC_GAMEFLOW.renderCourts(document.getElementById('gmShots'),res.G)) off('gmShotsP'); }catch(e){ console.error(e); off('gmShotsP'); }
          try{ if(!TDC_GAMEFLOW.renderLineups(document.getElementById('gmLineups'),res.G,res.R,3)) off('gmLineupsP'); }catch(e){ console.error(e); off('gmLineupsP'); }
          const nmT=t=>shortNm((res.G.T[t]&&res.G.T[t].name)||t), colT=t=>look((res.G.T[t]&&res.G.T[t].name)||t).color||'var(--text3)';
          const m=document.getElementById('gmMoments'); if(m) try{ m.innerHTML=GT.momentTiles(res.G,res.R,nmT,colT); }catch(e){ console.error(e); } }); }},
      {id:'why',label:'Why it went that way',html:'<div id="rcHost"><div class="loading">Reading the play-by-play…</div></div>'},
      gfTab('flow','Game flow',(el,r)=>TDC_GAMEFLOW.renderFlow(el,r.G,r.R)),
      gfTab('shots','Shot chart',(el,r)=>TDC_GAMEFLOW.renderShots(el,r.G,r.R)),
      gfTab('rotation','Rotation',(el,r)=>TDC_GAMEFLOW.renderRotation(el,r.G,r.R)),
      gfTab('onoff','On/Off',(el,r)=>TDC_GAMEONOFF.render(el.parentNode,r.G,r.R)),
    ]);
    gfP.then(res=>{ if(!res) ['flow','shots','rotation','onoff'].forEach(t=>tabs.drop(t)); });
    // our read of the game: where the edge came from, who beat his usual, the swing (tdc-recap.js; hides itself without PBP)
    if(window.TDC_RECAP) Promise.resolve(TDC_RECAP.mount(document.getElementById('rcHost'),gid,{season:g&&g.season_year})).then(R=>{ if(!R) tabs.drop('why'); });
    else tabs.drop('why');
  }catch(e){ if(afterLive) return; if(window.TDCLiveGame){ goLive(c); return; } c.innerHTML='<div class="err">Could not load box score. '+e.message+'</div>'; }
}
if(gid) load();
else document.getElementById('content').innerHTML='<div class="ui-empty"><b>No game picked.</b> Open a game from <a href="today.html">today\'s scoreboard</a> or any team\'s schedule.</div>';
</script>
  <script src="tdc-sheets.js?v=2"></script>
  <script src="tdc-version.js?v=2"></script>
  <script src="tdc-tour.js?v=32"></script>
<script src="tdc-panelize.js?v=24"></script>
<script>/* one anatomy for every stat section (tdc-panelize.js) */ if(window.TDCPanelize) TDCPanelize.watchPage();</script>
</body>
