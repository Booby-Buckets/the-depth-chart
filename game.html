  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#1a8c3a;--red:#cc2200;}
    [data-theme="dark"]{--bg:#141416;--bg2:#1D1D20;--border:#2E2E34;--border2:#45454D;--text:#F1EFEA;--text2:#B4B0A8;--text3:#807C74;--accent:#E6D5A8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;min-height:100vh;}
    a{color:inherit;}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;text-decoration:none;color:var(--text);}
    .nav-logo span{color:var(--accent);}
    .theme-toggle{background:none;border:1px solid var(--border2);color:var(--text3);font-size:14px;width:32px;height:32px;cursor:pointer;border-radius:6px;}
    .wrap{max-width:960px;margin:0 auto;padding:26px 22px 80px;}
    .back{font-size:12px;font-weight:600;color:var(--text3);text-decoration:none;text-transform:uppercase;letter-spacing:.05em;}
    .back:hover{color:var(--accent);}
    /* matchup header */
    .gh{margin:18px 0 8px;border-bottom:1px solid var(--border);padding-bottom:16px;}
    .gh-meta{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
    .gh-score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
    .gh-team{display:flex;align-items:baseline;gap:12px;}
    .gh-team .nm{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;letter-spacing:-.01em;}
    .gh-team .pts{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;}
    .gh-team.win .nm,.gh-team.win .pts{color:var(--text);}
    .gh-team.lose{opacity:.55;}
    .gh-at{color:var(--text3);font-size:13px;font-weight:700;}
    .gh-win-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:1px 5px;}
    .gh-rate{display:inline-block;font-size:13px;font-weight:800;color:#fff;border-radius:5px;padding:2px 8px;font-variant-numeric:tabular-nums;}
    .gh-team.lose .gh-rate{opacity:.9;}
    /* box tables — the site sheet (tdc-sheets.css); one table per team */
    .bs{margin-top:26px;}
    /* stat strip under the band — the same flat ribbon as the team header and the game preview */
    .gm-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);background:var(--bg);margin:12px 0 4px;}
    .gm-strip .t{padding:14px 18px 13px;border-right:1px solid var(--border);min-width:0;}
    .gm-strip .t:last-child{border-right:none;}
    .gm-strip .v{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
    .gm-strip .k{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:6px;white-space:nowrap;}
    .gm-strip .s{font-size:11px;color:var(--text3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    @media(max-width:760px){.gm-strip{grid-template-columns:repeat(3,minmax(0,1fr));}.gm-strip .t{border-bottom:1px solid var(--border);padding:9px 10px;}.gm-strip .v{font-size:18px;}.gm-strip .s{display:none;}}
    /* game flow / rotation: a plain Playfair section title like every other section (the condensed poster title and the
       repeated score above the chart came from the standalone crunch-time cards) */
    html body .gf-top{border-bottom:none;padding-bottom:0;margin-bottom:10px;align-items:baseline;}
    html body .gf-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;text-transform:none;letter-spacing:0;font-stretch:normal;line-height:1.2;}
    html body .gf-sc{display:none;}
    html body .gf-meta{font-size:10px;letter-spacing:.1em;}
    .bs-team{font-family:'Playfair Display',serif;font-weight:800;font-size:18px;margin-bottom:8px;}
    .sheet.bs-sheet tbody tr.totals td{border-top:2px solid var(--border2);}
    .sheet .potg-tag{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--text3);margin-left:6px;}
    .loading,.err{padding:50px;text-align:center;color:var(--text3);}
    /* Player of the Game: a flat bordered row like the team header's stat strip (owner, Oct 16 2026: match the other pages) */
    .potg-callout{display:flex;align-items:center;gap:14px;margin-top:10px;padding:12px 18px;border:1px solid var(--border);background:var(--bg);border-radius:0;}
    .potg-callout .crown{font-size:20px;}
    .potg-callout .lbl{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
    .potg-callout .nm{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;}
    .potg-callout .ln{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums;}
    .potg-callout a{text-decoration:none;color:inherit;}
    .potg-callout .potg-key{margin-left:auto;font-size:11.5px;color:var(--text3);text-align:right;}
    @media(max-width:640px){.potg-callout{flex-wrap:wrap;}.potg-callout .potg-key{margin-left:0;flex:1 0 100%;text-align:left;}}
    .gm-read{font-size:13.5px;color:var(--text2);line-height:1.5;margin:8px 0 0;} .gm-read b{color:var(--text);}
    .potg-callout a:hover .nm{color:var(--accent);}
    @media(max-width:620px){.wrap{padding:18px 12px 60px;}}

<script>
const SB='https://izlqhnxowdhtdofkwrho.supabase.co';
const KEY='sb_publishable_XQKr9A5ZP79pe0ac1RKYvA_-0dAx9Ye';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';try{localStorage.setItem('tdc_theme',d?'light':'dark');}catch(e){}}
(function(){try{var s=localStorage.getItem('tdc_theme');if(s){document.documentElement.setAttribute('data-theme',s);document.getElementById('themeBtn').textContent=s==='dark'?'☀️':'🌙';}}catch(e){}})();

const qs=new URLSearchParams(location.search);
const gid=qs.get('id');
const N=v=>v==null?0:v;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}};

// John Hollinger's Game Score — single-number box-score rating
function gameScore(p){
  return N(p.pts)+0.4*N(p.fgm)-0.7*N(p.fga)-0.4*(N(p.fta)-N(p.ftm))+0.7*N(p.oreb)+0.3*N(p.dreb)
    +N(p.stl)+0.7*N(p.ast)+0.7*N(p.blk)-0.4*N(p.pf)-N(p.tov);
}
// per-player 0-10 game rating — same scale as the player pages & tournament box scores
function playerRating(p){ return Math.max(2.0,Math.min(10.0,Math.round((5.0+0.135*gameScore(p))*10)/10)); }
function ratingColor(r){ return r==null?'var(--text3)':r>=8?'#1f9d57':r>=6.5?'#3d8f6b':r>=5.5?'#c2912f':'#cf5a4e'; }
function ratingWord(r){ return r==null?'':r>=8.5?'Dominant':r>=7.5?'Great':r>=6.5?'Strong':r>=5.5?'Solid':r>=4.5?'Shaky':'Poor'; }
// team game rating (0-10) vs SRS-implied expectation — same formula as the tournament view
function teamRatings(g,SRS){
  if(!g||g.home_score==null||g.away_score==null) return null;
  const hw=N(g.home_score)>N(g.away_score);              // winner from the score
  const winNm=hw?g.home:g.away, losNm=hw?g.away:g.home;
  const margin=Math.abs(N(g.home_score)-N(g.away_score));
  const sW=SRS[winNm], sL=SRS[losNm];
  if(sW==null||sL==null) return null;
  const res=margin-(sW-sL);
  const rate=perf=>Math.max(2.0,Math.min(10.0,Math.round((6.3+perf*0.22)*10)/10));
  return {home:hw?rate(res):rate(-res), away:hw?rate(-res):rate(res)};
}
function plink(p){ return `<a class="bs-name" href="player.html?espn=${p.espn_id}&name=${encodeURIComponent(p.player)}">${p.player}</a>`; }
function statline(p){
  const bits=[`${N(p.pts)} PTS`,`${N(p.reb)} REB`,`${N(p.ast)} AST`];
  if(N(p.stl)>=2) bits.push(`${N(p.stl)} STL`);
  if(N(p.blk)>=2) bits.push(`${N(p.blk)} BLK`);
  return bits.join(' · ');
}
// Box score = the site sheet (tdc-sheets.css): one line per player, frozen name column, plain
// numbers shaded c0-c4 within the team by tdcSheetHeat. FG/3PT/FT shade by their percentage.
// The totals row spans Player+Role in one cell, so its cell count differs and the shading skips it.
const pctV=(m,a)=>N(a)>0?(N(m)/N(a)*100).toFixed(1):'';
function row(p,tot,isPotg,rating){
  const fg=`${N(p.fgm)}-${N(p.fga)}`, tp=`${N(p.tpm)}-${N(p.tpa)}`, ft=`${N(p.ftm)}-${N(p.fta)}`;
  const s=tot?' class="strong"':'';
  const lead=tot?`<td class="l strong" colspan="2">Team</td>`
    :`<td class="l nm">${plink(p)}${isPotg?'<span class="potg-tag" title="Player of the Game">POTG</span>':''}</td><td class="l dim">${p.starter?'Starter':'Bench'}</td>`;
  const rtg=rating!=null?`<span title="0-10 game rating${tot?' (team)':''}">${rating.toFixed(1)}</span>`:'';
  return `<tr${tot?' class="totals"':''}>${lead}
    <td${s}>${rtg}</td>
    <td${s}>${tot?'':N(p.min)}</td>
    <td${s} data-v="${pctV(p.fgm,p.fga)}">${fg}</td><td${s} data-v="${pctV(p.tpm,p.tpa)}">${tp}</td><td${s} data-v="${pctV(p.ftm,p.fta)}">${ft}</td>
    <td${s}>${N(p.reb)}</td><td${s}>${N(p.ast)}</td>
    <td${s}>${N(p.stl)}</td><td${s}>${N(p.blk)}</td><td${s}>${N(p.tov)}</td><td${s}>${N(p.pf)}</td>
    <td class="big">${N(p.pts)}</td></tr>`;
}
// shared by the live view (tdc-livegame.js) so both box scores have the same columns
function boxHead(rtgTip){
  return `<thead><tr>
      <th class="l">Player</th><th class="l">Role</th><th data-heat="1" title="${rtgTip}">RTG</th><th>Min</th>
      <th data-heat="1" title="Field goals made-attempted, shaded by FG%">FG</th><th data-heat="1" title="Threes made-attempted, shaded by 3P%">3PT</th><th data-heat="1" title="Free throws made-attempted, shaded by FT%">FT</th>
      <th data-heat="1">Reb</th><th data-heat="1">Ast</th><th data-heat="1">Stl</th><th data-heat="1">Blk</th><th data-heat="-1">TO</th><th data-heat="-1">PF</th><th data-heat="1">Pts</th>
    </tr></thead>`;
}
function tableFor(team,players,potgId,teamRating){
  const sorted=[...players].sort((a,b)=> (b.starter?1:0)-(a.starter?1:0) || N(b.min)-N(a.min));
  const tot={}; ['min','fgm','fga','tpm','tpa','ftm','fta','reb','ast','stl','blk','tov','pf','pts'].forEach(k=>tot[k]=players.reduce((s,p)=>s+N(p[k]),0));
  return `<div class="bs">
    <div class="bs-team">${team}</div>
    <div class="sheet-wrap"><table class="sheet dense freeze bs-sheet">${boxHead('0-10 game rating, same scale as the player pages')}<tbody>
      ${sorted.map(p=>row(p,false,p.espn_id===potgId,N(p.min)>0?playerRating(p):null)).join('')}
      ${row(tot,true,false,teamRating!=null?teamRating:null)}
    </tbody></table></div></div>`;
}
function shadeBoxes(host){ if(window.tdcSheetHeat) (host||document).querySelectorAll('table.sheet').forEach(t=>tdcSheetHeat(t)); }

// Live mode (tdc-live.js + tdc-livegame.js): a game that isn't final, or isn't in our
// box_scores yet, is shown from ESPN's live summary and polled every 20s. ?live=1 forces it,
// ?livetest=1 feeds the recorded mid-game fixture (scripts/data/live-fixture-*.json).
let liveView=null;
function goLive(c){
  if(liveView||!window.TDCLiveGame||!window.TDC_LIVE){ if(!liveView) c.innerHTML='<div class="err">No box score available for this game.</div>'; return; }
  const forced=qs.has('livetest')||qs.get('live')==='1';
  liveView=TDCLiveGame.mount(c,gid,{onFinal:forced?null:()=>{ load(true); }});
}
async function load(afterLive){
  const c=document.getElementById('content');
  if(!gid){c.innerHTML='<div class="err">No game specified.</div>';return;}
  if(!afterLive && (qs.has('livetest')||qs.get('live')==='1')){ goLive(c); return; }
  try{
    const [gA,bA]=await Promise.all([
      fetch(`${SB}/rest/v1/games?id=eq.${gid}&select=*&limit=1`,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/box_scores?game_id=eq.${gid}&select=*`,{headers:H}).then(r=>r.json()),
    ]);
    const g=gA&&gA[0];
    const notFinal=g&&g.status&&g.status!=='STATUS_FINAL';
    if(!bA||!bA.length||notFinal){ if(!afterLive) goLive(c); return; }   // once final, the ESPN view stays until our box lands
    if(liveView){ liveView.stop(); liveView=null; }
    // group by team
    const byTeam={}; bA.forEach(p=>{(byTeam[p.team]=byTeam[p.team]||[]).push(p);});
    let home,away,hs,as_,date,loc;
    if(g){home=g.home;away=g.away;hs=g.home_score;as_=g.away_score;date=g.date;loc=g.neutral?'Neutral site':null;}
    else{ // fall back to box-score data
      const teams=Object.keys(byTeam); away=teams[0];home=teams[1]||teams[0];
      as_=byTeam[away].reduce((s,p)=>s+N(p.pts),0); hs=home?byTeam[home].reduce((s,p)=>s+N(p.pts),0):0;
      date=bA[0].date;
    }
    document.title=`${away} at ${home} — Box Score`;
    // season SRS map → team game ratings (0-10), same scale as the player scores
    let SRS={};
    if(g && g.season_year!=null){
      try{ const sr=await fetch(`${SB}/rest/v1/team_seasons?season_year=eq.${g.season_year}&srs=not.is.null&select=team,srs`,{headers:H}).then(r=>r.ok?r.json():[]);
        (sr||[]).forEach(x=>{ SRS[x.team]=parseFloat(x.srs); }); }catch(e){}
    }
    const tr=teamRatings(g,SRS);
    const ratePill=v=>v!=null?`<span class="gh-rate" style="background:${ratingColor(v)};" title="Team game rating (0-10): ${ratingWord(v)}">${v.toFixed(1)}</span>`:'';
    // team-colour scoreboard band (tdc-gamehead.js); the game rating pill rides under each name
    const shortNm=t=>{ try{ return (window.TDCTeamName&&TDCTeamName.short)?TDCTeamName.short(t):t; }catch(e){ return t; } };
    const bandSide=(t,pts,rate)=>{ const c=window.TDC_GAMEHEAD?TDC_GAMEHEAD.team(t):{};
      return { name:shortNm(t), href:'team.html?team='+encodeURIComponent(t), logo:c.logo, color:c.color,
        sub:rate!=null?'Game rating '+ratePill(rate)+' '+ratingWord(rate):'', pts:N(pts) }; };
    const header=`<h1 class="sr-only">${away} at ${home}</h1>`+(window.TDC_GAMEHEAD?TDC_GAMEHEAD.html({
        away:bandSide(away,as_,tr?tr.away:null), home:bandSide(home,hs,tr?tr.home:null), status:'Final',
        meta:`<span>${fmtD(date)}</span>${loc?`<span>${loc}</span>`:''}${g&&g.conf_game?'<span>Conference game</span>':''}` })
      :`<div class="gh-meta">${fmtD(date)}</div>`);
    // the read under the band: what was expected vs what happened. 2026-27 games use our pregame line (same as
    // the scrimmage page); any season gets the season power ratings the team game rating is measured against.
    let expM=null, expLbl='';   // expected margin (home − away) for the strip: our pregame line (2026-27) or season power
    const read=await (async()=>{
      const mg=N(hs)-N(as_), res=`<b>${esc(shortNm(mg>=0?home:away))} by ${Math.abs(mg)}</b>`;
      if(g&&g.season_year>=2027&&window.TDC_LIVE&&TDC_LIVE.pregame){ try{
        const l=await TDC_LIVE.pregame({id:String(gid),date:g.date,home:{name:home},away:{name:away},neutral:!!g.neutral});
        if(l&&l.margin!=null){ const d=mg-l.margin, fav=l.margin>=0?home:away; expM=l.margin; expLbl='Our line';
          return `Our line: <b>${esc(shortNm(fav))} −${Math.abs(l.margin).toFixed(1)}</b>${l.p!=null?` (${Math.round(100*Math.max(l.p,1-l.p))}% to win)`:''} · Result: ${res}, ${Math.abs(d).toFixed(1)} points ${(l.margin>=0?d:-d)>=0?'better':'worse'} than our line for the favorite.`; }
      }catch(e){} }
      const sH=SRS[home], sA=SRS[away]; if(sH==null||sA==null) return '';
      const exp=sH-sA, over=mg-exp; expM=exp; expLbl='Power ratings';
      return `Season power ratings had <b>${esc(shortNm(exp>=0?home:away))} by ${Math.abs(exp).toFixed(1)}</b> · Result: ${res}, so ${esc(shortNm(over>=0?home:away))} played ${Math.abs(over).toFixed(1)} points better than expected. That gap is each team's game rating (6.3 = exactly as expected).`;
    })();
    // player of the game = highest Game Score across both teams
    let potg=null,bestGs=-1e9;
    bA.forEach(p=>{const gs=gameScore(p); if(gs>bestGs){bestGs=gs;potg=p;}});
    const potgId=potg?potg.espn_id:null;
    const callout=potg?`<div class="potg-callout">
      <div><div class="lbl">Player of the Game</div>
        <a href="player.html?espn=${potg.espn_id}&name=${encodeURIComponent(potg.player)}"><span class="nm">${potg.player}</span></a>
        <span class="ln"> — ${statline(potg)} · ${potg.team}</span></div>
      <span class="potg-key" title="RTG is the box-score Game Score on a 0-10 scale">Player RTG: 5 ≈ an average game · 6.5 strong · 8+ great</span></div>`:'';
    // away team first, then home
    const order=[away,home].filter(t=>byTeam[t]);
    Object.keys(byTeam).forEach(t=>{ if(!order.includes(t)) order.push(t); });
    const trFor=t=>tr?(t===home?tr.home:t===away?tr.away:null):null;
    // the strip: margin · expected · total · pace · site
    const strip=(()=>{ const mg=N(hs)-N(as_), win=mg>=0?home:away;
      const tm=t=>(byTeam[t]||[]).reduce((a,p)=>{ a.fga+=N(p.fga); a.fta+=N(p.fta); a.tov+=N(p.tov); a.oreb+=N(p.oreb); return a; },{fga:0,fta:0,tov:0,oreb:0});
      const poss=t=>{ const x=tm(t); return x.fga+0.44*x.fta+x.tov-x.oreb; }, pa=poss(home), pb=poss(away), pace=(pa>0&&pb>0)?(pa+pb)/2:null;
      const cell=(v,k,sub)=>`<div class="t"><div class="v">${v}</div><div class="k">${k}</div><div class="s">${sub||'&nbsp;'}</div></div>`;
      const vsExp=expM!=null?mg-expM:null;
      return `<div class="gm-strip">`+
        cell(Math.abs(mg),'Margin',esc(shortNm(win))+' won')+
        cell(expM!=null?'−'+Math.abs(expM).toFixed(1):'—','Expected',expM!=null?esc(shortNm(expM>=0?home:away))+' · '+expLbl:'no pregame rating')+
        cell(vsExp!=null?Math.abs(vsExp).toFixed(1):'—','vs. expected',vsExp!=null?esc(shortNm(vsExp>=0?home:away))+' beat it':'&nbsp;')+
        cell(N(hs)+N(as_),'Total points',pace?(N(hs)+N(as_)>0?((N(hs)+N(as_))/pace/2*100).toFixed(0)+' per 100 poss.':''):'')+
        cell(pace?Math.round(pace):'—','Possessions',g&&g.neutral?'neutral site':esc(shortNm(home))+' home floor')+`</div>`; })();
    c.innerHTML=header+strip+(read?`<p class="gm-read">${read}</p>`:'')+callout+order.map(t=>tableFor(t,byTeam[t],potgId,trFor(t))).join('');
    shadeBoxes(c);
    // game flow + rotation (ESPN play-by-play; hides itself when ESPN has no PBP)
    if(window.TDC_GAMEFLOW){ const gf=document.createElement('div'); gf.id='gfHost'; c.appendChild(gf); TDC_GAMEFLOW.mount(gf,gid); }
  }catch(e){ if(afterLive) return; if(window.TDCLiveGame){ goLive(c); return; } c.innerHTML='<div class="err">Could not load box score. '+e.message+'</div>'; }
}
load();
</script>
