  <style>
    :root{--bg:#FAF9F6;--bg2:#F1EFEA;--bg3:#E6E3DB;--border:#DEDACF;--border2:#C6C0B2;--text:#1A1814;--text2:#4A463C;--text3:#8A867A;--accent:#A8843C;--green:#2e8b57;--red:#c75d5d;}
    [data-theme="dark"]{--bg:#0A0E18;--bg2:#111726;--bg3:#1A2133;--border:#232B3E;--border2:#34405A;--text:#EEF1F7;--text2:#AEB6C8;--text3:#7A849A;--accent:#E6D5A8;--green:#6fbf7e;--red:#e07a7a;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);}
    body{color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:500;min-height:100vh;}
    .page{padding:30px 0 60px;}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
    h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.02em;}
    .sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border2);flex-wrap:wrap;}
    .sec h2{font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:800;}
    .sec .n,.dim{color:var(--text3);font-size:12px;}
    .btn{font:700 13px 'Inter',system-ui,sans-serif;background:var(--accent);color:var(--bg);border:1px solid var(--accent);padding:8px 14px;border-radius:8px;cursor:pointer;}
    .btn.ghost{background:var(--bg2);color:var(--text);border-color:var(--border2);}
    .rv{font-size:11px;padding:0 4px;border-radius:4px;white-space:nowrap;} .rv.sched{background:var(--bg3);} .rv.great{background:hsla(125,60%,45%,.3);} .rv.good{background:hsla(125,60%,45%,.15);} .rv.meh{background:hsla(45,80%,50%,.2);} .rv.bad{background:hsla(0,70%,50%,.2);}
    .rv-act{white-space:normal!important;min-width:170px;} .rv-pick{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;} .rv-up{font-size:12.5px;margin:6px 0;}
    .cal-c .vis{position:absolute;right:4px;bottom:20px;font-size:13px;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
    .dy-tobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0;} .dy-run{font-size:12.5px;font-weight:800;} .dy-run.bad{color:var(--red,#cc2200);} .dy-run.good{color:var(--green,#1a8c3a);}
    .dy-feed .pl.tmo{background:color-mix(in srgb,var(--accent,#c9a227) 18%,transparent);font-weight:700;}
    .dy-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;} .dy-tags span{font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:0 5px;border-radius:4px;background:var(--bg3);color:var(--text2);white-space:nowrap;}
    input.dy-min.tired{border-color:var(--red,#cc2200)!important;background:color-mix(in srgb,var(--red,#cc2200) 12%,var(--bg));}
    /* program tab (js/dynasty/ui/program.js) */
    .pg-card{border:1px solid var(--border);border-radius:12px;background:var(--bg2);padding:14px 16px;margin:12px 0;}
    .pg-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px;} .pg-h h3{font-family:'Playfair Display',serif;font-size:19px;font-weight:800;margin:0;}
    .pg-n{font-size:12px;color:var(--text3);} .pg-d{font-size:11.5px;color:var(--text3);line-height:1.5;margin-top:3px;} .pg-warn{color:var(--red,#cc2200);font-weight:700;}
    .pg-tbl{width:100%;border-collapse:collapse;font-size:12.5px;} .pg-tbl th{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:6px 8px;border-bottom:1px solid var(--border2);text-align:right;}
    .pg-tbl td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top;} .pg-tbl .l{text-align:left;} .pg-tbl tr.on td{background:color-mix(in srgb,var(--accent,#c9a227) 12%,transparent);}
    .pg-tbl input[type=range]{width:140px;vertical-align:middle;} .pg-hv{display:inline-block;min-width:20px;text-align:right;}
    .pg-bar{display:inline-block;width:90px;height:7px;border-radius:4px;background:var(--bg3);vertical-align:middle;overflow:hidden;margin-right:4px;} .pg-bar i{display:block;height:100%;}
    .pg-sm{padding:4px 9px!important;font-size:11.5px!important;}
    .pg-focus{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 10px;font-size:13px;font-weight:700;} .pg-focus select{margin-left:6px;padding:5px 8px;border-radius:7px;border:1px solid var(--border2);background:var(--bg);color:var(--text);}
    .pg-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;} .pg-two h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:4px 0;}
    .pg-kv{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 8px;} .pg-kv span{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);} .pg-kv b{font-family:'Playfair Display',serif;font-size:22px;}
    .pg-pool summary{cursor:pointer;font-weight:700;font-size:13px;margin:8px 0;}
    .pg-diff{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px;} .pg-diff button{text-align:left;border:1px solid var(--border2);border-radius:10px;background:var(--bg2);color:var(--text);padding:10px 12px;cursor:pointer;font-family:Inter,sans-serif;}
    .pg-diff button b{display:block;font-size:14px;margin-bottom:3px;} .pg-diff button span{font-size:11.5px;color:var(--text3);line-height:1.4;} .pg-diff button.on{border-color:var(--accent,#c9a227);box-shadow:0 0 0 2px var(--accent,#c9a227) inset;}
    @media(max-width:760px){.pg-two{grid-template-columns:1fr;}.pg-diff{grid-template-columns:1fr 1fr;}.pg-tbl input[type=range]{width:90px;}}
    /* calendar (js/dynasty/ui/calendar.js) */
    .cal-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:6px 0 12px;}
    .cal-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .cal-date{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;font-style:italic;letter-spacing:.01em;line-height:1.1;}
    .cal-gd{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-top:3px;}
    .cal-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .cal-spd{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
    .cal-spd button{font:700 11.5px Inter,sans-serif;padding:6px 10px;background:var(--bg2);color:var(--text2);border:none;cursor:pointer;}
    .cal-spd button.on{background:var(--text);color:var(--bg);}
    .cal-chk{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;}
    .cal-tgt{font-size:12px;color:var(--text2);} .cal-tgt a{color:var(--text3);margin-left:4px;}
    .cal-nav{display:flex;align-items:center;gap:10px;margin:6px 0 8px;font-size:15px;}
    .cal-leg{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
    .cal-leg i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px;} .cal-leg i.away{background:#c0392b;} .cal-leg i.home{background:#2f6fd6;} .cal-leg i.neu{background:#8a8f99;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:#0f1218;padding:4px;border-radius:10px;}
    .cal-h{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9aa3b2;text-align:center;padding:4px 0;}
    .cal-c{position:relative;min-height:84px;border-radius:5px;background:#1b2029;color:#e8ebf0;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;}
    .cal-c:hover{transform:translateY(-1px);}
    .cal-c.out{background:transparent;cursor:default;} .cal-c.off{background:#151920;opacity:.55;}
    .cal-c .dt{position:absolute;left:6px;top:4px;font:800 10px Inter,sans-serif;letter-spacing:.06em;color:#cfd5df;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2;}
    .cal-c .pr{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:20px;opacity:.38;}
    .cal-c.game{background:linear-gradient(135deg,var(--oc) 0%,color-mix(in srgb,var(--oc) 55%,#000) 100%);}
    .cal-c.game img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;max-width:64px;max-height:52px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));}
    .cal-c.game .nm{position:absolute;left:6px;right:6px;top:40%;font:800 12px Inter,sans-serif;text-align:center;}
    .cal-c .site{position:absolute;right:5px;top:4px;font:800 9px Inter,sans-serif;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;z-index:2;}
    .cal-c.away .site{background:#c0392b;} .cal-c.home .site{background:#2f6fd6;} .cal-c.neu .site{background:#6b7280;}
    .cal-c .tag{position:absolute;left:5px;bottom:20px;font:800 8.5px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:3px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cal-c .res,.cal-c .ln{position:absolute;left:0;right:0;bottom:0;font:800 11px Inter,sans-serif;text-align:center;padding:2px 0;background:rgba(0,0,0,.55);}
    .cal-c .res.w{background:#1f8f47;} .cal-c .res.l{background:#b3261e;} .cal-c .ln{color:#d6dbe3;font-weight:700;}
    .cal-c.past:not(.game){opacity:.6;}
    .cal-c.cur{box-shadow:0 0 0 3px #f2c94c inset;}
    .cal-c.tbd{background:repeating-linear-gradient(45deg,#2a303b 0 8px,#232832 8px 16px);}
    .cal-tick{display:flex;align-items:center;gap:10px;background:#0f1218;color:#e8ebf0;border-radius:8px;padding:7px 10px;margin-top:8px;overflow:hidden;font-size:12px;}
    .cal-tick .lab{font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#f2c94c;white-space:nowrap;}
    .cal-tick .mv{display:flex;gap:18px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;} .cal-tick .it{white-space:nowrap;color:#b9c0cc;} .cal-tick .it b{font-weight:600;} .cal-tick .it b.w{color:#fff;font-weight:800;} .cal-tick .it.me{color:#f2c94c;}
    .cal-note{font-size:11.5px;color:var(--text3);margin-top:6px;}
    @media(max-width:640px){.cal-c{min-height:58px;}.cal-c .dt{font-size:8.5px;}.cal-c .tag{display:none;}.cal-c .res,.cal-c .ln{font-size:9.5px;}.cal-date{font-size:22px;}.cal-leg{display:none;}}
    .dy-cloud{display:inline-block;font-size:11.5px;font-weight:700;color:var(--text3);margin-right:10px;white-space:nowrap;text-decoration:none;}
    .dy-cloud.saved,.dy-cloud.idle{color:var(--green,#1a8c3a);} .dy-cloud.error{color:var(--red,#cc2200);} a.dy-cloud.off:hover{color:var(--text);text-decoration:underline;}
    .dy-where{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap;}
    .dy-where.both,.dy-where.acct{color:var(--green,#1a8c3a);border-color:currentColor;}
    .dy-acct{font-size:12.5px;color:var(--text3);margin:10px 0 4px;line-height:1.55;} .dy-acct a{color:var(--text);font-weight:700;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .dy-input{font:600 14px 'Inter',system-ui,sans-serif;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:9px 12px;border-radius:8px;width:100%;max-width:420px;}
    .dy-input.sm{width:auto;font-size:13px;padding:6px 10px;}
    .dy-empty{padding:26px;text-align:center;color:var(--text3);border:1px dashed var(--border2);border-radius:12px;font-size:13px;margin:10px 0;}
    .tm{white-space:nowrap;font-weight:700;} .tm img{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin:-2px 6px 0 0;}
    .tm.big{font-size:20px;} .tm.big img{width:28px;height:28px;}
    .sheet tr.me td{background:color-mix(in srgb,var(--accent) 14%,transparent)!important;}
    .sheet tr.go{cursor:pointer;} .sheet b.w{color:var(--green);} .sheet b.l{color:var(--red);}
    .dy-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:12px;}
    .dy-team{display:flex;align-items:center;gap:8px;text-align:left;font:600 13px 'Inter',system-ui,sans-serif;background:var(--bg2);border:1px solid var(--border2);border-left:4px solid var(--tc);color:var(--text);padding:9px 10px;border-radius:8px;cursor:pointer;}
    .dy-team:hover{border-color:var(--accent);} .dy-team img{width:24px;height:24px;object-fit:contain;}
    .dy-team .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .dy-team .cf,.dy-team .rk{font-size:11px;color:var(--text3);}
    .dy-band{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--border2);border-top:4px solid var(--tc);border-radius:12px;background:var(--bg2);}
    .dy-band>img{width:58px;height:58px;object-fit:contain;} .dy-id{flex:1;min-width:0;} .dy-meta{color:var(--text2);font-size:13px;margin-top:4px;}
    .dy-tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 4px;padding-bottom:2px;}
    .dy-tabs button{font:700 12.5px 'Inter',system-ui,sans-serif;background:none;border:1px solid var(--border2);color:var(--text2);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;}
    .dy-tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
    .dy-next{margin:18px 0 6px;padding:16px 18px;border:1px solid var(--border2);border-radius:12px;background:var(--bg2);}
    .dy-next .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
    .dy-next .mu{font-size:18px;font-weight:700;margin:8px 0 4px;} .dy-next .ln{color:var(--text2);font-size:13px;}
    .dy-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;}
    .dy-two{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;} .dy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
    .dy-roster input[type=number]{width:52px;font:600 13px 'Inter',sans-serif;background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:3px 5px;text-align:right;}
    .chip{display:inline-block;padding:0 5px;border:1px solid var(--red);color:var(--red);border-radius:4px;font-size:9.5px;font-weight:800;text-transform:uppercase;}
    .dy-slider{padding:14px 0;border-bottom:1px solid var(--border);max-width:640px;}
    .dy-slider .hd{display:flex;justify-content:space-between;font-size:15px;} .dy-slider .row{display:flex;align-items:center;gap:12px;margin:8px 0;} .dy-slider input{flex:1;accent-color:var(--accent);} .dy-slider .d{font-size:12.5px;color:var(--text3);}
    .dy-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;}
    .dy-watch{background:var(--bg);border:1px solid var(--border2);border-radius:14px;padding:16px;width:min(980px,100%);}
    .dy-sb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 6px 14px;border-bottom:1px solid var(--border2);}
    .dy-sb>div{display:flex;align-items:center;gap:12px;font-size:18px;} .dy-sb b{font-size:32px;font-variant-numeric:tabular-nums;font-weight:800;}
    .dy-sb .clk{flex-direction:column;gap:0;font-size:12px;color:var(--text3);font-weight:700;text-transform:uppercase;} .dy-sb .clk b{font-size:20px;color:var(--text);}
    .dy-speed{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text3);margin:10px 0;flex-wrap:wrap;}
    .dy-speed button{font:700 12px 'Inter',sans-serif;background:var(--bg2);border:1px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:999px;cursor:pointer;} .dy-speed button.on{background:var(--text);color:var(--bg);}
    .dy-feed{max-height:56vh;overflow:auto;border:1px solid var(--border);border-radius:10px;}
    .dy-feed .pl{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:13px;}
    .dy-feed .pl img{width:16px;height:16px;object-fit:contain;} .dy-feed .pl .t{color:var(--text3);font-size:11px;width:70px;flex:none;font-variant-numeric:tabular-nums;}
    .dy-feed .pl>span:nth-child(3){flex:1;} .dy-feed .pl .s{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text3);} .dy-feed .pl.sc{font-weight:700;} .dy-feed .pl.sc .s{color:var(--text);} .dy-feed .pl.sub{color:var(--text3);font-size:12px;}
    .dy-box{padding:6px 4px 12px;} .dy-final{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;} .dy-final b{font-size:26px;}
    .dy-br{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;} .dy-br .col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:200px;}
    .dy-br .rh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
    .bg{border:1px solid var(--border2);border-radius:8px;background:var(--bg2);font-size:12.5px;overflow:hidden;}
    .bg>div{display:flex;align-items:center;gap:6px;padding:4px 8px;} .bg>div+div{border-top:1px solid var(--border);} .bg>div b{margin-left:auto;font-variant-numeric:tabular-nums;}
    .bg .l{color:var(--text3);} .bg .w{font-weight:800;} .bg .sd{font-size:10.5px;color:var(--text3);width:16px;text-align:right;} .bg .tm.me{color:var(--accent);}
    .dy-ff{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:12px;} .dy-ff .bg{min-width:200px;}
    .dy-steps{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 4px;font-size:12px;font-weight:700;} .dy-steps span{padding:5px 10px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);}
    .dy-steps span.on{background:var(--text);color:var(--bg);border-color:var(--text);} .dy-steps span.done{color:var(--green);border-color:var(--green);}
    .sheet td .up{color:var(--green);font-size:11px;font-weight:800;} .sheet td .dn{color:var(--red);font-size:11px;font-weight:800;} .chip.new{border-color:var(--accent);color:var(--accent);}
    .sheet td.odds{font-weight:800;color:var(--accent);}
    .dy-row{display:flex;gap:8px;flex-wrap:wrap;} .dy-row .dy-input{flex:1 1 240px;}
    a.pl{color:inherit;text-decoration:none;cursor:pointer;} a.pl:hover{color:var(--accent);text-decoration:underline;}
    .sheet tr.hurt td{opacity:.6;} .sheet tr.hurt td:first-child{opacity:1;}
    .sec-m i{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--bg3);vertical-align:middle;margin:0 4px;position:relative;overflow:hidden;}
